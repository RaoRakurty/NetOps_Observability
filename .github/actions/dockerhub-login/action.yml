#
# Authenticated Docker Hub pulls for CI. Anonymous pulls share a per-IP rate
# limit across every GitHub-hosted runner, and an install-boot job that pulls
# ~20 public images fails on it ("toomanyrequests") with nothing wrong in the
# change. The repository secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (a
# read-only personal access token, owner 2026-11-19) lift that limit.
#
# Optional by design: a run that cannot see the secrets (a fork's pull
# request, Dependabot) logs a notice and pulls anonymously — it never fails
# here, so the gate is not made to depend on a credential.
name: Docker Hub login (optional)
description: Log in to Docker Hub when credentials are available; otherwise pull anonymously.
inputs:
  username:
    description: Docker Hub username (secrets.DOCKERHUB_USERNAME)
    required: false
    default: ""
  token:
    description: Docker Hub read-only access token (secrets.DOCKERHUB_TOKEN)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: ${{ inputs.username != '' && inputs.token != '' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
    - if: ${{ inputs.username == '' || inputs.token == '' }}
      shell: bash
      run: echo "::notice::Docker Hub credentials are not available to this run (fork or Dependabot) — pulling anonymously"
