name: correlation-ci

# CI gate for the Python correlation service (FastAPI, Python 3.10). Mirrors the
# backend gate's tiered approach:
#   - `test` is BLOCKING: the existing unit suite must pass.
#   - `lint` is BLOCKING: ruff/bandit/mypy (deterministic — see the pinned tool
#     versions in `env` below; "deterministic" only holds if they are pinned) and
#     pip-audit (dependency CVEs — the Python analog of the backend's blocking
#     govulncheck; SC-005). A new advisory in a pinned dep stops the merge.

on:
  push:
    paths:
      - 'NetOps_Observability/src/correlation/**'
      - '.github/workflows/correlation-ci.yml'
  # No paths filter on pull_request (see backend-ci.yml): required checks must
  # report on every PR. push stays path-filtered for fast branch feedback.
  pull_request:

permissions:
  contents: read

# Linter versions are PINNED, the same way backend-ci.yml pins STATICCHECK/
# GOSEC/GOVULNCHECK. `pip install ruff` unpinned meant a new ruff release could
# turn a green branch red without a line of our code changing — which is exactly
# what happened on 2026-07-25 (250 findings appeared between two commits that
# touched no Python). Bump these deliberately, in a commit that also fixes
# whatever the new rules find.
env:
  RUFF_VERSION: '0.16.0'  # deliberate bump (tracker #117): the 0.16 findings are fixed in-tree
  BANDIT_VERSION: '1.9.4'
  MYPY_VERSION: '2.3.0'
  PIP_AUDIT_VERSION: '2.10.1'
  # NOTE: ingest-contract-ci and telemetry-catalog-ci pin pytest==9.0.3. This is
  # 9.1.1 because that is what this workflow last ran GREEN with; aligning the
  # three is a deliberate bump, not a drive-by edit.
  PYTEST_VERSION: '9.1.1'

concurrency:
  group: correlation-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: NetOps_Observability/src/correlation

jobs:
  test:
    name: pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Must match the runtime (Dockerfile.correlation: python:3.12-slim) and
          # the pip-compile environment of the hash-locked requirements.txt — a
          # 3.10 runner needs exceptiongroup, which the 3.12 lock rightly omits,
          # and --require-hashes then refuses the unpinned transitive dep.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NetOps_Observability/src/correlation/requirements.txt
      - name: install deps + pytest
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is hash-locked (SC-011) → pip auto-enables
          # --require-hashes, so it must be installed alone; pytest installs after.
          pip install -r requirements.txt
          # Pinned for the same reason the linters are (see env): an unpinned
          # test-runner upgrade can turn a green branch red with no code change.
          pip install "pytest==${PYTEST_VERSION}"
      - name: pytest
        # The WHOLE suite: this is also the signature-catalog fixture gate
        # (#67 build ④ — every signature needs a passing positive fixture) and
        # the golden-replay gate (build ⑥). Single-file runs would silently
        # skip both.
        run: python -m pytest -v

  lint:
    name: ruff · bandit · mypy · pip-audit (blocking)
    runs-on: ubuntu-latest
    # All BLOCKING: the deterministic checks (ruff/bandit/mypy, verified clean
    # 2026-06-04) plus pip-audit (dependency CVEs — SC-005), the Python analog of
    # the backend's blocking govulncheck.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12 for the same reason as the test job above: pip-audit dry-run
          # installs the 3.12-compiled hash lock, which omits exceptiongroup.
          python-version: '3.12'
      - name: install linters
        run: |
          pip install \
            "ruff==${RUFF_VERSION}" \
            "bandit==${BANDIT_VERSION}" \
            "mypy==${MYPY_VERSION}" \
            "pip-audit==${PIP_AUDIT_VERSION}"
      - name: ruff (style + bugs)
        run: ruff check .
      - name: bandit (security; service code, not tests)
        run: bandit -r main.py -ll
      - name: mypy (type check)
        run: mypy main.py
      - name: pip-audit (dependency CVEs — blocking)
        # SC-005: blocking, the Python analog of the backend's blocking
        # govulncheck. A new advisory in a pinned dep stops the merge until the
        # dep is bumped — the same zero-trust bar we hold the Go tree to.
        run: pip-audit -r requirements.txt
