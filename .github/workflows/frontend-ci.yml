name: frontend-ci

# CI gate for the React/TypeScript dashboard. The project's `build` script is
# `tsc -b && vite build`, so a build IS the type-check + bundle gate — a type
# error or broken import fails it. Mirrors the other services' tiered approach:
#   - `build` is BLOCKING (validated green locally).
#   - `audit` is NON-blocking triage (npm dependency CVEs) — the frontend analog
#     of backend govulncheck / correlation pip-audit. Flip off continue-on-error
#     once the advisories are resolved.
#
# No eslint/test config exists in the project yet; this gate intentionally tracks
# the tooling that's actually present (tsc + vite) rather than inventing config.

on:
  push:
    paths:
      - 'NetOps_Observability/src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # No paths filter on pull_request (see backend-ci.yml): required checks must
  # report on every PR. push stays path-filtered for fast branch feedback.
  pull_request:
  # Reusable-workflow trigger (release gate). `release-gate.yml` — called by
  # publish-images.yml and release-bundle.yml — invokes this whole workflow on the
  # tag's commit. `workflow_call` carries NO paths filter, so a release runs EVERY
  # job here regardless of what the tag's diff touched: the `push` filter above
  # stays honest for fast branch feedback without ever weakening the tag gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the CALLER's workflow when this file runs as a reusable
  # workflow, so a gate run invoked by release-gate.yml can never share (and so
  # never cancel) a group with this workflow's own direct push/PR run.
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: NetOps_Observability/src/frontend

jobs:
  build:
    name: tsc -b && vite build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: NetOps_Observability/src/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build (type-check + bundle)
        run: npm run build

  audit:
    name: npm audit (blocking)
    runs-on: ubuntu-latest
    # BLOCKING: verified green on a real run (2026-06-04).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: NetOps_Observability/src/frontend/package-lock.json
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  e2e:
    name: Playwright E2E (blocking)
    runs-on: ubuntu-latest
    # Browser-level proof that the operator workflows actually work (gap-report #2):
    # drives the real SPA in headless Chromium against the Vite dev server with the
    # backend mocked at the network boundary — no 19-service stack needed. Playwright
    # is pinned (1.60.0) to the matching browser build; `install --with-deps` fetches
    # it in CI. Specs live in e2e/ (vitest ignores them; tsc -b excludes them too).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: NetOps_Observability/src/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: e2e (headless)
        run: npm run e2e

  metric-contract:
    name: panel↔metric contract (blocking)
    runs-on: ubuntu-latest
    # Foundation guard (Tier 1): every metric a dashboard panel queries must be
    # produced by a collector. Fails on a NEW orphan (a panel wired to a metric
    # nothing emits) — the silent-empty-panel regression. Known gaps are tracked
    # in the script's TRACKED_GAPS and do not fail; only untracked orphans do.
    # Stdlib-only Python, no deps. Reads both frontend PromQL and backend profiles.
    defaults:
      run:
        working-directory: NetOps_Observability
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: audit
        run: python3 scripts/audit_metric_contract.py
