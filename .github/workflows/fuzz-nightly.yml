name: fuzz-nightly

# Live fuzzing of the stdlib parsers (SPIFFE ID + federation bundles). Kept OUT
# of the per-PR gate (backend-ci): live `-fuzz` worker coordination flakes on
# busy 2-core PR runners ("context deadline exceeded"), and a 30s smoke finds
# little. Here it runs alone (no contention) for minutes, on a schedule, so a
# real crasher fails the run (and is uploaded), without blocking development.

on:
  schedule:
    - cron: '0 7 * * *'   # daily ~07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Single source of truth for this workflow's toolchain, same shape as
  # backend-ci.yml. It was hard-coded at the step until 2026-09-03, which is
  # how it silently missed a toolchain raise: `go-version` inline is invisible
  # to the grep that checks every workflow moved together.
  # MUST match NetOps_Observability/src/backend/go.mod's `toolchain` line —
  # guarded by tests/test_toolchain_pin.py.
  GO_VERSION: '1.26.8'

defaults:
  run:
    working-directory: NetOps_Observability/src/backend

jobs:
  fuzz:
    name: live fuzz parsers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./tlsconfig/
            target: FuzzParseSpiffeID
          - pkg: .
            target: FuzzParseFederationBundles
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: NetOps_Observability/src/backend/go.sum
      - name: fuzz ${{ matrix.target }}
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime 5m
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: NetOps_Observability/src/backend/**/testdata/fuzz/**
          if-no-files-found: ignore
