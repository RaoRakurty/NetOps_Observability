name: publish-images

# SC-006 (provenance + SBOM): on a version tag, build the four app images, push
# them to PRIVATE GHCR, and attach a verifiable SLSA build-provenance attestation
# plus a CycloneDX SBOM to each pushed digest.
#
# This does NOT change the deploy path: install.py / docker compose still BUILD
# images locally on the host (the offline-buildable ethos, CLAUDE.md). Publishing
# here is purely for provenance/SBOM/distribution. Triggered on `v*.*.*` tags
# (immutable releases) or manual dispatch — never per-push (4 image builds).
#
# Packages are private by default on first push; keep them private in GHCR
# settings (the correlation image carries readable Python source).
#
# IMAGE SIGNING (owner Decision 4, 2026-09-13; tracker 313). The SPLIT signing
# model: conventional release bundles are signed with GPG from
# `secrets.CORRELIX_DIST_SIGNING_KEY` (release-bundle.yml, RC1 governance
# directive Decision 3B), and **OCI images are signed with Cosign keyless**
# against this workflow's GitHub Actions OIDC identity — short-lived signing
# material, no permanent private key in GitHub Secrets. Four trust domains, one
# authority each: git tag -> a human; bundles -> the GPG distribution key; OCI
# images -> Cosign keyless (here); the enterprise licence -> a separate
# authority that is never in Actions at all. See docs/RELEASE_CHECKLIST.md
# §4.16.
#
# The order below is the whole point, and it is the order release-bundle.yml
# already uses for GPG: protected source sha -> build -> push BY DIGEST ONLY
# -> `cosign sign` the digest -> `cosign verify` pinned to this workflow's
# exact identity -> provenance attestation -> SBOM -> release-mode OCI
# source-compliance -> and only then apply the release TAGS. Until that last
# step the digest is in the registry but unreachable by `:{{version}}`,
# `:{{major}}.{{minor}}`, `:sha-…` or `:latest`, so nothing is RELEASED before
# its signature has been verified. A tag is never signed: a tag can be moved,
# a digest cannot.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # FAIL-CLOSED RELEASE GATE (owner decision 2026-09-04). Until this landed, a
  # `v*.*.*` tag pushed four images to GHCR with **no test job gating it**
  # (RELEASE_CHECKLIST §4.4). `release-gate.yml` runs the full blocking gate —
  # backend, frontend, correlation, supply-chain, ingest, telemetry catalogue and
  # fresh-install — against the tag's exact commit, with no `paths:` filters to
  # skip any of it. Every job below `needs:` it, so nothing reaches the registry
  # (or a release page) unless all of it is green. See release-gate.yml for why
  # this is a reusable-workflow call and not an API check-run poll.
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  publish:
    needs: gate
    runs-on: ubuntu-latest
    # Write scopes confined to THIS job; every other workflow stays contents:read.
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # OIDC — keyless cosign image signing + the attestation
      attestations: write # write provenance/SBOM attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: NetOps_Observability/deployment/docker/Dockerfile.backend
          - name: correlation
            dockerfile: NetOps_Observability/deployment/docker/Dockerfile.correlation
          - name: nginx
            dockerfile: NetOps_Observability/deployment/docker/Dockerfile.nginx
          - name: frontend
            dockerfile: NetOps_Observability/deployment/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Decision 9: build FROM THE TAG's commit. `github.sha` is the commit
          # the pushed ref points at — pinned explicitly, as release-bundle.yml
          # does, so no later change can turn this into a branch-HEAD checkout.
          ref: ${{ github.sha }}

      # The frontend image copies a prebuilt SPA bundle (src/frontend/dist),
      # which is gitignored — build it here, same as the host install does.
      - if: matrix.name == 'frontend'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NetOps_Observability/src/frontend/package-lock.json
      - if: matrix.name == 'frontend'
        working-directory: NetOps_Observability/src/frontend
        run: |
          npm ci
          npm run build

      - name: Compute (lowercase) image ref
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netops-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # ── the two new third-party actions, and why each is not optional ──────
      #
      # Both are pinned to full commit SHAs (Decision 10) and both come from
      # vendors this file already depends on (docker/*, and sigstore — whose
      # keyless infrastructure already backs the provenance attestation below).
      # They are installed BEFORE the build on purpose: a missing or broken
      # signing toolchain must fail the job while the registry is still untouched,
      # not after a digest has been pushed.
      #
      # `docker/setup-buildx-action` is load-bearing, not cosmetic. The default
      # `docker` buildx driver cannot export `type=image,push-by-digest=true`; the
      # `docker-container` driver this action sets up can. Pushing BY DIGEST ONLY
      # is what lets the release tags be withheld until the signature verifies —
      # without it the build step has to apply `:{{version}}` at push time, which
      # is exactly the "published before verified" window this change closes.
      #
      # v4.3.0 — the commit that release points at, verified 2026-09-13 against
      # https://api.github.com/repos/docker/setup-buildx-action/tags
      # (v4.3.0 -> 37fe631027851001ddb9b187196cc803df7f5f0e, the latest release,
      # published 2026-08-19) and .../releases/latest.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `sigstore/cosign-installer` is the only supported way to put a
      # checksum-verified cosign on the runner: the action verifies the downloaded
      # binary against a digest table baked into the action commit itself, so this
      # pin covers the TOOL as well as the action.
      #
      # v4.1.2 — the commit that release points at, verified 2026-09-13 against
      # https://api.github.com/repos/sigstore/cosign-installer/tags
      # (v4.1.2 -> 6f9f17788090df1f26f669e9d70d6ae9567deba6, the latest release,
      # published 2026-05-07), cross-checked against .../releases/latest and
      # .../git/ref/tags/v4.1.2. Same lookup method cla-check.yml documents.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Explicit, and equal to the version that action commit carries a
          # verified checksum for. Bumping cosign is then a reviewed two-line
          # change instead of a silent upgrade riding along with an action bump.
          cosign-release: v3.0.6

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # PUSH BY DIGEST ONLY. `push-by-digest=true` uploads the layers and the
      # manifest and returns the digest WITHOUT creating any tag, so between this
      # step and `Publish the release tags` at the end of the job the image exists
      # in GHCR and is reachable by nothing a customer would ever ask for.
      # `steps.meta.outputs.tags` is still computed above and is consumed, intact,
      # by that last step: the tag SET is unchanged, only WHEN it is applied.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: NetOps_Observability
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true

      # SIGN THE IMMUTABLE DIGEST, never a tag. A tag can be re-pointed at another
      # manifest after the fact, which would leave a perfectly valid signature
      # attached to an image nobody reviewed. Keyless: the signing material is the
      # OIDC token this job already holds (`id-token: write`), exchanged for a
      # short-lived Fulcio certificate bound to this workflow's identity. No
      # secret is read, written or echoed here — there is no key to leak.
      - name: Sign the image digest (Cosign keyless, OIDC)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Not decoration: if build-push-action ever returns an empty digest,
          # `$IMAGE` degrades to a bare repository name and cosign would sign
          # `:latest`. A signature over a mutable reference is worse than none.
          case "$IMAGE" in
            *"@sha256:"*) ;;
            *) echo "BLOCKED: refusing to sign a mutable reference: $IMAGE" >&2
               echo "  the build step reported no image digest to sign." >&2
               exit 1 ;;
          esac
          cosign sign --yes "$IMAGE"
          echo "signed $IMAGE"

      # THE GATE. Verification is its own step and it runs BEFORE the provenance
      # attestation and BEFORE any release tag exists — the same shape
      # release-bundle.yml uses for `gpg --verify` (Decision 3B).
      #
      # The identity is pinned to THIS workflow in THIS repository at the ref that
      # triggered the run. `github.workflow_ref` is
      # `<owner>/<repo>/.github/workflows/publish-images.yml@refs/tags/vX.Y.Z`,
      # which is exactly the certificate subject Fulcio issues for this job, so
      # `${{ github.server_url }}/${{ github.workflow_ref }}` is an exact identity
      # and needs no pattern matching at all. Deliberately NOT
      # `--certificate-identity-regexp`: a permissive pattern accepts a signature
      # minted by some other workflow, or some other repository, that happens to
      # match — which is the one thing keyless signing exists to exclude.
      #
      # The `case` guard is load-bearing too. If a later change moves this job into
      # a reusable workflow, or a context value comes back empty, the constructed
      # identity stops naming this repository and this file; a wrong identity that
      # still LOOKS like a URL must fail loudly rather than be handed to cosign.
      - name: Verify the image signature (identity-pinned, fail closed)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          EXPECTED_PREFIX="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@"
          case "$IDENTITY" in
            "${EXPECTED_PREFIX}"*) ;;
            *) echo "BLOCKED: the signing identity does not name this workflow in this repository" >&2
               echo "  expected prefix: ${EXPECTED_PREFIX}" >&2
               echo "  got:             ${IDENTITY}" >&2
               exit 1 ;;
          esac
          cosign verify \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-identity "$IDENTITY" \
            "$IMAGE"
          echo "signature verified for $IMAGE"
          echo "  oidc issuer: $OIDC_ISSUER"
          echo "  identity:    $IDENTITY"

      # SLSA build provenance, attached to the image digest and verifiable with
      # `gh attestation verify oci://<image>@<digest>`.
      #
      # It runs AFTER the signature verified (owner Decision 4). Provenance
      # describes HOW a digest was built; the signature proves WHO stands behind
      # it. Attesting a digest whose signature has not been checked asserts
      # authorship of something unverified, and — since `push-to-registry: true`
      # writes to the registry — publishes that assertion.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.img.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The attestation's own OUTPUTS, checked rather than assumed. A step that
      # reports success while producing no bundle would leave the release claiming
      # a provenance it does not have — the same class of silent gap tracker 313
      # was filed for. Asserts the statement is SLSA provenance over THIS digest
      # and that it identifies the repository, the workflow file, the triggering
      # commit and the build event.
      - name: Confirm the provenance attestation
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_PATH: .github/workflows/publish-images.yml
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE:-}" ] || [ ! -s "$BUNDLE" ]; then
            echo "BLOCKED: attest-build-provenance reported no attestation bundle" >&2
            echo "  a release must not claim a provenance that was never produced." >&2
            exit 1
          fi
          echo "attestation: ${ATTESTATION_URL:-<none reported>}"
          python3 - <<'PROVCHECK'
          import base64, json, os, sys

          want = os.environ["EXPECTED_DIGEST"].split(":", 1)[-1]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          event = os.environ["GITHUB_EVENT_NAME"]
          workflow = os.environ["WORKFLOW_PATH"]

          with open(os.environ["BUNDLE"], encoding="utf-8") as fh:
              # One sigstore bundle per line (jsonl), or a single JSON object.
              lines = [ln for ln in fh.read().splitlines() if ln.strip()]
          if not lines:
              sys.exit("BLOCKED: the attestation bundle is empty")

          problems = []
          for n, line in enumerate(lines, 1):
              bundle = json.loads(line)
              envelope = bundle.get("dsseEnvelope") or bundle.get("dsse_envelope") or {}
              payload = envelope.get("payload")
              if not payload:
                  problems.append(f"bundle {n}: carries no DSSE payload")
                  continue
              stmt = json.loads(base64.b64decode(payload))
              ptype = stmt.get("predicateType", "")
              if not ptype.startswith("https://slsa.dev/provenance/"):
                  problems.append(f"bundle {n}: predicateType {ptype!r} is not SLSA provenance")
              digests = {d for s in (stmt.get("subject") or [])
                         for d in (s.get("digest") or {}).values()}
              if want not in digests:
                  problems.append(f"bundle {n}: subject digests {sorted(digests)} do not "
                                  f"include the published image digest {want}")
              blob = json.dumps(stmt)
              for label, needle in (("repository", repo), ("commit sha", sha),
                                    ("workflow path", workflow), ("build event", event)):
                  if needle not in blob:
                      problems.append(f"bundle {n}: does not identify the {label} ({needle})")
          if problems:
              sys.exit("BLOCKED: the provenance attestation is not what this release claims:\n  "
                       + "\n  ".join(problems))
          print(f"provenance confirmed over {len(lines)} attestation(s): digest, repository, "
                f"workflow, commit and build event all recorded")
          PROVCHECK

      # CycloneDX SBOM of the actual pushed image (uses the docker login creds).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: sbom-${{ matrix.name }}

      # THE OCI SOURCE-COMPLIANCE GATE (tracker 238, owner decision 2026-09-05).
      #
      # Until this landed the SBOM above was generated, attested and then read by
      # nobody. That is how BusyBox — GPL-2.0-only, inherited from the Alpine base
      # of the frontend and nginx images, named in no Dockerfile of ours — could
      # be inside every published image while the licence inventory, which models
      # what we DECLARE, could not see it.
      #
      # The rule is general: IF CORRELIX SHIPS THE BINARY, CORRELIX RETAINS THE
      # SOURCE, however the binary got into the image. Upstream availability is
      # provenance, not compliance. `--release` therefore fails on a required
      # source that is missing, on one whose checksum does not match, and on a
      # merely RECORDED posture — a recorded posture keeps daily builds honest
      # about a known gap, and must never let a customer artifact out the door.
      #
      # FAIL CLOSED. This step runs against the digest actually pushed, and a
      # scanner failure, an unparsable SBOM or an SBOM with zero components is an
      # error, never "zero affected packages". See
      # docs/compliance/OCI_SOURCE_COMPLIANCE.md.
      - name: Resolve the runtime base image's layers
        id: base
        run: |
          set -euo pipefail
          # The LAST FROM is the runtime stage; earlier ones are build stages
          # whose contents never reach the published image.
          BASE="$(grep -E '^FROM ' '${{ matrix.dockerfile }}' | tail -1 | awk '{print $2}')"
          echo "base=$BASE"
          if [ "$BASE" = "scratch" ]; then
            # Nothing is inherited, so there is no base layer set to resolve.
            # Reported as such rather than faked: origin will read `unknown`.
            echo "layers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker pull -q "$BASE"
          docker image inspect "$BASE" \
            --format '{{range .RootFS.Layers}}{{println .}}{{end}}' \
            | sed '/^$/d' > "$RUNNER_TEMP/base-layers-${{ matrix.name }}.txt"
          test -s "$RUNNER_TEMP/base-layers-${{ matrix.name }}.txt"
          echo "layers=$RUNNER_TEMP/base-layers-${{ matrix.name }}.txt" >> "$GITHUB_OUTPUT"

      # THE CORRELIX-CONTROLLED ARCHIVE (tracker 262). Read-only credentials,
      # short-lived, from GitHub's OIDC token — there is no static AWS key in
      # this repository. The step is a no-op until the company AWS account
      # exists and the repository variables are set, so today's releases behave
      # exactly as they did: retained copies first, pinned upstream after.
      #
      # `vars.*` are Actions VARIABLES, not secrets: a bucket name and a role
      # ARN are useless without the trust relationship, which is scoped to this
      # repository and the `release` environment.
      - name: Assume the archive read role (OIDC, short-lived)
        if: ${{ vars.AWS_SOURCE_ARCHIVE_READ_ROLE != '' }}
        env:
          ROLE_ARN: ${{ vars.AWS_SOURCE_ARCHIVE_READ_ROLE }}
          AWS_REGION: ${{ vars.AWS_SOURCE_ARCHIVE_REGION }}
        run: |
          set -euo pipefail
          token="$(curl -fsS --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          [ -n "$token" ] || { echo "FATAL: GitHub returned no OIDC token" >&2; exit 1; }
          echo "::add-mask::$token"
          resp="$(curl -fsS --max-time 30 -H 'Accept: application/json' \
            --data-urlencode "Action=AssumeRoleWithWebIdentity" \
            --data-urlencode "Version=2011-06-15" \
            --data-urlencode "RoleArn=${ROLE_ARN}" \
            --data-urlencode "RoleSessionName=correlix-release-${GITHUB_RUN_ID}" \
            --data-urlencode "DurationSeconds=3600" \
            --data-urlencode "WebIdentityToken=${token}" \
            "https://sts.${AWS_REGION}.amazonaws.com/")" \
            || { echo "FATAL: STS refused the OIDC token; check the read role's trust policy." >&2; exit 1; }
          python3 - "$resp" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          creds = (json.loads(sys.argv[1])["AssumeRoleWithWebIdentityResponse"]
                   ["AssumeRoleWithWebIdentityResult"]["Credentials"])
          for gh, aws in (("AWS_ACCESS_KEY_ID", "AccessKeyId"),
                          ("AWS_SECRET_ACCESS_KEY", "SecretAccessKey"),
                          ("AWS_SESSION_TOKEN", "SessionToken")):
              print(f"::add-mask::{creds[aws]}", file=sys.stderr)
              print(f"{gh}={creds[aws]}")
          PY
          echo "read-only archive credentials assumed (expire in 1h)"

      # The retained corresponding source, produced by the same mechanism that
      # ships it in every release bundle. `--release` verifies the BYTES, so the
      # artifacts have to exist here, not merely be pinned.
      - name: Materialise the retained corresponding source
        working-directory: NetOps_Observability
        # RETAINED COPIES FIRST, exactly as supply-chain.yml does it. Everything
        # in compliance/corresponding-sources/ is taken from the repository and
        # re-checksummed against the pin table (local provenance is not trusted
        # provenance); only what is not retained there is fetched from upstream.
        # This is not an optimisation: eleven of the pinned artifacts are Alpine
        # aports archives from gitlab.alpinelinux.org, which answers
        # GitHub-hosted runners with HTTP 418 — a release must not depend on
        # upstream reachability to prove it ships the source it says it does.
        env:
          CORRELIX_SOURCE_MIRROR_DIR: ${{ github.workspace }}/NetOps_Observability/compliance/corresponding-sources
          # Tracker 262. With the archive configured this becomes ARCHIVE-ONLY:
          # anything not retained in git is read from the Correlix-controlled S3
          # store and a miss FAILS the release — no upstream fallback. Empty
          # until the account exists, which keeps today's behaviour.
          CORRELIX_SOURCE_RELEASE_MODE: ${{ vars.AWS_SOURCE_ARCHIVE_BUCKET != '' && '1' || '0' }}
          CORRELIX_SOURCE_ARCHIVE_BUCKET: ${{ vars.AWS_SOURCE_ARCHIVE_BUCKET }}
          CORRELIX_SOURCE_ARCHIVE_REGION: ${{ vars.AWS_SOURCE_ARCHIVE_REGION }}
        run: |
          set -euo pipefail
          bash scripts/make-installer.sh --source-offer-only

      - name: OCI source-compliance gate (release mode, blocking)
        working-directory: NetOps_Observability
        run: |
          set -euo pipefail
          OFFER="$(ls -d dist/correlix-*/source-offer | head -1)"
          test -d "$OFFER"
          # An array, not a word-split string: a base-layer path with a space in
          # it must not silently become two arguments and mark every component
          # `unknown`.
          base_args=()
          if [ -n "${{ steps.base.outputs.layers }}" ]; then
            base_args=(--base-layers "${{ steps.base.outputs.layers }}")
          fi
          # Tracker 262: once the archive exists, corresponding source that
          # verifies against its pin but lives ONLY at an upstream URL also
          # fails the release. Provenance is not retention.
          archive_args=()
          if [ -n "${{ vars.AWS_SOURCE_ARCHIVE_BUCKET }}" ]; then
            archive_args=(--require-archive)
          fi
          python3 scripts/oci-compliance.py \
            --sbom "$GITHUB_WORKSPACE/sbom-${{ matrix.name }}.cdx.json" \
            --image "${{ steps.img.outputs.ref }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --source-dir "$OFFER" \
            --manifest "$GITHUB_WORKSPACE/compliance-${{ matrix.name }}.json" \
            --release "${base_args[@]}" "${archive_args[@]}"

      # THE RELEASE MOMENT, and the reason for everything above it. Up to here the
      # digest sits in GHCR reachable by no release reference; this step is what
      # makes `:{{version}}`, `:{{major}}.{{minor}}` and `:sha-…` resolve to it —
      # and it runs only after the signature verified, the provenance attestation
      # was checked, and the OCI source-compliance gate passed in release mode.
      #
      # `imagetools create` retags by copying the manifest inside the registry: no
      # rebuild, so the digest — and with it the signature and the attestation —
      # still applies. `--prefer-index=false` is load-bearing: by default a source
      # that is a single-platform manifest is wrapped in a NEW manifest list, which
      # would give the tag a different digest from the one that was signed
      # (docker/buildx#2481); with the flag, a plain manifest stays a plain manifest
      # and a source that is already an index (buildx attaches its own provenance
      # attestation manifest on some driver/version combinations) is carbon-copied.
      # Either way the per-tag assertion below is what turns a changed digest into a
      # failure instead of a quietly unsigned tag.
      #
      # If this step fails, the release fails with an untagged digest left in the
      # registry. That is the intended direction: an unreferenced manifest nobody
      # can pull by name is recoverable; a release tag pointing at an unverified
      # image is not.
      - name: Publish the release tags (only after verification)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t WANTED < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#WANTED[@]}" -eq 0 ]; then
            echo "BLOCKED: docker/metadata-action produced no tags to publish" >&2
            echo "  a signed digest nobody can reference is not a release." >&2
            exit 1
          fi
          tag_args=()
          for t in "${WANTED[@]}"; do tag_args+=(--tag "$t"); done
          docker buildx imagetools create --prefer-index=false "${tag_args[@]}" "$IMAGE"
          for t in "${WANTED[@]}"; do
            got="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            if [ "$got" != "$EXPECTED_DIGEST" ]; then
              echo "BLOCKED: $t resolves to $got, not the signed digest $EXPECTED_DIGEST" >&2
              echo "  the retag changed the manifest; the signature does not cover this tag." >&2
              exit 1
            fi
            echo "published $t -> $EXPECTED_DIGEST (signed, attested, compliance-checked)"
          done

      - name: Upload the compliance manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-compliance-${{ matrix.name }}
          path: compliance-${{ matrix.name }}.json
          if-no-files-found: warn
