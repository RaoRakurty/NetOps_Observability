name: telemetry-catalog-ci

# CI gate for the Telemetry Catalog (telemetry-catalog/). All BLOCKING:
#   - catalog invariants (fidelity ladder, owner-transport collisions, fixtures
#     exist, os_version present, issue_ref on degraded/failed)
#   - conformance harness: replay captured gNMI fixtures through the code-owned
#     normalization engine and assert the canonical contract
#   - pytest: the above plus explicit canonical anchors
# This is the regression guard that keeps "validated fidelity = product truth"
# honest — a normalization change that breaks a validated family fails the merge.

on:
  push:
    paths:
      - 'NetOps_Observability/telemetry-catalog/**'
      - '.github/workflows/telemetry-catalog-ci.yml'
  pull_request:
  # Reusable-workflow trigger (release gate). `release-gate.yml` — called by
  # publish-images.yml and release-bundle.yml — invokes this whole workflow on the
  # tag's commit. `workflow_call` carries NO paths filter, so a release runs EVERY
  # job here regardless of what the tag's diff touched: the `push` filter above
  # stays honest for fast branch feedback without ever weakening the tag gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the CALLER's workflow when this file runs as a reusable
  # workflow, so a gate run invoked by release-gate.yml can never share (and so
  # never cancel) a group with this workflow's own direct push/PR run.
  group: telemetry-catalog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: NetOps_Observability/telemetry-catalog

jobs:
  catalog:
    name: invariants · conformance · pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: install deps
        # test_config_change_rules.py probes the correlation engine's catalog
        # (src/correlation/catalog.py imports pydantic), so the engine's
        # hash-locked requirements are installed too — the same set
        # correlation-ci installs, never a hand-picked subset that can drift.
        run: |
          pip install pyyaml==6.0.3 pytest==9.0.3
          pip install --require-hashes -r ../src/correlation/requirements.txt
      - name: catalog invariants
        run: python3 catalog.py
      - name: conformance harness (fixture replay)
        run: python3 conformance.py
      - name: pytest
        run: python3 -m pytest -q
