# gitleaks config (SC-007). Keep ALL default rules; allowlist only the obvious
# non-secrets so the blocking history scan doesn't trip on test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and the public dev fallback secret — not real credentials"
regexTarget = "match"
regexes = [
  # Dummy credential convention used in *_test.go (e.g. auth-secret-123,
  # priv-secret-456) — fabricated values, never real keys.
  '''(auth|priv)-secret-\d+''',
  # The publicly-known dev signing fallback (SR-017) — intentionally in source.
  '''dev-only-do-not-use-in-production''',
  # RFC 6238 published TOTP test seed (base32 of "12345678901234567890"), used in
  # totp_test.go to pin our implementation against the spec — not a real secret.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  # RFC 6455 §1.3 published WebSocket handshake sample nonce ("the sample nonce"),
  # used verbatim in device_ssh_ticket_test.go / auth_flow_test.go to build a valid
  # WS upgrade request — a spec constant, not a credential.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # Fabricated HMAC key constant in tests/test_backup_ship.py (SIGN_KEY) used to
  # sign/verify backup artifacts in the round-trip tests — not a real credential.
  '''test-sign-key-[0-9]+''',
  # The env-var NAME in a vault WARN log message (secrets.go), flagged by the
  # generic-api-key heuristic because it follows the word "secrets" — a log
  # string / flag name, never a secret value.
  '''VAULT_MIGRATE_LEGACY_WRAPPED''',
]
