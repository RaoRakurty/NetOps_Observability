# Trivy ignore file (SC-001). Scoped, justified exceptions only — the check stays
# active everywhere else.
misconfigurations:
  # DS-0002 "Specify a USER" — intentionally NOT applied to the swtpm sealing
  # sidecar. swtpm is a DORMANT (SEAL_PROVIDER=swtpm only) software-TPM that
  # manages a bind-mounted TPM state directory (../../data/swtpm:/tpmstate) and a
  # Unix control socket; pinning it to a fixed non-root uid against an operator-
  # provided bind mount creates a state-ownership failure mode for a component
  # that, when active, custodies the root sealing key. It stays root-managed by
  # design. All other Dockerfiles run non-root (SC-008) and remain enforced.
  - id: DS-0002
    paths:
      - "NetOps_Observability/deployment/docker/swtpm-sidecar/Dockerfile"
  # DS-0002 — also excepted for the LAB traffic generator (tgen). It is a lab
  # tool deployed on the lab host (not part of the product stack) whose
  # raw-packet mode crafts packets on raw sockets — root/CAP_NET_RAW by
  # design. Pinning a non-root user would break the deployed generator for a
  # scanner checkbox on a non-shipped image.
  - id: DS-0002
    paths:
      - "NetOps_Observability/scripts/lab/traffic-generator/Dockerfile"
  # DS-0002 — TEMPORARY exception for the cloud-ingest poller (lab-site service,
  # not a product default). It currently runs root because it writes the live
  # inventory into host bind-mounts (./cloud-fixtures, ./cloud-logs) and reads
  # AWS creds from a /root/.aws mount; it exposes NO listening ports (outbound
  # poller only). Unlike the two exceptions above, root is NOT intrinsic here —
  # proper de-rooting (non-root UID + creds-path/volume-ownership change) is
  # tracked to Task #15, which replaces the env-cred model with Vault-scoped
  # tenant connectors. Remove this entry when that lands.
  - id: DS-0002
    paths:
      - "NetOps_Observability/deployment/docker/cloud-ingest/Dockerfile"
vulnerabilities:
  # GHSA-5c6j-r48x-rmvq — serialize-javascript RCE via RegExp.flags/toISOString.
  # Transitive dev-dependency of the DOCS PORTAL's Docusaurus/webpack build chain
  # (copy-webpack-plugin / css-minimizer-webpack-plugin). It runs only at docs
  # BUILD time on our own trusted markdown — never in the product runtime or on
  # user input. The fixed major (v7) requires Node ≥20 and breaks the Docusaurus
  # chain on the supported Node 18 toolchain; revisit when the docs toolchain
  # moves to Node 20+.
  - id: GHSA-5c6j-r48x-rmvq
    paths:
      - "NetOps_Observability/docs-portal/package-lock.json"
