# Trivy ignore file (SC-001). Scoped, justified exceptions only — the check stays
# active everywhere else.
misconfigurations:
  # DS-0002 "Specify a USER" — intentionally NOT applied to the swtpm sealing
  # sidecar. swtpm is a DORMANT (SEAL_PROVIDER=swtpm only) software-TPM that
  # manages a bind-mounted TPM state directory (../../data/swtpm:/tpmstate) and a
  # Unix control socket; pinning it to a fixed non-root uid against an operator-
  # provided bind mount creates a state-ownership failure mode for a component
  # that, when active, custodies the root sealing key. It stays root-managed by
  # design. All other Dockerfiles run non-root (SC-008) and remain enforced.
  - id: DS-0002
    paths:
      - "NetOps_Observability/deployment/docker/swtpm-sidecar/Dockerfile"
  # DS-0002 — also excepted for the DERIVED vector-router image (F-7: stock
  # timberio/vector + curl for the sealed-fields secret backend). It inherits
  # the stock image's runtime user (root) — the vector-AGGREGATOR runs the
  # same stock image identically, and pinning only the derived router to a
  # non-root uid would silently diverge the two tiers' file-permission
  # behavior across the enrichment/SVID/processor bind mounts (key modes are
  # calibrated to today's uid). Converting the vector tier to non-root is a
  # real change tracked for review, not a scanner checkbox (added
  # 2026-08-12 when supply-chain first ran against the F-7 image).
  - id: DS-0002
    paths:
      - "NetOps_Observability/deployment/docker/vector-router/Dockerfile"
  # DS-0002 — also excepted for the LAB traffic generator (tgen). It is a lab
  # tool deployed on the lab host (not part of the product stack) whose
  # raw-packet mode crafts packets on raw sockets — root/CAP_NET_RAW by
  # design. Pinning a non-root user would break the deployed generator for a
  # scanner checkbox on a non-shipped image.
  - id: DS-0002
    paths:
      - "NetOps_Observability/scripts/lab/traffic-generator/Dockerfile"
  # DS-0002 — also excepted for the LAB twin agent image (tracker 152 fidelity
  # wave). PID 1 must START as root in its own netns: it adds per-device IP
  # aliases (`ip addr add`, CAP_NET_ADMIN) and binds :161 for the snmpsim
  # responders, which then IMMEDIATELY drop to the image's dedicated `twin`
  # user via snmpsim's --process-user (snmpsim REFUSES to keep running as
  # root). A Dockerfile USER would break the alias/bind phase; the drop
  # already happens where it matters. Lab overlay only — never part of the
  # product stack (added 2026-08-17).
  - id: DS-0002
    paths:
      - "NetOps_Observability/scripts/lab/twin/docker/Dockerfile"
# vulnerabilities: (none)
#
# GHSA-5c6j-r48x-rmvq — serialize-javascript RCE — was excepted here from
# 2026-08 until 2026-09-06 on the grounds that "the fixed major (v7) requires
# Node ≥20 and breaks the Docusaurus chain on the supported Node 18 toolchain".
# That premise expired: the docs portal builds on Node 20 in CI and Node 22 on
# the lab host, so tracker 123 pinned `serialize-javascript` to 7.1.1 through a
# package.json `overrides` entry and the portal builds clean. The advisory is
# FIXED, not deferred, so the exception is deleted rather than re-justified — an
# ignore that outlives its reason silently suppresses a real finding the day the
# dependency regresses. The residue that could NOT be fixed is written up in
# docs/security/DOCS_PORTAL_ADVISORY_TRIAGE_2026-09-06.md; none of it is
# Trivy-visible under `ignore-unfixed: true` (no fix exists upstream), so none of
# it belongs here either.
