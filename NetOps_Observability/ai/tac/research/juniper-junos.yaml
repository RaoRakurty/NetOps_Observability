# TAC escalation research — Juniper Junos OS
# Design of record: docs/design/TAC_ESCALATION_2026-09-05.md
# Schema: as specified in the research brief (no ai/tac/README.md existed at time of writing).
# Sourcing rule: every command below appears verbatim on a cited public juniper.net page.
# Read-only only: no clear / restart / request system / configure / monitor traffic / traceoptions.
# `request support information` and `show log messages` are read-only and are included.
