# P3 Aggregation plane — the ON arm of the step-4 live A/B (2026-08-29).
#
# Purpose: turn the ingest-boundary aggregation plane ON for one leg of the A/B
# described in `docs/design/AGGREGATION_PLANE_P3_2026-08-29.md` §6a/§6b/§7 and
# executed per `docs/scale/RUN_PLAN_P3_AB_2026-08-29.md`. `CORR_AGGREGATION_PLANE`
# defaults to OFF in the image (src/correlation/main.py ~1855) but — since the
# owner-ratified default flip of 2026-08-30 — to ON in the base
# docker-compose.yml (`${CORR_AGGREGATION_PLANE:-1}`). The absence of an overlay
# therefore yields the DEPLOYED DEFAULT (ON), so each A/B arm pins the flag with
# its own one-variable overlay: this file (=1) is the ON arm and its mirror
# `compose.agg-off.yml` (=0) is the OFF arm — the image, the harness and every
# other overlay are byte-identical across the two arms. That is the whole
# point: ONE variable.
#
# This overlay sets EXACTLY ONE environment key on EXACTLY ONE service. It must
# never grow a second knob (mem_limit, buffer size, profiler, …) — a second
# variable would make the A/B uninterpretable, and `tests/test_compose_agg_overlay.py`
# fails the build if one appears.
#
# APPLY (ON arm) — append to the deployed overlay set, correlation only:
#   cd deployment/docker
#   docker compose -f docker-compose.yml -f compose.offline-images.yml \
#     -f compose.tls.yml -f compose.mem125.yml -f compose.lab.yml \
#     -f compose.profile.yml -f compose.agg.yml \
#     up -d --no-deps --force-recreate --scale correlation=2 correlation
#
# VERIFY — in BOTH replicas (the engine runs two; a half-flagged pair silently
# mixes arms and invalidates the leg):
#   for c in $(docker compose ... ps -q correlation); do \
#     echo "== $c"; docker exec "$c" env | grep CORR_AGGREGATION_PLANE; done
#   # expect `CORR_AGGREGATION_PLANE=1` from BOTH containers (two lines).
# And on each replica's own /metrics, `corr_agg_enabled 1` plus
# `corr_agg_observed_total` ADVANCING between two samples once traffic flows.
# The app port is mTLS-only under compose.tls.yml, so scrape it the way the
# harness and every collector do -- an mTLS client INSIDE the container, aimed at
# that replica's OWN container ip:8443, still verifying the server against the
# `correlation` SPIFFE name (the ip is the routing target, never a verification
# bypass). Do NOT use the :8094 health sidecar for this: on the TLS deployment a
# plaintext GET to it is reset (ECONNRESET on both replicas, 2026-08-29 22:43),
# which reads as "arm unknown" and stops a wave for no reason.
#   ip=$(docker inspect "$c" --format \
#     '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
#   docker exec "$c" python -c "import socket,ssl,sys
#   ctx=ssl.create_default_context(cafile='/certs/ca.pem')
#   ctx.load_cert_chain('/certs/svid/correlation.crt','/certs/svid/correlation.key')
#   s=ctx.wrap_socket(socket.create_connection(('$ip',8443),timeout=8),
#                     server_hostname='correlation')
#   s.sendall(b'GET /metrics HTTP/1.1\r\nHost: correlation\r\nConnection: close\r\n\r\n')
#   b=b''
#   while True:
#       d=s.recv(65536)
#       if not d: break
#       b+=d
#   sys.stdout.write(b.split(b'\r\n\r\n',1)[1].decode())" \
#     | grep -E '^corr_agg_(enabled|observed_total|suppressed_total)'
# `scripts/scale-ab-driver.py` does exactly this, for both arms, on both replicas.
# A flat `corr_agg_observed_total` under load means the plane is not on the
# ingest path — stop the leg, do not report it as an ON arm.
#
# REMOVE (back to the deployed default) — redeploy WITHOUT this file AND
# without compose.agg-off.yml, i.e. the same command with the `-f` pin dropped:
# the base docker-compose.yml default (ON since 2026-08-30; `.env` can
# override) then applies. The OFF arm is NOT this file's absence any more — it
# is `-f compose.agg-off.yml` in this file's place. Do not "unset" the variable
# by editing either file; each arm is defined by which ONE pin file is present,
# so that the two arms differ by a deployment argument and nothing else.
services:
  correlation:
    environment:
      CORR_AGGREGATION_PLANE: "1"
