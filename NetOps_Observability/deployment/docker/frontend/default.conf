# Inner nginx for the SPA container. The outer reverse proxy routes here.
#
# Cache policy matters: index.html must NOT be cached by the browser, or a
# redeploy leaves clients loading a stale index that references old asset
# hashes (the app appears "unchanged" after a rebuild). The hashed assets
# under /assets/ are content-addressed, so they're safe to cache forever.
server {
  listen 8080; # non-root (SC-008): nginx-unprivileged binds an unprivileged port
  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted bundles — immutable, cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # In-app documentation portal (Docusaurus static build, baseUrl /docs/).
  # MUST precede `location /` — the longer prefix wins — so docs pages resolve
  # to their real .html files instead of the SPA history-fallback (index.html).
  # Docusaurus emits directory-style pages (foo/index.html) plus a 404.html.
  location /docs/ {
    # Content-addressed Docusaurus assets are immutable — cache them hard.
    location /docs/assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    try_files $uri $uri/ $uri/index.html =404;
    # Serve the Docusaurus 404 page WITH a real 404 status (a try_files
    # fallback would return it as a 200, lying to clients and caches).
    error_page 404 /docs/404.html;
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA entry — always revalidate so new deploys are picked up immediately.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, must-revalidate";
  }
}
