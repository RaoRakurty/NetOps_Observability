# gnmic — gNMI dial-in telemetry collector (sidecar).
#
# Subscribes to the clos-multivendor fabric over gNMI and remote-writes the
# samples to VictoriaMetrics, so gNMI telemetry lands alongside the SNMP
# metrics and is queryable through the same /api/metrics path.
#
# Per-vendor paths: Arista cEOS serves OpenConfig; Nokia SR Linux serves its
# native model (its gNMI root has `interface`/`platform`, not `interfaces`).
# Device gNMI passwords come from the environment (.env), never hard-coded here.

username: admin
encoding: json_ietf
skip-verify: true
log: true
targets:
  # ---- Nokia SR Linux (TLS, self-signed -> skip-verify) ----
  172.40.40.11:57400:
    name: spine1
    password: ${SRL_GNMI_PASS}
    subscriptions: [srl-interfaces, srl-cpu, srl-bgp, srl-isis]
  172.40.40.12:57400:
    name: spine2
    password: ${SRL_GNMI_PASS}
    subscriptions: [srl-interfaces, srl-cpu, srl-bgp, srl-isis]

  # ---- Arista cEOS (plaintext gNMI :6030) ----
  172.40.40.21:6030:
    name: leaf1
    password: ${EOS_GNMI_PASS}
    insecure: true
    subscriptions: [oc-interfaces, oc-bgp]
  172.40.40.22:6030:
    name: leaf2
    password: ${EOS_GNMI_PASS}
    insecure: true
    subscriptions: [oc-interfaces, oc-bgp]
  172.40.40.23:6030:
    name: leaf3
    password: ${EOS_GNMI_PASS}
    insecure: true
    subscriptions: [oc-interfaces, oc-bgp]
  172.40.40.24:6030:
    name: leaf4
    password: ${EOS_GNMI_PASS}
    insecure: true
    subscriptions: [oc-interfaces, oc-bgp]
  172.40.40.32:6030:
    name: wan-r2
    password: ${EOS_GNMI_PASS}
    insecure: true
    subscriptions: [oc-interfaces, oc-bgp]

subscriptions:
  # OpenConfig interface counters + oper/admin status (Arista).
  oc-interfaces:
    paths:
      - "/interfaces/interface/state/counters"
      - "/interfaces/interface/state/oper-status"
      - "/interfaces/interface/state/admin-status"
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  # Nokia SR Linux native interface statistics.
  srl-interfaces:
    paths:
      - "/interface[name=*]/statistics"
      - "/interface[name=*]/oper-state"
      - "/interface[name=*]/admin-state"
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  # BGP neighbor session-state — CONTROL PLANE, gNMI-owned (its own subscription).
  # Canonical lane applies canon-override-ts so cEOS's stale established-session
  # timestamps don't get rejected by VictoriaMetrics (see outputs + issue file).
  oc-bgp:
    paths:
      - "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state/session-state"
      # Flap counter (established-transitions) + per-AFI prefixes received —
      # both gNMI-owned (BGP4-MIB is v4-only / barely on cEOS). Same cEOS
      # stale-ts class as session-state; canon-override-ts handles it.
      - "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state/established-transitions"
      - "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/received"
    mode: stream
    stream-mode: sample
    sample-interval: 30s
  srl-bgp:
    paths:
      - "/network-instance[name=default]/protocols/bgp/neighbor[peer-address=*]/session-state"
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  # IS-IS adjacency state — the fabric IGP (SRL native; cEOS leaves are pure-L3
  # BGP, no IS-IS). Adjacency flaps are root-cause events.
  srl-isis:
    paths:
      - "/network-instance[name=default]/protocols/isis/instance[name=*]/interface[interface-name=*]/adjacency[neighbor-system-id=*]/state"
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  # Nokia SR Linux control-plane health: CPU, memory, temperature.
  srl-cpu:
    paths:
      - "/platform/control[slot=A]/cpu[index=all]/total"
      - "/platform/control[slot=A]/memory"
      - "/platform/control[slot=A]/temperature"
    mode: stream
    stream-mode: sample
    sample-interval: 30s

# gNMI is the OWNER of BGP state (SNMP BGP4-MIB is IPv4-only and barely
# implemented on cEOS/SRL — device_bgp_peer_state has zero SNMP series on this
# fabric). The SNMP profile keeps bgpPeerState only as a fallback for
# agentless/older gear. BGP session-state is carried in the interface
# subscriptions above (see the oc-interfaces comment for why).
outputs:
  # Raw lane — gNMI paths verbatim under the gnmi_ prefix. Debug surface,
  # gNMI-liveness source for the backend health monitor, and the comparison
  # lane for parity checks before an ownership flip. Never queried by panels.
  victoria:
    type: prometheus_write
    url: http://victoria:8428/api/v1/write
    metric-prefix: gnmi
    interval: 15s

  # Canonical lane — THE normalization layer (single-contract principle:
  # whatever the transport, SNMP and gNMI must emit the same output).
  # Pipeline: rename mapped paths to canonical device_* names → status enums
  # to IF-MIB numerics → vendor/transport tags → identity tags renamed to the
  # canonical label set → OWNERSHIP GATE → fail-closed cleanup.
  #
  # Ownership rule (collision safety): a (device, family) pair is served by
  # exactly ONE transport. gNMI coverage is currently a strict SUBSET of SNMP
  # on interfaces (no VLANs/loopbacks/subifs, no speed/admin parity proven),
  # so interface/cpu/temp families stay SNMP-owned and are withheld here by
  # the ownership gate. Memory on Nokia SRL has NO SNMP source at all — gNMI
  # owns it from day one. To flip a family to gNMI: prove parity against the
  # raw lane, remove it from the ownership-gate delete list, and withdraw it
  # from the SNMP profile for the affected devices in the same change.
  victoria-canonical:
    type: prometheus_write
    url: http://victoria:8428/api/v1/write
    interval: 15s
    event-processors:
      - canon-override-ts
      - canon-names
      - canon-status-enums
      - canon-bgp-enums
      - canon-isis-enums
      - canon-convert
      - vendor-nokia
      - vendor-arista
      - transport-tag
      - canon-tags
      - ownership-gate
      - drop-unmapped
      - drop-internal-tags

processors:
  # [0] Override sample timestamp with collection time. cEOS stamps a STABLE
  # established BGP session's sampled response with the session's last-transition
  # time (hours old on a steady fabric) instead of the sample time; VictoriaMetrics
  # silently rejects those as stale, so cEOS leaf BGP vanished while spine/wan-r2
  # (fresh timestamps) landed. For sampled STATE we want "is it established NOW",
  # so collection-time is correct; true event-time lives in the event plane, not
  # here. Applies to ALL canonical series (harmless for already-fresh ones).
  # (Root cause: ceos-bgp-gnmi-issue.md.)
  canon-override-ts:
    event-override-ts:
      precision: ns

  # [1] Path → canonical name. Full mapping table for both vendors; anchored
  # regexes, replace rewrites the entire value name. Unmapped paths keep their
  # raw shape and are removed by drop-unmapped (fail-closed: a new subscription
  # can never leak into the canonical namespace unmapped).
  canon-names:
    event-strings:
      value-names: [".*"]
      transforms:
        # --- Arista / OpenConfig: /interfaces/interface/state/... ---
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-octets$", new: "device_if_in_octets"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-octets$", new: "device_if_out_octets"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-errors$", new: "device_if_in_errors"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-errors$", new: "device_if_out_errors"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-discards$", new: "device_if_in_discards"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-discards$", new: "device_if_out_discards"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-unicast-pkts$", new: "device_if_in_ucast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-multicast-pkts$", new: "device_if_in_mcast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/in-broadcast-pkts$", new: "device_if_in_bcast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-unicast-pkts$", new: "device_if_out_ucast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-multicast-pkts$", new: "device_if_out_mcast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/counters/out-broadcast-pkts$", new: "device_if_out_bcast_pkts"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/oper-status$", new: "device_if_oper_status"}
        - replace: {apply-on: name, old: ".*interfaces/interface/state/admin-status$", new: "device_if_admin_status"}
        # --- Nokia SR Linux native: /interface[name=*]/statistics/... ---
        - replace: {apply-on: name, old: ".*interface/statistics/in-octets$", new: "device_if_in_octets"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-octets$", new: "device_if_out_octets"}
        - replace: {apply-on: name, old: ".*interface/statistics/in-error-packets$", new: "device_if_in_errors"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-error-packets$", new: "device_if_out_errors"}
        - replace: {apply-on: name, old: ".*interface/statistics/in-discarded-packets$", new: "device_if_in_discards"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-discarded-packets$", new: "device_if_out_discards"}
        - replace: {apply-on: name, old: ".*interface/statistics/in-unicast-packets$", new: "device_if_in_ucast_pkts"}
        - replace: {apply-on: name, old: ".*interface/statistics/in-multicast-packets$", new: "device_if_in_mcast_pkts"}
        - replace: {apply-on: name, old: ".*interface/statistics/in-broadcast-packets$", new: "device_if_in_bcast_pkts"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-unicast-packets$", new: "device_if_out_ucast_pkts"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-multicast-packets$", new: "device_if_out_mcast_pkts"}
        - replace: {apply-on: name, old: ".*interface/statistics/out-broadcast-packets$", new: "device_if_out_bcast_pkts"}
        - replace: {apply-on: name, old: ".*interface/oper-state$", new: "device_if_oper_status"}
        - replace: {apply-on: name, old: ".*interface/admin-state$", new: "device_if_admin_status"}
        # --- Nokia SR Linux control plane ---
        - replace: {apply-on: name, old: ".*cpu/total/instant$", new: "device_cpu_percent"}
        - replace: {apply-on: name, old: ".*memory/utilization$", new: "device_mem_percent"}
        - replace: {apply-on: name, old: ".*temperature/instant$", new: "device_temp_celsius"}
        # --- BGP neighbor session-state (control plane, both vendors) ---
        # cEOS OpenConfig ends .../neighbors/neighbor/state/session-state;
        # SRL native ends .../neighbor/session-state (no /state/). Anchored so
        # the two never cross-match.
        - replace: {apply-on: name, old: ".*bgp/neighbors/neighbor/state/session-state$", new: "device_bgp_peer_state"}
        - replace: {apply-on: name, old: ".*bgp/neighbor/session-state$", new: "device_bgp_peer_state"}
        # BGP flap counter + per-AFI prefixes received (cEOS OpenConfig). Anchored
        # so established-transitions never cross-matches session-state above.
        - replace: {apply-on: name, old: ".*bgp/neighbors/neighbor/state/established-transitions$", new: "device_bgp_fsm_transitions"}
        - replace: {apply-on: name, old: ".*bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/received$", new: "device_bgp_pfx_in"}
        # --- IS-IS adjacency state (IGP, SRL native) ---
        - replace: {apply-on: name, old: ".*isis/instance/interface/adjacency/state$", new: "device_isis_adj_state"}

  # [2] Status enums → IF-MIB numerics (ifOperStatus/ifAdminStatus values;
  # OpenConfig enums are modeled on the same list). Anchored — no substring
  # hazards (LOWER_LAYER_DOWN vs DOWN). Lowercase set = Nokia SRL.
  canon-status-enums:
    event-strings:
      value-names: ["^device_if_oper_status$", "^device_if_admin_status$"]
      transforms:
        - replace: {apply-on: value, old: "^UP$", new: "1"}
        - replace: {apply-on: value, old: "^DOWN$", new: "2"}
        - replace: {apply-on: value, old: "^TESTING$", new: "3"}
        - replace: {apply-on: value, old: "^UNKNOWN$", new: "4"}
        - replace: {apply-on: value, old: "^DORMANT$", new: "5"}
        - replace: {apply-on: value, old: "^NOT_PRESENT$", new: "6"}
        - replace: {apply-on: value, old: "^LOWER_LAYER_DOWN$", new: "7"}
        - replace: {apply-on: value, old: "^up$", new: "1"}
        - replace: {apply-on: value, old: "^down$", new: "2"}
        - replace: {apply-on: value, old: "^testing$", new: "3"}
        # Nokia SR Linux admin-state spells the enable/disable enum out; map it
        # onto ifAdminStatus up(1)/down(2) so admin status is numeric like oper.
        - replace: {apply-on: value, old: "^enable$", new: "1"}
        - replace: {apply-on: value, old: "^disable$", new: "2"}

  # [2b] BGP session-state enum → BGP4-MIB bgpPeerState numerics so the canonical
  # value matches the SNMP contract (alert template reads device_bgp_peer_state
  # < 6, i.e. anything below established). OpenConfig (cEOS, UPPERCASE) and SRL
  # native (lowercase) share the same six-state list; anchored.
  canon-bgp-enums:
    event-strings:
      value-names: ["^device_bgp_peer_state$"]
      transforms:
        - replace: {apply-on: value, old: "^IDLE$", new: "1"}
        - replace: {apply-on: value, old: "^CONNECT$", new: "2"}
        - replace: {apply-on: value, old: "^ACTIVE$", new: "3"}
        - replace: {apply-on: value, old: "^OPENSENT$", new: "4"}
        - replace: {apply-on: value, old: "^OPENCONFIRM$", new: "5"}
        - replace: {apply-on: value, old: "^ESTABLISHED$", new: "6"}
        - replace: {apply-on: value, old: "^idle$", new: "1"}
        - replace: {apply-on: value, old: "^connect$", new: "2"}
        - replace: {apply-on: value, old: "^active$", new: "3"}
        - replace: {apply-on: value, old: "^opensent$", new: "4"}
        - replace: {apply-on: value, old: "^openconfirm$", new: "5"}
        - replace: {apply-on: value, old: "^established$", new: "6"}

  # [2c] IS-IS adjacency-state enum → ISIS-MIB isisISAdjState numerics
  # (down1/init2/up3/failed4). SRL emits lowercase up/down.
  canon-isis-enums:
    event-strings:
      value-names: ["^device_isis_adj_state$"]
      transforms:
        - replace: {apply-on: value, old: "^down$", new: "1"}
        - replace: {apply-on: value, old: "^init.*$", new: "2"}
        - replace: {apply-on: value, old: "^up$", new: "3"}
        - replace: {apply-on: value, old: "^failed$", new: "4"}

  # [3] Canonical values are integers (matches the SNMP emitter's valueInt).
  canon-convert:
    event-convert:
      value-names: ["^device_.*$"]
      type: int

  # [4] Vendor label, keyed on which subscription produced the event.
  vendor-nokia:
    event-add-tag:
      tags: ["^srl-(interfaces|cpu|bgp|isis)$"]
      add: {vendor: nokia}
  vendor-arista:
    event-add-tag:
      tags: ["^oc-(interfaces|bgp)$"]
      add: {vendor: arista}

  # [5] Transport label — series provenance for watchdog freshness checks and
  # correlation observer independence. SNMP series carry no transport label
  # (legacy default) until the first overlapping ownership flip.
  transport-tag:
    event-add-tag:
      value-names: ["."]
      add: {transport: gnmi}

  # [6] Identity tags → canonical label names (device, ifName, peer, vrf). BGP
  # adds peer (cEOS neighbor_neighbor-address / SRL neighbor_peer-address) and
  # vrf (network-instance_name) — also strips the hyphenated raw names, which are
  # invalid Prometheus labels.
  canon-tags:
    event-strings:
      tag-names: ["^interface_name$", "^interface_interface-name$", "^source$", "^neighbor_neighbor-address$", "^neighbor_peer-address$", "^network-instance_name$", "^adjacency_neighbor-system-id$", "^adjacency_adjacency-level$", "^afi-safi_afi-safi-name$"]
      transforms:
        - replace: {apply-on: name, old: "^interface_name$", new: "ifName"}
        - replace: {apply-on: name, old: "^interface_interface-name$", new: "ifName"}
        - replace: {apply-on: name, old: "^source$", new: "device"}
        - replace: {apply-on: name, old: "^neighbor_neighbor-address$", new: "peer"}
        - replace: {apply-on: name, old: "^neighbor_peer-address$", new: "peer"}
        - replace: {apply-on: name, old: "^network-instance_name$", new: "vrf"}
        # BGP per-AFI prefix counts carry the OpenConfig combined afi-safi key
        # (IPV4_UNICAST/IPV6_UNICAST/L2VPN_EVPN) — hyphenated raw name is an
        # invalid Prom label; rename to the canonical afi_safi.
        - replace: {apply-on: name, old: "^afi-safi_afi-safi-name$", new: "afi_safi"}
        # IS-IS adjacency identity
        - replace: {apply-on: name, old: "^adjacency_neighbor-system-id$", new: "isis_neighbor"}
        - replace: {apply-on: name, old: "^adjacency_adjacency-level$", new: "isis_level"}

  # [7] OWNERSHIP GATE — families listed here are mapped and ready but still
  # SNMP-owned; deleting them prevents double-producing the same canonical
  # series from two transports. Flip = remove from this list + withdraw the
  # family from the SNMP profile for the affected devices (one change).
  # Currently gNMI-owned: device_mem_percent (no SNMP source on Nokia SRL).
  ownership-gate:
    event-delete:
      value-names:
        - "^device_if_.*$"
        - "^device_cpu_percent$"
        - "^device_temp_celsius$"

  # [8] Fail-closed: canonical names contain no '/' or '-'; anything still
  # path-shaped was never mapped and must not reach the canonical namespace.
  drop-unmapped:
    event-delete:
      value-names: ["/", "-"]

  # [9] Internal plumbing tags stay out of the canonical label set. gnmic names
  # the subscription tag with a hyphen (subscription-name); control_slot/cpu_index
  # are SR-Linux path keys; protocol_identifier/protocol_name are the BGP
  # OpenConfig protocol-list keys (always BGP here) — none have an SNMP-contract
  # equivalent, so drop them. Canonical label set = {device, vendor, ifName,
  # transport} for interfaces/resources, + {peer, vrf} for BGP.
  drop-internal-tags:
    event-delete:
      tag-names: ["^subscription[-_]name$", "^control_slot$", "^cpu_index$", "^protocol_identifier$", "^protocol_name$", "^instance_name$"]
