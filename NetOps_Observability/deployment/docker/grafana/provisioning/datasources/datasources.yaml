apiVersion: 1

# Datasources auto-provisioned on Grafana startup.
#
# The ClickHouse datasource is intentionally commented out by default —
# it requires the `grafana-clickhouse-datasource` plugin, which Grafana
# tries to download from grafana.com at boot. Networks doing TLS
# interception block that download, causing a restart loop.
#
# To enable ClickHouse in Grafana:
#   1. In deployment/docker/.env, set: GRAFANA_PLUGINS=grafana-clickhouse-datasource
#   2. Uncomment the ClickHouse block below.
#   3. docker compose up -d --force-recreate grafana

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria:8428
    editable: false
    jsonData:
      timeInterval: 15s

