apiVersion: 1

# Datasources auto-provisioned on Grafana startup.
#
# The ClickHouse datasource needs the `grafana-clickhouse-datasource` plugin.
# Grafana normally downloads it from grafana.com at boot via GF_INSTALL_PLUGINS,
# but networks doing TLS interception block that download. So the plugin is
# installed by scripts/install.py (bootstrap_grafana), which falls back to an
# insecure fetch on intercepted networks, into the bind-mounted plugins dir.
# If this datasource shows "plugin not found", run: python3 scripts/install.py
# (or the documented grafana-cli --insecure install) and restart Grafana.
#
# Tenancy: Grafana connects as the dedicated read-only `grafana` ClickHouse user
# whose profile pins tenant_scope='' (a readonly CONST), so the row policies on
# netops.flows/findings/tunnels return ONLY untagged platform/infra rows — never
# another tenant's tagged data. See scripts/install.py:bootstrap_grafana and
# deployment/docker/clickhouse/init.sql (#20 row policies).

# Provisioning matches datasources BY NAME. Existing installs have a
# datasource NAMED "Prometheus" already holding uid=prometheus, so the renamed
# entry below would try to INSERT and fatally collide on the uid ("data source
# with the same uid already exists" crash-loop). Retire the old name first —
# idempotent: a no-op on fresh installs and after the first successful boot.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # uid stays "prometheus" so existing dashboards keep working, but the
  # Prometheus SERVICE is gone (#97): VictoriaMetrics scrapes the self-metrics
  # and serves the same PromQL API, so this points at VM.
  - name: Prometheus (VictoriaMetrics)
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoria:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria:8428
    editable: false
    jsonData:
      timeInterval: 15s

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      defaultDatabase: netops
      protocol: native
      host: clickhouse
      port: 9000
      secure: false
      username: grafana
    secureJsonData:
      password: ${GRAFANA_CH_PASSWORD}
