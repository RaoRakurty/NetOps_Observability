# Single entry point — everything reachable from http://localhost:8000.
# Routes:
#   /                          -> React SPA
#   /api/*                     -> Go backend
#   /admin/*                   -> Go backend (health, version)
#   /metrics                   -> Go backend (Prometheus scrape target)
#   /prometheus/*              -> Prometheus UI
#   /grafana/*                 -> Grafana UI
#   /search/*                  -> OpenSearch Dashboards (logs, SIEM)

upstream api               { server api:8080; }
upstream frontend          { server frontend:80; }
upstream prom              { server prometheus:9090; }
upstream graf              { server grafana:3000; }
upstream osd               { server opensearch-dashboards:5601; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    # SPA
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API — WebSocket endpoint (Upgrade-aware).
    # Must come BEFORE the more general /api/ block so this exact-match
    # location wins for /api/events.
    location = /api/events {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend API (REST + GraphQL + Copilot proxy)
    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Copilot streaming responses can be slow — give them room.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /metrics {
        proxy_pass         http://api/metrics;
    }

    # Prometheus UI — strip the /prometheus prefix.
    location /prometheus/ {
        proxy_pass         http://prom/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Prefix /prometheus;
    }

    # Grafana — serve_from_sub_path=true so pass through unmodified.
    location /grafana/ {
        proxy_pass         http://graf;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenSearch Dashboards. Configured with SERVER_BASEPATH=/search and
    # SERVER_REWRITEBASEPATH=true so asset paths line up.
    location /search/ {
        proxy_pass         http://osd;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
