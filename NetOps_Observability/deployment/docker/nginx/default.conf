# Single entry point — everything reachable from http://localhost:8000.
# Routes:
#   /                          -> React SPA
#   /api/*                     -> Go backend
#   /admin/*                   -> Go backend (health, version)
#   /metrics                   -> Go backend (Prometheus scrape target)
#   /prometheus/*              -> Prometheus UI
#   /grafana/*                 -> Grafana UI
#   /search/*                  -> OpenSearch Dashboards (logs, SIEM)
#
# Upstreams are resolved DYNAMICALLY via Docker's embedded DNS (127.0.0.11)
# using variables in proxy_pass. Static `upstream {}` blocks (or a literal
# hostname in proxy_pass) resolve once at startup and cache the IP forever — so
# recreating a backend container (new IP) leaves nginx proxying to a dead IP and
# returning 502 until nginx itself is restarted. The variable form forces
# re-resolution at request time (honoring `valid=`), so redeploys just work.

# TLS-readiness (#145): the effective client-facing scheme. When the TLS front
# (tls.conf.example, same container) forwards a request it sets
# X-Forwarded-Proto: https — carry that through to Keycloak/NetBox/OSD/the API
# so issuer URLs, redirect URIs and Secure-cookie decisions are https-correct
# WITHOUT hand-editing this file. Only the literal "https" is trusted; anything
# else (absent, junk, spoofed variants) normalizes to the actual inner scheme.
# A direct-HTTP client claiming https can only break its own cookies — the
# value never grants anything, it only marks cookies Secure.
map $http_x_forwarded_proto $fwd_proto {
    https   https;
    default $scheme;
}

server {
    listen 8080 default_server; # non-root (SC-008): nginx-unprivileged binds :8080
    server_name _;
    client_max_body_size 50m;

    # Docker's embedded DNS. valid= bounds how long a resolved IP is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA
    location / {
        set                $up_frontend frontend;
        proxy_pass         http://$up_frontend:8080; # inner SPA nginx (unprivileged, SC-008)
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Security headers (SR-007). Scoped to the SPA: these defend the rendered
        # HTML app (clickjacking, MIME-sniffing, referrer leakage, resource
        # origins). The operator consoles (/grafana, /prometheus, /search) are
        # already platform-owner-gated and need their own permissive CSPs, so we
        # deliberately do NOT blanket them here. NB nginx add_header does not
        # inherit into a location that sets its own headers, so the full set
        # lives in this one block; `always` emits them on error responses too.
        add_header X-Frame-Options          "DENY"                      always;
        add_header X-Content-Type-Options   "nosniff"                   always;
        add_header Referrer-Policy          "no-referrer"               always;
        # CSP tuned for the Vite/React/ECharts bundle: external module scripts
        # ('self'), inline styles (React style props need 'unsafe-inline'),
        # data: images/fonts (ECharts, icon fonts), same-origin XHR/WS to /api,
        # and same-origin iframes for embedded Grafana panels. frame-ancestors
        # 'none' is the modern clickjacking guard alongside X-Frame-Options.
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # HSTS is intentionally absent here: the default deployment is plain HTTP
        # on :8000. Emit Strict-Transport-Security only at the TLS edge once the
        # stack terminates HTTPS (see main.go HSTS when Go terminates TLS).
    }

    # In-app documentation portal (Docusaurus static site, bundled into the
    # frontend image at /usr/share/nginx/html/docs, baseUrl /docs/). Served here
    # rather than through the SPA `/` block because the SPA block sets
    # `X-Frame-Options: DENY` + `frame-ancestors 'none'` to defend the app HTML —
    # which would ALSO block the SPA's own "?" Help panel from embedding the docs.
    # nginx `add_header` does not inherit into a sibling location, so this block
    # restates a docs-appropriate header set: same-origin framing is allowed (so
    # the in-app panel can iframe /docs/), everything else stays locked down. The
    # content is non-sensitive product documentation (no tenant data), so no
    # platform gate — every authenticated operator can read it.
    location /docs/ {
        set                $up_frontend_docs frontend;
        proxy_pass         http://$up_frontend_docs:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "no-referrer" always;
        # Docusaurus ships hashed CSS/JS plus small inline bootstrap styles/scripts;
        # allow 'unsafe-inline' for style/script here (static docs, not the app) and
        # let the app at 'self' frame it. frame-ancestors 'self' is the modern
        # clickjacking guard that still permits the in-app embed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    }

    # Backend API — WebSocket endpoint (Upgrade-aware).
    # Must come BEFORE the more general /api/ block so this exact-match
    # location wins for /api/events.
    location = /api/events {
        set                $up_api api;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend API — device SSH gateway WebSocket (Upgrade-aware).
    # /api/devices/{id}/ssh upgrades to a WebSocket (xterm.js ↔ SSH bridge,
    # opt-in FEATURE_DEVICE_SSH). A regex location is evaluated before the
    # generic /api/ prefix block, so it wins for this path and — unlike the
    # generic block — forwards the Upgrade/Connection headers the handshake
    # needs. Without this the upgrade is stripped and Connect silently fails.
    location ~ ^/api/devices/[^/]+/ssh$ {
        set                $up_api api;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend API (REST + GraphQL + Copilot proxy)
    location /api/ {
        set                $up_api api;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Normalized (map above): the API decides Secure cookies from this.
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        # Copilot streaming responses can be slow — give them room.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        set                $up_api api;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # App /metrics (Prometheus exposition). Platform-owner-only (SR-008): this
    # exposes internal hostnames/cardinality that can reveal tenants/devices.
    # Prometheus itself scrapes api:8080/metrics DIRECTLY over the Docker network
    # (see src/config/prometheus.yml), so gating this nginx route does not affect
    # scraping — it only restricts external/manual access via :8000.
    location = /metrics {
        auth_request       /__osd_auth;
        error_page 401 403 = @platform_denied;

        set                $up_api api;
        proxy_pass         http://$up_api:8080/metrics;
    }

    # Prometheus was removed (#97 footprint pass — VictoriaMetrics scrapes the
    # self-metrics itself); its /prometheus operator console went with it. The
    # in-app Metrics Explorer queries VM; deep operator dashboards live in the
    # optional self-monitoring add-on (Grafana, /grafana below).

    # Grafana — serve_from_sub_path=true so pass through unmodified.
    #
    # Platform-owner-only gate (security review SR-001). Grafana runs with
    # anonymous Viewer access so the app's embedded panels render without a
    # Grafana login; that convenience must NOT be reachable unauthenticated from
    # the outside, or the provisioned ClickHouse/flows/findings dashboards would
    # leak platform/infra telemetry to anyone hitting :8000/grafana/. Authorize
    # every request against the same gate cookie as /search/ (200 only for the
    # platform owner); 401/403 → a clear denial instead of the console.
    location /grafana/ {
        auth_request       /__osd_auth;
        error_page 401 403 = @graf_denied;
        # Seamless SSO: capture the gate-issued username and forward it as
        # Grafana's auth-proxy header so the embed auto-signs-in as that user.
        auth_request_set   $grafana_user $upstream_http_x_grafana_user;

        set                $up_graf grafana;
        proxy_pass         http://$up_graf:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection "";
        # Auto-login header (overwrites any client-supplied copy — zero trust).
        proxy_set_header   X-WEBAUTH-USER $grafana_user;

        # Correlix white-label: drop upstream gzip so sub_filter can inject a
        # <style> that re-skins Grafana to the Correlix palette (indigo accent,
        # Inter type) and hides the Grafana logo/branding, so the embedded
        # console doesn't read as "standard Grafana". Kiosk mode (?kiosk, set by
        # the SPA) already removes the nav chrome for the seamless full embed.
        proxy_set_header   Accept-Encoding "";
        sub_filter_once    off;
        sub_filter_types   text/html;
        sub_filter '</head>' '<style>:root{--correlix-bg:#f5f6f8;--correlix-surface:#ffffff;--correlix-accent:#4f46e5}body,.grafana-app,.main-view,div[class*="-canvas"],div[class*="pageContainer"],div[class*="-pageContent"]{background:#f5f6f8!important;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif!important}section[class*="-panel-container"],div[class*="panel-container"],div[class*="-panelWrapper"],div[class*="-cardContainer"]{background:#ffffff!important}nav[class*="-sidemenu"],div[class*="-navbar"],header[class*="-pageToolbar"]{background:#ffffff!important;border-color:rgba(17,24,39,.08)!important}.page-toolbar__logo,img[src*="grafana_icon"],img[src*="grafana_typelogo"],a[href="/grafana/"] img,.sidemenu__logo,.sidemenu-header{display:none!important}button[class*="-primary"],a[class*="-primary"]{background-color:#4f46e5!important;border-color:#4f46e5!important}[class*="activeTabStyle"],[class*="activeTab"]{border-color:#4f46e5!important;color:#4f46e5!important}</style></head>';
    }

    # Source of Truth (bundled NetBox) — embedded in-app under Automation. It is
    # served at /netbox/ (BASE_PATH=netbox) and the SPA frames it directly, so the
    # operator never leaves the platform or sees a separate login. Three things
    # make that seamless:
    #
    #  1. Platform-owner gate (auth_request) — NetBox holds the full inventory and
    #     runs a privileged superuser, so a tenant user must never reach it.
    #  2. Auto-login — the gate returns the NetBox superuser name (X-Netbox-User);
    #     we capture it and forward it as the REMOTE_AUTH header so NetBox logs the
    #     request straight in as that superuser. The client's own X-Remote-User is
    #     never trusted: it's overwritten here and only set after the gate passes.
    #  3. White-label — strip the upstream's gzip so sub_filter can rewrite the
    #     visible "NetBox" wording to "Source of Truth" and inject CSS hiding the
    #     NetBox logo/footer, so the embedded tool reads as part of the platform.
    #
    # Only present when started with `docker compose --profile netbox up -d`;
    # 502 → friendly "not enabled" note.
    #
    # Static-asset bridge (MUST precede the app location — longer prefix wins).
    # NetBox emits /netbox/static/* URLs (BASE_PATH) but whitenoise serves them at
    # /static/* (it ignores BASE_PATH), so every CSS/JS/logo 404s and the page
    # renders broken. Rewrite /netbox/static/ → /static/ on the upstream. No auth:
    # these are non-sensitive shipped assets, and gating them only risks breakage.
    location /netbox/static/ {
        set                $up_netbox_static netbox;
        rewrite            ^/netbox/static/(.*)$ /static/$1 break;
        proxy_pass         http://$up_netbox_static:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_intercept_errors on;
        # NetBox ships versioned (whitenoise) static assets — safe to cache hard so
        # the heavy CSS/JS isn't re-fetched on every embedded-console load.
        expires            7d;
        add_header         Cache-Control "public, max-age=604800";
        error_page 502 503 504 = @netbox_down;
    }

    location /netbox/ {
        auth_request       /__osd_auth;
        error_page 401 403 = @platform_denied;
        auth_request_set   $netbox_user $upstream_http_x_netbox_user;

        set                $up_netbox netbox;
        proxy_pass         http://$up_netbox:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto; # normalized (TLS-front pass-through, see map)
        proxy_set_header   X-Forwarded-Host $host;
        # Seamless SSO: forward the gate-issued superuser as NetBox's REMOTE_AUTH
        # header. Overwrites any client-supplied value (zero trust).
        proxy_set_header   X-Remote-User $netbox_user;

        # White-label + theme the embedded console so it reads as part of Opsis.
        # Disable upstream gzip so sub_filter can edit the HTML. We do NOT blanket-
        # replace "NetBox" (that corrupts asset URLs/filenames like
        # logo_netbox_*.svg). Instead: (1) a safe title rewrite, and (2) an injected
        # <style> that re-skins NetBox to the Opsis palette + hides its logo/brand,
        # and a <script> that rebrands only TEXT NODES (never attributes/URLs),
        # covering server- and JS-rendered text via a MutationObserver.
        proxy_set_header   Accept-Encoding "";
        sub_filter_once    off;
        sub_filter_types   text/html;
        sub_filter         'NetBox</title>' 'Source of Truth</title>';
        sub_filter         '</head>' '<style>:root{--bs-primary:#4f46e5;--bs-primary-rgb:79,70,229;--bs-link-color:#4f46e5;--bs-link-hover-color:#4338ca;--tblr-primary:#4f46e5;--tblr-primary-rgb:79,70,229;--tblr-link-color:#4f46e5}body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif!important}.navbar,header.navbar,.navbar-expand-md{background:#e9edf3!important;border-color:rgba(0,0,0,.08)!important}.navbar .nav-link,.navbar .navbar-brand,.navbar-nav .nav-link,.navbar .navbar-nav .nav-link:hover,.navbar .nav-link svg{color:#243044!important}.btn-primary{background-color:#4f46e5!important;border-color:#4f46e5!important}a{color:#4f46e5}img[src*="logo_netbox"],img[src*="netbox_logo"],.navbar-brand img,.navbar-brand svg{display:none!important}.navbar-brand::after{content:"Source of Truth";font-weight:700;font-size:16px;color:#243044}footer .text-end,footer a[href*="github.com/netbox"]{display:none!important}</style><script>(function(){function R(s){return s.replace(/NetBox/g,"Source of Truth")}function fix(n){if(n.nodeType===3){var p=n.parentNode;if(p&&(p.nodeName=="SCRIPT"||p.nodeName=="STYLE"))return;if(n.nodeValue&&n.nodeValue.indexOf("NetBox")>=0)n.nodeValue=R(n.nodeValue);return}for(var c=n.firstChild;c;c=c.nextSibling)fix(c)}function hideRSS(){try{var it=document.querySelectorAll(".grid-stack-item");for(var i=0;i<it.length;i++){var t=(it[i].textContent||"").toLowerCase();if(t.indexOf("rss feed")>=0||t.indexOf("fetching the rss")>=0)it[i].style.display="none"}}catch(e){}}var __q=[],__s=0;function __flush(){__s=0;var n=__q;__q=[];for(var k=0;k<n.length;k++)fix(n[k]);hideRSS()}function __sched(){if(!__s){__s=1;(window.requestAnimationFrame||function(f){setTimeout(f,100)})(__flush)}}function run(){try{if(document.title.indexOf("NetBox")>=0)document.title=R(document.title);if(document.body){fix(document.body);hideRSS()}}catch(e){}}if(document.readyState!="loading")run();else document.addEventListener("DOMContentLoaded",run);document.addEventListener("DOMContentLoaded",function(){try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var a=ms[i].addedNodes;for(var j=0;j<a.length;j++)__q.push(a[j])}__sched()}).observe(document.body,{childList:true,subtree:true})}catch(e){}})})();</script></head>';

        proxy_intercept_errors on;
        error_page 502 503 504 = @netbox_down;
    }

    # Friendly note when the optional bundled NetBox isn't running.
    location @netbox_down {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><title>Source of Truth not enabled</title></head><body style="font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:3rem auto;color:#2a2a35;line-height:1.5"><h2 style="color:#5b5bd6">The Source of Truth is not enabled</h2><p style="color:#6b6b76;font-size:.9rem">Enable it from Automation &rarr; Source of Truth. First start initializes its database and can take a few minutes.</p></body></html>';
    }

    # Generic platform-owner denial (used by /prometheus and /metrics).
    location @platform_denied {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>Access restricted</title></head><body style="font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:3rem auto;color:#2a2a35;line-height:1.5"><h2 style="color:#c0392b">Platform administrator access required</h2><p>This platform/infrastructure console is restricted to platform administrators. Sign in as a platform administrator to view it.</p></body></html>';
    }

    # Shown when a non-platform-owner (or unauthenticated caller) hits /grafana.
    location @graf_denied {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>Access restricted</title></head><body style="font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:3rem auto;color:#2a2a35;line-height:1.5"><h2 style="color:#c0392b">Platform administrator access required</h2><p>The Grafana console is restricted to platform administrators. Sign in as a platform administrator to view the platform-health and telemetry dashboards.</p></body></html>';
    }

    # OpenSearch Dashboards. Configured with SERVER_BASEPATH=/search and
    # SERVER_REWRITEBASEPATH=true so asset paths line up.
    #
    # Dashboards is an OPTIONAL operator tool (profile "osd"). When it isn't
    # running, proxying here would surface a raw "502 Bad Gateway". Instead we
    # intercept the upstream error and serve a clear explanation (graceful
    # degrade) so an absent optional service never looks like a platform fault.
    location /search/ {
        # Platform-owner-only gate (#35). Dashboards runs with its security plugin
        # off → no tenant isolation, so this route must never be reachable by a
        # tenant user. Each request is authorized by the Go API against the gate
        # cookie; 401/403 → a clear denial page instead of leaking Dashboards.
        auth_request       /__osd_auth_search;
        error_page 401 403 = @osd_denied;

        set                $up_osd opensearch-dashboards;
        proxy_pass         http://$up_osd:5601;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto; # normalized (TLS-front pass-through, see map)
        proxy_intercept_errors on;
        error_page 502 503 504 = @osd_down;
    }

    # Internal auth_request target: forwards the original request's cookies to the
    # Go API, which 200s only for a global-tenant super-admin (platform owner).
    location = /__osd_auth {
        internal;
        set                $up_api api;
        rewrite            ^ /api/auth/osd-gate break;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length "";
        proxy_set_header   Host $host;
    }

    # Same gate, but flagged for the RAW OpenSearch Dashboards console (?c=search).
    # The Go API additionally DENIES it when any tenant is operator-restricted —
    # the raw console can't be per-tenant filtered, so for compliance the operator
    # must use the in-app Logs view (which IS filtered) instead. NetBox keeps the
    # plain /__osd_auth gate (it's inventory, not tenant telemetry).
    location = /__osd_auth_search {
        internal;
        set                $up_api api;
        rewrite            ^ /api/auth/osd-gate?c=search break;
        proxy_pass         http://$up_api:8080;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length "";
        proxy_set_header   Host $host;
    }

    # Shown when a non-platform-owner (or unauthenticated caller) hits /search.
    location @osd_denied {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>Access restricted</title></head><body style="font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:3rem auto;color:#2a2a35;line-height:1.5"><h2 style="color:#c0392b">Platform administrator access required</h2><p>The OpenSearch Dashboards console is restricted to platform administrators. Sign in as a platform administrator, or use the in-app Logs view for tenant-scoped log search.</p></body></html>';
    }

    # Friendly fallback when OpenSearch Dashboards isn't running. 503 (correct
    # semantics: an optional dependency is unavailable) with an explanatory body
    # rather than nginx's default 502 page.
    location @osd_down {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><title>Dashboards not enabled</title></head><body style="font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:3rem auto;color:#2a2a35;line-height:1.5"><h2 style="color:#5b5bd6">OpenSearch Dashboards is an optional operator tool</h2><p>It is turned off by default to save memory and is reserved for platform administrators doing log/index forensics.</p><p>A platform administrator can start it from the deployment host:</p><pre style="background:#f4f4f8;padding:1rem;border-radius:6px">docker compose --profile osd up -d opensearch-dashboards</pre><p style="color:#6b6b76;font-size:.9rem">Everyday log search is available in the in-app Logs view.</p></body></html>';
    }

    # Keycloak (SSO identity broker) — only present when the stack is started
    # with `--profile sso`. Keycloak serves under /auth (KC_HTTP_RELATIVE_PATH),
    # so pass the prefix through unmodified. The X-Forwarded-* headers let
    # Keycloak build correct issuer/redirect URLs behind this single port and
    # let the Go API derive its SSO callback URL. Returns 502 (not a startup
    # failure) when the optional service isn't running.
    # $http_host, NOT $host — nginx's $host STRIPS THE PORT. With $host, Keycloak
    # saw `10.70.245.122` with no port, assumed :80, and published an issuer of
    # `http://<ip>/auth/realms/<realm>` while the stack is reached on :8000. That
    # breaks SSO in two ways at once: the browser is redirected to a port nothing
    # listens on, and the `iss` in the ID token never matches OIDC_ISSUER, so
    # every token is rejected. $http_host preserves whatever host:port the client
    # actually used, so this stays correct for any BASE_PORT.
    location /auth/ {
        set                $up_kc keycloak;
        proxy_pass         http://$up_kc:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto; # normalized (TLS-front pass-through, see map)
        proxy_set_header   X-Forwarded-Host $http_host;
        # Keycloak's fresh-login responses carry large headers (KC_RESTART is a
        # ~1.5KB JWE cookie; auth redirects embed PKCE/nonce/state). nginx's
        # default 4-8k header buffers overflow on a cookie-less first visit
        # ("upstream sent too big header" → 502, seen live 2026-08-03 from an
        # incognito window). Standard Keycloak-behind-nginx sizing:
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}
