# syslog-ng — shared body (options / source / parser).
#
# Included by BOTH top-level variants so they cannot drift apart:
#   syslog-ng.conf      — plaintext forward to vector-aggregator (base default)
#   syslog-ng-tls.conf  — mesh-TLS forward (compose.tls.yml / lab override)
# The only thing a variant owns is the d_vector destination + the log path.
# (No @version here — the directive belongs to the top-level file only.)

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    # F-48: statistics were switched OFF (freq(0)). syslog-ng maintains per
    # destination `dropped` / `queued` / `processed` counters — with stats
    # disabled NOTHING emits them, so device syslog could be (and was) dropped
    # during a vector-aggregator restart with the counter deliberately muted.
    # Device syslog is the highest-value RCA evidence class (link_down, BGP
    # state, optics), and these losses correlate with deployments — i.e. they
    # happen exactly when someone is changing something.
    #
    # freq(60) emits the counters to stdout once a minute; the Docker log driver
    # already ships stdout to vector-aggregator, so they land in the applogs
    # lane and are greppable/searchable with no new scrape target. level(1)
    # includes per-destination detail (level(0) is totals only, which cannot
    # tell you WHICH destination dropped).
    stats(freq(60) level(1));
    # No `-- MARK --` lines (tracker 387, 2026-11-11). At syslog-ng's default (every 1200 s
    # of an idle destination) this edge wrote its OWN mark into d_vector: a record with the
    # container id as hostname, no program, facility syslog, info, and no frame facts. It
    # was stored as device syslog from a "device" that does not exist, and it was the one
    # unparsed family left on the lab that no device sent. Nothing reads it: the liveness
    # of this edge is its healthcheck, the stats counters above (stdout -> applogs) and
    # the watchdog's ingest checks, none of which look for a mark. A DEVICE's own mark
    # (sysklogd `-m`) is received like any other line and is untouched by this option,
    # which governs only the marks syslog-ng itself generates.
    mark-freq(0);
    bad_hostname("^gconfd$");
    # keep_hostname(yes) — DELIBERATE, and what it does NOT mean (TENANT-HIGH-3).
    #
    # We keep the hostname the SENDER wrote instead of overwriting it with the
    # peer address, because it is the only device identifier that survives NAT
    # and it is what every downstream lane joins on (RCA entity resolution,
    # per-device buckets, the device→tenant lookup). Rewriting it would break
    # device identification for every NATed and relayed device on the network.
    #
    # But this source listens on UDP+TCP/514 with NO ACL and NO authentication:
    # the hostname is an UNVERIFIED CLAIM by whoever sent the packet. Anything
    # that can route to this port can write any hostname it likes. The platform
    # therefore does NOT let the hostname decide tenancy on its own:
    #
    #   1. vector/vector.yaml resets .tenant_id and re-derives it SOLELY from
    #      device_tenant.csv (exported by the API from its own inventory). A
    #      hostname the inventory does not know gets tenant_id="" — untagged,
    #      platform-only under the strict ClickHouse row policy — never a guess.
    #   2. Log CONTENT may not set tenancy at all; the FortiGate `devname=`
    #      re-attribution that used to do exactly that has been removed.
    #   3. src/correlation/main.py (verified_tenant) re-runs the same registry
    #      lookup on the hostname the event carries and REFUSES + quarantines
    #      any event whose tenant_id it cannot reproduce, with a SECURITY: log
    #      line. A claimed tenant is never persisted on the strength of the
    #      claim alone.
    #
    # RESIDUAL RISK, stated rather than papered over: a sender that both reaches
    # this port and knows a real device hostname of a real tenant still lands in
    # that tenant's lane, because the registry legitimately maps that hostname to
    # that tenant. No app-layer check can close that — it needs transport
    # authentication. The supported hardening, in order of effort: restrict the
    # published SYSLOG_PORT to the management network / add a host firewall rule,
    # then move devices to RFC5425 syslog-over-TLS with client certificates and
    # bind tenancy to the certificate rather than to the message.
    keep_hostname(yes);
    # Log-time standard (docs/design/log-time-standard.md): keep the DEVICE's
    # timestamp (origin time), never re-stamp with receive time.
    keep-timestamp(yes);
    # RFC 3164 timestamps carry NO timezone (and no year). Without this option
    # syslog-ng assumes the timestamp is in ITS OWN local zone — i.e. whatever
    # TZ the container happens to run in — which silently shifts every RFC 3164
    # message from a device whose clock zone differs. Pin the assumption
    # EXPLICITLY to UTC: the platform requires device clocks in UTC (NTP), and
    # the downstream RFC 5424 relay to vector stamps this zone into the offset.
    # Devices that must log in a local zone are a per-site override (follow-up
    # slice: per-source recv-time-zone from env/config). RFC 5424 messages
    # carry their own offset and are NOT affected by this option.
    recv-time-zone("UTC");
    # The relay carries milliseconds. At the default 0 digits every frame was cut to
    # the second on its way to Vector, and an engine that orders onsets lost the order
    # of two events in one second.
    frac-digits(3);
    # BOUND ON ONE FRAME (CLAUDE.md §3, §9). The longest frame the edge reads, in bytes.
    # The kernel drops the rest of a longer UDP datagram. The rest of a longer TCP line
    # arrives as further frames, one per 32 KiB, with no valid header: counted, stored and
    # unable to alarm (trim-large-messages does not stop this on tcp() in 4.7.1, measured).
    # The relay frame can reach 7 times this after escaping (raw 2x, structured data 4x,
    # message 1x), so the aggregator's syslog_in.max_length is 256 KiB: keep the two in
    # step, and keep tests/test_syslog_edge_framing.py's oversized cases in step with
    # both. A frame this long is counted (frame_problem=oversized in the aggregator).
    log-msg-size(32768);
};

source s_network {
    # flags(no-parse, sanitize-utf8) (tracker 387, PR 10). NO framing happens here:
    # p_frame below chooses the parser from the bytes, which a source cannot do. And a
    # frame reaches the relay only as valid UTF-8, because Vector's octet decoder treats
    # one bad byte as a broken STREAM: it drops the connection, and syslog-ng waits
    # time-reopen (60 s) before it reconnects, so one datagram stalled every device's
    # syslog. Bad bytes become their \xNN text.
    #
    # so-rcvbuf (finder 2026-08-14): device syslog arrives in bursts exactly
    # when it matters most — link-flap fan-out, reboot storms after a power
    # event. With no explicit buffer the kernel default applies (rmem_default,
    # ~208 KiB): a burst overflows the socket and the KERNEL drops datagrams
    # before syslog-ng ever reads them. Those drops never touch the F-48
    # dropped/queued counters (syslog-ng only counts what it READ) — they land
    # solely in the container-netns /proc/net/snmp UDP RcvbufErrors, which
    # nothing scrapes. 8 MiB absorbs roughly a second of full-rate-GbE burst.
    #
    # CLAMP CAVEAT — this request is silently capped at net.core.rmem_max, a
    # HOST-GLOBAL sysctl (not namespaced: it cannot be set per-container, and
    # syslog-ng 4.7 uses plain SO_RCVBUF with no SO_RCVBUFFORCE fallback —
    # verified against the pinned image's libafsocket.so, so CAP_NET_ADMIN
    # would not help either). On a default host (rmem_max = 212992) the full
    # 8 MiB takes effect only after
    #     sysctl -w net.core.rmem_max=8388608   (persist in /etc/sysctl.d/)
    # Until then syslog-ng warns at startup — "The kernel refused to set the
    # receive buffer (SO_RCVBUF) to the requested size" — which the Docker log
    # driver ships into the platformlogs lane: grep for it after deploy.
    udp(ip(0.0.0.0) port(514) so-rcvbuf(8388608) so-reuseport(1) flags(no-parse, sanitize-utf8));
    # max-connections bounds CONCURRENT TCP peers on this driver (both
    # published host ports, 514 and ${SYSLOG_PORT}, map onto it). The previous
    # 64 meant the 65th TCP-logging device was accept()ed and immediately
    # closed with only a stderr line — its syslog silently never arrived, and
    # the refusal is invisible from the device side. 1024 covers a large fleet
    # at the cost of one fd + one input window per connection (well inside the
    # container's default fd limit). Fleet sizing: keep this ABOVE the number
    # of devices that log over TCP, and raise it BEFORE a fleet grows toward
    # it — there is no metric that counts the refusals.
    tcp(ip(0.0.0.0) port(514) max-connections(1024) so-reuseport(1) flags(no-parse, sanitize-utf8));
    # The non-privileged lab port (SYSLOG_PORT, default 5514), published
    # host:N -> container:N — host port == container port so Docker's conntrack
    # flush covers it after a recreate (tracker 373; see the compose ports
    # comment). `SYSLOG_PORT` is read from the environment (compose sets it).
    # so-reuseport on both pairs: an operator who sets SYSLOG_PORT=514 gets two
    # sockets on one port in one pipeline, not a bind failure. Same buffer and
    # connection limits as 514.
    udp(ip(0.0.0.0) port(`SYSLOG_PORT`) so-rcvbuf(8388608) so-reuseport(1) flags(no-parse, sanitize-utf8));
    tcp(ip(0.0.0.0) port(`SYSLOG_PORT`) max-connections(1024) so-reuseport(1) flags(no-parse, sanitize-utf8));
};

# ── FRAMING, for every vendor (tracker 387, PR 10) ──────────────────────────────
#
# THE DEFECT THIS REPLACES. The source parsed each frame, then a syslog-parser() ran
# again over $MSG. That text has no PRI, so PRI became 13 (user.notice) for EVERY vendor
# and the timestamp became the receive time. An RFC 5424 frame went through the legacy
# parser both times (syslog-ng only uses its RFC 5424 parser under syslog-protocol,
# modules/syslogformat/syslog-format.c), leaving `3875 - - ` at the front of the message.
#
# WHY HERE AND NOT IN VECTOR. Vector's syslog parser, given the same fixtures, produced
# NO RECORD AT ALL for 12 of 31 (no-hostname IOS, ASA EMBLEM, NX-OS, IOS-XR, FortiGate,
# every malformed frame), and it writes each structured-data element onto the top of the
# event, so `[hostname y="evil"]` replaced the hostname. syslog-ng's legacy parser
# understands the Cisco sequence number and timestamp markers, and this branch costs one
# anchored regex a frame on the 4-core box.
#
# THE BRANCHES, in order. Every frame leaves with `.cx.frame` naming the branch taken.
#   rfc5424         `<PRI>1 ` that the strict parser accepts
#   malformed_5424  `<PRI>1 ` that it refuses: truncated, or a bad timestamp
#   no_header       `<PRI>key=value ...`, no syslog header at all
#   rfc3164         any other valid PRI, after the shape rewrites below
#   malformed_pri   `<` with no valid PRI: empty, not a number, above 191
#   no_pri          no `<` at all: RFC 3164 §4.3.3 says read it with the default PRI
#
# A MALFORMED FRAME IS NOT PARSED, it keeps PRI 13 and its whole text as the message.
# This is safety, not tidiness: the legacy parser reads `<>` as PRI 0, kern.emerg, which
# the engine's generic net would treat as a critical alarm; and a failed parse otherwise
# injects syslog-ng's own "Error processing log message" text at severity err.
filter f_valid_pri { message('^<(?:[0-9]|[1-9][0-9]|1[0-8][0-9]|19[01])>'); };
filter f_any_pri { message('^<'); };
filter f_rfc5424 { message('^<[0-9]{1,3}>1 '); };

parser p_rfc5424 { syslog-parser(flags(syslog-protocol) drop-invalid(yes)); };
parser p_rfc3164 { syslog-parser(drop-invalid(yes)); };
parser p_no_header { syslog-parser(flags(no-header) drop-invalid(yes)); };

# Frame shapes the legacy parser cannot read, normalised BEFORE it runs. They are data,
# in telemetry-catalog/vendor-packs/ (`edge_shapes`), and they name no vendor here.
# >>> BEGIN GENERATED-EDGE-SHAPES (scripts/gen-syslog-packs.py)
# GENERATED from telemetry-catalog/vendor-packs/*.yaml. DO NOT EDIT: change a
# pack and re-run scripts/gen-syslog-packs.py; a drift test fails on a stale copy.
# standard.key_value_body (doc_claimed)
filter f_shape_no_header { message('^<[0-9]{1,3}>[a-zA-Z_][a-zA-Z0-9_]*="?[^ ]* [a-zA-Z_][a-zA-Z0-9_]*='); };
rewrite r_edge_shapes {
    # standard.unpadded_day (doc_claimed)
    subst('^(<[0-9]{1,3}>[A-Z][a-z]{2}) ([1-9]) ([0-9]{2}:[0-9]{2}:[0-9]{2})', '$1  $2 $3', value("MESSAGE"));
    # standard.colon_after_pri (doc_claimed)
    subst('^(<[0-9]{1,3}>):', '$1', value("MESSAGE"));
    # standard.zone_word_after_time (doc_claimed)
    subst('^(<[0-9]{1,3}>(?:[0-9]+: )?[*.]?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?) [A-Z]{2,5}: ', '$1: ', value("MESSAGE"));
    # standard.host_before_time (doc_claimed)
    subst('^(<[0-9]{1,3}>)(?:[0-9]+: )?((?![0-9]+:)[A-Za-z0-9._-]+): [*.]?(?:[0-9]{4} )?([A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?)(?: [A-Z]{2,5})?: ', '$1$3 $2 ', value("MESSAGE"));
    # standard.node_before_time (doc_claimed)
    subst('^(<[0-9]{1,3}>)[0-9]+: ([A-Za-z0-9._-]+) [A-Za-z0-9/_-]+:([A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?)(?: [A-Z]{2,5})? ?: ', '$1$3 $2 ', value("MESSAGE"));
    # standard.sequence_number_without_time (lab_validated)
    subst('^(<[0-9]{1,3}>[0-9]{1,10}: )(?!%|[*.]?(?:[0-9]{4} )?[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}T|[A-Za-z0-9._/#-]+(?:\[[0-9]+\])?: |[A-Za-z0-9._-]+ [A-Za-z0-9/_-]+:[A-Z][a-z]{2} )', '$1: ', value("MESSAGE"));
    # standard.severity_word_as_program (doc_claimed)
    subst('^(<[0-9]{1,3}>[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ [^ ]+) (?:EMERG|ALERT|CRIT|ERR|WARNING|WARN|NOTICE|INFO|DEBUG) ([^ :]+: )', '$1 $2', value("MESSAGE"));
};
# <<< END GENERATED-EDGE-SHAPES

# The frame as received (after UTF-8 sanitising), kept for message_original (owner D5).
rewrite r_raw_frame {
    set("$MSG" value(".cx.raw"));
};

# A Cisco-style line with no process tag: `%LINK-3-UPDOWN: Interface ...`. The legacy
# parser takes the mnemonic for a program name. It is not one: put it back in the
# message, where the same line from a tagged sender has it (`Rib: %BGP-3-...`), so the
# body grammars and the engine read one shape. RFC 5424 frames never come through here.
# The second shape is the module/level/mnemonic tag `%%10IFNET/3/LINK_UPDOWN` (one or two
# percent signs, a two-digit version, an optional `(l)` location letter): the same
# mistake, put back the same way (vendor-packs/hpe_comware.yaml).
rewrite r_mnemonic_is_not_a_program {
    set("$PROGRAM: $MSG" value("MESSAGE")
        condition(program('^%[A-Z][A-Za-z0-9_-]*-[0-7]-[A-Za-z0-9_-]+$')
                  or program('^%%?[0-9]{2}[A-Z][A-Z0-9_]*/[0-7]/[A-Z][A-Z0-9_]*(\([a-z]\))?$')));
    unset(value("PROGRAM")
        condition(program('^%[A-Z][A-Za-z0-9_-]*-[0-7]-[A-Za-z0-9_-]+$')
                  or program('^%%?[0-9]{2}[A-Z][A-Z0-9_]*/[0-7]/[A-Z][A-Z0-9_]*(\([a-z]\))?$')));
};

parser p_frame {
    channel {
        rewrite(r_raw_frame);
        if (filter(f_rfc5424) and filter(f_valid_pri)) {
            if {
                parser(p_rfc5424);
                rewrite { set("rfc5424" value(".cx.frame")); };
            } else {
                rewrite { set("malformed_5424" value(".cx.frame")); };
            };
        } elif (filter(f_shape_no_header) and filter(f_valid_pri)) {
            parser(p_no_header);
            rewrite { set("no_header" value(".cx.frame")); };
        } elif (filter(f_valid_pri)) {
            rewrite(r_edge_shapes);
            parser(p_rfc3164);
            rewrite(r_mnemonic_is_not_a_program);
            rewrite { set("rfc3164" value(".cx.frame")); };
        } elif (filter(f_any_pri)) {
            rewrite { set("malformed_pri" value(".cx.frame")); };
        } else {
            parser(p_rfc3164);
            rewrite { set("no_pri" value(".cx.frame")); };
        };
    };
};

# DOES THE FRAME STATE AN INSTANT? RFC 3339 with `Z` or a numeric offset does. An RFC 3164
# time has no zone and no year, and a zone WORD (`UTC`, `PST`) is dropped by the shape
# rewrites above, so neither proves anything: it is a claim read through recv-time-zone.
# The aggregator's syslog_sender decides what to do with that (log-time standard R2, R4).
# Read from the raw frame, because a parsed $ISODATE always has an offset, stated or assumed.
filter f_stated_zone {
    match('^(?:<[0-9]{1,3}>)?(?:1 |:)?(?:[0-9]+: )?[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(?:Z|[+-][0-9]{2}:?[0-9]{2})(?:[ :]|$)'
          value(".cx.raw"));
};

# What leaves on the relay's structured data. A sender's own SD element ids are NOT
# forwarded as elements: Vector writes each element onto the top of the event, so an
# element named after a pipeline field would be a field injection. They travel as one
# escaped text value, `cx.sd`, and only `cx` and `origin` can reach the aggregator. The
# order matters: ${SDATA} must be read before groupunset() empties it, and origin.ip is
# set last by r_sender_address.
rewrite r_frame_facts {
    set("${SDATA}" value(".cx.sd"));
    groupunset(values(".SDATA.*"));
    set("${.cx.frame}" value(".SDATA.cx.frame"));
    set("${.cx.raw}" value(".SDATA.cx.raw"));
    set("${.cx.sd}" value(".SDATA.cx.sd"));
    # When THIS box read the frame. Not the aggregator's now(): a frame held in the disk
    # buffer through an aggregator restart was still received on time.
    set("${R_ISODATE}" value(".SDATA.cx.recv"));
    set("stated" value(".SDATA.cx.zone") condition(filter(f_stated_zone)));
};

# The SENDER's network address, carried to Vector (tracker 371, P0.5). The relay
# to the aggregator is a TCP connection FROM THIS CONTAINER, so Vector's syslog
# source records syslog-ng's own address as source_ip — every syslog document
# said 172.18.0.12 and the device's address was lost at this hop. The address
# the datagram actually came from is stamped into the RFC 5424 `origin` element
# (`ip`: "the IP address of the originator", RFC 5424 §7.2) and restored to
# source_ip by the aggregator. set() OVERWRITES an origin ip the device itself
# claimed: the network fact wins over the message's claim. It is routing, not
# authentication — tenancy is never decided by it (tenant = the channel).
rewrite r_sender_address {
    set("${SOURCEIP}" value(".SDATA.origin.ip"));
};
