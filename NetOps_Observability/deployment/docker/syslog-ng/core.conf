# syslog-ng — shared body (options / source / parser).
#
# Included by BOTH top-level variants so they cannot drift apart:
#   syslog-ng.conf      — plaintext forward to vector-aggregator (base default)
#   syslog-ng-tls.conf  — mesh-TLS forward (compose.tls.yml / lab override)
# The only thing a variant owns is the d_vector destination + the log path.
# (No @version here — the directive belongs to the top-level file only.)

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    # F-48: statistics were switched OFF (freq(0)). syslog-ng maintains per
    # destination `dropped` / `queued` / `processed` counters — with stats
    # disabled NOTHING emits them, so device syslog could be (and was) dropped
    # during a vector-aggregator restart with the counter deliberately muted.
    # Device syslog is the highest-value RCA evidence class (link_down, BGP
    # state, optics), and these losses correlate with deployments — i.e. they
    # happen exactly when someone is changing something.
    #
    # freq(60) emits the counters to stdout once a minute; the Docker log driver
    # already ships stdout to vector-aggregator, so they land in the applogs
    # lane and are greppable/searchable with no new scrape target. level(1)
    # includes per-destination detail (level(0) is totals only, which cannot
    # tell you WHICH destination dropped).
    stats(freq(60) level(1));
    bad_hostname("^gconfd$");
    # keep_hostname(yes) — DELIBERATE, and what it does NOT mean (TENANT-HIGH-3).
    #
    # We keep the hostname the SENDER wrote instead of overwriting it with the
    # peer address, because it is the only device identifier that survives NAT
    # and it is what every downstream lane joins on (RCA entity resolution,
    # per-device buckets, the device→tenant lookup). Rewriting it would break
    # device identification for every NATed and relayed device on the network.
    #
    # But this source listens on UDP+TCP/514 with NO ACL and NO authentication:
    # the hostname is an UNVERIFIED CLAIM by whoever sent the packet. Anything
    # that can route to this port can write any hostname it likes. The platform
    # therefore does NOT let the hostname decide tenancy on its own:
    #
    #   1. vector/vector.yaml resets .tenant_id and re-derives it SOLELY from
    #      device_tenant.csv (exported by the API from its own inventory). A
    #      hostname the inventory does not know gets tenant_id="" — untagged,
    #      platform-only under the strict ClickHouse row policy — never a guess.
    #   2. Log CONTENT may not set tenancy at all; the FortiGate `devname=`
    #      re-attribution that used to do exactly that has been removed.
    #   3. src/correlation/main.py (verified_tenant) re-runs the same registry
    #      lookup on the hostname the event carries and REFUSES + quarantines
    #      any event whose tenant_id it cannot reproduce, with a SECURITY: log
    #      line. A claimed tenant is never persisted on the strength of the
    #      claim alone.
    #
    # RESIDUAL RISK, stated rather than papered over: a sender that both reaches
    # this port and knows a real device hostname of a real tenant still lands in
    # that tenant's lane, because the registry legitimately maps that hostname to
    # that tenant. No app-layer check can close that — it needs transport
    # authentication. The supported hardening, in order of effort: restrict the
    # published SYSLOG_PORT to the management network / add a host firewall rule,
    # then move devices to RFC5425 syslog-over-TLS with client certificates and
    # bind tenancy to the certificate rather than to the message.
    keep_hostname(yes);
    # Log-time standard (docs/design/log-time-standard.md): keep the DEVICE's
    # timestamp (origin time), never re-stamp with receive time.
    keep-timestamp(yes);
    # RFC 3164 timestamps carry NO timezone (and no year). Without this option
    # syslog-ng assumes the timestamp is in ITS OWN local zone — i.e. whatever
    # TZ the container happens to run in — which silently shifts every RFC 3164
    # message from a device whose clock zone differs. Pin the assumption
    # EXPLICITLY to UTC: the platform requires device clocks in UTC (NTP), and
    # the downstream RFC 5424 relay to vector stamps this zone into the offset.
    # Devices that must log in a local zone are a per-site override (follow-up
    # slice: per-source recv-time-zone from env/config). RFC 5424 messages
    # carry their own offset and are NOT affected by this option.
    recv-time-zone("UTC");
};

source s_network {
    udp(ip(0.0.0.0) port(514));
    tcp(ip(0.0.0.0) port(514) max-connections(64));
};

# Light parsing so downstream consumers can rely on uniform fields.
# (No flags — `no-piggyback-errors` was removed from syslog-ng 4.x.)
parser p_syslog {
    syslog-parser();
};
