@version: 4.7
@include "scl.conf"

# syslog-ng — edge ingestion for Syslog (RFC3164 + RFC5424).
#
# Listens on UDP/TCP 514 inside the container (the compose file maps the
# host port via SYSLOG_PORT). Parses every message, then forwards to
# vector-aggregator over TCP. vector-aggregator's `syslog` source
# receives them in the standard syslog frame and ships to Redpanda.
#
# TIMEZONE POLICY (docs/design/log-time-standard.md) — timezone
# resolution happens exactly ONCE, here, at first parse:
#   1. If the payload carries an explicit offset (RFC 5424, or RFC 3164
#      variants with a zone), syslog-ng honors it.
#   2. Otherwise the source-level time-zone() below decides. It is
#      pinned to UTC — the documented site-default fallback — so
#      behavior no longer depends on the container's TZ. If a site's
#      devices log in a local zone, change time-zone() here (per-device
#      timezone config is a tracked follow-up slice).
#   3. Downstream tiers NEVER re-interpret the timestamp.
# The original message head (including the verbatim device timestamp)
# and the edge receive time are forwarded as RFC 5424 structured data
# [correlix@58700 ...] so Vector can stamp raw_timestamp / tz_assumed
# and skew detection can compare event time vs ingest time.

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    stats(freq(0));
    bad_hostname("^gconfd$");
    keep_hostname(yes);
    # Keep the sender's timestamp (never overwrite with receive time);
    # the receive time travels separately in [correlix@58700 ingest].
    keep_timestamp(yes);
};

source s_network {
    # store-raw-message keeps ${RAWMSG} (the verbatim wire bytes) so the
    # original timestamp string can be forwarded before any parsing.
    # time-zone(): zone assumed for payloads WITHOUT an explicit offset
    # (i.e. every plain RFC 3164 device) — UTC fallback per the
    # log-time standard. Explicit offsets in the payload always win.
    udp(ip(0.0.0.0) port(514)
        flags(store-raw-message)
        time-zone("UTC")
    );
    tcp(ip(0.0.0.0) port(514) max-connections(64)
        flags(store-raw-message)
        time-zone("UTC")
    );
};

# Light parsing so downstream consumers can rely on uniform fields.
# (No flags — `no-piggyback-errors` was removed from syslog-ng 4.x.)
parser p_syslog {
    syslog-parser();
};

# Time provenance, carried as RFC 5424 structured data:
#   raw    — first 64 bytes of the verbatim wire message (contains the
#            original timestamp string exactly as the device sent it)
#   ingest — when this edge received the message (ISO 8601, with offset)
# Vector's syslog source exposes these to the normalizer, which derives
# raw_timestamp / ingest_time / tz_assumed from them.
rewrite r_time_meta {
    set("$(substr ${RAWMSG} 0 64)" value(".SDATA.correlix@58700.raw"));
    set("${R_ISODATE}" value(".SDATA.correlix@58700.ingest"));
};

# Forward to vector-aggregator on its syslog port. time-zone(UTC) +
# frac-digits(3) render the outgoing RFC 5424 ISOTIMESTAMP in UTC with
# millisecond precision — same instant, explicit offset, regardless of
# container TZ.
destination d_vector {
    syslog("vector-aggregator"
        transport("tcp")
        port(6601)
        flags(syslog-protocol)
        time-zone("UTC")
        frac-digits(3)
    );
};

log {
    source(s_network);
    parser(p_syslog);
    rewrite(r_time_meta);
    destination(d_vector);
};
