# Telegraf — edge SNMP poller.
#
# Discovers (or is statically given) the device list, polls SNMP at the
# configured interval, and ships InfluxDB line-protocol metrics over TCP
# to vector-aggregator. vector-aggregator parses, normalizes, and routes
# the events into the metrics topic on the Kafka bus.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

# ---- inputs ----------------------------------------------------------------

# SNMP polling. Replace the agents array with your device IPs and update
# the credentials. Multiple [[inputs.snmp]] blocks can coexist for
# different credential sets / device groups.
[[inputs.snmp]]
  agents = ["udp://10.0.0.1:161", "udp://10.0.0.2:161"]
  version = 2
  community = "public"
  timeout = "5s"
  retries = 1

  # Identity
  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "DISMAN-EVENT-MIB::sysUpTimeInstance"

  # Interface table
  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = "IF-MIB::ifName"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "IF-MIB::ifHCInOctets"
    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "IF-MIB::ifHCOutOctets"
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "IF-MIB::ifOperStatus"

# Local agent metrics so the operator can monitor Telegraf itself.
[[inputs.internal]]
  collect_memstats = false

# ---- outputs ---------------------------------------------------------------

# Ship directly to VictoriaMetrics via its Prometheus remote_write
# endpoint. Skipping Vector for metrics — Vector's Metric/Kafka path
# has type-system rough edges; VictoriaMetrics natively accepts both
# the InfluxDB line protocol and Prometheus remote_write, so we go
# straight there.
[[outputs.http]]
  url = "http://victoria:8428/api/v1/write"
  data_format = "prometheusremotewrite"
  [outputs.http.headers]
    Content-Type     = "application/x-protobuf"
    Content-Encoding = "snappy"
    X-Prometheus-Remote-Write-Version = "0.1.0"
