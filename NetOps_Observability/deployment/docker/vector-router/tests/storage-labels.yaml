# storage-labels.yaml — `vector test` proof of what the router tier stamps for
# storage and for operators (tracker 387). Hand-written; nothing here is
# generated. Like parse-trace.yaml it declares NO transforms, so it runs against
# the shipped vector.yaml plus processors-default.yaml, and a config that drifted
# cannot go green over a copy of itself.
#
# tests/test_router_storage_labels.py runs this suite. Keep every dollar sign out
# of this file: Vector interpolates environment variables in the raw config text.
#
# The enrichment fixture is shared with the aggregator suite
# (../../vector/tests/fixtures/device_tenant.csv).

tests:
  # ── flows: the sampled OpenSearch path gets a stable id, a restore keeps its own ──
  - name: "flows sample: the document id comes from the coordinate"
    inputs:
      - insert_at: flows_os_stamped
        type: log
        log_fields:
          topic: "netops.flows"
          partition: 3
          offset: 42
    outputs:
      - extract_from: flows_os_stamped
        conditions:
          - type: vrl
            source: |
              assert_eq!(.cx_event_id, "cxk:netops.flows:3:42")
              assert_eq!(.sample_rate, 50)

  - name: "flows sample: a restored document keeps its own id"
    inputs:
      - insert_at: flows_os_stamped
        type: log
        log_fields:
          topic: "netops.flows"
          partition: 3
          offset: 42
          cx_event_id: "2b1f3c1e-8c7d-4f7a-9d3e-0c1a2b3c4d5e"
    outputs:
      - extract_from: flows_os_stamped
        conditions:
          - type: vrl
            source: |
              assert_eq!(.cx_event_id, "2b1f3c1e-8c7d-4f7a-9d3e-0c1a2b3c4d5e")

  # ── PR 3: the log lane leaves the metadata in place for the stages after it ──
  # The strip happens in the sink's encoder (`encoding.except_fields`), which
  # `vector test` cannot reach; tests/test_router_storage_labels.py proves that
  # half against a mock _bulk endpoint. What is proved here is the other half:
  # the anchor derives the document id from the coordinate, leaves the coordinate
  # for the counters downstream, and does not touch the receiver's dedup key.
  - name: "log lane: the receiver's message_key survives and the id comes from the coordinate"
    inputs:
      - insert_at: snmptrap_tagged
        type: log
        log_fields:
          message: "linkDown on eth0"
          device: "spine1"
          tenant_id: "lab"
          tenant_registry: "hit"
          message_key: "snmptrap:arista:spine1:1.3.6.1.6.3.1.1.5.3"
          topic: "netops.snmptrap"
          partition: 2
          offset: 41
          timestamp: "2026-11-09T11:05:07Z"
    outputs:
      - extract_from: snmptrap_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message_key, "snmptrap:arista:spine1:1.3.6.1.6.3.1.1.5.3")
              assert_eq!(.cx_event_id, "cxk:netops.snmptrap:2:41")
              assert_eq!(.topic, "netops.snmptrap")

  # ── PR 4 (owner D6): the attribution label, and what it may not change ──────
  # Each lane is proved twice with the same record, hit and miss, because the §3a
  # claim is that the label moves and the storage scope does not.
  - name: "log lane: a registry hit with a blank tenant is platform_owned, in the shared index"
    inputs:
      - insert_at: syslog_tagged
        type: log
        log_fields:
          message: "sshd: session opened"
          hostname: "leaf1"
          tenant_id: ""
          tenant_registry: "hit"
          topic: "netops.syslog"
    outputs:
      - extract_from: syslog_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "platform_owned")
              assert_eq!(.tenant_seg, "untagged")
              assert_eq!(.tenant_id, "")

  - name: "log lane: a registry miss stays unmatched, with the same scope"
    inputs:
      - insert_at: syslog_tagged
        type: log
        log_fields:
          message: "sshd: session opened"
          hostname: "unknown-box"
          tenant_id: ""
          tenant_registry: "miss"
          topic: "netops.syslog"
    outputs:
      - extract_from: syslog_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "unmatched")
              assert_eq!(.tenant_seg, "untagged")
              assert_eq!(.tenant_id, "")

  - name: "log lane: a blank tenant with no registry stamp has no proof of ownership"
    inputs:
      - insert_at: applogs_tagged
        type: log
        log_fields:
          message: "started"
          topic: "netops.applogs"
    outputs:
      - extract_from: applogs_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "unmatched")

  - name: "log lane: a tenant's registry hit and an authenticated producer keep their labels"
    inputs:
      - insert_at: snmptrap_tagged
        type: log
        log_fields:
          message: "linkDown"
          tenant_id: "lab"
          tenant_registry: "hit"
          topic: "netops.snmptrap"
      - insert_at: cloudlogs_tagged
        type: log
        log_fields:
          message: "s3 access"
          tenant_id: "lab"
          topic: "netops.cloudlogs"
    outputs:
      - extract_from: snmptrap_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "enriched")
              assert_eq!(.tenant_seg, "lab")
      - extract_from: cloudlogs_tagged
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "producer_stamped")
              assert_eq!(.tenant_seg, "lab")

  - name: "log lane: the debugger trace calls a platform device what it is"
    inputs:
      - insert_at: syslog_tagged
        type: log
        log_fields:
          message: "cx_synthetic=true cx_debug=01j9x4m2q7v8b3n5k6r0t1y2z3 correlix pipeline debug probe"
          tenant_id: ""
          tenant_registry: "hit"
          topic: "netops.syslog"
    outputs:
      - extract_from: syslog_tagged
        conditions:
          - type: vrl
            source: |
              t = string!(.cx_parse_trace)
              assert!(contains(t, "tenant_attribution=platform_owned"), t)
              assert!(contains(t, "attribution_reason=platform device:"), t)
              assert!(!contains(t, "UNATTRIBUTED"), t)

  - name: "flows: an exporter the registry knows with no tenant is platform_owned"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "leaf1"
          src_addr: "10.0.0.1"
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_registry, "hit")
              assert_eq!(.tenant_attribution, "platform_owned")
              assert_eq!(.tenant_seg, "untagged")
              assert_eq!(.tenant_id, "")

  - name: "flows: an unknown exporter stays unmatched, with the same scope"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "198.51.100.7"
          src_addr: "10.0.0.1"
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_registry, "miss")
              assert_eq!(.tenant_attribution, "unmatched")
              assert_eq!(.tenant_seg, "untagged")
              assert_eq!(.tenant_id, "")

  - name: "flows: a tenant claim on a platform exporter is refused, and the refusal wins the label"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "leaf1"
          tenant_id: "t_forged"
          src_addr: "10.0.0.1"
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_attribution, "claim_rejected")
              assert_eq!(.tenant_seg, "untagged")
              assert_eq!(.tenant_id, "")

  # ── PR 5: the sampling label, and the totals it must leave alone ────────────
  - name: "flows: an exporter that reports a rate is labelled reported, and no counter moves"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "spine1"
          src_addr: "10.0.0.1"
          sampling_rate: 512
          bytes: 1000
          packets: 10
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.sampling_status, "reported")
              assert_eq!(.sampling_rate, 512)
              assert_eq!(.bytes, 1000)
              assert_eq!(.packets, 10)
              assert!(!exists(.sample_rate), "the router's own OpenSearch sample stamp is not this lane's")

  - name: "flows: a rate of zero means none was reported, and no counter moves"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "spine1"
          src_addr: "10.0.0.1"
          sampling_rate: 0
          bytes: 1000
          packets: 10
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.sampling_status, "not_reported_1to1")
              assert_eq!(.sampling_rate, 0)
              assert_eq!(.bytes, 1000)
              assert_eq!(.packets, 10)

  - name: "flows: no rate field at all reads the same, and a producer cannot claim a status"
    inputs:
      - insert_at: flows_decoded
        type: log
        log_fields:
          sampler_address: "spine1"
          src_addr: "10.0.0.1"
          sampling_status: "reported"
          topic: "netops.flows"
    outputs:
      - extract_from: flows_decoded
        conditions:
          - type: vrl
            source: |
              assert_eq!(.sampling_status, "not_reported_1to1")

  - name: "flows: the OpenSearch copy keeps both facts, the exporter's and the router's own sample"
    inputs:
      - insert_at: flows_os_stamped
        type: log
        log_fields:
          sampling_status: "not_reported_1to1"
          sampling_rate: 0
    outputs:
      - extract_from: flows_os_stamped
        conditions:
          - type: vrl
            source: |
              assert_eq!(.sample_rate, 50)
              assert_eq!(.sampling_status, "not_reported_1to1")
              assert_eq!(.sampling_rate, 0)
