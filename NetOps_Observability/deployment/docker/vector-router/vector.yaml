# Vector — ROUTER tier.
#
# Consumes the netops.* topics from the Kafka bus and fans into the storage
# tier. Decoupling consumers via Kafka means:
#   * Storage outages don't drop ingestion — events buffer on the bus.
#   * Replay is one Vector restart + offset reset away.
#   * We can add new consumers (a SIEM, a data lake) without touching
#     the aggregator.
#
# Metrics (Telegraf) bypass Kafka and go directly to VictoriaMetrics
# via Telegraf's own remote_write — Vector's kafka sink doesn't fit
# the Metric encoding model cleanly. See telegraf.conf.

api:
  enabled: true
  address: 0.0.0.0:8686

# ----------------------------------------------------------------------------
# DURABILITY (F-04) — end-to-end acknowledgements.
#
# THE DEFECT THIS FIXES: every source on this tier is a `kafka` source. With
# acknowledgements off — the Vector default — those sources commit their
# consumer-group offset when the message is READ, not when the sink has
# accepted it. A router crash therefore lost up to 500 events per sink (the
# in-memory buffer) AND had already advanced the offset past them, so replay
# from Kafka could never recover them. The bus was doing its job; the router
# was throwing away the receipt.
#
# With this enabled the offset is only committed once the event is durably
# accepted downstream (OpenSearch / ClickHouse). Kafka is then a real replay
# buffer, which is why this tier needs no disk buffers of its own: the retained
# topic IS the buffer, and a restart resumes from the last acknowledged offset.
acknowledgements:
  enabled: true

# Sink healthchecks are enabled per-sink below (F-04). require_healthy stays
# FALSE on purpose: a healthcheck that refuses to start the router when
# OpenSearch is briefly down converts a storage blip into an ingestion outage,
# and Kafka is already buffering. false = report loudly (error log +
# component_errors_total), keep running, keep retrying.
healthchecks:
  enabled: true
  require_healthy: false

sources:
  internal_metrics:
    type: internal_metrics

  kafka_applogs:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.applogs"]
    group_id: "netops-router-applogs"
    decoding: { codec: json }

  kafka_syslog:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.syslog"]
    group_id: "netops-router-syslog"
    decoding: { codec: json }

  kafka_flows:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.flows"]
    group_id: "netops-router-flows"
    decoding: { codec: json }

  kafka_snmptrap:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.snmptrap"]
    group_id: "netops-router-snmptrap"
    decoding: { codec: json }

  # Unified Cloud Logs — tagged raw cloud log lines (cloud_family/cloud_provider/
  # resource_id) produced by the cloud poller (S3/CloudWatch lanes + CloudTrail)
  # and the aggregator's host lane. Indexed into netops-cloudlogs-{tenant}-* so
  # they are searchable as RAW logs, not only as correlation signals.
  kafka_cloudlogs:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.cloudlogs"]
    group_id: "netops-router-cloudlogs"
    decoding: { codec: json }

  # Cloud cost records (Wave 5 #18) — normalized daily cloud_cost records
  # produced by the cloud poller's cost lanes (AWS Cost Explorer / Azure Cost
  # Management). Routed to ClickHouse netops.cloud_costs (analytics; tenant
  # row policy) — cost is not a log, so no OpenSearch index.
  kafka_cloudcosts:
    type: kafka
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topics: ["netops.cloudcosts"]
    group_id: "netops-router-cloudcosts"
    decoding: { codec: json }

transforms:
  # #20 Phase 3 — per-tenant OpenSearch index routing (at-rest separation).
  # Each event already carries .tenant_id (stamped at the aggregator from the
  # device→tenant enrichment table; "" = untagged/global). Derive a filesystem-
  # /index-safe segment from it so the elasticsearch sinks can route each tenant's
  # docs into its OWN daily index (netops-{signal}-{tenant}-{date}). Untagged data
  # goes to a shared "untagged" index. The API read path only ever names the
  # caller's own index pattern, so another tenant's docs are unreachable even if a
  # query filter is missed. Keep the segment lowercase + [a-z0-9_-] only (OS index
  # naming rules); an empty/odd tenant collapses to "untagged".
  applogs_tagged:
    type: remap
    inputs: [kafka_applogs]
    # &log_lane: the tenant-segment + timestamp normalisation every log-shaped
    # lane needs. Anchored (not copy-pasted) so the four lanes can never drift
    # apart again — divergence between sibling lanes is what caused DEF-6.
    source: &log_lane |
      seg = downcase(to_string(.tenant_id) ?? "")
      if seg == "" { seg = "untagged" } else { seg = replace(seg, r'[^a-z0-9_-]', "-") }
      .tenant_seg = seg

      # ── `ts` normalisation (DEF-6, 2026-07-21) ──────────────────────────
      # Producers on these topics emit `ts` in three incompatible shapes:
      # float epoch-SECONDS (Python time.time()), an RFC3339 string, and
      # absent. `ts` is not declared in the index template, so OpenSearch
      # DYNAMICALLY mapped it as a date from the first integer it saw — every
      # float after that died with mapper_parsing_exception. A mapping
      # rejection is not retriable, so Vector dropped those events for good:
      # measured 217 events lost in 30 min on the applogs lane alone (~10k/day),
      # with no dead-letter and no alert.
      #
      # Coerce every shape to integer epoch MILLISECONDS — the same contract
      # flows_decoded already enforces. The unit is inferred by magnitude, so a
      # producer that changes precision (s → ms → µs → ns) can never silently
      # poison the index again. An unparseable value is preserved as a STRING
      # in .ts_invalid rather than dropped, so the bad producer is greppable
      # instead of invisible.
      if exists(.ts) {
        if is_string(.ts) {
          parsed, perr = parse_timestamp(to_string(.ts) ?? "", format: "%+")
          if perr == null {
            .ts = to_unix_timestamp(parsed, unit: "milliseconds")
          } else {
            .ts_invalid = to_string(.ts) ?? ""
            del(.ts)
          }
        } else {
          n = to_float(.ts) ?? -1.0
          if n <= 0.0 {
            .ts_invalid = to_string(.ts) ?? ""
            del(.ts)
          } else if n < 100000000000.0 {
            # < 1e11 → epoch seconds (1e11 s is year 5138; no real ms value is
            # this small), e.g. Python time.time() = 1784658034.77
            .ts = to_int(floor(n * 1000.0))
          } else if n < 100000000000000.0 {
            .ts = to_int(floor(n))                 # already milliseconds
          } else if n < 100000000000000000.0 {
            .ts = to_int(floor(n / 1000.0))        # microseconds
          } else {
            .ts = to_int(floor(n / 1000000.0))     # nanoseconds
          }
        }
      }

  syslog_tagged:
    type: remap
    inputs: [kafka_syslog]
    source: *log_lane

  snmptrap_tagged:
    type: remap
    inputs: [kafka_snmptrap]
    source: *log_lane

  # Cloud logs carry an explicit tenant_id from the source (cloud logs have no
  # device to enrich from — the poller/aggregator stamp it). Derive the same
  # index segment; a `.timestamp` is stamped at the source, so the API's
  # timestamp sort/range works unchanged.
  cloudlogs_tagged:
    type: remap
    inputs: [kafka_cloudlogs]
    source: *log_lane

  # goflow2 renders the IP protocol as a NAME ("TCP"/"UDP"/"ICMP"…), but the
  # ClickHouse flows.proto column is UInt8 (the IANA number). Without this
  # coercion every flow batch fails the CH insert with a 400 and is dropped —
  # which is why netops.flows stayed empty. Map the common names to numbers;
  # leave already-numeric values (NetFlow v9/IPFIX) untouched.
  flows_decoded:
    type: remap
    inputs: [kafka_flows]
    source: |
      proto_names = {
        "HOPOPT": 0, "ICMP": 1, "IGMP": 2, "TCP": 6, "UDP": 17,
        "GRE": 47, "ESP": 50, "AH": 51, "ICMPv6": 58, "EIGRP": 88,
        "OSPF": 89, "SCTP": 132
      }
      if is_string(.proto) {
        .proto = to_int(get(proto_names, [.proto]) ?? 0) ?? 0
      } else {
        .proto = to_int(.proto) ?? 0
      }
      # tcpControlBits (IPFIX IE6 / NetFlow TCP_FLAGS): ClickHouse column is
      # UInt16 — coerce like .proto so a string-typed value can't 400 the batch.
      .tcp_flags = to_int(.tcp_flags) ?? 0
      # Log-time standard: derive the ClickHouse `ts` from goflow2's receive
      # stamp (time_received_ns, UTC epoch) instead of leaving it to the column
      # DEFAULT now64() — which re-stamps every flow with the INSERT time, so
      # bus lag/replay would misplace flows on the timeline. Inserted as an
      # epoch-ms INTEGER (S4/R1): ClickHouse reads an integer as a scaled UTC
      # Unix timestamp for DateTime64(3), so unlike a zone-less string it can
      # never be re-interpreted in the server/column timezone. Flow start/end
      # capture is a schema follow-up (goflow2 time_flow_start/end_ns).
      trcv = to_int(.time_received_ns) ?? 0
      if trcv > 0 {
        # floor() of an already-coalesced int is infallible — VRL rejects a
        # dangling `??` on it (exit 78 at boot, caught in deploy 2026-07-17).
        .ts = to_int(floor(trcv / 1000000))
      }
      # Preserve the flow protocol family (goflow2 `type`) so the UI can tell
      # NetFlow vs IPFIX vs sFlow apart — they otherwise share one schema.
      ft = to_string(.type) ?? ""
      if starts_with(ft, "NETFLOW") {
        .flow_type = "netflow"
      } else if ft == "IPFIX" {
        .flow_type = "ipfix"
      } else if starts_with(ft, "SFLOW") {
        .flow_type = "sflow"
      } else {
        .flow_type = "unknown"
      }
      # #20 Phase 3 — per-tenant index segment (see applogs_tagged).
      seg = downcase(to_string(.tenant_id) ?? "")
      if seg == "" { seg = "untagged" } else { seg = replace(seg, r'[^a-z0-9_-]', "-") }
      .tenant_seg = seg

  # Cloud cost records → the ClickHouse cloud_costs schema. Zero-trust gate on
  # the bus payload: only kind=cloud_cost with a well-formed day passes; the
  # amount is coerced to a float so a string-typed value can't 400 the whole
  # insert batch (the flows proto lesson). `ts` is converted to epoch-ms
  # (log-time standard S4/R1 — an integer can never be re-interpreted in the
  # server timezone); an unparseable ts is dropped so the column DEFAULT
  # (insert time) applies rather than failing the batch.
  cloudcosts_normalized:
    type: remap
    inputs: [kafka_cloudcosts]
    drop_on_abort: true
    drop_on_error: true
    # Aborted/errored records used to vanish with no trace. Reroute them to the
    # `.dropped` output so the dead-letter sink below can keep the evidence
    # (DEF-6 follow-up: nothing may be discarded invisibly).
    reroute_dropped: true
    source: |
      if (to_string(.kind) ?? "") != "cloud_cost" { abort }
      if !match(to_string(.day) ?? "", r'^\d{4}-\d{2}-\d{2}$') { abort }
      .amount = to_float(.amount) ?? 0.0
      .tenant_id = to_string(.tenant_id) ?? ""
      tsp, terr = parse_timestamp(to_string(.ts) ?? "", format: "%+")
      if terr == null {
        .ts = to_unix_timestamp(tsp, unit: "milliseconds")
      } else {
        del(.ts)
      }

  # Dead-letter encoder — the last stop before an event would be discarded.
  # Every field is flattened into ONE json string so a poisoned document can
  # never conflict with the dead-letter index's own mapping (a dead-letter that
  # can itself be rejected is worthless). Keep this shape boring on purpose.
  deadletter_encoded:
    type: remap
    inputs: [cloudcosts_normalized.dropped]
    source: |
      . = {
        "dropped_at": format_timestamp!(now(), format: "%+"),
        "lane": "cloudcosts",
        "reason": to_string(.metadata.message) ?? "aborted or failed remap",
        "raw": encode_json(.)
      }

  # OS gets a 1-in-50 SAMPLE of flows — ClickHouse is the canonical flow store.
  # An unsampled mirror at generator/production fps wrote ~4 GB/day into one
  # index, hit the disk flood-stage watermark, and turned EVERY log index
  # read-only (2026-06-10 outage: syslog/traps/applogs all stopped).
  flows_os_sample:
    type: sample
    inputs: [flows_decoded]
    rate: 50

sinks:
  prometheus_internal:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598

  # Application + container logs → OpenSearch
  opensearch_applogs:
    type: elasticsearch
    inputs: [applogs_tagged]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-applogs-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  # Dead-letter → OpenSearch. Small by construction (only genuinely malformed
  # records land here), so a non-empty netops-deadletter-* index is itself the
  # signal that a producer has broken its contract.
  opensearch_deadletter:
    type: elasticsearch
    inputs: [deadletter_encoded]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-deadletter-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  # Syslog from network devices → OpenSearch
  opensearch_syslog:
    type: elasticsearch
    inputs: [syslog_tagged]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-syslog-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  # SNMP traps from network devices → OpenSearch
  opensearch_snmptrap:
    type: elasticsearch
    inputs: [snmptrap_tagged]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-snmptrap-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  # Tagged raw cloud logs → OpenSearch (the unified Cloud Logs search plane).
  opensearch_cloudlogs:
    type: elasticsearch
    inputs: [cloudlogs_tagged]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-cloudlogs-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  # Flow records → both OpenSearch (search) and ClickHouse (analytics)
  opensearch_flows:
    type: elasticsearch
    inputs: [flows_os_sample]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: "netops-flows-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    healthcheck: { enabled: true }

  clickhouse_flows:
    type: clickhouse
    inputs: [flows_decoded]
    endpoint: "http://clickhouse:8123"
    database: netops
    table: flows
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    healthcheck: { enabled: true }

  # Daily cloud cost records → ClickHouse (Wave 5 #18). skip_unknown_fields
  # drops the record's `kind` routing field; schema growth is a plain
  # ALTER TABLE ADD COLUMN, same contract as flows.
  clickhouse_cloudcosts:
    type: clickhouse
    inputs: [cloudcosts_normalized]
    endpoint: "http://clickhouse:8123"
    database: netops
    table: cloud_costs
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    healthcheck: { enabled: true }
