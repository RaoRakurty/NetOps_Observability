      when_full: block               # trigger — see opensearch_syslog

  # Security findings → OpenSearch (P3-L1). The durable findings store per
  # SECURITY_FINDINGS_STORE_DECISION 2026-08-28: per-tenant index, read back
  # through TenantIndexPattern("secfindings", …) + TenantFilter (§3a — the read
  # path names only the caller's own pattern, so at-rest separation backstops a
