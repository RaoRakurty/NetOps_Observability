    # Partial-bulk 429s (cluster_block_exception) must back-pressure into Kafka
    # (72 h retention, F-04 acknowledgements), never be discarded; `id_key`
    # above makes the retried batch an UPSERT, so a retry cannot duplicate.
    # s10 back-reference: this is the sink class that silently discarded
    # 291,296 syslog events during an 11-minute OpenSearch block because
    # request_retry_partial defaults to FALSE. Evidence lanes degrade to
    # DELAYED, never to LOST.
    request_retry_partial: true
    request:
      retry_attempts: 90             # 2,581 s ≈ 43 min envelope; bounded so a
      retry_initial_backoff_secs: 1  # poison batch cannot wedge the lane for long
      retry_max_duration_secs: 30    # (caps the DELAY between retries, not total)
    buffer:
      type: memory                   # never disk: the router's only writable host
      max_events: 500                # path is the root fs whose exhaustion is the
      when_full: block               # trigger — see opensearch_syslog

  # Flow records → both OpenSearch (search) and ClickHouse (analytics)
  opensearch_flows:
    type: elasticsearch
    # Reads the STAMPED sample (sample honesty — see flows_os_stamped), never
    # the raw sampler output: every doc in netops-flows-* carries sample_rate.
    inputs: [flows_os_stamped]
    endpoints: ["${OPENSEARCH_ENDPOINT:-http://opensearch:9200}"]  # SEC-008: TLS deployments point this at https
    auth:
      strategy: basic
      user: "${OPENSEARCH_USER:-svc_router}"
      password: "${OPENSEARCH_PASSWORD:-unused-on-plaintext-opensearch}"
    # SEC-008: Vector's elasticsearch healthcheck performs a READ, and this
    # identity is deliberately WRITE-ONLY — so a passing healthcheck would
    # mean the role model is too permissive. Disabled on purpose: the real
    # liveness signal for this lane is document counts climbing (F-18 /
    # F-17), never a probe, and never "no errors in the log".
    healthcheck: false
    mode: bulk
    # F-11 (INV-F11-08): restored quarantine events carry cx_event_id and must
    # UPSERT on replay — without this, a re-run of the operator restore
    # duplicated the tenant document (caught live 2026-08-12). F-18
    # (2026-08-22): normal events now ALSO carry it — the log_lane anchor
    # stamps the record's Kafka coordinate — so a bulk retry after a
    # timed-out-but-applied request upserts instead of duplicating.
    id_key: cx_event_id
    bulk:
      index: "netops-flows-{{ tenant_seg }}-%Y.%m.%d"
      action: index
    api_version: v7
    # #209 — same flood-stage exposure as opensearch_syslog; the full evidence,
    # the 0.40.0 measurements and the buffer arithmetic live on that sink.
    # Partial-bulk 429s (cluster_block_exception) must back-pressure into Kafka
    # (72 h retention, F-04 acknowledgements), never be discarded; `id_key`
    # above makes the retried batch an UPSERT, so a retry cannot duplicate.
    # FAN-OUT NOTE: flows_store_route also feeds clickhouse_flows, so a blocked
    # OpenSearch now pauses the whole flows lane instead of quietly dropping the
    # OS copy. That is the intended trade — ClickHouse resumes from the retained
    # topic, and s10 proved the alternative is permanent evidence loss.
    request_retry_partial: true
    request:
      retry_attempts: 90             # 2,581 s ≈ 43 min envelope; bounded so a
      retry_initial_backoff_secs: 1  # poison batch cannot wedge the lane for long
      retry_max_duration_secs: 30    # (caps the DELAY between retries, not total)
    buffer:
      type: memory                   # never disk: the router's only writable host
      max_events: 500                # path is the root fs whose exhaustion is the
      when_full: block               # trigger — see opensearch_syslog

  # Scale P0 — the tenant-keyed flow feed (see kafka_flows_raw). Same
  # Java-murmur2 partitioner as every keyed producer on the bus (the
  # aggregator's kafka sinks, kafka-python in cloud-ingest): the same tenant
  # key MUST hash to the same partition NUMBER everywhere, or a tenant's
  # flows land on a different correlation instance than its other lanes.
  # Offsets on kafka_flows_raw commit only after this sink acks (global
  # `acknowledgements`), so the retained raw topic is the replay buffer —
  # no disk buffer needed, same reasoning as the storage sinks.
  kafka_flows_keyed:
    type: kafka
    tls:
      enabled: ${KAFKA_TLS_ENABLED:-false}
      ca_file: "${KAFKA_TLS_CA:-/tls/ca.pem}"
      crt_file: "${KAFKA_TLS_CRT:-/tls/ca.pem}"
      key_file: "${KAFKA_TLS_KEY:-/tls/ca.pem}"
    inputs: [flows_rekey]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.flows"
    key_field: "__key"
    librdkafka_options:
      partitioner: "murmur2_random"
    encoding:
      codec: json
      except_fields: ["__key"]
    compression: snappy

  clickhouse_flows:
    type: clickhouse
    inputs: [flows_store_route._unmatched]
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse:8123}"  # SEC-009: TLS deployments point this at :8443
    database: netops
    table: flows
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    healthcheck: { enabled: true }

  # Daily cloud cost records → ClickHouse (Wave 5 #18). skip_unknown_fields
  # drops the record's `kind` routing field; schema growth is a plain
  # ALTER TABLE ADD COLUMN, same contract as flows.
  clickhouse_cloudcosts:
    type: clickhouse
    inputs: [cloudcosts_normalized]
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse:8123}"  # SEC-009: TLS deployments point this at :8443
    database: netops
    table: cloud_costs
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    healthcheck: { enabled: true }
