# inventory-vendor.yaml: the registry's inventory facts on the shipped transforms
# (tracker 387 PR 12). Run by tests/test_inventory_vendor.py against the fixture
# table tests/fixtures/device_tenant.csv. Asserts VALUES: `vendor_source` present is
# not the claim, `vendor_source == "inventory"` with the right vendor is.

tests:
  - name: "the Arista agent Rib is labelled Arista from inventory, not Cisco"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "arista-leaf1"
          appname: "Rib"
          severity: "notice"
          message: "%BGP-3-NOTIFICATION: sent to neighbor 10.0.0.2 (VRF default AS 65001) 6/2 (Cease/administrative shutdown) 0 bytes"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "arista")
              assert_eq!(.vendor_source, "inventory")
              assert_eq!(.parser_id, "ios_style.v1")
              assert_eq!(.parser_status, "parsed")
              assert_eq!(.event_type, "notification")
              assert_eq!(.device_id, "arista-leaf1-id")
              assert_eq!(.model, "DCS-7050")
              assert_eq!(.site, "dc1")
              assert_eq!(.role, "leaf")
              assert_eq!(.tenant_id, "lab")
              assert_eq!(.tenant_registry, "hit")

  - name: "the same line from a sender not in inventory falls back to the format guess, and says so"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "stranger"
          appname: "Rib"
          severity: "notice"
          message: "%BGP-3-NOTIFICATION: sent to neighbor 10.0.0.2 (VRF default AS 65001) 6/2 (Cease/administrative shutdown) 0 bytes"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco")
              assert_eq!(.vendor_source, "format")
              assert_eq!(.parser_id, "ios_style.v1")
              assert_eq!(.tenant_registry, "miss")
              assert_eq!(.tenant_id, "")
              assert!(!exists(.device_id))
              assert!(!exists(.model))

  - name: "a known device the inventory states no vendor for also falls back"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "spine1"
          appname: "Rib"
          severity: "notice"
          message: "%BGP-3-NOTIFICATION: sent to neighbor 10.0.0.2 (VRF default AS 65001) 6/2 (Cease/administrative shutdown) 0 bytes"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco")
              assert_eq!(.vendor_source, "format")
              assert_eq!(.tenant_registry, "hit")
              assert_eq!(.tenant_id, "lab")

  - name: "an inventory vendor narrows a pack grammar away"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "arista-leaf1"
          appname: "FTMD"
          severity: "notice"
          message: "%Viptela-vEdge-1-FTMD-3-ERRO-1000003: a line"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "arista")
              assert_eq!(.vendor_source, "inventory")
              assert_eq!(.parser_status, "unparsed")
              assert!(!exists(.parser_id))
              assert!(!exists(.severity_native_text))

  - name: "the same pack line from its own vendor parses"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "cisco-edge1"
          appname: "FTMD"
          severity: "notice"
          message: "%Viptela-vEdge-1-FTMD-3-ERRO-1000003: a line"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco")
              assert_eq!(.vendor_source, "inventory")
              assert_eq!(.parser_id, "cisco_sdwan.v1")
              assert_eq!(.parser_status, "parsed")
              assert_eq!(.device_id, "cisco-edge1")
              assert!(!exists(.site))

  - name: "a body format never relabels a device the inventory states"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "arista-leaf1"
          appname: "sr_bgp_mgr"
          severity: "notice"
          message: "local6|1234|5678|00123|sr_bgp_mgr||W: BGP peer down"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "arista")
              assert_eq!(.vendor_source, "inventory")
              assert_eq!(.parser_id, "srlinux.v1")

  - name: "a key-value body from a device stated as another vendor is not lifted"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "arista-leaf1"
          appname: "x"
          severity: "notice"
          message: "date=2026-11-09 devname=spine1 logid=0100 type=event level=alert"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "arista")
              assert_eq!(.hostname, "arista-leaf1")
              assert_eq!(.severity, "notice")
              assert!(!exists(.fgt))

  - name: "a stated vendor with an ordinary body does not run the key-value parser"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "forti-edge1"
          appname: "x"
          severity: "notice"
          message: "%LINK-3-UPDOWN: Interface port1, changed state to down"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "fortinet")
              assert_eq!(.vendor_source, "inventory")
              assert!(!exists(.fgt))
              assert_eq!(.parser_id, "ios_style.v1")

  - name: "a body that refines the hostname takes that device's facts, same tenant only"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "forti-edge1"
          appname: "x"
          severity: "notice"
          message: "date=2026-11-09 devname=forti-edge2 logid=0100 type=event level=alert"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.hostname, "forti-edge2")
              assert_eq!(.device_id, "forti-edge2-id")
              assert_eq!(.model, "FG-200F")
              assert_eq!(.tenant_id, "lab")

  - name: "a body naming another tenant's device moves nothing, facts included"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "forti-edge1"
          appname: "x"
          severity: "notice"
          message: "date=2026-11-09 devname=victim-box logid=0100 type=event level=alert"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.hostname, "forti-edge1")
              assert_eq!(.tenant_id, "lab")
              assert_eq!(.device_id, "forti-edge1-id")
              assert_eq!(.model, "FG-100F")

  - name: "section 3a: an identity two tenants claim is absent from the table, so no facts and no tenant"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "shared-name"
          appname: "Rib"
          severity: "notice"
          message: "%BGP-3-NOTIFICATION: a line"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_registry, "miss")
              assert_eq!(.tenant_id, "")
              assert_eq!(.vendor_source, "format")
              assert!(!exists(.device_id))
              assert!(!exists(.model))
              assert!(!exists(.site))
              assert!(!exists(.role))

  - name: "a record cannot claim the registry's facts for itself"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "stranger"
          appname: "FTMD"
          severity: "notice"
          message: "a plain line"
          vendor: "arista"
          vendor_source: "inventory"
          device_id: "forged-id"
          model: "forged-model"
          site: "forged-site"
          role: "forged-role"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "unknown")
              assert!(!exists(.vendor_source))
              assert!(!exists(.device_id))
              assert!(!exists(.model))
              assert!(!exists(.site))
              assert!(!exists(.role))

  - name: "a trap from a known device: inventory vendor and facts"
    inputs:
      - insert_at: snmptrap_normalized
        type: log
        log_fields:
          device: "arista-leaf1"
          host: "10.0.0.1"
          vendor: "cisco"
          severity: "notice"
          trap_oid: "1.3.6.1.6.3.1.1.5.3"
          message: "linkDown"
    outputs:
      - extract_from: snmptrap_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "arista")
              assert_eq!(.vendor_source, "inventory")
              assert_eq!(.device_id, "arista-leaf1-id")
              assert_eq!(.model, "DCS-7050")
              assert_eq!(.site, "dc1")
              assert_eq!(.role, "leaf")
              assert_eq!(.tenant_id, "lab")

  - name: "a trap from an unknown sender keeps the receiver's enterprise answer, marked format"
    inputs:
      - insert_at: snmptrap_normalized
        type: log
        log_fields:
          host: "203.0.113.9"
          vendor: "juniper"
          severity: "notice"
          trap_oid: "1.3.6.1.4.1.2636.4.1.1"
          message: "something"
    outputs:
      - extract_from: snmptrap_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "juniper")
              assert_eq!(.vendor_source, "format")
              assert_eq!(.tenant_registry, "miss")
              assert!(!exists(.device_id))

  - name: "a standard trap from an unknown sender states no vendor at all"
    inputs:
      - insert_at: snmptrap_normalized
        type: log
        log_fields:
          host: "203.0.113.9"
          severity: "notice"
          trap_oid: "1.3.6.1.6.3.1.1.5.3"
          message: "linkDown"
          vendor_source: "inventory"
          device_id: "forged-id"
    outputs:
      - extract_from: snmptrap_normalized
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.vendor_source))
              assert!(!exists(.vendor))
              assert!(!exists(.device_id))
