      - insert_at: syslog_admission_stamp
        type: log
        log_fields:
          message: "peer 10.0.0.1 (AS 65001) old state Established event RecvNotify new state Idle"
          appname: "%BGP-5-ADJCHANGE"
          hostname: "leaf1"
    outputs:
      - extract_from: syslog_admission_stamp
        conditions:
          - type: vrl
            source: |
              assert_eq!(.cx_admission.by, "marker", "wrong admission gate")
              assert_eq!(.cx_admission.v, "d9d433dbaa11", "wrong rules_hash stamp")
