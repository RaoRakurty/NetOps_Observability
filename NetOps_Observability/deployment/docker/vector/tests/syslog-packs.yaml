              assert_eq!(.title, "System cpu usage is above 90% (critically high) on vEdge-1", "wrong title")
              assert_eq!(.correlation_key, "cpu:vEdge-1", "wrong correlation_key")
              assert_eq!(.metrics, {"cpu_idle_percent": {"basis": "observed", "value": 0.0}, "cpu_system_percent": {"basis": "observed", "value": 90.82}, "cpu_user_percent": {"basis": "observed", "value": 9.18}}, "wrong metrics")
