# syslog-packs.yaml: GENERATED by scripts/gen-syslog-packs.py. DO NOT EDIT.
#
# `vector test` proof that the shipped syslog_normalized transform agrees with
# `syslog_packs.PackTable.parse` and with every pack fixture's own expect:.
# cases: 102
#
# Keep every dollar sign out of this file: Vector interpolates environment
# variables in the raw config text, comments included.
# tests/test_syslog_packs.py runs it together with vector.yaml.

tests:
  - name: "cisco_ios: an XR link fault parses and is typed as IOS would type it"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "gw2.acy1"
          appname: "ifmgr"
          severity: "err"
          message: "%PKT_INFRA-LINK-3-UPDOWN : Interface TenGigE0/2/0/4, changed state to Down"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco", "wrong vendor")
              assert_eq!(.vendor_source, "format", "wrong vendor_source")
              assert_eq!(.parser_id, "cisco_iosxr.v1", "wrong parser_id")
              assert_eq!(.parser_status, "parsed", "wrong parser_status")
              assert_eq!(.facility, "PKT_INFRA-LINK", "wrong facility")
              assert_eq!(.event_type, "updown", "wrong event_type")
              assert_eq!(.summary, "Interface TenGigE0/2/0/4, changed state to Down", "wrong summary")
              assert_eq!(.severity_native_code, "3", "wrong severity_native_code")
              assert_eq!(.normalized_severity, "error", "wrong normalized_severity")
