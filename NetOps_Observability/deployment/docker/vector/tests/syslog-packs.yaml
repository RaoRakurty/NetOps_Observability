# syslog-packs.yaml: GENERATED by scripts/gen-syslog-packs.py. DO NOT EDIT.
#
# `vector test` proof that the shipped syslog_normalized transform agrees with
# `syslog_packs.PackTable.parse` and with every pack fixture's own expect:.
# cases: 11
#
# Keep every dollar sign out of this file: Vector interpolates environment
# variables in the raw config text, comments included.
# tests/test_syslog_packs.py runs it together with vector.yaml.

tests:
  - name: "cisco_sdwan: an error line parses and lifts severity"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "FTMD"
          severity: "notice"
          message: "3875 - - %Viptela-vEdge-1-FTMD-3-ERRO-1000003: User if_name = ge0/0; kernel if_name= ge0_0; encap = 1"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco", "wrong vendor")
              assert_eq!(.vendor_source, "format", "wrong vendor_source")
              assert_eq!(.parser_id, "cisco_sdwan.v1", "wrong parser_id")
              assert_eq!(.parser_status, "parsed", "wrong parser_status")
              assert_eq!(.facility, "FTMD", "wrong facility")
              assert_eq!(.event_type, "ftmd_1000003", "wrong event_type")
              assert_eq!(.summary, "User if_name = ge0/0; kernel if_name= ge0_0; encap = 1", "wrong summary")
              assert_eq!(.severity_native_text, "ERRO", "wrong severity_native_text")
              assert_eq!(.severity_native_code, "3", "wrong severity_native_code")
              assert_eq!(.normalized_severity, "error", "wrong normalized_severity")
              assert_eq!(.procid, "3875", "wrong procid")
              assert_eq!(.message, "%Viptela-vEdge-1-FTMD-3-ERRO-1000003: User if_name = ge0/0; kernel if_name= ge0_0; encap = 1", "wrong message")
              assert_eq!(.message_original, "3875 - - %Viptela-vEdge-1-FTMD-3-ERRO-1000003: User if_name = ge0/0; kernel if_name= ge0_0; encap = 1", "wrong message_original")
  - name: "cisco_sdwan: a warning line with a hyphenated host"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "SYSMGR"
          severity: "notice"
          message: "913 - - %Viptela-vEdge-1-SYSMGR-4-WARN-200071: System cpu usage is above 60%"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.facility, "SYSMGR", "wrong facility")
              assert_eq!(.event_type, "sysmgr_200071", "wrong event_type")
              assert_eq!(.severity_native_text, "WARN", "wrong severity_native_text")
              assert_eq!(.severity_native_code, "4", "wrong severity_native_code")
              assert_eq!(.normalized_severity, "warning", "wrong normalized_severity")
  - name: "cisco_sdwan: a notice line does not lift above the wire level"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "SYSMGR"
          severity: "notice"
          message: "913 - - %Viptela-vEdge-1-SYSMGR-5-NTCE-200072: System cpu usage is below 75%"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "sysmgr_200072", "wrong event_type")
              assert_eq!(.severity_native_text, "NTCE", "wrong severity_native_text")
              assert_eq!(.normalized_severity, "notice", "wrong normalized_severity")
  - name: "cisco_sdwan: a critical line lifts to critical"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "SYSMGR"
          severity: "notice"
          message: "913 - - %Viptela-vEdge-1-SYSMGR-2-CRIT-200069: System cpu usage is above 90% (critically high)"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "sysmgr_200069", "wrong event_type")
              assert_eq!(.severity_native_text, "CRIT", "wrong severity_native_text")
              assert_eq!(.severity_native_code, "2", "wrong severity_native_code")
              assert_eq!(.normalized_severity, "critical", "wrong normalized_severity")
  - name: "cisco_sdwan: a critical line with no typed row still alarms"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "VDAEMON"
          severity: "notice"
          message: "%Viptela-vEdge-1-VDAEMON_0-2-CRIT-999999: synthetic shape of an unknown critical id"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.facility, "VDAEMON_0", "wrong facility")
              assert_eq!(.event_type, "vdaemon_0_999999", "wrong event_type")
              assert_eq!(.normalized_severity, "critical", "wrong normalized_severity")
  - name: "cisco_sdwan: a notification takes its identity from the event name"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "SYSMGR"
          severity: "notice"
          message: "913 - - %Viptela-vEdge-1-sysmgrd-6-INFO-1400002: Notification: cpu-usage severity-level:critical host-name:\"vEdge-1\" system-ip:192.0.2.1 warning:\"System cpu usage is above 90% (critically high)\" cpu-user-percentage:\"9.18\" cpu-system-percentage:\"90.82\" cpu-idle-percentage:\"0.00\""
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.facility, "sysmgrd", "wrong facility")
              assert_eq!(.event_type, "cpu-usage", "wrong event_type")
              assert_eq!(.severity_native_text, "critical", "wrong severity_native_text")
              assert_eq!(.normalized_severity, "notice", "wrong normalized_severity")
  - name: "cisco_sdwan: a controller notification, documented shape"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "Manager01"
          appname: "SYSMGR"
          severity: "notice"
          message: "%Viptela-Manager01-sysmgrd-6-INFO-1400002: Notification: system-login-change"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "system-login-change", "wrong event_type")
              assert_eq!(.normalized_severity, "notice", "wrong normalized_severity")
  - name: "cisco_sdwan: the IOS-XE shape parses under the same mechanism"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "cedge-1"
          appname: "FTMD"
          severity: "notice"
          message: "%Cisco-SDWAN-vm5-FTMD-4-WARN-1000009: BFD-session synthetic body"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.vendor, "cisco", "wrong vendor")
              assert_eq!(.parser_id, "cisco_sdwan.v1", "wrong parser_id")
              assert_eq!(.facility, "FTMD", "wrong facility")
              assert_eq!(.event_type, "ftmd_1000009", "wrong event_type")
              assert_eq!(.severity_native_text, "WARN", "wrong severity_native_text")
              assert_eq!(.normalized_severity, "warning", "wrong normalized_severity")
  - name: "standard: the procid is lifted and the original kept"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "confd"
          severity: "notice"
          message: "2939 - - something a daemon said"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.procid, "2939", "wrong procid")
              assert_eq!(.message, "something a daemon said", "wrong message")
              assert_eq!(.message_original, "2939 - - something a daemon said", "wrong message_original")
  - name: "standard: a nil procid is not lifted"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "vEdge-1"
          appname: "SYSMGR"
          severity: "notice"
          message: "- - - USER PID %CPU %MEM"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "USER PID %CPU %MEM", "wrong message")
              assert_eq!(.message_original, "- - - USER PID %CPU %MEM", "wrong message_original")
  - name: "standard: the tokens later in a line are left alone"
    inputs:
      - insert_at: syslog_normalized
        type: log
        log_fields:
          hostname: "spine1"
          appname: "app"
          severity: "notice"
          message: "a line saying 12 - - in the middle"
    outputs:
      - extract_from: syslog_normalized
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "a line saying 12 - - in the middle", "wrong message")
