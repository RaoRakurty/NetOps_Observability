# Vector — AGGREGATION tier.
#
# Receives from edge collectors (syslog-ng, goflow2) plus container
# stdout. Parses, normalizes, enriches, buffers, ships to Redpanda
# topics keyed by signal:
#
#   syslog   → topic netops.syslog
#   netflow  → topic netops.flows
#   applogs  → topic netops.applogs
#
# Metrics (Telegraf SNMP) go DIRECTLY to VictoriaMetrics via Telegraf's
# own outputs.http remote_write plugin — they don't flow through Vector
# because the Vector kafka sink doesn't gracefully accept Metric events
# in the encoding mode we want. See telegraf.conf.

api:
  enabled: true
  address: 0.0.0.0:8686

# ----------------------------------------------------------------------------
# SOURCES
# ----------------------------------------------------------------------------

sources:
  # Container stdout/stderr — application logs (Go API, frontend nginx, etc).
  # Excludes goflow2 below via the docker_flows filter.
  docker:
    type: docker_logs

  # syslog-ng forwards parsed events here in RFC5424 frame.
  syslog_in:
    type: syslog
    address: 0.0.0.0:6601
    mode: tcp

  # Vector's own internal metrics. Exposed at /metrics on port 9598
  # so Prometheus can scrape it (added as a target in prometheus.yml).
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 30

# ----------------------------------------------------------------------------
# TRANSFORMS — parsing, normalization, enrichment
# ----------------------------------------------------------------------------

transforms:
  # Split goflow2's stdout from the rest of the Docker stream.
  docker_flows:
    type: filter
    inputs: [docker]
    condition: |
      contains(string!(.container_name ?? ""), "goflow2")

  docker_applogs:
    type: filter
    inputs: [docker]
    condition: |
      !contains(string!(.container_name ?? ""), "goflow2")

  # Parse app log lines as JSON when possible so structured fields are
  # available downstream (level, component, msg).
  applogs_normalized:
    type: remap
    inputs: [docker_applogs]
    source: |
      msg = string!(.message ?? "")
      parsed, err = parse_json(msg)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed)) ?? .
      }
      .level     = string(.level)     ?? "info"
      .component = string(.component) ?? "container"
      .service   = string(.compose_service) ?? string(.container_name) ?? "unknown"

  flows_normalized:
    type: remap
    inputs: [docker_flows]
    source: |
      msg = string!(.message ?? "")
      parsed, err = parse_json(msg)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed)) ?? .
      }
      .signal = "netflow"

  syslog_normalized:
    type: remap
    inputs: [syslog_in]
    source: |
      .signal   = "syslog"
      .hostname = string(.hostname) ?? "unknown"
      .severity = string(.severity) ?? "info"
      .appname  = string(.appname)  ?? "unknown"

# ----------------------------------------------------------------------------
# SINKS — Redpanda topics, one per signal.
# ----------------------------------------------------------------------------

sinks:
  kafka_applogs:
    type: kafka
    inputs: [applogs_normalized]
    bootstrap_servers: "redpanda:9092"
    topic: "netops.applogs"
    encoding: { codec: json }
    compression: snappy

  kafka_syslog:
    type: kafka
    inputs: [syslog_normalized]
    bootstrap_servers: "redpanda:9092"
    topic: "netops.syslog"
    encoding: { codec: json }
    compression: snappy

  kafka_flows:
    type: kafka
    inputs: [flows_normalized]
    bootstrap_servers: "redpanda:9092"
    topic: "netops.flows"
    encoding: { codec: json }
    compression: snappy

  # Operator metrics — exposed for Prometheus to scrape.
  prometheus_exporter:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598
