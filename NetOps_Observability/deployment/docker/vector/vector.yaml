# Vector — AGGREGATION tier.
#
# Receives from edge collectors (syslog-ng, goflow2) plus container
# stdout. Parses, normalizes, enriches, buffers, ships to the Kafka bus
# topics keyed by signal:
#
#   syslog   → topic netops.syslog
#   netflow  → topic netops.flows
#   applogs  → topic netops.applogs
#   metrics  → topic netops.metrics  (RCA-filtered canonical MetricEvents)
#
# Two metric paths, by purpose:
#   • Dashboard/PromQL/history: the Go SNMP collector writes the FULL sample set
#     straight to VictoriaMetrics (remote_write) — it does NOT flow through
#     Vector. VM is the metric store/query backend.
#   • Live correlation: the same collector POSTs a FILTERED, canonical subset
#     (RCA families only) as NDJSON to the metrics_in source below → netops.metrics
#     → correlation engine (device_telemetry modality). Canonical normalization
#     lives in typed Go (collectors/metric_events.go), not in this YAML.

api:
  enabled: true
  address: 0.0.0.0:8686

# ----------------------------------------------------------------------------
# DURABILITY (F-04) — end-to-end acknowledgements.
#
# THE DEFECT THIS FIXES: the sources on this tier are `http_server`
# (trap_in:8688, probe_in:8689, metrics_in:8690, bus_in:8692). With
# acknowledgements off — the Vector default — an http_server source returns
# **HTTP 200 the moment it has parsed the body**, long before the event reaches
# Kafka. src/backend/bus_producer.go therefore recorded a SUCCESS for events
# that were still sitting in a 500-event in-MEMORY buffer and were lost outright
# if this process restarted. That is a 2xx-without-persistence bug at the
# ingestion boundary: the platform told its own backend the data was safe when
# it was not.
#
# With this enabled the 200 is withheld until every sink the event reached has
# durably accepted it (for the kafka sinks: until the broker acks). A failing
# or unreachable bus now produces an HONEST non-2xx to the caller instead of a
# false success. That is the intended behaviour — do not "fix" a sudden
# appearance of 5xx here by turning this back off; it means the bus is broken
# and it was always broken, just invisibly.
acknowledgements:
  enabled: true

# Disk-buffer spool (see the `buffer:` blocks on the kafka sinks below). Mounted
# from the host so the spool survives a container recreate, which is the whole
# point of it.
data_dir: /var/lib/vector

# ----------------------------------------------------------------------------
# ENRICHMENT TABLES — device → tenant attribution (#20 multi-tenant telemetry).
#
# The Go API exports a CSV (identity,tenant_id) — one row per device name and per
# management address — to a shared volume; we load it here and stamp .tenant_id
# onto every event by matching its source-device identity (syslog hostname, flows
# sampler_address). The file is loaded at config load; it always exists (the
# stack seeds a header-only CSV), and an empty/missing match yields tenant_id=""
# (global/platform). See docs/design/multitenant-telemetry-isolation.md.
# ----------------------------------------------------------------------------

enrichment_tables:
  device_tenant:
    type: file
    file:
      path: /etc/vector/enrichment/device_tenant.csv
      encoding:
        type: csv
    schema:
      identity: string
      tenant_id: string

# ----------------------------------------------------------------------------
# SOURCES
# ----------------------------------------------------------------------------

sources:
  # Container stdout/stderr — application logs (Go API, frontend nginx, etc).
  # goflow2 no longer writes here at all (F-49: native kafka:// transport); the
  # docker_misrouted_flows filter below exists only to make a rollback loud.
  docker:
    type: docker_logs

  # syslog-ng forwards parsed events here in RFC5424 frame.
  syslog_in:
    type: syslog
    address: 0.0.0.0:6601
    mode: tcp

  # --------------------------------------------------------------------------
  # INGEST AUTHENTICATION (F-08) — every http_server source below is gated.
  #
  # THE DEFECT THIS FIXES: all four ingest sources accepted unauthenticated
  # writes from anything that could reach the compose network. The `bus_bridge`
  # transform enforced only that the requested topic starts with `netops.` —
  # a topic-PREFIX check, not an identity check — so a foothold anywhere on the
  # network could inject events onto any netops.* topic carrying a FORGED
  # tenant_id, which vector-router then routes into that tenant's OpenSearch
  # index via .tenant_seg. That is cross-tenant data injection, and it violates
  # CLAUDE.md §3 ("all service-to-service communication must be authenticated")
  # outright. The comment that used to sit here asserted "internal compose
  # network only — never exposed on the host": true of today's compose file,
  # but a network-topology ASSUMPTION is not an enforced control, and it stops
  # being true the moment someone adds a port mapping or runs the stack on a
  # shared network.
  #
  # Vector's http_server auth is HTTP Basic. The credential is one shared
  # ingest secret (INGEST_USER/INGEST_TOKEN) generated by install.py alongside
  # the other stack secrets, because every client here is a stack-internal
  # component, not a customer.
  #
  # FAILURE PATH, stated explicitly: a client that does not send the credential
  # gets 401. Vector counts it (`vector_component_errors_total`) and the Go
  # forwarders log + count it (see collectors/*_events.go — they no longer
  # discard the status code, precisely so a bad token cannot silently delete
  # three telemetry lanes). Leaving INGEST_TOKEN empty disables auth and logs a
  # warning at install time; that is the documented escape hatch for an
  # upgrade window, not a supported posture.
  # --------------------------------------------------------------------------

  # SNMP trap receiver (the in-API collectors/snmptrap.go listener on UDP/162)
  # POSTs each decoded trap here as a JSON object. Kept on the log bus so traps
  # inherit the same tenant-stamp/retention/export as syslog. (#SNMP traps)
  trap_in:
    type: http_server
    address: 0.0.0.0:8688
    auth: &ingest_auth
      username: "${INGEST_USER:-netops-ingest}"
      password: "${INGEST_TOKEN:?INGEST_TOKEN required — see F-08; set it in .env}"
    decoding:
      codec: json

  # Active-measurement probe events (#67 build ⑦). The STAMP sender and the
  # synthetics runner POST each observation here so the correlation engine
  # receives active_probe-modality evidence over the bus (→ netops.probes).
  probe_in:
    type: http_server
    address: 0.0.0.0:8689
    auth: *ingest_auth
    decoding:
      codec: json

  # Canonical metric events (the live correlation metric lane). The Go SNMP
  # collector POSTs a FILTERED, canonical subset of its samples (RCA families
  # only — see collectors/metric_events.go) here as newline-delimited JSON, one
  # MetricEvent per line, in addition to the VictoriaMetrics remote_write path.
  # → topic netops.metrics, consumed by the correlation engine (device_telemetry
  # modality). VM remains the dashboard/PromQL/history store; this is RCA signal.
  metrics_in:
    type: http_server
    address: 0.0.0.0:8690
    auth: *ingest_auth
    decoding:
      codec: json
    framing:
      method: newline_delimited

  # Bus bridge (replaces the Redpanda pandaproxy). The stdlib-only Go backend
  # has no Kafka client, so it POSTs bus records here as JSON envelopes
  # {topic, key, event} (bus_producer.go) and this lane forwards each event to
  # its topic. Authenticated (F-08): the netops.* prefix check in bus_bridge is
  # a routing guard, never an identity guard.
  bus_in:
    type: http_server
    address: 0.0.0.0:8692
    auth: *ingest_auth
    decoding:
      codec: json

  # Vector's own internal metrics. Exposed at /metrics on port 9598
  # so Prometheus can scrape it (added as a target in prometheus.yml).
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 30

  # --------------------------------------------------------------------------
  # OpenSearch indexing outcome (F-17) — THE COUNTER THAT ACTUALLY MOVES.
  #
  # OpenSearch's obvious health counter LIES about this failure mode. During a
  # measured window in which 1,127 documents were rejected and permanently lost
  # (0.93% of all app logs, ~5,700/day), `_nodes/stats/indices/indexing`
  # reported:
  #     "index_total"  : 114168
  #     "index_failed" : 0          <-- while documents were being discarded
  #     "doc_status"   : { "2xx": 120029, "4xx": 1127 }
  # `index_failed` counts whole-REQUEST failures. Bulk rejections are PER ITEM:
  # OpenSearch returns HTTP 200 for the batch with a 400 inside each bad item,
  # so index_failed never moves. An operator checking the obvious counter — or
  # a dashboard panel built on it — sees a perfectly healthy cluster.
  # `doc_status.4xx` is the counter that does move, and it is per-document.
  #
  # Nothing in the stack scraped it, because _nodes/stats is JSON and
  # VictoriaMetrics' promscrape only speaks the Prometheus exposition format.
  # So poll it here and convert it to metrics on the remote_write path that
  # already exists for the cloud lane — no new service, no OpenSearch plugin,
  # no broker change. Alerted by OpenSearchDocumentsRejected in rules.yaml.
  #
  # index_failed is scraped ALONGSIDE it deliberately: a dashboard that shows
  # both makes the lie self-evident instead of folklore.
  opensearch_indexing_stats:
    type: http_client
    endpoint: "${OPENSEARCH_STATS_URL:-http://opensearch:9200/_nodes/stats/indices/indexing}"
    scrape_interval_secs: 60
    scrape_timeout_secs: 10
    decoding:
      codec: json

  # Cluster health + shard census (F-53 / F-54). Two reasons this is worth a
  # second poll:
  #   * YELLOW is now a usable alarm signal again. It was not: netops-snmptrap-*
  #     had no template, so it defaulted to 1 replica on a SINGLE-NODE cluster,
  #     its replica sat UNASSIGNED forever, and 33 ISM audit-history indices did
  #     the same — 35 permanently unassigned shards. The cluster was always
  #     yellow, so nobody could ever act on yellow. Replicas are pinned to 0
  #     now and the cluster is green, which only means something if something
  #     watches it.
  #   * Shard count is the heap-exhaustion leading indicator. At 1.8 GB heap the
  #     accepted density is ~20 shards/GB ~= 36 shards, and the per-tenant daily
  #     index scheme adds ~26 shards/day. Disk is NOT the first thing to fail
  #     here; heap is, and at the 1000-shard cap index creation is rejected
  #     outright and ingest stops silently.
  opensearch_cluster_health:
    type: http_client
    endpoint: "${OPENSEARCH_HEALTH_URL:-http://opensearch:9200/_cluster/health}"
    scrape_interval_secs: 60
    scrape_timeout_secs: 10
    decoding:
      codec: json

# ----------------------------------------------------------------------------
# TRANSFORMS — parsing, normalization, enrichment
# ----------------------------------------------------------------------------

transforms:
  # --------------------------------------------------------------------------
  # F-49 — flows no longer travel through container stdout.
  #
  # THE DEFECT THIS FIXES: goflow2 wrote flow records to stdout, Vector read
  # them back out of the Docker json-file log, and the two streams were told
  # apart by `contains(.container_name, "goflow2")`. Two failure modes, both
  # silent:
  #   1. Rotation is a LOSS WINDOW. The json-file driver caps at 3x50 MB; if
  #      this source falls behind while a file rotates out, those flow records
  #      are gone and nothing counts them.
  #   2. A container RENAME (goflow2 -> flowcollector, a vendor swap, a
  #      compose refactor) makes the substring stop matching, at which point
  #      EVERY flow record silently becomes an app log and is indexed into
  #      netops-applogs-* with no error anywhere.
  # goflow2 has a native kafka:// transport — the config comment in
  # goflow2/goflow2.yaml has said "switch to kafka:// when wiring Kafka"
  # since the beginning. docker-compose.yml now does exactly that, so flows
  # go straight to netops.flows and the split is gone.
  #
  # THE FAILURE PATH IS EXPLICIT: this filter still recognises the goflow2
  # RECORD SHAPE (not its container name). If goflow2 is ever rolled back to
  # stdout, or a second flow exporter is added that logs to stdout, those
  # records are dead-lettered with a named reason instead of being quietly
  # mixed into the application-log index. Shape, not name: renaming the
  # container cannot defeat it.
  docker_misrouted_flows:
    type: filter
    inputs: [docker]
    condition: |
      m = string(.message) ?? ""
      contains(m, "\"sampler_address\"") && contains(m, "\"time_received_ns\"")

  docker_applogs:
    type: filter
    inputs: [docker]
    condition: |
      m = string(.message) ?? ""
      !(contains(m, "\"sampler_address\"") && contains(m, "\"time_received_ns\""))

  misrouted_flows_deadletter:
    type: remap
    inputs: [docker_misrouted_flows]
    source: |
      . = {
        "dropped_at": format_timestamp!(now(), format: "%+"),
        "lane": "docker_misrouted_flows",
        "reason": "misroute",
        "detail": "flow-shaped record on the container-log lane: goflow2 (or another exporter) is writing flows to stdout instead of the kafka:// transport — F-49",
        "raw": encode_json(.)
      }

  # Parse app log lines as JSON when possible so structured fields are
  # available downstream (level, component, msg).
  applogs_normalized:
    type: remap
    inputs: [docker_applogs]
    source: |
      msg = string!(.message)
      parsed, err = parse_json(msg)
      if err == null && is_object(parsed) {
        # merge() of two objects can't fail; no ?? . needed.
        . = merge(., object!(parsed))
      }
      # Promote the compose service label before dropping the label map.
      .service   = string(.label."com.docker.compose.service") ?? string(.container_name) ?? "unknown"

      # ── log_class: platform-infra vs application (operator directive) ──
      #
      # `docker_logs` collects stdout from EVERY container, so the platform's own
      # datastores and pipeline (OpenSearch, Vector, Kafka, ClickHouse, Victoria,
      # Grafana, cAdvisor, node-exporter, nginx) emit into the SAME lane as the
      # Correlix application. Their self-health chatter — "OpenSearch rejected N
      # documents", "Vector discarded N events" — was surfacing in the app-log
      # view an operator uses to watch tenant infrastructure, where it reads as a
      # tenant incident. It is not: it is the observability platform observing
      # itself, and belongs with Grafana/self-monitoring.
      #
      # Classify here so the value is queryable immediately and the router can
      # split the stream. NOTHING is dropped — platform logs are kept, just kept
      # SEPARATE (an operator debugging an ingest stall still needs them).
      platform_services = ["opensearch", "opensearch-dashboards", "vector-aggregator",
        "vector-router", "kafka", "kafka-exporter", "clickhouse", "victoria",
        "vmalert", "grafana", "cadvisor", "node-exporter", "nginx", "redis",
        "postgres", "goflow2", "syslog-ng", "gotenberg", "prober"]
      .log_class = "application"
      .log_index_base = "applogs"
      if includes(platform_services, .service) {
        .log_class = "platform"
        # Platform logs index into netops-platformlogs-* (see the router sink).
        # The GUI reads netops-applogs-*, so they leave the device-monitoring
        # view while staying retained for Grafana/operators.
        .log_index_base = "platformlogs"
      }

      # Drop the Docker label map: its dotted keys (com.docker.compose.*)
      # collide in OpenSearch, which reads dots as nested objects and rejects
      # every applog doc with a mapping conflict. Not needed downstream.
      del(.label)
      .level     = string(.level)     ?? "info"
      .component = string(.component) ?? "container"
      # App logs are emitted by stack-internal services, not tenant devices →
      # global/platform tenant.
      .tenant_id = ""

      # ── F-05: the merge above is producer-controlled; the mapping is not ──
      #
      # `merge()` lifts EVERY key of an arbitrary service's structured log line
      # to the top level. Two consequences, and the index template alone only
      # closes one of them:
      #
      #  (a) UNBOUNDED FIELD GROWTH — 67 top-level fields measured on
      #      netops-applogs-untagged against a 1000-field hard limit that fails
      #      CLOSED (at the limit OpenSearch rejects every remaining document
      #      for the day: a full-day, all-tenant app-log blackout). Closed in
      #      opensearch/index-templates.json with `dynamic: false`, which
      #      freezes the mapping at the declared set.
      #
      #  (b) TYPE POISONING of the fields that ARE declared. `dynamic: false`
      #      does not help here, and neither does `ignore_malformed`, which
      #      does NOT cover an object/array landing on a `text` field — that
      #      still rejects the whole document. One service logging
      #      {"message": {...}} or {"level": ["a"]} would therefore destroy its
      #      own log line permanently, with a 400 inside a 200 bulk response
      #      (F-17: index_failed stays 0).
      #
      # So coerce every DECLARED scalar back to a string after the merge. A
      # structured value is preserved as its JSON text rather than dropped, so
      # the offending producer stays greppable instead of invisible.
      for_each(["message", "msg", "level", "component", "service", "log_class",
                "log_index_base", "container_name", "host", "stream", "error", "trace_id"]) -> |_i, name| {
        v = get(., [name]) ?? null
        if v != null && !is_string(v) {
          . = set!(., [name], encode_json(v))
        }
      }

  syslog_normalized:
    type: remap
    inputs: [syslog_in]
    source: |
      .signal   = "syslog"
      .hostname = string(.hostname) ?? "unknown"
      .severity = string(.severity) ?? "info"
      .appname  = string(.appname)  ?? "unknown"

      # Tenant attribution: match the device hostname to its tenant. The hostname
      # survives NAT in the RFC5424 message, so it's the reliable device key. No
      # match → "" (global/platform). #20.
      .tenant_id = ""
      if .hostname != "unknown" {
        trows = find_enrichment_table_records("device_tenant", { "identity": .hostname }) ?? []
        if length(trows) > 0 {
          .tenant_id = to_string(trows[0].tenant_id) ?? ""
        }
      }

      # Vendor classification from the log signature (heuristic). The
      # authoritative vendor still comes from SNMP sysObjectID at discovery;
      # this labels each log — and any log-only device — by its distinctive
      # syslog format, so logs are filterable/colorable by vendor downstream.
      # Order matters: the distinctive formats are tested before Cisco's
      # generic "%FAC-SEV-MNEMONIC" (which Arista EOS also emits).
      msg = string(.message) ?? ""
      app = downcase(.appname)
      vendor = "unknown"
      if match(msg, r'devname=\S+') && match(msg, r'logid=') {
        vendor = "fortinet"
      } else if match(msg, r',(TRAFFIC|THREAT|SYSTEM|CONFIG|HIPMATCH),') {
        vendor = "paloalto"
      } else if match(msg, r'\[junos@2636') || match(msg, r'\bRT_FLOW') ||
                includes(["mgd", "rpd", "chassisd", "eventd", "dcd", "kmd", "l2cpd"], app) {
        vendor = "juniper"
      } else if includes(["ebra", "mlag", "mrouted", "stp", "lldp", "sand", "fwk"], app) {
        vendor = "arista"
      } else if match(msg, r'%[A-Z][A-Z0-9_]+-[0-7]-[A-Z0-9_]+') {
        vendor = "cisco"
      }
      .vendor = vendor

      # FortiOS parser. FortiGate's "default" log format is space-separated
      # key="value" pairs and carries NO clean RFC hostname — Vector keys it to
      # the source IP, so the real device id lives in devname= inside the body.
      # Parse the kv pairs (quoted-value aware), set the canonical device from
      # devname, surface type/subtype as appname, lift the FortiOS severity, and
      # re-attribute tenant on the real name. Parsed fields go under .fgt to avoid
      # OpenSearch dynamic-mapping collisions with other log types.
      if vendor == "fortinet" {
        kv, kverr = parse_key_value(msg)
        if kverr == null {
          .fgt = kv
          dn = string(kv.devname) ?? ""
          if dn != "" {
            .hostname = dn
            .host = dn
            trows = find_enrichment_table_records("device_tenant", { "identity": dn }) ?? []
            if length(trows) > 0 { .tenant_id = to_string(trows[0].tenant_id) ?? "" }
          }
          t  = string(kv.type) ?? ""
          st = string(kv.subtype) ?? ""
          if t != "" && st != "" { .appname = t + "/" + st } else if t != "" { .appname = t }
          lvl = string(kv.level) ?? ""
          if lvl != "" { .severity = lvl }
          # #81 P-NGFW: lift the FortiGate App-ID classification (on-box DPI) + its
          # 5-tuple to a vendor-NEUTRAL contract (.app_id/.app_src/.app_dst/
          # .app_dport/.app_proto) so the app-identity resolver can consume an
          # authoritative app label without knowing the vendor. Only when the
          # traffic log actually carries an app classification (app=, not N/A).
          # Flat top-level keys (no dots) to avoid OpenSearch mapping collisions.
          fapp = string(kv.app) ?? ""
          if fapp != "" && fapp != "N/A" {
            .app_id = fapp
            .app_vendor = "fortinet"
            asrc = string(kv.srcip) ?? ""
            adst = string(kv.dstip) ?? ""
            if asrc != "" { .app_src = asrc }
            if adst != "" { .app_dst = adst }
            dpt = string(kv.dstport) ?? ""
            if dpt != "" { .app_dport = dpt }
            prt = string(kv.proto) ?? ""
            if prt != "" { .app_proto = prt }
          }
        }
      }

      # ── Structured-body parsers (#31): turn the vendor log body into canonical
      # normalized fields (subsystem/facility/event_type/summary + embedded
      # severity) so Events/RCA read structure, not raw text. Infallible: every
      # parse uses the (_, err) form and falls back — a parser miss never drops the
      # event. parser_status makes coverage observable (no silent failure).
      .parser_status = "unparsed"
      embedded_sev = 99
      if vendor != "fortinet" {
        # Cisco IOS/IOS-XE + NX-OS + Arista EOS converge on %FAC-SEV-MNEMONIC: text
        cm, cmerr = parse_regex(msg, r'%(?P<facility>[A-Z][A-Z0-9_]+)-(?P<sev>[0-7])-(?P<mnemonic>[A-Z0-9_]+):\s*(?P<text>.*)')
        if cmerr == null {
          .facility = cm.facility
          .event_type = downcase(string(cm.mnemonic) ?? "")
          .summary = cm.text
          embedded_sev = to_int(cm.sev) ?? 6
          .parser_id = "ios_style.v1"
          .parser_status = "parsed"
        } else if match(msg, r'\|\d+\|\d+\|\d+\|') {
          # Nokia SR Linux: <lvlword>|<pid>|<tid>|<seq>|<subsys>||<S>: <text>
          sm, smerr = parse_regex(msg, r'\w+\|\d+\|\d+\|\d+\|(?P<subsys>[^|]*)\|[^|]*\|(?P<sevchar>[A-Z]):\s*(?P<text>.*)')
          if smerr == null {
            .vendor = "nokia"
            .subsystem = strip_whitespace(string(sm.subsys) ?? "")
            .summary = strip_whitespace(string(sm.text) ?? "")
            sc = string(sm.sevchar) ?? ""
            embedded_sev = if sc == "C" { 2 } else if sc == "E" { 3 } else if sc == "W" { 4 } else if sc == "N" { 5 } else if sc == "I" { 6 } else { 7 }
            .parser_id = "srlinux.v1"
            .parser_status = "parsed"
          }
        }
      }

      # Severity reconcile: the body's embedded level overrides the syslog PRI when
      # stronger (lower RFC5424 number wins) — e.g. PRI=notice + body "W:" → warning.
      # .severity was already coalesced to a string above (line ~173), so a second
      # `?? "info"` here is flagged E651 (unnecessary) by a fresh vector compile.
      sysv = downcase(string(.severity))
      sysint = if sysv == "emergency" || sysv == "alert" || sysv == "critical" || sysv == "crit" { 2 } else if sysv == "error" || sysv == "err" { 3 } else if sysv == "warning" || sysv == "warn" { 4 } else if sysv == "notice" { 5 } else if sysv == "debug" { 7 } else { 6 }
      eff = if embedded_sev < sysint { embedded_sev } else { sysint }
      .normalized_severity = if eff <= 2 { "critical" } else if eff == 3 { "error" } else if eff == 4 { "warning" } else if eff == 5 { "notice" } else { "info" }

      # Clock-skew flagging (log-time standard S5/R5): compare the ORIGIN
      # timestamp (parsed from the syslog frame; UTC) against this aggregator's
      # receive clock. |skew| > 300s ⇒ stamp clock_skew_s (signed seconds,
      # positive = device clock ahead) so the record is searchable in
      # OpenSearch and the correlation service raises a per-device finding off
      # the bus copy. The timestamp itself is NEVER rewritten (R2: origin time
      # preserved; R3: receive time alongside).
      # (`to_timestamp` does not exist in this Vector's VRL — exit 78 at boot,
      # caught in deploy 2026-07-17. Render→parse handles both a native
      # timestamp and a string form of .timestamp.)
      ots = to_unix_timestamp(parse_timestamp(to_string(.timestamp) ?? "", "%+") ?? now())
      skew_s = ots - to_unix_timestamp(now())
      if abs(skew_s) > 300 { .clock_skew_s = skew_s }

  # SNMP traps — the receiver already decoded the PDU into structured fields
  # (trap_oid, trap_name, severity, varbinds, snmp_version, device/host). Here we
  # just stamp the tenant the same way syslog does: match the device id (or the
  # source IP) against the device→tenant table. No match → "" (global/platform).
  snmptrap_normalized:
    type: remap
    inputs: [trap_in]
    source: |
      .signal   = "snmptrap"
      .severity = string(.severity) ?? "notice"
      dev = string(.device) ?? ""
      host = string(.host) ?? ""
      .hostname = dev
      if .hostname == "" { .hostname = host }
      key = dev
      if key == "" { key = host }
      .tenant_id = ""
      if key != "" {
        trows = find_enrichment_table_records("device_tenant", { "identity": key }) ?? []
        if length(trows) > 0 {
          .tenant_id = to_string(trows[0].tenant_id) ?? ""
        }
      }

  # Probe events: stamp the tenant when the target matches a device identity.
  # Most probe targets are external hosts → "" (global/platform); the
  # correlation service re-resolves against the same table either way.
  probe_normalized:
    type: remap
    inputs: [probe_in]
    source: |
      .signal = "probe"
      tgt = string(.target) ?? ""
      .tenant_id = ""
      if tgt != "" {
        trows = find_enrichment_table_records("device_tenant", { "identity": tgt }) ?? []
        if length(trows) > 0 {
          .tenant_id = to_string(trows[0].tenant_id) ?? ""
        }
      }

  # Metric events: the Go collector already canonicalized them (typed code), so
  # this is minimal — tag the signal and stamp the tenant from the device id, the
  # same enrichment every other plane uses. No regex/parse chain here.
  metrics_normalized:
    type: remap
    inputs: [metrics_in]
    source: |
      .signal = "metric"
      dev = string(.device) ?? ""
      .tenant_id = ""
      if dev != "" {
        trows = find_enrichment_table_records("device_tenant", { "identity": dev }) ?? []
        if length(trows) > 0 {
          .tenant_id = to_string(trows[0].tenant_id) ?? ""
        }
      }

  # Cloud provider metrics (CloudWatch / Azure Monitor) → real VALUES in
  # VictoriaMetrics, so the Service View counters render measured numbers. The
  # SNMP collector already remote_writes device metrics itself; only the cloud
  # lane needs this bridge, so we filter to it and convert log→metric.
  cloud_metrics_only:
    type: filter
    inputs: [metrics_normalized]
    condition: '.signal_family == "cloud_resource"'

  cloud_metrics_vm:
    type: log_to_metric
    inputs: [cloud_metrics_only]
    metrics:
      - type: gauge
        field: value
        name: "{{ metric }}"
        tags:
          device: "{{ device }}"
          resource_id: "{{ index }}"
          provider: "{{ vendor }}"
          tenant_id: "{{ tenant_id }}"

  # F-17: flatten the _nodes/stats response into one event per counter. The
  # response is keyed by node id, so walk the map rather than assuming a name.
  # Emitted as GAUGES holding the absolute counter value (they reset to 0 when
  # OpenSearch restarts), so rules.yaml uses delta() over a window rather than
  # increase() — a restart then produces a negative delta and cannot false-fire.
  opensearch_indexing_flat:
    type: remap
    inputs: [opensearch_indexing_stats]
    drop_on_abort: true
    drop_on_error: true
    # F-03: this lane is the platform's ONLY view of OpenSearch document
    # rejection (F-17). If the _nodes/stats response ever changes shape, the
    # abort below silently deletes the poll and the loss alerting goes blind
    # while every dashboard stays green. Reroute so the failure is a document
    # in netops-deadletter-* with the actual reason on it.
    reroute_dropped: true
    source: |
      nodes, nerr = object(.nodes)
      if nerr != null { abort }
      out = []
      for_each(nodes) -> |_id, node| {
        n = object(node) ?? {}
        idx = object(get(n, ["indices", "indexing"]) ?? {}) ?? {}
        ds  = object(get(idx, ["doc_status"]) ?? {}) ?? {}
        host = to_string(get(n, ["host"]) ?? "") ?? ""
        # doc_status is keyed "2xx"/"4xx"/"5xx" — per-DOCUMENT outcomes, which
        # is the granularity bulk rejection actually happens at.
        for_each(ds) -> |code, count| {
          out = push(out, {
            "os_metric": "opensearch_indexing_doc_status",
            "code": code,
            "node": host,
            "value": to_float(count) ?? 0.0
          })
        }
        # The lying counter, kept next to the truthful one on purpose.
        out = push(out, {
          "os_metric": "opensearch_indexing_index_failed",
          "code": "none",
          "node": host,
          "value": to_float(get(idx, ["index_failed"]) ?? 0) ?? 0.0
        })
        out = push(out, {
          "os_metric": "opensearch_indexing_index_total",
          "code": "none",
          "node": host,
          "value": to_float(get(idx, ["index_total"]) ?? 0) ?? 0.0
        })
      }
      . = { "rows": out }

  opensearch_indexing_rows:
    type: remap
    inputs: [opensearch_indexing_flat]
    drop_on_abort: true
    drop_on_error: true
    reroute_dropped: true          # F-03 — see opensearch_indexing_flat
    source: |
      rows = array(.rows) ?? []
      if length(rows) == 0 { abort }
      . = rows

  opensearch_indexing_vm:
    type: log_to_metric
    inputs: [opensearch_indexing_rows]
    metrics:
      - type: gauge
        field: value
        name: "{{ os_metric }}"
        tags:
          code: "{{ code }}"
          node: "{{ node }}"

  # F-53/F-54: cluster status as a NUMBER (green=0 yellow=1 red=2 — ordered so
  # a single ">= 1" threshold means "not green") plus the shard census.
  opensearch_health_vm:
    type: remap
    inputs: [opensearch_cluster_health]
    drop_on_abort: true
    drop_on_error: true
    reroute_dropped: true          # F-03 — see opensearch_indexing_flat
    source: |
      st = to_string(.status) ?? ""
      code = 3
      if st == "green" { code = 0 } else if st == "yellow" { code = 1 } else if st == "red" { code = 2 }
      . = {
        "cluster": to_string(.cluster_name) ?? "unknown",
        "status_text": st,
        "cluster_status": code,
        "active_shards": to_float(.active_shards) ?? 0.0,
        "active_primary_shards": to_float(.active_primary_shards) ?? 0.0,
        "unassigned_shards": to_float(.unassigned_shards) ?? 0.0,
        "number_of_data_nodes": to_float(.number_of_data_nodes) ?? 0.0
      }

  opensearch_health_metrics:
    type: log_to_metric
    inputs: [opensearch_health_vm]
    metrics:
      - type: gauge
        field: cluster_status
        name: "opensearch_cluster_status"
        tags: { cluster: "{{ cluster }}", status_text: "{{ status_text }}" }
      - type: gauge
        field: active_shards
        name: "opensearch_cluster_active_shards"
        tags: { cluster: "{{ cluster }}" }
      - type: gauge
        field: active_primary_shards
        name: "opensearch_cluster_active_primary_shards"
        tags: { cluster: "{{ cluster }}" }
      - type: gauge
        field: unassigned_shards
        name: "opensearch_cluster_unassigned_shards"
        tags: { cluster: "{{ cluster }}" }
      - type: gauge
        field: number_of_data_nodes
        name: "opensearch_cluster_data_nodes"
        tags: { cluster: "{{ cluster }}" }

  # Bus-bridge envelopes → topic-tagged events. Zero-trust guard: only
  # netops.* topics are producible through the bridge; anything else (or a
  # non-object event) is dropped, not forwarded.
  bus_bridge:
    type: remap
    inputs: [bus_in]
    drop_on_abort: true
    drop_on_error: true
    # F-03: a REJECTED bus write is a security-relevant event (something tried
    # to produce onto a non-netops topic) and an operational one (a producer
    # sent a malformed envelope). Both used to vanish into a counter with no
    # payload, so neither the producer nor the operator could ever see it.
    reroute_dropped: true
    source: |
      t = to_string(.topic) ?? ""
      if !starts_with(t, "netops.") { abort }
      k = to_string(.key) ?? ""
      ev, err = object(.event)
      if err != null { abort }
      . = ev
      .__topic = t
      .__key = k

      # ── F-10: `ts` is the canonical event-time field on EVERY topic ─────
      # Measured 2026-07-21: netops.controller_events carried NO time field at
      # all — not `ts`, not `timestamp` — on 400/400 sampled messages. Every
      # consumer that orders or windows those events was therefore silently
      # using ARRIVAL time, which is the exact class of defect that made RCA
      # causal ordering wrong (F-34). Producers reach this bridge over HTTP, so
      # this is the last place the platform can still tell "the producer sent
      # no time" from "the producer sent a bad time".
      #
      # Stamp receive time as `ts` when the producer sent none, and record in
      # .ts_source that it is DERIVED — an honest, labelled approximation beats
      # an invisible one. `timestamp` is never rewritten (log-time R2).
      if !exists(.ts) {
        if exists(.timestamp) {
          bts, bterr = parse_timestamp(to_string(.timestamp) ?? "", format: "%+")
          if bterr == null {
            .ts = to_unix_timestamp(bts, unit: "milliseconds")
            .ts_source = "timestamp"
          }
        }
      }
      if !exists(.ts) {
        .ts = to_unix_timestamp(now(), unit: "milliseconds")
        .ts_source = "bridge_receive"
      }

  # --------------------------------------------------------------------------
  # F-03 — DEAD-LETTER LANE FOR THE AGGREGATOR TIER.
  #
  # There was no DLQ on this tier at all: four transforms used
  # `drop_on_error`/`drop_on_abort` with no `reroute_dropped`, so any future
  # VRL error (a producer adds a field, a regex stops matching) deleted data
  # and looked EXACTLY like normal filtering. The router tier grew a DLQ during
  # the DEF-6 fix; this tier did not — the same instance-not-class pattern this
  # audit is about.
  #
  # Shape is byte-identical to the router's deadletter_encoded so ONE
  # netops-deadletter-* index and ONE template (`dynamic: false`, nothing
  # dynamically typed) serve both tiers. It ships over the bus rather than
  # straight to OpenSearch on purpose: this tier has no storage sink, and
  # routing storage writes through the router keeps the tier boundary intact.
  #
  # `lane` comes from Vector's own dropped-metadata component_id, so a new
  # rerouting transform is labelled correctly without touching this encoder.
  # See the router config for the measured proof of where that metadata lives.
  deadletter_encoded:
    type: remap
    inputs:
      - bus_bridge.dropped
      - cloud_parsed.dropped
      - opensearch_indexing_flat.dropped
      - opensearch_indexing_rows.dropped
      - opensearch_health_vm.dropped
    source: |
      lane = to_string(.metadata.dropped.component_id) ?? ""
      if lane == "" { lane = "unknown" }
      kind = to_string(.metadata.dropped.reason) ?? ""
      if kind == "" { kind = "unknown" }
      why = to_string(.metadata.dropped.message) ?? ""
      if why == "" { why = "no dropped-metadata captured — check Vector's log namespace (F-14)" }
      . = {
        "dropped_at": format_timestamp!(now(), format: "%+"),
        "lane": lane,
        "reason": kind,
        "detail": why,
        "raw": encode_json(.)
      }

# ----------------------------------------------------------------------------
# SINKS — Kafka netops.* topics, one per signal.
# ----------------------------------------------------------------------------

  # Cloud fault-lab / cloud-workload app logs arrive as RFC5424 syslog whose msg
  # is "cloud=<provider> {json}" (json: service, app_id, level, journey_ok,
  # trace_id, run_id). Fault lines (failed journey or error/crit) ALSO become
  # netops.cloud cloud_health events so the correlation engine sees an APP-entity
  # cloud signal (#81 P3G lane). Healthy lines stay syslog-only. Tenant: cloud
  # events must carry an explicit tenant_id; the device_tenant enrichment keyed
  # on the sending hostname decides it, "" (no match) → "global" platform view.
  # F-03 — INTENTIONAL FILTERING IS NOW A `filter`, NOT AN `abort`.
  #
  # THE DEFECT THIS FIXES: `drop_on_error: true` + `drop_on_abort: true` put a
  # deliberate `abort` (this syslog line is not a cloud line — normal, ~46k
  # events) and a genuine VRL RUNTIME ERROR (a producer changed shape, a regex
  # stopped matching — data loss) into the SAME counter, with no payload kept
  # for either. `vector_component_discarded_events_total{intentional="true"}`
  # read 45,937 on both cloud lanes, so the one signal that would reveal a
  # broken transform was permanently buried inside ordinary filtering.
  #
  # Splitting them is the whole point: this filter carries the bulk
  # "not a cloud line" decision (still intentional=true, still 46k, still
  # boring), which leaves the remaps below with only rare aborts and any real
  # error — and those now reroute to the dead-letter lane with a reason.
  cloud_syslog_only:
    type: filter
    inputs: [syslog_normalized]
    condition: |
      match(string(.message) ?? "", r'cloud=[a-z0-9]+ \{')

  # Parse ONCE, for both cloud lanes. This is the only transform in the cloud
  # path that can still drop an event, and every drop it makes is a genuine
  # malformed cloud line — i.e. exactly the thing the dead-letter lane exists
  # for. (Before F-03 both lanes parsed independently and each swallowed its
  # own failures into the same intentional=true counter as ordinary filtering.)
  cloud_parsed:
    type: remap
    inputs: [cloud_syslog_only]
    drop_on_abort: true
    drop_on_error: true
    reroute_dropped: true
    source: |
      raw = string!(.message)
      parsed, rerr = parse_regex(raw, r'cloud=(?P<provider>[a-z0-9]+) (?P<body>\{.+\})')
      if rerr != null { abort }
      body, jerr = parse_json(parsed.body)
      if jerr != null { abort }
      if !is_object(body) { abort }
      .cloud_provider = parsed.provider
      .cloud_body = object!(body)

  # Fault selection is a FILTER (F-03): "this cloud line is healthy" is an
  # ordinary, high-volume, intentional decision and must never share a counter
  # — or a dead-letter index — with "this cloud line could not be parsed".
  cloud_fault_only:
    type: filter
    inputs: [cloud_parsed]
    condition: |
      lvl = downcase(string(.cloud_body.level) ?? "info")
      (.cloud_body.journey_ok == false) || lvl == "error" || lvl == "crit"

  cloud_app_health:
    type: remap
    inputs: [cloud_fault_only]
    source: |
      body = object(.cloud_body) ?? {}
      lvl = downcase(string(body.level) ?? "info")
      journey_failed = body.journey_ok == false
      svc = string(body.service) ?? "unknown"
      appid = string(body.app_id) ?? svc
      host = string(.hostname) ?? "unknown"
      tenant = string(.tenant_id) ?? ""
      if tenant == "" { tenant = "global" }
      sev = "high"
      metric = "app_error"
      if journey_failed {
        sev = "crit"
        metric = "journey_failed"
      }
      provider = string(.cloud_provider) ?? "unknown"
      ts, tserr = format_timestamp(.timestamp, format: "%+")
      if tserr != null { ts = format_timestamp!(now(), format: "%+") }
      . = {
        "kind": "cloud_health",
        "tenant_id": tenant,
        "app": svc,
        "severity": sev,
        "metric_name": metric,
        "value": 1.0,
        "ts": ts,
        "entity_tokens": [host, appid, svc],
        "attrs": {
          "provider": provider,
          "host": host,
          "app_id": appid,
          "trace_id": string(body.trace_id) ?? "",
          "run_id": string(body.run_id) ?? "",
          "failed_step": string(body.failed_step) ?? "",
          "error": string(body.error) ?? ""
        }
      }

  # Unified Cloud Logs — the HOST family. Cloud-workload app/host log lines
  # (RFC5424 syslog whose msg is "cloud=<provider> {json}") become tagged RAW
  # cloud logs (cloud_family=host) searchable in the Cloud Logs view, alongside
  # the WAF/LB/DNS/flow lanes the poller tags. Distinct from cloud_app_health
  # above (which keeps ONLY fault lines as correlation signals) — here we keep
  # EVERY cloud host line as a searchable record, healthy or not. Non-cloud
  # syslog is dropped (abort). Tenant carried from the device enrichment; "" →
  # "global" platform view (never an untagged cross-tenant bucket).
  cloud_host_log:
    type: remap
    inputs: [cloud_parsed]
    source: |
      raw = string!(.message)
      body = object(.cloud_body) ?? {}
      svc = string(body.service) ?? "unknown"
      appid = string(body.app_id) ?? svc
      host = string(.hostname) ?? "unknown"
      tenant = string(.tenant_id) ?? ""
      if tenant == "" { tenant = "global" }
      lvl = downcase(string(body.level) ?? "info")
      provider = string(.cloud_provider) ?? "unknown"
      ts, tserr = format_timestamp(.timestamp, format: "%+")
      if tserr != null { ts = format_timestamp!(now(), format: "%+") }
      . = {
        "tenant_id": tenant,
        "cloud_family": "host",
        "cloud_provider": provider,
        "resource_id": appid,
        "message": raw,
        "timestamp": ts,
        "level": lvl,
        "host": host,
        "app": appid,
        "source_type": "cloud",
        "signal": "cloud"
      }

sinks:
  kafka_cloud:
    type: kafka
    inputs: [cloud_app_health]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.cloud"
    encoding: { codec: json }
    compression: snappy

  # Tagged raw cloud HOST logs → the cloudlogs topic (vector-router indexes it
  # into netops-cloudlogs-{tenant}-*). Same topic the cloud poller produces the
  # WAF/LB/DNS/flow/change lanes onto.
  kafka_cloudlogs:
    type: kafka
    inputs: [cloud_host_log]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.cloudlogs"
    encoding: { codec: json }
    compression: snappy

  kafka_applogs:
    type: kafka
    inputs: [applogs_normalized]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.applogs"
    encoding: { codec: json }
    compression: snappy

  kafka_syslog:
    type: kafka
    inputs: [syslog_normalized]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.syslog"
    encoding: { codec: json }
    compression: snappy

  # F-03 — dead letters from THIS tier, onto the bus like every other signal.
  # vector-router consumes netops.deadletter and indexes it into the single
  # netops-deadletter-* index shared with the router's own DLQ. A non-empty
  # dead-letter index is itself the alarm: nothing lands here in normal
  # operation, so any document means a producer broke its contract (or a
  # transform did). Alerted by VectorDeadLetters in rules.yaml.
  kafka_deadletter:
    type: kafka
    inputs: [deadletter_encoded, misrouted_flows_deadletter]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.deadletter"
    encoding: { codec: json }
    compression: snappy

  kafka_snmptrap:
    type: kafka
    # F-04: DISK buffer, not the 500-event in-memory default.
    #
    # Buffered here and NOT on the other kafka sinks, deliberately. These four
    # lanes are fed by `http_server` sources (trap_in / probe_in / metrics_in /
    # bus_in) — they are the ones where the platform ISSUES A DURABILITY PROMISE
    # by returning HTTP 200 to its own backend, and they have no upstream that
    # can replay. kafka_applogs/kafka_flows come from docker_logs and
    # kafka_syslog from the syslog source; neither supports acknowledgements at
    # all (Vector warns about this at boot), and syslog now has its OWN reliable
    # disk-buffer one hop upstream in syslog-ng.conf, which is the correct place
    # for it. Spending 256 MiB of a nearly-full filesystem on a buffer that
    # cannot carry an ack would be cost without the guarantee.
    #
    # when_full: block applies backpressure to the source rather than dropping,
    # so together with the global `acknowledgements` block a full buffer becomes
    # an honest non-2xx to the producer instead of a silent discard.
    #
    # 256 MiB is the FLOOR, not a choice: Vector rejects anything below
    # 268435488 bytes at topology-build time. Note that `vector validate` does
    # NOT catch a smaller value — it only fails when the process actually starts,
    # so validate-then-deploy is not sufficient for this setting. Four sinks x
    # 256 MiB caps the spool at 1 GiB, which the 77 GB shared filesystem (F-55)
    # can absorb; the files are allocated lazily, so steady-state use is ~0.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    inputs: [snmptrap_normalized]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.snmptrap"
    encoding: { codec: json }
    compression: snappy

  kafka_probes:
    type: kafka
    # F-04: DISK buffer, not the 500-event in-memory default.
    #
    # Buffered here and NOT on the other kafka sinks, deliberately. These four
    # lanes are fed by `http_server` sources (trap_in / probe_in / metrics_in /
    # bus_in) — they are the ones where the platform ISSUES A DURABILITY PROMISE
    # by returning HTTP 200 to its own backend, and they have no upstream that
    # can replay. kafka_applogs/kafka_flows come from docker_logs and
    # kafka_syslog from the syslog source; neither supports acknowledgements at
    # all (Vector warns about this at boot), and syslog now has its OWN reliable
    # disk-buffer one hop upstream in syslog-ng.conf, which is the correct place
    # for it. Spending 256 MiB of a nearly-full filesystem on a buffer that
    # cannot carry an ack would be cost without the guarantee.
    #
    # when_full: block applies backpressure to the source rather than dropping,
    # so together with the global `acknowledgements` block a full buffer becomes
    # an honest non-2xx to the producer instead of a silent discard.
    #
    # 256 MiB is the FLOOR, not a choice: Vector rejects anything below
    # 268435488 bytes at topology-build time. Note that `vector validate` does
    # NOT catch a smaller value — it only fails when the process actually starts,
    # so validate-then-deploy is not sufficient for this setting. Four sinks x
    # 256 MiB caps the spool at 1 GiB, which the 77 GB shared filesystem (F-55)
    # can absorb; the files are allocated lazily, so steady-state use is ~0.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    inputs: [probe_normalized]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.probes"
    encoding: { codec: json }
    compression: snappy

  victoria_cloud_metrics:
    type: prometheus_remote_write
    # F-17: the OpenSearch doc_status lane rides the remote_write path that
    # already exists for the cloud lane — no new service, no extra scrape job.
    inputs: [cloud_metrics_vm, opensearch_indexing_vm, opensearch_health_metrics]
    endpoint: "${VM_REMOTE_WRITE_URL:-http://victoria:8428/api/v1/write}"
    healthcheck: false

  kafka_metrics:
    type: kafka
    # F-04: DISK buffer, not the 500-event in-memory default.
    #
    # Buffered here and NOT on the other kafka sinks, deliberately. These four
    # lanes are fed by `http_server` sources (trap_in / probe_in / metrics_in /
    # bus_in) — they are the ones where the platform ISSUES A DURABILITY PROMISE
    # by returning HTTP 200 to its own backend, and they have no upstream that
    # can replay. kafka_applogs/kafka_flows come from docker_logs and
    # kafka_syslog from the syslog source; neither supports acknowledgements at
    # all (Vector warns about this at boot), and syslog now has its OWN reliable
    # disk-buffer one hop upstream in syslog-ng.conf, which is the correct place
    # for it. Spending 256 MiB of a nearly-full filesystem on a buffer that
    # cannot carry an ack would be cost without the guarantee.
    #
    # when_full: block applies backpressure to the source rather than dropping,
    # so together with the global `acknowledgements` block a full buffer becomes
    # an honest non-2xx to the producer instead of a silent discard.
    #
    # 256 MiB is the FLOOR, not a choice: Vector rejects anything below
    # 268435488 bytes at topology-build time. Note that `vector validate` does
    # NOT catch a smaller value — it only fails when the process actually starts,
    # so validate-then-deploy is not sufficient for this setting. Four sinks x
    # 256 MiB caps the spool at 1 GiB, which the 77 GB shared filesystem (F-55)
    # can absorb; the files are allocated lazily, so steady-state use is ~0.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    inputs: [metrics_normalized]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "netops.metrics"
    encoding: { codec: json }
    compression: snappy

  # Bus-bridge events land on whatever netops.* topic their envelope named
  # (today: netops.app.identities.v1 from the fusion worker and
  # netops.controller_events from the NMS scheduler). The __topic/__key
  # routing fields are stripped from the encoded payload so the on-topic
  # value stays exactly the record the producer sent.
  kafka_bus:
    type: kafka
    # F-04: DISK buffer, not the 500-event in-memory default.
    #
    # Buffered here and NOT on the other kafka sinks, deliberately. These four
    # lanes are fed by `http_server` sources (trap_in / probe_in / metrics_in /
    # bus_in) — they are the ones where the platform ISSUES A DURABILITY PROMISE
    # by returning HTTP 200 to its own backend, and they have no upstream that
    # can replay. kafka_applogs/kafka_flows come from docker_logs and
    # kafka_syslog from the syslog source; neither supports acknowledgements at
    # all (Vector warns about this at boot), and syslog now has its OWN reliable
    # disk-buffer one hop upstream in syslog-ng.conf, which is the correct place
    # for it. Spending 256 MiB of a nearly-full filesystem on a buffer that
    # cannot carry an ack would be cost without the guarantee.
    #
    # when_full: block applies backpressure to the source rather than dropping,
    # so together with the global `acknowledgements` block a full buffer becomes
    # an honest non-2xx to the producer instead of a silent discard.
    #
    # 256 MiB is the FLOOR, not a choice: Vector rejects anything below
    # 268435488 bytes at topology-build time. Note that `vector validate` does
    # NOT catch a smaller value — it only fails when the process actually starts,
    # so validate-then-deploy is not sufficient for this setting. Four sinks x
    # 256 MiB caps the spool at 1 GiB, which the 77 GB shared filesystem (F-55)
    # can absorb; the files are allocated lazily, so steady-state use is ~0.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    inputs: [bus_bridge]
    bootstrap_servers: "${BROKER_URLS:-kafka:9092}"
    topic: "{{ __topic }}"
    key_field: "__key"
    encoding:
      codec: json
      except_fields: ["__topic", "__key"]
    compression: snappy

  # Operator metrics — exposed for Prometheus to scrape.
  prometheus_exporter:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598
