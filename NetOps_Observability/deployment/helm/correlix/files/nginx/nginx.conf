# SC-008: runs under nginx-unprivileged (uid 101). No `user` directive (only
# meaningful as root), pid + logs go to paths the non-root user can write.
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events { worker_connections  1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens off;

    # Compress responses to the browser. Nothing here was gzipped before, so the
    # SPA bundle, API JSON, and especially the (uncompressed-from-upstream, so
    # sub_filter can rewrite it) embedded-NetBox HTML all shipped in the clear.
    # nginx gzips the FINAL output, so this composes correctly with sub_filter.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml application/xml+rss
                      image/svg+xml application/wasm;

    # PIPE-HIGH-2: capability tokens must never enter the log store.
    #
    # /api/reports/view/{token} and /api/exports/view/{token} authenticate with
    # a signed, expiring, tenant-bound token carried IN THE PATH (an emailed
    # report link is clicked in a mail client, which cannot send a header — the
    # backend accepts X-Link-Token for every other client). $request is the raw
    # request line, so logging it verbatim wrote a live bearer credential — 7-day
    # TTL for reports — into stdout, which Vector ships to OpenSearch, where it
    # is searchable and replayable for the whole retention window by anyone who
    # can read logs. The same is true of the two webhook routes, whose path token
    # is long-lived.
    #
    # These maps rewrite the request line (and any Referer pointing back at a
    # view link) BEFORE it reaches the log. The route survives — traffic
    # analysis and error triage still work — the credential does not. The Go
    # backend applies the identical masking to its own request log
    # (maskCapabilityTokenPath in report_links.go); both boundaries must be
    # closed, since either stream alone leaks the token.
    map $request $request_redacted {
        default                                                    $request;
        # GENERIC credential-query redaction — FIRST, so it applies to every
        # route, present and future. The per-route patterns below cover tokens
        # embedded in the PATH; this covers tokens in the QUERY STRING.
        #
        # Why generic and not one more literal route regex: the device-SSH
        # WebSocket (/api/devices/{id}/ssh?token=<session JWT>) leaked a
        # privileged, reusable session JWT into this log for as long as the
        # route existed, precisely because the redaction list was a per-route
        # allowlist that nobody extended when the route was added. A new
        # credential-bearing endpoint must be redacted by DEFAULT, not by
        # remembering to add a line here.
        #
        # The whole query string is dropped (method + path survive) rather than
        # just the matched value: query strings routinely carry several
        # parameters, and rewriting one value while preserving the rest invites
        # exactly the partial-coverage bug this replaces. Route-level traffic
        # analysis and error triage still work; the credential does not survive.
        "~^(?<cqm>[A-Z]+)\s+(?<cqp>[^?\s]+)\?[^\s]*(?:token|ticket|jwt|access_token|api_?key|secret|password|credential|authorization)=\S*(?<cqv>\s.*)?$"  "$cqm $cqp?[credentials-redacted]$cqv";
        "~^(?<ltm>[A-Z]+)\s+/api/(?<ltk>reports|exports)/view/\S*"  "$ltm /api/$ltk/view/[token-redacted]";
        "~^(?<ntm>[A-Z]+)\s+/api/nms/webhook/\S*"                   "$ntm /api/nms/webhook/[token-redacted]";
        "~^(?<itm>[A-Z]+)\s+/api/integrations/webhook/(?<itp>[^/\s]+)/\S*"  "$itm /api/integrations/webhook/$itp/[token-redacted]";
    }
    map $http_referer $referer_redacted {
        default                                          $http_referer;
        "~^https?://[^/]+/api/(reports|exports)/view/"    "[redacted-link-referer]";
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_redacted" $status $body_bytes_sent '
                    '"$referer_redacted" "$http_user_agent"';
    access_log  /dev/stdout  main;

    include /etc/nginx/conf.d/*.conf;
}
