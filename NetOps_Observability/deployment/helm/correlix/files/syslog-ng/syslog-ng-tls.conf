@version: 4.7
@include "scl.conf"

# syslog-ng — edge ingestion for Syslog (RFC3164 + RFC5424). MESH-TLS variant.
#
# F-1 (SEC-014.1): the forward hop to vector-aggregator:6601 rides mesh TLS —
# syslog-ng VERIFIES the aggregator's SVID against the mesh CA
# (peer-verify(required-trusted)) and PRESENTS its own client SVID, which the
# aggregator requires (verify_certificate on the vector source). The device
# side (UDP/TCP 514, unauthenticated by protocol) is unchanged and lives in
# core.conf with its residual-risk statement.
#
# Selected by compose.tls.yml / the lab override via the container command
# (-f this file) plus two mounts: the mesh CA at /tls/ca.pem and the
# syslog-ng SVID dir at /tls/svid. The certs are loaded AT START — the weekly
# rotation sweep restarts this service (rotate-tls-services.sh), or its client
# cert expires while the process holds the old one (the 2026-08-05 incident
# class).
#
# Edit shared behaviour (options/source/parser) in core.conf, never here.

@include "/etc/syslog-ng/conf.d/core.conf"

# Forward to vector-aggregator on its syslog port, over verified mesh TLS.
#
# F-48 disk-buffer rationale is unchanged from the plaintext variant — see
# syslog-ng.conf. It matters MORE here: while either end holds a stale cert
# (e.g. mid-rotation) delivery pauses and the reliable disk-buffer is what
# holds device syslog until the handshake recovers.
destination d_vector {
    syslog("vector-aggregator"
        transport("tls")
        port(6601)
        flags(syslog-protocol)
        tls(
            ca-file("/tls/ca.pem")
            cert-file("/tls/svid/syslog-ng.crt")
            key-file("/tls/svid/syslog-ng.key")
            peer-verify(required-trusted)
        )
        disk-buffer(
            mem-buf-size(10485760)
            disk-buf-size(268435456)
            reliable(yes)
            dir("/var/lib/syslog-ng")
        )
    );
};

log {
    source(s_network);
    parser(p_syslog);
    destination(d_vector);
};
