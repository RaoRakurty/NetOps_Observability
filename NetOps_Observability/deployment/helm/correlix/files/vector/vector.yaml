    encoding:
      codec: json
      except_fields: ["__key"]
    compression: snappy

  # Bus-bridge events land on whatever netops.* topic their envelope named
  # (today: netops.app.identities.v1 from the fusion worker and
  # netops.controller_events from the NMS scheduler). The __topic/__key
  # routing fields are stripped from the encoded payload so the on-topic
  # value stays exactly the record the producer sent.
  kafka_bus:
    type: kafka
    # SEC-006.2: mTLS to the broker when the deployment enables it — unquoted
    # interpolation so the boolean lands as a boolean. Plaintext default; the
    # enabling override sets KAFKA_TLS_ENABLED=true + the SVID paths and
