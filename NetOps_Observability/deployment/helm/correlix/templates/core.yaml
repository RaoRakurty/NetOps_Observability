{{/*
Application tier — api, correlation, frontend SPA, gateway.

Peer addressing is by BARE SERVICE NAME throughout (api, victoria, opensearch,
clickhouse, correlation, kafka), which is what the compose stack uses and what
the mounted configs expect. In-namespace DNS resolves them unchanged.
*/}}
{{- if .Values.api.enabled }}
{{- $secret := include "correlix.secretName" $ }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "api") | indent 4 }}
spec:
  accessModes: {{ ternary (.Values.sharedData.accessModes | toJson) "[\"ReadWriteOnce\"]" .Values.sharedData.enabled }}
  {{- if or .Values.api.persistence.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | default .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "api") | indent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    # The api owns a ReadWriteOnce data volume; two pods cannot mount it at
    # once, so a rolling update would deadlock waiting for a volume the old pod
    # still holds. Recreate is correct here, and it is a real (brief) outage.
    type: Recreate
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "api") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "api") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 65532 "gid" 65532) | indent 6 }}
      containers:
        - name: api
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.api.image "name" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          ports:
            - {name: http, containerPort: 8080}
            {{- if .Values.api.snmpTraps.enabled }}
            - {name: snmptrap, containerPort: {{ .Values.api.snmpTraps.port }}, protocol: UDP}
            {{- end }}
            {{- if .Values.api.bmp.enabled }}
            - {name: bmp, containerPort: {{ .Values.api.bmp.port }}, protocol: TCP}
            {{- end }}
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: GOMEMLIMIT, value: {{ .Values.api.goMemLimit | quote }}}
            # ── app-state store (tracker 245: postgres is the default) ──
            - {name: STORE_BACKEND, value: {{ .Values.store.backend | quote }}}
            {{- if and (eq .Values.store.backend "postgres") .Values.store.databaseUrlFromSecret }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: DATABASE_URL}}
            {{- end }}
            - {name: DB_HOST, value: "postgres"}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: "netops"}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: DB_PASSWORD}}
            # ── peers ──
            - {name: REDIS_HOST, value: "redis"}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: REDIS_PASSWORD}}
            - {name: BROKER_URLS, value: {{ include "correlix.brokerUrls" $ | quote }}}
            - {name: BUS_BRIDGE_URL, value: "http://vector-aggregator:8692"}
            - {name: VICTORIA_URL, value: "http://victoria:8428"}
            - {name: METRICS_URL, value: "http://victoria:8428"}
            - {name: OPENSEARCH_URL, value: "http://opensearch:9200"}
            - {name: CLICKHOUSE_URL, value: "http://clickhouse:8123"}
            - {name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: CLICKHOUSE_PASSWORD}}
            - {name: CORRELATION_URL, value: "http://correlation:8000"}
            - {name: CORR_HEALTH_SIDECAR_PORT, value: "8094"}
            - {name: PROBE_EVENT_SINK_URL, value: "http://vector-aggregator:8689/"}
            - {name: SNMP_TRAP_SINK_URL, value: "http://vector-aggregator:8688/"}
            - {name: PROBER_ID, value: "api"}
            # ── ingest credentials (per-lane; the shared token opens no lane) ──
            - {name: INGEST_USER, value: "netops-ingest"}
            - name: INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: INGEST_TOKEN}}
            - name: INGEST_TOKEN_TRAPS
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: INGEST_TOKEN_TRAPS}}
            - name: INGEST_TOKEN_PROBES
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: INGEST_TOKEN_PROBES}}
            - name: INGEST_TOKEN_METRICS
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: INGEST_TOKEN_METRICS}}
            - name: INGEST_TOKEN_BUS
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: INGEST_TOKEN_BUS}}
            # ── alert delivery (the only end-to-end proof the chain works) ──
            - name: VMALERT_WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: VMALERT_WEBHOOK_TOKEN}}
            - name: CORR_DEBUG_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: CORR_DEBUG_TOKEN}}
            # ── identity ──
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: JWT_SECRET}}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: ENCRYPTION_KEY}}
            - {name: ADMIN_USERNAME, value: "admin"}
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: ADMIN_INITIAL_PASSWORD}}
            # ── paths ──
            - {name: RULES_FILE, value: "/config/rules.yaml"}
            - {name: STATIC_DEVICES_PATH, value: "/config/devices.yaml"}
            - {name: USERS_FILE, value: "/data/users.json"}
            - {name: TENANT_ENRICHMENT_DIR, value: "/data/enrichment"}
            - {name: PROCESSORS_DIR, value: "/data/processors"}
            - {name: CONFIG_BACKUP_DIR, value: "/data/config-backups"}
            - {name: PCAP_DIR, value: "/data/pcap"}
            # ── feature surface (values.env) ──
{{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
{{- end }}
          {{- if .Values.secrets.existingIntegrationSecret }}
          envFrom:
            # Slack / PagerDuty / SMTP / ServiceNow / Jira / COPILOT_API_KEY.
            # Kept in a SEPARATE Secret so the platform credentials and the
            # integration credentials can have different owners and rotations.
            - secretRef: {name: {{ .Values.secrets.existingIntegrationSecret }}}
          {{- end }}
          readinessProbe:
            httpGet: {path: /admin/health, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /admin/health, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
            initialDelaySeconds: 60
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, configMap: {name: correlix-config}}
        - {name: data, persistentVolumeClaim: {claimName: api-data}}
{{- end }}
{{- if .Values.correlation.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "correlation") | indent 4 }}
spec:
  replicas: {{ .Values.correlation.replicas }}
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "correlation") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "correlation") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 10001 "gid" 10001) | indent 6 }}
      containers:
        - name: correlation
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.correlation.image "name" "correlation") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          ports:
            - {name: http, containerPort: 8000}
            - {name: health, containerPort: 8094}
          env:
            - {name: KAFKA_BOOTSTRAP, value: {{ include "correlix.brokerUrls" $ | quote }}}
            - {name: OPENSEARCH_URL, value: "http://opensearch:9200"}
            - {name: CLICKHOUSE_URL, value: "http://clickhouse:8123"}
            - {name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: CLICKHOUSE_PASSWORD}}
            - name: CORR_DEBUG_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: CORR_DEBUG_TOKEN}}
            - {name: LOG_LEVEL, value: {{ .Values.correlation.logLevel | quote }}}
            - {name: CORR_WINDOW_BUFFER, value: {{ .Values.correlation.windowBuffer | quote }}}
            - {name: CORR_DLQ_DIR, value: "/data/deadletter"}
            {{- if .Values.sharedData.enabled }}
            - {name: TENANT_ENRICHMENT_FILE, value: "/data/enrichment/device_tenant.csv"}
            {{- end }}
            - {name: CORR_MEASUREMENT_PROBE_OBSERVERS, value: "api,prober"}
          # The compose healthcheck's sidecar endpoint, unchanged. It answers
          # "the process is up" — NOT "the engine is consuming". Consumer-group
          # membership is the liveness question that matters and it is asked by
          # the vmalert engine-liveness rules, not by a kubelet probe.
          readinessProbe:
            httpGet: {path: /healthz, port: 8094}
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 5
            initialDelaySeconds: 45
          livenessProbe:
            httpGet: {path: /healthz, port: 8094}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
            initialDelaySeconds: 90
          resources:
{{ toYaml .Values.correlation.resources | indent 12 }}
          volumeMounts:
            - {name: deadletter, mountPath: /data/deadletter}
            {{- if .Values.sharedData.enabled }}
            - {name: shared, mountPath: /data/enrichment, subPath: enrichment, readOnly: true}
            {{- end }}
      volumes:
        - {name: deadletter, emptyDir: {sizeLimit: 1Gi}}
        {{- if .Values.sharedData.enabled }}
        - {name: shared, persistentVolumeClaim: {claimName: api-data, readOnly: true}}
        {{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "frontend") | indent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "frontend") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "frontend") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 101 "gid" 101) | indent 6 }}
      containers:
        - name: frontend
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.frontend.image "name" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          # The inner SPA nginx serves static assets only: a 200 on / is a
          # complete statement of its readiness, with no upstream in it.
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
{{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "gateway") | indent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "gateway") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "gateway") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 101 "gid" 101) | indent 6 }}
      containers:
        - name: nginx
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.gateway.image "name" "gateway") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          # Split on purpose. LIVENESS asks only whether nginx itself is alive
          # (a TCP accept); READINESS asks whether the gateway can actually
          # serve the platform, which means the api behind it answers. A
          # liveness probe that proxied would restart a healthy gateway every
          # time the api was slow.
          readinessProbe:
            httpGet: {path: /admin/health, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /tmp}
      volumes:
        - {name: conf, configMap: {name: correlix-gateway}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
{{- end }}
