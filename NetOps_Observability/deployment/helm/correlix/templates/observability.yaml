{{ include "correlix.podCommon" (dict "root" $ "uid" 1000 "gid" 1000) | indent 6 }}
      containers:
        - name: opensearch-dashboards
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.opensearchDashboards.image "name" "opensearch-dashboards") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
