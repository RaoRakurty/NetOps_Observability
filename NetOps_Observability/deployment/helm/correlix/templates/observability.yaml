{{- if .Values.gotenberg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "gotenberg") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "gotenberg") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "gotenberg") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 1001 "gid" 1001) | indent 6 }}
      containers:
        - name: gotenberg
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.gotenberg.image "name" "gotenberg") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          # JavaScript is DISABLED in the renderer. A report template is
          # untrusted HTML as far as this sidecar is concerned (CLAUDE.md §15
          # LLM02: anything derived from model output is data, not code), and
          # the api timeout bounds a template that tries to hang it.
          args: ["gotenberg", "--chromium-disable-javascript=true", "--api-timeout=30s"]
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.gotenberg.resources | indent 12 }}
{{- end }}
{{- if .Values.prober.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "prober") | indent 4 }}
  annotations:
    correlix.io/pod-security: >-
      baseline — NOT restricted. This pod adds CAP_NET_RAW, which restricted
      forbids. Deploy it in a namespace labelled
      pod-security.kubernetes.io/enforce=baseline.
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "prober") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "prober") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prober
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.prober.image "name" "prober") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: ["ALL"]
              # Hop-by-hop path measurement needs per-packet IP TTL control and
              # raw ICMP construction (x/net ipv4 + icmp). Nothing less works.
              add: ["NET_RAW"]
          env:
            - {name: PROBER_ONLY, value: "true"}
            - {name: PROBER_ID, value: "prober"}
            - {name: GOMEMLIMIT, value: {{ .Values.prober.goMemLimit | quote }}}
            - {name: REDIS_HOST, value: "redis"}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: REDIS_PASSWORD}}
            - {name: VICTORIA_URL, value: "http://victoria:8428"}
            - {name: METRICS_URL, value: "http://victoria:8428"}
            - {name: PROBE_EVENT_SINK_URL, value: "http://vector-aggregator:8689/"}
            - {name: INGEST_USER, value: "netops-ingest"}
            - name: INGEST_TOKEN_PROBES
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: INGEST_TOKEN_PROBES}}
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /metrics, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /metrics, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.prober.resources | indent 12 }}
{{- end }}
{{- if .Values.hostExporters.enabled }}
---
{{/*
cAdvisor + node-exporter. BOTH need hostPath mounts and host namespaces:
`privileged` PodSecurity, not `restricted`. Most clusters already run node
metrics of their own — prefer those. This exists so a bare cluster can still
answer the host-resource questions rules.yaml asks (HostOOMKillerFired,
HostMemoryLow, ContainerMemoryNearLimit).
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "node-exporter") | indent 4 }}
  annotations:
    correlix.io/pod-security: "privileged — hostPath + hostNetwork/hostPID"
spec:
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "node-exporter") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "node-exporter") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      hostPID: true
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-exporter
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.hostExporters.nodeExporter.image "name" "node-exporter") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          args: ["--path.rootfs=/host", "--web.listen-address=:9100"]
          ports:
            - {name: metrics, containerPort: 9100, hostPort: 9100}
          readinessProbe:
            httpGet: {path: /metrics, port: 9100}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /metrics, port: 9100}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.hostExporters.nodeExporter.resources | indent 12 }}
          volumeMounts:
            - {name: rootfs, mountPath: /host, readOnly: true, mountPropagation: HostToContainer}
      volumes:
        - {name: rootfs, hostPath: {path: /}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "cadvisor") | indent 4 }}
  annotations:
    correlix.io/pod-security: "privileged — hostPath into the container runtime"
spec:
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "cadvisor") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "cadvisor") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cadvisor
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.hostExporters.cadvisor.image "name" "cadvisor") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            # cAdvisor reads the runtime's cgroup and image state; it cannot do
            # that unprivileged. This is why hostExporters is off by default.
            privileged: true
            allowPrivilegeEscalation: true
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.hostExporters.cadvisor.resources | indent 12 }}
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true}
            - {name: var-run, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: containerd, mountPath: /run/containerd/containerd.sock, readOnly: true}
      volumes:
        - {name: rootfs, hostPath: {path: /}}
        - {name: var-run, hostPath: {path: /var/run}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: containerd, hostPath: {path: /run/containerd/containerd.sock}}
{{- end }}
