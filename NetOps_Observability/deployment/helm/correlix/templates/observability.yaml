{{/*
Alerting, metrics fronts and the optional self-monitoring add-on.

Three monitoring layers exist and EACH MUST WORK WITHOUT THE OTHER TWO — that
requirement comes from the 2026-09-02 outage, where the correlation engine
consumed nothing for three hours while every container read healthy and the one
alert that fired was delivered nowhere. Layer 1 (vmalert rules) and layer 2
(delivery into the api's Alertmanager-v2 receiver) are rendered here. Layer 3
is scripts/stack-watchdog.sh and is deliberately OUT of the cluster — see
cronjob-watchdog.yaml.
*/}}
{{- if .Values.vmalert.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "vmalert") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "vmalert") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "vmalert") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 1000 "gid" 1000) | indent 6 }}
      containers:
        - name: vmalert
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.vmalert.image "name" "vmalert") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          args:
            - -rule=/etc/vmalert/config/rules.yaml
            # vmalert-ONLY on purpose: the scale-SLO rules keep firing when the
            # api is the thing that is down, so they must not depend on it.
            - -rule=/etc/vmalert/config/rules-scale-slo.yaml
            - -datasource.url=http://victoria:8428
            - -remoteWrite.url=http://victoria:8428
            - -remoteRead.url=http://victoria:8428
            - -evaluationInterval={{ .Values.vmalert.evaluationInterval }}
            - -configCheckInterval=60s
            - -external.label=stack={{ .Release.Name }}
            # The shared secret is read from a FILE, never a flag: a token on
            # the command line is visible in every process listing.
            - -notifier.basicAuth.username=vmalert
            - -notifier.basicAuth.passwordFile=/run/secrets/vmalert_notifier_password
            {{- if .Values.vmalert.notifierBlackhole }}
            - -notifier.blackhole
            {{- else }}
            - -notifier.url=http://api:8080/api/internal/vmalert
            {{- end }}
          ports:
            - {name: http, containerPort: 8880}
          readinessProbe:
            httpGet: {path: /health, port: 8880}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: 8880}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
            initialDelaySeconds: 60
          resources:
{{ toYaml .Values.vmalert.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/vmalert/config, readOnly: true}
            - {name: notifier-secret, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: config, configMap: {name: correlix-config}}
        - name: notifier-secret
          secret:
            secretName: {{ include "correlix.secretName" $ }}
            items:
              - {key: VMALERT_WEBHOOK_TOKEN, path: vmalert_notifier_password}
{{- end }}
{{- if .Values.vmauth.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmauth
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "vmauth") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "vmauth") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "vmauth") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 1000 "gid" 1000) | indent 6 }}
      containers:
        - name: vmauth
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.vmauth.image "name" "vmauth") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          args:
            - -auth.config=/etc/vmauth/config/vmauth.yml
            {{- if .Values.tls.enabled }}
            # vmauth exists to stop anonymous WRITE to the metrics store
            # (alert forgery/suppression). Serving it in plaintext would put a
            # credential on the wire in front of the thing it protects, so the
            # TLS flags are not optional when the mesh is on.
            - -tls
            - -tlsCertFile=/tls/tls.crt
            - -tlsKeyFile=/tls/tls.key
            {{- end }}
            - -httpListenAddr=:8427
          envFrom:
            # vmauth.yml expands the per-identity credentials with %{ENV}.
            - secretRef: {name: {{ include "correlix.secretName" $ }}}
          ports:
            - {name: http, containerPort: 8427}
          readinessProbe:
            httpGet: {path: /health, port: 8427}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /health, port: 8427}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.vmauth.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/vmauth/config, readOnly: true}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - {name: config, configMap: {name: correlix-config}}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ default "correlix-vmauth-tls" (get .Values.tls.existingSecrets "vmauth") }}
        {{- end }}
{{- end }}
{{- if .Values.kafkaExporter.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "kafka-exporter") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "kafka-exporter") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "kafka-exporter") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 65534 "gid" 65534) | indent 6 }}
      containers:
        - name: kafka-exporter
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.kafkaExporter.image "name" "kafka-exporter") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict "readOnlyRootFilesystem" true) | indent 12 }}
          # Consumer-group LAG is the ONLY signal that tells "quiet bus, quiet
          # network" apart from "quiet bus, dead consumer": producer and
          # consumer rates read zero in both cases, lag only grows in the second.
          args:
            - --kafka.server={{ include "correlix.brokerUrls" $ }}
            - --topic.filter=^netops\..*
            - --group.filter=^netops-.*
          ports:
            - {name: metrics, containerPort: 9308}
          readinessProbe:
            httpGet: {path: /metrics, port: 9308}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /metrics, port: 9308}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.kafkaExporter.resources | indent 12 }}
{{- end }}
{{- if .Values.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "grafana") | indent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "grafana") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "correlix.selectorLabels" (dict "root" $ "component" "grafana") | indent 8 }}
    spec:
{{ include "correlix.podCommon" (dict "root" $ "uid" 472 "gid" 472) | indent 6 }}
      containers:
        - name: grafana
          image: {{ include "correlix.image" (dict "root" $ "img" .Values.grafana.image "name" "grafana") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
{{ include "correlix.containerSecurity" (dict) | indent 12 }}
          env:
            # Served behind the gateway at /grafana/. The gateway runs an
            # auth_request against the api and forwards the resolved user in
            # X-WEBAUTH-USER; the GF_AUTH_PROXY_* block below is what makes
            # Grafana trust that header. Drop it and the iframe stops working
            # — this is a contract with nginx/default.conf, not decoration.
            #
            # ROOT_URL is derived from the request rather than compose's
            # hardcoded http://localhost:8000/grafana/, so it is correct behind
            # whatever host the Ingress serves.
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_AUTH_PROXY_ENABLED, value: "true"}
            - {name: GF_AUTH_PROXY_HEADER_NAME, value: "X-WEBAUTH-USER"}
            - {name: GF_AUTH_PROXY_HEADER_PROPERTY, value: "username"}
            - {name: GF_AUTH_PROXY_AUTO_SIGN_UP, value: "true"}
            - {name: GF_AUTH_PROXY_SYNC_TTL, value: "60"}
            - {name: GF_AUTH_PROXY_HEADERS_ENCODED, value: "false"}
            - {name: GF_USERS_AUTO_ASSIGN_ORG, value: "true"}
            - {name: GF_USERS_AUTO_ASSIGN_ORG_ROLE, value: "Admin"}
            # Anonymous is Viewer-only and reachable ONLY through the gateway,
            # which authenticates first. The NetworkPolicy above is the second
            # layer: nothing but the gateway may open :3000.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_AUTH_ANONYMOUS_ORG_NAME, value: "Main Org."}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_DISABLE_SIGNOUT_MENU, value: "true"}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
            - {name: GF_USERS_DEFAULT_THEME, value: "light"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: GRAFANA_ADMIN_PASSWORD}}
            # The ClickHouse datasource credential the provisioning files read.
            - name: GRAFANA_CH_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "correlix.secretName" $ }}, key: GRAFANA_CH_PASSWORD}}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /grafana/api/health, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /grafana/api/health, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
            initialDelaySeconds: 60
          resources:
{{ toYaml .Values.grafana.resources | indent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
{{ include "correlix.labels" (dict "root" $ "component" "grafana") | indent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if or .Values.grafana.persistence.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.grafana.persistence.storageClass | default .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
{{- end }}
{{- if .Values.opensearchDashboards.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
