# Correlix Helm values.
#
# READ docs/DEPLOY_KUBERNETES.md BEFORE CHANGING ANYTHING HERE. Three
# properties of this file are load-bearing and easy to break by accident:
#
#  1. SERVICE NAMES ARE LITERAL, NOT RELEASE-PREFIXED. Every config the chart
#     mounts (vector.yaml, vmscrape.yml, rules.yaml, gnmic.yaml, nginx's
#     default.conf, the api's env) addresses its peers by the bare compose
#     service name — `kafka`, `victoria`, `opensearch`, `api`. In-namespace
#     DNS resolves those short names, so the same configuration files work
#     unmodified on Kubernetes. Renaming a Service breaks the pipeline
#     silently. One Correlix release per namespace, therefore.
#
#  2. NO SECRET IS EVER GENERATED BY THIS CHART. `secrets.existingSecret` names
#     a Secret you create (or an ExternalSecret materialises). A chart that
#     mints credentials puts them in the release manifest, where `helm get
#     manifest` and every backup of the release Secret leaks them.
#
#  3. EVERY THIRD-PARTY IMAGE IS PINNED BY THE DIGEST THE COMPOSE STACK PINS.
#     Digests here and in deployment/docker/docker-compose.yml are kept equal
#     by tests/test_helm_chart.py. Correlix's own five images are built per
#     commit and therefore carry a tag, not a digest, until you publish them —
#     set `images.requireDigest: true` in production and supply the digests.

# ── global ──────────────────────────────────────────────────────────────────
global:
  # Prefix for EVERY image reference (air-gapped mirror / private registry).
  # "" leaves each repository below untouched.
  imageRegistry: ""
  imagePullSecrets: []
  # Applied to every PVC that does not set its own. "" = cluster default class.
  storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

images:
  pullPolicy: IfNotPresent
  # PRODUCTION SETTING. true makes an image reference without an @sha256:
  # digest a hard template failure naming the offending service, instead of a
  # silently mutable tag. Left false by default only because Correlix's own
  # five images (api, correlation, frontend, gateway, vector-router) are built
  # per commit and have no digest until your pipeline publishes them.
  requireDigest: false

# ── namespace + pod security ────────────────────────────────────────────────
namespace:
  # The chart does NOT create its namespace by default (`helm install
  # --create-namespace` is the idiom). Set true to have the chart own it,
  # which is the only way it can also carry the Pod Security labels below.
  create: false
  name: ""
  # Pod Security Admission. `restricted` is the target and what every workload
  # in this chart is written for. Two opt-in add-ons cannot meet it and say so
  # in their own comments: prober (CAP_NET_RAW) and the host exporters
  # (hostPath + host namespaces). Enabling those requires a `baseline` (prober)
  # or `privileged` (exporters) namespace — deploy them in their own.
  podSecurityStandard: restricted

serviceAccount:
  create: true
  name: correlix
  annotations: {}

# ── secrets (REFERENCED, NEVER CREATED) ─────────────────────────────────────
#
# Create it from the installer's .env contract — the key names below are
# exactly the variable names scripts/install.py generates:
#
#   kubectl create secret generic correlix-secrets \
#     --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=... [...]
#
# or point an ExternalSecret at your vault and have it materialise the same
# name. docs/DEPLOY_KUBERNETES.md §Secrets lists every required key.
secrets:
  existingSecret: correlix-secrets
  # Optional second Secret carrying integration credentials (Slack, PagerDuty,
  # SMTP, ServiceNow, Jira, the copilot API key). Mounted as envFrom on the
  # api only. "" disables.
  existingIntegrationSecret: ""

# ── app-state backend (tracker 245: PostgreSQL is the default) ──────────────
store:
  # postgres | file | memory. `postgres` is the default for new installations
  # (docs/DEPLOY_POSTGRES_APPSTATE.md). `file` is explicit compatibility mode
  # and requires api.persistence to be a durable volume. `memory` is dev/test
  # only and loses everything on restart.
  backend: postgres
  # DSN for the non-superuser, NOBYPASSRLS `netops_app` role. The password is
  # read from the Secret key DATABASE_URL — set that key, not this one, unless
  # you are pointing at an external PostgreSQL with no secret material in the
  # DSN. When empty the api builds the DSN from DB_* env.
  databaseUrlFromSecret: true

# ── ingress (replaces the host port publish; the gateway pod stays) ─────────
#
# WHY THE GATEWAY POD STAYS. deployment/docker/nginx/default.conf is not a
# dumb path router: it runs `auth_request` subrequests against the api in front
# of Grafana, OpenSearch Dashboards, NetBox and Keycloak. An Ingress cannot
# express that, so removing the gateway would publish four authenticated
# surfaces unauthenticated. The Ingress terminates outside traffic and forwards
# ONE path (`/`) to the gateway Service, which keeps the compose routing table
# and its auth gates byte-for-byte (the only edited line is `resolver`).
ingress:
  enabled: true
  className: nginx
  host: correlix.local
  path: /
  pathType: Prefix
  annotations:
    # The SPA and the log-search API move bodies larger than the 1m default.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    enabled: false
    secretName: correlix-ingress-tls

# ── network policy (zero trust, §3: default deny both directions) ───────────
networkPolicy:
  enabled: true
  # CIDRs allowed to reach the edge collectors (syslog 514, netflow 2055,
  # ipfix 4739, sflow 6343, snmp traps 1162, bmp 11019) from OUTSIDE the
  # cluster. Empty means "cluster-internal only" — devices on the estate will
  # NOT be able to send until you list their ranges. Narrow this; the compose
  # default of 10.0.0.0/8 is a scaffold value, not a production one.
  deviceCIDRs: []
  # Egress the api legitimately needs off-cluster: LLM provider, ITSM, ntfy,
  # RIPEstat/RDAP, device SSH. Default-deny is enforced; these are the holes.
  apiEgressCIDRs: []
  # The cluster DNS service, so a default-deny policy does not break name
  # resolution. Adjust if your cluster does not run CoreDNS in kube-system.
  dnsNamespace: kube-system

# ── internal TLS mesh (compose.tls.yml equivalent) ──────────────────────────
#
# NOT ENABLED BY DEFAULT, exactly like the compose stack: the base compose file
# is plaintext-default and compose.tls.yml is the supported opt-in variant.
# On Kubernetes the api's internal CA (TLS_INTERNAL_CA + the swtpm seal
# sidecar) has no equivalent — its custody model is a host TPM device. Two
# supported shapes instead:
#   certManager.enabled=true  — cert-manager issues one Certificate per service
#                               from an issuer YOU own; the chart mounts them.
#   certManager.enabled=false + tls.existingSecrets — you mint the SVIDs
#                               yourself and hand the chart Secret names.
tls:
  enabled: false
  trustDomain: netops
  # Secret carrying ca.crt for the mesh trust bundle.
  caSecret: correlix-mesh-ca
  # service name -> Secret holding tls.crt/tls.key. Consulted when
  # certManager.enabled is false.
  existingSecrets: {}

certManager:
  enabled: false
  issuerRef:
    kind: Issuer
    name: correlix-mesh
    group: cert-manager.io
  duration: 168h   # matches TLS_SVID_TTL in compose.tls.yml
  renewBefore: 84h # the api re-issues at TTL/2; mirror it

# ── shared data volume ──────────────────────────────────────────────────────
#
# The compose stack shares data/api/enrichment and data/api/processors from the
# api to vector-aggregator, vector-router and correlation via bind mounts. On
# Kubernetes that is one ReadWriteMany volume: the api writes it, the three
# consumers mount it read-only. With no RWX class available set enabled=false —
# tenant enrichment then falls back to the default tenant and the router's
# hot-reloaded processors are unavailable, which docs/DEPLOY_KUBERNETES.md
# states as a named limitation rather than leaving it to be discovered.
sharedData:
  enabled: true
  accessModes: [ReadWriteMany]
  size: 5Gi
  storageClass: ""

# ── bootstrap jobs (post-install / post-upgrade Helm hooks) ─────────────────
#
# `docker compose up` exiting 0 is not evidence, and neither is `helm install`
# succeeding: the three bootstraps below are what make a fresh install work.
# All three are idempotent, so they re-run safely on every upgrade.
bootstrap:
  kafkaInit:
    enabled: true      # pre-creates the 21 canonical netops.* topics
  kafkaAcls:
    enabled: false     # SEC-007 ACL matrix — only meaningful on an authorizing
                       # broker, i.e. tls.enabled. Turning it on against a
                       # plaintext broker is a no-op that looks like coverage.
  opensearchInit:
    enabled: true      # ISM retention policy + snapshot repository/policy
  opensearchSecurityInit:
    enabled: false     # security plugin config; requires tls.enabled
  # Helm hook weights run them in this order.
  backoffLimit: 6
  # A bootstrap that never finishes must FAIL, not sit Running. apply-ism.sh
  # waits for OpenSearch in an unbounded loop; this is the bound.
  activeDeadlineSeconds: 900
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 256Mi}

# ── the external watchdog ───────────────────────────────────────────────────
#
# scripts/stack-watchdog.sh is deliberately OUT OF BAND: it is the only
# monitoring layer that survives the whole stack dying, and a watchdog that
# dies with what it watches reports nothing. An in-cluster CronJob cannot hold
# that property — the cluster is what fails. So it is DISABLED here and the
# recommended deployment is unchanged: a cron on a host outside the cluster.
# The CronJob below is offered for the SUBSET that does not need to survive
# cluster death (consumer-group membership + the alert-delivery heartbeat,
# queried from VictoriaMetrics) and is explicitly not a replacement.
watchdog:
  enabled: false
  schedule: "*/5 * * * *"
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits:   {cpu: 200m, memory: 128Mi}

# ── environment / feature flags ─────────────────────────────────────────────
#
# The api reads ~200 environment variables (see `newServer()` in main.go). The
# chart sets the WIRING (peer URLs, ports, store backend, credentials) itself
# and exposes the feature surface here — anything not listed keeps the binary's
# own default, which is the same thing an unset compose `${VAR:-}` does.
env:
  # Collection / discovery
  ENABLE_SNMP_DISCOVERY: "false"
  # Scaffold value in compose. Narrow before pointing at a real network.
  SNMP_CIDR_RANGES: "10.0.0.0/8"
  ENABLE_SNMP_COLLECTION: "false"
  ENABLE_SNMP_METRICS: "false"
  ENABLE_GNMI_COLLECTION: "false"
  ENABLE_NETCONF_COLLECTION: "false"
  ENABLE_TUNNEL_DISCOVERY: "false"
  # Notifications — every channel off until its credentials exist.
  FEATURE_SLACK_NOTIFICATIONS: "false"
  FEATURE_PAGERDUTY_NOTIFICATIONS: "false"
  FEATURE_EMAIL_NOTIFICATIONS: "false"
  FEATURE_SERVICENOW_NOTIFICATIONS: "false"
  FEATURE_JIRA_NOTIFICATIONS: "false"
  # LLM copilot: off unless FEATURE_COPILOT=true AND COPILOT_API_KEY is in the
  # integration Secret (CLAUDE.md §15 / OWASP LLM04 — an authenticated,
  # bounded, audited endpoint or nothing).
  FEATURE_COPILOT: "false"
  # Correlation retention
  CORR_RETENTION_PROFILE: "production"
  # Bus
  BUS_PARTITIONS: "1"

# ═══════════════════════════════════════════════════════════════════════════
# SERVICES
#
# Resource requests/limits are the compose limits (docker-compose.yml
# defaults, with correlation taking compose.mem125.yml's 1280m). They are LAB
# SIZING, not production sizing — docs/RESOURCE_SIZING.md owns the real model;
# run `python3 scripts/install.py --plan-resources` against your host shape and
# transfer the result here.
# ═══════════════════════════════════════════════════════════════════════════

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    digest: sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: "2",  memory: 1Gi}

redis:
  # Valkey (BSD-3), NOT Redis: redis:7-alpine is RSALv2/SSPL and blocks
  # redistribution (#97). The SERVICE NAME stays `redis` because every
  # REDIS_HOST consumer addresses it that way — deliberate, do not rename.
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8-alpine
    digest: sha256:cfe71288f087704b06be45e270afa7a2abbf820093d6b11a23762081f5ff321d
  maxmemory: 96mb
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: 4.1.1
    digest: sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
  heap: 512m
  heapMin: 256m
  # The bus is a transit lane, not a store: retention is bounded cluster-wide,
  # the durable copies live in ClickHouse / OpenSearch / VictoriaMetrics.
  retentionMs: "259200000"
  retentionBytes: "536870912"
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: "2",  memory: 1Gi}

opensearch:
  enabled: true
  image:
    # The compose stack builds a SLIM derivative (netops-opensearch:2.16.0-slim,
    # ~560 MB of unused plugins removed). That build is local to compose; this
    # is the exact upstream image it derives FROM, pinned by the same digest.
    # Publish the slim image and repoint here to get the smaller pull.
    repository: opensearchproject/opensearch
    tag: 2.16.0
    digest: sha256:d5dd094fd48bdc4dfd032b7137c9c44a697071dcf320f1a76bc4159fe079679c
  heap: 1g
  # 0 on a single node: a replica can never be assigned there and pins the
  # cluster yellow forever (F-53). Raise to >=1 on a multi-node cluster.
  replicaCount: 0
  logRetentionDays: "14"
  quarantineRetentionDays: "30"
  snapshotKeep: "14"
  persistence:
    size: 100Gi
    storageClass: ""
  snapshots:
    # A snapshot living inside the thing it backs up is not a backup (F-59).
    # Separate claim; copy it off-cluster to make it one.
    size: 50Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 3Gi}
    limits:   {cpu: "3",  memory: 3Gi}

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: 24.8-alpine
    digest: sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
  db: netops
  user: netops
  # Internal caps, each BELOW the container boundary so a failure is a
  # recoverable query error rather than a kernel OOM-kill (RESOURCE_SIZING.md).
  memRatio: "0.9"
  maxServerMemory: "4294967296"
  mergesMem: "1610612736"
  hotUiMem: "1073741824"
  bgMem: "2147483648"
  spillBytes: "1610612736"
  maxConcurrentQueries: "100"
  persistence:
    size: 200Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 4Gi}
    limits:   {cpu: "3",  memory: 4Gi}

victoria:
  enabled: true
  image:
    repository: victoriametrics/victoria-metrics
    tag: v1.101.0
    digest: sha256:91d0456cc064e195869175074ced2a6849d72531613b320492698e5fe935d10a
  retention: 30d
  dedupMinScrapeInterval: 30s
  memoryAllowedPercent: "60"
  persistence:
    size: 100Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 1536Mi}
    limits:   {cpu: "2",  memory: 1536Mi}

vmalert:
  enabled: true
  image:
    repository: victoriametrics/vmalert
    tag: v1.101.0
    digest: sha256:83137300d1451461884093697fbbeea56529cc8201d3b31cdce3b530e8d5af6f
  evaluationInterval: 30s
  # vmalert POSTs to the api's Alertmanager-v2 receiver, which fans into
  # notify.Dispatcher. `-notifier.blackhole` is the explicit opt-out; setting
  # it means alerts fire and reach nobody, including the AlertingHeartbeat
  # that is the only end-to-end proof the delivery chain works.
  notifierBlackhole: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: "1",  memory: 256Mi}

vmauth:
  # SEC-010 authenticating TLS front for VictoriaMetrics. Off by default, same
  # as its compose profile; only meaningful with tls.enabled.
  enabled: false
  image:
    repository: victoriametrics/vmauth
    tag: v1.101.0
    digest: sha256:2b56af142a4a5549a333a3882b10cfb01de7807979ffec46f081152ad238d666
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

api:
  enabled: true
  replicas: 1
  image:
    # FIRST-PARTY, built per commit by .github/workflows/publish-images.yml.
    # Set `digest` and images.requireDigest=true in production.
    repository: ghcr.io/correlix/netops-api
    tag: "0.9.0-rc1"
    digest: ""
  goMemLimit: 460MiB
  # Edge listeners. Both are opt-in features in the api; the Services and
  # NetworkPolicy holes only render when the matching flag is on.
  snmpTraps:
    enabled: false
    port: 1162
  bmp:
    enabled: false
    port: 11019
  persistence:
    # /data — users.json on the file backend, dead-letter files, config
    # backups, pcap, enrichment and processor output. Required even on the
    # postgres backend: several subsystems write files there by design.
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: "2",  memory: 512Mi}

correlation:
  enabled: true
  # Scales by tenant-keyed co-partitioning: instance k gets partition k of
  # every topic. A replica beyond BUS_PARTITIONS joins the group, receives
  # nothing and processes nothing — raise env.BUS_PARTITIONS first, in a quiet
  # window (docs/scale-correlation.md).
  replicas: 1
  image:
    repository: ghcr.io/correlix/netops-correlation
    tag: "0.9.0-rc1"
    digest: ""
  # A RESOURCE CEILING, not the RCA horizon. Sized from compose.mem125.yml so
  # it does not bind at the workload the 1280Mi limit is qualified for.
  windowBuffer: "150000"
  logLevel: info
  resources:
    requests: {cpu: 500m, memory: 1280Mi}
    limits:   {cpu: "2",  memory: 1280Mi}

frontend:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/correlix/netops-frontend
    tag: "0.9.0-rc1"
    digest: ""
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

gateway:
  # The outer nginx. Named `gateway` in values, but its Service is `nginx` so
  # nothing that addresses it has to change.
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/correlix/netops-nginx
    tag: "0.9.0-rc1"
    digest: ""
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

vectorAggregator:
  enabled: true
  image:
    repository: timberio/vector
    tag: 0.40.0-alpine
    digest: sha256:7a81fdd62e056321055a9e4bdec4073d752ecf68f4c192e676b85001721523c2
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: "2",  memory: 512Mi}

vectorRouter:
  enabled: true
  image:
    # FIRST-PARTY. Not the stock vector image: the router's secret-backend
    # script needs curl, which deployment/docker/vector-router/Dockerfile adds
    # on top of the pinned vector base. Build and publish it.
    repository: ghcr.io/correlix/netops-vector-router
    tag: "0.40.0-curl"
    digest: ""
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: "2",  memory: 512Mi}

syslogNg:
  enabled: true
  image:
    repository: balabit/syslog-ng
    tag: 4.7.1
    digest: sha256:d37d9895256fa840bc8e70077a6c74afa27015e27703c3fbb89d5ae3cb956dd9
  service:
    # LoadBalancer to receive syslog from the estate; ClusterIP for an
    # in-cluster-only trial.
    type: ClusterIP
    loadBalancerIP: ""
  persistence:
    # syslog-ng's disk buffer / persist file. Losing it loses in-flight events.
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: "1",  memory: 256Mi}

goflow2:
  enabled: true
  image:
    repository: netsampler/goflow2
    tag: v2.2.1
    digest: sha256:bc7aafd6d724cd0a21b17b3c67f22d514c431021c3531914d964bef8cdd79dbb
  goMemLimit: 460MiB
  service:
    type: ClusterIP
    loadBalancerIP: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "1",  memory: 512Mi}

gnmic:
  enabled: false
  image:
    repository: ghcr.io/openconfig/gnmic
    tag: 0.46.0
    digest: sha256:9538f93a9a85e996d0ad5f7c523835e874557be84b8d279c2a51d2f092b24c7e
  configFile: gnmic.yaml
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "1",  memory: 512Mi}

kafkaExporter:
  # self-monitoring add-on. Consumer-group LAG is the only signal that tells
  # "quiet bus" apart from "dead consumer" — turn it on in production.
  enabled: false
  image:
    repository: danielqsj/kafka-exporter
    tag: v1.7.0
    digest: sha256:e90b7ba06d97717224d67774fc7f208c26d1c4dafd4c8011185b0d45b5b38ace
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: 11.2.0
    digest: sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "1500m", memory: 512Mi}

opensearchDashboards:
  enabled: false
  image:
    repository: opensearchproject/opensearch-dashboards
    tag: 2.16.0
    digest: sha256:14fd4d7882d1adf71fcb01142e38b571add4d7e65dedcd8beffc444520b22a8b
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits:   {cpu: "2",  memory: 768Mi}

gotenberg:
  # PDF rendering sidecar for the report scheduler.
  enabled: false
  image:
    repository: gotenberg/gotenberg
    tag: "8"
    digest: sha256:bddd8ea9d076e2d08b6ddaa6efae6403185202c6dab65a6488ed0a6923d6d8e8
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits:   {cpu: "3",  memory: 768Mi}

prober:
  # CANNOT RUN UNDER PodSecurity `restricted`: active path measurement needs
  # CAP_NET_RAW to build ICMP packets and set per-packet IP TTL. Deploy it in a
  # `baseline` namespace, or leave it off and lose traceroute/STAMP probes.
  enabled: false
  image:
    repository: ghcr.io/correlix/netops-api
    tag: "0.9.0-rc1"
    digest: ""
  goMemLimit: 115MiB
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 128Mi}

hostExporters:
  # cadvisor + node-exporter. BOTH require hostPath mounts and host
  # namespaces: `privileged` PodSecurity, not `restricted`. Most clusters
  # already run their own node metrics — prefer those and leave this off.
  enabled: false
  cadvisor:
    image:
      repository: gcr.io/cadvisor/cadvisor
      tag: v0.52.1
      digest: sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: "1",  memory: 256Mi}
  nodeExporter:
    image:
      repository: prom/node-exporter
      tag: v1.8.2
      digest: sha256:065914c03336590ebed517e7df38520f0efb44465fde4123c3f6b7328f5a9396
