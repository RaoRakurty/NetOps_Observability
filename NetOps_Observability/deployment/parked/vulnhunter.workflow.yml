name: vulnhunter

# VulnHunter (github.com/capitalone/vulnhunter) — agentic AI vulnerability
# analysis (attacker-first entry-point→sink reasoning + falsification pass),
# run via its headless runtime agent. Complements the pattern-based gates
# (gosec/staticcheck/govulncheck, Trivy, gitleaks) with exploitability
# reasoning across Go/Python/TS. Design doc:
#   NetOps_Observability/docs/design/vulnhunter-ci.md
#
# REPORT-ONLY: the scan step is continue-on-error — findings surface as a
# workflow artifact (+ step summary), never a blocked merge, until the tool
# is tuned (v0.1.0, released 2026-07-18).
#
# ── DATA FLOW / OWNER APPROVAL GATE ──────────────────────────────────────
# VulnHunter sends repository source code to Anthropic's API (Claude Opus
# 4.8). This job runs ONLY when secrets.VULNHUNTER_ANTHROPIC_API_KEY is
# set; provisioning that secret is the owner's explicit approval of the
# source-code-to-Anthropic data flow. Without the secret the job exits
# early with a notice and succeeds. The account behind the key should be
# enrolled in Anthropic's Cyber Verification Program (see design doc) —
# vuln-hunting prompts can otherwise trip real-time cyber safeguards.
#
# COST BOUNDING (CLAUDE.md §15 / LLM04): one scan is a long agentic Opus
# run (est. single-digit to low-tens of USD). Bounds: concurrency cancels
# superseded PR runs, job timeout-minutes caps wall clock, the agent's
# stall timeout caps hung subagents, and the model never gets Bash (the
# agent strips it; tools are Agent/Glob/Read/Write only — no code
# execution on the runner from model output).

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1' # weekly baseline scan of main (Mon 02:30 UTC)

permissions:
  contents: read

concurrency:
  group: vulnhunter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnhunt:
    name: VulnHunter agentic scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # SC-010: tool pinned by full commit SHA (= tag v0.1.0).
      VULNHUNTER_REF: 82153a097be836b7357cd030f67a53f8346f489f # v0.1.0
    steps:
      - name: Gate on API key secret (owner approval of data flow)
        id: gate
        env:
          VH_KEY: ${{ secrets.VULNHUNTER_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$VH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=VulnHunter scan skipped::secrets.VULNHUNTER_ANTHROPIC_API_KEY is not set. VulnHunter sends source code to Anthropic's API (Claude Opus); adding the secret is the owner's opt-in to that data flow. See NetOps_Observability/docs/design/vulnhunter-ci.md."
            echo "VulnHunter: skipped (no API key secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Pre-seed the agent's clone slot with THIS ref (PR head / main).
      # The agent's shallow_clone() reuses an existing checkout at
      # <clone-dir>/<repo-name> instead of re-cloning the default branch,
      # so the scan runs against the code under review, and no GitHub
      # token ever reaches the agent.
      - name: Checkout repo under scan (PR head)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: clones/NetOps_Observability

      - name: Checkout VulnHunter (pinned v0.1.0)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: capitalone/VulnHunter
          ref: 82153a097be836b7357cd030f67a53f8346f489f # v0.1.0
          path: vulnhunter

      - name: Set up Python 3.12
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install VulnHunter runtime agent
        if: steps.gate.outputs.enabled == 'true'
        working-directory: vulnhunter/vulnhunter-agent
        run: |
          python -m pip install --quiet .
          # Record the resolved dependency set (claude-agent-sdk etc. are
          # unpinned upstream) so every scan is reproducible/auditable.
          mkdir -p "$GITHUB_WORKSPACE/vulnhunter-output"
          python -m pip freeze > "$GITHUB_WORKSPACE/vulnhunter-output/pip-freeze.txt"
          cp agent/config.example.toml agent/config.toml

      - name: Run /vulnhunt (headless, report-only)
        if: steps.gate.outputs.enabled == 'true'
        id: scan
        continue-on-error: true # report-only until tuned — never blocks merge
        working-directory: vulnhunter/vulnhunter-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.VULNHUNTER_ANTHROPIC_API_KEY }}
        # --no-publish/--no-issues: results stay on the runner (artifact
        # only). Default tool set excludes Bash and we do NOT pass
        # --enable-bash: model output cannot execute on the runner.
        run: |
          python -m agent --mode=scan \
            "https://github.com/${{ github.repository }}" \
            --clone-dir "$GITHUB_WORKSPACE/clones" \
            --model claude-opus-4-8 \
            --no-publish --no-issues \
            --scan-id "${{ github.run_id }}"

      - name: Collect findings
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          set -u
          out="$GITHUB_WORKSPACE/vulnhunter-output"
          mkdir -p "$out"
          # The agent writes <clone>/<name>_VULNHUNT_RESULTS_<tag>_<ts>/ with
          # scan_manifest.json inside it (runner._compute_results_dir).
          find "$GITHUB_WORKSPACE/clones" \
            -type d -name '*_VULNHUNT_RESULTS_*' -exec cp -r {} "$out"/ \; 2>/dev/null || true
          # Also surface the manifest at the artifact root for quick reading.
          find "$out" -mindepth 2 -type f -name 'scan_manifest.json' \
            -exec cp {} "$out"/ \; 2>/dev/null || true
          {
            echo "## VulnHunter scan (report-only)"
            echo ""
            echo "Scan step outcome: \`${{ steps.scan.outcome }}\`"
            echo ""
            if [ -f "$out/scan_manifest.json" ]; then
              echo '```json'
              head -c 4000 "$out/scan_manifest.json"
              echo ""
              echo '```'
            else
              echo "_No scan_manifest.json produced — check the scan step log._"
            fi
            echo ""
            echo "Full report in the \`vulnhunter-findings\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings artifact
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnhunter-findings-${{ github.run_id }}
          path: vulnhunter-output/
          if-no-files-found: warn
          retention-days: 30
