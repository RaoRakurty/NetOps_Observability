# Public API route families that the frontend does NOT call.
#
# Enforced by tests/test_feature_ui_coverage.py. A backend route family
# (`/api/<a>/<b>`) must either be referenced by the frontend sources or appear
# here. A NEW family that is neither fails CI — that is the whole point: the
# 2026-09-05 audit found 34 families with no UI, built over months, unnoticed.
#
# Three sections, all of which suppress the failure, for three different reasons:
#
#   headless    — correct as-is. A machine surface: an nginx auth_request
#                 target, an inbound webhook receiver, a token-authenticated
#                 link opened outside the SPA, a service-to-service route, or a
#                 platform break-glass operation. These never get a page.
#   dynamic     — the frontend DOES call it, through a templated path
#                 (`/api/protocols/${proto}/summary`) the literal scanner
#                 cannot resolve. Cite the template.
#   missing_ui  — DEBT, not design. A real user capability with no surface,
#                 recorded by docs/audit/FEATURE_UI_COVERAGE_2026-09-05.md.
#                 This list may only SHRINK; the test pins its size.
#
# Seeded 2026-09-05 from docs/audit/FEATURE_UI_COVERAGE_2026-09-05.md.

headless:
  - route: /api/auth/osd-gate
    reason: >-
      nginx auth_request target for the embedded /search and /netbox consoles
      (auth.go handleOSDGate, isPlatformOwner). nginx calls it, never a browser
      XHR; it emits X-Netbox-User / X-Grafana-User headers, not a document.

  - route: /api/exports/view/
    reason: >-
      Token-authenticated artifact link (logs_export.go handleExportView). The
      signed, expiring URL is opened directly by the recipient outside the SPA,
      so there is nothing for a page to fetch.

  - route: /api/reports/view/
    reason: >-
      Token-authenticated report artifact link (report_links.go
      handleReportView). The URL is embedded in the "report is ready" email and
      opened outside the SPA; the Reports page links to it rather than fetching.

  - route: /api/integrations/webhook/
    reason: >-
      Inbound ITSM webhook receiver (integrations_http.go
      handleIntegrationWebhook). Authenticated by a per-tenant opaque path token
      plus the provider's own signature; the caller is ServiceNow/Jira/PagerDuty.

  - route: /api/nms/webhook/
    reason: >-
      Inbound NMS vendor-controller webhook receiver (nms_http.go
      handleNMSWebhook, opaque path token + connector signature verification).
      The caller is Meraki or a generic controller, never the browser.

  - route: /api/cloud/ingest/connectors
    reason: >-
      Service-to-service fan-out for the cloud poller (cloud_ingest_service.go,
      requireCloudIngestService — platform owner or the cloudIngestScope service
      JWT). Deliberately cross-tenant; a tenant UI must never see this list.

  - route: /api/appid/fusion/status
    reason: >-
      App-ID fusion worker ops metrics (fusion_worker.go handleFusionStatus) —
      adapter/counter plumbing behind FUSION_WORKER_ENABLED, read by probes and
      the CLI. The user-facing coverage view is /api/appid/status (see the audit).

  - route: /api/rca/
    reason: >-
      The frozen ordered path-spine contract for external consumers
      (path_graph_api.go handleRcaPath). The SPA renders exactly this data via
      /api/correlations/{id}/rca-path-view, so a second UI call would be a
      duplicate, not a gap.

  - route: /api/quarantine/reattribute
    reason: >-
      Platform break-glass: unseal and re-inject quarantined envelopes in
      batches (pipeline_processors.go, requirePlatformAdmin AND
      sensitive_data:admin). Deliberately not a button; it is run deliberately,
      with an audit record, by the platform owner.

  # ── Digital Experience (S17, 2026-09-05) ──────────────────────────────────
  # These two are NOT permanently headless, and the entries below are written
  # to be DELETED. They sit here because the ratchet on `missing_ui` says a new
  # gap belongs in `headless` with a reason, and because the reason is a
  # decision rather than an oversight: the owner ruled on 2026-09-05 that DEM
  # gets a ratified design of record before any screen is built
  # (docs/design/DEM_2026-09-05.md), so the plumbing shipped first and
  # pages/DigitalExperience.tsx is a deliberate stub.
  # test_allowlist_has_no_stale_entries removes them automatically the moment
  # the page calls either route — that is the intended end state.
  - route: /api/dem/targets
    reason: >-
      The per-tenant Digital Experience target catalogue (internal/dem). The
      page that manages it is HELD until the merged DEM design of record is
      ratified (owner, 2026-09-05); the collection, the dem_* series and the
      experience alert rules are live meanwhile. Delete this entry when
      pages/DigitalExperience.tsx starts calling it.

  - route: /api/dem/experience
    reason: >-
      The Digital Experience score (availability against the error budget, p95
      against the declared latency budget, path stability; per target and rolled
      up per site and app). Same hold as /api/dem/targets above — the API is
      complete and the screen is deliberately deferred, not forgotten. Delete
      this entry when the page starts calling it.

dynamic:
  - route: /api/protocols/ospf/adjacencies
    reason: >-
      Called through the templated client path
      `/api/protocols/${encodeURIComponent(proto)}/adjacencies|summary|health`
      in services/api.ts, rendered by pages/igp/IgpAdjacencies.tsx. The literal
      scanner cannot resolve the interpolated protocol segment.

  - route: /api/protocols/isis/adjacencies
    reason: >-
      Same templated client path as the OSPF family above
      (`/api/protocols/${proto}/...`, services/api.ts); IS-IS is the other value
      the proto argument takes.

missing_ui:
  - route: /api/ai/modules
    reason: >-
      DEBT. "What can Iris answer" — enabled AI modules and their question
      categories. Its own doc comment names the missing consumer.

  - route: /api/cloud/network/overview
    reason: >-
      DEBT. Cloud provider/seam roll-up with open-issue localization counts;
      the handler comment names a "Cloud Network Overview surface" that is unbuilt.
