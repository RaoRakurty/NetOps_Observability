  - id: ctl-noise
    template: negative_debug_probe
    trigger: { at: "+135s" }   # deliberately inside the fold's window
    affected:
      devices: [ctl-a-1, ctl-b-1, ctl-c-1]
      tenants: [ctl-a, ctl-b, ctl-c]
    params: { probe_loss_pct: 90, count: 4 }
    expect:
