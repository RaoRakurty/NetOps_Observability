        intent: customer_path, vantage: public_cloud_agent }

stories:
  # ── fold firing 1/3: ONE uniform signature, all 130 switches,
  # all 6 ports. 1690 events in a ~6s window.
  - id: fold-t1
    template: link_down_cascade
    trigger: { at: "+120s" }
    affected:
      devices: [
        acc-0001, acc-0002, acc-0003, acc-0004, acc-0005, acc-0006, acc-0007, acc-0008,
        acc-0009, acc-0010, acc-0011, acc-0012, acc-0013, acc-0014, acc-0015, acc-0016,
        acc-0017, acc-0018, acc-0019, acc-0020, acc-0021, acc-0022, acc-0023, acc-0024,
        acc-0025, acc-0026, acc-0027, acc-0028, acc-0029, acc-0030, acc-0031, acc-0032,
        acc-0033, acc-0034, acc-0035, acc-0036, acc-0037, acc-0038, acc-0039, acc-0040,
        acc-0041, acc-0042, acc-0043, acc-0044, acc-0045, acc-0046, acc-0047, acc-0048,
        acc-0049, acc-0050, acc-0051, acc-0052, acc-0053, acc-0054, acc-0055, acc-0056,
        acc-0057, acc-0058, acc-0059, acc-0060, acc-0061, acc-0062, acc-0063, acc-0064,
        acc-0065, acc-0066, acc-0067, acc-0068, acc-0069, acc-0070, acc-0071, acc-0072,
        acc-0073, acc-0074, acc-0075, acc-0076, acc-0077, acc-0078, acc-0079, acc-0080,
        acc-0081, acc-0082, acc-0083, acc-0084, acc-0085, acc-0086, acc-0087, acc-0088,
        acc-0089, acc-0090, acc-0091, acc-0092, acc-0093, acc-0094, acc-0095, acc-0096,
        acc-0097, acc-0098, acc-0099, acc-0100, acc-0101, acc-0102, acc-0103, acc-0104,
        acc-0105, acc-0106, acc-0107, acc-0108, acc-0109, acc-0110, acc-0111, acc-0112,
        acc-0113, acc-0114, acc-0115, acc-0116, acc-0117, acc-0118, acc-0119, acc-0120,
        acc-0121, acc-0122, acc-0123, acc-0124, acc-0125, acc-0126, acc-0127, acc-0128,
        acc-0129, acc-0130
      ]
      tenants: [bigfold]
    params:
      # THE multi-port fault: every switch drops all six access ports at
      # once. Without this the plan faults interfaces[0] only, each device
      # contributes a single node, no device has two ports to weld the
      # per-port cliques together, and you get 6 objects of 130 nodes
      # instead of one giant one.
      interfaces: [GigabitEthernet0/1, GigabitEthernet0/2, GigabitEthernet0/3, GigabitEthernet0/4, GigabitEthernet0/5, GigabitEthernet0/6]
      probe_loss_pct: 90
    expect:
      rca:
        # rank-7 shared-token groundings are NON-authoritative by design
        # (engine.py: 'a coincidence detector'), and the verdict gate
        # refuses to confirm on them — so 'suspected' is the honest
        # ceiling here and 'confirmed' would be the wrong assertion.
        verdict_tier_at_least: suspected
        # MEASURED, not predicted. This scenario was first written
        # expecting 'local-link-fault|access|link' — the shape is a
        # uniform LOCAL PORT fault on 130 role=leaf switches and the
        # topology contains no spine at all. The live run (2026-08-17,
        # both giant objects, all 12 versions each) instead ranked
        # sig.ent.fabric.spine-leaf-path-degradation at confidence 1.0.
        # That is recorded here as fact and filed as an engine RANKING
        # question (tracker 154) — it is NOT what this scenario proves,
        # so the pattern accepts either rather than failing every run on
        # an open ranking gap.
        hypothesis_matches: "spine-leaf-path-degradation|local-link-fault"
        affected_includes: [acc-0001, acc-0065, acc-0130]
        # NOTE: `single_incident` is deliberately NOT asserted. The fold
        # DOES produce one giant object (measured: 2 objects of 1,167 and
        # 1,171 nodes, one per 900s window generation), but the clause
        # counts EVERY non-merged object touching any story entity — and
        # the baseline chatter lane contributes 101 unrelated 1-node
        # 'undetermined' device_alarm objects, one per switch. Asserting
        # it here would measure the chatter, not the fold.
      forbid:
        cross_tenant_merge: true

