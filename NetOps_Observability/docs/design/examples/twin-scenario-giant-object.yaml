# CORRELIX Network Digital Twin — GIANT-OBJECT scenario (tracker 152/154).
#
# WHY THIS FILE EXISTS. The P1 event-loop fix (commit 94e8561d) offloads the
# size-unbounded pure-CPU per-object work (content_hash, to_object_row,
# to_edge_rows, to_typed_edge_rows, to_evidence_rows, material_hash, the CH
# NDJSON body build, the batcher token) to a thread pool above
# CORR_OFFLOAD_MIN_ELEMENTS (2000 elements = nodes + edges). It shipped with
# ONE stated caveat: the live 550k/200k burst validations ran against an EMPTY
# tenant registry, so every event was tenant-refused (identity_unattributable)
# and NO correlation object ever formed. The giant-object path — the actual
# root cause — was therefore proven only by measurement plus the in-process
# unit test (src/correlation/test_loop_blocking.py). This scenario closes that
# caveat: it forms a real giant object on REGISTERED, tenant-attributed
# devices, live.
#
# THE SHAPE, AND WHY IT IS THIS SHAPE. Measured from the engine, not guessed:
#   * %LINK-3-UPDOWN and %LINEPROTO-5-UPDOWN both classify to
#     kind='link_state_change' on entity '<device>:<port>'
#     (src/correlation/producers.py), and a graph node is keyed
#     '<entity_type>:<entity_id>:<kind>' (engine.py build_nodes) — so a
#     (device, port) pair is exactly ONE node no matter how many lines it
#     emits. nodes = H hosts x I ports.
#   * engine.py _candidate_pairs builds a CLIQUE over every shared token, and
#     Node.tokens() keeps the bare PORT NAME. Every switch here carries the
#     same six port names, so all H nodes for 'GigabitEthernet0/1' mesh:
#     that is the quadratic term, and it is the real-world reason a uniform
#     access-layer fault folds a whole layer into one object rather than into
#     H small ones. resolve_grounding admits those pairs at rank 7
#     ('shared:<token>', w_topo 0.5, NON-authoritative) and the same-device
#     pairs at rank 1 ('shared:<device>', w_topo 0.9).
#   * edges = I*C(H,2) + H*C(I,2) = (H*I/2)*(H+I-2)
#   * H=130, I=6  =>  780 nodes, 52260 edges, 53040 elements
#     (the measured pre-fix object was 750 / 48,375 = H=125, I=6; this
#      scenario deliberately EXCEEDS it on both axes.) 53040 elements is
#      ~25x CORR_OFFLOAD_MIN_ELEMENTS, so every offloaded call site fires.
#
# There is no node or edge cap in the engine (deliberately — that unbounded
# growth IS the P1), so the numbers above are what actually gets serialized.
#
# The fold fires THREE times. One firing produces one object version and then
# version damping (CORR_VERSION_HEARTBEAT_S=900) suppresses re-persists, so a
# single firing would prove only one giant serialization. Re-firing adds
# signals to the same nodes, moves material_hash, and forces the engine to
# re-serialize the giant snapshot on successive CORR_ENGINE_INTERVAL_S (30s)
# cycles — which is the sustained per-cycle cost that expired the heartbeat.
#
# All 130 switches sit in ONE tenant, so the fold is intra-tenant and
# legitimate. Three control tenants spread tenant keys over BUS_PARTITIONS
# and assert the giant object never reaches across a tenant boundary.
#
# Budget: 136 devices x 0.1 EPS = 13.6 EPS steady (T1 budget is 200), and
# each firing is 1690 events inside a ~6s window (~281 EPS burst,
# inside the T1 <=1k burst budget). Lanes: syslog + probes only — no trap
# lane (needs FEATURE_SNMP_TRAPS) and no flows lane (needs the twin overlay
# container), so this runs on a stock T1 host.

twin: 1

meta:
  name: giant-object-offload
  description: >
    One uniform access-layer link fault across 130 registered switches in a
    single tenant, folding into one correlation object of 780 nodes /
    ~52260 edges — the shape that owned the event loop for ~7.5s per
    object per cycle before the CORR_OFFLOAD_MIN_ELEMENTS thread-pool
    offload. Fired three times so the giant snapshot is re-serialized.
  seed: 20260817

tenants:
  # `bigfold` owns the whole access layer that folds into one object. The
  # three controls exist to (a) spread tenant keys across BUS_PARTITIONS and
  # (b) assert the fold does not reach across a tenant boundary.
  - alias: bigfold
    org: bigfold-corp
  - alias: ctl-a
    org: ctl-a-inc
  - alias: ctl-b
    org: ctl-b-inc
  - alias: ctl-c
    org: ctl-c-inc

sites:
  - { id: fold1, name: "Fold DC access layer" }
  - { id: ctl1,  name: "Control site" }

devices:
  # ── bigfold: the access layer. IDENTICAL port naming across all 130 is
  # what makes the rank-7 term quadratic — and is how access layers are
  # actually built. No bgp_neighbors: a BGP node would add a second kind per
  # device and blur the node arithmetic this scenario is asserting.
  - name: acc-0001
    tenant: bigfold
    site: fold1
    role: leaf
    snmp: { version: v2c, community: twin-public }
    interfaces: [ { name: GigabitEthernet0/1, speed_mbps: 1000, description: "access port" }, { name: GigabitEthernet0/2, speed_mbps: 1000, description: "access port" }, { name: GigabitEthernet0/3, speed_mbps: 1000, description: "access port" }, { name: GigabitEthernet0/4, speed_mbps: 1000, description: "access port" }, { name: GigabitEthernet0/5, speed_mbps: 1000, description: "access port" }, { name: GigabitEthernet0/6, speed_mbps: 1000, description: "access port" } ]
