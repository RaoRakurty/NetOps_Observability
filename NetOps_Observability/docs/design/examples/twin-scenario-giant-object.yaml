        # both giant objects, all 12 versions each) instead ranked
        # sig.ent.fabric.spine-leaf-path-degradation at confidence 1.0.
        # That is recorded here as fact and filed as an engine RANKING
        # question (tracker 154) — it is NOT what this scenario proves,
        # so the pattern accepts either rather than failing every run on
        # an open ranking gap.
        hypothesis_matches: "spine-leaf-path-degradation|local-link-fault"
        affected_includes: [acc-0001, acc-0065, acc-0130]
        # NOTE: `single_incident` is deliberately NOT asserted. The fold
        # DOES produce one giant object (measured: 2 objects of 1,167 and
        # 1,171 nodes, one per 900s window generation), but the clause
        # counts EVERY non-merged object touching any story entity — and
        # the baseline chatter lane contributes 101 unrelated 1-node
        # 'undetermined' device_alarm objects, one per switch. Asserting
        # it here would measure the chatter, not the fold.
      forbid:
        cross_tenant_merge: true

  # ── fold firing 3/3: ONE uniform signature, all 130 switches,
  # all 6 ports. 1690 events in a ~6s window.
  - id: fold-t3
    template: link_down_cascade
    trigger: { at: "+480s" }
    affected:
      devices: [
        acc-0001, acc-0002, acc-0003, acc-0004, acc-0005, acc-0006, acc-0007, acc-0008,
        acc-0009, acc-0010, acc-0011, acc-0012, acc-0013, acc-0014, acc-0015, acc-0016,
