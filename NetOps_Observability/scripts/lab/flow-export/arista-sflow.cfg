! Arista cEOS — sFlow export to the NetOps collector.
! Apply to: leaf1, leaf2, leaf3, leaf4, wan-r2.
! Verified gap (2026-05-31): "show sflow" => Status: disabled, Destinations: none.
! Management0 is in VRF "default" on these nodes, so no "vrf" keyword is needed.
!
! Push: Cli -p 15, "configure", paste, "end", "write memory".

sflow sample 16384
sflow polling-interval 20
sflow destination 172.40.40.122 6343
sflow source-interface Management0
sflow run

! sFlow runs on all Ethernet interfaces by default once "sflow run" is set.
! If you only want the fabric-facing links sampled, disable per unused intf with:
!   interface Ethernet<n>
!      no sflow enable
!
! Verify on-box:  show sflow   (Status should be "running", Destinations 1)
