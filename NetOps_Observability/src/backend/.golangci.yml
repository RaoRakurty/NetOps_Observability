# golangci-lint config (v2). Aggregates the correctness + security linters from
# CLAUDE.md §12 under one runner. The CI gate (.github/workflows/backend-ci.yml)
# runs this BLOCKING on the crypto/trust packages (tlsconfig, internalca) and
# BLOCKING repo-wide (the backlog was burned to zero 2026-06-04).
#
# Upgraded v1.64 → v2 on 2026-06-05: the `go 1.25.0` directive (forced by
# golang.org/x/crypto v0.52.0, which declares go 1.25.0) made the go1.24-built
# golangci-lint v1.64.8 refuse to load ("language version go1.24 < targeted
# 1.25.0"). v2.12.2 is built with go1.25 and loads cleanly. Migrated with
# `golangci-lint migrate`, then re-tuned to the SAME effective rule set the
# green v1 gate enforced — see the gosec/staticcheck notes below. vendor/,
# testdata/ are auto-skipped.
version: "2"

linters:
  # Keep the v2 defaults (errcheck, govet, ineffassign, staticcheck, unused) and
  # add the security + reliability linters.
  enable:
    - gosec       # security analyzer (honors // #nosec annotations)
    - bodyclose   # HTTP response bodies must be closed (leak guard)
    - noctx       # HTTP requests must carry a context (timeout/cancel)
    - errorlint   # correct error wrapping / comparison
    - misspell
    - unconvert   # redundant type conversions

  settings:
    misspell:
      ignore-rules:
        - routeros  # MikroTik RouterOS — a product name, not a misspelling of "routers"

    gosec:
      # gosec v2 (bundled in golangci v2.12) ships rules that did NOT exist in the
      # gosec bundled by golangci v1.64 — the gate that was burned to zero. Every
      # one of them fires only on intentional, reviewed patterns in this tree, so
      # they are excluded here (not silently — each with a cited reason). Real
      # findings in NEW code still surface; these specific rules are the noise.
      excludes:
        # G115 — "integer overflow int -> byte": all hits are deliberate byte-level
        # PROTOCOL serialization (TACACS+ packet fields, WebSocket frame length
        # headers, SNMP/LDAP BER length octets) where the narrowing is intended and
        # bounded by the wire format. The classic G115 false-positive class.
        - G115
        # G117 — "marshaled struct field matches secret pattern": the flagged fields
        # (Secret/ClientSecret/AuthKey) are persisted only inside Vault-SEALED config
        # blobs (auth_config/oidc_config/snmp_creds), not logged or sent in the clear.
        - G117
        # G124 — "cookie missing Secure/HttpOnly/SameSite": false positive. The auth
        # cookies set HttpOnly + SameSite=Lax and Secure=secureCookies() (env-driven
        # via SECURE_COOKIES because TLS may terminate at the nginx front door);
        # gosec can't prove the variable is always true.
        - G124
        # G602 — "slice index out of range": single hit in bounded protocol parsing
        # (tunnels.go length field), index provably within the parsed buffer.
        - G602
        # G703/G704/G706 — gosec's new EXPERIMENTAL taint-analysis rules
        # (path-traversal / SSRF / log-injection). They flag internally-constructed
        # CA + kv paths and SERVER-CONFIGURED backend URLs (OpenSearch/ClickHouse/
        # gNMI) — none are user-tainted web input. High false-positive; tracked for
        # separate triage rather than enforced here.
        - G703
        - G704
        - G706

    staticcheck:
      # v2 folds stylecheck (ST*) and quickfix (QF*) into the `staticcheck` linter;
      # v1's `staticcheck` ran only the SA* correctness checks. Restate the v2
      # default exclusions and add the three style/quickfix checks that fired (and
      # were never part of the prior gate): QF1001/QF1003 are pure quickfix
      # suggestions; ST1005 trips on proper-noun error prefixes ("Jira: ..."). All
      # SA* correctness checks stay fully enabled.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files deliberately ignore some return values (e.g. driving a handshake
      # only for its OnReject side effect), make short-lived requests without a
      # context or body-close, and embed test certs/keys — noise, not findings.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
      # Outbound clients that connect to SERVER-CONFIGURED endpoints behind explicit
      # client Timeouts (notification webhooks; LDAP/TACACS binds; the device-SSH
      # gateway; copilot/JWKS/OIDC/logs/reports/ClickHouse data calls). Each already
      # satisfies noctx's hang-protection via a bounded Timeout; threading a context
      # through these interfaces is a deliberate context-aware refactor, not a lint
      # cleanup. Excluded with that rationale rather than cargo-culting ctx at the
      # call sites. The HTTP proxy handlers that DO have a request in scope (flows,
      # metrics_query) thread r.Context() instead.
      - path: notify/
        linters:
          - noctx
      - path: (auth_config|clickhouse_policies|copilot|device_ssh|jwks|ldap|logs|oidc|report_scheduler|tacacs)\.go
        linters:
          - noctx
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  # Don't cap findings — show everything (the gate must see all of it).
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
