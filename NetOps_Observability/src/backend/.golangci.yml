# golangci-lint config (v2). Aggregates the correctness + security linters from
# CLAUDE.md §12 under one runner. The CI gate (.github/workflows/backend-ci.yml)
# runs this BLOCKING on the crypto/trust packages (tlsconfig, internalca) and
# BLOCKING repo-wide (the backlog was burned to zero 2026-06-04).
#
# Upgraded v1.64 → v2 on 2026-06-05: the `go 1.25.0` directive (forced by
# golang.org/x/crypto v0.52.0, which declares go 1.25.0) made the go1.24-built
# golangci-lint v1.64.8 refuse to load ("language version go1.24 < targeted
# 1.25.0"). The pin must therefore always be a release whose PUBLISHED binary is
# built with a Go >= this module's `go` directive: the v2.12.2 linux-amd64
# release is built with go1.26.2, so it still loads cleanly after the
# 1.25.13 -> 1.26.8 toolchain raise (go 1.26.0 directive). Migrated with
# `golangci-lint migrate`, then re-tuned to the SAME effective rule set the
# green v1 gate enforced — see the gosec/staticcheck notes below. vendor/,
# testdata/ are auto-skipped.
version: "2"

linters:
  # Keep the v2 defaults (errcheck, govet, ineffassign, staticcheck, unused) and
  # add the security + reliability linters.
  enable:
    - gosec       # security analyzer (honors // #nosec annotations)
    - bodyclose   # HTTP response bodies must be closed (leak guard)
    - noctx       # HTTP requests must carry a context (timeout/cancel)
    - errorlint   # correct error wrapping / comparison
    - misspell
    - unconvert   # redundant type conversions

  settings:
    misspell:
      ignore-rules:
        - routeros  # MikroTik RouterOS — a product name, not a misspelling of "routers"

    gosec:
      # gosec v2 (bundled in golangci v2.12) ships rules that did NOT exist in the
      # gosec bundled by golangci v1.64 — the gate that was burned to zero. Every
      # one of them fires only on intentional, reviewed patterns in this tree, so
      # they are excluded here (not silently — each with a cited reason). Real
      # findings in NEW code still surface; these specific rules are the noise.
      excludes:
        # G115 — "integer overflow int -> byte": all hits are deliberate byte-level
        # PROTOCOL serialization (TACACS+ packet fields, WebSocket frame length
        # headers, SNMP/LDAP BER length octets) where the narrowing is intended and
        # bounded by the wire format. The classic G115 false-positive class.
        - G115
        # G117 — "marshaled struct field matches secret pattern": the flagged fields
        # (Secret/ClientSecret/AuthKey) are persisted only inside Vault-SEALED config
        # blobs (auth_config/oidc_config/snmp_creds), not logged or sent in the clear.
        - G117
        # G124 is NO LONGER excluded tree-wide — see the narrowed per-path rule in
        # `exclusions.rules` below. The blanket form hid a real finding.
        # G602 — "slice index out of range": single hit in bounded protocol parsing
        # (tunnels.go length field), index provably within the parsed buffer.
        - G602
        # G703/G704/G706 — gosec's EXPERIMENTAL taint-analysis rules
        # (path-traversal / SSRF / log-injection).
        #
        # TRIAGED 2026-07-27 (the deferral this comment used to promise was never
        # recorded anywhere, so it is written down here). gosec v2 over the whole
        # backend module reports 13 G703 + 14 G704 + 8 G706 = 35 findings. Every
        # one was traced to its source. ZERO are reachable from untrusted HTTP
        # input; all 35 are dismissed on the basis below.
        #
        #   G704 SSRF (14: rca_report_http×2, logs×2, correlations×2,
        #   collectors/traceroute×2, collectors/poller, collectors/gnmi,
        #   cloud_metrics_series×2, cloud_enrich×2) — the HOST of every sink comes
        #   from a server-configured env var (OPENSEARCH_URL, CORRELATION_URL,
        #   VICTORIA_URL/METRICS_URL, VM_QUERY_URL, REPORT_PDF_SIDECAR_URL,
        #   PROBE_PATHS_PUSH_URL); no request can redirect it. The only
        #   request-derived path/query components are (a) the correlation id, which
        #   handleCorrelationByID refuses unless isUUIDToken(id), and (b) the
        #   OpenSearch index pattern, built from a switch-allowlisted signal plus a
        #   tenant run through tenantSegRe ([^a-z0-9_-] stripped); PromQL reaches
        #   VictoriaMetrics only through url.QueryEscape. Note where the real SSRF
        #   risk lives and how it is handled: the surfaces whose URL is supplied by
        #   an operator (ITSM/ServiceNow/Jira/Slack/PagerDuty) dial through
        #   safehttp.Client, whose dialer Control hook validates the RESOLVED IP
        #   post-DNS/pre-connect (defeats DNS rebinding) — gosec's taint model
        #   cannot see that guard, and it flags none of those calls anyway.
        #
        #   G703 path traversal (13: tls_ca×3, telemetry_enrichment×3,
        #   collectors/traceroute×2, seam_bootstrap, probe_handlers, path_ingest,
        #   pgstore, cloudconn/exchange) — every path is an operator-configured
        #   location (TLS_* cert/key paths, TENANT_ENRICHMENT_DIR, PROBE_PATHS_FILE,
        #   CLOUD_CONNECTOR_WORKLOAD_JWT_FILE) joined with a CONSTANT file name, or
        #   filepath.Join(dir, filepath.Base(key)) over a fixed key list. No handler
        #   contributes a path segment at any of the 13 sites.
        #
        #   G706 log injection (8: telemetry_enrichment×2, svc_backfill×2,
        #   seam_bootstrap, collectors/traceroute, collectors/stamp,
        #   collectors/poller) — what is formatted is env values, an upstream HTTP
        #   status string, and (svc_backfill) a service id that had to RESOLVE in
        #   the service catalog to get that far. No request body, header or
        #   free-form query text reaches a log line at these sites.
        #
        # These stay EXCLUDED (not enforced) because the rules are experimental and
        # flag the sink rather than the taint source, so every current hit is noise.
        # The consequence is explicit: a genuinely tainted NEW sink would not be
        # caught here — re-run this triage when a handler starts building a URL or
        # a filesystem path from request input. Reproduce (CI's pinned gosec):
        #   go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet -fmt=json ./...
        - G703
        - G704
        - G706

    staticcheck:
      # v2 folds stylecheck (ST*) and quickfix (QF*) into the `staticcheck` linter;
      # v1's `staticcheck` ran only the SA* correctness checks. Restate the v2
      # default exclusions and add the three style/quickfix checks that fired (and
      # were never part of the prior gate): QF1001/QF1003 are pure quickfix
      # suggestions; ST1005 trips on proper-noun error prefixes ("Jira: ..."). All
      # SA* correctness checks stay fully enabled.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files deliberately ignore some return values (e.g. driving a handshake
      # only for its OnReject side effect), make short-lived requests without a
      # context or body-close, and embed test certs/keys — noise, not findings.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
      # G124 — "cookie missing Secure/HttpOnly/SameSite", NARROWED here on
      # 2026-07-27 from a tree-wide `gosec.excludes` entry. The blanket exclusion
      # was justified solely in terms of the session cookies ("Secure =
      # secureCookies(), gosec can't prove the variable is always true") and it
      # masked a cookie that genuinely had NO Secure field: the OIDC SSO state
      # cookie (oidc.go), the CSRF defence for the whole SSO callback. Now scoped
      # to the two files whose cookies do set Secure, per request, via
      # cookieSecure(r) (SECURE_COOKIES=true | r.TLS | X-Forwarded-Proto=https —
      # a variable gosec still cannot evaluate). ANYWHERE ELSE a G124 is a real
      # finding and now fails the gate again. The flag itself is asserted by
      # tests, not by this exclusion: TestCookieSecure (auth) and
      # TestSSOStateCookieCarriesSecureOnHTTPS /
      # TestSSOStateClearCookieMatchesSecureSemantics (oidc).
      - path: (^|/)(auth|oidc)\.go$
        linters:
          - gosec
        text: G124
      # Outbound clients that connect to SERVER-CONFIGURED endpoints behind explicit
      # client Timeouts (notification webhooks; LDAP/TACACS binds; the device-SSH
      # gateway; copilot/JWKS/OIDC/logs/reports/ClickHouse data calls). Each already
      # satisfies noctx's hang-protection via a bounded Timeout; threading a context
      # through these interfaces is a deliberate context-aware refactor, not a lint
      # cleanup. Excluded with that rationale rather than cargo-culting ctx at the
      # call sites. The HTTP proxy handlers that DO have a request in scope (flows,
      # metrics_query) thread r.Context() instead.
      - path: notify/
        linters:
          - noctx
      - path: (auth_config|clickhouse_policies|copilot|device_ssh|jwks|ldap|logs|oidc|report_scheduler|tacacs)\.go
        linters:
          - noctx
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  # Don't cap findings — show everything (the gate must see all of it).
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
