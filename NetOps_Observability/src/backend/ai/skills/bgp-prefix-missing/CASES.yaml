#
# Behavioural cases for bgp-prefix-missing. Dialect + contract: skill_cases.go.

# A missing prefix on a session that is not up is the SESSION's fault, not
# policy — and the chain has to say so by going there, from the device's own
# word for the FSM state.
case: an Idle peer sends the investigation to the session, and on to the link beneath it
question: prefix missing on edge-1, route not advertised
ui:
  - correlation_id=case-prefix-idle
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - state:bgp_peer=idle
evidence:
  - finding
  - device
expect_chain:
  - bgp-prefix-missing entry
  - bgp-session-down rule
  - interface-down rule
expect_selected: rule
expect_reason: reachability to the peer
expect_verdict:
  - interface
  - transition
expect_notes:
  - per-turn lookup budget
expect_never:
  - log-confirmation
  - path-seam-handoff
expect_select: bgp-prefix-missing

---

case: an Active peer is also the session's fault, so policy is not yet the question
question: bgp not advertising the prefix from edge-1
ui:
  - correlation_id=case-prefix-active
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
signals:
  - state:bgp_peer=active
evidence:
  - finding
expect_chain:
  - bgp-prefix-missing entry
  - bgp-session-down rule
expect_selected: rule
expect_reason: reports the peer Active
expect_verdict:
  - fsm
  - reset reason
expect_notes:
  - found nothing for the id in scope
expect_never:
  - interface-down
  - log-confirmation

