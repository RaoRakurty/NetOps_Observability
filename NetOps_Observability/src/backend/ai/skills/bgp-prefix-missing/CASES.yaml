---

case: a prefix owned across a handoff is the model's to propose, from the author's own list
question: not learning routes from the partner on edge-1
ui:
  - correlation_id=case-prefix-model
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
model_next: path-seam-handoff
evidence:
  - finding
expect_chain:
  - bgp-prefix-missing entry
  - path-seam-handoff model
expect_selected: model
expect_reason: partner or provider
expect_verdict:
  - seam
  - baseline
expect_never:
  - bgp-session-down
