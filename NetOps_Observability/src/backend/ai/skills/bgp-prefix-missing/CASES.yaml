  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - signature=uncollected
evidence:
  - finding
expect_chain:
  - bgp-prefix-missing entry
  - log-confirmation rule
expect_selected: rule
expect_reason: rejected every read-only command
expect_verdict:
  - quote
  - rate
expect_never:
  - bgp-session-down
  - interface-down

