  - log-confirmation rule
expect_selected: rule
expect_reason: no known signature matched
expect_verdict:
  - quote
  - rate
expect_never:
  - interface-down

---

# An unread device is not a clean one: the live state read is the FIRST thing
# this method does, and its absence is a disclosure, not a silent gap.
case: live state that cannot be read on this deployment is disclosed and routes to the logs
question: is bgp ok on edge-1
ui:
  - correlation_id=case-bgp-notwired
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
  - search_logs=not_wired
signals:
  - state:collect=not_wired
notes:
  - live device state could not be read on this deployment — no command was run
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
  - log-confirmation rule
expect_selected: rule
expect_reason: could not be read live
expect_verdict:
  - quote
  - rate
expect_notes:
  - live device state could not be read on this deployment
  - Log search is not available on this deployment
expect_never:
  - interface-down

---

# No server-derived fact, no deterministic hop. With no provider directive
# either, the investigation stops here rather than guessing onward.
case: evidence with no routing fact takes no hop at all
question: what is the bgp peer doing on edge-1
ui:
  - correlation_id=case-bgp-flat
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
expect_selected: none
expect_verdict:
  - fsm
  - reset reason
expect_notes:
  - found nothing for the id in scope
expect_never:
  - interface-down
  - log-confirmation
  - bgp-prefix-missing
  - path-seam-handoff

---

# The model may only pick from the author's OWN handoff list, and the reason the
# operator is shown is the AUTHOR's words, never the model's.
case: the model may route to a seam handoff the author declared
question: bgp peer down across the provider handoff on edge-1
ui:
  - correlation_id=case-bgp-model
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
model_next: path-seam-handoff
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
  - path-seam-handoff model
expect_selected: model
expect_reason: provider or partner handoff
expect_verdict:
  - seam
  - baseline
expect_never:
  - interface-down
