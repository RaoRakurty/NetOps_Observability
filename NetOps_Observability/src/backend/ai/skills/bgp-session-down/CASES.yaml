#
# Behavioural cases for bgp-session-down. Dialect + contract: skill_cases.go.
# Every case runs the REAL chain over fixture tool results, so a reworded NOC
# signature or a retired condition breaks the build instead of quietly making
# the investigation one hop shallower.

case: the device's own Idle FSM state drives the chain down to the link
question: why is bgp down on edge-1
ui:
  - correlation_id=case-bgp-idle
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - state:bgp_peer=idle
evidence:
  - finding
  - device
expect_chain:
  - bgp-session-down entry
  - interface-down rule
expect_selected: rule
expect_reason: reports the peer Idle
expect_verdict:
  - interface
  - transition
expect_never:
  - log-confirmation
  - bgp-prefix-missing
expect_select: bgp-session-down

---

# The engine's OWN operator phrase is the routing fact — not the model's reading
# of it. This is the `verdict:phrase=link` rule the review named: reword the NOC
# signature from "link" to "circuit" and this case goes red.
case: the engine's verdict naming the link routes to the physical layer
question: bgp neighbor down on edge-1, what happened
ui:
  - correlation_id=case-bgp-phrase
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
signals:
  - verdict:phrase=link
  - verdict:tier=confirmed
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
  - interface-down rule
expect_selected: rule
expect_reason: RCA verdict names the link
expect_verdict:
  - interface
  - transition
expect_notes:
  - found nothing for the id in scope
expect_never:
  - log-confirmation

