case: a diagnostic that captured output and matched nothing still pins the reset reason from the logs
question: ebgp down on edge-1 since this morning
ui:
  - correlation_id=case-bgp-nomatch
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
evidence:
