case: an unreachable peering address is the diagnostic's own signature
question: bgp session not established on edge-1
ui:
  - correlation_id=case-bgp-sig
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - signature=bgp-idle-unreachable
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
  - interface-down rule
expect_selected: rule
expect_reason: peering address is unreachable
expect_verdict:
  - interface
  - transition
expect_never:
  - bgp-prefix-missing

---

# D-4: a capture that produced ZERO bytes is not a clean protocol. It must route
# to the device's own words and say so — never to "no signature matched".
case: a device that rejected every read-only command routes to its own logs
question: bgp idle on edge-1
ui:
  - correlation_id=case-bgp-uncollected
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - signature=uncollected
evidence:
  - finding
expect_chain:
  - bgp-session-down entry
  - log-confirmation rule
expect_selected: rule
expect_reason: rejected every read-only command
expect_verdict:
  - quote
  - rate
expect_never:
  - interface-down

