---

# A tool that FAILED is never quietly absent: the operator is told, and the
# model is told not to invent what it would have returned.
case: a failed health read is disclosed and no hop is invented from it
question: port down on edge-1
ui:
  - correlation_id=case-if-flat
  - device=edge-1
tools:
  - get_device_health=error
evidence:
  - finding
expect_chain:
  - interface-down entry
expect_selected: none
expect_verdict:
  - interface
  - transition
expect_notes:
  - do NOT invent the data it would have returned
expect_never:
  - optics-degraded
  - log-confirmation
  - ospf-adjacency
  - bgp-session-down
  - path-seam-handoff
expect_select: interface-down

---

case: a link that came back while the IGP did not is the model's to propose
question: line protocol down on edge-1 and ospf never came back
ui:
  - correlation_id=case-if-model
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
model_next: ospf-adjacency
evidence:
  - finding
expect_chain:
  - interface-down entry
  - ospf-adjacency model
expect_selected: model
expect_reason: IGP neighbour did not
expect_verdict:
  - stuck state
  - mismatch
expect_never:
  - optics-degraded
