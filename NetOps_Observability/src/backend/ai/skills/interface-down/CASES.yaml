# Behavioural cases for interface-down. Dialect + contract: skill_cases.go.

case: a port counting errors alongside the link event is an optics question
question: interface down on edge-1
ui:
  - correlation_id=case-if-errors
  - device=edge-1
signals:
  - state:if_errors=present
evidence:
  - finding
  - device
expect_chain:
  - interface-down entry
  - optics-degraded rule
expect_selected: rule
expect_reason: counting errors
expect_verdict:
  - error type
  - direction
expect_never:
  - log-confirmation
  - ospf-adjacency
  - bgp-session-down

---

case: a device whose own state cannot be read pins the transition from its logs instead
question: link down on edge-1, when did it go
ui:
  - correlation_id=case-if-notwired
  - device=edge-1
signals:
  - state:collect=not_wired
notes:
  - live device state could not be read on this deployment — no command was run
evidence:
  - finding
expect_chain:
  - interface-down entry
  - log-confirmation rule
expect_selected: rule
expect_reason: pinned from its logs
expect_verdict:
  - quote
  - rate
expect_notes:
  - live device state could not be read on this deployment
expect_never:
  - optics-degraded

