#
# Behavioural cases for osi-bisection — the ENTRY METHOD. Dialect + contract:
# skill_cases.go.
#
# Every `verdict:phrase=` rule below fires on a WORD in the correlation engine's
# OWN authored operator phrase. skill_reference_test.go proves each of those
# words is still producible by the shipped signature catalogue; these cases prove
# that when the word is there, the bisection actually takes the hop.

case: a verdict that names an interface starts the bisection at the physical layer
question: something is broken on edge-1
ui:
  - correlation_id=case-osi-interface
  - device=edge-1
signals:
  - verdict:phrase=interface
  - verdict:tier=confirmed
evidence:
  - finding
  - device
expect_chain:
  - osi-bisection entry
  - interface-down rule
expect_selected: rule
expect_reason: names an interface
expect_verdict:
  - interface
  - transition
expect_never:
  - optics-degraded
  - log-confirmation
  - bgp-session-down

