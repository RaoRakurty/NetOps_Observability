---

# A router that is CPU-bound reframes every symptom above it: adjacency and
# session loss that looks like a link fault is the control plane starving.
case: a saturated control plane is read off the device, not inferred from the symptom
question: why is everything flapping on edge-1
ui:
  - correlation_id=case-osi-cpu
  - device=edge-1
signals:
  - state:platform=cpu_high
evidence:
  - finding
  - device
expect_chain:
  - osi-bisection entry
  - log-confirmation rule
expect_selected: rule
expect_reason: control plane is saturated
expect_verdict:
  - quote
  - rate
expect_never:
  - interface-down
  - bgp-session-down
  - ospf-adjacency

---

# The turn is BOUNDED, and a truncated investigation must never read like a
# complete one: the lookup budget that cut it short is disclosed.
case: a three-method bisection stops at the per-turn lookup budget and says so
question: something is broken on edge-1 and errors are climbing
ui:
  - correlation_id=case-osi-budget
  - device=edge-1
signals:
  - verdict:phrase=interface
  - state:if_errors=present
evidence:
  - finding
  - device
expect_chain:
  - osi-bisection entry
  - interface-down rule
  - optics-degraded rule
expect_selected: rule
expect_reason: counting errors
expect_verdict:
  - error type
  - direction
expect_notes:
  - per-turn lookup budget
expect_never:
  - log-confirmation
  - bgp-session-down

---

# No verdict phrase, no platform fact: the bisection has nothing to branch on and
# must not invent one.
case: an engine verdict with no routing word takes no hop
question: something is broken at the branch site
ui:
  - correlation_id=case-osi-flat
  - device=edge-1
tools:
  - get_active_major_incidents=not_wired
evidence:
  - finding
expect_chain:
  - osi-bisection entry
expect_selected: none
expect_verdict:
  - layer
  - evidence classes
expect_notes:
  - Active incidents is not available on this deployment
expect_never:
  - interface-down
  - optics-degraded
  - stp-topology
  - mac-flap
  - ospf-adjacency
  - isis-adjacency
  - bgp-session-down
  - bgp-prefix-missing
  - path-seam-handoff
  - app-edge-5xx
  - security-exposure-context
  - log-confirmation
expect_select: osi-bisection

