  - correlation_id=case-ospf-model
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
model_next: optics-degraded
evidence:
  - finding
expect_chain:
  - ospf-adjacency entry
  - optics-degraded model
expect_selected: model
expect_reason: dropping the larger database packets
expect_verdict:
  - error type
  - direction
expect_never:
  - interface-down
