# Behavioural cases for ospf-adjacency. Dialect + contract: skill_cases.go.

case: a device with no OSPF adjacency at all points at the circuit beneath it
question: ospf neighbor stuck in exstart on edge-1
ui:
  - correlation_id=case-ospf-none
  - device=edge-1
tools:
  - run_protocol_diagnostic=ok
signals:
  - state:igp_nbr=none
evidence:
  - finding
  - device
expect_chain:
  - ospf-adjacency entry
  - interface-down rule
expect_selected: rule
expect_reason: no OSPF adjacency at all
expect_verdict:
  - interface
  - transition
expect_never:
  - log-confirmation
  - optics-degraded
expect_select: ospf-adjacency

---

case: an unreadable adjacency table sends the transition times to the device's own words
question: ospf down on edge-1
ui:
  - correlation_id=case-ospf-notwired
  - device=edge-1
tools:
  - run_protocol_diagnostic=not_found
signals:
  - state:collect=not_wired
notes:
  - live device state could not be read on this deployment — no command was run
evidence:
  - finding
expect_chain:
  - ospf-adjacency entry
  - log-confirmation rule
expect_selected: rule
expect_reason: could not be read live
expect_verdict:
  - quote
  - rate
expect_notes:
  - live device state could not be read on this deployment
expect_never:
  - interface-down

