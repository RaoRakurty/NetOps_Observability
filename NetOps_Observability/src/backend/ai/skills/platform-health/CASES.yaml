# Behavioural cases for platform-health. Dialect + contract: skill_cases.go.

case: a pinned CPU sends the investigation to the device's own log for the process behind it
question: high cpu on edge-1
ui:
  - correlation_id=case-plat-cpu
  - device=edge-1
signals:
  - state:platform=cpu_high
evidence:
  - finding
  - device
expect_chain:
  - platform-health entry
  - log-confirmation rule
expect_selected: rule
expect_reason: CPU is pinned
expect_verdict:
  - quote
  - rate
expect_never:
  - ntp-clock
expect_select: platform-health

