case: an unsynchronized clock hands off to the clock method, which pins the loss from the log
question: is edge-1 healthy
ui:
  - correlation_id=case-plat-clock
  - device=edge-1
signals:
  - state:clock=unsynced
evidence:
  - finding
  - device
expect_chain:
  - platform-health entry
  - ntp-clock rule
  - log-confirmation rule
expect_selected: rule
expect_reason: lost its time source
expect_verdict:
  - quote
  - rate

---

case: health that cannot be read live leaves the device's own log as the only evidence
question: is edge-1 healthy right now
ui:
  - correlation_id=case-plat-notwired
  - device=edge-1
signals:
  - state:collect=not_wired
notes:
  - live device state could not be read on this deployment — no command was run
evidence:
  - finding
expect_chain:
  - platform-health entry
  - log-confirmation rule
expect_selected: rule
expect_reason: could not be read live
expect_verdict:
  - quote
  - rate
expect_notes:
  - live device state could not be read on this deployment
expect_never:
  - ntp-clock

---

case: readings within bounds take no hop and say so
question: cpu utilization on edge-1
ui:
  - correlation_id=case-plat-calm
  - device=edge-1
signals:
  - state:platform=ok
  - state:reload=earlier
  - state:clock=synced
evidence:
  - finding
  - device
expect_chain:
  - platform-health entry
expect_selected: none
expect_verdict:
  - out of bounds
  - within bounds
expect_never:
  - log-confirmation
  - ntp-clock
expect_select: platform-health
