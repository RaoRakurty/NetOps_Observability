# Behavioural cases for scope-contrast. Dialect + contract: skill_cases.go.

case: a boundary the engine places at a handoff continues at that seam
question: only some sites can reach the erp application
ui:
  - correlation_id=case-scope-seam
  - device=edge-1
signals:
  - verdict:phrase=handoff
  - verdict:tier=suspected
evidence:
  - finding
expect_chain:
  - scope-contrast entry
  - path-seam-handoff rule
expect_selected: rule
expect_reason: places the boundary at a handoff
expect_verdict:
  - hop
  - owner
expect_never:
  - osi-bisection
  - log-confirmation
expect_select: scope-contrast

