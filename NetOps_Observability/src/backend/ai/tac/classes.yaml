  - id: bgp-instability
    title: BGP session or prefix instability
    protocol: bgp
    summary: >-
      A BGP peering is flapping, or prefixes are being withdrawn and
      re-announced repeatedly.
    tac_first_look: >-
      The neighbour's uptime and reset counters, dampening state, and the
      interface beneath the peering.
    detect:
      alerts:
        - BGPPeerFlapping
      hypotheses:
        - sig.ent.wan-edge.bgp-peer-flap
        - sig.ent.wan-edge.routing-instability
      signatures:
        - bgp-session-flapped
        - bgp-dampened
      issues:
        - bgp-flapping
      log_regex:
        - '(?i)%BGP\-3\-NOTIFICATION:\ sent\ to\ neighbor\ 198\.51\.100\.2\ 4/0\ \(hold\ time\ expired\)'
        - '(?i)%BGP\-5\-ADJCHANGE:\ neighbor\ 198\.51\.100\.2\ Down\ Interface\ flap'
