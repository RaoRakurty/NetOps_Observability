  - id: rib-fib-inconsistency
    title: 'Unicast RIB and module FIB disagree (routing table versus forwarding table)'
    protocol: system
    detect:
      log_regex:
        - '(?i)%UFDM\-3\-PROACTIVE_CC_INCONSISTENCY_FOUND'
        - '(?i)%UFDM\-2\-FIB_ROUTE_UPDATE_ERR'
        - '(?i)%UFDM\-3\-UFDM_PRO_CC_SESSION_TIMEDOUT'
        - '(?i)%IPFIB\-SLOT\#\-2\-IPFIB_IP_FIRST_HOP_TCAM_SIZE_FULL'
        - '(?i)%U6RIB\-3\-INCONSISTENT_ROUTE'
        - '(?i)%U6RIB\-3\-INCONSISTENT_RNH'
        - '(?i)%U6RIB\-3\-INCONSISTENT_SUMMARY'
    intents:
      - fib.inconsistency
      - fib.cc.unicast
      - fib.cc.singleroute
      - fib.distribution.state
      - rib.route.lookup
      - rib.adjacency.detail
      - rib.clients
      - hw.capacity.forwarding
