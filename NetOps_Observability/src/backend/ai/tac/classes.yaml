  - id: evpn-vxlan
    title: EVPN / VXLAN overlay problem
    protocol: overlay
    summary: >-
      An overlay endpoint is unreachable, a VNI is not programmed, or an EVPN
      route is missing.
    tac_first_look: >-
      The VTEP peer list against the underlay, then the EVPN table for the
      missing MAC/IP route.
    detect:
      hypotheses:
        - sig.ent.fabric.evpn-route-missing
        - sig.ent.fabric.vtep-unreachable
        - sig.ent.fabric.evpn-l2-loop
      log_regex:
        - '(?i)evpnMacRouteAddDroppedDueToUnexpectedEthTag'
        - '(?i)evpnMacRouteWithdrawnDueToUnexpectedVni'
        - '(?i)evpnVxlanMacIpRouteWithdrawnDueToNextHopTypeMismatch'
        - '(?i)evpnInclMcastRouteAddDroppedDueToUnexpectedEthTag'
        - '(?i)evpnInclMcastRouteWithdrawnDueToUnexpectedVni'
        - '(?i)evpnVxlanAutoDiscoveryEviRouteWithdrawnDueToNextHopTypeMismatch'
        - '(?i)networkInstanceStateDown'
        - '(?i)l2SubinterfaceBridgeTableDuplicateMacAddressDetected'
        - '(?i)l2ConnectionpointBridgeTableDuplicateMacAddressDetected'
        - '(?i)networkInstanceBridgeTableDuplicateMacAddressDetected'
        - '(?i)networkInstanceBridgeTableDuplicateMacAddressDeleted'
        - '(?i)ethernetsegmentNetworkInstanceBgpInstanceDfStatusChanged'
        - '(?i)ethernetsegmentPreferenceOperValueChanged'
        - '(?i)evpnAutoDiscoveryEviRouteAddDroppedDueToUnexpectedEthTag'
        - '(?i)lagMemberOperDown'
        - '(?i)evpnIpPrefixRouteNotImportedDueToUnexpectedVni'
        - '(?i)evpnIpPrefixRouteWithdrawnDueToNoGwMac'
        - '(?i)evpnIpPrefixRouteWithdrawnDueToUnexpectedGwIp'
        - '(?i)evpnVxlanIpPrefixRouteWithdrawnDueToNextHopTypeMismatch'
        - '(?i)ipSubinterfaceDuplicateMacAddress'
        - '(?i)ipSubinterfaceDuplicateIpv4Address'
        - '(?i)networkInstanceInterfaceDown'
        - '(?i)svcBgpEvpnDupMacAddrsDetected'
        - '(?i)sapStatusChanged'
        - '(?i)tmnxVRtrStaticRouteStatusChanged'
        - '(?i)svcBgpEvpnDupMacAddrsCleared'
        - '(?i)svcBgpEvpnBHDupMacAddrsDetected'
        - '(?i)sapTlsMacMoveExceeded'
