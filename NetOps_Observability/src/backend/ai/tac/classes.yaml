  - id: link-flap
    title: Link down or flapping
    protocol: interface
    summary: >-
      An interface is down, or is transitioning up and down repeatedly.
    tac_first_look: >-
      Last-change time and the transition count, then the optic, then the far
      end.
    detect:
      alerts:
        - InterfaceDown
        - InterfaceLowerLayerDown
        - InterfaceFlapping
      hypotheses:
        - sig.ent.access.local-link-fault
        - sig.ent.middle-mile.lastmile-circuit-flap
      skills:
        - interface-down
      log_regex:
        - '(?i)%LINEPROTO-\d-UPDOWN'
        - '(?i)%LINK-\d-CHANGED'
