        - '(?i)%BGP\-4\-PFXEXCEED'
        - '(?i)%BGP\-4\-PFXWARN'
        - '(?i)%BGP\-4\-SELF_RESTART'
        - '(?i)%ETHPORT\-5\-IF_DOWN_LINK_FAILURE'
        - '(?i)BGP/2/hwBgpBackwardTransition_active'
        - '(?i)BGP_1\.3\.6\.1\.4\.1\.2011\.5\.25\.177\.1\.3\.10\ hwBgpPeerBackwardTransition'
