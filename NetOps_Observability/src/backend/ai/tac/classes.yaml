# ── the issue-class taxonomy ───────────────────────────────────────────────
classes:
  - id: ospf-adjacency
    title: OSPF adjacency will not form or is stuck
    protocol: ospf
    summary: >-
      An OSPF neighbour is not reaching FULL, or has dropped out of the table
      entirely.
    tac_first_look: >-
      The neighbour state word, then both ends' hello/dead intervals, area id,
      network type, MTU and authentication. EXSTART/EXCHANGE is an IP MTU
      mismatch far more often than anything else.
    detect:
      alerts:
        - OSPFAdjacencyDown
      hypotheses:
        - sig.ent.access.ospf-adjacency-flap
      signatures:
        - ospf-exstart-mtu
        - ospf-exstart-only
        - ospf-init-oneway
        - ospf-param-mismatch
      skills:
        - ospf-adjacency
      issues:
        - ospf-neighbor-stuck
        - ospf-adjacency-nonform
      log_regex:
        - '(?i)%OSPF-\d-ADJCHG'
        - '(?i)%OSPF\-4\-BADLSA'
        - '(?i)%OSPF\-5\-ADJCHG'
        - '(?i)%OSPF\-4\-AREA_ERR'
        - '(?i)%OSPF\-4\-AUTH_ERR'
        - '(?i)%OSPF\-4\-DUPRID'
        - '(?i)%OSPF\-4\-NEIGH_ERR'
        - '(?i)%OSPF\-4\-PKTTYPE_ERR'
        - '(?i)%OSPF\-4\-VERSION_ERR'
        - '(?i)%OSPF\-4\-CKSM_ERR'
        - '(?i)OSPF/6/NBR_CHANGE'
        - '(?i)OSPF_1\.3\.6\.1\.2\.1\.14\.16\.2\.2\ ospfNbrStateChange'
        - '(?i)OSPFV3/6/OSPFV3_NBR_CHANGE'
        - '(?i)OSPFv3_1\.3\.6\.1\.2\.1\.191\.0\.2\ ospfv3NbrStateChange'
        - '(?i)RPD_OSPF_NBRDOWN'
        - '(?i)ospfAdjacencyChange'
        - '(?i)ospfIfStateChange'
        - '(?i)ospIfAuthDataFailure'
        - '(?i)ospfNbrMtuMismatch'
        - '(?i)tmnxOspfNgNbrStateChange'
        - '(?i)tmnxOspfNgIfStateChange'
        - '(?i)tmnxOspfNgIfConfigError'
        - '(?i)tmnxOspfNgIfAuthFailure'
        - '(?i)tmnxOspfNgIfRxBadPacket'
