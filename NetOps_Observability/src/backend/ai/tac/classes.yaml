  - id: hardware-fault
    title: Hardware or environmental fault
    protocol: hardware
    summary: >-
      A sensor, power supply, fan or module is reporting a fault.
    tac_first_look: >-
      The environmental table and the inventory, then the log around the first
      fault report.
    detect:
      alerts:
        - FanFailed
        - PowerSupplyFailed
        - TemperatureHigh
        - TemperatureCritical
        - TemperatureStateAbnormal
        - GenericSensorAnomaly
        - DeviceRebooted
      log_regex:
        - '(?i)%PLATFORM-\d-'
        - '(?i)(?:fan|power supply|psu).{0,24}(?:fail|absent|removed)'
        - '(?i)WARNING:\ Overriding\ the\ system\ shutdown\ behavior\ when\ the\ system\ is\ overheating\ is\ unsupported'
        - '(?i)WARNING:\ Overriding\ the\ system\ shutdown\ behavior\ when\ the\ system\ has\ insufficient\ fans\ inserted\ is\ unsupported'
        - '(?i)%C6KPWR\-4\-POWRDENIED'
        - '(?i)%C6KPWR\-SP\-4\-DISABLED'
        - '(?i)%OIR\-SP\-6\-INSCARD'
        - '(?i)%OIR\-SP\-6\-REMCARD'
        - '(?i)%DIAG\-SP\-3\-MINOR_HW'
        - '(?i)%CONST_DIAG\-4\-ERROR_COUNTER_WARNING'
        - '(?i)%PLATFORM\-CANB_SERVER\-3\-ALARM_INDICATION'
        - '(?i)CBC_ALRM_AT_LEAST_ONE_FAN_FAILED'
        - '(?i)%INFRA\-SHELF_MGR\-5\-CARD_REMOVAL'
        - '(?i)%INFRA\-SHELF_MGR\-5\-CARD_INSERTION'
        - '(?i)%INFRA\-SHELF_MGR\-6\-CARD_HW_OPERATIONAL'
        - '(?i)%PKT_INFRA\-FM\-6\-FAULT_INFO'
        - '(?i)%PKT_INFRA\-FM\-3\-FAULT_MAJOR'
        - '(?i)%PLATFORM\-2\-PS_FAIL'
        - '(?i)%PLATFORM\-2\-PS_ABSENT'
        - '(?i)%PLATFORM\-2\-PS_FANFAIL'
        - '(?i)%PLATFORM\-1\-FAN_FAIL'
        - '(?i)%PLATFORM\-2\-FANMOD_FAN_FAIL'
        - '(?i)%PLATFORM\-2\-MOD_TEMPMAJALRM'
        - '(?i)%PLATFORM\-2\-MOD_TEMPMINALRM'
        - '(?i)%MODULE\-2\-MOD_DIAG_FAIL'
        - '(?i)%MODULE\-2\-MOD_FAIL'
        - '(?i)%DIAGCLIENT\-2\-DIAG_HM_FAIL'
        - '(?i)%DIAGCLIENT\-2\-PER_PORT_TEST_FAIL'
        - '(?i)service=kernel\ conserve=on\ msg="Kernel\ enters\ memory\ conserve\ mode"'
        - '(?i)componentTemperatureExceeded'
        - '(?i)componentTemperatureFailure'
        - '(?i)componentTemperatureNormal'
        - '(?i)psuTemperatureFault'
        - '(?i)fantrayEmpty'
        - '(?i)airflowMismatch'
        - '(?i)airflowCorrected'
        - '(?i)psuInputDown'
        - '(?i)psuInputUp'
        - '(?i)psuOutputDown'
        - '(?i)psuOutputUp'
