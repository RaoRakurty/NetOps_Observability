  - id: crash-reload
    title: 'Unexpected reload / crash — reason determination and artefact collection'
    protocol: system
    detect:
      log_regex:
        - '(?i)%PLATFORM\-PFM\-0\-CARD_RESET_REQ'
        - '(?i)%PLATFORM\-NP\-0\-NON_RECOVERABLE_SOFT_ERROR'
        - '(?i)%PLATFORM\-NP\-3\-ECC'
        - '(?i)%HA\-HA_WD_LIB\-4\-RLIMIT'
        - '(?i)%INFRA\-SHELF_MGR\-5\-CARD_REMOVAL'
