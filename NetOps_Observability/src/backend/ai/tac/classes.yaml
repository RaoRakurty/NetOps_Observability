  - id: config-change
    title: Change-induced fault
    protocol: config
    summary: >-
      A configuration change is the most recent thing that happened before the
      symptom.
    tac_first_look: >-
      The running configuration and the change record, correlated against the
      first symptom timestamp.
    detect:
      alerts:
        - ConfigChanged
      hypotheses:
        - sig.ent.wan-edge.controller-change-induced
        - sig.ent.security.hardening-drift-story
      log_regex:
        - '(?i)%SYS-\d-CONFIG_I'
        - '(?i)%SYS\-5\-CONFIG_I'
        - '(?i)%MGBL\-CONFIG\-6\-DB_COMMIT'
        - '(?i)%MGBL\-SYS\-5\-CONFIG_I'
        - '(?i)%VSHD\-5\-VSHD_SYSLOG_CONFIG_CHANGE'
        - '(?i)%VSHD\-5\-VSHD_SYSLOG_CONFIG_I'
        - '(?i)%SYSMGR\-5\-CFGWRITE_DONE'
        - '(?i)%SYSMGR\-5\-CFGWRITE_STARTED'
        - '(?i)CLI/5/CMDRECORD'
        - '(?i)commitFailed'
        - '(?i)commitSucceeded'
        - '(?i)checkpointGenerated'
        - '(?i)checkpointRevertRequestReceived'
        - '(?i)exclusiveConfigSessionError'
        - '(?i)exclusiveConfigSessionBlockedByOtherSessionError'
        - '(?i)privateConfigSessionError'
        - '(?i)privateSharedMismatch'
        - '(?i)sharedConfigSessionBlockedByOtherSessionError'
        - '(?i)tmnxConfigModify'
        - '(?i)tmnxConfigCreate'
        - '(?i)tmnxConfigDelete'
        - '(?i)tmnxConfigConflict'
        - '(?i)cli_config_io'
        - '(?i)cli_user_io'
        - '(?i)ssiSaveConfigSucceeded'
        - '(?i)tmnxSysRollbackDeleteStarted'
    intents:
