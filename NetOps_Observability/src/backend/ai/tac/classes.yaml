        - '(?i)%INFRA\-SHELF_MGR\-6\-CARD_HW_OPERATIONAL'
        - '(?i)%PLATFORM\-CANB_SERVER\-7\-CBC_POST_RESET_NOTIFICATION'
        - '(?i)%SYSMGR\-2\-SERVICE_CRASHED'
        - '(?i)%SYSMGR\-3\-SERVICE_TERMINATED'
        - '(?i)%SYSMGR\-3\-SERVICE_BACKTRACE'
