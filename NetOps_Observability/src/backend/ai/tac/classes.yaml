  - id: high-cpu
    title: High control-plane CPU
    protocol: system
    summary: >-
      The device's CPU is saturated or trending toward saturation.
    tac_first_look: >-
      Which process is consuming it, and whether the load is punted traffic
      rather than a protocol.
    detect:
      alerts:
        - HighCPU
        - CriticalCPU
        - CPUBaselineRising
      log_regex:
        - '(?i)%SECURITY\-TACACSD\-7\-GENERIC_ERROR'
        - '(?i)%SECURITY\-TACACSD\-6\-SERVER_UP'
        - '(?i)%SECURITY\-TACACSD\-6\-SERVER_DOWN'
        - '(?i)%SECURITY\-TACACSD\-6\-TIMEOUT_IGNORED'
        - '(?i)%COPP\-2\-COPP_DROPS2'
        - '(?i)%SYSMGR\-2\-SRV_MAJOR_MEMORY_ALERT'
        - '(?i)cpuUsageHigh'
        - '(?i)cpuUsageCritical'
        - '(?i)cpuUsageNormal'
        - '(?i)systemResourceHighUtilization'
        - '(?i)tmnxCpmProtViolIf'
        - '(?i)tmnxCpmProtDefPolModified'
        - '(?i)tmnxStateChange'
