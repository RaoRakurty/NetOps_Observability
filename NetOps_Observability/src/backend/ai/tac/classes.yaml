  - id: interface-errors
    title: Interface errors or discards
    protocol: interface
    summary: >-
      An interface is passing traffic but corrupting or dropping some of it.
    tac_first_look: >-
      The error class — CRC/FCS points at the physical path, discards at
      buffering or policy.
    detect:
      alerts:
        - InterfaceInputErrors
        - InterfaceOutputErrors
        - InterfaceInputErrorsHigh
        - InterfaceInputDiscards
        - InterfaceOutputDiscards
        - InterfaceErrorRatioHigh
        - InterfaceErrorAnomaly
