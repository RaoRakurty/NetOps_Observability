  - id: resource-exhaustion
    title: 'Packet-buffer / dataplane resource exhaustion (packet buffer protection engaging)'
    protocol: system
    detect:
      log_regex:
        - '(?i)packet\ buffer\ protection'
    intents:
      - system.resources
      - system.disk
      - logging.quota
      - dataplane.resources
      - session.stats
      - dataplane.counters
      - jobs.status
