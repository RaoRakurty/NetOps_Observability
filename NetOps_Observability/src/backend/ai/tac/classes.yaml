        - '(?i)%PKT_INFRA\-ERRDIS\-6\-ERROR_DISABLE'
        - '(?i)%FABRIC\-NPU_DRVR\-3\-PLUGGABLE_MODULE_ERROR'
        - '(?i)%PKT_INFRA\-LINK\-5\-CHANGED'
        - '(?i)%PLATFORM\-APM\-6\-INFO'
