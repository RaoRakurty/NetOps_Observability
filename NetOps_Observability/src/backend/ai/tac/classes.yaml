  - id: bgp-session
    title: BGP session down or will not establish
    protocol: bgp
    summary: >-
      A BGP peering is Idle/Active/Connect rather than Established.
    tac_first_look: >-
      The neighbour's last error and notification, then TCP reachability and any
      ACL/control-plane policy between the two addresses.
    detect:
