  - id: ospf-database
    title: 'OSPF database churn, corruption or missing LSAs'
    protocol: ospf
    summary: >-
      The OSPF link-state database is not what the topology says it should be:
      LSAs missing, stale, or re-flooded continuously.
    tac_first_look: >-
      The database summary on both routers, then the specific router LSA, then
      whether the area type (stub/NSSA) or a max-metric setting explains the
      absence.
    detect:
      alerts:
        - RouteTableShrink
      signatures:
        - ospf-stub-area
        - ospf-max-metric
      issues:
        - ospf-routes-missing
      log_regex:
        - '(?i)%OSPF-\d-(?:.*)(?:LSA|DBASE)'
        - '(?i)OSPF\ MAXLSAWARNING'
        - '(?i)%OSPF\-4\-FLOOD_WAR'
        - '(?i)%OSPF\-4\-CONFLICTING_LSAID'
        - '(?i)%OSPF\-4\-BADLSA'
        - '(?i)%OSPF\-4\-DUP_RTRID1:\ Detected\ router\ with\ duplicate\ router\ ID\ 100\.0\.0\.2\ in\ area\ 0'
        - '(?i)%OSPF\-4\-DUP_RTRID2'
        - '(?i)OSPF/6/NBR_CHANGE'
        - '(?i)ospfAdjacencyChange'
        - '(?i)ospfIfStateChange'
        - '(?i)tmnxOspfLsdbOverflow'
        - '(?i)tmnxOspfLsdbApproachingOverflow'
        - '(?i)tmnxOspfOverloadEntered'
        - '(?i)tmnxOspfOverloadExited'
        - '(?i)tmnxOspfExportLimitReached'
        - '(?i)tmnxOspfRoutesExpLmtDropped'
