  - id: optics
    title: Optic / transceiver degradation
    protocol: interface
    summary: >-
      A transceiver's measured power, temperature or bias is outside its
      documented range.
    tac_first_look: >-
      Measured Rx/Tx power against the module's own thresholds, then the far
      end's transmit power.
    detect:
      alerts:
        - OpticRxPowerLow
        - OpticRxPowerCritical
        - OpticTxPowerLow
        - OpticTemperatureHigh
        - OpticBiasDrift
      hypotheses:
        - sig.ent.middle-mile.dx-optics-degrade
      skills:
        - optics-degraded
      log_regex:
        - '(?i)%SFF8472\-3\-THRESHOLD_VIOLATION'
