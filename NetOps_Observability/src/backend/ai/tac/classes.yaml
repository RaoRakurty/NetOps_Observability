        - '(?i)%SYSMGR\-2\-STANDBY_BOOT_FAILED'
    intents:
      - platform.pfm.faults
      - logging.buffer
      - system.resetreason
      - system.uptime
      - logging.nvram
      - obfl.status
      - techsupport.bundle
      - reload.history
      - process.crash.context
      - process.core.config
