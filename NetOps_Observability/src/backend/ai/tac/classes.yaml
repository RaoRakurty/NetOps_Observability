  - id: ospf-flapping-link
    title: OSPF adjacency flapping over an unstable link
    protocol: ospf
    summary: >-
      An OSPF adjacency is transitioning repeatedly. The protocol is usually
      reporting a layer beneath it.
    tac_first_look: >-
      The interface's error and discard counters and its last-change time,
      before anything OSPF. An adjacency cannot be healthier than the link under
      it.
    detect:
      alerts:
        - OSPFAdjacencyFlapping
        - InterfaceFlapping
      hypotheses:
        - sig.ent.access.ospf-adjacency-flap
      signatures:
        - ospf-flap-l1
        - ospf-flap
      skills:
        - ospf-adjacency
        - interface-down
      issues:
        - ospf-flapping
      log_regex:
        - '(?i)%OSPF\-5\-ADJCHG:\ Process\ 1,\ Nbr\ 10\.1\.1\.1\ on\ TenGigabitEthernet2/1\ from\ FULL\ to\ DOWN,\ Neighbor\ Down:\ Too\ many\ retransmissions'
