  - id: qos-drops
    title: QoS drops or egress congestion
    protocol: qos
    summary: >-
      Traffic is being dropped by a queue or a policer rather than by a fault.
    tac_first_look: >-
      Per-queue drop counters against the applied policy, then the offered rate
      on that interface.
    detect:
      alerts:
        - InterfaceOutputDiscards
        - LinkOutboundUtilHigh
        - LinkOutboundUtilCritical
      hypotheses:
        - sig.ent.wan-edge.congestion
      log_regex:
        - '(?i)%MGBL\-CONFIG\-6\-DB_COMMIT'
        - '(?i)%TAHUSD\-SLOTX\-4\-BUFFER_THRESHOLD_EXCEEDED'
        - '(?i)%ACLQOS\-SLOT\#\-2\-ACLQOS_BURST_DETECT_OVER_THRESHOLD'
        - '(?i)%ACLQOS\-SLOT\#\-2\-ACLQOS_BUFFER_DRAIN_FAILURE'
        - '(?i)%ACLQOS\-SLOT\#\-2\-ACLQOS_QUEUE_LIMIT_MAX'
        - '(?i)platformQoSProfileHighUtilization'
        - '(?i)platformCoreQoSProfileHighUtilization'
        - '(?i)platformQoSProfileHighUtilizationLowered'
        - '(?i)interfaceStormControlRateReached'
        - '(?i)tmnxResvCbsPoolThreshAmber'
        - '(?i)tmnxHwAggShpSchedOperColorRed'
        - '(?i)tmnxHwAggShpSchedOperColorAmber'
