# classes.yaml — the TAC escalation issue-class taxonomy and intent vocabulary.
#
# Schema, closed enums and the rules for adding to this file: ai/tac/README.md.
# Every id under `detect:` is REAL and is proven so by
# internal/tac/reference_test.go, which greps this repo for each one. Never
# invent a name here — an invented detection rule is a rule that can never fire.
#
# MACHINE-MERGED from ai/tac/research/*.yaml by scripts/tac-merge-research.py.
# Edit the research file or the script, not this file: a hand edit here is
# reverted the next time the merge runs, and `--check` fails in CI meanwhile.
schema_version: 1
version: correlix-tac-classes-2026-09-05

# ── the closed intent vocabulary ───────────────────────────────────────────
# An intent is a vendor-neutral command CONCEPT. Plans bind intents to actual
# commands per dialect; an intent a dialect does not bind is shown to the
# operator as unbound, never guessed.
