  - id: mlag-vpc-peer
    title: MLAG / vPC peer problem
    protocol: l2
    summary: >-
      The multi-chassis link-aggregation peering is down, inconsistent, or
      split.
    tac_first_look: >-
      Peer-link state and the consistency parameters — an inconsistency suspends
      member ports silently.
    detect:
      log_regex:
        - '(?i)\bvpc\b.{0,40}(?:peer[- ]link|peer[- ]keepalive).{0,24}(?:down|fail)'
        - '(?i)\bmlag\b.{0,40}(?:state|peer).{0,24}(?:down|inactive|disabled)'
        - '(?i)%ETHPORT\-5\-IF_DOWN_PORT_CHANNEL_MEMBERS_DOWN'
        - '(?i)%PORT\-5\-IF_DOWN_PORT_CHANNEL_MEMBERS_DOWN'
        - '(?i)%ETH_PORT_CHANNEL\-5\-PORT_DOWN'
        - '(?i)%ETH_PORT_CHANNEL\-5\-FOP_CHANGED'
        - '(?i)%VPC\-2\-L3_VPC_UNEQUAL_WEIGHT'
