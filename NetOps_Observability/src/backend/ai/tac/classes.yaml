        - '(?i)ISIS/4/IS_RECV_ERR_PKT'
        - '(?i)ISIS_1\.3\.6\.1\.3\.37\.2\.0\.17\ isisAdjacencyChange'
        - '(?i)ISIS_1\.3\.6\.1\.4\.1\.2011\.5\.25\.24\.2\.4\.49\ hwIsisSystemIdCfgConflict'
