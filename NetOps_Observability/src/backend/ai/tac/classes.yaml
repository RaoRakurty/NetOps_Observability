  - id: bgp-route-missing
    title: BGP prefix missing or not selected
    protocol: bgp
    summary: >-
      A prefix that should be in the table is absent, or is present but not the
      best path.
    tac_first_look: >-
      What the neighbour actually sent before policy, what we advertised after
      policy, and whether the next hop resolves.
