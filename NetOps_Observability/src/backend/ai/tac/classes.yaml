  - id: mpls-ldp
    title: MPLS / LDP problem
    protocol: mpls
    summary: >-
      An LDP session is down or a label binding is missing, so an LSP is broken.
    tac_first_look: >-
      LDP neighbour state on both ends, then whether the transport address is
      reachable and the binding exists.
    detect:
      log_regex:
        - '(?i)%LDP-\d-'
        - '(?i)\bldp\b.{0,40}(?:session|neighbou?r).{0,24}(?:down|closed|reset)'
        - '(?i)ldpSessionDown'
        - '(?i)ldpSessionUp'
        - '(?i)ldpIpv4InstanceDown'
        - '(?i)ldpIPv4InterfaceDown'
        - '(?i)ldpIPv4TargetDown'
        - '(?i)ldpSessionFecLimitReached'
        - '(?i)ldpSessionLocalIPv4Overload'
        - '(?i)ldpSessionPeerIPv4Overload'
        - '(?i)vRtrLdpNgSessionStateChange'
        - '(?i)vRtrLdpNgIfStateChange'
        - '(?i)vRtrLdpNgTargPeerStateChange'
        - '(?i)vRtrLdpGroupIdMismatch'
        - '(?i)vRtrLdpNgResourceExhaustion'
        - '(?i)vRtrLdpStateChange'
        - '(?i)vRtrLdpNgAddrFecCommMismatch'
        - '(?i)vRtrLdpNgSessMaxFecLimitReached'
        - '(?i)vRtrLdpNgSessMaxFecThresChanged'
    intents:
      - mpls.interfaces
      - mpls.ldp.neighbor
