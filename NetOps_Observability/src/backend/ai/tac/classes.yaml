  - id: ipsec-vpn
    title: IPsec IKE phase-1 does not come up
    protocol: system
    detect:
      log_regex:
        - '(?i)logid="0101037127"\ logdesc="Progress\ IPsec\ phase\ 1"\ action="negotiate"\ \.\.\.\ stage=1\ result="OK"'
        - '(?i)logid="0101037138"\ logdesc="IPsec\ connection\ status\ changed"\ action="tunnel\-down"'
        - '(?i)logid="0101037134"\ logdesc="IPsec\ phase\ 1\ SA\ deleted"\ action="delete_phase1_sa"'
        - '(?i)logid="0101037129"\ logdesc="Progress\ IPsec\ phase\ 2"\ action="negotiate"\ mode="quick"'
        - '(?i)logid="0101037139"\ logdesc="IPsec\ phase\ 2\ status\ changed"\ action="phase2\-up"'
        - '(?i)logid="0101037133"\ logdesc="IPsec\ SA\ installed"\ action="install_sa"'
        - '(?i)logid="0101037141"\ logdesc="IPsec\ tunnel\ statistics"\ action="tunnel\-stats"\ sentbyte=\ rcvdbyte='
        - '(?i)logid="0101037138"\ logdesc="IPsec\ connection\ status\ changed"\ action="tunnel\-up"'
    intents:
      - route.table
      - vpn.ipsec.tunnel.summary
      - vpn.ipsec.ike.sa
      - vpn.ipsec.gateways
      - vpn.ipsec.flow
      - vpn.ipsec.sa
      - vpn.ipsec.tunnel.list
