  - id: isis-adjacency
    title: IS-IS adjacency will not form or is stuck
    protocol: isis
    summary: >-
      An IS-IS adjacency is not UP, or is stuck in INIT/INITIALIZING.
    tac_first_look: >-
      The adjacency table and the circuit's level, MTU and area/system id on
      both ends. A level mismatch and an MTU mismatch look identical from one
      side.
    detect:
      alerts:
        - ISISAdjacencyDown
        - ISISAdjacencyFlapping
      hypotheses:
        - sig.ent.fabric.isis-adjacency-flap
      signatures:
        - isis-adjacency-not-up
        - isis-init-stuck
        - isis-adjacency-flap
      skills:
        - isis-adjacency
      issues:
        - isis-adjacency-down
        - isis-adjacency-init
