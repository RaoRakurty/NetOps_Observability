  - id: high-memory
    title: High or leaking memory
    protocol: system
    summary: >-
      Memory utilisation is high, or rising without a matching change in load.
    tac_first_look: >-
      Per-process memory over time, then whether a table (routes, MACs, ARP)
      explains the growth.
    detect:
      alerts:
        - HighMemory
        - CriticalMemory
        - HighMemoryBytes
        - MemoryLeakTrend
      log_regex:
        - '(?i)%SYS\-2\-MALLOCFAIL'
        - '(?i)%SYS\-SP\-2\-MALLOCFAIL'
        - '(?i)%PLATFORM\-4\-ELEMENT_WARNING'
        - '(?i)%HA\-HA_WD_LIB\-4\-RLIMIT'
        - '(?i)%ROUTING\-BGP\-4\-VIRTUAL_MEMORY_LIMIT_THRESHOLD_REACHED'
        - '(?i)%OS\-SHMWIN\-2\-ERROR_ENCOUNTERED'
        - '(?i)%PLATFORM\-2\-MEMORY_ALERT'
        - '(?i)%PLATFORM\-2\-MEMORY_ALERT_RECOVERED'
        - '(?i)%SYSMGR\-2\-SRV_MAJOR_MEMORY_ALERT'
        - '(?i)%SYSMGR\-2\-SRV_MINOR_MEMORY_ALERT'
        - '(?i)%PLATFORM\-2\-PFM_LOW_MEMORY_CONDITION'
        - '(?i)%SYSMGR\-0\-ACTIVE_SUP_LESS_MEMORY'
        - '(?i)%BGP\-3\-LOWMEM'
        - '(?i)%OSPF\-1\-LOWMEM'
        - '(?i)memoryUsageHigh'
        - '(?i)memoryUsageCritical'
        - '(?i)memoryUsageFull'
        - '(?i)partitionUsageWarning'
        - '(?i)partitionUsageCritical'
        - '(?i)partitionUsageFull'
        - '(?i)bgpLowMemory'
        - '(?i)tmnxModuleMallocFailed'
        - '(?i)bgpNoMemoryPeer'
        - '(?i)tmnxIsisDatabaseOverload'
        - '(?i)tmnxVRtrFibOccupancyThreshold'
        - '(?i)tmnxVRtrFibVPNOccupancyThreshold'
