  - {family: daemon, tokens: 'process', why: 'addresses a named process (restart, shutdown, core)'}
  - {family: daemon, tokens: 'agent', why: 'addresses a named agent process'}
  - {family: daemon, tokens: 'pads', why: 'Huawei''s protocol-daemon diagnostic branch (`pads diagnose`)'}

# ── per-dialect rules ────────────────────────────────────────────────────────
dialects:
  - dialect: cisco-ios
    sources:
      - title: Cisco IOS Configuration Fundamentals Command Reference
        url: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref.html
        retrieved: 2026-09-05
    rules:
      - {family: config, tokens: 'archive', why: 'writes a configuration archive to storage'}
      - {family: daemon, tokens: 'test', why: 'the platform test harness drives hardware and processes directly'}

  - dialect: cisco-iosxe
    sources:
      - title: Cisco IOS XE Configuration Fundamentals Command Reference
        url: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref.html
        retrieved: 2026-09-05
    rules:
      - {family: config, tokens: 'archive', why: 'writes a configuration archive to storage'}
      - {family: config, tokens: 'request', why: 'IOS-XE `request platform software …` performs platform actions'}
      - {family: daemon, tokens: 'test', why: 'the platform test harness drives hardware and processes directly'}
      - {family: config, tokens: 'monitor', why: 'configures an EPC/SPAN capture session that lives on the device'}

  - dialect: cisco-iosxr
    sources:
      - title: Cisco IOS XR System Management Command Reference
        url: https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/system-management/b-system-management-cr-ncs5500.html
        retrieved: 2026-09-05
    rules:
      - {family: config, tokens: 'install', why: '`install add|activate|commit` changes the running software'}
      - family: config
        tokens: admin
        why: 'the admin plane carries install, reload and hardware actions'
        except:
          # `admin show …` is the admin plane's READ half — the platform,
          # environment and LED state an XR TAC engineer opens first.
          - admin show
      - {family: config, tokens: 'monitor', why: 'configures an on-device monitor session'}

