# ── session-scoped setters ───────────────────────────────────────────────────
#
# These change NO configuration and clear nothing: they narrow what a read
# command prints, and the scope dies with the CLI session. The owner's rule bites
# on config change, restart and daemon lifetime — none of which these do — so
# they are ALLOWED, on one condition the loader enforces: the binding must carry
# the matching teardown, and the collector runs it immediately after the read, so
# a Correlix collection never leaves scope behind on someone's firewall.
session_scoped:
  - dialect: fortinet-fortios
    tokens: diagnose sys session filter
    teardown: diagnose sys session filter clear
    why: >-
      Narrows what `diagnose sys session list` prints. It is the documented way
      to read one flow's session out of a table with a million entries, it
      writes no configuration, and the filter is per-session state that FortiOS
      drops when the CLI session ends.
    sources:
      - title: FortiOS Administration Guide — Using a session table
        url: https://docs.fortinet.com/document/fortigate/7.6.0/administration-guide/562859/using-a-session-table
        retrieved: 2026-09-05
  - dialect: fortinet-fortios
    tokens: execute log filter
    teardown: execute log filter reset
    why: >-
      Narrows what `execute log display` prints. Same shape: no configuration
      change, no state cleared, scope dies with the session.
    sources:
      - title: FortiOS Administration Guide — Log-related diagnostic commands
        url: https://docs.fortinet.com/document/fortigate/7.6.0/administration-guide/668197/log-related-diagnostic-commands
        retrieved: 2026-09-05

