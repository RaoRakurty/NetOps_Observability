# forbidden.yaml — the OUTPUT-ONLY command policy for the TAC escalation pack.
#
# Owner decision, 2026-09-05, verbatim:
#
#   "Rules in executing commands, any command changing the config should be
#    blocked or not even known to Correlix. Any command trying to restart or
#    reboot should be unknown to Correlix. TAC usually need outputs to
#    understand what is going on, not that we have to execute something and
#    change."
#   "Ping and traceroute are good examples, should be allowed."
#   "Any commands that is touching at daemon level block them."
#
# This file is that rule as DATA. It is the vocabulary Correlix refuses to
# learn: a command whose leading tokens hit a rule here is not merged, not
# stored, not planned, not rendered and not run — it is purged from the research
# corpus too, so the platform does not even carry it as knowledge. Only the
# COUNT survives, per family, which is what `census:` below records.
#
# Three readers implement the same matcher and must stay in lockstep:
#   · internal/tac/forbidden.go        — the Go loader + matcher (runtime)
#   · scripts/tac_forbidden.py         — the Python matcher (merge + purge)
#   · internal/tac/gate.go             — the second, data-independent layer:
#     the gate re-applies this policy at the moment a command would go on a
#     wire, so a tampered plan file still cannot reach a device.
#
# ── how a rule matches ──────────────────────────────────────────────────────
#
# On COMMAND TOKENS, never on substrings. A rule's `tokens` are matched against
# the command's LEADING tokens: rule `reload` matches `reload in 5`, and does
# NOT match `show reload cause`. `show` / `display` / `get` / `info` commands
# therefore stay allowed by construction — they can only be hit by a rule that
# itself begins with one of those words, and there is none.
#
# `except:` lists token prefixes that are exempt from that one rule. A longer
# rule wins over a shorter one (`execute reboot` beats `execute`), and a
# DIALECT rule wins over a `common:` rule at equal length, so a vendor can name
# the family its own spelling belongs to.
#
# Families (the owner's three, and nothing else):
#   config  — enters configuration mode, or changes configuration/state that
#             outlives the session, INCLUDING state-clearing (`clear …`).
#   restart — restarts, reboots, halts or powers off the box.
#   daemon  — addresses a named daemon/process: its debug level, its lifetime,
#             its internals.
#
# Adding a rule is a data change reviewed like a skill. REMOVING one is an owner
# decision: it widens what Correlix may learn.

schema_version: 1
version: correlix-tac-forbidden-2026-09-05

families:
  - id: config
    title: changes configuration or persistent state
    rule: >-
      Entering configuration mode, writing/copying/saving/installing, and
      clearing counters or protocol state. TAC needs outputs; it does not need
      Correlix to change the device.
  - id: restart
    title: restarts, reboots, halts or powers off the device
    rule: >-
      Nothing that can take a device out of service may be part of an evidence
      collection, at any privilege level, on any platform.
  - id: daemon
    title: addresses a named daemon or process
    rule: >-
      Per-process debug levels, process lifetime and process internals. Some
      of these read and some of them restart the daemon; the boundary is not
      legible from the command line, so the whole family is refused.

# Citations for the common rules. Per-dialect rules carry the vendor's own
# reference beside them.
sources:
  - title: Cisco IOS Configuration Fundamentals Command Reference
    url: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref.html
    retrieved: 2026-09-05

# ── common: every dialect, unless a dialect rule names the same tokens ───────
common:
  # config — entering configuration mode / changing configuration
  - {family: config, tokens: 'configure', why: 'enters configuration mode'}
  - {family: config, tokens: 'config', why: 'enters configuration mode (abbreviated form)'}
  - {family: config, tokens: 'conf', why: 'enters configuration mode (abbreviated form)'}
  - {family: config, tokens: 'system-view', why: 'enters the Huawei/H3C configuration view'}
  - {family: config, tokens: 'edit', why: 'enters an editable configuration context'}
  - {family: config, tokens: 'set', why: 'sets a configuration statement'}
  - {family: config, tokens: 'unset', why: 'removes a configuration statement'}
  - {family: config, tokens: 'delete', why: 'deletes configuration or a stored file'}
  - {family: config, tokens: 'undo', why: 'negates a configuration statement (Huawei/H3C)'}
  - {family: config, tokens: 'no', why: 'negates a configuration statement (Cisco/Arista)'}
  - {family: config, tokens: 'default', why: 'resets a configuration statement to its default'}
  - {family: config, tokens: 'commit', why: 'commits a candidate configuration'}
  - {family: config, tokens: 'rollback', why: 'replaces the running configuration with a stored one'}
  - {family: config, tokens: 'replace', why: 'replaces the running configuration'}
  - {family: config, tokens: 'load', why: 'loads a configuration into the candidate'}
  - {family: config, tokens: 'activate', why: 'activates a configuration element'}
  - {family: config, tokens: 'deactivate', why: 'deactivates a configuration element'}
  - {family: config, tokens: 'write', why: 'writes the running configuration to storage'}
  - {family: config, tokens: 'save', why: 'saves the running configuration to storage'}
  - {family: config, tokens: 'copy', why: 'copies a file or configuration, overwriting the target'}
  - {family: config, tokens: 'move', why: 'moves a file on the device'}
  - {family: config, tokens: 'rename', why: 'renames a file on the device'}
  - {family: config, tokens: 'mkdir', why: 'creates a directory on the device'}
  - {family: config, tokens: 'rmdir', why: 'removes a directory on the device'}
  - {family: config, tokens: 'install', why: 'installs software or a patch'}
  - {family: config, tokens: 'upgrade', why: 'upgrades software'}
  - {family: config, tokens: 'downgrade', why: 'downgrades software'}
  - {family: config, tokens: 'format', why: 'formats a filesystem on the device'}
  - {family: config, tokens: 'erase', why: 'erases configuration or a filesystem'}
  - {family: config, tokens: 'license', why: 'installs or removes a licence'}
  - {family: config, tokens: 'boot', why: 'changes the boot image or boot order'}
  - {family: config, tokens: 'startup', why: 'changes the startup image or configuration'}
  - {family: config, tokens: 'clear', why: 'clears counters, tables or protocol state'}
  - {family: config, tokens: 'reset', why: 'clears or re-establishes protocol state (Huawei spelling of clear)'}
  - {family: config, tokens: 'bash', why: 'drops to a host shell, where nothing above is enforceable'}
  - {family: config, tokens: 'shell', why: 'drops to a host shell, where nothing above is enforceable'}
  - {family: config, tokens: 'start', why: 'starts a shell or a subsystem (`start shell`)'}
  - {family: config, tokens: 'run', why: 'runs a host command from the CLI'}
  - {family: config, tokens: 'tools', why: 'the SR Linux action branch: every leaf performs an action'}
  # restart — taking the device out of service
  - {family: restart, tokens: 'reload', why: 'reloads the device'}
  - {family: restart, tokens: 'reboot', why: 'reboots the device'}
  - {family: restart, tokens: 'restart', why: 'restarts the device or one of its processes'}
  - {family: restart, tokens: 'halt', why: 'halts the device'}
  - {family: restart, tokens: 'shutdown', why: 'shuts the device or an interface down'}
