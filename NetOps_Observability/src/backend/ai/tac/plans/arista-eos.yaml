# plans/arista-eos.yaml — the Arista EOS command plan for the TAC escalation pack.
#
# Schema: ai/tac/README.md §4. Every command here is a READ-ONLY show, proven
# by the loader (protocoldiag.ValidateReadOnly) and again by the runner. An
# intent this dialect does not bind is simply ABSENT — the plan preview shows
# it as unbound rather than rendering another vendor's command at this device.
#
# `verified: doc_claimed` means the vendor documents the command and Correlix
# has not run it on this platform. `consent: true` marks a command the vendor
# says is NOT routine (a core dump, a control-plane load, a file written on the
# device): it never runs by default and never sits in a baseline.
# `read_only_exception` is a CITED documented-status read whose text carries a
# token the grammar refuses on sight.
#
# MACHINE-MERGED from ai/tac/research/*.yaml by scripts/tac-merge-research.py.
schema_version: 1
dialect: arista-eos
profile: arista/eos
display: Arista EOS
version: correlix-tac-plan-arista-eos-2026-09-05

# The dialect's BIBLIOGRAPHY — the pages this file was built from. A binding
# cites its own page(s) below; this list never rides on a plan step.
sources:
  - title: 'Arista EOS User Manual — Command Reference'
    url: https://www.arista.com/en/um-eos
    retrieved: 2026-09-05
  - title: 'Arista TAC — Information to collect for a support case'
    url: https://www.arista.com/en/support/advisories-notices
    retrieved: 2026-09-05
  - title: 'EOS User Manual — Border Gateway Protocol (BGP)'
    url: https://www.arista.com/en/um-eos/eos-border-gateway-protocol-bgp
  - title: 'EOS User Manual — Open Shortest Path First Version 2'
    url: https://www.arista.com/en/um-eos/eos-open-shortest-path-first-version-2
  - title: 'EOS User Manual — Open Shortest Path First Version 3'
    url: https://www.arista.com/en/um-eos/eos-open-shortest-path-first-version-3
  - title: 'EOS User Manual — IS-IS'
    url: https://www.arista.com/en/um-eos/eos-is-is
  - title: 'EOS User Manual — ACLs and Route Maps'
    url: https://www.arista.com/en/um-eos/eos-acls-and-route-maps
  - title: 'EOS User Manual — Multi-Chassis Link Aggregation (MLAG)'
    url: https://www.arista.com/en/um-eos/eos-multi-chassis-link-aggregation
  - title: 'EOS User Manual — Port Channels and LACP'
    url: https://www.arista.com/en/um-eos/eos-port-channels-and-lacp
  - title: 'EOS User Manual — Spanning Tree Protocol'
    url: https://www.arista.com/en/um-eos/eos-spanning-tree-protocol
  - title: 'EOS User Manual — Virtual LANs (VLANs)'
    url: https://www.arista.com/en/um-eos/eos-virtual-lans-vlans
  - title: 'EOS User Manual — Data Transfer (MAC address table, port security)'
    url: https://www.arista.com/en/um-eos/eos-data-transfer
  - title: 'EOS User Manual — VXLAN Configuration'
