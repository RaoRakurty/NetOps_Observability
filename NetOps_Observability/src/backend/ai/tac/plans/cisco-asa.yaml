        url: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
        retrieved: 2026-09-05
  logging.recent:
    command: show logging
    verified: doc_claimed
    sources:
      - title: 'Cisco ASA Series Command Reference'
        url: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
        retrieved: 2026-09-05
  config.running:
    command: show running-config
    verified: doc_claimed
    sources:
      - title: 'Cisco ASA Series Command Reference'
        url: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
        retrieved: 2026-09-05
