# plans/cisco-ios.yaml — the Cisco IOS command plan for the TAC escalation pack.
#
# Schema: ai/tac/README.md §4. Every command here is a READ-ONLY show, proven
# by the loader (protocoldiag.ValidateReadOnly) and again by the runner. An
# intent this dialect does not bind is simply ABSENT — the plan preview shows
# it as unbound rather than rendering another vendor's command at this device.
#
# `verified: doc_claimed` means the vendor documents the command and Correlix
# has not run it on this platform. `consent: true` marks a command the vendor
# says is NOT routine (a core dump, a control-plane load, a file written on the
# device): it never runs by default and never sits in a baseline.
# `read_only_exception` is a CITED documented-status read whose text carries a
# token the grammar refuses on sight.
#
# MACHINE-MERGED from ai/tac/research/*.yaml by scripts/tac-merge-research.py.
schema_version: 1
dialect: cisco-ios
profile: cisco/ios
display: Cisco IOS
version: correlix-tac-plan-cisco-ios-2026-09-05

# The dialect's BIBLIOGRAPHY — the pages this file was built from. A binding
# cites its own page(s) below; this list never rides on a plan step.
sources:
  - title: Cisco IOS Command References
    url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
    retrieved: 2026-09-05

# first_ask — the VENDOR'S OWN first-ask collection, and it LEADS every capture
# (owner, 2026-09-06: "we pre-gather common commands especially things like show
# tech-support which is good enough to open a case initially"). It is empty on a
# platform whose own bundle command WRITES TO THE DEVICE or is generated out of
# band; first_ask_note says which, with the vendor's page.
first_ask:
  - tech.support

# baseline — collected for EVERY class: the vendor-standard set a TAC engineer
# opens before anything issue-specific.
baseline:
  - system.version
  - system.inventory
  - system.uptime
  - hardware.environment
  - interface.brief
  - interface.counters
  - route.summary
  - logging.recent
  - config.running

bindings:
  system.version:
    command: show version
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  system.inventory:
    command: show inventory
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  system.uptime:
    command: show version
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  hardware.environment:
    command: show environment all
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  interface.brief:
    command: show ip interface brief
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  interface.counters:
    command: show interfaces counters
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  route.summary:
    command: show ip route summary
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  logging.recent:
    command: show logging
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  config.running:
    command: show running-config
    verified: doc_claimed
    sources:
      - title: Cisco IOS Command References
        url: https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-15-2m-t/products-command-reference-list.html
        retrieved: 2026-09-05
  tech.support:
    command: show tech-support
    verified: doc_claimed
    sources:
      - title: 'Cisco IOS Configuration Fundamentals Command Reference — show protocols through show mon (contains show tech-support)'
        url: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref/show_protocols_through_showmon.html
    max_bytes: 33554432
    timeout_s: 600
