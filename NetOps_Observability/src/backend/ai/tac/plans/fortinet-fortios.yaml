# baseline — collected for EVERY class: the vendor-standard set a TAC engineer
# opens before anything issue-specific.
baseline:
  - system.version
  - system.inventory
  - system.resources
  - interface.brief
  - config.running
  - platform.version
  - system.health
  - system.process.top
  - system.memory
  - interface.summary
  - route.table
  - system.crashlog
  - config.errors
  - session.count
  - dns.config
  - utm.webfilter.stats
  - utm.ips.memory

bindings:
  system.version:
    command: get system status
    verified: doc_claimed
  system.inventory:
    command: get hardware status
    verified: doc_claimed
  system.resources:
    command: get system performance status
    verified: doc_claimed
  interface.brief:
    command: get system interface
    verified: doc_claimed
  config.running:
    command: show full-configuration
    verified: doc_claimed
  platform.version:
    command: get system status
    verified: doc_claimed
  system.health:
    command: get system performance status
    verified: doc_claimed
  system.process.top:
    command: get system performance top
    verified: doc_claimed
  system.memory:
    command: get hardware memory
    verified: doc_claimed
  interface.summary:
    command: get system interface
    verified: doc_claimed
  route.table:
    command: get router info routing-table all
    verified: doc_claimed
  system.crashlog:
    command: diagnose debug crashlog read
    verified: doc_claimed
    read_only_exception: >-
      a status print of the stored crash log; it reads, it does not enable
      debugging
    sources:
      - title: FortiOS CLI troubleshooting cheat sheet
        url: https://docs.fortinet.com/document/fortigate/7.4.0/cli-troubleshooting-cheat-sheet/420966/cli-troubleshooting-cheat-sheet
  config.errors:
    command: diagnose debug config-error-log read
    verified: doc_claimed
    read_only_exception: >-
      a status print of the configuration-error log
    sources:
      - title: FortiOS CLI troubleshooting cheat sheet
        url: https://docs.fortinet.com/document/fortigate/7.4.0/cli-troubleshooting-cheat-sheet/420966/cli-troubleshooting-cheat-sheet
  arp.table:
    command: get system arp
    verified: doc_claimed
  bgp.summary:
    command: get router info bgp summary
    verified: doc_claimed
  bgp.neighbors:
    command: get router info bgp neighbors
    verified: doc_claimed
  bgp.prefix.detail:
    command: 'get router info bgp network {prefix}'
    verified: doc_claimed
  route.database:
    command: get router info routing-table database
    verified: doc_claimed
  ospf.status:
    command: get router info ospf status
    verified: doc_claimed
  ospf.neighbors:
    command: get router info ospf neighbor all
    verified: doc_claimed
  ospf.interfaces:
    command: get router info ospf interface
    verified: doc_claimed
  ospf.database:
    command: get router info ospf database brief
    verified: doc_claimed
  route.kernel:
    command: get router info kernel
    verified: doc_claimed
  interface.physical:
    command: get sys interface physical
    verified: doc_claimed
  interface.transceiver:
    command: get sys interface transceiver
    verified: doc_claimed
  session.count:
    command: get system session status
