# plans/juniper-junos.yaml — the Juniper Junos command plan for the TAC escalation pack.
#
# Schema: ai/tac/README.md §4. Every command here is a READ-ONLY show, proven
# by the loader (protocoldiag.ValidateReadOnly) and again by the runner. An
# intent this dialect does not bind is simply ABSENT — the plan preview shows
# it as unbound rather than rendering another vendor's command at this device.
#
# `verified: doc_claimed` means the vendor documents the command and Correlix
# has not run it on this platform. `consent: true` marks a command the vendor
# says is NOT routine (a core dump, a control-plane load, a file written on the
# device): it never runs by default and never sits in a baseline.
# `read_only_exception` is a CITED documented-status read whose text carries a
# token the grammar refuses on sight.
#
# MACHINE-MERGED from ai/tac/research/*.yaml by scripts/tac-merge-research.py.
schema_version: 1
dialect: juniper-junos
profile: juniper/junos
display: Juniper Junos
version: correlix-tac-plan-juniper-junos-2026-09-05

# The dialect's BIBLIOGRAPHY — the pages this file was built from. A binding
# cites its own page(s) below; this list never rides on a plan step.
