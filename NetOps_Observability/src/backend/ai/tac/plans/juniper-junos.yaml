# baseline — collected for EVERY class: the vendor-standard set a TAC engineer
# opens before anything issue-specific.
baseline:
  - system.version
  - system.inventory
  - system.uptime
  - hardware.environment
  - interface.brief
  - interface.counters
  - route.summary
  - logging.recent
  - config.running
  - interface.counters.extensive
  - config.running.redacted
  - version.info
  - inventory.hardware
  - environment.all
  - alarms.chassis
  - alarms.system

