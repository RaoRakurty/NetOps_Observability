# baseline — collected for EVERY class: the vendor-standard set a TAC engineer
# opens before anything issue-specific.
baseline:
  - platform.version
  - platform.system-info
  - platform.components
  - platform.chassis
  - platform.environment
  - platform.resource-monitoring
  - system.alarms
  - system.processes
  - interface.brief
  - logging.recent
  - config.running
  - vrf.summary

