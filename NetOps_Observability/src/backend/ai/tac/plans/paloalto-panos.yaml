# baseline — collected for EVERY class: the vendor-standard set a TAC engineer
# opens before anything issue-specific.
baseline:
  - system.version
  - system.uptime
  - system.resources
  - hardware.environment
  - interface.brief
  - logging.recent
  - config.running
  - platform.version
  - platform.vsys.mode
  - system.processes
  - system.disk
  - logging.quota
  - dataplane.resources
  - jobs.status
  - session.stats
  - policy.list
  - admin.sessions
  - ha.cluster.status
  - dataplane.counters

