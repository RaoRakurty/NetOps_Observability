      - "Failed fan module"
      - "Blocked airflow, dust or filter blockage"
      - "Ambient temperature too high for the platform"
    commands:
      - {cmd: "show system environment all", intent: environment.all}
      - {cmd: "show environment power", intent: environment.power}
      - {cmd: "show environment temperature", intent: environment.temperature}
      - {cmd: "show system environment cooling", intent: environment.cooling}
      - {cmd: "show version", intent: version.info}
    tac_first_look: "show system environment all gives the combined power, cooling and temperature view in one shot — triage from there."
    sources:
      - https://www.arista.com/en/um-eos/eos-configuring-and-viewing-environment-settings
      - https://www.arista.com/en/um-eos/eos-environment-commands
      - https://www.arista.com/en/um-eos/eos-switch-environment-control

  - id: high-cpu
    class: high-cpu
    title: "High CPU utilization on the switch"
    symptoms:
      - "Sustained high CPU percentage, or one core pegged"
      - "Slow CLI response"
      - "Load average climbing"
      - "Control-plane protocol timers slipping"
    log_signatures: []
    likely_causes:
      - "Control-plane churn — routing convergence storm, LACP or STP churn, heavy SNMP polling"
      - "A runaway agent"
      - "Excessive traffic punted to the CPU that CoPP is not bounding"
      - "Interrupt storm from a flapping interface"
    commands:
      - {cmd: "show processes top", intent: cpu.processes}
      - {cmd: "show version", intent: version.info}
      - {cmd: "show logging", intent: logging.recent}
      - {cmd: "show policy-map interface <interface> input counters", intent: copp.counters, params: [interface]}
      - {cmd: "show hardware counter drop", intent: hardware.drop.counters}
    tac_first_look: "Separate load average from CPU percentage before assuming a CPU-bound pathology, then identify which agent or punt path is responsible."
    sourcing_note: "show processes top is taken from Arista's own community articles on CPU utilization, whose bodies render only in a JavaScript portal; the command text came from Arista's indexed page content rather than a directly rendered page."
    sources:
      - https://eos.arista.com/troubleshooting-high-cpu-utilization/
      - https://eos.arista.com/understanding-cpu-utilization/
      - https://www.arista.com/en/um-eos/eos-quality-of-service

  - id: high-memory-agent-leak
    class: high-memory
    title: "High memory utilization or a leaking EOS agent"
    symptoms:
      - "One agent's memory grows without bound over time"
      - "System-wide free memory falling"
      - "An agent killed and restarted under low-memory conditions"
      - "Symptoms appear only after long uptime"
    log_signatures: []
    likely_causes:
      - "A specific agent leaking on one code path"
      - "Very long uptime without a restart"
      - "A feature generating unusually large internal state"
      - "Undersized platform for the current scale"
    commands:
      - {cmd: "show agent", intent: agent.status}
      - {cmd: "show version", intent: version.info}
      - {cmd: "show processes top", intent: cpu.processes}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: "Identify which agent is growing with per-agent memory first (RssAnon / VmSize), then trend it against system-wide free memory from show version."
    sourcing_note: "show agent per-process memory fields are from an Arista community article that renders only in a JavaScript portal; captured from Arista's indexed page content, not a directly rendered page."
    sources:
      - https://eos.arista.com/monitoring-some-agents-memory-utilisation/
      - https://www.arista.com/assets/data/pdf/Arista_Support_Community_Guide.pdf

  - id: agent-crash-core
    class: process-crash
    proposed_class: true
    title: "EOS agent crash or restart, and core files after a crash"
    symptoms:
      - "An agent (Sysdb, Fru, Rib and so on) disappears and restarts under a new PID"
      - "The feature the agent owns briefly stops working"
      - "Several agents cascade-restart"
      - "A core file appears after the crash"
    log_signatures:
      - "PROCMGR-4-TERMINATE_PROCESS_SIGQUIT"
      - "PROCMGR-6-PROCESS_RESTART"
    likely_causes:
      - "Unhandled exception or segfault in the agent"
      - "Sysdb schema mismatch after a bad upgrade"
      - "Memory or file-descriptor exhaustion"
      - "A defect triggered by a specific configuration or traffic pattern"
    commands:
      - {cmd: "show agent logs crash", intent: agent.logs.crash}
      - {cmd: "show agent", intent: agent.status}
      - {cmd: "show logging", intent: logging.recent}
      - {cmd: "show tech-support", intent: techsupport.bundle}
      - {cmd: "show version", intent: version.info}
    tac_first_look: "show agent logs crash first; a crash case must be escalated with show tech-support plus the core file, not just the restart message."
    sourcing_note: "The PROCMGR message fragments and show agent logs crash come from Arista community articles that render only in a JavaScript portal; captured from Arista's indexed page content. Core files are collected from the filesystem, which is outside this read-only CLI plan."
    sources:
      - https://eos.arista.com/restarting-eos-agents/
      - https://eos.arista.com/debugging-eos-agents/
      - https://www.arista.com/assets/data/pdf/Arista_Support_Community_Guide.pdf

  - id: unexpected-state-change
    class: config-change
    title: "Unexpected state or configuration change — what changed and when"
    symptoms:
      - "A running value differs from what the operator expects"
      - "Routes, ARP or MAC entries churning without an obvious trigger"
      - "STP reported unstable"
      - "An incident starts immediately after an automation run"
    log_signatures: []
    likely_causes:
      - "An unaudited CLI or API change"
      - "Automation pushing an unintended configuration"
      - "A config session left partially applied"
      - "Genuine state-table churn rather than a config edit"
    commands:
      - {cmd: "show event-monitor route", intent: eventmonitor.route}
      - {cmd: "show event-monitor arp", intent: eventmonitor.arp}
      - {cmd: "show event-monitor mac", intent: eventmonitor.mac}
      - {cmd: "show event-monitor neighbor", intent: eventmonitor.neighbor}
      - {cmd: "show event-monitor stpunstable", intent: eventmonitor.stp}
      - {cmd: "show event-monitor sqlite", intent: eventmonitor.sqlite}
      - {cmd: "show running-config", intent: config.running}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: "Event Monitor answers state-table churn (routes, ARP, MAC, STP) with a queryable history; a genuine running-config edit has to be established from the config itself and the logs."
    sources:
      - https://www.arista.com/en/um-eos/eos-event-monitor
      - https://www.arista.com/en/um-eos/eos-switch-administration-commands

  - id: upgrade-boot-extension
    class: software-upgrade
    proposed_class: true
    title: "Upgrade / boot problem, or an extension that does not load"
    symptoms:
      - "Switch does not boot into the intended image"
      - "An installed extension is not active after reload"
      - "Redundancy or switchover state inconsistent between supervisors"
      - "Unexpected reboot with no obvious cause"
    log_signatures:
      - "INSTALL_ERROR"
      - "SIGNATURE_INVALID"
      - "LOAD_ERROR"
    likely_causes:
      - "Extension not copied to boot-extensions, so it does not survive a reboot"
      - "Missing extension dependency (INSTALL_ERROR)"
      - "Invalid or unsigned extension package (SIGNATURE_INVALID)"
      - "Extension will not load with the current configuration (LOAD_ERROR)"
      - "boot-config pointing at the wrong image, or a BIOS/Aboot mismatch"
      - "Supervisor file replication out of sync"
    commands:
      - {cmd: "show extensions", intent: extensions.list}
      - {cmd: "show boot-extensions", intent: extensions.boot}
      - {cmd: "show boot-config", intent: boot.config}
      - {cmd: "show reload cause", intent: reload.cause}
      - {cmd: "show reload", intent: reload.status}
      - {cmd: "show platform bios", intent: platform.bios}
      - {cmd: "show platform bios history", intent: platform.bios.history}
      - {cmd: "show redundancy status", intent: redundancy.status}
      - {cmd: "show redundancy file-replication", intent: redundancy.filerepl}
      - {cmd: "show version", intent: version.info}
    tac_first_look: "Diff show extensions against show boot-extensions to catch installed-but-not-persisted extensions, and read show reload cause for any unexplained reboot."
    sources:
      - https://www.arista.com/en/um-eos/eos-managing-eos-extensions
      - https://www.arista.com/en/um-eos/eos-switch-booting-commands
      - https://www.arista.com/en/um-eos/eos-booting-the-switch
      - https://www.arista.com/en/um-eos/eos-upgrades-and-downgrades

  - id: acl-copp-drops
    class: control-plane-policing
    proposed_class: true
    title: "ACL not matching, or control-plane policing dropping traffic"
    symptoms:
      - "Traffic is not permitted or denied as the ACL intends"
      - "ACL counters not incrementing where expected"
      - "Control-plane traffic dropped under load"
      - "One high-rate flow starving its policer class"
    log_signatures: []
    likely_causes:
      - "ACL not applied to the intended interface or direction"
      - "Hardware programming failure so the ACL is not actually in the forwarding path"
      - "Implicit deny catching traffic the author did not consider"
      - "Policer rate too low for legitimate control-plane traffic"
      - "A single flow or LAG member monopolising its class"
    commands:
      - {cmd: "show ip access-lists", intent: acl.list}
      - {cmd: "show ip access-lists <name>", intent: acl.detail, params: [name]}
      - {cmd: "show ip access-lists summary", intent: acl.summary}
      - {cmd: "show ipv6 access-lists", intent: acl.list.v6}
      - {cmd: "show mac access-lists", intent: acl.list.mac}
      - {cmd: "show access-lists", intent: acl.all}
      - {cmd: "show policy-map interface <interface> input counters", intent: copp.counters, params: [interface]}
      - {cmd: "show policy-map type qos <name> input counters", intent: qos.policy.counters, params: [name]}
      - {cmd: "show hardware counter drop", intent: hardware.drop.counters}
    tac_first_look: "Confirm the ACL is actually programmed in hardware before assuming a logic error; for control-plane drops, check whether one flow is monopolising its class."
    sources:
      - https://www.arista.com/en/um-eos/eos-acls-and-route-maps
      - https://www.arista.com/en/um-eos/eos-quality-of-service
      - https://www.arista.com/en/support/toi/tag/copp

  - id: ntp-not-synchronized
    class: ntp-sync
    proposed_class: true
    title: "NTP not synchronized / clock offset"
    symptoms:
      - "show ntp status reports unsynchronised"
      - "Large offset from the reference clock"
      - "No server reachable or selected in show ntp associations"
      - "Log timestamps disagree with other devices, breaking correlation"
    log_signatures: []
    likely_causes:
      - "No reachable NTP server — network path or firewall"
      - "Server hostname resolved only at service start, so a re-addressed server is never re-resolved"
      - "NTP client bound to the wrong VRF"
      - "Stratum or authentication mismatch"
      - "Clock drift beyond the step threshold"
    commands:
      - {cmd: "show ntp status", intent: ntp.status}
      - {cmd: "show ntp associations", intent: ntp.associations}
      - {cmd: "show clock", intent: clock.now}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: "show ntp status for the sync state and show ntp associations for per-server reachability and stratum; remember a re-addressed server hostname may need the service to restart before it is re-resolved."
    sources:
      - https://www.arista.com/en/um-eos/eos-system-clock-and-time-protocols
      - https://www.arista.com/en/um-eos/eos-switch-administration-commands
      - https://www.arista.com/en/support/toi/tag/ntp

  - id: snmp-poll-or-trap-failure
    class: snmp
    proposed_class: true
    title: "SNMP polling failing or traps not delivered"
    symptoms:
      - "Poller times out or receives no response"
      - "Expected trap never arrives at the NMS"
      - "Only some OIDs respond"
      - "SNMPv3 users fail to authenticate"
    log_signatures: []
    likely_causes:
      - "SNMP ACL blocking the poller's source address"
      - "Wrong community string or SNMPv3 credentials"
      - "Notification host not configured, or configured in the wrong VRF"
      - "engineID mismatch for SNMPv3"
      - "MIB or OID not supported for the counter being polled"
    commands:
      - {cmd: "show snmp", intent: snmp.status}
      - {cmd: "show snmp community", intent: snmp.community}
      - {cmd: "show snmp user", intent: snmp.user}
      - {cmd: "show snmp group", intent: snmp.group}
      - {cmd: "show snmp view", intent: snmp.view}
      - {cmd: "show snmp engineID", intent: snmp.engineid}
      - {cmd: "show snmp notification", intent: snmp.notification}
      - {cmd: "show snmp notification host", intent: snmp.notification.host}
      - {cmd: "show snmp local-interface", intent: snmp.localif}
      - {cmd: "show snmp mib", intent: snmp.mib}
      - {cmd: "show snmp ipv4 access-list detail", intent: snmp.acl.detail}
      - {cmd: "show snmp ipv4 access-list summary", intent: snmp.acl.summary}
    tac_first_look: "show snmp for engine, community and host state, then show snmp ipv4 access-list detail to rule out an ACL silently dropping the poller."
    sources:
      - https://www.arista.com/en/um-eos/eos-snmp

  - id: aaa-auth-failure
    class: aaa-auth
    proposed_class: true
    title: "AAA failure — TACACS+ / RADIUS authentication denied"
    symptoms:
      - "Login denied despite correct credentials"
      - "Unexpected fallback to local authentication"
      - "Server appears unreachable to the switch"
      - "Login succeeds but the user has no privileges"
    log_signatures: []
    likely_causes:
      - "TACACS+ or RADIUS server unreachable, or wrong shared secret"
      - "Server group misconfigured"
      - "No fallback method defined"
      - "Role or privilege mapping missing, so authorization fails after authentication"
    commands:
      - {cmd: "show tacacs", intent: aaa.tacacs}
      - {cmd: "show radius", intent: aaa.radius}
      - {cmd: "show monitor server radius", intent: aaa.radius.monitor}
      - {cmd: "show monitor server radius detail", intent: aaa.radius.monitor.detail}
      - {cmd: "show users roles", intent: aaa.roles}
      - {cmd: "show users accounts", intent: aaa.accounts}
      - {cmd: "show users detail", intent: aaa.users.detail}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: "show tacacs and show radius for server reachability and configuration, then the live probe health, before assuming a credential problem."
    sources:
      - https://www.arista.com/en/um-eos/eos-user-security
      - https://www.arista.com/en/um-eos/eos-security

  - id: qos-queue-drops
    class: qos-drops
    title: "QoS output queue drops / buffer pressure"
    symptoms:
      - "Egress drops climbing while the link is not saturated end to end"
      - "One traffic class starved"
      - "Queue depth or buffer alarms"
      - "Latency-sensitive traffic misbehaving under load"
    log_signatures: []
    likely_causes:
      - "Oversubscribed egress queue for a given priority"
      - "Wrong trust mode causing misclassification"
      - "ECN not enabled, so the queue tail-drops instead of marking"
      - "Policer or shaper set too aggressively for the class"
    commands:
      - {cmd: "show qos interfaces", intent: qos.interfaces}
      - {cmd: "show qos interfaces trust", intent: qos.trust}
      - {cmd: "show qos maps", intent: qos.maps}
      - {cmd: "show policy-map interface <interface> input counters", intent: qos.policy.interface.counters, params: [interface]}
      - {cmd: "show policy-map type qos <name> input counters", intent: qos.policy.counters, params: [name]}
      - {cmd: "show interface", intent: interface.counters}
    tac_first_look: "show qos interfaces to confirm queue and shaper configuration matches intent, then the policy-map counters for conform/exceed/drop on the specific class."
    sources:
      - https://www.arista.com/en/um-eos/eos-quality-of-service

  - id: multicast-not-forwarded
    class: multicast
    proposed_class: true
    title: "Multicast not forwarded — no PIM neighbor or missing IGMP state"
    symptoms:
      - "No PIM neighbour on an interface that should have one"
      - "IGMP group present on the access side but no forwarding"
      - "RP unreachable"
      - "Receivers on one switch get the stream while others do not"
    log_signatures: []
    likely_causes:
      - "PIM not enabled on a transit interface"
      - "RP misconfigured or unreachable (static RP, BSR or Auto-RP failure)"
      - "IGMP snooping mrouter port not learned"
      - "ACL or underlay blocking PIM hellos"
      - "Interface configuration mismatch flagged by config-sanity"
    commands:
      - {cmd: "show ip pim neighbor", intent: multicast.pim.neighbors}
      - {cmd: "show ip pim interface", intent: multicast.pim.interfaces}
      - {cmd: "show ip pim config-sanity", intent: multicast.pim.sanity}
      - {cmd: "show ip pim rp", intent: multicast.pim.rp}
      - {cmd: "show ip pim bsr", intent: multicast.pim.bsr}
      - {cmd: "show ip pim upstream joins", intent: multicast.pim.joins}
      - {cmd: "show ip pim protocol counters", intent: multicast.pim.counters}
      - {cmd: "show ip igmp groups", intent: multicast.igmp.groups}
      - {cmd: "show ip igmp interface", intent: multicast.igmp.interfaces}
      - {cmd: "show ip igmp statistics", intent: multicast.igmp.stats}
      - {cmd: "show ip igmp snooping", intent: multicast.igmpsnooping}
      - {cmd: "show ip igmp snooping mrouter", intent: multicast.igmpsnooping.mrouter}
      - {cmd: "show ip igmp snooping groups", intent: multicast.igmpsnooping.groups}
    tac_first_look: "show ip pim neighbor with show ip pim config-sanity first, to rule out a basic adjacency or configuration mismatch before chasing the RP or snooping."
    sources:
      - https://www.arista.com/en/um-eos/eos-protocol-independent-multicast
      - https://www.arista.com/en/um-eos/eos-igmp-and-igmp-snooping
      - https://www.arista.com/en/um-eos/eos-multicast
