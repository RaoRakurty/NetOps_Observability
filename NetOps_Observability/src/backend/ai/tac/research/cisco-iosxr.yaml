      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/interfaces/command/reference/b-interfaces-hardware-component-cr-asr9000/hardware-redundancy-and-node-administration-commands.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html

  - id: platform-node-not-in-xr-run-state
    class: platform-boot
    proposed_class: true
    title: "show platform node not in IOS-XR RUN state (SW_INACTIVE / FAILED / boot loop)"
    symptoms:
      - "module displays SW_INACTIVE in show platform / admin show platform"
      - "boot loop with repeated power cycles and resets"
      - "module stuck synchronising with the active Route Processor"
      - "card in FAILED/FAILED state, cycling postcodes"
    log_signatures:
      - "%PLATFORM-CANB_SERVER-7-CBC_POST_RESET_NOTIFICATION"
      - "%INFRA-SHELF_MGR-6-HW_EVENT"
      - "%INFRA-SHELF_MGR-6-CARD_HW_OPERATIONAL"
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_REQ"
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_IMG"
      - "%PKT_INFRA-FM-3-FAULT_MAJOR"
    likely_causes:
      - "boot files in /misc/disk1/tftpboot missing or corrupted, so the active RP cannot share the boot set"
      - "missing or incorrect DHCP configuration, so the line card gets no internal IP"
      - "Golden FPGA below minimum version, requiring a force FPD upgrade"
      - "active Route Processor unable to distribute boot information to a newly inserted module"
    commands:
      - {cmd: "show platform", intent: platform.node.state}
      - {cmd: "admin show platform", intent: platform.node.state.admin}
      - {cmd: "show hw-module fpd location all", intent: fpd.status}
      - {cmd: "show platform slices", intent: platform.slices}
      - {cmd: "show controllers card-mgr event-history brief location <loc>", intent: platform.cardmgr.events, params: [loc]}
      - {cmd: "show controller card-mgr inventory summary", intent: platform.cardmgr.inventory}
      - {cmd: "show install active summary", intent: install.active}
      - {cmd: "show tech install one-showtech", intent: install.techsupport.bundle}
      - {cmd: "show version", intent: software.version}
    tac_first_look: >-
      Confirm the state in admin show platform, then check the FPD level and the
      install/boot-file set on the active RP — SW_INACTIVE is almost always a boot-image
      or FPD delivery problem, not a dead card.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/221708-troubleshoot-modules-in-sw-inactive-st.html
      - https://www.cisco.com/c/en/us/support/docs/routers/network-convergence-system-5500-series/217243-analyze-triaging-fretta-platform-depende.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html

  - id: fpd-out-of-date
    class: fpd-firmware
    proposed_class: true
    title: "FPD out of date / field-programmable device needs upgrade"
    symptoms:
      - "show hw-module fpd reports a FRU whose running FPD version is below the package version"
      - "card refuses to come to RUN, or comes up with reduced function, after an upgrade"
      - "Golden FPGA below the minimum version required by the running image"
    log_signatures:
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_IMG"
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_REQ"
    likely_causes:
      - "software upgrade delivering a newer FPD package than the hardware carries"
      - "Golden FPGA below the minimum version, requiring a force FPD upgrade"
      - "a newly inserted FRU shipped with older firmware than the chassis baseline"
      - "FPD upgrade interrupted, leaving a partial state"
    commands:
      - {cmd: "show hw-module fpd", intent: fpd.status}
      - {cmd: "show hw-module fpd location all", intent: fpd.status.all}
      - {cmd: "show fpd package", intent: fpd.package.baseline}
      - {cmd: "show platform", intent: platform.node.state}
      - {cmd: "show inventory", intent: hardware.inventory}
      - {cmd: "show install active summary", intent: install.active}
      - {cmd: "show tech-support fpd", intent: fpd.techsupport.bundle}
    tac_first_look: >-
      Diff show hw-module fpd location all against show fpd package for the running image
      — every row where running is below package is the upgrade list.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/interfaces/command/reference/b-interfaces-hardware-component-cr-asr9000/hardware-redundancy-and-node-administration-commands.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/221708-troubleshoot-modules-in-sw-inactive-st.html
      - https://www.cisco.com/c/en/us/support/docs/routers/network-convergence-system-5500-series/217243-analyze-triaging-fretta-platform-depende.html

  - id: rp-redundancy-and-switchover
    class: redundancy-switchover
    proposed_class: true
    title: "RP/RSP redundancy state wrong or an unexpected switchover"
    symptoms:
      - "standby RP not in a ready/hot-standby state, or the redundancy pair not synchronised"
      - "unplanned switchover with sessions reset at the moment of the switch"
      - "configuration inconsistency reported on the standby node"
    log_signatures: []
    likely_causes:
      - "active Route Processor failure, unable to distribute boot information"
      - "standby node still in a non-RUN platform state"
      - "software levels not matching between the pair after an install operation"
      - "fabric or card faults escalating to a reset request on the active RP"
    commands:
      - {cmd: "show redundancy", intent: redundancy.state}
      - {cmd: "show redundancy summary", intent: redundancy.summary}
      - {cmd: "show platform", intent: platform.node.state}
      - {cmd: "show configuration inconsistency replica", intent: config.standby.consistency}
      - {cmd: "show install committed", intent: install.committed}
      - {cmd: "show reboot history", intent: reload.history}
      - {cmd: "show pfm location all", intent: platform.pfm.faults}
      - {cmd: "show version", intent: software.version}
    tac_first_look: >-
      show redundancy plus show platform establishes whether the standby is genuinely
      ready; if a switchover already happened, show reboot history on the former active
      names the trigger.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/configuration-management-commands.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/software-package-management-commands.html

  - id: software-install-smu-and-commit-failure
    class: software-install
    proposed_class: true
    title: "Software install / SMU activation or commit failure"
    symptoms:
      - "install operation does not report Install operation completed successfully"
      - "activation warns that some SMU packages will be superseded, or that nodes will reload in parallel"
      - "packages active but not committed, so they do not survive a reload"
      - "a node left out of step with the rest of the chassis after the operation"
    log_signatures:
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_REQ"
      - "%INFRA-INSTAGENT-4-XR_PART_PREP_IMG"
    likely_causes:
      - "an SMU superseded by another SMU already active on the box"
      - "package/PIE integrity or signing problems (certificate expiry, corrupt PIE, RPM signage on 64-bit eXR)"
      - "the operation requires a parallel reload of nodes that were not ready"
      - "activated but uncommitted packages lost across a reload"
      - "a node not in RUN state at activation time, so it never receives the package"
    commands:
      - {cmd: "show install log", intent: install.log}
      - {cmd: "show install active summary", intent: install.active}
      - {cmd: "show install committed", intent: install.committed}
      - {cmd: "show install superceded", intent: install.superseded}
      - {cmd: "show install package pie detail", intent: install.package.detail}
      - {cmd: "show install request", intent: install.request.state}
      - {cmd: "show install audit", intent: install.audit}
      - {cmd: "show install boot-options location all", intent: install.boot.options}
      - {cmd: "show system verify", intent: system.verify}
      - {cmd: "show tech-support install", intent: install.techsupport.bundle}
    tac_first_look: >-
      show install log for the failing operation id, cross-checked with show install
      active summary versus show install committed — the gap between active and committed
      is the most common "it came back wrong after reload" cause.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/116332-maintain-ios-xr-smu-00.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/software-package-management-commands.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/221131-transfer-show-tech-support-files-to-xr-v.html

  - id: config-commit-audit
    class: config-change
    title: "Config commit failed, or a change needs to be audited against an outage"
    symptoms:
      - "Failed to commit one or more configuration items during a pseudo-atomic operation. All changes made have been reverted."
      - "warning conditions at commit, e.g. InPlace Modify Error detected the warning condition"
      - "Ran out of 8 Queues for the port reported by prm_ezhal at commit"
      - "the configuration present after a reload differs from what was intended"
    log_signatures:
      - "%MGBL-CONFIG-6-DB_COMMIT"
      - "%MGBL-SYS-5-CONFIG_I"
    likely_causes:
      - "platform resource limits exceeded (queues, policers, EFPs differ between -TR and -SE cards)"
      - "unsupported combination of queues at the leaf level of a queuing hierarchy"
      - "configuration syntactically valid but rejected by a feature manager at apply time"
      - "a change committed and then reverted, leaving a startup-config failure at the next boot"
    commands:
      - {cmd: "show configuration failed", intent: config.commit.failure}
      - {cmd: "show configuration failed inheritance", intent: config.commit.failure.detail}
      - {cmd: "show configuration failed startup", intent: config.startup.failure}
      - {cmd: "show configuration history", intent: config.change.history}
      - {cmd: "show configuration commit changes all", intent: config.commit.diff}
      - {cmd: "show configuration commit list", intent: config.commit.list}
      - {cmd: "show configuration rollback changes", intent: config.rollback.preview}
      - {cmd: "show configuration sessions", intent: config.sessions}
      - {cmd: "show cli history detail", intent: cli.history}
    tac_first_look: >-
      show configuration commit list then show configuration commit changes all bounds
      the change window; show configuration failed gives the exact rejected stanza and
      the feature manager that rejected it.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/support/docs/routers/asr-9000-series-aggregation-services-routers/213255-asr-9000-ethernet-line-cards-tr-and-se.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/configuration-management-commands.html

  - id: ntp-not-synchronising
    class: ntp-sync
    proposed_class: true
    title: "NTP not synchronising / clock unsynchronised on IOS-XR"
    symptoms:
      - "show ntp status reports the clock unsynchronised, or a stratum that never settles"
      - "associations never reach a reachable/candidate state"
      - "log timestamps drift between nodes, making correlation unreliable"
    log_signatures: []
    likely_causes:
      - "server unreachable from the node's own location (NTP state is per node, hence the location keyword)"
      - "association configured but never selected as a peer or candidate"
      - "local calendar/clock diverged from the NTP-derived time"
      - "control-plane path to the NTP server policed or filtered (LPTS or ACL)"
    commands:
      - {cmd: "show ntp status location <loc>", intent: ntp.sync.state, params: [loc]}
      - {cmd: "show ntp associations detail location <loc>", intent: ntp.associations, params: [loc]}
      - {cmd: "show calendar", intent: clock.calendar}
      - {cmd: "show lpts pifib hardware police location <loc>", intent: lpts.police.rates, params: [loc]}
      - {cmd: "show access-lists ipv4 <name> hardware ingress location <loc>", intent: acl.hardware.hits.v4, params: [name, loc]}
      - {cmd: "show logging location <loc>", intent: logging.buffer.filtered, params: [loc]}
      - {cmd: "show tcp brief", intent: transport.sessions}
    tac_first_look: >-
      Run show ntp status location <loc> and show ntp associations detail location <loc>
      on the SPECIFIC node that is out of sync, not just the active RP.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/ntp-commands.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/ip-addresses/command/reference/b-ip-addresses-cr-asr9000/b-ipaddr-cr-asr9k_chapter_0111.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/ip-addresses/command/reference/b-ip-addresses-cr-asr9000/b-ipaddr-cr-asr9k_chapter_01.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_monitoring/command/reference/b-sysmon-cr-asr9k/b-sysmon-cr-asr9k_chapter_0100.html

  - id: snmp-polling-and-trap-problems
    class: snmp-agent
    proposed_class: true
    title: "SNMP polling slow or failing, or traps not arriving, on IOS-XR"
    symptoms:
      - "NMS polls time out or return partial data while the CLI is responsive"
      - "linkUp/linkDown notifications missing for some interfaces"
      - "ifIndex values change, or do not match the NMS's cached map"
      - "duplicate PDUs being dropped; incoming request queue backing up"
    log_signatures: []
    likely_causes:
      - "slow OIDs or heavy polling saturating the SNMP request queue, after which duplicate PDUs are dropped"
      - "notification not enabled for the interface subset being watched"
      - "ifIndex mapping mismatch between the device and the NMS"
      - "view/group/user configuration excluding the polled subtree"
      - "trap host or UDP port not configured as the NMS expects"
      - "control-plane policing of the SNMP punt path"
    commands:
      - {cmd: "show snmp", intent: snmp.status}
      - {cmd: "show snmp interface", intent: snmp.ifindex.map}
      - {cmd: "show snmp interface notification <if>", intent: snmp.linkupdown.state, params: [if]}
      - {cmd: "show snmp request incoming-queue detail", intent: snmp.queue.depth}
      - {cmd: "show snmp request duplicates", intent: snmp.duplicate.drops}
      - {cmd: "show snmp statistics slow oid", intent: snmp.slow.oids}
      - {cmd: "show snmp statistics pdu", intent: snmp.pdu.stats}
      - {cmd: "show snmp traps details", intent: snmp.traps}
      - {cmd: "show snmp host", intent: snmp.receivers}
      - {cmd: "show snmp view", intent: snmp.views}
    tac_first_look: >-
      show snmp request incoming-queue detail plus show snmp statistics slow oid tells
      you in one pass whether the box is being over-polled or a specific OID is the
      bottleneck.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/system_management/command/reference/b-system-managment-cr-asr9000/snmp-server-commands.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html

  - id: aaa-tacacs-problems
    class: aaa-auth
    proposed_class: true
    title: "AAA / TACACS+ authentication or authorization failures on IOS-XR"
    symptoms:
      - "logins fail or hang while the console/local account still works"
      - "TACACS server repeatedly marked down then up"
      - "repeated Failed to get request for: key ... session ... messages filling the log buffer"
      - "alarm-logger CPU climbing as a side effect of the message flood"
    log_signatures:
      - "%SECURITY-TACACSD-7-GENERIC_ERROR"
      - "%SECURITY-TACACSD-6-SERVER_UP"
      - "%SECURITY-TACACSD-6-SERVER_DOWN"
      - "%SECURITY-TACACSD-6-TIMEOUT_IGNORED"
    likely_causes:
      - "tacacsd generating an overwhelming volume of syslog messages (a known defect fixed in later releases)"
      - "server timeouts being ignored or retried, so sessions never complete"
      - "server-group or source-interface configuration not matching the server's expectation"
      - "reachability to the AAA server broken, or policed on the control plane"
    commands:
      - {cmd: "show tacacs", intent: aaa.tacacs.servers}
      - {cmd: "show tacacs counters", intent: aaa.tacacs.counters}
      - {cmd: "show tacacs details", intent: aaa.tacacs.detail}
      - {cmd: "show tacacs server-groups", intent: aaa.tacacs.groups}
      - {cmd: "show tacacs source-interface", intent: aaa.tacacs.source}
      - {cmd: "show aaa", intent: aaa.config.state}
      - {cmd: "show aaa trace", intent: aaa.trace}
      - {cmd: "show user", intent: aaa.current.user}
      - {cmd: "show processes tacacsd", intent: process.detail.tacacsd}
      - {cmd: "show logging", intent: logging.buffer}
    tac_first_look: >-
      show tacacs counters and show tacacs details against show logging — a server
      flapping UP/DOWN with TIMEOUT_IGNORED messages is a reachability/timeout problem,
      not a credential problem.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/security/command/reference/b-system-security-cr-asr9k/b-system-security-cr-71x-asr9k_chapter_01.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/200110-High-CPU-utilisation-by-alarm-logger-pro.html
