# Correlix TAC escalation pack — vendor research (Cisco IOS-XR)
# Design of record: docs/design/TAC_ESCALATION_2026-09-05.md
# Every command below appears verbatim on the cited public cisco.com page (or in the
# IOS-XR command reference for that feature). Read-only show/ping/traceroute/dir only:
# no debug, clear, reload, config, monitor or `run` shell commands.
# NOTE: ai/tac/README.md did not exist when this file was written; the schema used is
# the one given in the research brief.

vendor: cisco-iosxr

sources:
  - title: "Troubleshoot Quick Reference Command List for TAC Assistance (IOS XR)"
    url: https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
  - title: "Advanced System Command Reference for Cisco ASR 9000 Series Routers — Tech-Support Commands"
    url: https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/adv-sys/command/reference/b-advsys-cr-asr9000/b-advsys-cr-asr9000_chapter_010.html
  - title: "Transfer Show Tech-Support Files to XR VM on Routers Running eXR"
    url: https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/221131-transfer-show-tech-support-files-to-xr-v.html
  - title: "Troubleshoot Input Drops in Cisco IOS XR"
    url: https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/213967-troubleshoot-input-drops-in-ios-xr.html

tac_baseline:
  commands:
    - show version
    - show platform
    - show inventory
    - show install active summary
    - show install log
    - show hw-module fpd
    - show diag
    - show logging
    - show running
    - show configuration failed
    - show configuration commit changes all
    - show configuration history
    - show environment
    - show led
    - show alarms brief system active
    - show pfm location all
    - show processes
    - show processes cpu
    - show processes blocked location all
    - show watchdog memory-state
    - show context location all
    - show controllers np counters all
    - show drops
    - show redundancy
    - show redundancy summary
    - show reboot history
    - show snmp mib access
    - show snmp interface
    - show interfaces description
    - show ospf neighbor
    - show bgp sessions
    - show bgp summary
    - show rib update-groups
    - show tcp brief
    - show l2vpn xconnect
    - show mpls traffic-eng tunnels
    - show bfd session
  notes: >-
    215365 publishes a per-platform command list (ASR9K classic, ASR9K eXR, NCS/whitebox,
    CRS, Cisco 8xxx) that TAC asks for on essentially every case; the list above is the
    eXR/NCS common core. Platform deltas worth honouring: classic ASR9K/CRS use
    `admin show platform`, `admin show environment`, `admin show led` and
    `show hw-module fpd location all`; NCS adds `show asic-errors all detail location <loc>`;
    Cisco 8xxx adds `show reboot history`. `term length 0` heads the published list but is
    a terminal setting, not a diagnostic, and Correlix's runner sets pagination itself.
    show tech-support on IOS-XR writes a .tgz to the router's hard disk rather than
    streaming to the session, and the command reference repeats that it "can generate a
    very large amount of output" — always prefer a feature-scoped bundle
    (show tech-support routing ospf | routing isis | routing bfd | routing rpl |
    mpls ldp | mpls traffic-eng | l2vpn | platform | qos | ethernet | fabric | install |
    cef | rib | multicast | snmp) over the unscoped form. On eXR, the .tgz lands in the
    XR VM and 221131 covers moving it off-box.
  sources:
    - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
    - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/adv-sys/command/reference/b-advsys-cr-asr9000/b-advsys-cr-asr9000_chapter_010.html
    - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/221131-transfer-show-tech-support-files-to-xr-v.html

issues:
  - id: ospf-adjacency-stuck-exstart-mtu
    class: ospf-adjacency
    title: "OSPF adjacency stuck in EXSTART/EXCHANGE (IP MTU mismatch across the link)"
    symptoms:
      - "show ospf neighbor shows the peer permanently in EXSTART or EXCHANGE, never FULL"
      - "adjacency count on the interface stays 0 while hellos are exchanged"
      - "small pings succeed but large DBD/LSU packets are characterized as giants and dropped"
      - "the peer's prefixes never install in the RIB"
    log_signatures: []
    likely_causes:
      - "IP MTU mismatch — large database descriptor (DBD) packets characterized as giants and dropped"
      - "IOS vs IOS-XR mtu semantics: XR `mtu` INCLUDES the 14-byte L2 header, IOS excludes it, so XR 9026 equals IOS 9012"
      - "unexpected DBD sequence number"
      - "duplicate or mismatched router IDs"
      - "sub-interface inheriting a different MTU than the main interface"
    commands:
      - {cmd: "show ospf neighbor", intent: ospf.neighbor.list}
      - {cmd: "show ospf interface <if>", intent: ospf.interface.detail, params: [if]}
      - {cmd: "show ipv4 interface <if> | i MTU", intent: interface.ipv4.mtu, params: [if]}
      - {cmd: "show im database interface <if>", intent: interface.im.database, params: [if]}
      - {cmd: "show ospf", intent: ospf.process.summary}
      - {cmd: "show ospf database", intent: ospf.database.list}
      - {cmd: "ping 224.0.0.5", intent: ospf.multicast.reachability}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: >-
      Compare show ipv4 interface <if> | i MTU on both ends before anything else — on
      IOS-XR the configured mtu includes the L2 header, so an apparently identical number
      across an IOS/XR link is a real 14-byte mismatch.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/116350-trouble-ios-xr-mtu-00.html
      - https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13699-29.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_010.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html

  - id: ospf-adjacency-flap
    class: ospf-flapping-link
    title: "OSPF adjacency flapping (dead-timer expiry, link or CPU instability)"
    symptoms:
      - "neighbor cycles FULL to DOWN to INIT to FULL repeatedly"
      - "route churn and repeated SPF runs; traffic blackholes for seconds at a time"
      - "retransmission and flood lists non-empty during the flap window"
      - "interface error/drop counters climbing on the transit link"
    log_signatures: []
    likely_causes:
      - "dead timer expiration / lost hellos"
      - "physical-layer or one-way media failure on the link"
      - "high CPU starving protocol packet processing"
      - "a BFD session bouncing (detect timer expired / echo failure) and tearing the client protocol down"
      - "corrupted LSA exchange keeping the peer out of FULL"
    commands:
      - {cmd: "show ospf neighbor", intent: ospf.neighbor.list}
      - {cmd: "show ospf interface <if>", intent: ospf.interface.timers, params: [if]}
      - {cmd: "show ospf message-queue", intent: ospf.messagequeue.depth}
      - {cmd: "show ospf retransmission-list", intent: ospf.retransmit.list}
      - {cmd: "show ospf flood-list", intent: ospf.flood.list}
      - {cmd: "show bfd session", intent: bfd.session.list}
      - {cmd: "show controllers <if> all", intent: interface.controller.stats, params: [if]}
      - {cmd: "show processes cpu", intent: cpu.processes}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: >-
      Establish whether the flap is protocol-driven or link-driven by lining up show
      logging timestamps against show controllers <if> all error counters and show bfd
      session state.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13699-29.html
      - https://www.cisco.com/c/en/us/support/docs/ip/ip-routing/220364-troubleshoot-bidirectional-forwarding-de.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_010.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html

  - id: ospf-route-missing-lsa
    class: ospf-database
    title: "OSPF prefix missing from RIB/FIB despite a FULL adjacency (LSA / area type / redistribution)"
    symptoms:
      - "neighbor is FULL but the prefix is absent from show route ipv4 <prefix>"
      - "prefix present in show ospf database but not in show ospf routes"
      - "prefix in the RIB but not programmed in show cef ipv4 <prefix> detail"
      - "ABR/ASBR not listed in show ospf border-routers"
    log_signatures: []
    likely_causes:
      - "parameter mismatch — area id, stub/area-type flag, subnet mask"
      - "ABR not present, so the inter-area summary LSA is never generated"
      - "virtual link to area 0 down"
      - "redistribution or outbound route-policy filtering the prefix"
      - "prefix installed by a lower-administrative-distance protocol so the OSPF copy loses"
    commands:
      - {cmd: "show ospf routes", intent: ospf.route.table}
      - {cmd: "show ospf database", intent: ospf.database.lsa}
      - {cmd: "show ospf border-routers", intent: ospf.abr.list}
      - {cmd: "show ospf summary-prefix", intent: ospf.summary.prefix}
      - {cmd: "show ospf virtual-links", intent: ospf.virtuallink.state}
      - {cmd: "show route ipv4 <prefix>", intent: rib.route.lookup, params: [prefix]}
      - {cmd: "show cef ipv4 <prefix> detail", intent: fib.cef.lookup, params: [prefix]}
      - {cmd: "show rpl active route-policy", intent: rpl.policy.active}
    tac_first_look: >-
      Walk database then OSPF route table then RIB then FIB in that order; the first hop
      where the prefix disappears names the layer at fault.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_010.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_0100.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_0101.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/ip-addresses/b-ip-addresses-cr-ncs5500/cef-commands.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/15986-admin-distance.html

  - id: ospfv3-adjacency-not-forming
    class: ospf-adjacency
    title: "OSPFv3 (IPv6) adjacency not forming or stuck"
    symptoms:
      - "show ospfv3 neighbor empty, or the peer stuck below FULL while OSPFv2 on the same link is FULL"
      - "interface listed in show ospfv3 interface with 0 adjacencies"
      - "IPv6 MTU differs from the IPv4 MTU on the same interface"
      - "no IPv6 link-local next hops installed"
    log_signatures: []
    likely_causes:
      - "IPv6 MTU mismatch — XR keeps `ipv6 mtu` independent of the L2-inclusive `mtu` value"
      - "missing or duplicate 32-bit router ID for the OSPFv3 process"
      - "instance-id, area-id or hello/dead timer mismatch"
      - "interface not enabled for OSPFv3, or configured passive"
      - "IPv6 link-local address missing on the segment"
    commands:
      - {cmd: "show ospfv3 neighbor", intent: ospfv3.neighbor.list}
      - {cmd: "show ospfv3 neighbor <if> detail", intent: ospfv3.neighbor.detail, params: [if]}
      - {cmd: "show ospfv3 interface <if>", intent: ospfv3.interface.detail, params: [if]}
      - {cmd: "show ospfv3", intent: ospfv3.process.summary}
      - {cmd: "show ipv6 interface <if> | i MTU", intent: interface.ipv6.mtu, params: [if]}
      - {cmd: "show ospfv3 database", intent: ospfv3.database.lsa}
      - {cmd: "show ospfv3 message-queue", intent: ospfv3.messagequeue.depth}
      - {cmd: "show ospfv3 routes", intent: ospfv3.route.table}
    tac_first_look: >-
      Confirm a valid 32-bit router ID and matching ipv6 mtu on both ends — OSPFv3 fails
      for IPv6-specific reasons even when the parallel OSPFv2 adjacency is healthy.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_011.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/116350-trouble-ios-xr-mtu-00.html
      - https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13699-29.html

  - id: isis-adjacency-not-forming
    class: isis-adjacency
    title: "IS-IS adjacency not forming (MTU / hello padding / circuit-type / level mismatch)"
    symptoms:
      - "show isis adjacency empty, or the neighbor sits in INIT and never reaches UP"
      - "adjacency comes up for one level only (L1 up, L2 absent, or the reverse)"
      - "interface counters show IIH transmit but no receive"
      - "adjacency drops with hold time expired and reforms in a loop"
    log_signatures: []
    likely_causes:
      - "MTU mismatch — padded IS-IS hellos dropped as giants by the device with the lower MTU"
      - "circuit-type mismatch: incompatible L1 / L2 / L1L2 configuration"
      - "an intermediate device that does not allow the hello packets through"
      - "unreliable transport / packet loss causing inconsistent hello delivery"
      - "router isis configuration mismatch between peers — area/NET address, authentication"
    commands:
      - {cmd: "show isis adjacency", intent: isis.adjacency.list}
      - {cmd: "show isis adjacency <if> detail", intent: isis.adjacency.detail, params: [if]}
      - {cmd: "show isis interface <if> detail", intent: isis.interface.detail, params: [if]}
      - {cmd: "show isis protocol", intent: isis.process.summary}
      - {cmd: "show isis neighbors", intent: isis.neighbor.list}
      - {cmd: "show isis adjacency-log", intent: isis.adjacency.log}
      - {cmd: "show isis statistics", intent: isis.protocol.counters}
      - {cmd: "show ipv4 interface <if> | i MTU", intent: interface.ipv4.mtu, params: [if]}
      - {cmd: "show im database interface <if>", intent: interface.im.database, params: [if]}
    tac_first_look: >-
      show isis adjacency <if> detail plus an MTU comparison on both ends — padded IIHs
      make IS-IS the first protocol to expose an MTU mismatch that OSPF might survive.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/integrated-intermediate-system-to-intermediate-system-is-is/220649-troubleshoot-is-is-adjacency-issues.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/116350-trouble-ios-xr-mtu-00.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/711x/routing/configuration/guide/b-routing-cg-asr9000-711x/implementing-is-is.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_01.html

  - id: isis-lsp-overload-or-route-missing
    class: isis-lsp
    title: "IS-IS route missing — LSP not received/refreshed, or the overload bit is set"
    symptoms:
      - "adjacency is UP but the remote prefix is absent from show isis route / show route ipv4 <prefix>"
      - "router used only as a leaf, never as transit — traffic detours around it"
      - "LSP for the originating system missing or aged out of show isis database"
      - "repeated SPF runs in show isis spf-log after each LSP change"
    log_signatures: []
    likely_causes:
      - "overload bit set — signals the router is not available for transit traffic (startup, serious errors, maintenance)"
      - "LSP not refreshed or aged out — routers refresh LSPs every 15 minutes and retain them for 20 minutes"
      - "corrupted LSP lifetime triggering error messages"
      - "level mismatch: prefix originated at L1 only with no L1L2 router leaking it to L2"
      - "prefix present in IS-IS but beaten in the RIB by a lower administrative distance"
    commands:
      - {cmd: "show isis database", intent: isis.lsdb.list}
      - {cmd: "show isis database-log", intent: isis.lsdb.log}
      - {cmd: "show isis route", intent: isis.route.table}
      - {cmd: "show isis topology", intent: isis.topology.list}
      - {cmd: "show isis spf-log", intent: isis.spf.log}
      - {cmd: "show isis lsp-log", intent: isis.lsp.log}
      - {cmd: "show isis hostname", intent: isis.hostname.map}
      - {cmd: "show route ipv4 <prefix>", intent: rib.route.lookup, params: [prefix]}
      - {cmd: "show cef ipv4 <prefix> detail", intent: fib.cef.lookup, params: [prefix]}
    tac_first_look: >-
      Check the originating system's LSP in show isis database for presence, age and the
      overload bit before chasing SPF or the RIB.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/711x/routing/configuration/guide/b-routing-cg-asr9000-711x/implementing-is-is.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_01.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/routing/b-ncs5500-routing-cli-reference/b-ncs5500-routing-cli-reference_chapter_0100.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/ip-addresses/b-ip-addresses-cr-ncs5500/cef-commands.html

  - id: bgp-peer-stuck-idle-active
    class: bgp-session
    title: "BGP peer stuck in Idle or Active (no TCP session)"
    symptoms:
      - "show bgp summary shows the neighbor in Idle or Active, never Established"
      - "no TCP 179 socket to the peer in show tcp brief"
      - "peer address unreachable, or reachable only via a path other than the update source"
      - "session never advances even after the connect-retry timer"
    log_signatures: []
    likely_causes:
      - "no connectivity: absent connected route to the peer, or a Layer-1 issue (interface, SFP, cable)"
      - "firewall or access list blocking TCP 179"
      - "wrong peer IP address or wrong remote AS"
      - "duplicate router ID"
      - "missing or incorrect BGP update source, or TTL/multihop misconfiguration for eBGP"
      - "MD5 authentication mismatch"
    commands:
      - {cmd: "show bgp summary", intent: bgp.summary}
      - {cmd: "show bgp sessions", intent: bgp.session.list}
      - {cmd: "show bgp neighbors <peer>", intent: bgp.neighbor.detail, params: [peer]}
      - {cmd: "show tcp brief", intent: tcp.socket.list}
      - {cmd: "show route ipv4 <prefix>", intent: rib.route.lookup.peer, params: [prefix]}
      - {cmd: "ping <peer>", intent: reachability.ping, params: [peer]}
      - {cmd: "traceroute <peer>", intent: reachability.traceroute, params: [peer]}
      - {cmd: "show bgp process", intent: bgp.process.state}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: >-
      Prove L3 reachability to the peer from the correct update source first, then check
      for a TCP 179 socket in show tcp brief; without the socket the problem is below BGP.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/218027-troubleshoot-border-gateway-protocol-bas.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/711x/routing/configuration/guide/b-routing-cg-asr9000-711x/implementing-bgp.html
      - https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/bgp/b-ncs5500-bgp-cli-reference/b-ncs5500-bgp-cli-reference_chapter_01.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-software-releases-121-mainline/12778-ping-traceroute.html

  - id: bgp-session-flap-hold-timer
    class: bgp-instability
    title: "BGP session flapping — hold timer expired"
    symptoms:
      - "neighbor repeatedly leaves and re-enters Established; prefix count resets each cycle"
      - "a hold timer expired notification logged against the peer"
      - "large-scale route churn / convergence storms downstream of the flap"
      - "flap correlates with interface errors or a CPU spike"
    log_signatures: []
    likely_causes:
      - "interface flaps or physical problems on the path"
      - "hold timer expiration caused by packet loss, high CPU or MTU mismatch"
      - "AFI/SAFI capability mismatch causing repeated resets"
      - "TCP or MD5 authentication problems"
      - "a BFD client session bouncing and resetting the BGP neighbor"
    commands:
      - {cmd: "show bgp summary", intent: bgp.summary}
      - {cmd: "show bgp neighbors <peer>", intent: bgp.neighbor.detail, params: [peer]}
      - {cmd: "show bgp sessions", intent: bgp.session.list}
      - {cmd: "show tcp brief", intent: tcp.socket.list}
      - {cmd: "show bfd session", intent: bfd.session.list}
      - {cmd: "show processes cpu", intent: cpu.processes}
      - {cmd: "show im database interface <if>", intent: interface.im.database, params: [if]}
      - {cmd: "show controllers np counters all", intent: np.drop.counters}
      - {cmd: "show logging", intent: logging.recent}
    tac_first_look: >-
      Read the last notification and reset reason out of show bgp neighbors <peer>, then
      decide between path loss (interface / NP drops) and local overload (CPU, memory).
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/218027-troubleshoot-border-gateway-protocol-bas.html
      - https://www.cisco.com/c/en/us/support/docs/ip/ip-routing/220364-troubleshoot-bidirectional-forwarding-de.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/215365-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/116350-trouble-ios-xr-mtu-00.html

  - id: bgp-route-not-advertised-rpl
    class: bgp-route-missing
    title: "BGP route not advertised to a peer (outbound RPL policy, best-path or missing component route)"
    symptoms:
      - "prefix is in the local BGP table but the peer never receives it"
      - "prefix absent from the advertised set for that neighbor"
      - "the local BGP entry is not marked best"
      - "an aggregate is configured but no aggregate is sent"
    log_signatures: []
    likely_causes:
      - "missing component route — an exact route in the routing table is required for a network statement with a mask"
      - "aggregation with no more-specific route present in the BGP table"
      - "BGP synchronization: iBGP-learned routes not advertised to eBGP peers without IGP validation"
      - "route not selected as best path — only best paths received from BGP peers are propagated"
      - "outbound route-policy on the neighbor address-family dropping the prefix"
      - "auto-summary enabled without a matching classful/component route"
    commands:
      - {cmd: "show bgp ipv4 unicast <prefix>", intent: bgp.prefix.entry, params: [prefix]}
      - {cmd: "show bgp advertised", intent: bgp.advertised.set}
      - {cmd: "show bgp neighbors <peer>", intent: bgp.neighbor.detail, params: [peer]}
      - {cmd: "show bgp policy", intent: bgp.policy.effect}
      - {cmd: "show rpl route-policy <name>", intent: rpl.policy.definition, params: [name]}
      - {cmd: "show rpl route-policy attachpoints", intent: rpl.policy.attachpoints}
      - {cmd: "show bgp update-group", intent: bgp.updategroup.membership}
      - {cmd: "show route ipv4 <prefix>", intent: rib.route.lookup, params: [prefix]}
      - {cmd: "show bgp process", intent: bgp.process.state}
    tac_first_look: >-
      Confirm the prefix is BEST locally before blaming policy — a non-best path is never
      propagated regardless of the outbound route-policy.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/19345-bgp-noad.html
