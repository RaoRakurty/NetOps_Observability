  - id: interface-crc-input-errors
    class: interface-errors
    title: "Interface CRC / input errors on NX-OS (including stomped-CRC pass-through)"
    symptoms:
      - "CRC and FCS counters incrementing on an interface"
      - "non-zero error counters in show interface counters errors non-zero"
      - "multiple downstream interfaces show CRCs because they are forwarding stomped frames rather than sourcing them"
      - "internal fabric / iEth link CRCs on a modular chassis"
    log_signatures:
      - "%DEVICE_TEST-SLOT22-3-INTERNAL_PORT_MONITOR_CRC_ERRORS_DETECTED"
    likely_causes:
      - "failing or damaged physical medium (copper or fiber) or direct-attach cables"
      - "failing or damaged transceivers/optics"
      - "failing or damaged patch-panel ports"
      - "faulty network device hardware — ports, line cards, ASICs, MACs, fabric modules"
      - "malfunctioning network interface cards in hosts"
      - "MTU configuration mismatches between devices"
    commands:
      - {cmd: "show interface", intent: interface.detail}
      - {cmd: "show interface counters errors", intent: interface.errors}
      - {cmd: "show interface counters errors non-zero", intent: interface.errors.nonzero}
      - {cmd: "show interface hardware-mappings", intent: interface.asic.mapping}
      - {cmd: "show interface counters errors module <slot> non-zero", intent: interface.errors.module, params: [slot]}
      - {cmd: "show hardware internal errors module <slot>", intent: asic.internal.errors, params: [slot]}
      - {cmd: "show system internal fabric connectivity stats module <slot>", intent: fabric.link.crc, params: [slot]}
      - {cmd: "show interface <if> transceiver details", intent: optics.dom.readings, params: [if]}
      - {cmd: "show cdp neighbors", intent: neighbor.discovery}
    tac_first_look: >-
      Separate "RX Frm with FCS Err" (this link is the source) from "RX Frm CRC
      Err(Stomp)" (this link is only forwarding someone else's corruption) before
      replacing any hardware.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217554-understand-cyclic-redundancy-check-crc.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/216239-nexus-9000-cloud-scale-asic-crc-identifi.html
