# Correlix TAC escalation pack — vendor research (Cisco NX-OS, Nexus 9000/7000/5000)
# Design of record: docs/design/TAC_ESCALATION_2026-09-05.md
# Every command below appears verbatim on the cited public cisco.com page (or in the
# Nexus 9000 NX-OS command reference). Read-only show/ping/traceroute/dir only: no
# debug, clear, reload, config, ethanalyzer or attach-module commands.
# NOTE: ai/tac/README.md did not exist when this file was written; the schema used is
# the one given in the research brief.

vendor: cisco-nxos

sources:
  - title: "Quick Reference Guide to collect TAC requested outputs from Nexus switches"
    url: https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html
