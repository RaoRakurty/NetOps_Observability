  - id: process-crash-and-unexpected-reload
    class: crash-reload
    proposed_class: true
    title: "NX-OS process crash / core file, or an unexpected switch or module reload"
    symptoms:
      - "a core file listed by show cores"
      - "a feature stops working while the box stays up; process restart count increasing"
      - "show system uptime shows a recent restart nobody scheduled"
      - "a reset-history entry present for a module"
    log_signatures:
      - "%SYSMGR-2-SERVICE_CRASHED"
      - "%SYSMGR-3-SERVICE_TERMINATED"
      - "%SYSMGR-3-SERVICE_BACKTRACE"
      - "%SYSMGR-2-HAP_FAILURE_SUP_RESET"
      - "%SYSMGR-3-COREDUMP_TIMEOUT"
      - "%PLATFORM-2-PFM_SYSTEM_RESET"
      - "%PLATFORM-2-PFM_SYSTEM_SHUTDOWN_TRIGGER"
      - "%PLATFORM-2-MOD_TEMPSHUTDOWN"
      - "%PLATFORM-2-PFM_MODULE_RESET"
      - "%SYSMGR-2-STANDBY_BOOT_FAILED"
    likely_causes:
      - "critical process failure (non-restartable)"
      - "process restart threshold exceeded"
      - "HA-policy (hap) failure for the service"
      - "memory exhaustion for the service"
      - "corrupted bootflash file system, corrupted BIOS, or a corrupted NX-OS image"
      - "incorrect boot parameters, or a clock module failure"
    commands:
      - {cmd: "show cores", intent: cores.list}
      - {cmd: "show system cores", intent: cores.config}
      - {cmd: "show processes log", intent: process.log}
      - {cmd: "show processes log details", intent: process.log.details}
      - {cmd: "show process log pid <pid>", intent: process.log.pid, params: [pid]}
      - {cmd: "show system reset-reason", intent: system.resetreason}
      - {cmd: "show system reset-reason module <slot>", intent: system.resetreason.module, params: [slot]}
      - {cmd: "show system uptime", intent: system.uptime}
      - {cmd: "show log nvram", intent: logging.nvram}
      - {cmd: "show module internal exceptionlog", intent: module.exceptionlog}
      - {cmd: "show logging onboard error-stats", intent: obfl.errorstats}
    tac_first_look: >-
      show system reset-reason plus show log nvram survive the reload and say whether it
      was operator-initiated, thermal, or a process HA failure; for a live crash,
      show cores then show process log pid <pid> names the service and signal.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_011.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/m_troubleshooting_service_failures_9x.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: hardware-environment-alarm-and-module-diagnostics
    class: hardware-fault
    title: "Fan / power-supply / temperature alarm, or a module failing GOLD diagnostics"
    symptoms:
      - "PSU or fan reported failed/absent in show environment"
      - "a temperature sensor over the major or minor threshold"
      - "a module reported failed, or a diagnostic test showing a Fail result"
    log_signatures:
      - "%PLATFORM-2-PS_FAIL"
      - "%PLATFORM-2-PS_ABSENT"
      - "%PLATFORM-2-PS_FANFAIL"
      - "%PLATFORM-1-FAN_FAIL"
      - "%PLATFORM-2-FANMOD_FAN_FAIL"
      - "%PLATFORM-2-MOD_TEMPMAJALRM"
      - "%PLATFORM-2-MOD_TEMPMINALRM"
      - "%MODULE-2-MOD_DIAG_FAIL"
      - "%MODULE-2-MOD_FAIL"
      - "%DIAGCLIENT-2-DIAG_HM_FAIL"
      - "%DIAGCLIENT-2-PER_PORT_TEST_FAIL"
    likely_causes:
      - "a failed or removed fan module leading to overheating and temperature alarms"
      - "power supply failed or shut down; missing power input; single-input operation"
      - "module runtime diagnostic failure, after which module manager power-cycles the module"
      - "line card not firmly seated — ensure it is firmly in the slot and reseat if necessary"
      - "per-port BootupPortLoopback failure putting the port into the error-disabled state"
      - "ACT2 / ASICRegisterCheck failures escalating after repeated consecutive failures"
    commands:
      - {cmd: "show environment", intent: env.all}
      - {cmd: "show environment power detail", intent: env.power.detail}
      - {cmd: "show environment fan detail", intent: env.fan.detail}
      - {cmd: "show environment temperature module <slot>", intent: env.temperature.module, params: [slot]}
      - {cmd: "show module", intent: module.status}
      - {cmd: "show diagnostic result mod all", intent: diag.result.all}
      - {cmd: "show diagnostic result module <slot> test all detail", intent: diag.result.detail, params: [slot]}
      - {cmd: "show diagnostic status module <slot>", intent: diag.status, params: [slot]}
      - {cmd: "show diagnostic events error", intent: diag.events.error}
      - {cmd: "show hardware capacity power", intent: hw.capacity.power}
      - {cmd: "show inventory", intent: hw.inventory}
      - {cmd: "show sprom", intent: hw.sprom}
    tac_first_look: >-
      Run show environment and show diagnostic result mod all together — the syslog's own
      recommended action for %PLATFORM-2-PS_FAIL and %PLATFORM-2-MOD_TEMPMAJALRM is
      exactly the show environment output.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_0101.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/config-guides/sys-mgmt/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-release-106x/m-configuring-online-diagnostics.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: acl-tcam-exhaustion
    class: acl-drops
    proposed_class: true
    title: "ACL / TCAM region exhaustion — ACL update fails or entries are not programmed"
    symptoms:
      - "an ACL update fails with an error after a configuration change"
      - "TCAM almost full warnings for an ACL region"
      - "ACL statistics not collected because the stats region is full"
      - "traffic permitted or denied contrary to the configured ACL"
    log_signatures:
      - "%ACLQOS-SLOT#-2-ACLQOS_TCAM_CARVING_FAILURE"
      - "%ACLQOS-SLOT#-4-ACLQOS_3K_OVER_THRESHOLD"
      - "%ACLQOS-SLOT#-0-ACLQOS_ACL_STATS_FULL"
      - "%IPFIB-SLOT#-2-IPFIB_IP_FIRST_HOP_TCAM_SIZE_FULL"
      - "%NPACL-2-IPT_WARNING"
    likely_causes:
      - "when atomic updates are enabled and sufficient TCAM resources are unavailable, the device generates an error and the ACL update fails"
      - "TCAM carving does not leave enough space in the region the feature needs"
      - "too many ACEs for the carved region size"
      - "several features competing for the same TCAM region"
    commands:
      - {cmd: "show hardware access-list resource utilization", intent: acl.tcam.utilization}
      - {cmd: "show hardware access-list tcam region", intent: acl.tcam.regions}
      - {cmd: "show system internal access-list resource utilization", intent: acl.tcam.internal}
      - {cmd: "show hardware access-list resource pooling", intent: acl.tcam.pooling}
      - {cmd: "show hardware capacity forwarding", intent: hw.capacity.forwarding}
      - {cmd: "show running-config aclmgr", intent: acl.config}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Read the carved region sizes and current utilisation together — the region that is
      full, not the ACL itself, is what has to change, and re-carving requires a reload.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/security/cisco-nexus-9000-series-nx-os-security-configuration-guide-release-106x/m-configuring-ip-acls.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: ntp-not-synchronised
    class: ntp-sync
    proposed_class: true
    title: "NTP not synchronised on NX-OS"
    symptoms:
      - "peer status never reaches a synchronised/candidate state"
      - "clock drifting between switches, making log correlation unreliable"
      - "NTP statistics show no valid responses from the server"
    log_signatures:
      - "%NTP-2-NTP_SYSLOG_CRIT_ERR"
      - "%NTP-3-NTP_SYSLOG_ERR"
      - "%NTP-6-NTP_SYSLOG_WARN"
    likely_causes:
      - "authentication key mismatch between client and server"
      - "VRF reachability — the NTP server and peers must be able to reach each other through the configured VRFs"
      - "Cisco Nexus 9000 switches do not sync with stratum 14 and 15"
      - "the source interface or source address not matching what the server expects"
      - "an access group blocking the association"
    commands:
      - {cmd: "show ntp peer-status", intent: ntp.peer.status}
      - {cmd: "show ntp peers", intent: ntp.peers}
      - {cmd: "show ntp statistics peer ipaddr <peer>", intent: ntp.peer.statistics, params: [peer]}
      - {cmd: "show ntp authentication-status", intent: ntp.auth.status}
      - {cmd: "show ntp trusted-keys", intent: ntp.trusted.keys}
      - {cmd: "show ntp source", intent: ntp.source}
      - {cmd: "show ntp source-interface", intent: ntp.source.interface}
      - {cmd: "show ntp access-groups", intent: ntp.access.groups}
      - {cmd: "show ntp logging-status", intent: ntp.logging.status}
      - {cmd: "show running-config ntp", intent: ntp.config}
      - {cmd: "show clock", intent: system.clock}
    tac_first_look: >-
      Check show ntp peer-status for the selected source, then prove the server is
      reachable in the configured VRF and that the stratum is one the switch will accept.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/config-guides/sys-mgmt/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-release-106x/m-configuring-ntp-10x.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01101.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: snmp-polling-problems
    class: snmp-agent
    proposed_class: true
    title: "SNMP polling failures, timeouts, or SNMP-driven CPU load on NX-OS"
    symptoms:
      - "the NMS times out polling specific OIDs while the switch is otherwise reachable"
      - "CPU spikes correlated with the polling interval"
      - "traps not arriving at the configured host"
      - "ifIndex values not matching the NMS's cached map"
    log_signatures:
      - "%SNMPD-3-ERROR"
      - "%SNMPD-4-WARNING"
    likely_causes:
      - "window timeouts when parsing the MIB tree at specific OIDs"
      - "continuous polling for a troublesome OID triggering alerts that are neither necessary nor impactful"
      - "NX-OS has no SNMP views feature, so OID exclusion has to be done with RBAC roles"
      - "trap host, community/user, or source interface not configured as the NMS expects"
      - "SNMP punt path policed by CoPP"
    commands:
      - {cmd: "show snmp", intent: snmp.status}
      - {cmd: "show snmp community", intent: snmp.communities}
      - {cmd: "show snmp user", intent: snmp.users}
      - {cmd: "show snmp group", intent: snmp.groups}
      - {cmd: "show snmp host", intent: snmp.receivers}
      - {cmd: "show snmp session", intent: snmp.sessions}
      - {cmd: "show snmp trap", intent: snmp.traps}
      - {cmd: "show snmp source-interface", intent: snmp.source.interface}
      - {cmd: "show interface snmp-ifindex", intent: interface.ifindex.map}
      - {cmd: "show running-config snmp all", intent: snmp.config}
      - {cmd: "show processes cpu history", intent: cpu.history}
    tac_first_look: >-
      Correlate the CPU spike with the polling interval, then narrow to the OID subtree —
      on NX-OS the remedy is an RBAC role that denies the OID, not an SNMP view.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/221754-exclude-oid-in-nexus-5k-7k-and-9k-in-snm.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/config-guides/sys-mgmt/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-release-106x/m-simple_network_management_protocol.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010010.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: aaa-tacacs-failure
    class: aaa-auth
    proposed_class: true
    title: "AAA / TACACS+ authentication or authorization failures on NX-OS"
    symptoms:
      - "logins fail, or hang, while local accounts still work"
      - "TACACS server marked dead then alive repeatedly"
      - "authorization succeeds for some roles and not others"
    log_signatures:
      - "%TACACS-5-TACACS_SERVER_STATUS"
    likely_causes:
      - "an unresponsive server delaying AAA requests"
      - "wrong shared key between switch and server"
      - "dead-time or timeout values too aggressive for the path"
      - "VRF reachability to the AAA server broken"
      - "TLS peer-certificate validation failure where TLS is in use"
    commands:
      - {cmd: "show tacacs-server", intent: aaa.tacacs.servers}
      - {cmd: "show tacacs-server groups", intent: aaa.tacacs.groups}
      - {cmd: "show tacacs-server statistics <host>", intent: aaa.tacacs.statistics, params: [host]}
      - {cmd: "show tacacs-server directed-request", intent: aaa.tacacs.directed}
      - {cmd: "show tacacs+ status", intent: aaa.tacacs.status}
      - {cmd: "show aaa authentication", intent: aaa.authentication}
      - {cmd: "show aaa authorization all", intent: aaa.authorization}
      - {cmd: "show aaa accounting", intent: aaa.accounting}
      - {cmd: "show running-config tacacs all", intent: aaa.config}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Read %TACACS-5-TACACS_SERVER_STATUS for the dead/alive transitions and the total
      dead time, then check reachability in the AAA VRF before suspecting credentials.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/security/cisco-nexus-9000-series-nx-os-security-configuration-guide-release-106x/m-configuring-tacacs.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: dhcp-relay-failure
    class: dhcp-relay
    proposed_class: true
    title: "DHCP relay failure on NX-OS — clients get no address"
    symptoms:
      - "clients on a relayed SVI never obtain an address"
      - "DISCOVER seen on the switch but nothing relayed toward the server"
      - "an interface error-disabled for excessive ingress DHCP packet rate"
      - "DHCP works on some VLANs and not others"
    log_signatures:
      - "%DHCP_SNOOP-3-DHCPRATELIMIT"
    likely_causes:
      - "the DHCP relay agent not enabled"
      - "a helper address required for smart relay but not configured"
      - "VRF deployments requiring Option 82"
      - "DHCP subnet broadcast is not supported"
      - "DHCP snooping trust boundary wrong, so relayed packets are dropped"
      - "no unicast connectivity from the client VLAN to the DHCP server"
    commands:
      - {cmd: "show ip dhcp relay", intent: dhcp.relay.state}
      - {cmd: "show ip dhcp relay address", intent: dhcp.relay.addresses}
      - {cmd: "show ip dhcp relay interface <if>", intent: dhcp.relay.interface, params: [if]}
      - {cmd: "show ip dhcp relay information trusted-sources", intent: dhcp.relay.trusted}
      - {cmd: "show ip dhcp snooping", intent: dhcp.snooping.state}
      - {cmd: "show ip dhcp snooping binding", intent: dhcp.snooping.bindings}
      - {cmd: "show ip dhcp option82 info interface <if>", intent: dhcp.option82, params: [if]}
      - {cmd: "show ip dhcp global statistics", intent: dhcp.global.statistics}
      - {cmd: "show running-config dhcp", intent: dhcp.config}
    tac_first_look: >-
      Confirm the relay agent is enabled and the helper address is present on the client
      SVI, then check the snooping trust boundary — a trusted-source mismatch silently
      drops the relayed packet.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/security/cisco-nexus-9000-series-nx-os-security-configuration-guide-release-106x/m-configuring-dhcp.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: licensing-failure
    class: licensing
    proposed_class: true
    title: "Licensing failure on Nexus — smart licensing communication or a missing/invalid license"
    symptoms:
      - "a feature license listed as missing after an RMA or supervisor replacement"
      - "smart licensing reports a communication failure or a TLS certificate that cannot be validated"
      - "could not resolve host, or fail to send out Call Home HTTP message"
      - "an invalid license host-id reported for a feature"
    log_signatures:
      - "%LICMGR-3-LOG_LIC_INVALID_HOSTID"
      - "%LICMGR-3-LOG_LIC_SERVER_DOWN"
      - "%LICMGR-2-LOG_LIC_NO_LIC"
      - "%LICMGR-0-LOG_LIC_GRACE_EXPIRED"
    likely_causes:
      - "a license meant for another chassis installed on this one (invalid license hostid)"
      - "incorrect FQDN configured with license smart url, or SSL inspection replacing the Cisco CA certificate"
      - "DNS not configured in the VRF used for smart licensing, so the host cannot be resolved"
      - "a firewall blocking outbound HTTPS, or HTTP used instead of HTTPS"
      - "chassis RMA or supervisor replacement changing the serial the license is bound to"
      - "corrupted bootflash losing the license file"
    commands:
      - {cmd: "show license", intent: license.installed}
      - {cmd: "show license host-id", intent: license.hostid}
      - {cmd: "show license usage", intent: license.usage}
      - {cmd: "show license usage <package>", intent: license.usage.package, params: [package]}
      - {cmd: "ping smartreceiver.cisco.com vrf management", intent: license.cssm.reachability}
      - {cmd: "show running-config | include license", intent: license.config}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Compare show license host-id against the serial the license was issued for; if they
      match, the problem is transport (DNS, proxy, TLS interception) rather than
      entitlement.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0100.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/222725-troubleshoot-licensing-failures-on-nexus.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: configuration-change-audit
    class: config-change
    title: "Unintended configuration change on NX-OS — who changed what, and when"
    symptoms:
      - "behaviour changed with no recorded change ticket"
      - "the running configuration differs from the last known-good copy"
      - "configuration-change notifications in the log around the incident window"
      - "the change was never saved, so a reload silently reverted it"
    log_signatures:
      - "%VSHD-5-VSHD_SYSLOG_CONFIG_CHANGE"
      - "%VSHD-5-VSHD_SYSLOG_CONFIG_I"
      - "%SYSMGR-5-CFGWRITE_DONE"
      - "%SYSMGR-5-CFGWRITE_STARTED"
    likely_causes:
      - "an unrecorded interactive change by an operator or automation"
      - "a change applied but never copied to startup, so a reload reverted it"
      - "a rollback or config-replace applied without a matching change record"
      - "a switch profile or configuration session committing on both vPC peers"
    commands:
      - {cmd: "show accounting log", intent: audit.accounting}
      - {cmd: "show accounting log start-time <time>", intent: audit.accounting.window, params: [time]}
      - {cmd: "show running-config diff", intent: config.running.diff}
      - {cmd: "show rollback log exec", intent: config.rollback.log}
      - {cmd: "show rollback status", intent: config.rollback.status}
      - {cmd: "show user-account", intent: audit.users}
      - {cmd: "show system uptime", intent: system.uptime}
      - {cmd: "show logging logfile", intent: logging.recent}
      - {cmd: "show run", intent: config.running}
    tac_first_look: >-
      Bound the change window with show accounting log around the incident time, then
      show running-config diff to see whether the running and startup configurations have
      already diverged.
