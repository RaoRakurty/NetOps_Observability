  - id: stp-bridge-assurance-inconsistent-port
    class: stp-topology
    proposed_class: true
    title: "STP bridge assurance / guard-inconsistent port blocking traffic"
    symptoms:
      - "vPC in blocking state because bridge assurance detects BPDU disputes on a single port-channel link"
      - "a network-type port enters the blocking state after failing to receive BPDUs for the required period"
      - "ports listed as inconsistent or blocked"
      - "recovery takes about 2 s on regular links but about 84 s on vPC peer-links"
    log_signatures: []
    likely_causes:
      - "bridge assurance (default-on for network ports) stops receiving BPDUs on an operational network port"
      - "a bridge assurance BPDU dispute on a single-link vPC port-channel"
      - "loop guard placing a root/alternate port into blocking when BPDU reception ceases"
      - "root guard blocking a port on receipt of a superior BPDU"
      - "BPDU guard shutting down an interface that receives BPDUs, requiring manual intervention"
      - "STP port type / bridge assurance / loopguard mismatch across a vPC (Type-1 parameters)"
    commands:
      - {cmd: "show spanning-tree summary", intent: stp.extensions.summary}
      - {cmd: "show spanning-tree inconsistentports", intent: stp.inconsistent.ports}
      - {cmd: "show spanning-tree blockedports", intent: stp.blocked.ports}
      - {cmd: "show running-config spanning-tree all", intent: stp.config.all}
      - {cmd: "show spanning-tree interface <if> detail", intent: stp.port.detail, params: [if]}
      - {cmd: "show spanning-tree mst <instance> interface <if> detail", intent: stp.mst.port.detail, params: [instance, if]}
      - {cmd: "show interface status err-disabled", intent: interface.errdisabled}
      - {cmd: "show vpc", intent: vpc.status.summary}
    tac_first_look: >-
      show spanning-tree inconsistentports names the guard that fired; from there the only
      question is whether BPDUs stopped arriving (bridge assurance / loop guard) or a
      superior BPDU arrived (root guard).
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_01011.html
