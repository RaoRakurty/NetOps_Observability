      - {cmd: "show vlan summary", intent: vlan.summary}
      - {cmd: "show running-config vlan <vlan>", intent: vlan.config, params: [vlan]}
      - {cmd: "show interface status err-vlans", intent: interface.errvlans}
      - {cmd: "show spanning-tree vlan <vlan>", intent: stp.vlan.state, params: [vlan]}
    tac_first_look: >-
      show interface trunk on both ends side by side — the allowed / active / forwarding
      columns split the three distinct failures (not allowed, not created, STP-pruned).
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_0101.html
