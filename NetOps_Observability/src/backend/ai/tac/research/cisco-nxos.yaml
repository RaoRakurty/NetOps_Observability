      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/221572-troubleshoot-link-flap-issue-on-nexus-90.html

  - id: interface-output-discards-and-qos-drops
    class: qos-drops
    title: "Interface output discards / ASIC buffer exhaustion and QoS queue drops"
    symptoms:
      - "Output Discards counter incrementing on an egress interface"
      - "buffer-threshold syslog fired when ASIC slice buffers reached 90 percent utilization"
      - "sustained egress oversubscription with no interface errors"
      - "Dropped Pkts / Dropped Byts rising for a specific QoS group"
    log_signatures:
      - "%TAHUSD-SLOTX-4-BUFFER_THRESHOLD_EXCEEDED"
      - "%ACLQOS-SLOT#-2-ACLQOS_BURST_DETECT_OVER_THRESHOLD"
      - "%ACLQOS-SLOT#-2-ACLQOS_BUFFER_DRAIN_FAILURE"
      - "%ACLQOS-SLOT#-2-ACLQOS_QUEUE_LIMIT_MAX"
    likely_causes:
      - "total egress traffic exceeding interface bandwidth for long enough to fill the ASIC slice buffers, after which additional traffic is dropped"
      - "speed step-down flows, for example 10G ingress to 1G egress"
      - "an oversubscribed SPAN destination port"
      - "traffic hairpin scenarios"
      - "exceeding line rate on the ingress interface"
      - "port state transitions during STP forwarding"
    commands:
      - {cmd: "show interface", intent: interface.detail}
      - {cmd: "show interface counters errors", intent: interface.errors}
      - {cmd: "show queuing interface <if>", intent: qos.queuing.interface, params: [if]}
      - {cmd: "show policy-map interface", intent: qos.policy.counters}
      - {cmd: "show policy-map interface brief", intent: qos.policy.brief}
      - {cmd: "show interface <if> counters detailed", intent: interface.counters.detailed, params: [if]}
      - {cmd: "show hardware internal buffer info pkt-stats", intent: buffer.pktstats}
      - {cmd: "show hardware internal buffer info pkt-stats peak", intent: buffer.pktstats.peak}
      - {cmd: "show system internal interface counters peak module <slot>", intent: interface.peak.counters, params: [slot]}
      - {cmd: "show interface hardware-mappings", intent: interface.asic.mapping}
    tac_first_look: >-
      Correlate the buffer-threshold syslog's module/instance with the egress interface's
      Output Discards — this is congestion, not corruption, so error counters will be
      clean.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/217340-understand-the-tahusd-buffer-threshold-e.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/213871-nexus-9500-r-nexus-3000-r-troubleshoo.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/222901-troubleshoot-packet-drops-with-interface.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/qos/cisco-nexus-9000-series-nx-os-quality-of-service-configuration-guide-106x/m-monitoring-qos-statistics.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: link-flap-err-disabled-interface
    class: link-flap
    title: "Link flapping and err-disabled interface on NX-OS"
    symptoms:
      - "interface repeatedly transitions down/up; bandwidth, speed and duplex change messages accompany each cycle"
      - "port in ErrDisabled state after flapping is detected"
      - "the port-channel first-operational-port changes on each flap"
      - "port remains down after the flap (link failure / initializing)"
    log_signatures:
      - "%ETHPORT-5-IF_DOWN_LINK_FAILURE"
      - "%ETHPORT-5-IF_DOWN_INITIALIZING"
      - "%ETHPORT-5-IF_UP"
      - "%ETHPORT-5-SPEED"
      - "%ETHPORT-5-IF_DUPLEX"
      - "%ETHPORT-5-IF_BANDWIDTH_CHANGE"
      - "%ETHPORT-5-IF_DOWN_ERROR_DISABLED"
      - "%ETHPORT-5-IF_DOWN_CHANNEL_ERR_DISABLED"
      - "%ETHPORT-5-IF_DOWN_CFG_CHANGE"
      - "%ETH_PORT_CHANNEL-5-FOP_CHANGED"
      - "%PORT-5-IF_DOWN_ADMIN_DOWN"
    likely_causes:
      - "protocol-triggered: LACP or vPC issues, protocol misconfiguration, or lost packets"
      - "Layer 1: damaged, loose or aging cables; malfunctioning interfaces"
      - "bit rate exceeding threshold; hardware/software packet drops; erroneous control frames"
      - "port flapping detected, so the port is placed in the ErrDisabled state"
      - "faulty SFP, bad connection, or point-to-point initialization issues"
      - "a storm-control shutdown action putting the port into the error-disabled state"
    commands:
      - {cmd: "show interface status", intent: interface.status}
      - {cmd: "show interface status err-disabled", intent: interface.errdisabled}
      - {cmd: "show logging logfile", intent: logging.recent}
      - {cmd: "show system internal ethpm event-history interface <if>", intent: ethpm.event.history, params: [if]}
      - {cmd: "show pie interface <if> link-flap-rca", intent: pie.linkflap.rca, params: [if]}
      - {cmd: "show pie interface <if> link-down-rca", intent: pie.linkdown.rca, params: [if]}
      - {cmd: "show interface <if> transceiver details", intent: optics.dom.readings, params: [if]}
      - {cmd: "show interface debounce", intent: interface.debounce}
      - {cmd: "show udld", intent: udld.state}
    tac_first_look: >-
      On NX-OS 10.2.1 and later, show pie interface <if> link-flap-rca names the flap
      reason directly; below that release, read the ethpm event-history together with the
      debounce timer to decide L1 versus protocol.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/221572-troubleshoot-link-flap-issue-on-nexus-90.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0101.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_01110.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01001.html
