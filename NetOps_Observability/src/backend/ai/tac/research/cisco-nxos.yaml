  - title: "Cisco Nexus 9000 Series NX-OS Troubleshooting Guide 9.3(x) — Troubleshooting Tools and Methodology"
    url: https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010001.html

tac_baseline:
  commands:
    - show clock
    - show inventory
    - show version
    - show module
    - show run
    - show logging log
    - show log nvram
    - show accounting log
    - show cdp nei
    - show lldp nei
    - show copp status
    - show policy-map interface control-plane
    - show hardware rate-limiter
    - show system reset-reason
    - show span summary
    - show vpc
    - show int status
    - show port-channel summary
    - show ip int bri vrf all
    - show cores
    - show diagnostic result mod all
    - show ip route vrf all summary
    - show mac address-table count
    - show vlan summary
    - show module internal exceptionlog
    - show processes cpu history
    - show processes memory sort
    - show interface counters errors
    - show fex
    - show license usage
    - show ip eigrp neighbor vrf all
    - show ip ospf neighbor vrf all
    - show ip bgp vpnv4 vrf all
    - "dir logflash:"
    - show tech-support details
    - show logging logfile
    - show install all status
    - show system cores
  notes: >-
    214107 publishes this exact list per platform (N3K / N5K-N6K / N7K / N9K) as one
    paste-able block; commands for features that are not enabled will error out, which the
    doc says is expected and harmless. On Nexus 7000 collect the outputs FROM THE ADMIN
    VDC AND THE VDC IN QUESTION, and add `show vdc`. The N9K troubleshooting guide's
    "Before Contacting Technical Support" chapter asks for `show tech-support details`
    (Release 9.3(1)+ also offers the `space-optimized` and `time-optimized` variants, and
    the command is NOT supported on devices with less than 4 GB of RAM), plus
    `show install all status` and `show log nvram` for upgrade problems and
    `show system cores` to confirm where core dumps are written. The `tac-pac
    bootflash://<file>` EXEC action redirects `show tech-support details` to a gzipped
    file (default `volatile:show_tech_out.gz`) and is what TAC prefers to receive — it is
    a file-writing action, not a read-only show, so Correlix should collect the underlying
    show commands and bundle them itself. Caveat from the guide: the SSH timeout period
    must be longer than the tac-pac generation time or the collection is truncated.
  sources:
    - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html
    - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010000.html
    - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/best_practices/cli_mgmt_guide/cli_mgmt_bp/tac_data.html

issues:
  - id: vpc-peer-link-down
    class: mlag-vpc-peer
    title: "vPC peer-link down — secondary suspends vPC member ports and SVIs"
    symptoms:
      - "the secondary vPC device suspends its vPC member ports and shuts down the associated SVIs; traffic is redirected to the primary"
      - "vPC status shows peer link down while peer-keepalive remains operational"
      - "the peer-link port-channel reports no operational members"
      - "orphan ports on the secondary lose connectivity"
    log_signatures:
      - "%ETHPORT-5-IF_DOWN_PORT_CHANNEL_MEMBERS_DOWN"
      - "%PORT-5-IF_DOWN_PORT_CHANNEL_MEMBERS_DOWN"
      - "%ETH_PORT_CHANNEL-5-PORT_DOWN"
      - "%ETH_PORT_CHANNEL-5-FOP_CHANGED"
    likely_causes:
      - "vPC peer-link failure while the keepalive remains operational"
      - "all peer-link port-channel members down (link failure or err-disable)"
      - "a Type-1 configuration element mismatch suspending the vPC"
      - "the returning peer reintroduced with an incorrect sticky bit, causing a role change and roughly a 40-second outage"
      - "VLANs allowed on the vPC not allowed on the peer link"
    commands:
      - {cmd: "show vpc", intent: vpc.status.summary}
      - {cmd: "show vpc brief", intent: vpc.status.brief}
      - {cmd: "show vpc role", intent: vpc.role.current}
      - {cmd: "show vpc peer-keepalive", intent: vpc.keepalive.status}
      - {cmd: "show port-channel summary", intent: portchannel.bundle.state}
      - {cmd: "show system internal vpcm info global | include ignore-case sticky", intent: vpc.role.sticky}
      - {cmd: "show vpc consistency-parameters global", intent: vpc.consistency.global}
      - {cmd: "show spanning-tree", intent: stp.state.overall}
    tac_first_look: >-
      Confirm from show vpc whether the peer-link is down while the keepalive is up (the
      classic "secondary suspends everything" case), then prove whether the peer-link
      went down for a physical/member reason or was suspended by a Type-1 mismatch.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217989-troubleshoot-vpc-inconsistency-issues-on.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/212589-understanding-vpc-election-process.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0110.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0101.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/221572-troubleshoot-link-flap-issue-on-nexus-90.html

  - id: vpc-peer-keepalive-unreachable
    class: mlag-vpc-peer
    title: "vPC peer-keepalive unreachable — keepalive path down, vPC still forwarding"
    symptoms:
      - "show vpc reports peer-keepalive status not alive while the vPC itself remains operational"
      - "no member-port suspension occurs — the keepalive alone does not suspend vPCs"
      - "keepalive statistics show no received messages"
      - "the domain is one peer-link failure away from a dual-active split"
    log_signatures: []
    likely_causes:
      - "management/keepalive VRF interface down or misrouted"
      - "the peer's mgmt0 or keepalive source interface down"
      - "VRF selection mismatch between peers"
      - "an intervening L3 path or ACL blocking the keepalive"
      - "peer device reloaded, or its control plane is unresponsive"
    commands:
      - {cmd: "show vpc peer-keepalive", intent: vpc.keepalive.status}
      - {cmd: "show vpc statistics peer-keepalive", intent: vpc.keepalive.counters}
      - {cmd: "show vpc", intent: vpc.status.summary}
      - {cmd: "show vpc role", intent: vpc.role.current}
      - {cmd: "show ip int bri vrf all", intent: ip.interface.brief}
      - {cmd: "ping <peer> vrf management", intent: vpc.keepalive.reachability, params: [peer]}
      - {cmd: "show system internal vpcm info global | include ignore-case sticky", intent: vpc.role.sticky}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Establish that only the keepalive is dead (the vPC is still up) and prove L3
      reachability of the keepalive destination in its VRF before anyone touches the
      peer-link.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217989-troubleshoot-vpc-inconsistency-issues-on.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/212589-understanding-vpc-election-process.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010101.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/218096-troubleshoot-nexus-cheat-sheet-for-begin.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: vpc-consistency-check-failure
    class: mlag-vpc-peer
    title: "vPC consistency-check failure — Type-1 (suspends the vPC) or Type-2 (flagged only)"
    symptoms:
      - "the vPC or its member ports are suspended on a Type-1 mismatch"
      - "show vpc brief reports a Type-1 configuration element mismatch"
      - "the vPC remains operational but a Type-2 inconsistency is flagged"
      - "SVI configuration mismatches between peers cause Type-2 failures"
    log_signatures:
      - "%VPC-2-L3_VPC_UNEQUAL_WEIGHT"
    likely_causes:
      - "Type-1: STP mode, Bridge Assurance, Loopguard, Port Type or MST settings mismatch"
      - "Type-1: interface type, LACP mode, speed, duplex, MTU, port mode or native VLAN mismatch"
      - "Type-1: lag-id or vPC card-type mismatch; incompatible Ethernet module hardware"
      - "Type-2: interface-VLAN admin status or routing capability mismatch"
      - "Type-2: QoS (CoS), network-QoS (MTU and Pause), or input/output queuing mismatch"
      - "unequal L3 configuration across the peers with layer3 peer-router enabled"
    commands:
      - {cmd: "show vpc brief", intent: vpc.status.brief}
      - {cmd: "show vpc consistency-parameters global", intent: vpc.consistency.global}
      - {cmd: "show vpc consistency-parameters", intent: vpc.consistency.all}
      - {cmd: "show vpc consistency-parameters interface port-channel <po>", intent: vpc.consistency.interface, params: [po]}
      - {cmd: "show vpc consistency-parameters vlans", intent: vpc.consistency.vlans}
      - {cmd: "show running-config vpc", intent: vpc.config}
      - {cmd: "show running-config spanning-tree", intent: stp.config}
      - {cmd: "show spanning-tree summary", intent: stp.mode.summary}
      - {cmd: "show queuing interface", intent: qos.queuing.interface}
      - {cmd: "show module", intent: hardware.module.compat}
    tac_first_look: >-
      Diff show vpc consistency-parameters global between the two peers — the first
      Type-1 row that differs is the suspension cause; a Type-2 flag suspends nothing, so
      go straight to the SVI admin/routing state and the QoS queuing rows for those.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217989-troubleshoot-vpc-inconsistency-issues-on.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217274-understand-virtual-port-channel-vpc-en.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0110.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/217340-understand-the-tahusd-buffer-threshold-e.html

  - id: vpc-vlans-suspended
    class: mlag-vpc-peer
    title: "VLANs on a vPC moved to suspend state"
    symptoms:
      - "VLANs on a vPC move to suspend state; ports associated with the VLAN become inactive and the VLAN passes no traffic"
      - "the vPC is up but a subset of VLANs black-holes"
      - "the consistency check flags a VLAN-scope mismatch"
    log_signatures: []
    likely_causes:
      - "VLANs allowed on the vPC were not allowed on the peer link"
      - "the VLAN is administratively suspended, so its ports become inactive"
      - "the VLAN was removed from the trunk allowed list, shutting down only that VLAN"
      - "native VLAN or port-mode Type-1 mismatch between peers"
      - "the VLAN was never created on one of the two peers"
    commands:
      - {cmd: "show vpc brief", intent: vpc.status.brief}
      - {cmd: "show vpc consistency-parameters vlans", intent: vpc.consistency.vlans}
      - {cmd: "show vlan brief", intent: vlan.list}
      - {cmd: "show vlan summary", intent: vlan.summary}
      - {cmd: "show interface trunk", intent: trunk.allowed.vlans}
      - {cmd: "show running-config vpc", intent: vpc.config}
      - {cmd: "show spanning-tree vlan <vlan>", intent: stp.vlan.state, params: [vlan]}
    tac_first_look: >-
      Compare the vPC's allowed-VLAN list against the peer-link's allowed-VLAN list first
      — that single mismatch explains most vPC VLAN suspensions.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217989-troubleshoot-vpc-inconsistency-issues-on.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0110.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_0101.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: portchannel-not-bundling-member-suspended
    class: port-channel-lacp
    proposed_class: true
    title: "Port-channel member not bundling / vPC member port suspended on compatibility failure"
    symptoms:
      - "member port stuck Individual (I) or Suspended (s) instead of bundled (P)"
      - "vPC member ports down with Compatibility check failed"
      - "show port-channel summary shows the channel with no operational members"
      - "LACP counters show no PDUs received from the peer"
    log_signatures:
      - "%PORT_CHANNEL-3-COMPAT_CHECK_FAILURE"
      - "%PORT_CHANNEL-5-PORT_ADDED"
      - "%PORT_CHANNEL-5-CREATED"
      - "%PORT-5-IF_DOWN_PORT_CHANNEL_MEMBERS_DOWN"
      - "%ETH_PORT_CHANNEL-5-PORT_DOWN"
      - "%ETHPORT-5-IF_DOWN_CHANNEL_ERR_DISABLED"
    likely_causes:
      - "speed not compatible between the two member ports"
      - "zero LACP PDUs received from the far end, so the port stays individual or suspended"
      - "the far end sends LACPDUs with a dot1q header and VLAN ID 0, which older NX-OS does not recognise and drops"
      - "Type-1 mismatch (LACP mode, interface type, duplex, MTU, port mode, native VLAN) on the vPC"
      - "remote-side incompatibility, dedicated port-group constraints, or a missing/suspended VLAN"
    commands:
      - {cmd: "show port-channel summary", intent: portchannel.bundle.state}
      - {cmd: "show lacp interface <if>", intent: lacp.interface.state, params: [if]}
      - {cmd: "show lacp neighbor", intent: lacp.neighbor}
      - {cmd: "show lacp counters", intent: lacp.pdu.counters}
      - {cmd: "show interface capabilities", intent: interface.capabilities}
      - {cmd: "show interface status", intent: interface.status}
      - {cmd: "show vpc consistency-parameters interface port-channel <po>", intent: vpc.consistency.interface, params: [po]}
      - {cmd: "show vpc", intent: vpc.status.summary}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Read the suspension reason from show port-channel summary plus the LACP
      internal/neighbour flag byte (0x3D is the bundled value), then decide between "no
      PDUs arriving" (far-end/LACP problem) and "compat check failed" (parameter
      mismatch) — the two have disjoint fixes.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/118851-technote-lacp-00.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0101.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217989-troubleshoot-vpc-inconsistency-issues-on.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01011.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/213906-nexus-9000-mac-move-troubleshooting-and.html

  - id: stp-topology-change-churn-and-flooding
    class: stp-topology
    proposed_class: true
    title: "STP topology-change churn driving excessive unknown-unicast flooding"
    symptoms:
      - "excessive packet flooding across the VLAN"
      - "MAC addresses continuously relearned; forwarding tables repeatedly flushed"
      - "topology-change counters climbing in show spanning-tree summary totals"
      - "frames for unknown destination MACs flooded to all LAN ports of the VLAN except the ingress port"
    log_signatures:
      - "%ETHPORT-5-IF_DOWN_LINK_FAILURE"
      - "%ETHPORT-5-IF_UP"
      - "%ETHPORT-5-IF_DOWN_INITIALIZING"
      - "%ETH_PORT_CHANNEL-5-FOP_CHANGED"
    likely_causes:
      - "unstable topology changes"
      - "link flaps on a non-edge port"
      - "port state changes to forwarding"
      - "designated-to-root role transitions"
      - "on topology change Rapid PVST+ starts the TC While timer on all non-edge root and designated ports and flushes the MAC addresses associated with them"
      - "legacy 802.1D TCN interop causing repeated TCA/TCN handling"
    commands:
      - {cmd: "show spanning-tree summary totals", intent: stp.tcn.totals}
      - {cmd: "show spanning-tree vlan <vlan> detail", intent: stp.tcn.detail, params: [vlan]}
      - {cmd: "show spanning-tree detail", intent: stp.detail}
      - {cmd: "show spanning-tree interface <if> detail", intent: stp.port.detail, params: [if]}
      - {cmd: "show mac address-table dynamic vlan <vlan>", intent: l2.mac.dynamic, params: [vlan]}
      - {cmd: "show mac address-table aging-time", intent: l2.mac.aging}
      - {cmd: "show interface counters", intent: interface.counters}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Use the topology-change counters to name the originating port, then prove that port
      is flapping — flooding is the symptom, the flapping non-edge port is the defect.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_011.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/221572-troubleshoot-link-flap-issue-on-nexus-90.html

  - id: stp-loop-broadcast-storm
    class: stp-topology
    proposed_class: true
    title: "STP data loop / broadcast storm on NX-OS"
    symptoms:
      - "high link utilization, up to 100 percent"
      - "high CPU and backplane traffic utilization"
      - "constant MAC address relearning and flapping"
      - "excessive output drops"
    log_signatures:
      - "%L2FM-4-L2FM_MAC_MOVE2"
      - "%L2FM-2-L2FM_MAC_FLAP_DISABLE_LEARN"
      - "%L2FM-2-L2FM_MAC_FLAP_RE_ENABLE_LEARN"
    likely_causes:
      - "bridging loop — inconsistent root bridge across switches, or BPDUs not being received"
      - "misconfigured Cisco STP extension features: bridge assurance, root guard, BPDU guard"
      - "timer or diameter misconfiguration, CPU overload, or a software defect"
      - "broadcast, multicast or unknown-unicast traffic exceeding the storm-control threshold over the 3.9 ms interval"
      - "a loop condition between ports driving repeated MAC moves"
    commands:
      - {cmd: "show spanning-tree vlan <vlan>", intent: stp.vlan.state, params: [vlan]}
      - {cmd: "show spanning-tree blockedports", intent: stp.blocked.ports}
      - {cmd: "show spanning-tree interface <if> detail", intent: stp.port.detail, params: [if]}
      - {cmd: "show interface counters errors", intent: interface.errors}
      - {cmd: "show interface counters storm-control", intent: stormcontrol.counters}
      - {cmd: "show mac address-table dynamic vlan <vlan>", intent: l2.mac.dynamic, params: [vlan]}
      - {cmd: "show processes cpu history", intent: cpu.history}
      - {cmd: "show interface counters", intent: interface.counters}
    tac_first_look: >-
      Find the interfaces at roughly 100 percent utilization, then confirm from show
      spanning-tree blockedports and the per-VLAN root bridge whether STP believes the
      topology is loop-free while the data plane says otherwise.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_01110.html
