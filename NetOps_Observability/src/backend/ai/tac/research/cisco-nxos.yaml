  - id: unicast-rib-fib-inconsistency
    class: rib-fib-inconsistency
    proposed_class: true
    title: "Unicast RIB and module FIB disagree (routing table versus forwarding table)"
    symptoms:
      - "prefix present in show ip route but traffic is black-holed or takes the wrong path"
      - "the consistency checker reports inconsistencies"
      - "the per-module forwarding entry differs from the RIB entry"
    log_signatures:
      - "%UFDM-3-PROACTIVE_CC_INCONSISTENCY_FOUND"
      - "%UFDM-2-FIB_ROUTE_UPDATE_ERR"
      - "%UFDM-3-UFDM_PRO_CC_SESSION_TIMEDOUT"
      - "%IPFIB-SLOT#-2-IPFIB_IP_FIRST_HOP_TCAM_SIZE_FULL"
      - "%U6RIB-3-INCONSISTENT_ROUTE"
      - "%U6RIB-3-INCONSISTENT_RNH"
      - "%U6RIB-3-INCONSISTENT_SUMMARY"
    likely_causes:
      - "the Layer 3 consistency checker finds a missing prefix, an extra prefix, a wrong next-hop address, or an incorrect Layer 2 rewrite string in the ARP/ND cache"
      - "a FIB route-update error returned by a line card"
      - "the hardware TCAM region is exhausted, so the entry cannot be programmed"
      - "a RIB client not registered or not converged"
    commands:
      - {cmd: "show forwarding ipv4 unicast inconsistency vrf <vrf> module all", intent: fib.inconsistency, params: [vrf]}
      - {cmd: "show consistency-checker forwarding unicast", intent: fib.cc.unicast}
      - {cmd: "show consistency-checker forwarding single-route", intent: fib.cc.singleroute}
      - {cmd: "show ip route <prefix>", intent: rib.route.lookup, params: [prefix]}
      - {cmd: "show forwarding ipv4 route module <slot>", intent: fib.route.module, params: [slot]}
      - {cmd: "show forwarding ipv4 adjacency module <slot>", intent: fib.adjacency.module, params: [slot]}
      - {cmd: "show ip adjacency <prefix> detail vrf <vrf>", intent: rib.adjacency.detail, params: [prefix, vrf]}
      - {cmd: "show forwarding distribution fib-state", intent: fib.distribution.state}
      - {cmd: "show routing unicast clients", intent: rib.clients}
      - {cmd: "show hardware capacity forwarding", intent: hw.capacity.forwarding}
    tac_first_look: >-
      Run show forwarding ipv4 unicast inconsistency vrf <vrf> module all and compare the
      specific prefix in show ip route <prefix> against show forwarding ipv4 route module
      <slot>.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m_managing_the_unicast_rib_and_fib.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: pim-neighbor-or-mroute-problem
    class: multicast-pim
    proposed_class: true
    title: "PIM neighbor missing, or multicast mroute not built / RPF failing, on NX-OS"
    symptoms:
      - "expected PIM neighbor absent from show ip pim neighbor"
      - "show ip mroute detail shows no outgoing interface, or the (S,G) is never created"
      - "receivers get no traffic although the source is active"
    log_signatures:
      - "%PIM-5-NBR_CHANGE"
      - "%PIM-5-DR_CHANGE"
      - "%PIM-4-HELLO_INT"
      - "%PIM-3-STATE_LIMIT"
      - "%PIM-4-DUP_VPC_NBR"
      - "%PIM-6-MAX_RPS"
    likely_causes:
      - "RP misconfiguration — the RP address with the best priority, or a software RP hash, is not what was intended"
      - "PIM must be configured on all L3 interfaces between sources, receivers and RPs"
      - "RPF failure — RPF-failed traffic is dropped and sent to the CPU"
      - "no unicast route toward the source or the RP"
      - "a domain border preventing message forwarding, or an unexpected DR election by priority/IP address"
      - "the PIM state limit for the VRF exceeded"
    commands:
      - {cmd: "show ip pim neighbor", intent: pim.neighbors}
      - {cmd: "show ip pim interface <if>", intent: pim.interface, params: [if]}
      - {cmd: "show ip pim interface brief vrf all", intent: pim.interface.brief}
      - {cmd: "show ip pim rp", intent: pim.rp}
      - {cmd: "show ip pim rp-hash", intent: pim.rp.hash}
      - {cmd: "show ip pim group-range vrf <vrf>", intent: pim.grouprange, params: [vrf]}
      - {cmd: "show ip mroute detail", intent: mroute.detail}
      - {cmd: "show ip mroute summary", intent: mroute.summary}
      - {cmd: "show ip pim route", intent: pim.route}
      - {cmd: "show ip pim statistics", intent: pim.statistics}
      - {cmd: "show ip route <prefix>", intent: rpf.unicast.lookup, params: [prefix]}
    tac_first_look: >-
      Confirm PIM is enabled on every L3 hop and that the unicast route toward the source
      or RP exists — RPF failure and a missing PIM interface account for most "no mroute"
      cases.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/multicast/cisco-nexus-9000-series-nx-os-multicast-routing-configuration-guide-106x/m-configuring-pim-and-pimm6.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html

  - id: igmp-snooping-problem
    class: multicast-igmp
    proposed_class: true
    title: "IGMP snooping not programming groups — multicast flooded or black-holed in a VLAN"
    symptoms:
      - "the receiver's group absent from show ip igmp snooping groups"
      - "multicast flooded to all ports in the VLAN"
      - "no querier, or no mrouter port, learned for the VLAN"
    log_signatures:
      - "%IGMP-3-SNOOP_CONFIG_ERROR"
      - "%IGMP-3-GROUP_LIMIT"
      - "%IGMP-3-STATE_LIMIT"
      - "%IGMP-6-RECEIVE_QUERY"
      - "%IGMP-4-QUERY_DROP_ON_SAT_PORT"
      - "%IGMP-3-GROUP_RANGE_IGNORE"
    likely_causes:
      - "IGMP snooping disabled, causing reduced multicast performance from excessive false flooding within the device"
      - "vPC pair configuration mismatch, which can cause traffic loss, extended forwarding periods, or differences in multicast state expiration timing"
      - "multicast-router-port behaviour across trunked VLANs sending VLAN X traffic out the multicast router ports in both VLAN X and VLAN Y"
      - "missing querier in an L2-only VLAN"
      - "group or state limit exceeded"
      - "IGMP version mismatch between querier and host"
    commands:
      - {cmd: "show ip igmp snooping vlan <vlan>", intent: igmpsnoop.vlan, params: [vlan]}
      - {cmd: "show ip igmp snooping groups vlan <vlan> detail", intent: igmpsnoop.groups.detail, params: [vlan]}
      - {cmd: "show ip igmp snooping querier vlan <vlan>", intent: igmpsnoop.querier, params: [vlan]}
      - {cmd: "show ip igmp snooping mroute vlan <vlan>", intent: igmpsnoop.mrouterports, params: [vlan]}
      - {cmd: "show ip igmp snooping explicit-tracking vlan <vlan> detail", intent: igmpsnoop.tracking, params: [vlan]}
      - {cmd: "show ip igmp snooping statistics vlan", intent: igmpsnoop.statistics}
      - {cmd: "show ip igmp groups", intent: igmp.groups}
      - {cmd: "show ip igmp interface", intent: igmp.interface}
      - {cmd: "show vlan summary", intent: vlan.summary}
    tac_first_look: >-
      Check that a querier exists for the VLAN and that an mrouter port is learned before
      suspecting the ASIC.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/multicast/cisco-nexus-9000-series-nx-os-multicast-routing-configuration-guide-106x/m-configuring-igmp-snooping.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: hsrp-duplicate-active-or-state-change
    class: fhrp
    proposed_class: true
    title: "HSRP dual-active, unexpected state change, or virtual-IP conflict on NX-OS"
    symptoms:
      - "both peers report Active in show hsrp brief"
      - "repeated group state transitions in the log"
      - "hosts behind the HSRP gateway intermittently lose their default gateway, or cannot reach beyond the VLAN"
      - "the HSRP flap coincides with SVI or member-port flaps"
    log_signatures:
      - "%HSRP_ENGINE-5-GRPSTATECHANGE"
      - "%HSRP_ENGINE-6-STATECHANGE"
      - "%HSRP_ENGINE-5-ACTIVE_CHANGE"
      - "%HSRP_ENGINE-4-BADAUTH"
      - "%HSRP_ENGINE-4-DUPADDR"
      - "%HSRP_ENGINE-4-DIFFVIP1"
      - "%HSRP_ENGINE-5-PRIORITY"
      - "%HSRP_ENGINE-5-MACADDRESS_CHANGE"
    likely_causes:
      - "authentication mismatch — different authentication configurations between peers"
      - "HSRP version mismatch — version 2 does not interoperate with version 1"
      - "misconfigured priority or preemption"
      - "vPC configuration issues — mismatched virtual MAC addresses on vPC peers"
      - "the host gateway MAC mapped to the physical peer device MAC, tripping vPC loop prevention (use the HSRP address, or the peer-gateway feature)"
      - "link failures affecting tracked objects, or a virtual-IP mismatch between peers"
    commands:
      - {cmd: "show hsrp brief", intent: hsrp.brief}
      - {cmd: "show hsrp interface <if> group <group> detail", intent: hsrp.group.detail, params: [if, group]}
      - {cmd: "show hsrp summary", intent: hsrp.summary}
      - {cmd: "show hsrp delay interface <if>", intent: hsrp.delay, params: [if]}
      - {cmd: "show hsrp bfd-sessions interface <if>", intent: hsrp.bfd, params: [if]}
      - {cmd: "show running-config hsrp", intent: hsrp.config}
      - {cmd: "show mac address-table vlan <vlan>", intent: hsrp.vmac.location, params: [vlan]}
      - {cmd: "show vpc role", intent: vpc.role.current}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Diff show running-config hsrp on both peers for version, authentication, virtual IP
      and priority/preempt, then read the reason field in %HSRP_ENGINE-5-GRPSTATECHANGE.
      Note the NX-OS facility is HSRP_ENGINE, not HSRP.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m_configuring_hsrp.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01000.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/217274-understand-virtual-port-channel-vpc-en.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_0110.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: vrrp-problem
    class: fhrp
    proposed_class: true
    title: "VRRP master/backup election wrong, VR will not start, or bad advertisements"
    symptoms:
      - "the VR stays in Init, or both nodes claim Master"
      - "show vrrp shows an unexpected priority or state"
      - "advertisements counted as invalid in show vrrp statistics"
    log_signatures:
      - "%VRRP-ENG-5-VR_STATE_CHANGE"
      - "%VRRP-ENG-4-BAD_ADV"
      - "%VRRP-ENG-5-INVALID_CONFIG"
      - "%VRRP-ENG-5-INTERFACE_DOWN"
      - "%VRRP-ENG-5-INTERFACE_STATE_CHANGE"
      - "%VRRP-ENG-2-VR_FAILURE"
    likely_causes:
      - "authentication mismatch — authentication schemes or text strings differ between router and incoming packet"
      - "priority issues — if priorities match, the higher IP address is selected as the new primary"
      - "advertisement-interval mismatch between devices"
      - "duplicate VRID or virtual IP — multiple groups cannot share identical virtual IP addresses on the same interface"
      - "the interface IP not in the same subnet as the VR address"
      - "the interface is down"
    commands:
      - {cmd: "show vrrp <group>", intent: vrrp.group, params: [group]}
      - {cmd: "show vrrp statistics", intent: vrrp.statistics}
      - {cmd: "show vrrpv3 detail", intent: vrrpv3.detail}
      - {cmd: "show vrrpv3 statistics", intent: vrrpv3.statistics}
      - {cmd: "show fhrp <if>", intent: fhrp.state, params: [if]}
      - {cmd: "show running-config vrrp", intent: vrrp.config}
      - {cmd: "show interface <if>", intent: interface.detail, params: [if]}
      - {cmd: "show logging logfile", intent: logging.recent}
    tac_first_look: >-
      Read the reason string in %VRRP-ENG-4-BAD_ADV / %VRRP-ENG-5-INVALID_CONFIG and
      confirm both nodes carry identical VRID, advertisement interval and authentication.
      Note the NX-OS facilities are VRRP-ENG and VRRP-CFG, not VRRP.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m_configuring_vrrp.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010101.html

  - id: copp-and-rate-limiter-drops
    class: control-plane-policing
    proposed_class: true
    title: "Control-plane traffic dropped by CoPP or by a hardware rate limiter"
    symptoms:
      - "protocol adjacencies flap or management sessions time out under load"
      - "non-zero DropPackets in show policy-map interface control-plane"
      - "non-zero dropped counters in show hardware rate-limiter"
    log_signatures:
      - "%COPP-1-COPP_DROPS1"
      - "%COPP-2-COPP_DROPS2"
      - "%COPP-5-COPP_DROPS5"
      - "%COPP-2-COPP_DEFAULT_POLICY"
      - "%COPP-2-COPP_RATELIMIT_DISABLED"
      - "%COPP-2-COPP_NO_POLICY"
      - "%ACLQOS-SLOT#-5-ACLQOS_NON_ATOMIC"
    likely_causes:
      - "exception classes hitting CoPP: IP option exceptions, IP ICMP unreachable, TTL-failure, IPv6 option exceptions, IPv6 ICMP unreachable, MTU-failure"
      - "a packet exceeding the configured rate, so it is dropped per the violate action (DropPackets versus OutPackets)"
      - "hardware rate-limiter classes: ACL log packets, BFD, exception catch-all, FEX traffic, L3 glean, L3 multicast data, SPAN egress, sFlow, VXLAN-OAM, Netflow"
      - "no CoPP policy applied, leaving the control plane unprotected"
    commands:
      - {cmd: "show copp status", intent: copp.status}
      - {cmd: "show policy-map interface control-plane", intent: copp.stats}
      - {cmd: "show policy-map type control-plane expand name <policy>", intent: copp.policy.expand, params: [policy]}
      - {cmd: "show class-map type control-plane", intent: copp.classmaps}
      - {cmd: "show copp profile strict", intent: copp.profile.reference}
      - {cmd: "show copp diff profile strict", intent: copp.profile.diff}
      - {cmd: "show hardware rate-limiter", intent: ratelimiter.stats}
      - {cmd: "show hardware rate-limiter access-list-log", intent: ratelimiter.acllog}
      - {cmd: "show hardware rate-limiter module <slot>", intent: ratelimiter.module, params: [slot]}
      - {cmd: "show running-config copp all", intent: copp.config}
      - {cmd: "show consistency-checker copp", intent: copp.cc}
    tac_first_look: >-
      Read the class name carried in %COPP-2-COPP_DROPS2 and pull the matching class
      counters from show policy-map interface control-plane — that identifies which
      protocol is being policed.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/security/cisco-nexus-9000-series-nx-os-security-configuration-guide-release-106x/m-configuring-copp.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/security/cisco-nexus-9000-series-nx-os-security-configuration-guide-release-106x/m-configuring-rate-limits.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01011.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html

  - id: nxos-high-cpu
    class: high-cpu
    title: "High CPU utilisation on a Nexus supervisor"
    symptoms:
      - "sustained high CPU in show processes cpu"
      - "slow CLI, delayed protocol convergence, control-plane timeouts"
      - "a single process dominating the CPU history graph"
    log_signatures:
      - "%COPP-2-COPP_DROPS2"
      - "%SYSMGR-2-SRV_MAJOR_MEMORY_ALERT"
    likely_causes:
      - "excessive punt to CPU from RPF failure — RPF-failed traffic is dropped and sent to the CPU"
      - "continuous SNMP polling of a troublesome OID, including window timeouts when parsing the MIB tree at specific OIDs"
      - "a high number of running processes because of the number of features enabled"
      - "control-plane flooding visible as CoPP drops"
    commands:
      - {cmd: "show processes cpu", intent: cpu.processes}
      - {cmd: "show processes cpu history", intent: cpu.history}
      - {cmd: "show processes cpu module <slot>", intent: cpu.module, params: [slot]}
      - {cmd: "show system resources", intent: system.resources}
      - {cmd: "show processes", intent: processes.list}
      - {cmd: "show policy-map interface control-plane", intent: copp.stats}
      - {cmd: "show hardware rate-limiter", intent: ratelimiter.stats}
      - {cmd: "show logging onboard error-stats", intent: obfl.errorstats}
      - {cmd: "show clock", intent: system.clock}
      - {cmd: "show version", intent: system.version}
    tac_first_look: >-
      Take show processes cpu history first to establish whether the spike is sustained or
      periodic, then identify the top process with show processes cpu.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01010.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/221754-exclude-oid-in-nexus-5k-7k-and-9k-in-snm.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/multicast/cisco-nexus-9000-series-nx-os-multicast-routing-configuration-guide-106x/m-configuring-pim-and-pimm6.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: nxos-memory-threshold-exceeded
    class: high-memory
    title: "Memory threshold exceeded / low-memory condition on NX-OS"
    symptoms:
      - "show system resources shows very little free memory"
      - "one process dominating show processes memory"
      - "memory-alert syslogs; services restarting or refusing new state"
    log_signatures:
      - "%PLATFORM-2-MEMORY_ALERT"
      - "%PLATFORM-2-MEMORY_ALERT_RECOVERED"
      - "%SYSMGR-2-SRV_MAJOR_MEMORY_ALERT"
      - "%SYSMGR-2-SRV_MINOR_MEMORY_ALERT"
      - "%PLATFORM-2-PFM_LOW_MEMORY_CONDITION"
      - "%SYSMGR-0-ACTIVE_SUP_LESS_MEMORY"
      - "%BGP-3-LOWMEM"
      - "%OSPF-1-LOWMEM"
    likely_causes:
      - "high page-cache usage — cached pages can be released by the kernel if memory is needed by other processes"
      - "kernel memory allocation for its own text, data and kernel loadable modules"
      - "utilization high because some user processes are taking up too much memory"
      - "a high number of running processes because of the number of features enabled"
    commands:
      - {cmd: "show system resources", intent: system.resources}
      - {cmd: "show processes memory", intent: memory.processes}
