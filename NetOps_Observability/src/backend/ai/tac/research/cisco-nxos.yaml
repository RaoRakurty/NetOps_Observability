      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01000.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010010.html

  - id: vlan-trunk-not-forming-allowed-vlan-mismatch
    class: vlan-trunk
    proposed_class: true
    title: "VLAN trunk not forming / allowed-VLAN mismatch on NX-OS"
    symptoms:
      - "the trunk forms but a given VLAN carries no traffic"
      - "VLAN in suspended state — associated ports inactive and no traffic passes"
      - "an interface cannot be enabled because of a missing or suspended VLAN"
      - "per-VLAN STP shows the VLAN not present on the trunk"
    log_signatures: []
    likely_causes:
      - "VLAN suspended, or not created, on one side"
      - "VLAN deleted from the trunk allowed list, so only that VLAN is shut down while other VLANs keep flowing"
      - "native VLAN or port-mode mismatch (Type-1 parameters in a vPC context)"
      - "a missing or suspended VLAN preventing the interface coming up"
      - "inner and outer VLAN both on the trunk allowed list where inner/outer VLAN is configured"
      - "an attempt to suspend an extended VLAN (1006-3967), which is not supported"
    commands:
      - {cmd: "show interface trunk", intent: trunk.state.allowed}
      - {cmd: "show interface switchport", intent: switchport.mode}
