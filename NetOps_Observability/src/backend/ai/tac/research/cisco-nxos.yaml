  - id: mac-move-mac-flapping
    class: mac-learning
    proposed_class: true
    title: "MAC move / MAC flapping and learn-disable"
    symptoms:
      - "the same MAC address seen moving between interfaces repeatedly"
      - "MAC learning disabled on the VLAN and re-enabled 120 s later"
      - "hardware learn disable/enable events on the line card"
      - "endpoints intermittently unreachable during the learn-disable window"
    log_signatures:
      - "%L2FM-4-L2FM_MAC_MOVE2"
      - "%L2FM-2-L2FM_MAC_FLAP_DISABLE_LEARN"
      - "%L2FM-2-L2FM_MAC_FLAP_RE_ENABLE_LEARN"
      - "%ETH_PORT_CHANNEL-5-PORT_DOWN"
      - "%ETH_PORT_CHANNEL-5-FOP_CHANGED"
      - "%ETHPORT-5-IF_DOWN_NONE"
    likely_causes:
      - "too many MAC moves, flaps or loops, or new MAC learns/moves exceeding a threshold"
      - "frames with an identical source MAC arriving on multiple interfaces at high rates"
      - "loop conditions between ports"
      - "10 or more moves in 1 second (Broadcom ASIC), or 10 or more in 10 seconds (9300-EX/FX/GX, 9500), disabling learning on the VLAN for 120 seconds"
      - "a dual-homed endpoint or NIC teaming presenting the same MAC on two paths"
      - "a vPC orphan-port or peer-link misforwarding re-presenting the MAC"
    commands:
      - {cmd: "show mac address-table notification mac-move", intent: mac.move.notification}
      - {cmd: "show mac address-table address <mac>", intent: mac.lookup.address, params: [mac]}
      - {cmd: "show mac address-table vlan <vlan>", intent: mac.table.vlan, params: [vlan]}
      - {cmd: "show mac address-table loop-detect", intent: mac.loopdetect.state}
      - {cmd: "show system internal l2fm l2dbg macdb address <mac> vlan <vlan>", intent: l2fm.macdb.history, params: [mac, vlan]}
      - {cmd: "show logging level l2fm", intent: logging.level.l2fm}
      - {cmd: "show interface snmp-ifindex", intent: interface.ifindex.map}
      - {cmd: "show mac address-table count", intent: mac.table.count}
    tac_first_look: >-
      Take the two interfaces named in %L2FM-4-L2FM_MAC_MOVE2 and the l2fm macdb history
      — that pair identifies either a genuine dual-homed host or the two legs of a loop,
      and nothing else matters until that is settled.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/213906-nexus-9000-mac-move-troubleshooting-and.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/layer-2-switching/configuration/guide/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x/b-cisco-nexus-9000-nx-os-layer-2-switching-configuration-guide-93x_chapter_011.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/213962-nexus-9000-arp-mac-table-sync-behavio.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/200952-Configuration-and-Verification-VXLAN-wit.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: vxlan-nve-peer-down-underlay-unreachable
    class: evpn-vxlan
    title: "VXLAN NVE peer down / VTEP fabric (underlay) unreachable"
    symptoms:
      - "expected remote VTEP absent from show nve peers"
      - "remote VTEP loopback missing from the routing table, or present with a wrong next hop"
      - "ping between VTEP loopbacks fails"
      - "NVE interface up but no peers established"
    log_signatures: []
    likely_causes:
      - "VTEP loopback not advertised into the underlay (missing network <loopback>/32 under the IPv4 unicast address family)"
      - "remote loopback route not present, or its next hop does not point at the remote VTEP fabric address"
      - "EVPN updates from the remote VTEP peer not received in the L2VPN EVPN table"
      - "NVE source-interface (loopback) down, or not reachable in the correct VRF"
      - "BGP EVPN session to the spine / route reflector down"
      - "underlay L3 path broken between leaf and spine"
    commands:
      - {cmd: "show nve peers", intent: vxlan.nve.peers}
      - {cmd: "show nve interface", intent: vxlan.nve.interface}
      - {cmd: "show nve vxlan-params", intent: vxlan.global.params}
      - {cmd: "show ip interface brief | exclude down", intent: underlay.interfaces}
      - {cmd: "show ip bgp <prefix> vrf <vrf>", intent: underlay.bgp.advertised, params: [prefix, vrf]}
      - {cmd: "show ip route <prefix> vrf <vrf>", intent: underlay.route.remote_vtep, params: [prefix, vrf]}
      - {cmd: "ping <prefix> source-interface <if>", intent: underlay.reachability, params: [prefix, if]}
      - {cmd: "show bgp l2vpn evpn <prefix> vrf <vrf>", intent: evpn.vtep.route, params: [prefix, vrf]}
    tac_first_look: >-
      Walk the documented five-step ladder — local advertisement, EVPN propagation, remote
      reception, RIB resolution, then loopback-sourced ping — and stop at the first rung
      that fails.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/220694-test-fabric-connectivity-between-virtual.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/200952-Configuration-and-Verification-VXLAN-wit.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/215780-troubleshoot-evpn-vxlan-in-multisite-env.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01101.html

  - id: vxlan-vni-down-evpn-mac-not-learned
    class: evpn-vxlan
    title: "VXLAN VNI down / MAC not learned in EVPN"
    symptoms:
      - "VNI not in an up state on the NVE interface"
      - "local MAC present in the MAC address-table but absent from show l2route evpn mac evi <vni>"
      - "EVPN Type-2 routes not advertised to, or not received from, the remote VTEP"
      - "east-west traffic for that VNI black-holes while the underlay is healthy"
    log_signatures: []
    likely_causes:
      - "VNI not configured or not associated on the NVE interface"
      - "L2VNI-to-VLAN mapping missing or mismatched between VTEPs"
      - "MAC not learned locally on the access port, so there is nothing to advertise"
      - "BGP EVPN neighbor down, so Type-2 routes never propagate"
      - "Type-2 route advertised but not accepted at the remote VTEP (route-target / import policy)"
      - "NVE peer not established for the VNI"
    commands:
      - {cmd: "show nve vni", intent: vxlan.vni.state}
      - {cmd: "show nve vni counters", intent: vxlan.vni.counters}
      - {cmd: "show vxlan", intent: vxlan.summary}
      - {cmd: "show mac address-table vlan <vlan>", intent: mac.table.vlan.local, params: [vlan]}
      - {cmd: "show l2route evpn mac evi <vni>", intent: evpn.l2route.mac, params: [vni]}
      - {cmd: "show l2route evpn mac-ip evi <vni>", intent: evpn.l2route.macip, params: [vni]}
      - {cmd: "show bgp l2vpn evpn vni-id <vni>", intent: evpn.bgp.byvni, params: [vni]}
      - {cmd: "show bgp l2vpn evpn summary", intent: evpn.bgp.sessions}
      - {cmd: "show bgp l2vpn evpn neighbors <peer> advertised-routes", intent: evpn.bgp.advertised, params: [peer]}
    tac_first_look: >-
      Prove the MAC exists locally first (show mac address-table vlan <vlan>), then follow
      it up the stack — l2route, then BGP EVPN — and the layer where it disappears is the
      defect.
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/200952-Configuration-and-Verification-VXLAN-wit.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01101.html
      - https://www.cisco.com/c/en/us/support/docs/switches/nexus-9000-series-switches/215780-troubleshoot-evpn-vxlan-in-multisite-env.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01011.html

  - id: ospf-neighbor-not-forming
    class: ospf-adjacency
    title: "OSPFv2 neighbor stuck in INIT/EXSTART, or never appears, on NX-OS"
    symptoms:
      - "show ip ospf neighbor shows no neighbor, or one stuck below FULL (INIT / 2-WAY / EXSTART)"
      - "routes learned via OSPF absent from show ip route"
      - "interface is up/up but OSPF hellos are not reciprocated"
    log_signatures:
      - "%OSPF-4-AREA_ERR"
      - "%OSPF-4-AUTH_ERR"
      - "%OSPF-4-DUPRID"
      - "%OSPF-4-NEIGH_ERR"
      - "%OSPF-4-PKTTYPE_ERR"
      - "%OSPF-4-VERSION_ERR"
      - "%OSPF-4-CKSM_ERR"
    likely_causes:
      - "neighbor MTU does not match the local interface MTU (unless mtu-ignore is configured)"
      - "mismatched authentication configuration or keys across neighbors"
      - "passive-interface configuration suppressing routing updates"
      - "incompatible RFC-compliance modes between routers"
      - "the OSPF feature/process not enabled, or the interface in the wrong VRF"
      - "duplicate router ID"
    commands:
      - {cmd: "show feature", intent: feature.enabled}
      - {cmd: "show ip ospf neighbor", intent: ospf.neighbors}
      - {cmd: "show ip ospf neighbor vrf all", intent: ospf.neighbors.allvrf}
      - {cmd: "show ip ospf interface <if>", intent: ospf.interface.detail, params: [if]}
      - {cmd: "show ip ospf <instance>", intent: ospf.process, params: [instance]}
      - {cmd: "show running-config ospf", intent: ospf.config}
      - {cmd: "show ip ospf traffic", intent: ospf.traffic.counters}
      - {cmd: "show ip ospf statistics", intent: ospf.statistics}
      - {cmd: "show vrf interface <if>", intent: interface.vrf, params: [if]}
    tac_first_look: >-
      Compare show ip ospf interface <if> on both ends for area, MTU, hello/dead timers,
      network type and authentication before collecting anything else.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m_configuring_ospfv2.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html

  - id: ospf-adjacency-flap
    class: ospf-flapping-link
    title: "OSPFv2 adjacency repeatedly goes FULL to DOWN to FULL on NX-OS"
    symptoms:
      - "repeating %OSPF-5-ADJCHANGE pairs in show logging logfile"
      - "OSPF routes churn; SPF runs continuously"
      - "neighbor uptime in show ip ospf neighbor resets constantly"
    log_signatures:
      - "%OSPF-5-ADJCHANGE"
      - "%OSPF-5-NBRSTATE"
      - "%OSPF-5-BFD_DOWN"
      - "%OSPF-5-NBR_RETRANSMISSIONS"
      - "%OSPF-3-MAXLSAS"
      - "%OSPF-4-OSPF_MAX_LSA"
      - "%ETHPORT-5-IF_DOWN_LINK_FAILURE"
    likely_causes:
      - "physical link failure or a flapping port"
      - "repeated LSU retransmissions to a neighbour"
      - "a BFD session teardown driving the adjacency down"
      - "control-plane starvation — hellos dropped by CoPP"
      - "LSA overload: maximum number of LSAs in the domain reached"
      - "CPU or memory pressure on the supervisor"
    commands:
      - {cmd: "show ip ospf neighbor", intent: ospf.neighbors}
      - {cmd: "show logging logfile", intent: logging.recent}
      - {cmd: "show logging last 200", intent: logging.tail}
      - {cmd: "show interface counters errors", intent: interface.errors}
      - {cmd: "show interface <if>", intent: interface.detail, params: [if]}
      - {cmd: "show ip ospf traffic", intent: ospf.traffic.counters}
      - {cmd: "show policy-map interface control-plane", intent: copp.stats}
      - {cmd: "show errdisable flap", intent: interface.flap.errdisable}
      - {cmd: "show logging onboard error-stats", intent: obfl.errorstats}
    tac_first_look: >-
      Correlate the %OSPF-5-ADJCHANGE timestamps against %ETHPORT-5-IF_DOWN_* and CoPP
      drop counters — a link-layer or control-plane-policing cause is far more common
      than an OSPF defect.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m_configuring_ospfv2.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_010001.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: eigrp-neighbor-problem
    class: eigrp-adjacency
    proposed_class: true
    title: "EIGRP neighbor not forming, flapping, or route stuck-in-active on NX-OS"
    symptoms:
      - "peer absent from show ip eigrp neighbors, or the adjacency bouncing"
      - "EIGRP-learned prefixes missing from show ip route"
      - "a prefix remains active in show ip eigrp topology"
    log_signatures:
      - "%EIGRP-5-NBRCHANGE_DUAL"
      - "%EIGRP-5-WRONG_SUBNET"
      - "%EIGRP-3-DUP_ADDR"
      - "%EIGRP-3-SIA_DUAL"
      - "%EIGRP-6-UNEQUAL_METRICS"
      - "%EIGRP-3-PFXLIMIT_DUAL"
    likely_causes:
      - "AS-number mismatch — routes are not exchanged between different autonomous systems"
      - "K-value / metric-weight mismatch across routers"
      - "MD5 authentication digest mismatch"
      - "passive-interface suppressing EIGRP hellos, which prevents neighbors from forming"
      - "MTU mismatch between the two interfaces"
      - "neighbours not on the same subnet"
    commands:
      - {cmd: "show ip eigrp <instance> neighbors <if> detail", intent: eigrp.neighbors.detail, params: [instance, if]}
      - {cmd: "show ip eigrp neighbor vrf all", intent: eigrp.neighbors.allvrf}
      - {cmd: "show ip eigrp <instance> interfaces <if> detail", intent: eigrp.interfaces.detail, params: [instance, if]}
      - {cmd: "show ip eigrp <instance> topology <prefix> active", intent: eigrp.topology.active, params: [instance, prefix]}
      - {cmd: "show ip eigrp <instance> traffic vrf <vrf>", intent: eigrp.traffic.counters, params: [instance, vrf]}
      - {cmd: "show ip eigrp <instance> accounting vrf <vrf>", intent: eigrp.accounting, params: [instance, vrf]}
      - {cmd: "show running-config eigrp all", intent: eigrp.config.all}
      - {cmd: "show ip route", intent: rib.routes}
    tac_first_look: >-
      Check AS number, K-values and authentication in show running-config eigrp all on
      both ends, then show ip eigrp <instance> interfaces <if> detail for MTU and passive
      state.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/m-n9k-configuring-eigrp-93x.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: bgp-peer-not-established
    class: bgp-session
    title: "BGP peer never reaches Established on NX-OS (Idle / Active / Connect / OpenSent)"
    symptoms:
      - "show bgp sessions / show bgp all summary shows the peer not in Established state"
      - "no prefixes received from the peer"
      - "the TCP 179 session never completes"
    log_signatures:
      - "%BGP-3-BADPEERAS"
      - "%BGP-3-BADPEERRID"
      - "%BGP-3-BADPEERHOLDTIME"
      - "%BGP-4-SAMERID"
      - "%BGP-3-BADOPENCAP"
      - "%BGP-3-MD5PASS"
      - "%BGP-3-EBGPTTL"
      - "%BGP-4-MAXPEERS"
    likely_causes:
      - "wrong IP address or AS configured"
      - "duplicate router ID"
      - "no connected route to the peer, or no route at all"
      - "Layer 1 issue: physical interface, SFP, cable, or an external problem"
      - "firewall or access lists blocking the connection"
      - "wrong update-source, or missing ebgp-multihop / TTL setting"
    commands:
      - {cmd: "show bgp sessions", intent: bgp.sessions}
      - {cmd: "show bgp all summary", intent: bgp.summary.all}
      - {cmd: "show bgp ipv4 unicast neighbors", intent: bgp.neighbors}
      - {cmd: "show bgp neighbors <peer>", intent: bgp.neighbors.detail, params: [peer]}
      - {cmd: "show bgp process", intent: bgp.process}
      - {cmd: "show running-config bgp", intent: bgp.config}
      - {cmd: "show ip route <peer>", intent: rib.route.peer, params: [peer]}
      - {cmd: "show logging logfile", intent: logging.recent}
      - {cmd: "show bgp statistics", intent: bgp.statistics}
    tac_first_look: >-
      Read the last-error / notification text in show bgp neighbors <peer> and match it to
      %BGP-3-BADPEERAS / BADPEERRID / BADOPENCAP before touching configuration.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/configuring-bgp.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/218027-troubleshoot-border-gateway-protocol-bas.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/213952-configure-bgp-to-advertise-a-default-rou.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html

  - id: bgp-session-flap
    class: bgp-instability
    title: "BGP session repeatedly establishes and drops on NX-OS"
    symptoms:
      - "repeating %BGP-5-ADJCHANGE up/down pairs in the log"
      - "peer uptime in show bgp all summary keeps resetting"
      - "route churn or dampened prefixes downstream"
    log_signatures:
      - "%BGP-5-ADJCHANGE"
      - "%BGP-3-BADPEERHOLDTIME"
      - "%BGP-4-PFXEXCEED"
      - "%BGP-4-PFXWARN"
      - "%BGP-4-SELF_RESTART"
      - "%ETHPORT-5-IF_DOWN_LINK_FAILURE"
    likely_causes:
      - "an interface flap tearing the TCP session down"
      - "hold-timer expiry because keepalives are lost"
      - "max-prefix limit reached, so the peer is shut down by policy"
      - "MD5 / TCP authentication mismatch"
      - "CPU or memory exhaustion starving the BGP process"
      - "CoPP dropping BGP control traffic"
    commands:
      - {cmd: "show bgp all summary", intent: bgp.summary.all}
      - {cmd: "show bgp neighbors flap-statistics", intent: bgp.neighbors.flapstats}
      - {cmd: "show bgp neighbors <peer>", intent: bgp.neighbors.detail, params: [peer]}
      - {cmd: "show logging logfile", intent: logging.recent}
      - {cmd: "show interface counters errors", intent: interface.errors}
      - {cmd: "show processes cpu history", intent: cpu.history}
      - {cmd: "show policy-map interface control-plane", intent: copp.stats}
      - {cmd: "show bgp convergence detail", intent: bgp.convergence}
      - {cmd: "show system resources", intent: system.resources}
    tac_first_look: >-
      Bracket the %BGP-5-ADJCHANGE timestamps against interface events and CoPP class
      drops — a flapping BGP session is nearly always a transport or
      control-plane-policing symptom.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/218027-troubleshoot-border-gateway-protocol-bas.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
      - https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-os-software/214107-quick-reference-guide-to-collect-tac-req.html

  - id: bgp-route-not-advertised-or-received
    class: bgp-route-missing
    title: "Expected BGP prefix not advertised to, or not received from, a peer on NX-OS"
    symptoms:
      - "prefix present locally but absent from show bgp ipv4 unicast neighbors <peer> advertised-routes"
      - "the peer's prefix absent from show bgp ipv4 unicast"
      - "prefix in the BGP table but not installed in show ip route"
    log_signatures:
      - "%BGP-3-BADNEXTHOP"
      - "%BGP-4-PFXEXCEED"
      - "%BGP-4-PFXWARN"
      - "%BGP-4-PATH_ATTR_FILTER"
      - "%BGP-4-ERR_TREAT_AS_WITHDRAW"
      - "%BGP-3-UNSUPPORTED_NEXTHOP"
    likely_causes:
      - "the next hop must be reachable for the route to be installed"
      - "RIB failure — the prefix is already in the RIB via a protocol with a lower administrative distance"
      - "a race condition where the IGP is preferred over eBGP during mutual redistribution"
      - "an outbound or inbound route-policy filtering the prefix"
      - "max-prefix limit reached"
      - "the prefix was never originated (missing network statement, default-originate or aggregate)"
    commands:
      - {cmd: "show bgp ipv4 unicast", intent: bgp.table.ipv4}
      - {cmd: "show bgp ipv4 unicast neighbors <peer> advertised-routes", intent: bgp.neighbors.advertised, params: [peer]}
      - {cmd: "show bgp ipv4 unicast <prefix>", intent: bgp.prefix.detail, params: [prefix]}
      - {cmd: "show bgp all summary", intent: bgp.summary.all}
      - {cmd: "show ip route <prefix>", intent: rib.route.lookup, params: [prefix]}
      - {cmd: "show ip bgp rib-failure", intent: bgp.ribfailure}
      - {cmd: "show running-config bgp", intent: bgp.config}
      - {cmd: "show bgp statistics", intent: bgp.statistics}
      - {cmd: "show bgp neighbors paths", intent: bgp.neighbors.paths}
    tac_first_look: >-
      Confirm origination first (show bgp ipv4 unicast <prefix>), then whether policy
      blocked it (advertised-routes), then whether the RIB rejected it (show ip bgp
      rib-failure).
    sources:
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/213952-configure-bgp-to-advertise-a-default-rou.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/configuring-bgp.html
      - https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/218027-troubleshoot-border-gateway-protocol-bas.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html

  - id: bgp-evpn-vpnv4-route-missing
    class: bgp-route-missing
    title: "BGP VPNv4 / L2VPN EVPN route missing in a VRF or on a VTEP"
    symptoms:
      - "VRF prefix absent from show ip route vrf <vrf> although the VPNv4/EVPN peer is Established"
      - "Type-2 or Type-5 route absent from show bgp l2vpn evpn"
      - "remote VTEP reachable but no host or prefix routes imported"
    log_signatures:
      - "%BGP-3-UNSUPPORTED_NEXTHOP"
      - "%BGP-3-BRIB_RDCLASH"
      - "%BGP-3-BRIB_RDADD"
      - "%BGP-5-NO_RD"
      - "%BGP-3-MISSING_ROUTERID"
      - "%BGP-3-IMPORT_VRF_EXCEED"
      - "%BGP-4-DUAL_RD_GENERATION_FAILED"
      - "%BGP-4-CFG_EVPN_ORIG_MAP_MISSING"
    likely_causes:
      - "route distinguisher missing or clashing"
      - "router ID removed, invalidating the auto-generated RD"
      - "route-target import/export mismatch, or the VRF import limit exceeded"
      - "the address family not negotiated with the peer (no supported AFI/SAFI)"
      - "next hop not reachable, or a VTEP address-family mismatch"
      - "the wrong VRF on the interface"
    commands:
      - {cmd: "show bgp l2vpn evpn", intent: bgp.evpn.table}
      - {cmd: "show bgp vpnv4 unicast", intent: bgp.vpnv4.table}
      - {cmd: "show ip bgp vpnv4 vrf all", intent: bgp.vpnv4.allvrf}
      - {cmd: "show bgp all summary vrf <vrf>", intent: bgp.summary.vrf, params: [vrf]}
      - {cmd: "show bgp vrf <vrf> ipv4 unicast", intent: bgp.vrf.table, params: [vrf]}
      - {cmd: "show ip route vrf all summary", intent: rib.summary.allvrf}
      - {cmd: "show vrf", intent: vrf.list}
      - {cmd: "show vrf interface", intent: vrf.interfaces}
      - {cmd: "show running-config bgp all", intent: bgp.config.all}
    tac_first_look: >-
      Verify the RD/RT pair and that the L2VPN EVPN (or VPNv4) address family is actually
      negotiated with the peer before looking at the overlay data plane.
    sources:
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/command_references/show_commands/b_N9K_Show_Commands_703i7x/b_N9K_Show_Commands_703i7x_chapter_010.html
      - https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/106x/configuration/unicast-routing-configuration/cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide/configuring-bgp.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/troubleshooting/guide/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x/b-cisco-nexus-9000-nx-os-troubleshooting-guide-93x_chapter_01001.html
      - https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-routing-10-6-2-f.html
