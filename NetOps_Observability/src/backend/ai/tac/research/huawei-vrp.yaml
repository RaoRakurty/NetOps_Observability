      - "`display stp abnormal-interface` lists ports in an abnormal state"
    log_signatures: []
    likely_causes:
      - "Devices on the network run different STP modes"
      - "MSTP devices are not in the same MST region"
      - "An edge port frequently receives TC BPDUs"
      - "Port status abnormal (root/loop protection, error-down)"
      - "TC BPDUs sent frequently across the network"
    commands:
      - {cmd: "display stp brief", intent: stp.brief, params: []}
      - {cmd: "display stp interface {interface}", intent: stp.interface, params: [interface]}
      - {cmd: "display stp region-configuration", intent: stp.region, params: []}
      - {cmd: "display stp abnormal-interface", intent: stp.abnormal-interfaces, params: []}
      - {cmd: "display stp tc-bpdu statistics", intent: stp.tc.statistics, params: []}
      - {cmd: "display stp topology-change", intent: stp.topology-change, params: []}
      - {cmd: "display error-down recovery", intent: interface.error-down, params: []}
      - {cmd: "display logbuffer", intent: logging.recent, params: []}
    tac_first_look: "`display stp region-configuration` on every device — one mismatched region name/revision explains most 'MSTP does not converge' cases; `display stp abnormal-interface` and `display error-down recovery` explain a single stuck port."
