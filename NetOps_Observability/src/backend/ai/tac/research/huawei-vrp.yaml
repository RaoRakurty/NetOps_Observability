    log_signatures: []
    likely_causes:
      - "Route to the server is unreachable, so no UDP connection can be established"
      - "The RADIUS service is not enabled"
      - "RADIUS authentication is not configured in the AAA authentication scheme"
      - "Server IP address, port or source interface configured incorrectly"
      - "Shared key mismatch between the device and the RADIUS server"
