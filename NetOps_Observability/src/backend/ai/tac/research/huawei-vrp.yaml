  - id: vrp-snmp-connection-fails
    class: snmp
    proposed_class: true
    title: "SNMP connection between the NMS and the device cannot be established"
    symptoms:
      - "NMS cannot poll the device; authentication failure logs on the device"
      - "Community/USM user configured on the device does not match the NMS"
    log_signatures:
      - "AUTHENTICATION_FAILURE"
      - "SNMP_AUTHEN_FAILED"
    likely_causes:
      - "Packets cannot be exchanged between the host and the NMS (route/ACL)"
      - "SNMP configuration is incorrect (community, USM user, version mismatch)"
      - "An ACL on the SNMP agent blocks the NMS address"
    commands:
      - {cmd: "display snmp-agent sys-info version", intent: snmp.version, params: []}
      - {cmd: "display snmp-agent community", intent: snmp.community, params: []}
      - {cmd: "display snmp-agent usm-user", intent: snmp.usm-user, params: []}
      - {cmd: "display acl all", intent: acl.all, params: []}
      - {cmd: "display logbuffer", intent: logging.recent, params: []}
      - {cmd: "display current-configuration", intent: config.running, params: []}
    tac_first_look: "`display snmp-agent sys-info version` first — a v2c NMS against a v3-only agent is the commonest cause; then the community/USM lists and any ACL bound to the agent, with `ping <nms-ip>` to prove reachability."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/b62ef2c2/case-study-snmp-connection-fails-to-be-established"
