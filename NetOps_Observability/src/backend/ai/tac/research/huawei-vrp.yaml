  - id: vrp-radius-auth-fails
    class: aaa-auth
    proposed_class: true
    title: "Administrator fails RADIUS authentication / RADIUS server does not respond"
    symptoms:
      - "`display aaa online-fail-record all` shows 'The radius server is not reachable' or 'The radius server is up but has no reply'"
