  - id: vrp-recent-config-change
    class: config-change
    title: "Fault correlates with a recent configuration change or a failed configuration restore"
    symptoms:
      - "Symptom onset matches the last commit time"
      - "`display configuration recover-result` reports a partial or failed restore after a reboot"
      - "Running and saved configurations diverge"
    log_signatures:
      - "CLI/5/CMDRECORD"
    likely_causes:
      - "A commit within the last 12 hours changed protocol or interface configuration"
      - "Configuration restore after a restart partially failed"
      - "Running configuration was never saved, so a reload reverted it"
    commands:
      - {cmd: "display configuration commit list", intent: config.commit.history, params: []}
      - {cmd: "display configuration commit changes", intent: config.commit.diff, params: []}
      - {cmd: "display configuration recover-result", intent: config.restore-result, params: []}
      - {cmd: "display current-configuration", intent: config.running, params: []}
      - {cmd: "display saved-configuration", intent: config.startup, params: []}
      - {cmd: "display startup", intent: platform.boot-config, params: []}
      - {cmd: "display logbuffer", intent: logging.recent, params: []}
    tac_first_look: "Huawei's mandatory check is whether the last configuration change happened within the last 12 hours — `display configuration commit list` then `display configuration commit changes`; `display configuration recover-result` catches the post-reboot partial-restore case."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/974004b2/collecting-fault-information-using-query-commands"
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100313446/4f578bc5/display-commands"

  - id: vrp-traffic-policy-drops
