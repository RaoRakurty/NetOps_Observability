    title: "Packets discarded by a traffic policy / interface drop counters rising"
    symptoms:
      - "`display traffic policy statistics interface <if> inbound` shows a rising discard count"
      - "Interface DropEvents / lostpacket counters rise while the link stays up"
      - "Only some flows are affected"
    log_signatures: []
    likely_causes:
      - "A traffic policy (MQC) classifier matches and denies or rate-limits the flow"
      - "Interface-level rate limiting or congestion"
      - "Control-plane traffic metered by cpu-defend rather than the data path"
    commands:
      - {cmd: "display traffic policy statistics interface {interface} inbound", intent: qos.policy.statistics, params: [interface]}
      - {cmd: "display interface {interface}", intent: interface.detail, params: [interface]}
      - {cmd: "display interface brief", intent: interface.summary, params: []}
      - {cmd: "display current-configuration", intent: config.running, params: []}
      - {cmd: "display cpu-defend statistics all", intent: cpp.statistics, params: []}
    tac_first_look: "Decide first whether the drops are in the data path or the control path: `display traffic policy statistics interface <if> inbound` accounts for policy matches, while `display cpu-defend statistics all` accounts for punted-packet drops — Huawei's ping-failure procedure uses exactly this split."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/3003cee5/case-study-the-ping-operation-fails"
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100313446/e1bbef8/case-study-crc-error-packets-are-generated-on-an-interface-due-to-a-network-cable-fault"

