  - id: vrp-mstp-topology-change-service-interruption
    class: stp-topology
    proposed_class: true
    title: "Services interrupted by repeated MSTP topology changes (TC storms)"
    symptoms:
      - "MAC/ARP tables flush repeatedly; brief traffic loss every few seconds"
      - "`display stp tc-bpdu statistics` counter rises steadily"
    log_signatures: []
    likely_causes:
      - "Incorrect MSTP configuration (region mismatch, missing edge-port config)"
      - "Physical link flapping triggering a stream of TC BPDUs"
      - "An MSTP-enabled device receiving TC BPDUs from a client or transparently transmitted TC BPDUs"
    commands:
      - {cmd: "display stp brief", intent: stp.brief, params: []}
      - {cmd: "display stp region-configuration", intent: stp.region, params: []}
      - {cmd: "display stp tc-bpdu statistics", intent: stp.tc.statistics, params: []}
      - {cmd: "display stp topology-change", intent: stp.topology-change, params: []}
      - {cmd: "display current-configuration", intent: config.running, params: []}
      - {cmd: "display logbuffer", intent: logging.recent, params: []}
    tac_first_look: "Find the port with the growing TC counter in `display stp tc-bpdu statistics`, then decide from `display stp topology-change` and `display logbuffer` whether the trigger is a flapping link or a downstream device injecting TCs."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100313446/5c72531e/services-are-interrupted-due-to-an-mstp-topology-change"

  - id: vrp-ping-fails-packet-loss
    class: generic
    title: "Ping fails or shows packet loss between two endpoints"
    symptoms:
      - "Ping times out entirely, or loses a fraction of packets"
      - "Large packets fail while small ones succeed"
      - "Failure only inside a VPN instance"
    log_signatures: []
    likely_causes:
      - "No route to the destination, or the route is inactive"
      - "ARP entry missing for the next hop"
      - "A traffic policy / ACL discards the ICMP packets"
      - "CPCAR (cpu-defend) rate-limits ICMP to the control plane"
      - "MTU on the path is smaller than the packet size"
      - "Interface errors on an intermediate link"
    commands:
      - {cmd: "display ip routing-table {destination}", intent: route.prefix, params: [destination]}
      - {cmd: "display ip routing-table vpn-instance {vrf} {destination}", intent: route.prefix.vrf, params: [vrf, destination]}
      - {cmd: "display arp", intent: arp.table, params: []}
      - {cmd: "display arp interface {interface}", intent: arp.interface, params: [interface]}
      - {cmd: "display interface {interface}", intent: interface.detail, params: [interface]}
      - {cmd: "display icmp statistics", intent: icmp.statistics, params: []}
      - {cmd: "display ip statistics", intent: ip.statistics, params: []}
      - {cmd: "display traffic policy statistics interface {interface} inbound", intent: qos.policy.statistics, params: [interface]}
      - {cmd: "display current-configuration | include cpu-defend", intent: config.cpu-defend.grep, params: []}
      - {cmd: "display cpu-defend policy {policy-id}", intent: cpp.policy, params: [policy-id]}
      - {cmd: "display cpu-defend car", intent: cpp.car, params: []}
    tac_first_look: "Huawei's own procedure uses the diagnostics themselves: `ping -v -t 1 <dest>`, `ping -f` and `tracert <dest>` (also `tracert -vpn-instance <vrf> <dest>`) to localise the hop, then `display ip routing-table <dest>`, `display arp` and `display icmp statistics` at that hop; a traffic policy or cpu-defend CAR is checked last."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/3003cee5/case-study-the-ping-operation-fails"

  - id: vrp-mtu-mismatch
    class: interface-errors
    title: "MTU mismatch between the two ends of a link"
    symptoms:
      - "Small packets pass, large packets are dropped"
      - "OSPF sticks in ExStart/Exchange; IS-IS adjacency never forms"
      - "The Maximum Transmit Unit values differ between `display interface` on the two ends"
    log_signatures:
      - "ISIS/2/ISIS_ID_LEN_MISMATCH"
      - "OSPF/6/NBR_CHANGE"
    likely_causes:
      - "Interface MTU configured differently on the two ends"
      - "Interface MTU smaller than the protocol's Hello/DD packet"
      - "MTU changed during a service cutover without matching the peer"
    commands:
      - {cmd: "display interface {interface}", intent: interface.detail, params: [interface]}
      - {cmd: "display current-configuration interface {interface}", intent: config.interface, params: [interface]}
      - {cmd: "display isis error interface {interface}", intent: isis.errors.interface, params: [interface]}
      - {cmd: "display ospf interface", intent: ospf.interfaces, params: []}
    tac_first_look: "Huawei's routine-maintenance rule is blunt: the MTU value of the local interface must equal the peer's — read 'The Maximum Transmit Unit is ...' from `display interface` on both ends, and confirm with `ping -s 1500 <peer>` from the OSPF procedure."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/5117dc64/reference-maintenance-items-and-operations"
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/8a238899/case-study-an-is-is-neighbor-relationship-cannot-be-established"
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/8d7c113f/case-study-an-ospf-neighbor-relationship-cannot-reach-the-full-state"

  - id: vrp-arp-entries-not-learned
    class: arp-nd
    proposed_class: true
    title: "ARP entries on the local device are not learned by the peer"
    symptoms:
      - "The peer has no ARP entry for the local interface address"
      - "ARP entries age out and are relearned repeatedly"
      - "`display arp statistics slot <slot>` shows abnormal counts"
    log_signatures: []
    likely_causes:
      - "The connecting interface is not physically Up"
      - "Interface IP addresses on the two ends are in different network segments"
      - "The device is under an ARP attack (CPCAR discarding ARP)"
      - "Link transmission is unstable or optical power is insufficient"
      - "Device software fault"
    commands:
      - {cmd: "display arp", intent: arp.table, params: []}
      - {cmd: "display arp interface {interface}", intent: arp.interface, params: [interface]}
      - {cmd: "display arp statistics slot {slot-id}", intent: arp.statistics.slot, params: [slot-id]}
      - {cmd: "display arp history", intent: arp.history, params: []}
      - {cmd: "display arp ip-conflict track", intent: arp.conflicts, params: []}
      - {cmd: "display ipv6 neighbors history", intent: nd.history, params: []}
      - {cmd: "display interface {interface}", intent: interface.detail, params: [interface]}
      - {cmd: "display cpu-defend statistics all", intent: cpp.statistics, params: []}
    tac_first_look: "`display arp history` and `display arp ip-conflict track` are Huawei's own flap-detection pair — they show whether entries were repeatedly deleted; `display arp statistics slot <slot>` then says whether the ARP packets ever reached the CPU."
    sources:
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/5cdfaa40/case-study-the-arp-entries-on-the-local-device-cannot-be-learned-by-the-peer"
      - "https://support.huawei.com/enterprise/en/doc/EDOC1100280260/974004b2/collecting-fault-information-using-query-commands"

  - id: vrp-ntp-clock-not-synchronized
    class: ntp-sync
