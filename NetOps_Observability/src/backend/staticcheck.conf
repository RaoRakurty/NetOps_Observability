# Keep the bare `staticcheck ./...` gate (CLAUDE.md §12) in agreement with the
# golangci-lint gate (.golangci.yml). ST1005 is excluded for the same reason it
# is excluded there: our error strings are user-facing HTTP messages that
# legitimately begin with proper nouns (Iris, Slack, PagerDuty, Jira). All SA*
# correctness checks stay fully enabled.
checks = ["inherit", "-ST1005"]
