# Static device inventory — containerlab "clos-multivendor" fabric (172.40.40.0/24).
#
# SNMP community/credentials are configured in the GUI (Administration → SNMP
# Credentials) as profiles; each device references one via `credential_ref`
# (the slug of the profile name, e.g. "arista-v2c"). The `snmp_community` label
# is a fallback if no profile is assigned. Reachability requires the stack host
# (.122) to route 172.40.40.0/24 via .120.
devices:
  spine1:
    address: 172.40.40.11
    preferred_protocol: snmp
    vendor: nokia
    credential_ref: nokia-v2c
    labels:
      site: clos-lab
      role: spine
      snmp_community: srl-public
  spine2:
    address: 172.40.40.12
    preferred_protocol: snmp
    vendor: nokia
    credential_ref: nokia-v2c
    labels:
      site: clos-lab
      role: spine
      snmp_community: srl-public
  leaf1:
    address: 172.40.40.21
    preferred_protocol: snmp
    vendor: arista
    credential_ref: arista-v2c
    labels:
      site: clos-lab
      role: leaf
      snmp_community: arista-public
  leaf2:
    address: 172.40.40.22
    preferred_protocol: snmp
    vendor: arista
    credential_ref: arista-v2c
    labels:
      site: clos-lab
      role: leaf
      snmp_community: arista-public
  leaf3:
    address: 172.40.40.23
    preferred_protocol: snmp
    vendor: arista
    credential_ref: arista-v2c
