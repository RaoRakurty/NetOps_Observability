global:
  # 30s is ample for stack self-observability and halves scrape/series churn;
  # every alert range window is >=5m (>=10 samples per window) so no rule
  # loses resolution (#96d).
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ---- stack self-monitoring -------------------------------------------------
  # cAdvisor: per-CONTAINER cpu / memory / network / restart / OOM for EVERY
  # service in the stack (reads the docker runtime) — the backbone for the
  # resource-exhaustion + restart-loop alerts. One scrape covers all containers.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # node-exporter: host cpu / memory / disk / load / filesystem.
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # ---- application + data tier (native /metrics) -----------------------------
  - job_name: 'netops-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'victoria'
    static_configs:
      - targets: ['victoria:8428']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    # Grafana serves under the /grafana sub-path (serve_from_sub_path), so its
    # /metrics is exposed there too.
    metrics_path: '/grafana/metrics'

  # Redpanda exposes Prometheus metrics on the admin port 9644
  # (/public_metrics = curated, /metrics = full internal).
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: '/public_metrics'

  # ClickHouse native Prometheus endpoint (enabled via <prometheus> in config).
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']

  # Vector internal metrics (both aggregator + router expose a prometheus
  # exporter on :9598 — see each vector.yaml internal_metrics source).
  - job_name: 'vector'
    static_configs:
      - targets: ['vector-aggregator:9598', 'vector-router:9598']
