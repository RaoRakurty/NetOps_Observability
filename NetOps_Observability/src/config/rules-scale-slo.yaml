# Scale SLO alert rules (GA readiness) — evaluated by vmalert ONLY.
#
# Companion to rules.yaml. Loaded via an additional -rule= flag on the vmalert
# service (docker-compose.yml AND compose.tls.yml — the TLS variant replaces
# the whole `command:` list, so both carry the flag). The in-API engine
# (RULES_FILE=/config/rules.yaml) does NOT read this file: every rule here is
# a platform-scale SLO, not a tenant-facing NOC alert, and it must keep firing
# when the api itself is the thing that is drowning.
#
# Thresholds are tied to the MEASURED L0/L1 ceilings in
# docs/scale/CORRELIX_SCALE_TEST_REPORT.md (4 vCPU / 16 GiB rig):
#   - correlation engine processes ~850–1,050 events/s (single event loop);
#     consumer-group lag therefore converts to RCA staleness at ~1k msg/s.
#   - Kafka lag grew unbounded under 8k EPS (peak ~3.1M) and drained ~10k/s
#     once input stopped; disk drained ~3 GB during that run (~1 h to full).
#   - VictoriaMetrics idled at ~21k active hourly series; cardinality was NOT
#     pushed on the L1 rig, so the growth alert is a change-detector, not a cap.
# Every metric name below was verified against the live stack (VM
# /api/v1/query) or this branch's exposition code — none is invented.
#
# Each alert's `runbook` annotation anchors into
# docs/ops/OBSERVABILITY_AUDIT.md — the operator first-response plays.

groups:

  - name: scale-slo
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # RCA staleness budget (bus → correlation). kafka_consumergroup_lag_sum
      # comes from the kafka-exporter sidecar (self-monitoring add-on;
      # KafkaLagMetricsMissing in rules.yaml meta-alerts its absence).
      # Measured: correlation drains ~1k events/s, so lag ≈ seconds of RCA
      # staleness / 1000. 60k lag ≈ 1 min behind; 300k ≈ 5 min behind.
      # The generic bus alerts (bus-consumer-lag group) watch every group;
      # these two watch the SLOWEST, highest-value consumer specifically.
      # ------------------------------------------------------------------
      - alert: CorrelationRcaLagBudgetWarning
        expr: sum(kafka_consumergroup_lag_sum{consumergroup="netops-correlation"}) > 60000
        for: 5m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "RCA pipeline is ~{{ $value }} events behind (≈1+ min of incident-detection staleness at the measured ~1k evt/s drain rate)"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-consumer-lag"

      - alert: CorrelationRcaLagBudgetBreached
        expr: sum(kafka_consumergroup_lag_sum{consumergroup="netops-correlation"}) > 300000
        for: 5m
        labels: { severity: critical, layer: correlation, slo: scale }
        annotations:
          summary: "RCA staleness SLO breached: correlation is {{ $value }} events behind (≥5 min at ~1k evt/s). Storage stays current; RCA does not."
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-consumer-lag"

      # ------------------------------------------------------------------
      # VictoriaMetrics ingestion health. Slow inserts = the active-series
      # working set no longer fits the fast path (VM's own guidance: sustained
      # >5% means cardinality/memory pressure). Verified live: both counters
      # exist (vm_slow_row_inserts_total, vm_rows_inserted_total).
      # ------------------------------------------------------------------
      - alert: VMSlowInsertRatioHigh
        expr: >
          rate(vm_slow_row_inserts_total[5m])
            / clamp_min(sum(rate(vm_rows_inserted_total[5m])), 1) > 0.05
        for: 15m
        labels: { severity: warning, layer: metrics, slo: scale }
        annotations:
          summary: "VictoriaMetrics slow-insert ratio {{ $value | humanizePercentage }} (>5% for 15m) — active series exceed the memory fast path"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-vm-series-growth"

      # Active-series surge (cardinality explosion). The hourly active-series
      # gauge is vm_cache_entries{type="storage/hour_metric_ids"} (~21k idle
      # on the L1 rig). +100k in one hour is never organic on a single-node
      # bundle — it is a label-cardinality bug or a discovery storm.
      - alert: VMActiveSeriesSurge
        expr: delta(vm_cache_entries{type="storage/hour_metric_ids"}[1h]) > 100000
        for: 10m
        labels: { severity: warning, layer: metrics, slo: scale }
        annotations:
          summary: "VictoriaMetrics active series grew by {{ $value }} in 1h — cardinality explosion (bad label, discovery storm, or scrape misconfig)"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-vm-series-growth"

      # ------------------------------------------------------------------
      # Correlation internal queue depths (engine-side, distinct from bus lag).
      # corr_window_signals is the in-memory correlation window buffer; its
      # deque cap is max(50000, CORR_WINDOW_BUFFER) — at the cap, oldest
      # signals are silently evicted before correlation. Verified live.
      # ------------------------------------------------------------------
      - alert: CorrWindowBufferNearCap
        expr: corr_window_signals > 40000
        for: 10m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation window buffer at {{ $value }} signals (cap floor 50k) — nearing silent eviction of oldest signals"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-queues"

      # Batched corr_signals writer backlog. pending>0 is normal (≤2 s of
      # traffic); a sustained multi-thousand backlog means ClickHouse inserts
      # cannot keep pace. NOTE: corr_signal_batch_pending ships with this
      # branch's correlation build — on an older deployed image the series is
      # absent and this rule is a silent no-op (never false-fires).
      - alert: CorrSignalBatchBacklog
        expr: corr_signal_batch_pending > 5000
        for: 10m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "corr_signals batch writer backlog {{ $value }} rows for 10m — ClickHouse insert path not keeping up"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-queues"

      # Rows a REJECTED ClickHouse batch parked in the durable DLQ: the write
      # path is doing its durability job, but those rows are missing from
      # netops.corr_signals until replayed. Same branch-build note as above.
      - alert: CorrSignalRowsQuarantined
        expr: increase(corr_signal_batch{event="rows_quarantined"}[15m]) > 0
        for: 1m
        labels: { severity: critical, layer: correlation, slo: scale }
        annotations:
          summary: "{{ $value }} corr_signals rows parked in the durable DLQ in 15m — ClickHouse rejected a batch; rows need replay"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-dlq"

      # ------------------------------------------------------------------
      # Consumer-group membership + event-loop health (Phase 1 contract,
      # main.py:4628-4663). All five metric names were read from that
      # exposition code on this branch — none is inferred from a design doc.
      #
      # corr_consumer_state is a FOUR-valued gauge carrying 1 for the current
      # state and 0 for the other three, so match on the label and compare to
      # 1 — never string-compare the value.
      #
      # TWO SEMANTICS THESE RULES MUST NOT VIOLATE (engine docstring):
      #   * "cold_window" is a TIME-BASED PROXY for "the sliding window has not
      #     had time to refill". It is NOT a measurement of carried-over state,
      #     so it means RCA is temporarily DEGRADED (thin), never WRONG.
      #   * "active" does NOT mean "no state was lost". Tracker 155 is open:
      #     OPEN_OBJECTS has no rehydration path, so merges and continuations
      #     whose open objects lived in another replica's memory are simply
      #     gone, and no elapsed time repairs them. No rule or annotation here
      #     may imply active ⇒ correct.
      # ------------------------------------------------------------------

      # A replica that joined the group and holds nothing. Before this state
      # existed it serialized to `{}` — byte-identical to "pending" — and read
      # as healthy. 15m is deliberately well past any rebalance transient.
      - alert: CorrelationReplicaIdle
        expr: corr_consumer_state{state="idle"} == 1
        for: 15m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation replica {{ $labels.instance }} is alive and joined but holds ZERO partitions — it is consuming nothing"
          description: >-
            The replica is healthy as a process; it simply has no work. With the
            range assignor, replicas beyond BUS_PARTITIONS are assigned an empty
            set and consume nothing for as long as they run. Compare the
            correlation replica count against BUS_PARTITIONS. EITHER action can
            be the right one: scaling the surplus replicas down costs nothing
            and is often correct. Raising BUS_PARTITIONS is raise-only, needs a
            controlled drain, and is currently gated — see
            docs/scale-correlation.md and tracker 155 before choosing it.
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-consumer-lag"

      # Lag past the RCA budget while EVERY reporting replica already holds
      # work. This bounds what more replicas could achieve; it does NOT
      # diagnose the cause. The 2026-08-17 P1 was exactly this shape — full
      # assignment, high lag — and the cause was event-loop blocking on giant
      # object serialization, not partition count.
      - alert: CorrelationLagWhileFullyAssigned
        expr: |
          sum(kafka_consumergroup_lag_sum{consumergroup="netops-correlation"}) > 60000
          and on() (min(corr_consumer_owned_partitions) > 0)
        for: 15m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation is {{ $value }} events behind while every reporting replica holds partitions — adding replicas alone cannot add parallelism"
          description: >-
            This says only that consumer parallelism is capped: a group cannot
            have more active members than partitions, and every replica that is
            REPORTING already owns at least one. It does NOT establish that the
            partition count is the bottleneck, and raising partitions may fix
            nothing. Investigate in this order BEFORE changing topology —
            corr_loop_lag_stalls_total and corr_loop_lag_max_ms (event-loop
            starvation), per-partition lag skew (a hot tenant pins one
            partition and more partitions will not move it), downstream
            persistence latency (ClickHouse/OpenSearch insert path),
            corr_consumer_revoke_commits_total{outcome!="ok"} (rebalance churn),
            CPU saturation, and broker health. Also confirm no replica is DOWN:
            a stopped replica reports no series at all, which this expression
            cannot see.
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-consumer-lag"

      # The leading indicator for the whole thrash class, and the regression
      # guard for the 2026-08-17 P1 fix (giant-object serialization offloaded
      # off the loop). If this rises, the loop is being starved again — expect
      # heartbeat/commit failures to follow rather than precede it.
      - alert: CorrelationEventLoopStalling
        expr: increase(corr_loop_lag_stalls_total[15m]) > 0
        for: 5m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation event loop stalled {{ $value }} time(s) in 15m on {{ $labels.instance }} — check corr_loop_lag_max_ms for the worst drift"
          description: >-
            Loop-lag samples exceeded the warn threshold, meaning coroutines
            were not scheduled on time. aiokafka runs heartbeat and coordinator
            work as background asyncio tasks, so sustained starvation expires
            group membership WITHOUT any single long call — cumulative delay is
            sufficient. Do NOT respond by raising session/heartbeat/max-poll
            timeouts: that hides the stall rather than fixing it. Find the
            blocking work (CPU-bound serialization, synchronous IO) and move it
            off the loop. KNOWN RESIDUAL (tracker 156): on the current build,
            giant correlation objects still drive stalls of roughly 1.0-1.3 s
            via _archive_slice/slice_hash, which run on the loop and are sized
            by the whole window rather than by the object. Measured live at
            1,171 nodes / 54,999 edges. That is BOUNDED, not benign — 1,256 ms
            is 4.2% of the 30 s session timeout and under the 3 s heartbeat
            interval, which is why membership survived with zero involuntary
            rebalances. So a firing of this alert may be that known cause: check
            corr_loop_lag_max_ms against ~1.3 s. Anything materially larger, or
            any involuntary rebalance alongside it, is NOT tracker 156 and means
            a new on-loop blocker. Do not silence or raise this threshold to
            accommodate 156 — when 156 is fixed the correct result is zero.
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-queues"

      # Revoke-hook outcomes other than "ok". "skipped" means the flush missed
      # its 5s budget so the offsets were deliberately NOT committed
      # (replay-safe by design); "failed" means the flush or commit errored.
      # Either, sustained, means the group is rebalancing repeatedly.
      - alert: CorrelationRebalanceChurn
        expr: increase(corr_consumer_revoke_commits_total{outcome=~"failed|skipped"}[30m]) > 3
        for: 10m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation rebalance churn on {{ $labels.instance }}: {{ $value }} revoke-hook {{ $labels.outcome }} outcomes in 30m"
          description: >-
            Each of these is individually safe — uncommitted offsets are
            redelivered and dedup absorbs the replay — but repetition means the
            group is not settling. Every rebalance also moves partitions, and
            per tracker 155 the acquiring replica starts with none of those
            tenants' in-flight correlation state, so churn carries a silent
            accuracy cost beyond the redelivery. Check
            corr_loop_lag_stalls_total first: loop starvation causes churn far
            more often than the reverse.
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-queues"

      # A replica should leave cold_window after one engine window. Staying
      # there means it keeps re-acquiring partitions, i.e. churn seen from the
      # RCA-quality side rather than the offset side.
      - alert: CorrelationWindowStaysCold
        expr: corr_consumer_state{state="cold_window"} == 1
        for: 30m
        labels: { severity: warning, layer: correlation, slo: scale }
        annotations:
          summary: "Correlation replica {{ $labels.instance }} has stayed in cold_window for 30m — RCA for its tenants is persistently thin"
          description: >-
            cold_window is a TIME-BASED PROXY: at least one owned partition was
            acquired less than one engine window ago, so its tenants' sliding
            window has not refilled. RCA for those tenants is DEGRADED (thin
            evidence), not wrong. Normally this clears by itself within one
            window, so persistence means partitions keep moving — investigate
            rebalance churn. Note the honest limit (tracker 155): this metric
            reports only that the window has not refilled. It cannot report the
            deeper loss — merges and continuations whose open objects lived in
            the previous owner's memory are gone, and elapsed time does not
            repair them. Reaching "active" is therefore NOT evidence that no
            state was lost.
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-correlation-queues"

      # ------------------------------------------------------------------
      # OpenSearch RED (or unreachable/unparsable health). Vector's health
      # poll maps green/yellow/red/unknown → 0/1/2/3 (vector.yaml
      # opensearch_health_vm). Yellow is already alerted at warning by
      # OpenSearchClusterNotGreen (rules.yaml); RED means a primary shard is
      # gone and writes to it FAIL — that is a page, not a ticket.
      # ------------------------------------------------------------------
      - alert: OpenSearchClusterRed
        expr: opensearch_cluster_status >= 2
        for: 5m
        labels: { severity: critical, layer: storage, slo: scale }
        annotations:
          summary: "OpenSearch cluster status is {{ $labels.status_text }} — primary shard(s) unavailable, log/event writes are failing"
          runbook: "docs/ops/OBSERVABILITY_AUDIT.md#runbook-opensearch-red"

      # NOTE (deliberate absence): "correlation dead-letter WRITE failures"
      # (QUARANTINE_WRITE_FAILURES — the 238k-drop incident in the scale
      # report) has NO Prometheus exposition today; it is only in the
      # /healthz JSON (durability.quarantine_write_failures). Per the audit
      # doc §9, that signal is covered by scripts/stack-watchdog.sh, not by an
      # invented metric. corr_deadletters (engine dead-letter COUNT) is
      # already alerted by CorrDeadLettersRising in rules.yaml.
