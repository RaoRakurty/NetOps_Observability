# promtool unit tests for CredentialRotationIncomplete (tracker 367 layer 3,
# rules-scale-slo.yaml group credential-hygiene).
#
# The rule is PRESENCE-based: vmauth exports a cred="previous" per-user series
# exactly while install.py --rotate-secret holds an identity in its overlap
# state. These cases pin both stuck shapes (still used / abandoned), the
# healthy rotation that must stay silent, and steady state.
rule_files:
  - /etc/prometheus/rules-scale-slo.yaml

evaluation_interval: 1m

tests:
  # 1) A client keeps presenting the old password: the overlap stands > 1h.
  - interval: 1m
    input_series:
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-gnmic-previous",cred="previous"}'
        values: "0+4x90"
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-gnmic",cred="current"}'
        values: "0+1x90"
    alert_rule_test:
      - eval_time: 50m
        alertname: CredentialRotationIncomplete
        exp_alerts: []
      - eval_time: 75m
        alertname: CredentialRotationIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: platform
              tier: warning
              username: svc-gnmic-previous
            exp_annotations:
              summary: "vmauth still accepts the PREVIOUS credential svc-gnmic-previous more than an hour into a rotation"
              description: "A zero-downtime credential rotation (install.py --rotate-secret) has held vmauth in its overlap state for over an hour, so the old password is still accepted. Read rate(vmauth_user_requests_total{cred=\"previous\"}[5m]) for this username. Above zero, a client is still presenting the old password and the rotation stopped on purpose with both valid; find that client, fix or restart it. Zero, the rotation was interrupted and nobody finished it. Either way re-run install.py --rotate-secret with the same name: it resumes from .env, proves the drain and revokes the old password."
              runbook: "docs/runbooks/secret-rotation.md#9-zero-downtime-rotation-of-the-vmauth-credentials"

  # 2) Abandoned overlap: NO traffic on the old password, yet the block is
  #    still loaded. Must fire too — this is why the rule is not rate-based.
  - interval: 1m
    input_series:
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-api-previous",cred="previous"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 75m
        alertname: CredentialRotationIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: platform
              tier: warning
              username: svc-api-previous
            exp_annotations:
              summary: "vmauth still accepts the PREVIOUS credential svc-api-previous more than an hour into a rotation"
              description: "A zero-downtime credential rotation (install.py --rotate-secret) has held vmauth in its overlap state for over an hour, so the old password is still accepted. Read rate(vmauth_user_requests_total{cred=\"previous\"}[5m]) for this username. Above zero, a client is still presenting the old password and the rotation stopped on purpose with both valid; find that client, fix or restart it. Zero, the rotation was interrupted and nobody finished it. Either way re-run install.py --rotate-secret with the same name: it resumes from .env, proves the drain and revokes the old password."
              runbook: "docs/runbooks/secret-rotation.md#9-zero-downtime-rotation-of-the-vmauth-credentials"

  # 3) A healthy rotation: the previous series lives ~12 min, then the block
  #    is revoked and the series goes stale. Silent throughout.
  - interval: 1m
    input_series:
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-api-previous",cred="previous"}'
        values: "0+3x6 21x6 _x80"
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-api",cred="current"}'
        values: "0+5x92"
    alert_rule_test:
      - eval_time: 30m
        alertname: CredentialRotationIncomplete
        exp_alerts: []
      - eval_time: 90m
        alertname: CredentialRotationIncomplete
        exp_alerts: []

  # 4) Steady state (only cred="current" series): silent.
  - interval: 1m
    input_series:
      - series: 'vmauth_user_requests_total{job="vmauth",instance="vmauth:8427",username="svc-vmalert",cred="current"}'
        values: "0+2x120"
    alert_rule_test:
      - eval_time: 110m
        alertname: CredentialRotationIncomplete
        exp_alerts: []
