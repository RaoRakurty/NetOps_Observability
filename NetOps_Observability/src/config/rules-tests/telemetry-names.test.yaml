# promtool unit tests for the telemetry-names group (rules-scale-slo.yaml, warning
# tier, tracker 387 PR 13). Values, not presence:
#   * an exporter uncovered for 2 h fires; one covered after 1 h never does;
#   * "not measured" (-1) never fires, though the series is present;
#   * a trap lane mostly basis="none" fires; a mostly-attributed lane and a lane
#     below the volume floor stay silent.
rule_files:
  - /etc/prometheus/rules-scale-slo.yaml

evaluation_interval: 1m

tests:
  # 1) Two exporters without names, for longer than the hold.
  - interval: 1m
    input_series:
      - series: 'netops_iface_names_exporters_uncovered{job="netops-api",instance="api:8080"}'
        values: "2x200"
    alert_rule_test:
      - eval_time: 100m
        alertname: FlowExporterWithoutInterfaceNames
        exp_alerts: []
      - eval_time: 130m
        alertname: FlowExporterWithoutInterfaceNames
        exp_alerts:
          - exp_labels:
              alertname: FlowExporterWithoutInterfaceNames
              severity: warning
              tier: warning
              layer: ingest
            exp_annotations:
              summary: "2 flow exporter(s) have sent flows for 2 hours with no interface name"
              description: "The flows views show these exporters' interfaces as bare ifIndex numbers. Names come from the device's IF-MIB walk (and, once tracker 387 PR 13a lands, from the controller). The usual cause is a device that answers no SNMP walk, or one whose flow source address is not its inventory address."
              runbook: "docs/runbooks/telemetry-names.md#flowexporterwithoutinterfacenames"

  # 2) Covered after an hour, and "not measured": never fires.
  - interval: 1m
    input_series:
      - series: 'netops_iface_names_exporters_uncovered{job="netops-api",instance="api:8080"}'
        values: "1x60 0x140"
      - series: 'netops_iface_names_exporters_uncovered{job="netops-api",instance="api:8081"}'
        values: "-1x200"
    alert_rule_test:
      - eval_time: 190m
        alertname: FlowExporterWithoutInterfaceNames
        exp_alerts: []

  # 3) 85 % of traps reach no device (the lab before 13c').
  - interval: 1m
    input_series:
      - series: 'netops_trap_attribution_events{job="vector-router",basis="none",outcome="unmatched"}'
        values: "0+12x120"
      - series: 'netops_trap_attribution_events{job="vector-router",basis="mgmt_ip",outcome="platform_owned"}'
        values: "0+2x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: TrapSourceUnattributedRatioHigh
        exp_alerts: []
      - eval_time: 70m
        alertname: TrapSourceUnattributedRatioHigh
        exp_alerts:
          - exp_labels:
              alertname: TrapSourceUnattributedRatioHigh
              severity: warning
              tier: warning
              layer: ingest
            exp_annotations:
              summary: "85.71% of SNMP traps reach no device"
              description: "These traps are stored under their source address, and RCA cannot bind them to a device. A device trapping from an address that is neither its management address nor a unique interface address it reports, a community that does not match, or a device that answers no SNMP walk are the usual causes."
              runbook: "docs/runbooks/telemetry-names.md#trapsourceunattributedratiohigh"

  # 4) Mostly attributed (interface_ip did its job): silent.
  - interval: 1m
    input_series:
      - series: 'netops_trap_attribution_events{job="vector-router",basis="none",outcome="unmatched"}'
        values: "0+2x120"
      - series: 'netops_trap_attribution_events{job="vector-router",basis="interface_ip",outcome="platform_owned"}'
        values: "0+12x120"
    alert_rule_test:
      - eval_time: 110m
        alertname: TrapSourceUnattributedRatioHigh
        exp_alerts: []

  # 5) All unattributed but below the volume floor: silent.
  - interval: 1m
    input_series:
      - series: 'netops_trap_attribution_events{job="vector-router",basis="none",outcome="unmatched"}'
        values: "0+0.5x120"
    alert_rule_test:
      - eval_time: 110m
        alertname: TrapSourceUnattributedRatioHigh
        exp_alerts: []
