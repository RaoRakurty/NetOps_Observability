# NetOps alerting rules — Prometheus rules-file subset consumed by the Go alert
# engine (src/backend/alerts/engine.go parseRulesYAML). Each `expr` is sent
# verbatim to VictoriaMetrics /api/v1/query, so full PromQL/MetricsQL is allowed
# (rate, clamp_min, avg_over_time, stddev_over_time, predict_linear, changes,
# delta, increase, count by, and/or/unless). A rule fires when the query returns
# ≥1 series, so every expr ends in a comparison.
#
# NOTE on the parser: it reads block-style labels only (severity: under labels:)
# and strips trailing # comments — so the [NEEDS METRIC] notes below are
# documentation; those rules reference telemetry the collectors do not emit yet,
# so they simply never fire until the metric exists (see
# docs/research/noc-alert-rules.md §2.4). ~33 of these fire on metrics we collect
# today; the rest are forward-compatible.
#
# Metric vocabulary + thresholds rationale: docs/research/noc-alert-rules.md.

groups:

  # ----------------------------------------------------------------------------
  # Reachability / availability
  # ----------------------------------------------------------------------------
  - name: noc-availability
    interval: 30s
    rules:
      - alert: ScrapeTargetDown
        # Scoped to the always-on jobs: cadvisor/node/grafana belong to the
        # optional self-monitoring add-on and legitimately read up==0 while it
        # is disabled (vmscrape.yml keeps their targets, errors suppressed).
        expr: up{job=~"netops-api|victoria|clickhouse|vector"} == 0
        for: 5m
        labels:
          severity: critical
          layer: platform
        annotations:
          summary: "{{ $labels.instance }} down >5m"

      - alert: DeviceUnreachable
        # netconf is an opportunistic capability probe (it tries every device's
        # :830 by design) — a device without NETCONF is not "unreachable".
        # Authoritative reachability comes from the polling collectors.
        expr: collector_target_up{collector!="netconf"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} unreachable from {{ $labels.collector }}"

      - alert: InterfaceDown
        expr: device_if_oper_status == 2 and device_if_admin_status == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} DOWN (admin-up)"

      - alert: InterfaceLowerLayerDown
        expr: device_if_oper_status == 7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} lowerLayerDown"

      - alert: InterfaceFlapping
        expr: changes(device_if_oper_status[10m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} flapping ({{ $value }} transitions/10m)"

      - alert: AdminDownButReceivingTraffic
        expr: device_if_admin_status == 2 and rate(device_if_in_octets[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} admin-down yet receiving traffic"

      - alert: DeviceRebooted
        expr: device_sysuptime < 6000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} recently rebooted (uptime {{ $value }} cs)"

  # ----------------------------------------------------------------------------
  # Errors / discards
  # ----------------------------------------------------------------------------
  - name: noc-errors
    interval: 30s
    rules:
      - alert: InterfaceInputErrors
        expr: rate(device_if_in_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} input errors {{ $value }}/s"

      - alert: InterfaceOutputErrors
        expr: rate(device_if_out_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} output errors {{ $value }}/s"

      - alert: InterfaceInputErrorsHigh
        expr: rate(device_if_in_errors[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} HIGH input errors {{ $value }}/s"

      - alert: InterfaceInputDiscards
        expr: rate(device_if_in_discards[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} input discards {{ $value }}/s (congestion)"

      - alert: InterfaceOutputDiscards
        expr: rate(device_if_out_discards[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} output discards {{ $value }}/s (egress congestion)"

      - alert: InterfaceErrorRatioHigh
        expr: rate(device_if_in_errors[5m]) / clamp_min(rate(device_if_in_ucast_pkts[5m]) + rate(device_if_in_mcast_pkts[5m]) + rate(device_if_in_bcast_pkts[5m]), 1) > 0.001
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} error ratio >0.1% of input pkts"

      - alert: InterfaceErrorAnomaly
        expr: (rate(device_if_in_errors[5m]) - avg_over_time(rate(device_if_in_errors[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_errors[5m])[1h:5m]), 0.01) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} error-rate z-score anomaly"

      - alert: InterfaceCRCErrors   # [NEEDS METRIC] dot3StatsFCSErrors
        expr: rate(device_if_crc_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} CRC/FCS errors {{ $value }}/s (cabling/optic)"

  # ----------------------------------------------------------------------------
  # Saturation (CPU / memory / link util / storage / sessions)
  # ----------------------------------------------------------------------------
  - name: noc-saturation
    interval: 30s
    rules:
      - alert: HighCPU
        # avg without(index): device-level CPU, not per-core. Containerized NOS
        # (cEOS) exposes the HOST's cores via HOST-RESOURCES, so a single busy
        # host core would otherwise fire on every cEOS device at once.
        expr: avg without (index) (device_cpu_percent) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} ({{ $labels.vendor }}) CPU {{ $value }}%"

      - alert: CriticalCPU
        expr: avg without (index) (device_cpu_percent) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} CPU critically high {{ $value }}%"

      - alert: HighMemory
        expr: device_mem_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory {{ $value }}%"

      - alert: CriticalMemory
        expr: device_mem_percent > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} memory critically high {{ $value }}%"

      - alert: HighMemoryBytes
        expr: device_mem_used_bytes / clamp_min(device_mem_used_bytes + device_mem_free_bytes, 1) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory >90% (Cisco byte counters)"

      - alert: LinkInboundUtilHigh
        expr: rate(device_if_in_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound >80% of link"

      - alert: LinkInboundUtilCritical
        expr: rate(device_if_in_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound SATURATED (>95%)"

      - alert: LinkOutboundUtilHigh
        expr: rate(device_if_out_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} outbound >80% of link"

      - alert: LinkOutboundUtilCritical
        expr: rate(device_if_out_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} outbound SATURATED (>95%)"

      - alert: StorageUtilHigh
        expr: device_storage_used / clamp_min(device_storage_size, 1) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} >85%"

      - alert: StorageUtilCritical
        expr: device_storage_used / clamp_min(device_storage_size, 1) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} >95% (full risk)"

      - alert: FirewallDiskHigh
        expr: device_disk_used_mb / clamp_min(device_disk_capacity_mb, 1) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} firewall disk >90%"

      - alert: FirewallSessionsHigh
        expr: (device_session_count - avg_over_time(device_session_count[6h])) / clamp_min(stddev_over_time(device_session_count[6h]), 1) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} session-count spike (z>4) — flood/leak?"

  # ----------------------------------------------------------------------------
  # Environmental (temp / power / fan / optics / sensors)
  # ----------------------------------------------------------------------------
  - name: noc-environmental
    interval: 30s
    rules:
      - alert: TemperatureHigh
        expr: device_temp_celsius > 55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} sensor{{ $labels.index }} {{ $value }}C"

      - alert: TemperatureCritical
        expr: device_temp_celsius > 70
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} sensor{{ $labels.index }} {{ $value }}C (thermal)"

      - alert: TemperatureStateAbnormal
        expr: device_temp_state >= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} temp sensor{{ $labels.index }} state {{ $value }} (CISCO-ENVMON !normal)"

      - alert: FanFailed
        expr: device_fan_state >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} fan{{ $labels.index }} state {{ $value }} (failed/warning)"

      - alert: PowerSupplyFailed
        expr: device_psu_state >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} PSU{{ $labels.index }} state {{ $value }} (failed/warning)"

      - alert: GenericSensorAnomaly
        expr: (device_sensor_value - avg_over_time(device_sensor_value[6h])) / clamp_min(stddev_over_time(device_sensor_value[6h]), 0.5) > 4
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} ENTITY sensor{{ $labels.index }} anomaly (z>4)"

      - alert: OpticRxPowerLow   # [NEEDS METRIC] device_optic_rx_power_dbm
        expr: device_optic_rx_power_dbm < -14
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Rx {{ $value }}dBm low"

      - alert: OpticRxPowerCritical   # [NEEDS METRIC]
        expr: device_optic_rx_power_dbm < -18
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Rx {{ $value }}dBm — LOS imminent"

      - alert: OpticTxPowerLow   # [NEEDS METRIC]
        expr: device_optic_tx_power_dbm < -8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Tx {{ $value }}dBm low (failing laser)"

      - alert: OpticTemperatureHigh   # [NEEDS METRIC]
        expr: device_optic_temp_c > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} transceiver {{ $value }}C"

      - alert: OpticBiasDrift   # [NEEDS METRIC] laser ageing
        expr: (device_optic_bias_ma - avg_over_time(device_optic_bias_ma[6h])) / clamp_min(stddev_over_time(device_optic_bias_ma[6h]), 0.1) > 3
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic bias drift"

  # ----------------------------------------------------------------------------
  # Routing / control-plane   [all NEEDS METRIC — collectors don't emit yet]
  # ----------------------------------------------------------------------------
  - name: noc-routing
    interval: 30s
    rules:
      # BGP is gNMI-owned (canonical device_bgp_*, labelled {device,peer,vrf};
      # session-state mapped to BGP4-MIB numerics, 6=established).
      - alert: BGPSessionDown
        expr: device_bgp_peer_state != 6
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} not established"

      - alert: BGPPeerFlapping
        expr: increase(device_bgp_fsm_transitions[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} flapping"

      - alert: BGPPrefixDrop   # device_bgp_pfx_in = OpenConfig afi-safi prefixes/received
        expr: delta(device_bgp_pfx_in[10m]) < -1000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} dropped >1000 prefixes"

      - alert: BGPAllPeersDown
        expr: count by (device) (device_bgp_peer_state == 6) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} has zero established BGP peers (isolation)"

      - alert: OSPFAdjacencyDown   # OSPF-MIB ospfNbrState (8=full); SNMP-owned, labelled {neighbor}
        expr: device_ospf_nbr_state != 8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} OSPF neighbor {{ $labels.neighbor }} not full"

      - alert: OSPFAdjacencyFlapping
        expr: changes(device_ospf_nbr_state[15m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} OSPF neighbor {{ $labels.neighbor }} flapping"

      # IS-IS is the fabric IGP (gNMI device_isis_adj_state; 3=up), labelled
      # {device, ifName, isis_level, isis_neighbor (system-id)}.
      - alert: ISISAdjacencyDown
        expr: device_isis_adj_state != 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} IS-IS adjacency to {{ $labels.isis_neighbor }} on {{ $labels.ifName }} not up"

      - alert: ISISAdjacencyFlapping
        expr: changes(device_isis_adj_state[15m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} IS-IS adjacency to {{ $labels.isis_neighbor }} flapping"

      - alert: RouteTableShrink   # [NEEDS METRIC]
        expr: delta(device_route_count[10m]) < -500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} RIB shrank >500 routes/10m"

      - alert: FIBNearCapacity   # [NEEDS METRIC] TCAM exhaustion
        expr: device_fib_count / clamp_min(device_fib_max, 1) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} FIB/TCAM >90% (blackhole risk)"

  # ----------------------------------------------------------------------------
  # Capacity / trend (z-score & linear prediction over real metrics)
  # ----------------------------------------------------------------------------
  - name: noc-capacity
    interval: 30s
    rules:
      - alert: TrafficZScoreAnomalyIn
        expr: (rate(device_if_in_octets[5m]) - avg_over_time(rate(device_if_in_octets[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_octets[5m])[1h:5m]), 1) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound traffic anomaly (z>3)"

      - alert: TrafficDropAnomaly
        expr: (rate(device_if_in_octets[5m]) - avg_over_time(rate(device_if_in_octets[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_octets[5m])[1h:5m]), 1) < -3 and device_if_oper_status == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} traffic collapsed while up (z<-3)"

      - alert: SustainedLinkGrowth
        expr: avg_over_time(rate(device_if_in_octets[5m])[1h:5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.70
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} sustained >70% — plan upgrade"

      - alert: MemoryLeakTrend
        expr: delta(device_mem_percent[6h]) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory +{{ $value }}pp/6h — possible leak"

      - alert: StorageWillFill24h
        expr: predict_linear(device_storage_used[6h], 86400) > device_storage_size
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} projected full <24h"

      - alert: CPUBaselineRising
        expr: delta(avg_over_time((avg without (index) (device_cpu_percent))[1h:5m])[12h:1h]) > 15
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} baseline CPU rising +{{ $value }}pp/12h"

  # ----------------------------------------------------------------------------
  # Latency / jitter / SLA   [NEEDS METRIC + VM mirror — see research §2.4]
  # ----------------------------------------------------------------------------
  - name: noc-sla
    interval: 30s
    rules:
      - alert: TunnelDown   # [NEEDS METRIC] tunnel_status to VictoriaMetrics
        expr: tunnel_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} DOWN"

      - alert: TunnelLatencyHigh   # [NEEDS METRIC]
        expr: tunnel_latency_ms > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency {{ $value }}ms > SLA"

      - alert: TunnelLatencyCritical   # [NEEDS METRIC]
        expr: tunnel_latency_ms > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency {{ $value }}ms — SLA breach"

      - alert: TunnelJitterHigh   # [NEEDS METRIC]
        expr: tunnel_jitter_ms > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} jitter {{ $value }}ms (voice/video risk)"

      - alert: TunnelLossHigh   # [NEEDS METRIC]
        expr: tunnel_loss_pct > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} loss {{ $value }}% — SLA breach"

      - alert: TunnelLatencyAnomaly   # [NEEDS METRIC]
        expr: (tunnel_latency_ms - avg_over_time(tunnel_latency_ms[2h])) / clamp_min(stddev_over_time(tunnel_latency_ms[2h]), 1) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency anomaly (z>3)"

  # ----------------------------------------------------------------------------
  # Security / syslog   [NEEDS METRIC — syslog counterization not wired]
  # ----------------------------------------------------------------------------
  - name: noc-security
    interval: 30s
    rules:
      - alert: AuthFailureBurst   # [NEEDS METRIC] device_auth_failures_total
        expr: rate(device_auth_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} {{ $value }} auth failures/s (brute force?)"

      - alert: AuthFailureCritical   # [NEEDS METRIC]
        expr: rate(device_auth_failures_total[5m]) > 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} sustained login failures — credential attack"

      - alert: ConfigChanged   # [NEEDS METRIC] device_config_change_total
        expr: increase(device_config_change_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} running-config changed"

      - alert: PortAuthFailure   # [NEEDS METRIC] device_dot1x_failures_total
        expr: rate(device_dot1x_failures_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} 802.1X failures"

  # ----------------------------------------------------------------------------
  # Stack self-health
  # ----------------------------------------------------------------------------
  - name: noc-self-health
    interval: 30s
    rules:
      - alert: CollectorDown
        expr: collector_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Collector {{ $labels.collector }} is down"

      # The watcher's own death (2026-08-05): when the API's metric-push path
      # broke (bare client vs the TLS store), EVERY collector_* series vanished
      # at once — and `collector_up == 0` cannot fire on a series that does not
      # exist, so all of noc-self-health went blind together for 9 hours.
      # collector_up{collector="snmpv2c"} always exists on a default install
      # (ENABLE_SNMP_COLLECTION defaults true), so absence = the push path is
      # dead, not "nothing enabled".
      - alert: CollectorTelemetryMissing
        expr: absent(collector_up)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No collector telemetry is reaching the metric store — every collector alert in this group is blind"

      - alert: CollectorAllTargetsUnreachable
        expr: collector_targets_reachable == 0 and collector_targets > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector {{ $labels.collector }} cannot reach any target"

      - alert: CollectorPartialReachability
        expr: collector_targets_reachable / clamp_min(collector_targets, 1) < 0.8 and collector_targets > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} reaching <80% of targets"

      - alert: CollectorPollSlow
        expr: collector_poll_duration_ms > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} poll {{ $value }}ms (slow)"

      - alert: NoSamplesIngested
        expr: collector_samples == 0 and collector_targets > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} produced 0 samples"

      - alert: StorageBackendDown   # [NEEDS METRIC] up{job=...} for stack services
        expr: up{job=~"opensearch|clickhouse|victoria|postgres|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Stack backend {{ $labels.job }} down"

  # ===========================================================================
  # STACK RESILIENCE — self-monitoring of the platform's own containers + host.
  # Backed by cAdvisor (per-container) + node-exporter (host). These fire when
  # auto-heal has NOT recovered a component (down / restart-loop / OOM) or when
  # a resource is being exhausted — the "alert when no auto-heal" layer.
  # ===========================================================================
  # F-35 (2026-07-21) — LABEL CONTRACT. Every rule in this group used to select
  # {name=~"netops-.+"} and matched ZERO series, so the entire container safety
  # net was dead while reading, on a dashboard, as coverage. Two separate causes,
  # both fixed:
  #
  #   1. cAdvisor produced no per-container series AT ALL. Its docker handler
  #      cannot start a container handler under docker's containerd image store
  #      (no image/<driver>/layerdb tree to read the rw-layer id from), and it
  #      claims the docker-*.scope cgroups ahead of every other handler, so
  #      nothing else picked them up. Live evidence: container_last_seen had
  #      exactly one series, {id="/"}. Fixed in docker-compose.yml by running
  #      cAdvisor's containerd handler against docker's "moby" namespace.
  #
  #   2. The label. cAdvisor's containerd handler sets name=<container-id-hash>,
  #      not name="netops-api-1", so "netops-.+" could never match even once
  #      per-container series existed. The selector is now {name!=""}, which is
  #      what genuinely distinguishes a CONTAINER from a cgroup slice (slices
  #      carry name="") and does not depend on the cgroup driver, the image
  #      store, or the compose project name.
  #
  # Annotations use {{ $labels.image }} because it is the human-readable
  # identifier this handler actually provides; the id hash is in {{ $labels.name }}.
  #
  # ContainerMetricsMissing below is the load-bearing part of this fix: an alert
  # whose selector matches nothing is indistinguishable from an alert that is
  # simply not firing, which is how this stayed broken. It asserts the input.
  - name: stack-resilience
    rules:
      - alert: ContainerMetricsMissing
        # THE META-ALERT. If this fires, every other rule in this group is
        # silently vacuous — treat it as "container monitoring is DOWN", not as
        # "no containers". A healthy stack has ~20+ containers; <5 means the
        # cAdvisor handler is broken again (image-store change, socket moved,
        # cgroup driver change) rather than that the stack shrank.
        # Runbook: docker logs netops-cadvisor-1 | grep -i "failed to create"
        #          curl cadvisor:8080/metrics | grep -c '^container_last_seen'
        expr: count(container_last_seen{name!=""}) < 5 or absent(container_last_seen{name!=""})
        for: 10m
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "cAdvisor is reporting {{ $value }} containers — the container OOM/restart/memory alerts below are matching nothing and cannot fire"
          description: "An alert that matches zero series reads as coverage. Fix the exporter, not the rule."

      - alert: ContainerDown
        # cAdvisor stops reporting a container that has died/been removed.
        # No absent() arm: cadvisor going blind (e.g. docker's containerd image
        # store, unsupported by cadvisor's docker handler as of v0.52.1) is not
        # "every container is down" — that false-fired platform-wide. The
        # external stack-watchdog cron is the authoritative container-down
        # sentinel either way; this rule is the in-platform per-container view.
        expr: time() - container_last_seen{name!=""} > 120
        for: 2m
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) is down (no cAdvisor data >2m)"
          description: "Auto-heal did not bring it back — investigate."

      - alert: ContainerRestartLoop
        # Start time changing repeatedly = crash/restart looping.
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 3
        for: 5m
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) restart-looping ({{ $value }} restarts/15m)"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!=""}[10m]) > 0
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) was OOM-killed — raise its mem_limit or fix the leak"

      - alert: ContainerMemoryNearLimit
        # Working set within 10% of the container's mem_limit → OOM risk / leak.
        expr: container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.90 and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels: { severity: warning, layer: stack }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) at {{ $value | humanizePercentage }} of its memory limit"

      - alert: ContainerCPUSaturated
        # Sustained near its CPU ceiling (quota/period = limit in cores).
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) / on(name) group_left() (container_spec_cpu_quota{name!=""} / container_spec_cpu_period{name!=""}) > 0.90
        for: 15m
        labels: { severity: warning, layer: stack }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) CPU-saturated against its limit for 15m"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 5m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Host memory available {{ $value | humanizePercentage }} — OOM-killer risk"

      - alert: HostOOMKillerFired
        # #102: the kernel actually reaped a process — a platform FAILURE, not
        # pressure. HostMemoryLow is the pre-OOM proxy; this is the event.
        # Runbook: dmesg -T | grep -i oom; identify the victim cgroup, compare
        # its resource-plan limit vs usage, then --replan or grow the host.
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        for: 0m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Host OOM-killer fired ({{ $value }} kill(s)/10m) — a process was reaped"

      - alert: HostDiskLow
        # 2026-07-21: this rule matched ZERO series and could never fire — the
        # same disease as the container rules above, on the one alert that would
        # have caught the disk exhaustion in F-55. node-exporter runs with
        # --path.rootfs=/host, which STRIPS that prefix from the reported
        # mountpoint, so the label is "/" and never "/host". Confirmed against
        # the live store: mountpoints emitted are / /boot /run ... — no /host.
        # fstype filter keeps tmpfs/overlay mounts out of the comparison.
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 5m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Host disk {{ $labels.mountpoint }} below 10% free — ingestion will read-only-lock"

      - alert: HostCPULoadHigh
        expr: node_load5 / count(count(node_cpu_seconds_total) by (cpu)) > 2
        for: 10m
        labels: { severity: warning, layer: host }
        annotations:
          summary: "Host 5m load {{ $value }}× core count — sustained overload"

  # ----------------------------------------------------------------------------
  # Correlation-engine ingest health (#99 R6) — silent ingestion failures page.
  # ----------------------------------------------------------------------------
  # #100 ClickHouse bounded-IO guardrails (2026-07-09 incident). CH counters come
  # from ClickHouse's native prometheus exporter (:9363, vmscrape job
  # 'clickhouse'); corr_versions from the correlation /metrics exposition.
  # ----------------------------------------------------------------------------
  - name: noc-ch-bounded-io
    interval: 60s
    rules:
      - alert: CHMemoryLimitExceeded
        # (renamed from CHQueryMemoryKilled 2026-07-11 #102: the error metric
        # counts every thrown MEMORY_LIMIT_EXCEEDED — query OR background — so
        # the old name overclaimed a query kill. Attribution = runbook step.)
        # A MEMORY_LIMIT_EXCEEDED exception was actually thrown — a query died
        # against the per-query cap (query-spill.xml) or the server total. One
        # kill = investigate; run scripts/ch-query-budget-check.sh to attribute
        # it by log_comment (api:<endpoint> / worker:*).
        # NOT ProfileEvents_QueryMemoryLimitExceeded: that counter also ticks on
        # non-fatal internal allocation denials (overcommit probes) with zero
        # failed queries — it false-fired critical while query_log and
        # system.errors were clean.
        expr: increase(ClickHouseErrorMetric_MEMORY_LIMIT_EXCEEDED[10m]) > 0
        labels: { severity: critical, layer: clickhouse }
        annotations:
          summary: "ClickHouse threw MEMORY_LIMIT_EXCEEDED {{ $value }}x in 10m — attribute (query vs background) via ch-query-budget-check.sh + system.query_log"

      - alert: CHMemoryPressureSustained
        # #102 capacity PRESSURE (vs the failure above): tracked server memory
        # sustained above 85% of the plan-asserted ceiling (CH_MEM_RATIO x
        # cgroup). Fires BEFORE queries start dying — the 2026-07-11 incident
        # shape. Runbook: check merges/mutations + query mix, then --replan.
        # Self-contained from CH's own scrape: CGroupMemoryTotal is the cgroup
        # limit CH detected (live-verified = the container mem_limit), x0.9 =
        # the asserted server ceiling. No cadvisor, no constants.
        expr: ClickHouseMetrics_MemoryTracking / (ClickHouseAsyncMetrics_CGroupMemoryTotal * 0.9) > 0.85
        for: 10m
        labels: { severity: warning, layer: clickhouse }
        annotations:
          summary: "ClickHouse tracked memory sustained >85% of its plan ceiling — investigate before queries die"

      - alert: CHFailedQueriesRising
        expr: increase(ClickHouseProfileEvents_FailedQuery[15m]) > 25
        for: 10m
        labels: { severity: warning, layer: clickhouse }
        annotations:
          summary: "ClickHouse failing {{ $value }} queries/15m — check system.query_log exceptions (read paths or ingest)"

      - alert: CorrVersionChurnUndamped
        # Sustained persists with ZERO damping means the material-hash gate
        # stopped suppressing storm churn (regression or heartbeat misconfig) —
        # corr_objects growth is heading back to the pre-#100 30x rate.
        expr: >
          increase(corr_versions{outcome="persisted"}[30m]) > 60
          and increase(corr_versions{outcome="damped"}[30m]) == 0
        for: 15m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation persisting {{ $value }} versions/30m with ZERO damped writes — the #100 write damper is not suppressing storm churn"

      - alert: CorrCurrentProjectionFailing
        # #101: corr_current is the hot-read source of truth for Command Center.
        # A lost projection dual-write = a STALE incident list (an incident that
        # closed still shows open, or never appears). The engine's history write
        # succeeded, so nothing else looks broken — this counter is the only
        # signal. Recovery: docs/runbooks/correlation-storm.md §projection;
        # the Go corr-current-reconcile worker force-repairs hourly.
        expr: increase(corr_current_projection_write_failures_total[10m]) > 0
        for: 5m
        labels: { severity: critical, layer: correlation }
        annotations:
          summary: "corr_current projection lost {{ $value }} write(s)/10m — Command Center may be serving STALE incidents; check correlation logs (corr_current projection write FAILED) and ClickHouse health"

      - alert: CorrTenantWriteAmpOverBudget
        # #101 tenant storm budget: >120 persisted versions inside one 5-minute
        # write-amp window (~24/min sustained) means one tenant's lane is
        # writing far beyond the damped steady-state (heartbeat-paced storms
        # persist ~1 version/object/15min). Bounded cardinality by design: the
        # metric only carries the top-K noisiest tenants. Attribution + full
        # history: SELECT from netops.corr_tenant_write_amp (correlation-storm
        # runbook).
        expr: max by (tenant_id) (corr_tenant_writes_window{outcome="persisted"}) > 120
        for: 15m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} persisted {{ $value }} correlation versions in one write-amp window — storm exceeding write budget; see correlation-storm runbook (chaos fixture? damping regression? real multi-entity incident?)"

  # Counters come from the correlation /metrics exposition (vmscrape job
  # 'correlation'); they are monotonic per process, so increase()/rate() are safe
  # across restarts.
  # ----------------------------------------------------------------------------
  - name: noc-corr-ingest
    interval: 60s
    rules:
      - alert: CorrDeadLettersRising
        expr: increase(corr_deadletters[15m]) > 0
        for: 5m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation dead-letters rising ({{ $value }} in 15m) — malformed events are being parked; check correlation logs"

      - alert: CorrEventsDroppedRising
        expr: sum by (counter) (increase(corr_ingest_events{counter=~".*_dropped"}[15m])) > 10
        for: 5m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation lane {{ $labels.counter }} rising ({{ $value }} in 15m) — events are being rejected (tenancy/normalization); check correlation logs"

      - alert: CorrProbeLaneFlatlined
        # The prober ticks 24/7 (30-60s interval), so probes_received must always
        # advance — a flat line means bus→consumer ingest is dead even if every
        # container looks healthy (the failure mode that hid the July lab outage).
        expr: increase(corr_ingest_events{counter="probes_received"}[15m]) == 0
        for: 15m
        labels: { severity: critical, layer: correlation }
        annotations:
          summary: "Correlation probe intake flat-lined 30m — bus→engine ingest is dead (check kafka, vector, correlation consumer)"

      - alert: CorrSyslogLaneFlatlined
        expr: increase(corr_ingest_events{counter="flows_received"}[30m]) == 0 and increase(corr_ingest_events{counter="metrics_received"}[30m]) == 0
        for: 30m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation flow+metric intake flat-lined 1h — telemetry sources silent (lab down or edge-ingest broken)"

  # ============================================================================
  # STORAGE-LOSS OBSERVABILITY (F-17 / F-18 / F-19 / F-04)
  # ============================================================================
  #
  # The theme these rules exist to break: EVERY silent-loss finding in the
  # 2026-07-21 audit had the same shape — the failing component KNEW, and the
  # knowledge stopped there. Vector knew (it logged and counted). OpenSearch
  # knew (it returned a 400 per bulk item). The knowledge died in an unscraped
  # log line, or landed in a metric with no rule attached to it.
  #
  # The authoritative measurement that motivated this group: 1,127 documents
  # rejected in 4.75 h = ~5,700/day = 0.93% of ALL application logs,
  # permanently lost, while every dashboard showed a healthy cluster and the
  # external watchdog stayed green for the entire incident.
  #
  # Metric provenance:
  #   vector_*     -> vmscrape job 'vector' (both tiers, :9598)
  #   opensearch_* -> vector-aggregator's opensearch_indexing_stats /
  #                   opensearch_cluster_health http_client sources ->
  #                   prometheus_remote_write -> VM. See vector/vector.yaml.
  # ----------------------------------------------------------------------------
  - name: storage-loss-observability
    interval: 60s
    rules:
      - alert: OpenSearchDocumentsRejected
        # ####################################################################
        # DO NOT "SIMPLIFY" THIS TO index_failed. THAT COUNTER LIES.
        #
        # Measured simultaneously, on the same node, in the same response:
        #     "index_failed" : 0        <- while documents were being discarded
        #     "doc_status"   : { "2xx": 120029, "4xx": 1127 }
        # index_failed counts whole-REQUEST failures. Bulk indexing rejects
        # PER ITEM: OpenSearch returns HTTP 200 for the batch and a 400 inside
        # the individual item, so index_failed never moves. A dashboard panel
        # built on index_failed is worse than no panel — it actively asserts
        # health during data loss.
        #
        # doc_status.4xx is per-DOCUMENT and does move. It is a mapping
        # rejection (wrong type for a field, field-limit exceeded); those are
        # NOT retriable, so every increment is a document destroyed for good.
        # Threshold is > 0 because the correct rate of permanent loss is zero.
        #
        # It is a gauge holding an absolute counter, so delta() not increase():
        # an OpenSearch restart resets it to 0, which yields a negative delta
        # and cannot false-fire.
        # ####################################################################
        # ####################################################################
        # 2026-08-05 ADDENDUM — everything above remains true AND incomplete:
        # doc_status.4xx ALSO counts OpenSearch's own housekeeping conflicts
        # (ISM retention/snapshot jobs update lock/policy docs with optimistic
        # concurrency; a lost race is a per-doc 409 in the same 4xx bucket).
        # Measured: ~0.8/min of 4xx overnight with ZERO router-sink drops and
        # every lane indexing — so `>0` alone fires forever on a healthy
        # cluster, which buries the real signal (the alert equivalent of the
        # F-18 lesson). The composite below keeps doc_status as the COUNTER
        # (it does move on real loss — the 1127-doc incident above) but only
        # FIRES when a Vector opensearch sink simultaneously reports
        # unintentional discards — i.e. a rejection some writer actually
        # suffered. Non-vector writers log their own OS errors loudly and are
        # not silenced by this (they don't tick vector metrics either way).
        # ####################################################################
        expr: >
          delta(opensearch_indexing_doc_status{code="4xx"}[15m]) > 0
          and on()
          sum(increase(vector_component_discarded_events_total{component_id=~"opensearch.*",intentional="false"}[15m])) > 0
        for: 5m
        labels: { severity: critical, layer: storage }
        annotations:
          summary: "OpenSearch REJECTED {{ $value }} documents in 15m — permanent loss, not a retry"
          description: "Per-item bulk rejection (mapping conflict or field-limit). Find them: curl netops-opensearch-1:9200/_nodes/stats/indices/indexing | jq .nodes[].indices.indexing.doc_status ; then check the lane's index template. index_failed will read ~0 — ignore it."

      - alert: OpenSearchRejectionRatioHigh
        # The same signal as a proportion, so a busy day cannot hide a
        # proportionally worse failure inside a bigger absolute number.
        expr: delta(opensearch_indexing_doc_status{code="4xx"}[1h]) / clamp_min(delta(opensearch_indexing_index_total[1h]), 1) > 0.001
        for: 15m
        labels: { severity: critical, layer: storage }
        annotations:
          summary: "OpenSearch is rejecting {{ $value | humanizePercentage }} of all documents (>0.1%)"

      - alert: VectorEventsDiscarded
        # F-18: this metric was exported by BOTH Vector tiers and confirmed
        # present in VictoriaMetrics for the whole incident. The data needed to
        # detect the loss within 60 seconds was in the metrics store the entire
        # time; the only thing missing was this rule. intentional="false" is
        # load-bearing — intentional="true" is ordinary filtering and is
        # constantly non-zero.
        expr: sum by (component_id, instance) (increase(vector_component_discarded_events_total{intentional="false"}[15m])) > 0
        for: 5m
        labels: { severity: critical, layer: ingest }
        annotations:
          summary: "Vector discarded {{ $value }} events UNINTENTIONALLY at {{ $labels.component_id }} ({{ $labels.instance }})"
          description: "Unintentional discard = a bug or a rejected write, never normal filtering. Check the component's errors and netops-deadletter-*."

      - alert: VectorComponentErrors
        expr: sum by (component_id, error_type, instance) (increase(vector_component_errors_total[15m])) > 0
        for: 10m
        labels: { severity: warning, layer: ingest }
        annotations:
          summary: "Vector {{ $labels.component_id }} error_type={{ $labels.error_type }} ({{ $value }} in 15m)"

      - alert: LogIngestRateDegraded
        # ####################################################################
        # F-19: PARTIAL loss, not total stall.
        #
        # The external watchdog's ingest check was `count == 0` — it can only
        # see a pipeline that has stopped completely. During the measured
        # incident the count was ~14,000/h and the watchdog stayed GREEN while
        # 4,390 documents/day were being destroyed. "Ingesting correctly" and
        # "ingesting with a 5% hole" are identical under a zero-test.
        #
        # This compares the current 15m indexing rate against the trailing 6h
        # baseline of itself. The clamp_min floor stops an idle lab (where the
        # baseline is legitimately near zero) from firing continuously — the
        # rule is deliberately silent below a real traffic level rather than
        # noisy, because an alert nobody trusts is worse than none.
        # ####################################################################
        expr: sum(delta(opensearch_indexing_doc_status{code="2xx"}[15m])) < 0.5 * sum(avg_over_time(delta(opensearch_indexing_doc_status{code="2xx"}[15m])[6h:15m])) and sum(avg_over_time(delta(opensearch_indexing_doc_status{code="2xx"}[15m])[6h:15m])) > 100
        for: 20m
        labels: { severity: critical, layer: ingest }
        annotations:
          summary: "Log indexing rate is under half its 6h baseline ({{ $value }} docs/15m) — partial ingest loss, not a stall"
          description: "A total stall is caught by the watchdog; this is the shape that hid for weeks. Check vector-router discards, Kafka consumer lag, and OpenSearch rejections."

      - alert: LogIngestStalled
        expr: sum(delta(opensearch_indexing_doc_status{code="2xx"}[15m])) == 0
        for: 15m
        labels: { severity: critical, layer: ingest }
        annotations:
          summary: "OpenSearch indexed ZERO documents in 15m — the log pipeline has stopped"

      - alert: OpenSearchStatsMissing
        # Meta-alert, same reasoning as ContainerMetricsMissing: the two rules
        # above are vacuous if this lane stops. An alert whose selector matches
        # zero series reads as coverage.
        expr: absent(opensearch_indexing_doc_status)
        for: 15m
        labels: { severity: critical, layer: storage }
        annotations:
          summary: "The OpenSearch doc_status lane is gone — document-rejection alerting is BLIND (check vector-aggregator's opensearch_indexing_stats source)"

  # ----------------------------------------------------------------------------
  # OpenSearch cluster shape (F-53 / F-54)
  # ----------------------------------------------------------------------------
  - name: opensearch-cluster-shape
    interval: 60s
    rules:
      - alert: OpenSearchClusterNotGreen
        # YELLOW IS A REAL SIGNAL AGAIN — it was not, and that is the finding.
        # netops-snmptrap-* had no index template, so it defaulted to 1 replica
        # on a single-node cluster, its replica was permanently UNASSIGNED, and
        # 33 ISM audit-history indices did the same: 35 permanently unassigned
        # shards. The cluster was ALWAYS yellow, so yellow meant nothing and the
        # genuine problem hid inside the noise. Templates now pin
        # number_of_replicas: 0 and apply-ism.sh pins it for the plugin indices,
        # so the cluster sits at green and any departure is actionable.
        expr: opensearch_cluster_status > 0
        for: 15m
        labels: { severity: warning, layer: storage }
        annotations:
          summary: "OpenSearch cluster is {{ $labels.status_text }} ({{ $value }}) — a lane is missing a template, or a shard cannot be allocated"

      - alert: OpenSearchUnassignedShards
        expr: opensearch_cluster_unassigned_shards > 0
        for: 30m
        labels: { severity: warning, layer: storage }
        annotations:
          summary: "{{ $value }} unassigned shards — on a single-node cluster this is almost always number_of_replicas > 0 on a new index pattern"

      - alert: OpenSearchShardCountHigh
        # Heap, not disk, is what fails first. At ~1.8 GB heap the accepted
        # density is roughly 20 shards/GB (~36 shards); the per-tenant DAILY
        # index scheme adds ~26 shards/day and reaches ~365 at the 14-day ISM
        # steady state. Heap/GC death arrives well before the 1000-shard cap,
        # and AT the cap index creation is rejected outright and ingest stops
        # silently. Warn early, while consolidating index granularity is still
        # a planning decision instead of an incident.
        expr: opensearch_cluster_active_shards / clamp_min(opensearch_cluster_data_nodes, 1) > 300
        for: 30m
        labels: { severity: warning, layer: storage }
        annotations:
          summary: "{{ $value }} shards/node — heap exhaustion risk; consolidate to weekly or aliased per-tenant indices, and verify ISM deletes every lane"

      - alert: OpenSearchShardCountCritical
        expr: opensearch_cluster_active_shards / clamp_min(opensearch_cluster_data_nodes, 1) > 700
        for: 15m
        labels: { severity: critical, layer: storage }
        annotations:
          summary: "{{ $value }} shards/node — approaching cluster.max_shards_per_node (1000), where index creation is REJECTED and ingest stops with no error"

  # ----------------------------------------------------------------------------
  # Ingest integrity (F-03 / F-11 / F-59) — the signals that only exist because
  # the pipeline was made to EMIT them. Each of these replaces an
  # indistinguishable-from-normal failure with a number.
  # ----------------------------------------------------------------------------
  - name: ingest-integrity
    interval: 60s
    rules:
      - alert: VectorDeadLetters
        # F-03/F-14: nothing lands in netops-deadletter-* during normal
        # operation — it is fed only by transforms that could not process an
        # event. So ANY document here means a producer broke its contract, or
        # a transform did. Before this, the same events were `drop_on_error`d
        # into a counter shared with ordinary filtering: a genuine VRL failure
        # and "this syslog line is not a cloud line" were the same number, with
        # no payload kept for either.
        #
        # Measured at the SINKS, not per-lane: `opensearch_deadletter` (router)
        # and `kafka_deadletter` (aggregator) are the two exits of the whole
        # dead-letter path, so a lane added later is covered the day it is
        # wired, without editing this rule. Both are already exported by the
        # vector job in vmscrape.yml — no new scrape target.
        expr: sum by (component_id, instance) (increase(vector_component_sent_events_total{component_id=~"opensearch_deadletter|kafka_deadletter"}[15m])) > 0
        for: 5m
        labels: { severity: warning, layer: ingest }
        annotations:
          summary: "{{ $value }} events dead-lettered via {{ $labels.component_id }} in 15m — a producer or transform is failing"
          description: "Read them: curl 'netops-opensearch-1:9200/netops-deadletter-*/_search?size=20&sort=dropped_at:desc' | jq '.hits.hits[]._source | {lane, reason, detail}'. reason=error is a processing failure (data would have been lost); reason=abort is a rejected/filtered record, e.g. a bus-bridge write to a non-netops topic."

      - alert: TenantEnrichmentMissRateJumped
        # ####################################################################
        # F-11: tenant_id = "" is a LEGITIMATE value (platform-owned
        # telemetry), which is exactly why a broken device→tenant enrichment
        # table is invisible: every device lane collapses into the shared
        # -untagged- index and the pipeline reports perfect health. Measured
        # 2026-07-21: 400/400 sampled messages on all six device lanes carried
        # tenant_id="". From the outside that is indistinguishable from a lab
        # whose devices genuinely have no tenant.
        #
        # So alert on the CHANGE, not the level. A deployment that never
        # matched anything stays silent forever (correct — nothing broke); a
        # deployment whose match rate collapses is a broken enrichment table,
        # a stale CSV export, or a device inventory that lost its tenant
        # column. At-rest tenant separation (#20 Phase 3) silently degrades to
        # one shared bucket when this happens, leaving isolation resting on
        # the API query filter alone — a single-layer defence where a
        # two-layer one was designed.
        #
        # METRIC NAME: `netops_tenant_attribution_events`, NO `_total` suffix.
        # Verified empirically against timberio/vector:0.40.0-alpine's
        # prometheus_exporter — it does NOT append `_total` to counters, unlike
        # most Prometheus client libraries. The first draft of this rule said
        # `_total` and would have matched ZERO series forever, i.e. exactly the
        # F-35 defect this audit found five times over: an alert whose selector
        # matches nothing reads as coverage. Check the exporter output before
        # renaming this.
        # ####################################################################
        expr: |
          (sum by (topic) (rate(netops_tenant_attribution_events{outcome="unmatched"}[15m]))
             / clamp_min(sum by (topic) (rate(netops_tenant_attribution_events[15m])), 0.001))
          >
          (sum by (topic) (rate(netops_tenant_attribution_events{outcome="unmatched"}[6h] offset 1h))
             / clamp_min(sum by (topic) (rate(netops_tenant_attribution_events[6h] offset 1h)), 0.001)) + 0.25
        for: 20m
        labels: { severity: warning, layer: ingest }
        annotations:
          summary: "Tenant enrichment miss rate on {{ $labels.topic }} jumped to {{ $value | humanizePercentage }} above its 6h baseline"
          description: "The device→tenant CSV (data/api/enrichment/device_tenant.csv) is stale, empty, or not mounted. Every unmatched event lands in the shared netops-*-untagged-* index, so per-tenant at-rest separation is not in effect for that lane."

      - alert: TenantAttributionLaneMissing
        # Meta-alert: the rule above is vacuous if the counter stops. An alert
        # whose selector matches zero series reads as coverage (the F-35 lesson).
        expr: absent(netops_tenant_attribution_events)
        for: 30m
        labels: { severity: warning, layer: ingest }
        annotations:
          summary: "The tenant-attribution counter is gone — enrichment-miss alerting is BLIND (check vector-router's tenant_attribution_metric transform)"

      # NOTE ON F-59 (backup freshness): there is deliberately NO metric-based
      # snapshot-age rule here. The metrics path runs INSIDE the stack, and a
      # backup alarm that dies with the thing it protects is theatre — the same
      # reasoning that keeps scripts/stack-watchdog.sh independent of the
      # platform's own notifiers. Snapshot age is checked out-of-band by the
      # watchdog (`check_backup_freshness`), which pages over its own channel.

  # ----------------------------------------------------------------------------
  # Bus consumer lag (F-46) — the only signal that separates "quiet bus" from
  # "dead consumer". Source: kafka-exporter (vmscrape job 'kafka').
  # ----------------------------------------------------------------------------
  - name: bus-consumer-lag
    interval: 60s
    rules:
      - alert: KafkaConsumerLagGrowing
        # THE POINT OF THIS RULE. Every flat-line rule in this file requires
        # `increase(...) == 0` EXACTLY, so a consumer running 10x slow — the
        # realistic shape when ClickHouse or OpenSearch is degraded — tripped
        # absolutely nothing. Sustained GROWTH is the 10x-slowdown signature:
        # the consumer is still alive and still committing, it just cannot keep
        # up, and it will never catch up on its own.
        expr: delta(kafka_consumergroup_lag_sum[30m]) > 1000 and kafka_consumergroup_lag_sum > 1000
        for: 15m
        labels: { severity: critical, layer: bus }
        annotations:
          summary: "Kafka lag GROWING on {{ $labels.consumergroup }}/{{ $labels.topic }} (+{{ $value }} in 30m) — the consumer is falling behind and will not recover unaided"

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag_sum > 50000
        for: 15m
        labels: { severity: warning, layer: bus }
        annotations:
          summary: "Kafka lag {{ $value }} on {{ $labels.consumergroup }}/{{ $labels.topic }}"

      - alert: KafkaConsumerStalled
        # Lag present AND the consumer's committed offset is not advancing =
        # dead/wedged consumer, as distinct from a quiet topic (lag 0).
        expr: kafka_consumergroup_lag_sum > 100 and delta(kafka_consumergroup_current_offset_sum[15m]) == 0
        for: 15m
        labels: { severity: critical, layer: bus }
        annotations:
          summary: "Kafka consumer {{ $labels.consumergroup }} is STALLED on {{ $labels.topic }} — {{ $value }} messages behind and its offset is not moving"

      - alert: KafkaLagMetricsMissing
        # Meta-alert (see ContainerMetricsMissing). Before 2026-07-21 there was
        # no lag metric at all and that absence was itself invisible.
        expr: absent(kafka_consumergroup_lag_sum)
        for: 30m
        labels: { severity: warning, layer: bus }
        annotations:
          summary: "No Kafka consumer-lag metrics — kafka-exporter is down and every bus-lag alert above is blind"

  # ----------------------------------------------------------------------------
  # Disk headroom (F-55) — fire well BEFORE OpenSearch's flood stage.
  # ----------------------------------------------------------------------------
  # All six stores share ONE 77 GB filesystem, measured at 83% used with ~2.3 GB
  # of margin against each store's own configured steady state. It has already
  # run out once: 3,018 NOT_ENOUGH_SPACE errors, last 2026-07-17. At 95%
  # OpenSearch sets EVERY index read-only and ingestion stops with no error —
  # the 2026-06-10 outage mode. HostDiskLow in stack-resilience fires at <10%
  # free, which on this filesystem is ~2 GB away from flood stage and far too
  # late to do anything but delete data under pressure.
  - name: disk-headroom
    interval: 60s
    rules:
      - alert: DiskHeadroomLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 0.17
        for: 15m
        labels: { severity: warning, layer: host }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} free on the shared store filesystem — act now, not at flood stage"
          description: "Order of operations: docker builder prune -f; verify ISM is deleting EVERY lane (_plugins/_ism/explain/netops-*); check Kafka retention.bytes per topic; only then consider growing the volume."

      - alert: DiskWillFillIn24h
        # Trend, not level. The value of this over a static threshold is that it
        # fires while there is still time to choose a remedy rather than take
        # whichever one is fastest.
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Shared filesystem trending to FULL within 24h — OpenSearch flood stage (95%) sets every index read-only and stops ingest"

      - alert: DiskFloodStageImminent
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 0.07
        for: 2m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Under {{ $value | humanizePercentage }} free — OpenSearch flood stage is at 5%. Every index goes read-only and ingestion stops SILENTLY."
