groups:
  - name: network
    interval: 30s
    rules:
      - alert: DeviceUnreachable
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Device {{ $labels.device_id }} is unreachable"

      - alert: HighCPU
        expr: cpu_usage > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.device_id }}: {{ $value }}%"

      - alert: HighMemory
        expr: memory_usage > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.device_id }}: {{ $value }}%"

  # Device-health alerts over the multivendor SNMP metrics emitted by the
  # snmpmetrics collector (ENABLE_SNMP_METRICS=true). These reference metric
  # NAMES — vendor-neutral — so one rule covers Cisco, Juniper, etc. Labels:
  # device, vendor, and index (per-row tables like interfaces/sensors).
  - name: device-health
    interval: 30s
    rules:
      - alert: HighDeviceCPU
        expr: device_cpu_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.device }} ({{ $labels.vendor }}): {{ $value }}%"

      - alert: HighDeviceTemperature
        expr: device_temp_celsius > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High temperature on {{ $labels.device }} ({{ $labels.vendor }}): {{ $value }}°C"

      - alert: HighDeviceMemory
        expr: device_mem_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.device }} ({{ $labels.vendor }}): {{ $value }}%"

      - alert: InterfaceDown
        expr: device_if_oper_status == 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Interface {{ $labels.index }} down on {{ $labels.device }}"

      - alert: CollectorTargetsUnreachable
        expr: collector_targets_reachable == 0 and collector_targets > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector {{ $labels.collector }} cannot reach any of its targets"
