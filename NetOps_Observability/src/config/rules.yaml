# NetOps alerting rules — Prometheus rules-file subset consumed by the Go alert
# engine (src/backend/alerts/engine.go parseRulesYAML). Each `expr` is sent
# verbatim to VictoriaMetrics /api/v1/query, so full PromQL/MetricsQL is allowed
# (rate, clamp_min, avg_over_time, stddev_over_time, predict_linear, changes,
# delta, increase, count by, and/or/unless). A rule fires when the query returns
# ≥1 series, so every expr ends in a comparison.
#
# NOTE on the parser: it reads block-style labels only (severity: under labels:)
# and strips trailing # comments — so the [NEEDS METRIC] notes below are
# documentation; those rules reference telemetry the collectors do not emit yet,
# so they simply never fire until the metric exists (see
# docs/research/noc-alert-rules.md §2.4). ~33 of these fire on metrics we collect
# today; the rest are forward-compatible.
#
# Metric vocabulary + thresholds rationale: docs/research/noc-alert-rules.md.

groups:

  # ----------------------------------------------------------------------------
  # Reachability / availability
  # ----------------------------------------------------------------------------
  - name: noc-availability
    interval: 30s
    rules:
      - alert: ScrapeTargetDown
        # Scoped to the always-on jobs: cadvisor/node/grafana belong to the
        # optional self-monitoring add-on and legitimately read up==0 while it
        # is disabled (vmscrape.yml keeps their targets, errors suppressed).
        expr: up{job=~"netops-api|victoria|clickhouse|vector"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} down >5m"

      - alert: DeviceUnreachable
        expr: collector_target_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} unreachable from {{ $labels.collector }}"

      - alert: InterfaceDown
        expr: device_if_oper_status == 2 and device_if_admin_status == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} DOWN (admin-up)"

      - alert: InterfaceLowerLayerDown
        expr: device_if_oper_status == 7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} lowerLayerDown"

      - alert: InterfaceFlapping
        expr: changes(device_if_oper_status[10m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} flapping ({{ $value }} transitions/10m)"

      - alert: AdminDownButReceivingTraffic
        expr: device_if_admin_status == 2 and rate(device_if_in_octets[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} admin-down yet receiving traffic"

      - alert: DeviceRebooted
        expr: device_sysuptime < 6000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} recently rebooted (uptime {{ $value }} cs)"

  # ----------------------------------------------------------------------------
  # Errors / discards
  # ----------------------------------------------------------------------------
  - name: noc-errors
    interval: 30s
    rules:
      - alert: InterfaceInputErrors
        expr: rate(device_if_in_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} input errors {{ $value }}/s"

      - alert: InterfaceOutputErrors
        expr: rate(device_if_out_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} output errors {{ $value }}/s"

      - alert: InterfaceInputErrorsHigh
        expr: rate(device_if_in_errors[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} HIGH input errors {{ $value }}/s"

      - alert: InterfaceInputDiscards
        expr: rate(device_if_in_discards[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} input discards {{ $value }}/s (congestion)"

      - alert: InterfaceOutputDiscards
        expr: rate(device_if_out_discards[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} output discards {{ $value }}/s (egress congestion)"

      - alert: InterfaceErrorRatioHigh
        expr: rate(device_if_in_errors[5m]) / clamp_min(rate(device_if_in_ucast_pkts[5m]) + rate(device_if_in_mcast_pkts[5m]) + rate(device_if_in_bcast_pkts[5m]), 1) > 0.001
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} error ratio >0.1% of input pkts"

      - alert: InterfaceErrorAnomaly
        expr: (rate(device_if_in_errors[5m]) - avg_over_time(rate(device_if_in_errors[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_errors[5m])[1h:5m]), 0.01) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} error-rate z-score anomaly"

      - alert: InterfaceCRCErrors   # [NEEDS METRIC] dot3StatsFCSErrors
        expr: rate(device_if_crc_errors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} CRC/FCS errors {{ $value }}/s (cabling/optic)"

  # ----------------------------------------------------------------------------
  # Saturation (CPU / memory / link util / storage / sessions)
  # ----------------------------------------------------------------------------
  - name: noc-saturation
    interval: 30s
    rules:
      - alert: HighCPU
        expr: device_cpu_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} ({{ $labels.vendor }}) CPU {{ $value }}%"

      - alert: CriticalCPU
        expr: device_cpu_percent > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} CPU critically high {{ $value }}%"

      - alert: HighMemory
        expr: device_mem_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory {{ $value }}%"

      - alert: CriticalMemory
        expr: device_mem_percent > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} memory critically high {{ $value }}%"

      - alert: HighMemoryBytes
        expr: device_mem_used_bytes / clamp_min(device_mem_used_bytes + device_mem_free_bytes, 1) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory >90% (Cisco byte counters)"

      - alert: LinkInboundUtilHigh
        expr: rate(device_if_in_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound >80% of link"

      - alert: LinkInboundUtilCritical
        expr: rate(device_if_in_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound SATURATED (>95%)"

      - alert: LinkOutboundUtilHigh
        expr: rate(device_if_out_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} outbound >80% of link"

      - alert: LinkOutboundUtilCritical
        expr: rate(device_if_out_octets[5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} outbound SATURATED (>95%)"

      - alert: StorageUtilHigh
        expr: device_storage_used / clamp_min(device_storage_size, 1) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} >85%"

      - alert: StorageUtilCritical
        expr: device_storage_used / clamp_min(device_storage_size, 1) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} >95% (full risk)"

      - alert: FirewallDiskHigh
        expr: device_disk_used_mb / clamp_min(device_disk_capacity_mb, 1) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} firewall disk >90%"

      - alert: FirewallSessionsHigh
        expr: (device_session_count - avg_over_time(device_session_count[6h])) / clamp_min(stddev_over_time(device_session_count[6h]), 1) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} session-count spike (z>4) — flood/leak?"

  # ----------------------------------------------------------------------------
  # Environmental (temp / power / fan / optics / sensors)
  # ----------------------------------------------------------------------------
  - name: noc-environmental
    interval: 30s
    rules:
      - alert: TemperatureHigh
        expr: device_temp_celsius > 55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} sensor{{ $labels.index }} {{ $value }}C"

      - alert: TemperatureCritical
        expr: device_temp_celsius > 70
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} sensor{{ $labels.index }} {{ $value }}C (thermal)"

      - alert: TemperatureStateAbnormal
        expr: device_temp_state >= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} temp sensor{{ $labels.index }} state {{ $value }} (CISCO-ENVMON !normal)"

      - alert: FanFailed
        expr: device_fan_state >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} fan{{ $labels.index }} state {{ $value }} (failed/warning)"

      - alert: PowerSupplyFailed
        expr: device_psu_state >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} PSU{{ $labels.index }} state {{ $value }} (failed/warning)"

      - alert: GenericSensorAnomaly
        expr: (device_sensor_value - avg_over_time(device_sensor_value[6h])) / clamp_min(stddev_over_time(device_sensor_value[6h]), 0.5) > 4
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} ENTITY sensor{{ $labels.index }} anomaly (z>4)"

      - alert: OpticRxPowerLow   # [NEEDS METRIC] device_optic_rx_power_dbm
        expr: device_optic_rx_power_dbm < -14
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Rx {{ $value }}dBm low"

      - alert: OpticRxPowerCritical   # [NEEDS METRIC]
        expr: device_optic_rx_power_dbm < -18
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Rx {{ $value }}dBm — LOS imminent"

      - alert: OpticTxPowerLow   # [NEEDS METRIC]
        expr: device_optic_tx_power_dbm < -8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic Tx {{ $value }}dBm low (failing laser)"

      - alert: OpticTemperatureHigh   # [NEEDS METRIC]
        expr: device_optic_temp_c > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} transceiver {{ $value }}C"

      - alert: OpticBiasDrift   # [NEEDS METRIC] laser ageing
        expr: (device_optic_bias_ma - avg_over_time(device_optic_bias_ma[6h])) / clamp_min(stddev_over_time(device_optic_bias_ma[6h]), 0.1) > 3
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} optic bias drift"

  # ----------------------------------------------------------------------------
  # Routing / control-plane   [all NEEDS METRIC — collectors don't emit yet]
  # ----------------------------------------------------------------------------
  - name: noc-routing
    interval: 30s
    rules:
      # BGP is gNMI-owned (canonical device_bgp_*, labelled {device,peer,vrf};
      # session-state mapped to BGP4-MIB numerics, 6=established).
      - alert: BGPSessionDown
        expr: device_bgp_peer_state != 6
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} not established"

      - alert: BGPPeerFlapping
        expr: increase(device_bgp_fsm_transitions[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} flapping"

      - alert: BGPPrefixDrop   # device_bgp_pfx_in = OpenConfig afi-safi prefixes/received
        expr: delta(device_bgp_pfx_in[10m]) < -1000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} BGP peer {{ $labels.peer }} dropped >1000 prefixes"

      - alert: BGPAllPeersDown
        expr: count by (device) (device_bgp_peer_state == 6) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} has zero established BGP peers (isolation)"

      - alert: OSPFAdjacencyDown   # OSPF-MIB ospfNbrState (8=full); SNMP-owned, labelled {neighbor}
        expr: device_ospf_nbr_state != 8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} OSPF neighbor {{ $labels.neighbor }} not full"

      - alert: OSPFAdjacencyFlapping
        expr: changes(device_ospf_nbr_state[15m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} OSPF neighbor {{ $labels.neighbor }} flapping"

      # IS-IS is the fabric IGP (gNMI device_isis_adj_state; 3=up), labelled
      # {device, ifName, isis_level, isis_neighbor (system-id)}.
      - alert: ISISAdjacencyDown
        expr: device_isis_adj_state != 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} IS-IS adjacency to {{ $labels.isis_neighbor }} on {{ $labels.ifName }} not up"

      - alert: ISISAdjacencyFlapping
        expr: changes(device_isis_adj_state[15m]) >= 4
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} IS-IS adjacency to {{ $labels.isis_neighbor }} flapping"

      - alert: RouteTableShrink   # [NEEDS METRIC]
        expr: delta(device_route_count[10m]) < -500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} RIB shrank >500 routes/10m"

      - alert: FIBNearCapacity   # [NEEDS METRIC] TCAM exhaustion
        expr: device_fib_count / clamp_min(device_fib_max, 1) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} FIB/TCAM >90% (blackhole risk)"

  # ----------------------------------------------------------------------------
  # Capacity / trend (z-score & linear prediction over real metrics)
  # ----------------------------------------------------------------------------
  - name: noc-capacity
    interval: 30s
    rules:
      - alert: TrafficZScoreAnomalyIn
        expr: (rate(device_if_in_octets[5m]) - avg_over_time(rate(device_if_in_octets[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_octets[5m])[1h:5m]), 1) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} inbound traffic anomaly (z>3)"

      - alert: TrafficDropAnomaly
        expr: (rate(device_if_in_octets[5m]) - avg_over_time(rate(device_if_in_octets[5m])[1h:5m])) / clamp_min(stddev_over_time(rate(device_if_in_octets[5m])[1h:5m]), 1) < -3 and device_if_oper_status == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} traffic collapsed while up (z<-3)"

      - alert: SustainedLinkGrowth
        expr: avg_over_time(rate(device_if_in_octets[5m])[1h:5m]) * 8 / (device_if_speed * 1e6 > 0) > 0.70
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} sustained >70% — plan upgrade"

      - alert: MemoryLeakTrend
        expr: delta(device_mem_percent[6h]) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} memory +{{ $value }}pp/6h — possible leak"

      - alert: StorageWillFill24h
        expr: predict_linear(device_storage_used[6h], 86400) > device_storage_size
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} storage{{ $labels.index }} projected full <24h"

      - alert: CPUBaselineRising
        expr: delta(avg_over_time(device_cpu_percent[1h])[12h:1h]) > 15
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} baseline CPU rising +{{ $value }}pp/12h"

  # ----------------------------------------------------------------------------
  # Latency / jitter / SLA   [NEEDS METRIC + VM mirror — see research §2.4]
  # ----------------------------------------------------------------------------
  - name: noc-sla
    interval: 30s
    rules:
      - alert: TunnelDown   # [NEEDS METRIC] tunnel_status to VictoriaMetrics
        expr: tunnel_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} DOWN"

      - alert: TunnelLatencyHigh   # [NEEDS METRIC]
        expr: tunnel_latency_ms > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency {{ $value }}ms > SLA"

      - alert: TunnelLatencyCritical   # [NEEDS METRIC]
        expr: tunnel_latency_ms > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency {{ $value }}ms — SLA breach"

      - alert: TunnelJitterHigh   # [NEEDS METRIC]
        expr: tunnel_jitter_ms > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} jitter {{ $value }}ms (voice/video risk)"

      - alert: TunnelLossHigh   # [NEEDS METRIC]
        expr: tunnel_loss_pct > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} loss {{ $value }}% — SLA breach"

      - alert: TunnelLatencyAnomaly   # [NEEDS METRIC]
        expr: (tunnel_latency_ms - avg_over_time(tunnel_latency_ms[2h])) / clamp_min(stddev_over_time(tunnel_latency_ms[2h]), 1) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Tunnel {{ $labels.tunnel }} latency anomaly (z>3)"

  # ----------------------------------------------------------------------------
  # Security / syslog   [NEEDS METRIC — syslog counterization not wired]
  # ----------------------------------------------------------------------------
  - name: noc-security
    interval: 30s
    rules:
      - alert: AuthFailureBurst   # [NEEDS METRIC] device_auth_failures_total
        expr: rate(device_auth_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} {{ $value }} auth failures/s (brute force?)"

      - alert: AuthFailureCritical   # [NEEDS METRIC]
        expr: rate(device_auth_failures_total[5m]) > 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} sustained login failures — credential attack"

      - alert: ConfigChanged   # [NEEDS METRIC] device_config_change_total
        expr: increase(device_config_change_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} running-config changed"

      - alert: PortAuthFailure   # [NEEDS METRIC] device_dot1x_failures_total
        expr: rate(device_dot1x_failures_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} if{{ $labels.index }} 802.1X failures"

  # ----------------------------------------------------------------------------
  # Stack self-health
  # ----------------------------------------------------------------------------
  - name: noc-self-health
    interval: 30s
    rules:
      - alert: CollectorDown
        expr: collector_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Collector {{ $labels.collector }} is down"

      - alert: CollectorAllTargetsUnreachable
        expr: collector_targets_reachable == 0 and collector_targets > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector {{ $labels.collector }} cannot reach any target"

      - alert: CollectorPartialReachability
        expr: collector_targets_reachable / clamp_min(collector_targets, 1) < 0.8 and collector_targets > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} reaching <80% of targets"

      - alert: CollectorPollSlow
        expr: collector_poll_duration_ms > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} poll {{ $value }}ms (slow)"

      - alert: NoSamplesIngested
        expr: collector_samples == 0 and collector_targets > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} produced 0 samples"

      - alert: StorageBackendDown   # [NEEDS METRIC] up{job=...} for stack services
        expr: up{job=~"opensearch|clickhouse|victoria|postgres|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Stack backend {{ $labels.job }} down"

  # ===========================================================================
  # STACK RESILIENCE — self-monitoring of the platform's own containers + host.
  # Backed by cAdvisor (per-container) + node-exporter (host). These fire when
  # auto-heal has NOT recovered a component (down / restart-loop / OOM) or when
  # a resource is being exhausted — the "alert when no auto-heal" layer.
  # ===========================================================================
  - name: stack-resilience
    rules:
      - alert: ContainerDown
        # cAdvisor stops reporting a container that has died/been removed.
        expr: absent(container_last_seen{name=~"netops-.+"}) or (time() - container_last_seen{name=~"netops-.+"} > 120)
        for: 2m
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.name }} is down (no cAdvisor data >2m)"
          description: "Auto-heal did not bring it back — investigate."

      - alert: ContainerRestartLoop
        # Start time changing repeatedly = crash/restart looping.
        expr: changes(container_start_time_seconds{name=~"netops-.+"}[15m]) > 3
        for: 5m
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.name }} restart-looping ({{ $value }} restarts/15m)"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name=~"netops-.+"}[10m]) > 0
        labels: { severity: critical, layer: stack }
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed — raise its mem_limit or fix the leak"

      - alert: ContainerMemoryNearLimit
        # Working set within 10% of the container's mem_limit → OOM risk / leak.
        expr: container_memory_working_set_bytes{name=~"netops-.+"} / container_spec_memory_limit_bytes{name=~"netops-.+"} > 0.90 and container_spec_memory_limit_bytes{name=~"netops-.+"} > 0
        for: 10m
        labels: { severity: warning, layer: stack }
        annotations:
          summary: "Container {{ $labels.name }} at {{ $value | humanizePercentage }} of its memory limit"

      - alert: ContainerCPUSaturated
        # Sustained near its CPU ceiling (quota/period = limit in cores).
        expr: rate(container_cpu_usage_seconds_total{name=~"netops-.+"}[5m]) / on(name) group_left() (container_spec_cpu_quota{name=~"netops-.+"} / container_spec_cpu_period{name=~"netops-.+"}) > 0.90
        for: 15m
        labels: { severity: warning, layer: stack }
        annotations:
          summary: "Container {{ $labels.name }} CPU-saturated against its limit for 15m"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 5m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Host memory available {{ $value | humanizePercentage }} — OOM-killer risk"

      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"} < 0.10
        for: 5m
        labels: { severity: critical, layer: host }
        annotations:
          summary: "Host disk {{ $labels.mountpoint }} below 10% free — ingestion will read-only-lock"

      - alert: HostCPULoadHigh
        expr: node_load5 / count(count(node_cpu_seconds_total) by (cpu)) > 2
        for: 10m
        labels: { severity: warning, layer: host }
        annotations:
          summary: "Host 5m load {{ $value }}× core count — sustained overload"

  # ----------------------------------------------------------------------------
  # Correlation-engine ingest health (#99 R6) — silent ingestion failures page.
  # ----------------------------------------------------------------------------
  # #100 ClickHouse bounded-IO guardrails (2026-07-09 incident). CH counters come
  # from ClickHouse's native prometheus exporter (:9363, vmscrape job
  # 'clickhouse'); corr_versions from the correlation /metrics exposition.
  # ----------------------------------------------------------------------------
  - name: noc-ch-bounded-io
    interval: 60s
    rules:
      - alert: CHQueryMemoryKilled
        # The 2 GiB per-query cap (query-spill.xml) fired — some query regressed
        # toward the incident shape (wide blob through a fold / whole-table
        # decorate). One kill = investigate; run scripts/ch-query-budget-check.sh
        # to attribute it by log_comment (api:<endpoint> / worker:*).
        expr: increase(ClickHouseProfileEvents_QueryMemoryLimitExceeded[10m]) > 0
        labels: { severity: critical, layer: clickhouse }
        annotations:
          summary: "ClickHouse memory-killed {{ $value }} quer(ies) in 10m — a read regressed toward the #100 incident shape; attribute via ch-query-budget-check.sh"

      - alert: CHFailedQueriesRising
        expr: increase(ClickHouseProfileEvents_FailedQuery[15m]) > 25
        for: 10m
        labels: { severity: warning, layer: clickhouse }
        annotations:
          summary: "ClickHouse failing {{ $value }} queries/15m — check system.query_log exceptions (read paths or ingest)"

      - alert: CorrVersionChurnUndamped
        # Sustained persists with ZERO damping means the material-hash gate
        # stopped suppressing storm churn (regression or heartbeat misconfig) —
        # corr_objects growth is heading back to the pre-#100 30x rate.
        expr: >
          increase(corr_versions{outcome="persisted"}[30m]) > 60
          and increase(corr_versions{outcome="damped"}[30m]) == 0
        for: 15m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation persisting {{ $value }} versions/30m with ZERO damped writes — the #100 write damper is not suppressing storm churn"

      - alert: CorrCurrentProjectionFailing
        # #101: corr_current is the hot-read source of truth for Command Center.
        # A lost projection dual-write = a STALE incident list (an incident that
        # closed still shows open, or never appears). The engine's history write
        # succeeded, so nothing else looks broken — this counter is the only
        # signal. Recovery: docs/runbooks/correlation-storm.md §projection;
        # the Go corr-current-reconcile worker force-repairs hourly.
        expr: increase(corr_current_projection_write_failures_total[10m]) > 0
        for: 5m
        labels: { severity: critical, layer: correlation }
        annotations:
          summary: "corr_current projection lost {{ $value }} write(s)/10m — Command Center may be serving STALE incidents; check correlation logs (corr_current projection write FAILED) and ClickHouse health"

      - alert: CorrTenantWriteAmpOverBudget
        # #101 tenant storm budget: >120 persisted versions inside one 5-minute
        # write-amp window (~24/min sustained) means one tenant's lane is
        # writing far beyond the damped steady-state (heartbeat-paced storms
        # persist ~1 version/object/15min). Bounded cardinality by design: the
        # metric only carries the top-K noisiest tenants. Attribution + full
        # history: SELECT from netops.corr_tenant_write_amp (correlation-storm
        # runbook).
        expr: max by (tenant_id) (corr_tenant_writes_window{outcome="persisted"}) > 120
        for: 15m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} persisted {{ $value }} correlation versions in one write-amp window — storm exceeding write budget; see correlation-storm runbook (chaos fixture? damping regression? real multi-entity incident?)"

  # Counters come from the correlation /metrics exposition (vmscrape job
  # 'correlation'); they are monotonic per process, so increase()/rate() are safe
  # across restarts.
  # ----------------------------------------------------------------------------
  - name: noc-corr-ingest
    interval: 60s
    rules:
      - alert: CorrDeadLettersRising
        expr: increase(corr_deadletters[15m]) > 0
        for: 5m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation dead-letters rising ({{ $value }} in 15m) — malformed events are being parked; check correlation logs"

      - alert: CorrEventsDroppedRising
        expr: sum by (counter) (increase(corr_ingest_events{counter=~".*_dropped"}[15m])) > 10
        for: 5m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation lane {{ $labels.counter }} rising ({{ $value }} in 15m) — events are being rejected (tenancy/normalization); check correlation logs"

      - alert: CorrProbeLaneFlatlined
        # The prober ticks 24/7 (30-60s interval), so probes_received must always
        # advance — a flat line means bus→consumer ingest is dead even if every
        # container looks healthy (the failure mode that hid the July lab outage).
        expr: increase(corr_ingest_events{counter="probes_received"}[15m]) == 0
        for: 15m
        labels: { severity: critical, layer: correlation }
        annotations:
          summary: "Correlation probe intake flat-lined 30m — bus→engine ingest is dead (check kafka, vector, correlation consumer)"

      - alert: CorrSyslogLaneFlatlined
        expr: increase(corr_ingest_events{counter="flows_received"}[30m]) == 0 and increase(corr_ingest_events{counter="metrics_received"}[30m]) == 0
        for: 30m
        labels: { severity: warning, layer: correlation }
        annotations:
          summary: "Correlation flow+metric intake flat-lined 1h — telemetry sources silent (lab down or edge-ingest broken)"
