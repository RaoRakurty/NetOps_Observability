# VictoriaMetrics self-monitoring scrape config (-promscrape.config).
#
# Prometheus was removed from the stack (#97 footprint pass): VM scrapes these
# targets natively, so the `up` series and all self-metrics land in the SAME
# store the alert engine (rules.yaml → /api/v1/query) and the in-app boards
# already read. One metrics store, one query API, one less service.
#
# Optional targets (cadvisor / node / grafana) belong to the `self-monitoring`
# add-on. When the add-on is disabled they simply don't resolve: VM runs with
# -promscrape.suppressScrapeErrors so that is silent, their `up` goes 0, and
# rules.yaml's ScrapeTargetDown is scoped to the always-on jobs so nothing
# false-fires on a default install.

global:
  # 30s is ample for stack self-observability and halves scrape/series churn;
  # every alert range window is >=5m (>=10 samples per window) so no rule
  # loses resolution (#96d).
  scrape_interval: 30s

scrape_configs:
  # ---- always-on (core appliance) -------------------------------------------
  - job_name: 'netops-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'

  - job_name: 'victoria'
    static_configs:
      - targets: ['localhost:8428']
    metrics_path: '/metrics'

  # Correlation engine intake counters (#99 R6) — silent ingestion failures
  # (received flat-lined / dropped rising / dead-letters) become alertable.
  # Scale P0: DNS discovery, not a static target. Correlation counters are
  # PER-PROCESS monotonic, and with `--scale correlation=N` a static
  # 'correlation:8000' target round-robins Docker DNS — one series stitched
  # from N different processes makes every increase()/flat-line alert lie.
  # A-record discovery scrapes EVERY replica as its own instance (single
  # replica: same one target as before, instance label = IP:8000).
  - job_name: 'correlation'
    dns_sd_configs:
      - names: ['correlation']
        type: A
        port: 8000
    metrics_path: '/metrics'

  # ClickHouse native Prometheus endpoint (enabled via <prometheus> in config).
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']

  # Vector internal metrics (both aggregator + router expose a prometheus
  # exporter on :9598 — see each vector.yaml internal_metrics source).
  - job_name: 'vector'
    static_configs:
      - targets: ['vector-aggregator:9598', 'vector-router:9598']

  # Kafka consumer LAG (F-46). Previously there was no kafka job here at all
  # and no lag metric anywhere in the stack — which meant partial degradation
  # was structurally invisible: every flat-line rule in rules.yaml needs
  # `increase(...) == 0` EXACTLY, so a consumer running 10x slow (the realistic
  # shape when ClickHouse or OpenSearch is struggling) tripped nothing at all.
  # Lag is also the only signal that tells "quiet bus, quiet network" apart
  # from "quiet bus, dead consumer" — producer and consumer rates read zero in
  # both cases, lag only grows in the second.
  #
  # The note below still holds — the BROKER itself has no Prometheus endpoint —
  # so this scrapes a small sidecar (kafka-exporter) that speaks the Kafka
  # admin protocol instead of JMX. Part of the `self-monitoring` add-on, so it
  # is a silent no-op under suppressScrapeErrors when the add-on is off.
  # Series of interest: kafka_consumergroup_lag{consumergroup,topic,partition},
  # kafka_consumergroup_lag_sum, kafka_topic_partition_current_offset.
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # NOTE: the embedded Kafka broker has no native Prometheus endpoint (JMX
  # only — a jmx-exporter sidecar was judged not worth the image/licensing
  # surface for a transit-only bus). Broker liveness = compose healthcheck +
  # api stack-health TCP probe; consumer progress = the kafka job above
  # (consumer-group lag), pipeline-watchdog.sh high-watermark deltas, and the
  # vector job above.

  # ---- self-monitoring add-on (optional; silent no-ops when disabled) -------
  # cAdvisor: per-CONTAINER cpu / memory / network / restart / OOM for EVERY
  # service in the stack — backbone for resource-exhaustion + restart alerts.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # node-exporter: host cpu / memory / disk / load / filesystem.
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cloud-ingest poller (lab-site sidecar): per-provider credential-exchange
  # counters (Wave 4 #13). Absent when the sidecar isn't deployed — silent
  # no-op under suppressScrapeErrors, same as the other optional targets.
  - job_name: 'cloud-ingest'
    static_configs:
      - targets: ['cloud-ingest:9109']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    # Grafana serves under the /grafana sub-path (serve_from_sub_path), so its
    # /metrics is exposed there too.
    metrics_path: '/grafana/metrics'
