<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Login backdrop artwork: preload so it's on screen the instant the app
         paints (it lives in public/ under a stable URL for exactly this). -->
    <link rel="preload" as="image" type="image/webp" href="/brand/eye-hero.webp" fetchpriority="high" />
    <title>Correlix — Network Observability</title>
    <!--
      No external CSS/CDN: the entire UI is styled by the bundled
      src/styles.css design system, so it renders fully offline. (The
      Overview previously depended on the Tailwind Play CDN, which left it
      unstyled whenever the CDN was blocked/unreachable.)
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
