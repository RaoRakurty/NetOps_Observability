<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tab mark: the Correlix eye-O (brand/CorrelixLogo.tsx at favicon scale) —
         a self-contained app tile (dark ground so it reads on any tab), ink
         ring, single-tone indigo iris, deep pupil, one catchlight. Inlined as a
         data URI — no binary favicon files. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='11' fill='%230b1020'/%3E%3Ccircle cx='24' cy='24' r='6.6' fill='%236366f1'/%3E%3Ccircle cx='24' cy='24' r='6.6' fill='none' stroke='%2305060d' stroke-opacity='.25' stroke-width='1'/%3E%3Ccircle cx='24' cy='24' r='3' fill='%2305060d'/%3E%3Ccircle cx='21.8' cy='21.8' r='1.1' fill='%23f8fafc'/%3E%3Ccircle cx='24' cy='24' r='15' fill='none' stroke='%23eef1f8' stroke-width='4.2'/%3E%3C/svg%3E" />
    <!-- Login backdrop artwork: preload so it's on screen the instant the app
         paints (it lives in public/ under a stable URL for exactly this). -->
    <link rel="preload" as="image" type="image/webp" href="/brand/eye-hero.webp" fetchpriority="high" />
    <title>Correlix — Network Observability</title>
    <!--
      No external CSS/CDN: the entire UI is styled by the bundled
      src/styles.css design system, so it renders fully offline. (The
      Overview previously depended on the Tailwind Play CDN, which left it
      unstyled whenever the CDN was blocked/unreachable.)
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
