# Collection catalog — HOW each (vendor, platform, version, signal-family) is
# collected, and — the load-bearing field — its VALIDATED FIDELITY.
#
# fidelity_status ladder (the product truth, NOT vendor docs):
#   doc_claimed     - a reference says the path/OID exists; UNTESTED here.
#   lab_validated   - replaying a captured fixture through normalize.py yields the
#                     correct canonical output in CI.
#   live_validated  - confirmed flowing end-to-end on the live lab.
#   degraded        - works in some conditions but fails in others (must carry issue_ref).
#   failed          - claimed by docs but proven NOT to work (must carry issue_ref).
#
# Rule: only lab_validated / live_validated rows may be advertised as "supported".
# doc_claimed rows are candidates. The cEOS-leaf BGP row below is why this matters.
version: 1

rows:
  # ===================== Phase 1: validated signal families =====================

  # ---- interfaces: oper-status (Arista cEOS, OpenConfig) ----
  - vendor: arista
    platform: ceos
    os_version: ">=4.30"
    signal_family: device_if_oper_status
    method: gnmi
    origin: openconfig
    path: "/interfaces/interface/state/oper-status"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/arista_ceos_4.36_if_operstatus_oc_once.jsonl
    cost: {series_per_device: "~ports", writes_per_min: "2x ports", device_cpu: low}
    notes: "UPPERCASE enum (UP/DOWN); interface_name tag -> ifName."

  # ---- memory: Nokia SR Linux (native, gNMI-owned) ----
  - vendor: nokia
    platform: srlinux
    os_version: ">=23.0"
    signal_family: device_mem_percent
    method: gnmi
    origin: native
    path: "/platform/control[slot=A]/memory"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/nokia_srl_24.10_memory_native_once.jsonl
    cost: {series_per_device: 1, writes_per_min: 2, device_cpu: low}
    notes: "memory/utilization leaf is a genuine 0-100 percent (verified). free/physical/reserved leaves dropped as unmapped."

  # ---- BGP peer-state: Nokia SR Linux (native) ----
  - vendor: nokia
    platform: srlinux
    os_version: ">=23.0"
    signal_family: device_bgp_peer_state
    method: gnmi
    origin: native
    path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address=*]/session-state"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/nokia_srl_24.10_bgp_native_once.jsonl
    cost: {series_per_device: "~peers", writes_per_min: "2x peers", device_cpu: low}
    notes: "lowercase enum (established/active); neighbor_peer-address -> peer. SRL streams established baseline reliably."

  # ---- BGP peer-state: Arista cEOS (OpenConfig) — edge router OK ----
  - vendor: arista
    platform: ceos
    os_version: ">=4.30"
    signal_family: device_bgp_peer_state
    method: gnmi
    origin: openconfig
    path: "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state/session-state"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/arista_ceos_4.36_bgp_oc_once.jsonl
    cost: {series_per_device: "~peers", writes_per_min: "2x peers", device_cpu: low}
    notes: "UPPERCASE enum (ESTABLISHED/ACTIVE); neighbor_neighbor-address -> peer. Validated on wan-r2 (edge)."

  # ---- BGP peer-state: Arista cEOS LEAF targets — DEGRADED (the cautionary row) ----
  - vendor: arista
    platform: ceos
    os_version: "4.36.*"
    signal_family: device_bgp_peer_state
    method: gnmi
    origin: openconfig
    deployment: persistent_multi_target
    path: "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state/session-state"
    mode: stream
    stream_mode: sample
    interval: 30s
    requires: {output_processor: event-override-ts}
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/arista_ceos_4.36_bgp_leaf_established_once.jsonl
    issue_ref: "ceos-bgp-gnmi-issue.md"
    notes: >-
      RESOLVED. cEOS stamps a STABLE established session's sampled response with
      the session's last-transition time (hours old on a steady fabric), not the
      sample time; VictoriaMetrics silently rejects those as stale, so cEOS leaf
      BGP vanished while spine/wan-r2 (fresh timestamps) landed. Confirmed via
      gNMIc /metrics (gnmic RECEIVED 7 msgs/leaf) + the bgpdiag file output
      (events emit device_bgp_peer_state:6 correctly with 137-min-old timestamps).
      FIX: canon-override-ts (event-override-ts) on the canonical prometheus_write
      output stamps collection time. All 4 leaves now live_validated (2 peers each,
      established=6). REQUIRES the output_processor above — without it, cEOS static
      state is dropped. Foundation lesson: validate to the STORE, not the collector
      output — a path that streams + normalizes can still be silently dropped by
      timestamp semantics at TSDB ingest.

  # ===================== Phase 3: doc_claimed candidate rows =====================
  # Imported from the P1-P5 research (telemetry-coverage-reference §A — verified
  # against primary standards). fidelity_status: doc_claimed = the path/OID EXISTS
  # per a reference but is UNVALIDATED here. NOT advertised as supported. Promotion
  # to lab_validated requires a captured fixture (Phase 4, vendor-by-vendor). No
  # fixture/issue_ref required at doc_claimed. source_ref cites the grounding.

  # --- BGP FSM established-transitions (flap counter) — PROMOTED: live on the lab ---
  - vendor: arista
    platform: ceos
    os_version: ">=4.30"
    signal_family: device_bgp_fsm_transitions
    method: gnmi
    origin: openconfig
    path: "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state/established-transitions"
    mode: stream
    stream_mode: sample
    interval: 30s
    requires: {output_processor: event-override-ts}   # same cEOS stale-ts class as peer-state
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/arista_ceos_4.36_bgp_fsm_transitions_oc_once.jsonl
    source_ref: "BGP4-MIB bgpPeerFsmEstablishedTransitions; OpenConfig bgp (coverage-reference §A)"
    cost: {series_per_device: "~peers", device_cpu: low}
    notes: "Added to the live oc-bgp subscription + canon-names. LIVE: 9 series in VM (cEOS leaves + wan-r2), established-transitions=1, clean {device,peer,vendor,vrf} labels, no stale-ts rejection. Pairs with device_bgp_peer_state to count flaps between samples."

  # --- BGP per-AFI prefixes received (fixes the v4-only blind spot) ---
  # LIVE-CAPTURE CORRECTED THE SPEC: OpenConfig uses a COMBINED afi-safi-name key
  # (IPV4_UNICAST / IPV6_UNICAST), not separate afi+safi like the SNMP BGP4V2-MIB
  # the spec was derived from. Kept doc_claimed pending the normalization update to
  # split/carry afi-safi-name — a concrete example of live capture correcting docs.
  - vendor: arista
    platform: ceos
    os_version: ">=4.30"
    signal_family: device_bgp_pfx_in
    method: gnmi
    origin: openconfig
    path: "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/received"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/arista_ceos_4.36_bgp_pfx_in_oc_once.jsonl
    source_ref: "BGP4V2-MIB bgp4V2PrefixInPrefixes (BGP4-MIB is v4-only); OpenConfig afi-safi (coverage-reference §A)"
    cost: {series_per_device: "~peers x afis", device_cpu: low}
    notes: "Added to the live oc-bgp subscription + canon-names + afi_safi label rename. LIVE: 27 series in VM across IPV4_UNICAST/IPV6_UNICAST/L2VPN_EVPN (EVPN=12 prefixes on leaves). Spec corrected after live capture: canonical label = afi_safi (OpenConfig combined key) not separate afi+safi. The multi-AFI coverage BGP4-MIB (v4-only) cannot provide."

  # --- IS-IS adjacency state (the IGP on the clos fabric) — LIVE on SRL ---
  - vendor: nokia
    platform: srlinux
    os_version: ">=23.0"
    signal_family: device_isis_adj_state
    method: gnmi
    origin: native
    path: "/network-instance[name=default]/protocols/isis/instance[name=*]/interface[interface-name=*]/adjacency[neighbor-system-id=*]/state"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: live_validated
    last_validated: "2026-06-13"
    fixture: fixtures/nokia_srl_24.10_isis_adj_native_once.jsonl
    source_ref: "ISIS-MIB isisISAdjState (RFC 4444); SRL native isis adjacency (coverage-reference §A)"
    cost: {series_per_device: "~adjacencies", device_cpu: low}
    notes: "Captured live on spine1 (4 L2 adjacencies, state=up, fresh timestamps — SRL has no cEOS stale-ts issue). The clos fabric's IGP. Adjacency exposes down-reason / up-down-transitions / neighbor-hostname for the event catalog."

  # --- OSPF neighbor state (resolves the events.yaml forward-ref) ---
  - vendor: arista
    platform: ceos
    os_version: ">=4.30"
    signal_family: device_ospf_nbr_state
    method: gnmi
    origin: openconfig
    path: "/network-instances/network-instance/protocols/protocol/ospfv2/areas/area/interfaces/interface/neighbors/neighbor/state"
    mode: stream
    stream_mode: sample
    interval: 30s
    fidelity_status: doc_claimed
    source_ref: "OSPF-MIB ospfNbrState; OpenConfig ospfv2 (coverage-reference §A)"
    cost: {series_per_device: "~adjacencies", device_cpu: low}
    live_capture:
      status: pending
      blocked_on: "wan-r2 has OSPF configured (log-adjacency-changes) but no confirmed active adjacency to capture a neighbor-state from. SRL spines expose ospf — candidate."
      how: "establish an OSPF adjacency in the lab, then gnmic subscribe the neighbor adjacency-state path + capture fixture"

  # --- MPLS LSP state (SP/DC service plane) ---
  - vendor: nokia
    platform: srlinux
    os_version: ">=23.0"
    signal_family: device_mpls_lsp_state
    method: gnmi
    origin: native
    path: "/network-instance/protocols/mpls/lsp/state"
    mode: stream
    stream_mode: on_change
    fidelity_status: doc_claimed
    source_ref: "RFC 3812 MPLS-TE-STD-MIB mplsTunnelOperStatus (coverage-reference §A)"
    cost: {series_per_device: "~lsps", device_cpu: low}
    live_capture:
      status: pending
      blocked_on: "clos lab does NOT run MPLS — SRL spine1 has no 'mpls' protocol element (offers bgp/bgp-evpn/bgp-vpn/ospf/isis/stp/pim). Needs an SP-style lab with MPLS/RSVP/LDP."
      how: "on an MPLS-running device, gnmic subscribe the LSP oper-state path + capture fixture"

  # --- LDP session state ---
  - vendor: nokia
    platform: srlinux
    os_version: ">=23.0"
    signal_family: device_ldp_session_state
    method: snmp
    origin: standard_mib
    path: "1.3.6.1.2.1.10.166.4.1.2.4.1.x (mplsLdpSessionState)"
    mode: poll
    interval: 60s
    fidelity_status: doc_claimed
    source_ref: "RFC 3815 MPLS-LDP-STD-MIB (coverage-reference §A)"
    cost: {series_per_device: "~ldp-peers", device_cpu: low}
    live_capture:
      status: pending
      blocked_on: "no LDP in the clos lab (no MPLS). Needs an SP lab running LDP."
      how: "snmpwalk mplsLdpSessionState on an LDP-running device + capture .snmprec-style fixture"
