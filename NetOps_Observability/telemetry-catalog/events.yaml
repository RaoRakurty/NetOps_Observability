# Event / parser catalog — Phase 2.
#
# The metric catalog (normalization.yaml) covers state/counters/gauges. Half of
# network root-cause lives in EVENTS (syslog, traps, NOTIFICATION reasons,
# adjchange). This catalog maps per-vendor log/trap grammars into a canonical
# event schema that shares the SAME identity model (identity.yaml) as the
# metrics — so an event and a metric about the same BGP peer / interface
# CORRELATE on the same identity keys.
#
# This is the SPEC; parse_events.py applies it and test_events.py proves it
# against captured syslog fixtures. It mirrors (and is the authoritative spec
# for) the correlation engine's src/correlation/producers.py syslog parsing.
#
# THE CORRELATION INVARIANT: each event family declares `correlates_with` — the
# metric family it pairs with — and `join_on` — the identity keys both sides
# share. bgp_adjacency_change (device,peer) ⨝ device_bgp_peer_state (device,peer).
version: 1

# Canonical event schema (every event family normalizes to these fields):
#   event_type   - canonical event family name
#   device       - canonical device identity (shared with metric plane)
#   ifName?      - interface identity (link/interface events)
#   vrf?         - network-instance (routing events; default if unstated)
#   peer?        - BGP/adjacency peer identity (shared with device_bgp_peer_state)
#   severity     - warn | high  (down beats up)
#   state        - up | down | unknown   (normalized transition direction)
#   reason_code? - vendor reason text where present (e.g. "Interface flap")
#   raw_ts       - device-stamped event time (event plane KEEPS true event time,
#                  unlike the sampled metric plane — see the cEOS timestamp lesson)
#   message      - original text (untrusted; rendered as escaped data only)

families:
  # ---- BGP adjacency change (the control-plane root-cause event) ----------
  bgp_adjacency_change:
    # RFC5424 tag (%FAC-SEV-MNEMONIC) arrives in appname; text after ':' in message.
    match_tag: "(BGP).*(ADJCHANGE|ADJCHG)"
    grammars:
      # Arista EOS: "%BGP-5-ADJCHANGE: peer 10.0.0.1 (AS 65001) old state Established event RecvNotify new state Idle"
      - vendor: arista
        peer_re: '\bpeer\s+(\d{1,3}(?:\.\d{1,3}){3})\b'
      # Cisco IOS:  "%BGP-5-ADJCHANGE: neighbor 10.0.0.1 Down Interface flap"
      - vendor: cisco
        peer_re: '\bneighbor\s+(\d{1,3}(?:\.\d{1,3}){3})\b'
      # generic fallback: first IP in the message
      - vendor: generic
        peer_re: '\b(\d{1,3}(?:\.\d{1,3}){3})\b'
    # Prefer the TRANSITION TARGET (the token after "new state") — a flap INTO
    # Established is an 'up' even though "old state Idle" mentions a down token.
    # Falls back to down-beats-up scan when no explicit new-state is present.
    target_state_re: '\bnew state\s+(\w+)'
    state: {down: '\b(?:down|idle|active|connect|backward|failed)\b', up: '\b(?:up|established|full)\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname, peer: peer_re}
    severity: {down: high, up: warn}
    correlates_with: device_bgp_peer_state
    join_on: [device, peer]

  # ---- OSPF adjacency change ---------------------------------------------
  ospf_adjacency_change:
    match_tag: "(OSPF).*(ADJCHANGE|ADJCHG)"
    grammars:
      # "%OSPF-5-ADJCHG: Process 1, Nbr 10.0.0.2 on Ethernet1 from FULL to DOWN"
      - vendor: generic
        peer_re: '\bNbr\s+(\d{1,3}(?:\.\d{1,3}){3})\b'
        ifname_re: '\bon\s+([A-Za-z][\w/.\-]*)'
    # OSPF: "...from FULL to DOWN" — target is the token after "to".
    target_state_re: '\bto\s+(\w+)'
    state: {down: '\bdown\b', up: '\bfull\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname, peer: peer_re, ifName: ifname_re}
    severity: {down: high, up: warn}
    correlates_with: device_ospf_nbr_state    # Phase 3 metric (doc_claimed)
    join_on: [device, peer]

  # ---- Link / line-protocol state change ---------------------------------
  link_state_change:
    match_tag: "(LINK|LINEPROTO).*(UPDOWN)"
    grammars:
      # "%LINK-3-UPDOWN: Interface Ethernet1, changed state to down"
      # "%LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet1, changed state to down"
      - vendor: generic
        ifname_re: '[Ii]nterface\s+([A-Za-z][\w/.\-]*)'
    state: {down: '\bdown\b', up: '\bup\b'}
    entity: {type: interface, key_from: [hostname, ifname_re]}
    labels: {device: hostname, ifName: ifname_re}
    severity: {down: high, up: warn}
    correlates_with: device_if_oper_status
    join_on: [device, ifName]

  # ---- LLDP neighbor change (L2 topology integrity; multi-vendor) ---------
  # The cleanest "neighbor vanished" root-cause: a port whose LLDP peer drops is
  # a cabling/link/peer-down signal that cross-checks the IS-IS/BGP adjacencies.
  lldp_neighbor_change:
    # Arista cEOS: appname "%LLDP-5-NEIGHBOR_NEW" / "%LLDP-5-NEIGHBOR_REMOVED".
    # Nokia SRL: appname nil; message carries "remotePeerAdded/remotePeerRemoved".
    # Matcher spans appname+message (see parse_event), so one family is bi-vendor.
    match_tag: "(LLDP.*NEIGHBOR|remotePeer(Added|Removed))"
    grammars:
      # Arista: "LLDP neighbor with chassisId .. and portId .. added on interface Ethernet2"
      # Nokia : "LLDP remote peer removed on interface ethernet-1/1: System leaf1 .."
      #   ([\w/.\-] stops at the ':' so both forms yield the local ifName).
      - vendor: generic
        ifname_re: '\bon interface\s+([A-Za-z][\w/.\-]*)'
    # added/new = neighbor present (up); removed/deleted/aged = neighbor lost (down).
    state: {down: '\b(?:removed|deleted|aged)\b', up: '\b(?:added|new)\b'}
    entity: {type: interface, key_from: [hostname, ifname_re]}
    labels: {device: hostname, ifName: ifname_re}
    severity: {down: high, up: warn}
    correlates_with: device_if_oper_status   # interface-scoped; a future device_lldp_frame_in is the more precise pair
    join_on: [device, ifName]

  # ---- STP topology change (L2 forwarding-state events) -------------------
  # A port leaving/entering the spanning tree, or a forwarding-state transition —
  # the L2 control-plane analogue of an adjacency change.
  stp_topology_change:
    # Arista cEOS: "%SPANTREE-6-INTERFACE_DEL/ADD/STATE". (SRL fabric is routed/
    # EVPN — no STP events; add an SRL xstp eventType here if STP appears on SRL.)
    match_tag: "(SPANTREE)"
    grammars:
      # "Interface Ethernet3 has been removed from instance MST0"
      # "Interface Ethernet3 instance MST0 moving from discarding to learning"
      - vendor: arista
        ifname_re: '\bInterface\s+([A-Za-z][\w/.\-]*)'
    # Prefer the transition TARGET (token after 'to'); fall back to message scan.
    # forwarding/learning/added = up-ward; removed/discarding/blocking = down.
    target_state_re: '\bto\s+(\w+)'
    state: {down: '\b(?:removed|discarding|blocking)\b', up: '\b(?:forwarding|learning|added)\b'}
    entity: {type: interface, key_from: [hostname, ifname_re]}
    labels: {device: hostname, ifName: ifname_re}
    severity: {down: high, up: warn}
    correlates_with: device_if_oper_status
    join_on: [device, ifName]

  # ---- IS-IS adjacency change (the IGP flap the METRIC plane cannot see) ---
  # The sampled/on-change metric misses an adjacency loss because SR Linux DELETES
  # the adjacency on neighbor-down (down = path absence, masked by TSDB lookback).
  # This event IS the authoritative flap record — it joins device_isis_adj_state
  # on (device, isis_neighbor). (Why the SRL event plane had to be wired.)
  isis_adjacency_change:
    # Nokia SRL: appname nil; message "isis|..|EV|isisAdjacencyChange|W: ... the
    #   level-2 IS-IS adjacency with system 0100.0000.0011, using interface
    #   ethernet-1/1.0, moved to state DOWN." Cisco IOS: "%CLNS-5-ADJCHANGE".
    match_tag: "(isisAdjacencyChange|ISIS.*ADJ|CLNS.*ADJCHANGE)"
    grammars:
      # SRL: system-id after 'system', local interface after 'using interface'.
      - vendor: nokia
        peer_re: '\bsystem\s+([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4})'
        ifname_re: '\busing interface\s+([A-Za-z][\w/.\-]*)'
      # generic fallback: first system-id-shaped token.
      - vendor: generic
        peer_re: '\b([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4})\b'
    # target after 'to state'; UP = up, DOWN/INIT/FAILED = down.
    target_state_re: '\bto state\s+(\w+)'
    state: {down: '\b(?:down|init|failed)\b', up: '\bup\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname, isis_neighbor: peer_re, ifName: ifname_re}
    severity: {down: high, up: warn}
    correlates_with: device_isis_adj_state
    join_on: [device, isis_neighbor]

  # ---- Firewall (NGFW) event plane — FortiOS, the reusable firewall pattern ----
  # FortiOS logs are key="value"; the Vector FortiOS parser normalizes device=devname
  # and surfaces type/subtype as appname. The same shape applies to Palo Alto (CSV) /
  # Versa with their own grammars — see [[netops-firewall-onboarding-methodology]].

  # Allowed/denied session (type="traffic").
  fortios_traffic:
    match_tag: 'type="traffic"'
    grammars:
      # "... srcintf=\"port3\" ... action=\"accept|deny|close|timeout\" ..."
      - vendor: fortinet
        ifname_re: 'srcintf="([^"]+)"'
    target_state_re: 'action="(\w+)"'
    state: {down: '\b(deny|drop|block|timeout|reset)\b', up: '\b(accept|start|close|allow)\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname, ifName: ifname_re}
    severity: {down: warn, up: warn}        # sessions are routine; threats carry severity
    correlates_with: device_session_count
    join_on: [device]

  # UTM / threat detection (type="utm": ips / virus / webfilter / app-control).
  # ANY UTM hit is a security signal → high, whether blocked or passthrough(detected).
  fortios_utm_threat:
    match_tag: 'type="utm"'
    grammars:
      - vendor: fortinet
        ifname_re: 'srcintf="([^"]+)"'
    target_state_re: 'action="(\w+)"'
    state: {down: '\b(block|blocked|dropped|reset|deny|quarantine)\b', up: '\b(pass|passthrough|allow|detected|monitor)\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname, ifName: ifname_re}
    severity: {down: high, up: high}
    correlates_with: device_session_count
    join_on: [device]

  # ---- Palo Alto NGFW (PAN-OS CSV syslog) — same firewall methodology as FortiOS,
  # different grammar. PAN logs are positional CSV: "...,<serial>,TYPE,SUBTYPE,...".
  # The SUBTYPE token is positionally fixed right after TYPE, so we anchor on
  # ",TRAFFIC,(subtype)," / ",THREAT,(subtype)," — robust without full CSV column
  # mapping (that lives in the Vector pan parser). doc_claimed (PAN-OS log ref). ----

  # Allowed/denied session (type TRAFFIC; subtype start/end = allowed, drop/deny = blocked).
  pan_traffic:
    match_tag: ',TRAFFIC,'
    grammars:
      - vendor: paloalto   # no positional regex extraction here — device from hostname
    target_state_re: ',TRAFFIC,(\w+),'
    state: {down: '\b(deny|drop)\b', up: '\b(start|end|allow)\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname}
    severity: {down: warn, up: warn}
    correlates_with: device_session_count
    join_on: [device]

  # Threat detection (type THREAT: vulnerability/virus/spyware/url/wildfire/...).
  # ANY threat log is a security signal → high (blocked or alerted).
  pan_threat:
    match_tag: ',THREAT,'
    grammars:
      - vendor: paloalto
    target_state_re: ',THREAT,(\w+),'
    state: {down: '\b(reset|drop|block|deny|sinkhole)\b', up: '\b(alert|allow|detected)\b'}
    entity: {type: device, key_from: hostname}
    labels: {device: hostname}
    severity: {down: high, up: high}
    correlates_with: device_session_count
    join_on: [device]
