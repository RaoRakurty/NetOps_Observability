# Event / parser catalog — Phase 2 + A3 (the catalog IS the executor).
#
# The metric catalog (normalization.yaml) covers state/counters/gauges. Half of
# network root-cause lives in EVENTS (syslog, traps, NOTIFICATION reasons,
# adjchange). This catalog maps per-vendor log/trap grammars into a canonical
# event schema that shares the SAME identity model (identity.yaml) as the
# metrics — so an event and a metric about the same BGP peer / interface
# CORRELATE on the same identity keys.
#
# A3 — ONE SOURCE OF TRUTH. Until A3 this file was a SPEC that
# src/correlation/producers.py mirrored by hand: every family had a hand-written
# `if` branch, the two could drift, and they DID (see `target_scope` below).
# Now the `rules:` rows below ARE the parser:
#
#     events.yaml  --bake_rules.py-->  src/correlation/parser_rules.py
#                                        (GENERATED, checked in, drift-guarded)
#                                              |
#                        +---------------------+---------------------+
#                        v                                           v
#            producers.classify()                         parse_events.parse_event()
#            (the runtime, → Signal)                      (conformance, → canonical event)
#
# There is no second grammar copy: one regex, read by both. A new symptom is a
# ROW here plus a fixture — never a new code branch.
#
# THE CORRELATION INVARIANT (unchanged): each event family declares
# `correlates_with` — the metric family it pairs with — and `join_on` — the
# identity keys both sides share. bgp_adjacency_change (device,peer) ⨝
# device_bgp_peer_state (device,peer).
version: 1

# HAND-BUMPED on any rule change; rides on every signal as `parser_rev`. Paired
# with the COMPUTED rules_hash: the constant is the intent, the hash the proof.
#
# 2026-09-06-218 — the linkDown/linkUp STATUS ENRICHMENT the A9 audit deferred
# (tracker 218). Both link rules now read the two varbinds RFC 2863 puts in the
# notification itself — `ifAdminStatus` and `ifOperStatus` — so an
# administratively-shut port is distinguishable from a fault, and a
# `lowerLayerDown` from a local failure. The A9 deferral rested on one claim:
# that this would "re-identify every link trap already stored". It does not, and
# the change is shaped so that it cannot: `state`, `entity`, `severity` and
# `native_id` are untouched, the two keys are `omit_empty` (present only when the
# device actually sent the varbind), and no event in the 1,151-entry golden
# corpus carries either varbind — so every stored/replayed link trap keeps a
# byte-identical attrs dict, native_id and signal_id. `rules_hash` moves because
# the TABLE moved; the parity run against the frozen pre-A3 branch code stays
# green with no new baseline skips.
#
# 2026-09-02-a9b — the A9 FOLLOW-UP: `device_config_change`, the symptom the
# audit found invisible. Two rules (`syslog.config.change`, `trap.config.change`)
# for one symptom on two observers, and the MIB severity seed that lets the trap
# half reach the engine at all (`gen_index.py SEVERITY_HINT`: config-change and
# hardware/environment notifications were `notice`/unhinted, i.e. BELOW
# `ALARM_SEVERITY_FLOOR`). The kind is consumed as an OPTIONAL clause by the
# adjacency families and the security hardening-drift story, so it is corroborating
# evidence and never a verdict of its own; `severity: info` keeps it below
# `severity_open_floor`, so it cannot open an RCA object by itself. No existing
# rule's grammar moved.
#
# 2026-09-02-a9 — the TRAP-COVERAGE audit (the tracker-184 exercise applied to
# SNMP traps): four trap rules promoted from the generic device_alarm to the
# SAME kind/entity/state vocabulary their syslog counterparts emit (OSPF and
# IS-IS adjacency, STP topology change, FHRP state change), plus the row-level
# `fidelity_status` claim they need. No existing rule's grammar moved, so the
# golden corpus replays byte-for-byte on every pre-A9 entry; `rules_hash` moves
# because the TABLE moved (four new rows), which is exactly what it is for.
#
# 2026-09-02-a3 — the rows became the parser. No GRAMMAR changed (the 1,123-entry
# golden corpus replays byte-for-byte against the pre-A3 branch code), but the
# corpus was restructured and `rules_hash` moved with it, so the human statement
# moves too: a hash that changed under an unchanged parser_rev is exactly the
# "someone forgot to bump" case the pairing exists to catch.
parser_rev: "2026-09-06-218"

# ══ SCHEMA: a `rules:` row ═══════════════════════════════════════════════════
#
# IDENTITY / PROVENANCE
#   rule_id      stable id; the Prometheus label and the provenance stamp. Fixed
#                set, so it can never be widened by a device string.
#   lane         syslog | trap | port | catalog
#                  syslog  → producers.syslog_control_signal (control plane)
#                  port    → producers.port_event_signal     (optics/DOM/FEC)
#                  trap    → producers.trap_control_signal
#                  catalog → conformance ONLY; NOT baked into the runtime image
#                            (a family the canonical-event spec covers and no
#                            correlation lane consumes yet — the firewall rows)
#   source       the wire Source value stamped on the Signal: syslog | trap
#   kind         the emitted Signal kind (∈ producers.EMITTED_KINDS for the
#                syslog/trap lanes)
#   entity_type  device | interface | device_or_interface (the DECLARED scope;
#                `emit.entity` decides per event when it is conditional)
#   fidelity_status
#                A9 — this ROW's own rung on the fidelity ladder (doc_claimed |
#                lab_validated | live_validated | degraded | failed), for a rule
#                whose symptom is already a catalog family but whose grammar is
#                evidenced differently from the family's other rules (a TRAP twin
#                of a syslog symptom is exactly that: promoting the shared family
#                would restate a syslog capture the trap says nothing about).
#                When set it WINS over the family lookup. It is a CATALOG claim,
#                never grammar: it does not enter `rules_hash`.
#   family       the event family this rule implements → the fidelity ladder
#                entry + the canonical event_type. null = grammar with no
#                catalog family (it makes no evidence claim and stamps
#                fidelity "code").
#   generic      the unclassified safety net (severity-floor alarm), not a typed
#                rule — counted separately in the promotion rate.
#   shadow       EVALUATED and COUNTED, emits NOTHING and falls through to the
#                next rule (A8). How a candidate grammar earns its promotion on
#                real traffic before it is allowed to produce evidence.
#
# SCREEN CONTRACT (the ingest pre-filter is DERIVED from these — see
# producers._build_syslog_screen)
#   markers      classification-token literals the guard tests. One per DISJUNCT
#                of the guard; where a guard is a conjunction, the more
#                selective conjunct.
#   pattern_src  the message regex the guard tests, as source text. MUST appear
#                as a `re` node inside `guard` (bake_rules validates it).
#   vendors      the vendor grammars this rule targets (documentation + audit)
#
# EXECUTION
#   guard        a boolean tree over the lane's haystacks. Node forms:
#                  {all: [...]} {any: [...]} {not: node} {always: bool}
#                  {contains: [FIELD, "LITERAL"]}
#                  {re: [FIELD, "pattern", FLAGS]}        FLAGS: "" | "i"
#                  {eq|ne: [FIELD, "value"]}
#                  {equals_any|not_in: [FIELD, [...]]}
#                  {truthy: FIELD}   {var_true: varname}
#                  {severity_floor: syslog|trap}
#                FIELD is a lane haystack or `$var` (an extraction, lazily run):
#                  syslog lane: msg, msg_u, tag, ctoken, ctoken_msg_u
#                  port lane:   pctoken, msg
#                  trap lane:   oid, name, etype
#   extract      name → extraction spec, LAZY and memoized per event (a rule may
#                carry fields only the catalog reads without taxing ingest).
#                  {const: v} {field: FIELD} {var: name} {lane: name}
#                  {ev: [k1, k2]}                first truthy raw event key
#                  {re: [[FIELD, pat, group, flags], ...]}   first alternative
#                  {findall: [FIELD, pat, flags]}  {nth: [listvar, i]}
#                  {vb: [oid...]} {vbname: [substr...]}      SNMP varbinds
#                  {pick: {find: [pat, flags], reject: [pat, flags]}}
#                  {alt: [spec, ...]}            first non-empty
#                  {bool: guard}  {case: [{when: guard, value: template}]}
#                  {template: "..."}  {severity_num: true}
#                  {scan: {...}}                 the STATE primitive:
#                     target/target_order  classify the TRANSITION TARGET first
#                     order/field/default  else scan the field in order
#                     target_scope: all|catalog  (see the divergence note)
#                     target_fallthrough: bool
#                plus post-transforms on any spec: `lower: true`, `slice: N`.
#   emit         kind, metric, modality, entity{type,id,when,else},
#                severity ({by_state}|{case}|{from_severity_num}|literal, or
#                omitted to use the row's fixed `severity`), native_id template,
#                content_tag (a var whose sha256 prefix discriminates the id —
#                tracker 198), tokens (templates; `local: true` qualifies a
#                DEVICE-LOCAL name as `<device>:<name>` — tracker 168), attrs.
#                Template placeholders are `{var}` and `{var|default}`; a token
#                whose vars are empty is DROPPED, never rendered as a stub.
#
# ══ KNOWN DIVERGENCE (exactly one, pinned by a test) ═════════════════════════
# `bgp_adjacency_change` declares `new state (\w+)` as its transition target
# with `target_scope: catalog`. The conformance reader honours it (a flap INTO
# Established is an `up`); the EXECUTABLE rule does not, because consulting it
# would re-classify every "old state X new state Y" line already stored. The
# defect is RECORDED here rather than hidden in a second grammar; closing it is
# a behaviour change that needs its own corpus re-bake.

# ── shared grammar fragments (YAML anchors — they expand at load, so the baked
#    table holds the literal text; nothing is indirect at runtime) ────────────
_frag:
  ip: &ip '\b(\d{1,3}(?:\.\d{1,3}){3})\b'
  mac: &mac '\b([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4}|(?:[0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})\b'
  sysid: &sysid '\b([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4})\b'
  ifword: &ifword '[Ii]nterface\s+([A-Za-z][\w/.\-]*)'
  port_shape: &port_shape '\b((?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)\b'
  # down BEATS up: 'old state Established new state Idle' is a down.
  updown: &updown
    - [down, '\b(?:down|idle|init|backward|failed)\b', 'i']
    - [up, '\b(?:up|established|full)\b', 'i']
  bgp_churn_pattern: &bgp_churn_pattern '\b(?:NOTIFICATION\s+(?:sent\s+to|received\s+from)|maximum\s+prefix-limit)\b'
  # The two tracker-184 BGP-churn rules share ONE guard; the subtype splits them.
  bgp_churn_guard: &bgp_churn_guard
    any:
      - all:
          - {contains: [ctoken, 'BGP']}
          - any:
              - {contains: [ctoken, 'NBR_RESET']}
              - {contains: [ctoken, 'MAXPFX']}
              - {contains: [ctoken, 'NOTIFICATION']}
      - {re: [msg, *bgp_churn_pattern, 'i']}
  bgp_churn_extract: &bgp_churn_extract
    peer: {re: [[msg, *ip, 1, '']]}
    # MNEMONIC FIRST, message second. %BGP-5-NBR_RESET states its reason as
    # "(BGP Notification received)" — reading the message first would file a
    # reset as a teardown. The message shapes are the JUNOS fallback only (rpd
    # puts no mnemonic in appname) and are anchored on the "sent to"/"received
    # from" that a Cisco reason text never contains.
    subtype:
      case:
        - {when: {contains: [ctoken, 'NBR_RESET']}, value: nbr_reset}
        - {when: {contains: [ctoken, 'MAXPFX']}, value: maxpfx}
        - {when: {contains: [ctoken, 'NOTIFICATION']}, value: notification}
        - {when: {re: [msg, '\bmaximum\s+prefix-limit\b', 'i']}, value: maxpfx}
        - {when: {always: true}, value: notification}
    # The peer was actually torn down: an explicit limit-exceeded / shutdown.
    shut: {bool: {re: [msg, '\b(?:exceed(?:ed|s)?|shut\s?down|shutdown|disabl\w*)\b', 'i']}}
    # The reason a vendor puts in parentheses. Bounded: untrusted text.
    reason:
      pick:
        field: msg
        find: ['\(([^)\n]{1,64})\)', '']
        reject: ['(?:afi|external\s+as|internal\s+as|instance|as)\b|^[\d.%\s]+$', 'i']
    # NOTIFICATION code/subcode ("6/4" on IOS; "code 6 ... subcode 4" on Junos).
    code_a: {re: [[msg, '\b(\d{1,2})/(\d{1,2})\b', 1, ''], [msg, '\bcode\s+(\d{1,2})\b[^\n]{0,40}?\bsubcode\s+(\d{1,3})\b', 1, 'i']]}
    code_b: {re: [[msg, '\b(\d{1,2})/(\d{1,2})\b', 2, ''], [msg, '\bcode\s+(\d{1,2})\b[^\n]{0,40}?\bsubcode\s+(\d{1,3})\b', 2, 'i']]}
    code: {case: [{when: {truthy: '$code_a'}, value: '{code_a}/{code_b}'}]}
    # Prefix counts: IOS "reaches 12000, max 250000"; Junos "nlri: 9000".
    pfx_count: {re: [[msg, '\breaches\s+(\d{1,10})\b', 1, 'i'], [msg, '\bnlri:\s*(\d{1,10})\b', 1, 'i'], [msg, ':\s*(\d{1,10})\s+exceed', 1, 'i']]}
    pfx_max: {re: [[msg, '\bmax(?:imum)?[\s:]+(\d{1,10})\b', 1, 'i'], [msg, '\blimit\s+(\d{1,10})\b', 1, 'i']]}
  trap_iface: &trap_iface
    alt:
      - {vb: ['1.3.6.1.2.1.31.1.1.1.1']}     # ifName  (matches the metric model)
      - {vb: ['1.3.6.1.2.1.2.2.1.2']}        # ifDescr
      - {vb: ['1.3.6.1.2.1.2.2.1.1']}        # ifIndex
      - {vbname: [ifname, ifdescr, interfacename, intfname]}
      - {const: unknown}

  # ── tracker 218: the link trap's two STATUS varbinds ───────────────────────
  #
  # RFC 2863 defines the notification as
  #     linkDown NOTIFICATION-TYPE OBJECTS { ifIndex, ifAdminStatus, ifOperStatus }
  # (vendored verbatim at src/backend/collectors/mibs/vendored/IF-MIB), and the
  # DESCRIPTION says the ifOperStatus value is included precisely to say which
  # state the link fell FROM. Without them a linkDown is one undifferentiated
  # event: an operator shutting a port and a fibre cut look identical.
  #
  # They are OPTIONAL on the wire in practice (an agent may send ifIndex alone,
  # and the vendor `.event_type` twin may carry no IF-MIB varbind at all), so the
  # emit block lists them under `omit_empty`: present ⇒ the key is emitted,
  # absent ⇒ the key does not exist. That is what makes this enrichment purely
  # ADDITIVE — see the rule below.
  #
  # DECODING. Agents render an INTEGER enum three ways: the bare int (`2`), the
  # label (`down`), or `down(2)`. The ladders here are the enums of the VENDORED
  # IF-MIB, lower-cased, and nothing else — `test_link_status_enrichment_218.py`
  # checks them BOTH WAYS against `collectors/mibs/index/oididx.json`, so a label
  # written from memory cannot ship. `unknown` doubles as the "the varbind was
  # there and did not decode" sentinel; for ifOperStatus that is also enum 4,
  # which means the same thing ("status cannot be determined").
  trap_admin_raw: &trap_admin_raw
    alt:
      - {vb: ['1.3.6.1.2.1.2.2.1.7']}        # ifAdminStatus
      - {vbname: [ifadminstatus]}
    lower: true
  trap_oper_raw: &trap_oper_raw
    alt:
      - {vb: ['1.3.6.1.2.1.2.2.1.8']}        # ifOperStatus
      - {vbname: [ifoperstatus]}
    lower: true
  # ifAdminStatus: up(1), down(2), testing(3).
  trap_admin_status: &trap_admin_status
    case:
      - {when: {re: ['$admin_raw', '\b(?:testing|3)\b']}, value: testing}
      - {when: {re: ['$admin_raw', '\b(?:down|2)\b']}, value: down}
      - {when: {re: ['$admin_raw', '\b(?:up|1)\b']}, value: up}
      - {when: {truthy: '$admin_raw'}, value: unknown}
  # ifOperStatus: up(1), down(2), testing(3), unknown(4), dormant(5),
  # notPresent(6), lowerLayerDown(7). Longest labels first: the ladder is walked
  # in order and `lowerlayerdown` must not be read as `down`.
  trap_oper_status: &trap_oper_status
    case:
      - {when: {re: ['$oper_raw', '\b(?:lowerlayerdown|7)\b']}, value: lowerlayerdown}
      - {when: {re: ['$oper_raw', '\b(?:notpresent|6)\b']}, value: notpresent}
      - {when: {re: ['$oper_raw', '\b(?:dormant|5)\b']}, value: dormant}
      - {when: {re: ['$oper_raw', '\b(?:unknown|4)\b']}, value: unknown}
      - {when: {re: ['$oper_raw', '\b(?:testing|3)\b']}, value: testing}
      - {when: {re: ['$oper_raw', '\b(?:down|2)\b']}, value: down}
      - {when: {re: ['$oper_raw', '\b(?:up|1)\b']}, value: up}
      - {when: {truthy: '$oper_raw'}, value: unknown}

# ══ THE RULE TABLE ═══════════════════════════════════════════════════════════
# Declared in CLASSIFICATION ORDER within each lane, because ORDER IS BEHAVIOUR:
# the interpreter evaluates a lane's rules in sequence, first match wins, and
# `rules_hash` covers the order for exactly that reason.
rules:

  # ── syslog control plane ───────────────────────────────────────────────────

  # IS-IS adjacency — Nokia SR Linux emits "isisAdjacencyChange" in the message
  # with a nil appname; Cisco IOS uses %CLNS-5-ADJCHANGE. Checked before the
  # generic ADJCHANGE rule so CLNS isn't misfiled as "routing". Device-scoped;
  # peer = the IS-IS system-id (the shared adjacency identity).
  #
  # The sampled/on-change METRIC misses an adjacency loss because SR Linux
  # DELETES the adjacency on neighbor-down (down = path absence, masked by TSDB
  # lookback). This event IS the authoritative flap record.
  - rule_id: syslog.isis.adjacency_change
    lane: syslog
    source: syslog
    kind: isis_adjacency_change
    entity_type: device
    family: isis_adjacency_change
    vendors: [nokia, cisco]
    markers: [ISISADJACENCYCHANGE, CLNS]
    state_re: 'to state\s+(\w+)'
    guard:
      any:
        - {contains: [msg_u, 'ISISADJACENCYCHANGE']}
        - all:
            - {contains: [ctoken, 'CLNS']}
            - {contains: [ctoken, 'ADJ']}
    extract:
      peer: {re: [[msg, *sysid, 1, '']]}
      # local interface — a canonical label the catalog reads; the Signal does
      # not carry it, so it is only ever computed by the conformance reader.
      ifname: {re: [[msg, '\busing interface\s+([A-Za-z][\w/.\-]*)', 1, 'i']]}
      tgt: {re: [[msg, 'to state\s+(\w+)', 1, 'i']]}
      state: {scan: {target: tgt, order: *updown, field: msg, default: unknown}}
    emit:
      kind: isis_adjacency_change
      metric: isis_adjacency
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|isis_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        tag: {alt: [{var: tag}, {const: isisAdjacencyChange}]}

  # BGP adjacency change (the control-plane root-cause event).
  #   Arista EOS: "%BGP-5-ADJCHANGE: peer 10.0.0.1 (AS 65001) old state
  #               Established event RecvNotify new state Idle"
  #   Cisco IOS : "%BGP-5-ADJCHANGE: neighbor 10.0.0.1 Down Interface flap"
  #   Junos rpd : "NOTIFICATION received from 10.0.0.1 (External AS 65001): …"
  #               (that shape is syslog.bgp.notification, below)
  #
  # WHY ONE GENERIC PEER REGEX AND NOT THREE VENDOR-ANCHORED ONES. The vendor
  # shapes really are distinct — `\bpeer\s+<ip>` (Arista), `\bneighbor\s+<ip>`
  # (Cisco), `\b(?:sent to|received from)\s+<ip>` (Junos) — and the catalog used
  # to spell each out. The EXECUTABLE rule has always taken the first IP in the
  # message instead, and the two agree on every line either has ever seen, so
  # migrating the anchored set in would have been a behaviour change (a line
  # naming two addresses would pick a different one) with no evidence behind it.
  # The vendor shapes are recorded here; promoting them to the grammar is a
  # deliberate change with its own corpus re-bake, not a side effect of A3.
  - rule_id: syslog.bgp.adjacency_change
    lane: syslog
    source: syslog
    kind: bgp_adjacency_change
    entity_type: device
    family: bgp_adjacency_change
    vendors: [cisco, arista, juniper]
    markers: [ADJCHANGE, ADJCHG]
    guard:
      all:
        - any:
            - {contains: [ctoken, 'ADJCHANGE']}
            - {contains: [ctoken, 'ADJCHG']}
        - {contains: [ctoken, 'BGP']}
    extract:
      peer: {re: [[msg, *ip, 1, '']]}
      tgt_new: {re: [[msg, '\bnew state\s+(\w+)', 1, 'i']]}
      # target_scope: catalog — THE DIVERGENCE. See the header note.
      state:
        scan:
          target: tgt_new
          target_scope: catalog
          target_fallthrough: true
          order: *updown
          field: msg
          default: unknown
    emit:
      kind: bgp_adjacency_change
      metric: bgp_adjacency
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|bgp_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        tag: {var: tag}

  # OSPF adjacency change:
  #   "%OSPF-5-ADJCHG: Process 1, Nbr 10.0.0.2 on Ethernet1 from FULL to DOWN"
  - rule_id: syslog.ospf.adjacency_change
    lane: syslog
    source: syslog
    kind: ospf_adjacency_change
    entity_type: device
    family: ospf_adjacency_change
    vendors: [cisco, arista]
    markers: [ADJCHANGE, ADJCHG]
    guard:
      all:
        - any:
            - {contains: [ctoken, 'ADJCHANGE']}
            - {contains: [ctoken, 'ADJCHG']}
        - {contains: [ctoken, 'OSPF']}
    extract:
      peer: {re: [[msg, *ip, 1, '']]}
      ifname: {re: [[msg, '\bon\s+([A-Za-z][\w/.\-]*)', 1, 'i']]}
      state: {scan: {order: *updown, field: msg, default: unknown}}
    emit:
      kind: ospf_adjacency_change
      metric: ospf_adjacency
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|ospf_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        tag: {var: tag}

  # Any other protocol's ADJCHANGE (%RIB-5-ADJCHANGE, …). No catalog family: the
  # grammar exists only here and makes no evidence claim → fidelity "code".
  - rule_id: syslog.routing.adjacency_change
    lane: syslog
    source: syslog
    kind: routing_adjacency_change
    entity_type: device
    family: null
    vendors: [generic]
    markers: [ADJCHANGE, ADJCHG]
    guard:
      any:
        - {contains: [ctoken, 'ADJCHANGE']}
        - {contains: [ctoken, 'ADJCHG']}
    extract:
      peer: {re: [[msg, *ip, 1, '']]}
      state: {scan: {order: *updown, field: msg, default: unknown}}
    emit:
      kind: routing_adjacency_change
      metric: routing_adjacency
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|routing_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        tag: {var: tag}

  # BGP NOTIFICATION (tracker 184). RFC 4271 §6 — a speaker that sends or
  # receives a NOTIFICATION CLOSES the session, so the line IS an adjacency
  # transition (state down), and on several platforms it is the ONLY line
  # logged for a teardown. Anchored on "sent to"/"received from" so a Cisco
  # %BGP-5-NBR_RESET reason ("(BGP Notification received)") is NOT read as one.
  - rule_id: syslog.bgp.notification
    lane: syslog
    source: syslog
    kind: bgp_adjacency_change
    entity_type: device
    family: bgp_adjacency_change
    vendors: [cisco, juniper]
    markers: [NBR_RESET, MAXPFX, NOTIFICATION]
    pattern_src: *bgp_churn_pattern
    state: down
    severity: high
    guard:
      all:
        - *bgp_churn_guard
        - {not: {contains: [ctoken, 'NBR_RESET']}}
        - {not: {contains: [ctoken, 'MAXPFX']}}
        - any:
            - {contains: [ctoken, 'NOTIFICATION']}
            - {not: {re: [msg, '\bmaximum\s+prefix-limit\b', 'i']}}
    extract:
      <<: *bgp_churn_extract
      state: {const: down}
    emit:
      kind: bgp_adjacency_change
      metric: bgp_adjacency
      modality: control_plane
      entity: {type: device, id: '{host}'}
      # `notify` keeps this distinct from the ADJCHANGE rule's id, so both
      # reports of one teardown survive in the same millisecond.
      native_id: '{host}|bgp_adj|notify|{peer|?}|{code|-}|down|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        subtype: {const: notification}
        code: {var: code}
        reason: {var: reason}
        tag: {var: tag}

  # BGP session churn / prefix pressure (tracker 184). A reset reason may be a
  # soft/administrative clear and a MAXPFX warning leaves the session
  # ESTABLISHED — calling either "adjacency down" would be a false session-down,
  # so they get their own state-bearing, peer-tokened kind. Per-prefix churn has
  # NO syslog form on any vendor (it is BMP/BGP-UPDATE data); this is its
  # session-level shadow, which is all syslog can carry.
  - rule_id: syslog.bgp.route_churn
    lane: syslog
    source: syslog
    kind: bgp_route_churn
    entity_type: device
    family: bgp_route_churn
    vendors: [cisco, juniper]
    markers: [NBR_RESET, MAXPFX, NOTIFICATION]
    pattern_src: *bgp_churn_pattern
    state_re: '\b(?:exceed(?:ed|s)?|shut\s?down|shutdown|disabl\w*)\b'
    guard: *bgp_churn_guard
    extract:
      <<: *bgp_churn_extract
      maxpfx: {bool: {eq: ['$subtype', maxpfx]}}
      # A limit that was EXCEEDED shuts the peer; a threshold warning does not.
      state:
        case:
          - when: {all: [{var_true: maxpfx}, {var_true: shut}]}
            value: down
          - {when: {always: true}, value: churn}
    emit:
      kind: bgp_route_churn
      metric: bgp_route_churn
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|bgp_churn|{subtype}|{peer|?}|{pfx_count|-}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        subtype: {var: subtype}
        reason: {var: reason}
        prefix_count: {var: pfx_count}
        prefix_max: {var: pfx_max}
        tag: {var: tag}

  # Link / line-protocol state change:
  #   "%LINK-3-UPDOWN: Interface Ethernet1, changed state to down"
  #   "%LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet1, changed …"
  - rule_id: syslog.link.state_change
    lane: syslog
    source: syslog
    kind: link_state_change
    entity_type: interface
    family: link_state_change
    vendors: [cisco, arista]
    markers: [UPDOWN]
    guard:
      all:
        - any:
            - {contains: [ctoken, 'LINK']}
            - {contains: [ctoken, 'LINEPROTO']}
        - {contains: [ctoken, 'UPDOWN']}
    extract:
      ifname: {alt: [{re: [[msg, *ifword, 1, '']]}, {const: unknown}]}
      state: {scan: {order: *updown, field: msg, default: unknown}}
    emit:
      kind: link_state_change
      metric: link_state
      modality: control_plane
      entity: {type: interface, id: '{host}:{ifname}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|link|{ifname}|{state}|{ts_ms}'
      # tracker 168: entity_id is already host:ifname — a BARE local name would
      # weld every device in the estate that owns the same port number.
      tokens: [{t: '{host}'}]
      attrs:
        interface: {var: ifname}
        state: {var: state}
        tag: {var: tag}

  # LLDP neighbor change — the cleanest "neighbor vanished" root-cause: a port
  # whose LLDP peer drops cross-checks the IS-IS/BGP adjacencies. Arista cEOS
  # %LLDP-5-NEIGHBOR_NEW/REMOVED; Nokia SRL nil appname + "remotePeerAdded/
  # Removed" in the message.
  - rule_id: syslog.lldp.neighbor_change
    lane: syslog
    source: syslog
    kind: lldp_neighbor_change
    entity_type: interface
    family: lldp_neighbor_change
    vendors: [arista, nokia]
    markers: [LLDP, REMOTEPEER]
    state_re: '\b(?:removed|deleted|aged)\b'
    guard:
      any:
        - all:
            - {contains: [ctoken, 'LLDP']}
            - {contains: [ctoken, 'NEIGHBOR']}
        - {contains: [msg_u, 'REMOTEPEER']}
    extract:
      ifname:
        alt:
          - {re: [[msg, 'on interface\s+([A-Za-z][\w/.\-]*)', 1, 'i'], [msg, *ifword, 1, '']]}
          - {const: unknown}
      state:
        scan:
          order:
            - [down, '\b(?:removed|deleted|aged)\b', 'i']
            - [up, '\b(?:added|new)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: lldp_neighbor_change
      metric: lldp_neighbor
      modality: control_plane
      entity: {type: interface, id: '{host}:{ifname}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|lldp|{ifname}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        interface: {var: ifname}
        state: {var: state}
        tag: {alt: [{var: tag}, {const: remotePeer}]}

  # STP topology change, INTERFACE-scoped — cEOS %SPANTREE-6-INTERFACE_DEL/ADD/
  # STATE. Prefer the transition target ("… to learning/forwarding").
  - rule_id: syslog.stp.topology_change
    lane: syslog
    source: syslog
    kind: stp_topology_change
    entity_type: interface
    family: stp_topology_change
    vendors: [cisco, arista]
    markers: [SPANTREE]
    state_re: '\bto\s+(forwarding|learning|discarding|blocking)\b'
    guard:
      all:
        - {contains: [tag, 'SPANTREE']}
        - any:
            - {re: [msg, *ifword, '']}
            - {re: [msg, *port_shape, '']}
    extract: &stp_extract
      ifname: {re: [[msg, *ifword, 1, ''], [msg, *port_shape, 1, '']]}
      inst_a: {re: [[msg, '\binstance\s+([A-Za-z0-9_\-]{1,32})\b', 1, 'i']]}
      inst_b: {re: [[msg, '\bvlan\s*(\d{1,4})\b', 1, 'i']]}
      inst_c: {re: [[msg, '\b(MST\d{1,4})\b', 1, '']]}
      # `instance` is the vendor's own token (the canonical `stp_instance`
      # label); `inst_tok` is the device-local grounding token, which prefixes a
      # PVST VLAN so `vlan100` can never collide with an MST instance NAMED 100.
      instance: {alt: [{var: inst_a}, {var: inst_b}, {var: inst_c}]}
      inst_a_low: {var: inst_a, lower: true}
      inst_c_low: {var: inst_c, lower: true}
      inst_tok:
        case:
          - {when: {truthy: '$inst_a'}, value: '{inst_a_low}'}
          - {when: {truthy: '$inst_b'}, value: 'vlan{inst_b}'}
          - {when: {always: true}, value: '{inst_c_low}'}
      tgt: {re: [[msg, '\bto\s+(forwarding|learning|discarding|blocking)\b', 1, 'i']]}
      state:
        scan:
          target: tgt
          target_order:
            - [up, '(?:forwarding|learning)', 'i']
            - [down, '(?:discarding|blocking)', 'i']
          order:
            - [down, '\b(?:removed|discarding|blocking)\b', 'i']
            - [up, '\b(?:added|forwarding|learning)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: stp_topology_change
      metric: stp_state
      modality: control_plane
      entity: {type: interface, id: '{host}:{ifname}'}
      severity: {by_state: {down: high}, default: warn}
      # An interface-scoped STP signal keeps its identity BYTE-FOR-BYTE: the
      # port is the content, and those lines never collapsed.
      native_id: '{host}|stp|{ifname}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        interface: {var: ifname}
        instance: {var: instance}
        state: {var: state}
        tag: {var: tag}

  # STP topology-change NOTIFICATION (tracker 184) — a domain-wide TCN names NO
  # interface: "%SPANTREE-5-TOPOTRAP: Topology Change Trap for instance MST0"
  # (PVST: "for vlan 100"). The old branch fell back to the literal "unknown",
  # so EVERY TCN landed on the SYNTHETIC entity `<host>:unknown` — one fake
  # interface node per device that fused unrelated topology changes. There is
  # nothing interface-shaped to key on, so a TCN is keyed on the DEVICE with the
  # instance/VLAN as a device-local grounding token.
  - rule_id: syslog.stp.topology_notification
    lane: syslog
    source: syslog
    kind: stp_topology_change
    entity_type: device
    family: stp_topology_notification
    vendors: [cisco]
    markers: [SPANTREE]
    state_re: '\bto\s+(forwarding|learning|discarding|blocking)\b'
    guard: {contains: [tag, 'SPANTREE']}
    extract: *stp_extract
    emit:
      kind: stp_topology_change
      metric: stp_state
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      # The instance is the only content a TCN carries; without it two TCNs for
      # two different instances in one millisecond were ONE signal.
      native_id: '{host}|stp_tcn|{instance|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{inst_tok}', local: true}]
      attrs:
        interface: {var: ifname}
        instance: {var: instance}
        state: {var: state}
        tag: {var: tag}

  # VTEP / NVE peer reachability (DC overlay) — NX-OS
  # %NVE-5-BFD_CC_STATE_CHANGE ("BFD CC down for bfd-neighbor <remote-VTEP>"):
  # the underlay→VTEP liveness that gates VXLAN-encapsulated traffic. The remote
  # VTEP IP is a grounding token so it binds to underlay reachability/BGP to
  # that loopback.
  - rule_id: syslog.vtep.state_change
    lane: syslog
    source: syslog
    kind: vtep_state_change
    entity_type: device
    family: null
    vendors: [cisco]
    markers: [NVE, VTEP]
    guard:
      any:
        - {contains: [ctoken, 'NVE']}
        - all:
            - {contains: [ctoken, 'VTEP']}
            - {contains: [ctoken_msg_u, 'BFD']}
    extract:
      peer: {re: [[msg, *ip, 1, '']]}
      state: {scan: {order: *updown, field: msg, default: unknown}}
    emit:
      kind: vtep_state_change
      metric: vtep_state
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{host}|vtep|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{host}'}, {t: '{peer}'}]
      attrs:
        vtep: {var: peer}
        state: {var: state}
        tag: {var: tag}

  # EVPN MAC mobility / duplicate-MAC freeze (DC overlay) — the cross-VTEP
  # analogue of a local mac_flap: Arista %EVPN-3-BLACKLISTED_DUPLICATE_MAC,
  # NX-OS %HMM-2-DUP_HOSTS, %L2FM-2-L2FM_VXLAN_MAC_MOVE_PORT_DOWN. Checked
  # BEFORE the local mac_flap rule (NX-OS "VXLAN_MAC_MOVE" else hits it).
  - rule_id: syslog.evpn.mac_move
    lane: syslog
    source: syslog
    kind: evpn_mac_move
    entity_type: device
    family: null
    vendors: [arista, cisco]
    markers: [EVPN, HMM, DUP_HOST, VXLAN_MAC_MOVE]
    pattern_src: '\b(?:blacklisted|duplicate host|between NVE and)\b'
    severity: high
    guard:
      any:
        - {contains: [ctoken, 'EVPN']}
        - {contains: [ctoken, 'HMM']}
        - {contains: [ctoken, 'DUP_HOST']}
        - {contains: [ctoken, 'VXLAN_MAC_MOVE']}
        - {re: [msg, '\b(?:blacklisted|duplicate host|between NVE and)\b', 'i']}
    extract:
      mac: {re: [[msg, *mac, 1, '']]}
      vlan: {re: [[msg, '\bvlan\s*(\d+)\b', 1, 'i']]}
      vni: {re: [[msg, '\bvni\s*(\d+)\b', 1, 'i']]}
      vtep: {re: [[msg, 'VTEP\s+(\d{1,3}(?:\.\d{1,3}){3})', 1, 'i']]}
      blacklisted: {bool: {re: [msg, 'blacklist|frozen|disabl|port[\s-]?down', 'i']}}
    emit:
      kind: evpn_mac_move
      metric: evpn_mac_move
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|evpn_mac|{mac|?}|vlan{vlan|?}|{ts_ms}'
      # A MAC is genuinely GLOBAL — two devices seeing the same MAC really are
      # related (tracker 168) — so it stays bare, unlike a VLAN id or a port.
      tokens:
        - {t: '{host}'}
        - {t: '{mac}'}
        - {t: 'vlan{vlan}'}
        - {t: 'vni{vni}'}
        - {t: '{vtep}'}
      tokens_fallback: host
      attrs:
        mac: {var: mac}
        vlan: {var: vlan}
        vni: {var: vni}
        vtep: {var: vtep}
        blacklisted: {var: blacklisted}
        tag: {var: tag}

  # First-hop redundancy (HSRP/VRRP) state change — Cisco %HSRP-5-STATECHANGE /
  # %STANDBY-6-STATECHANGE, %VRRP-6-STATECHANGE. "-> Active"/"-> Master" is a
  # TAKEOVER (a failover happened). Device-scoped; group + interface are
  # DEVICE-LOCAL and therefore qualified (tracker 168): two routers in one FHRP
  # group must relate through topology, not through a group number.
  - rule_id: syslog.fhrp.state_change
    lane: syslog
    source: syslog
    kind: fhrp_state_change
    entity_type: device
    family: null
    vendors: [cisco, arista]
    markers: [HSRP, VRRP, STANDBY]
    state_re: '->\s*(\w+)'
    guard:
      any:
        - {contains: [ctoken, 'HSRP']}
        - {contains: [ctoken, 'VRRP']}
        - {contains: [ctoken, 'STANDBY']}
    extract:
      proto:
        case:
          - {when: {contains: [ctoken, 'VRRP']}, value: vrrp}
          - {when: {always: true}, value: hsrp}
      group: {re: [[msg, '\b[Gg]r(?:ou)?p\s+(\d+)\b', 1, '']]}
      ifname:
        alt:
          - {re: [[msg, *ifword, 1, ''], [msg, '\b((?:Vl(?:an)?|Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)\b', 1, '']]}
          - {const: unknown}
      # The NEW role: the target of an "X -> Y" transition, else the trailing
      # state word.
      role: {re: [[msg, '->\s*(\w+)', 1, ''], [msg, '\bstate\s+(\w+)\s*$', 1, 'i']], lower: true}
      takeover: {bool: {equals_any: ['$role', [active, master]]}}
    emit:
      kind: fhrp_state_change
      metric: fhrp_state
      modality: control_plane
      entity: {type: device, id: '{host}'}
      severity: {case: [{when: {var_true: takeover}, value: high}], default: warn}
      native_id: '{host}|fhrp|{proto}|{ifname}|grp{group|?}|{role|?}|{ts_ms}'
      tokens:
        - {t: '{host}'}
        - {t: '{ifname}', local: true}
        - {t: 'grp{group}', local: true}
      tokens_fallback: host
      attrs:
        proto: {var: proto}
        group: {var: group}
        interface: {var: ifname}
        state: {var: role}
        tag: {var: tag}

  # MAC flap / move — a host MAC oscillating between two ports: an L2 loop, a
  # dual-homing/NIC-teaming misconfig, or a duplicate MAC. Cisco
  # %SW_MATM-4-MACFLAP_NOTIF, NX-OS %L2FM-4-L2FM_MAC_MOVE, Arista %MACFLAP.
  #
  # tracker 184 — THE MOVE NEEDS A STATE. It is a one-way symptom (no vendor
  # logs "the MAC stopped moving"), so the state is the KIND of movement, never
  # a recovery word: "flapping" (oscillating) or "moved" (one relocation). Both
  # sit outside aggregation.RECOVERY_STATES, so both read as unhealthy — the
  # truth about a moving MAC.
  - rule_id: syslog.mac.flap
    lane: syslog
    source: syslog
    kind: mac_flap
    entity_type: device
    family: mac_move
    vendors: [cisco, arista]
    markers: [MACFLAP, MAC_MOVE]
    pattern_src: '\b(?:is flapping between|has moved between|mac[\s_-]?move|mac[\s_-]?flap)\b'
    state_re: '\bflap'
    severity: high
    guard:
      any:
        - {contains: [ctoken, 'MACFLAP']}
        - {contains: [ctoken, 'MAC_MOVE']}
        - {re: [msg, '\b(?:is flapping between|has moved between|mac[\s_-]?move|mac[\s_-]?flap)\b', 'i']}
    extract:
      mac: {re: [[msg, *mac, 1, '']]}
      vlan: {re: [[msg, '\bvlan\s*(\d+)\b', 1, 'i']]}
      ports: {findall: [msg, '\b(?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*', '']}
      port_a: {nth: [ports, 0]}
      port_b: {nth: [ports, 1]}
      flapping:
        bool:
          any:
            - {re: [msg, '\bflap', 'i']}
            - {contains: [ctoken, 'MACFLAP']}
      state:
        case:
          - {when: {var_true: flapping}, value: flapping}
          - {when: {always: true}, value: moved}
      # NX-OS names the DIRECTION ("has moved from Eth1/1 to Eth1/2"); the Cisco
      # flap line only names the pair, so from/to stay empty rather than
      # guessing an order.
      from_port: {re: [[msg, '\bfrom\s+((?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)\s+to\s+((?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)', 1, 'i']]}
      to_port: {re: [[msg, '\bfrom\s+((?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)\s+to\s+((?:Gi|Te|Fa|Po|Port-channel|Eth\w*|GigabitEthernet|TenGigE)[\d][\w/.\-]*)', 2, 'i']]}
    emit:
      kind: mac_flap
      metric: mac_flap
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|mac_flap|{mac|?}|vlan{vlan|?}|{ts_ms}'
      tokens:
        - {t: '{host}'}
        - {t: '{mac}'}
        - {t: 'vlan{vlan}', local: true}
        - {t: '{port_a}', local: true}
        - {t: '{port_b}', local: true}
      tokens_fallback: host
      attrs:
        mac: {var: mac}
        vlan: {var: vlan}
        state: {var: state}
        port_a: {var: port_a}
        port_b: {var: port_b}
        from_port: {var: from_port}
        to_port: {var: to_port}
        tag: {var: tag}

  # ── Device configuration change (A9 follow-up) ─────────────────────────────
  #
  # WHAT CHANGED? is the first question of every real RCA, and until now the
  # platform could not answer it from the device's own mouth: a config-change
  # line is severity notice/info, so it fell THROUGH every typed rule and then
  # below the generic net's severity floor — classified as nothing at all. This
  # rule types it as `device_config_change`, the corroborating "a human touched
  # this box" evidence the adjacency families and the security hardening-drift
  # story consume as an OPTIONAL clause (catalog.py).
  #
  # SEVERITY IS `info`, DELIBERATELY. A change is not a fault; it is context.
  # `info` keeps it out of `severity_open_floor` (engine.py: a singleton episode
  # below `high` opens NO object), so a fleet reconfiguration cannot manufacture
  # RCA objects — it can only join an object some real fault already opened.
  # It is still stored, searchable and on the timeline, which is the whole ask.
  #
  # GROUNDING IS THE DEVICE, AND ONLY THE DEVICE. `user` is the highest-value
  # attribute here and it must NEVER be a grounding token: a username is not an
  # infrastructure identity, so tokening `admin` would weld every box in the
  # estate that admin ever touched into ONE correlation object — tracker 168's
  # failure mode, at estate scale. It rides as an attr, where the operator and
  # the "what changed" timeline read it.
  #
  # VENDOR SHAPES (doc_claimed — built from vendor documentation, not captured):
  #   Cisco IOS/XE : %SYS-5-CONFIG_I: Configured from console by admin on vty0
  #   Cisco NX-OS  : %VSHD-5-VSHD_SYSLOG_CONFIG_I: Configured from vty by admin
  #                  on 10.1.1.1@pts/0
  #   Arista EOS   : ConfigAgent: %SYS-5-CONFIG_I: Configured from console by
  #                  admin on vty1   (appname is the agent, mnemonic in the msg
  #                  — which is why the guard reads `ctoken_msg_u`, not `tag`)
  #   Junos        : mgd[…]: UI_COMMIT: User 'admin' requested 'commit'
  #                  operation (comment: none)
  - rule_id: syslog.config.change
    lane: syslog
    source: syslog
    kind: device_config_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [cisco, arista, juniper]
    markers: [CONFIG_I, UI_COMMIT]
    severity: info
    # SHIPS AS SHADOW (A8): evaluated and COUNTED
    # (`corr_parser_shadow_hits_total{rule_id}`), emits nothing, falls through.
    #
    # WHY, and it is not about the grammar. `%SYS-5-CONFIG_I` is 35 of the 100
    # NOISE slots of the RATIFIED V1 workload profile
    # (`scripts/scale-miniladder.py EVENT_MIX_NOISE`) — 33 % of the V1
    # background — declared there as a line that NEVER classifies. An emitting
    # rule re-classifies a third of the V1 stream, which is a SEMANTIC CHANGE to
    # the profile every capacity number in CORRELIX_REFERENCE_CAPACITY_V1 was
    # measured on, not a parser improvement. Versioning that profile is the
    # owner's call, so the row ships shadow and the promotion is a one-line
    # `shadow: false` once a V2 profile exists.
    #
    # The TRAP twin (`trap.config.change`) emits: V1 injects syslog only, so it
    # re-classifies nothing. One symptom, two observers — for now only one of
    # them speaks.
    shadow: true
    # THE GUARD IS FOUR EAGER LITERAL TESTS, ON PURPOSE — this rule sits near the
    # BOTTOM of the syslog lane, so every line the typed rules above declined
    # runs it, and the hot path is the line that matches NOTHING.
    #   * `ctoken` (appname + facility + event_type, upper) and `msg` (raw) are
    #     both built EAGERLY once per line. `ctoken_msg_u` / `msg_u` are LAZY:
    #     the first rule that reads one pays `.upper()` on the whole message —
    #     up to 2 KB, allocated, for every line in the estate. Reading one here
    #     measured +0.14x on the A3 interpreter-vs-branch-code cost gate.
    #   * the message half is CASE-SENSITIVE against the raw text, which is
    #     sound because a syslog MNEMONIC is upper-case on the wire by vendor
    #     convention (`%SYS-5-CONFIG_I`, `UI_COMMIT`) — that is what makes the
    #     cheap field usable at all.
    #   * a homogeneous `any` of simple eager `contains` is FUSED by the
    #     compiler into one closure with an inline loop (rule_model
    #     `_fused_contains`), so this is one call, not four.
    guard:
      any:
        # IOS/XE + EOS %SYS-5-CONFIG_I and NX-OS %VSHD-5-VSHD_SYSLOG_CONFIG_I
        # (the NX-OS mnemonic ENDS in CONFIG_I, so one literal covers both).
        - {contains: [ctoken, 'CONFIG_I']}
        # Junos UI_COMMIT / UI_COMMIT_COMPLETED (`mgd` is the appname, so the
        # mnemonic is in the MESSAGE — hence the msg arms below).
        - {contains: [ctoken, 'UI_COMMIT']}
        # …and the same two mnemonics when the vendor puts them in the message
        # instead of the appname: Arista's `ConfigAgent: %SYS-5-CONFIG_I: …`
        # and Junos's `mgd[…]: UI_COMMIT: …`.
        #
        # NOT an `appname == ConfigAgent` arm: the agent logs more than changes,
        # and matching the PROCESS rather than the event would claim all of it.
        - {contains: [msg, 'CONFIG_I']}
        - {contains: [msg, 'UI_COMMIT']}
    extract:
      # WHO. "…by admin on vty0" (Cisco/Arista/NX-OS) | "User 'admin' requested"
      # (Junos). Bounded: this is untrusted device text on the event loop.
      user:
        re:
          - [msg, '\bby\s+([\w.\-\\@]{1,64})', 1, 'i']
          - [msg, "\\bUser\\s+'([^'\\n]{1,64})'", 1, 'i']
      # WHERE FROM. "Configured from console|vty0|nvram|memory|vty". Junos names
      # no source on the commit line (it is in the separate UI_LOGIN_EVENT), so
      # it stays EMPTY rather than being guessed — an invented source would be
      # indistinguishable from an observed one in the timeline.
      source: {re: [[msg, '\bConfigured\s+from\s+([\w./\-]{1,32})', 1, 'i']]}
      # WHICH SESSION. "…by admin on vty0" (IOS) | "…on 10.1.1.1@pts/0"
      # (NX-OS). Part of the identity: two operators committing in the same
      # millisecond from two sessions are two changes, not one (tracker 198).
      # ANCHORED ON THE USER TAIL, not on a bare "on": the message is untrusted
      # device text and the first `on` in some other clause is not a session.
      line: {re: [[msg, '\bby\s+[\w.\-\\@]{1,64}\s+on\s+([\w.@/\-]{1,48})', 1, 'i']]}
      # Junos logs the commit TWICE — `UI_COMMIT` when it is requested and
      # `UI_COMMIT_COMPLETED` when it lands. They are two observations of one
      # change and must not share an identity, so the completion is its own
      # method (checked FIRST: `UI_COMMIT_COMPLETED` contains `UI_COMMIT`).
      method:
        case:
          - {when: {contains: [ctoken_msg_u, 'UI_COMMIT_COMPLETED']}, value: commit_completed}
          - {when: {contains: [ctoken_msg_u, 'UI_COMMIT']}, value: commit}
          - {when: {always: true}, value: config_i}
      state: {const: changed}
    emit:
      kind: device_config_change
      metric: device_config_change
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|config_change|{method}|{source|?}|{user|?}|{line|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        user: {var: user}
        source: {var: source}
        line: {var: line}
        method: {var: method}
        state: {var: state}
        tag: {var: tag}

  # Generic device-alarm fallback (#80 §4 keystone) — the SAFETY NET, and the
  # LAST syslog rule by construction. Nothing above recognized this event, but
  # if the DEVICE itself flagged it at warning or worse it is still real
  # evidence: one canonical `device_alarm` so it grounds + correlates + tiers
  # like any other. Below the floor stays a searchable log, never an RCA signal.
  - rule_id: syslog.generic.device_alarm
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device_or_interface
    family: null
    vendors: [any]
    generic: true
    guard: {severity_floor: syslog}
    extract:
      ifname: {re: [[msg, *ifword, 1, '']]}
      ev_facility: {ev: [facility]}
      tag_facility: {re: [[tag, '^%*([^-]*)', 1, '']]}
      facility:
        case:
          - {when: {truthy: '$ev_facility'}, value: '{ev_facility}'}
          - {when: {always: true}, value: '{tag_facility}'}
      tag_mnem: {re: [[tag, '-([^-]*)$', 1, '']]}
      ev_etype: {ev: [event_type]}
      mnem:
        case:
          - {when: {contains: [tag, '-']}, value: '{tag_mnem}'}
          - {when: {always: true}, value: '{ev_etype}'}
      sev_num: {severity_num: true}
      text: {var: msg, slice: 256}
    emit:
      kind: device_alarm
      metric: device_alarm
      modality: control_plane
      entity:
        when: {truthy: '$ifname'}
        type: interface
        id: '{host}:{ifname}'
        else: {type: device, id: '{host}'}
      severity: {from_severity_num: true}
      # tracker 198: the MESSAGE TEXT is the discriminator. Without it two
      # DISTINCT unrecognized lines sharing facility+mnemonic(+interface) in one
      # millisecond collapsed onto one signal_id and one was dropped as a
      # "replay". A byte-identical redelivery still hashes the same and dedups.
      native_id: '{host}|alarm|{facility}|{mnem|?}|{ifname|-}|{ts_ms}'
      content_tag: msg
      tokens: [{t: '{host}'}]
      attrs:
        facility: {var: facility}
        mnemonic: {var: mnem}
        severity: {var: sev_num}
        interface: {var: ifname}
        tag: {var: tag}
        text: {var: text}

  # ── syslog port intelligence (#94 P3b) ─────────────────────────────────────
  # Transceiver / optics / DOM / FEC syslog → the sig.ent.spdc evidence kinds.
  # ORDERED, first match wins.
  #
  # H11 (ReDoS): these run on device-supplied text on the single event loop. The
  # original patterns chained unbounded `.*` gaps, whose backtracking on a
  # keyword-dense non-matching line was superlinear (a 4 KB adversarial message
  # cost ~3.9 s and froze consume/healthz/engine). Every inter-keyword gap is
  # now the bounded `[^\n]{0,80}`, and the classification token is capped at
  # 2 000 chars before any regex runs.

  - rule_id: syslog.port.transceiver_unsupported
    lane: port
    source: syslog
    kind: transceiver_unsupported
    entity_type: interface
    family: null
    vendors: [cisco, arista, fortinet]
    severity: high
    pattern_src: 'unsupported\s+transceiver|unqualified\s+(sfp|transceiver|optic)|not\s+qualified|UNSUPPORTED_TRANSCEIVER|transceiver[^\n]{0,80}not\s+supported'
    guard: {re: [pctoken, 'unsupported\s+transceiver|unqualified\s+(sfp|transceiver|optic)|not\s+qualified|UNSUPPORTED_TRANSCEIVER|transceiver[^\n]{0,80}not\s+supported', 'i']}
    extract: &port_extract
      port:
        alt:
          - {ev: [interface, if_name, ifname, port]}
          - {re: [[msg, '\b((?:Ethernet|Eth|Et|Gi|Te|Fo|Hu|xe-|ge-|et-)[\w./:-]+)', 1, '']]}
      message: {var: msg, slice: 240}
    emit: &port_emit
      # `kind` is omitted: bake_rules fills it from the row (these twelve rules
      # differ ONLY in id / pattern / severity / kind, so the emit shape is one
      # anchor and a new optics symptom is a five-line row).
      metric: port_event
      modality: device_telemetry
      entity:
        when: {truthy: '$port'}
        type: interface
        id: '{host}:{port}'
        else: {type: device, id: '{host}'}
      native_id: '{host}|portevt|{kind}|{port|-}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        interface: {var: port}
        port_event: {var: kind}
        message: {var: message}

  - rule_id: syslog.port.dom_rx_power_low
    lane: port
    source: syslog
    kind: dom_rx_power_low
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: '(rx|receive)[^\n]{0,80}power[^\n]{0,80}(low|below)[^\n]{0,80}(alarm|threshold)|RX_POWER_LOW|low\s+rx\s+power'
    guard: {re: [pctoken, '(rx|receive)[^\n]{0,80}power[^\n]{0,80}(low|below)[^\n]{0,80}(alarm|threshold)|RX_POWER_LOW|low\s+rx\s+power', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.dom_temperature_high
    lane: port
    source: syslog
    kind: dom_temperature_high
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: '(temperature|temp)[^\n]{0,80}(high|above)[^\n]{0,80}(alarm|threshold|warning)|TEMP_HIGH|high\s+temperature'
    guard: {re: [pctoken, '(temperature|temp)[^\n]{0,80}(high|above)[^\n]{0,80}(alarm|threshold|warning)|TEMP_HIGH|high\s+temperature', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.dom_lane_bias_anomaly
    lane: port
    source: syslog
    kind: dom_lane_bias_anomaly
    entity_type: interface
    family: null
    vendors: [generic]
    severity: warn
    pattern_src: '(tx\s+)?bias[^\n]{0,80}(high|current)[^\n]{0,80}(alarm|threshold)|BIAS_HIGH'
    guard: {re: [pctoken, '(tx\s+)?bias[^\n]{0,80}(high|current)[^\n]{0,80}(alarm|threshold)|BIAS_HIGH', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.prefec_ber_rising
    lane: port
    source: syslog
    kind: prefec_ber_rising
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'uncorrectable[^\n]{0,80}(fec|codeword|block)|FEC[^\n]{0,80}UNCORRECTABLE|post[-_ ]?fec[^\n]{0,80}(error|ber)'
    guard: {re: [pctoken, 'uncorrectable[^\n]{0,80}(fec|codeword|block)|FEC[^\n]{0,80}UNCORRECTABLE|post[-_ ]?fec[^\n]{0,80}(error|ber)', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.fec_corrected_rate_high
    lane: port
    source: syslog
    kind: fec_corrected_rate_high
    entity_type: interface
    family: null
    vendors: [generic]
    severity: warn
    pattern_src: 'pre[-_ ]?fec\s+ber|fec[^\n]{0,80}corrected[^\n]{0,80}(rate|high)|CORRECTED_FEC'
    guard: {re: [pctoken, 'pre[-_ ]?fec\s+ber|fec[^\n]{0,80}corrected[^\n]{0,80}(rate|high)|CORRECTED_FEC', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.pcs_local_fault
    lane: port
    source: syslog
    kind: pcs_local_fault
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'local\s+fault|LOCAL_FAULT'
    guard: {re: [pctoken, 'local\s+fault|LOCAL_FAULT', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.pcs_remote_fault
    lane: port
    source: syslog
    kind: pcs_remote_fault
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'remote\s+fault|REMOTE_FAULT'
    guard: {re: [pctoken, 'remote\s+fault|REMOTE_FAULT', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.pcs_deskew_fault
    lane: port
    source: syslog
    kind: pcs_deskew_fault
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'deskew|align[^\n]{0,80}(marker|lane)[^\n]{0,80}(fail|lost)|PCS[^\n]{0,80}DESKEW'
    guard: {re: [pctoken, 'deskew|align[^\n]{0,80}(marker|lane)[^\n]{0,80}(fail|lost)|PCS[^\n]{0,80}DESKEW', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.hi_ber_indication
    lane: port
    source: syslog
    kind: hi_ber_indication
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'hi[-_ ]?ber|high\s+bit\s+error'
    guard: {re: [pctoken, 'hi[-_ ]?ber|high\s+bit\s+error', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.link_down_no_light
    lane: port
    source: syslog
    kind: link_down_no_light
    entity_type: interface
    family: null
    vendors: [generic]
    severity: high
    pattern_src: 'no\s+(light|signal)|loss\s+of\s+(light|signal)|LOS\b|SIGNAL_LOSS'
    guard: {re: [pctoken, 'no\s+(light|signal)|loss\s+of\s+(light|signal)|LOS\b|SIGNAL_LOSS', 'i']}
    extract: *port_extract
    emit: *port_emit

  - rule_id: syslog.port.link_flap_on_insert
    lane: port
    source: syslog
    kind: link_flap_on_insert
    entity_type: interface
    family: null
    vendors: [generic]
    severity: warn
    pattern_src: 'transceiver[^\n]{0,80}(insert|remov)[^\n]{0,80}(insert|remov)|SFP[^\n]{0,80}flap|optic[^\n]{0,80}flap'
    guard: {re: [pctoken, 'transceiver[^\n]{0,80}(insert|remov)[^\n]{0,80}(insert|remov)|SFP[^\n]{0,80}flap|optic[^\n]{0,80}flap', 'i']}
    extract: *port_extract
    emit: *port_emit

  # ── SNMP traps ─────────────────────────────────────────────────────────────
  # Traps are discrete control-plane RCA evidence — often the FIRST hard signal
  # of a failure. The firehose is noisy and full of vendor notifications, so
  # ONLY a small, explicit set of high-value, well-standardized families becomes
  # a correlation signal. Classifying by OID beats the rendered trap_name (which
  # varies by agent MIB load); the `.event_type` twins catch vendor traps the
  # standard OIDs miss, keyed off the MIB-decoded envelope, not a per-vendor
  # hardcode.

  - rule_id: trap.link.state_change
    lane: trap
    source: trap
    kind: link_state_change
    entity_type: interface
    family: link_state_change
    vendors: [standard]
    guard:
      any:
        - {equals_any: [oid, ['1.3.6.1.6.3.1.1.5.3', '1.3.6.1.6.3.1.1.5.4']]}
        - {equals_any: [name, [linkDown, linkUp]]}
    extract:
      state:
        case:
          - when:
              any:
                - {eq: [oid, '1.3.6.1.6.3.1.1.5.3']}
                - {eq: [name, linkDown]}
            value: down
          - {when: {always: true}, value: up}
      iface: *trap_iface
      admin_raw: *trap_admin_raw
      oper_raw: *trap_oper_raw
      admin_status: *trap_admin_status
      oper_status: *trap_oper_status
    emit:
      kind: link_state_change
      metric: link_state
      modality: control_plane
      entity: {type: interface, id: '{device}:{iface}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{device}|trap_link|{iface}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        interface: {var: iface}
        state: {var: state}
        trap_oid: {var: oid}
        authenticated: {var: authed}
        admin_status: {var: admin_status}
        oper_status: {var: oper_status}
      # tracker 218. NOTHING that identifies the signal moves: `state` is still
      # down/up from the trap OID alone, so `native_id`, `entity` and therefore
      # `signal_id` are byte-identical to what this rule has always emitted —
      # a stored link trap is NOT re-identified, which was the one objection the
      # A9 audit deferred this enrichment on. The two keys appear only on the
      # events that actually carry the varbinds; every event already stored
      # carried none, so its attrs dict is unchanged too.
      omit_empty: [admin_status, oper_status]

  - rule_id: trap.device.restart
    lane: trap
    source: trap
    kind: device_restart
    entity_type: device
    family: null
    vendors: [standard]
    severity: high
    guard:
      any:
        - {equals_any: [oid, ['1.3.6.1.6.3.1.1.5.1', '1.3.6.1.6.3.1.1.5.2']]}
        - {equals_any: [name, [coldStart, warmStart]]}
    extract:
      restart:
        case:
          - when:
              any:
                - {eq: [oid, '1.3.6.1.6.3.1.1.5.1']}
                - {eq: [name, coldStart]}
            value: cold
          - {when: {always: true}, value: warm}
    emit:
      kind: device_restart
      metric: device_restart
      modality: control_plane
      entity: {type: device, id: '{device}'}
      native_id: '{device}|trap_restart|{restart}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        restart: {var: restart}
        trap_oid: {var: oid}
        authenticated: {var: authed}

  # BGP4-MIB (RFC 4273) + its deprecated notification root.
  - rule_id: trap.bgp.adjacency_change
    lane: trap
    source: trap
    kind: bgp_adjacency_change
    entity_type: device
    family: bgp_adjacency_change
    vendors: [standard]
    guard:
      equals_any:
        - oid
        - ['1.3.6.1.2.1.15.7.2', '1.3.6.1.2.1.15.7.1',
           '1.3.6.1.2.1.0.2', '1.3.6.1.2.1.0.1']
    extract:
      peer: {vb: ['1.3.6.1.2.1.15.3.1.7']}      # bgpPeerRemoteAddr
      established: {bool: {equals_any: [oid, ['1.3.6.1.2.1.15.7.1', '1.3.6.1.2.1.0.1']]}}
      state:
        case:
          - {when: {var_true: established}, value: up}
          - {when: {always: true}, value: down}
    emit:
      kind: bgp_adjacency_change
      metric: bgp_adjacency
      modality: control_plane
      entity:
        when: {truthy: '$peer'}
        type: device
        id: '{device}:{peer}'
        else: {type: device, id: '{device}'}
      severity: {case: [{when: {var_true: established}, value: warn}], default: high}
      native_id: '{device}|trap_bgp|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        trap_oid: {var: oid}
        authenticated: {var: authed}

  # Vendor BGP/link/restart traps the standard-OID checks miss (e.g. Arista
  # arista_bgp4_v2_backward_transition), classified off the normalized
  # event_type (#32 envelope) — vendor-agnostic, same Signal shapes.
  - rule_id: trap.bgp.adjacency_change.event_type
    lane: trap
    source: trap
    kind: bgp_adjacency_change
    entity_type: device
    family: bgp_adjacency_change
    vendors: [any]
    guard:
      all:
        - {contains: [etype, bgp]}
        - any:
            - {contains: [etype, backward]}
            - {contains: [etype, transition]}
            - {contains: [etype, established]}
            - {contains: [etype, neighbor]}
            - {contains: [etype, fsm]}
            - {contains: [etype, state]}
    extract:
      established: {bool: {contains: [etype, establish]}}
      state:
        case:
          - {when: {var_true: established}, value: up}
          - {when: {always: true}, value: down}
      peer:
        alt:
          - {vb: ['1.3.6.1.2.1.15.3.1.7']}
          - {vbname: [peerremoteaddr, peeraddr, remoteaddr, peer]}
    emit:
      kind: bgp_adjacency_change
      metric: bgp_adjacency
      modality: control_plane
      entity:
        when: {truthy: '$peer'}
        type: device
        id: '{device}:{peer}'
        else: {type: device, id: '{device}'}
      severity: {case: [{when: {var_true: established}, value: warn}], default: high}
      native_id: '{device}|trap_bgp|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  - rule_id: trap.link.state_change.event_type
    lane: trap
    source: trap
    kind: link_state_change
    entity_type: interface
    family: link_state_change
    vendors: [any]
    guard:
      all:
        - {contains: [etype, link]}
        - any:
            - {contains: [etype, down]}
            - {contains: [etype, up]}
    extract:
      state:
        case:
          - {when: {contains: [etype, down]}, value: down}
          - {when: {always: true}, value: up}
      iface: *trap_iface
      admin_raw: *trap_admin_raw
      oper_raw: *trap_oper_raw
      admin_status: *trap_admin_status
      oper_status: *trap_oper_status
    emit:
      kind: link_state_change
      metric: link_state
      modality: control_plane
      entity: {type: interface, id: '{device}:{iface}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{device}|trap_link|{iface}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        interface: {var: iface}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}
        admin_status: {var: admin_status}
        oper_status: {var: oper_status}
      # Same enrichment on the MIB-decoded twin: a vendor trap that decodes to a
      # link transition still carries the IF-MIB varbinds, and the two rules must
      # produce ONE vocabulary (they already share kind/entity/state/native_id).
      omit_empty: [admin_status, oper_status]

  - rule_id: trap.device.restart.event_type
    lane: trap
    source: trap
    kind: device_restart
    entity_type: device
    family: null
    vendors: [any]
    severity: high
    guard:
      all:
        - {contains: [etype, start]}
        - any:
            - {contains: [etype, cold]}
            - {contains: [etype, warm]}
    extract:
      restart:
        case:
          - {when: {contains: [etype, cold]}, value: cold}
          - {when: {always: true}, value: warm}
    emit:
      kind: device_restart
      metric: device_restart
      modality: control_plane
      entity: {type: device, id: '{device}'}
      native_id: '{device}|trap_restart|{restart}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        restart: {var: restart}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # ── A9: the trap twins of the syslog control-plane symptoms ────────────────
  #
  # THE RULE THIS FOLLOWS. A trap and a syslog line that report the SAME symptom
  # must produce the SAME kind / entity shape / state vocabulary, so the engine
  # treats them as one symptom seen by two observers (modality stays
  # CONTROL_PLANE; only the Source and the observer's collection path differ).
  # No rule below invents a kind: every one reuses the kind its syslog
  # counterpart already emits, because a kind no signature template names is
  # inert evidence.
  #
  # WHICH OIDs ARE ALLOWED HERE. Only OIDs the vendored MIB index actually
  # resolves (src/backend/collectors/mibs/index/oididx.json, generated by
  # `make mib-index` from real MIB sources). An OID recalled from memory is a
  # fabricated wire contract, so a symptom whose MIB is not vendored is matched
  # on the MIB-DECODED envelope (`etype`, #32) instead — it starts classifying
  # the moment that MIB is added to gen_index.py's DEFAULT_MIBS and the index is
  # regenerated, with no rule edit.
  #
  # `fidelity_status: doc_claimed` on every row: the fixtures are built from the
  # MIB definitions, not captured off a device (README fidelity ladder). It is a
  # ROW claim, not a family promotion — the syslog rules of these same families
  # have their own, different evidence.

  # OSPF adjacency — OSPF-TRAP-MIB ospfNbrStateChange / ospfVirtNbrStateChange,
  # the trap twin of %OSPF-5-ADJCHG (syslog.ospf.adjacency_change). The neighbour
  # address is an IpAddress varbind, so it renders as the SAME dotted quad the
  # syslog grammar pulls out of the message and grounds on the same token.
  - rule_id: trap.ospf.adjacency_change
    lane: trap
    source: trap
    kind: ospf_adjacency_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [standard, cisco, arista, juniper]
    guard:
      any:
        - {equals_any: [oid, ['1.3.6.1.2.1.14.16.2.2', '1.3.6.1.2.1.14.16.2.3']]}
        - {equals_any: [name, [ospfNbrStateChange, ospfVirtNbrStateChange]]}
        - all:
            - {contains: [etype, ospf]}
            - {contains: [etype, nbr]}
            - {contains: [etype, state]}
    extract:
      peer:
        alt:
          - {vb: ['1.3.6.1.2.1.14.10.1.1']}   # ospfNbrIpAddr
          - {vb: ['1.3.6.1.2.1.14.10.1.3']}   # ospfNbrRtrId
          - {vbname: [nbripaddr, nbrrtrid, nbraddress]}
      # ospfNbrState renders as `full(8)` when the MIB enum is loaded and as the
      # bare `8` when it is not, so BOTH spellings are classified. Order is the
      # table's own down-beats-up rule: every pre-Full state is a loss.
      nbr_state:
        alt:
          - {vb: ['1.3.6.1.2.1.14.10.1.6']}   # ospfNbrState
          - {vbname: [nbrstate]}
        lower: true
      state:
        case:
          - when: {re: ['$nbr_state', '\b(?:down|attempt|init|exstart|exchange|loading|twoway|1|2|3|4|5|6|7)\b', 'i']}
            value: down
          - {when: {re: ['$nbr_state', '\b(?:full|8)\b', 'i']}, value: up}
          - {when: {always: true}, value: unknown}
    emit:
      kind: ospf_adjacency_change
      metric: ospf_adjacency
      modality: control_plane
      entity: {type: device, id: '{device}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{device}|trap_ospf_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}, {t: '{peer}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # IS-IS adjacency — ISIS-MIB (RFC 4444) isisAdjacencyChange, the trap twin of
  # syslog.isis.adjacency_change. isisISAdjNeighSysID is a 6-byte OCTET STRING:
  # the receiver renders a non-printable one as `0x…` hex, which is NOT the
  # dotted `1921.6800.1001` the syslog grammar produces. A grounding token in a
  # second notation would build a SECOND correlation object for one adjacency
  # (tracker 168's failure mode), so the peer is tokened only when it already
  # carries the shared notation; otherwise it stays an attr for the operator and
  # the signal grounds on the device.
  - rule_id: trap.isis.adjacency_change
    lane: trap
    source: trap
    kind: isis_adjacency_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [standard, cisco, juniper, nokia]
    guard:
      any:
        - {eq: [oid, '1.3.6.1.2.1.138.0.17']}
        - {eq: [name, isisAdjacencyChange]}
        # `adjacency_change`, not `adjacency`: isisRejectedAdjacency and
        # isisAuthenticationFailure are adjacency-RELATED faults that are not a
        # transition of an existing adjacency, and must stay generic alarms.
        - all:
            - {contains: [etype, isis]}
            - {contains: [etype, adjacency_change]}
    extract:
      peer:
        alt:
          - {vb: ['1.3.6.1.2.1.138.1.6.1.1.6']}   # isisISAdjNeighSysID
          - {vbname: [neighsysid, adjneighsysid, systemid]}
      peer_tok: {re: [['$peer', *sysid, 1, '']]}
      # isisAdjState (RFC 4444): 1 down, 2 initializing, 3 up, 4 failed —
      # rendered `up(3)` with the enum loaded, `3` without it.
      adj_state:
        alt:
          - {vb: ['1.3.6.1.2.1.138.1.10.1.12']}   # isisAdjState
          - {vbname: [adjstate]}
        lower: true
      state:
        case:
          - {when: {re: ['$adj_state', '\b(?:down|init\w*|failed|1|2|4)\b', 'i']}, value: down}
          - {when: {re: ['$adj_state', '\b(?:up|3)\b', 'i']}, value: up}
          - {when: {always: true}, value: unknown}
    emit:
      kind: isis_adjacency_change
      metric: isis_adjacency
      modality: control_plane
      entity: {type: device, id: '{device}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{device}|trap_isis_adj|{peer|?}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}, {t: '{peer_tok}'}]
      attrs:
        peer: {var: peer}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # STP topology change — BRIDGE-MIB newRoot (1.3.6.1.2.1.17.0.1) and
  # topologyChange (1.3.6.1.2.1.17.0.2). Both are SMIv1 TRAP-TYPEs that carry NO
  # varbinds at all, so they name no port and no direction — which makes them the
  # exact trap analogue of %SPANTREE-5-TOPOTRAP (syslog.stp.topology_notification):
  # DEVICE-scoped, state `unknown`, never the synthetic `<device>:unknown`
  # interface node tracker 184 removed.
  #
  # tracker-198 identity question — can two DISTINCT events share this id inside
  # one millisecond? No: `subtype` separates newRoot from topologyChange, and two
  # topologyChange traps from one bridge in one millisecond ARE one reconvergence
  # reported twice (there is no other content to tell them apart, by the MIB's
  # own definition).
  - rule_id: trap.stp.topology_change
    lane: trap
    source: trap
    kind: stp_topology_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [standard, cisco, arista]
    guard:
      any:
        - {equals_any: [oid, ['1.3.6.1.2.1.17.0.1', '1.3.6.1.2.1.17.0.2']]}
        - {equals_any: [name, [newRoot, topologyChange]]}
        - all:
            - {contains: [etype, topology]}
            - {contains: [etype, change]}
    extract:
      subtype:
        case:
          - when:
              any:
                - {eq: [oid, '1.3.6.1.2.1.17.0.1']}
                - {eq: [name, newRoot]}
                - {contains: [etype, new_root]}
            value: new_root
          - {when: {always: true}, value: topology_change}
      state: {const: unknown}
    emit:
      kind: stp_topology_change
      metric: stp_state
      modality: control_plane
      entity: {type: device, id: '{device}'}
      severity: {by_state: {down: high}, default: warn}
      native_id: '{device}|trap_stp_tcn|{subtype}|{state}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        subtype: {var: subtype}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # First-hop redundancy (HSRP/VRRP) — the trap twin of syslog.fhrp.state_change.
  # CISCO-HSRP-MIB and VRRP-MIB are NOT in the vendored MIB index, so there is no
  # OID here that could be checked against a real definition; the rule keys off
  # the MIB-DECODED name/event_type instead (#32), exactly like the vendor-BGP
  # twin above. Add VRRP-MIB / CISCO-HSRP-MIB to gen_index.py's DEFAULT_MIBS and
  # re-run `make mib-index` and these traps classify with no rule edit.
  #
  # The state IS the new role, in the syslog rule's own vocabulary
  # (active/standby/master/backup/…): `cHsrpGrpStandbyState` renders as
  # `active(6)`, and a vrrpTrapNewMaster carries no state varbind because the
  # notification itself IS "this device became master".
  - rule_id: trap.fhrp.state_change
    lane: trap
    source: trap
    kind: fhrp_state_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [standard, cisco, arista, juniper]
    guard:
      all:
        - any:
            - {contains: [etype, hsrp]}
            - {contains: [etype, vrrp]}
        - any:
            - {contains: [etype, state]}
            - {contains: [etype, master]}
            - {contains: [etype, switchover]}
            - {contains: [etype, standby]}
    extract:
      proto:
        case:
          - {when: {contains: [etype, vrrp]}, value: vrrp}
          - {when: {always: true}, value: hsrp}
      ifname: *trap_iface
      group: {vbname: [grpnumber, groupnumber, vrid, grpindex, group]}
      role_raw: {vbname: [standbystate, grpstate, newstate, state, role], lower: true}
      role_word: {re: [['$role_raw', '([a-z]+)', 1, '']]}
      role:
        case:
          - {when: {truthy: '$role_word'}, value: '{role_word}'}
          - {when: {contains: [etype, master]}, value: master}
          - {when: {contains: [etype, switchover]}, value: active}
          - {when: {always: true}, value: unknown}
      takeover: {bool: {equals_any: ['$role', [active, master]]}}
    emit:
      kind: fhrp_state_change
      metric: fhrp_state
      modality: control_plane
      entity: {type: device, id: '{device}'}
      severity: {case: [{when: {var_true: takeover}, value: high}], default: warn}
      native_id: '{device}|trap_fhrp|{proto}|{ifname}|grp{group|?}|{role|?}|{ts_ms}'
      tokens:
        - {t: '{device}'}
        - {t: '{ifname}', local: true}
        - {t: 'grp{group}', local: true}
      tokens_fallback: host
      attrs:
        proto: {var: proto}
        group: {var: group}
        interface: {var: ifname}
        state: {var: role}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # Device configuration change, seen by SNMP — the trap twin of
  # `syslog.config.change` (same kind, same entity shape, same `changed` state:
  # one symptom, two observers).
  #
  # WHAT THE SEVERITY SEED DOES, PRECISELY. This rule does NOT depend on it: a
  # typed trap rule is matched on the OID/name before the severity-floor net is
  # reached, and the severity it emits is its own `info`. The seed
  # (`gen_index.py SEVERITY_HINT`, config-change notifications `notice` →
  # `warning`) matters for the trap's STORED severity and for every
  # config-change notification this rule does not name — without it they land
  # below `ALARM_SEVERITY_FLOOR` and are not even generic `device_alarm`s. The
  # same seed is what finally admits the hardware/environment traps, which have
  # no typed kind to be promoted to (see the coverage matrix).
  #
  # ANTI-FABRICATION: the four OIDs are the ones the vendored index resolves
  # (CISCO-CONFIG-MAN-MIB ×2, JUNIPER-CFGMGMT-MIB, ENTITY-MIB). Nokia's
  # TIMETRA-SYSTEM-MIB config traps have no NOTIFICATION-TYPE OID in the index,
  # so they are matched on the MIB-DECODED `event_type` (#32) instead.
  - rule_id: trap.config.change
    lane: trap
    source: trap
    kind: device_config_change
    entity_type: device
    family: null
    fidelity_status: doc_claimed
    vendors: [standard, cisco, juniper, nokia]
    severity: info
    guard:
      any:
        - equals_any:
            - oid
            - ['1.3.6.1.4.1.9.9.43.2.0.1',    # ciscoConfigManEvent
               '1.3.6.1.4.1.9.9.43.2.0.2',    # ccmCLIRunningConfigChanged
               '1.3.6.1.4.1.2636.4.5.0.1',    # jnxCmCfgChange
               '1.3.6.1.2.1.47.2.0.1']        # entConfigChange
        - equals_any:
            - name
            - [ciscoConfigManEvent, ccmCLIRunningConfigChanged,
               jnxCmCfgChange, entConfigChange]
        # The MIB-decoded envelope, for a config-change notification whose
        # module is not vendored (Nokia tmnxConfigModify/Create/Delete today).
        # BOTH halves are required on purpose: `ospfIfConfigError` and
        # `tmnxPeConfigurationError` contain "config" and are FAULTS, not
        # changes — they must stay generic alarms.
        - all:
            - any:
                - {contains: [etype, config]}
                - {contains: [etype, cfg]}
            - any:
                - {contains: [etype, change]}
                - {contains: [etype, commit]}
                - {contains: [etype, modif]}
                - {contains: [etype, create]}
                - {contains: [etype, delete]}
    extract:
      # WHO — ccmHistoryEventTerminalUser / ccmHistoryEventRcpUser (Cisco),
      # jnxCmCfgChgEventUser (Junos). Never a grounding token; see the syslog
      # twin for why.
      user:
        alt:
          - {vb: ['1.3.6.1.4.1.9.9.43.1.1.6.1.8', '1.3.6.1.4.1.9.9.43.1.1.6.1.14',
                  '1.3.6.1.4.1.2636.3.18.1.7.1.5']}
          - {vbname: [terminaluser, rcpuser, cfgchgeventuser, chguser]}
      # WHERE FROM — ccmHistoryEventCommandSource (enum commandLine(1)/snmp(2)),
      # ccmHistoryEventConfigSource, jnxCmCfgChgEventSource. `resolveVarbind`
      # renders a decoded enum as `label(raw)` and an agent with the MIB
      # unloaded sends the bare integer, so the label is taken when present and
      # the raw value is kept otherwise — never a guessed label.
      source_raw:
        alt:
          - {vb: ['1.3.6.1.4.1.9.9.43.1.1.6.1.3', '1.3.6.1.4.1.9.9.43.1.1.6.1.4',
                  '1.3.6.1.4.1.2636.3.18.1.7.1.4']}
          - {vbname: [commandsource, configsource, cfgchgeventsource]}
        lower: true
      source_word: {re: [['$source_raw', '([a-z]+)', 1, '']]}
      source:
        case:
          - {when: {truthy: '$source_word'}, value: '{source_word}'}
          - {when: {always: true}, value: '{source_raw}'}
      # WHERE TO — ccmHistoryEventConfigDestination: running vs startup is the
      # difference between "someone is editing" and "someone made it permanent".
      dest_raw:
        alt:
          - {vb: ['1.3.6.1.4.1.9.9.43.1.1.6.1.5']}
          - {vbname: [configdestination, cfgdestination]}
        lower: true
      dest_word: {re: [['$dest_raw', '([a-z]+)', 1, '']]}
      dest:
        case:
          - {when: {truthy: '$dest_word'}, value: '{dest_word}'}
          - {when: {always: true}, value: '{dest_raw}'}
      state: {const: changed}
    emit:
      kind: device_config_change
      metric: device_config_change
      modality: control_plane
      entity: {type: device, id: '{device}'}
      native_id: '{device}|trap_config_change|{source|?}|{user|?}|{dest|?}|{ts_ms}'
      tokens: [{t: '{device}'}]
      attrs:
        user: {var: user}
        source: {var: source}
        destination: {var: dest}
        state: {var: state}
        trap_oid: {var: oid}
        event_type: {var: etype}
        authenticated: {var: authed}

  # Generic trap alarm (#80 §4 keystone) — an unclassified trap is still real
  # evidence IF the device/MIB flagged it at warning or worse. Below the floor
  # stays searchable in OpenSearch, never an RCA signal.
  - rule_id: trap.generic.device_alarm
    lane: trap
    source: trap
    kind: device_alarm
    entity_type: device_or_interface
    family: null
    vendors: [any]
    generic: true
    guard: {severity_floor: trap}
    extract:
      iface: *trap_iface
      sev_num: {severity_num: true}
      category: {ev: [category]}
      # tracker 198: the OID alone does not identify the EVENT — two
      # unclassified traps of one OID differing only in their varbinds
      # (different entity, different threshold) collided in a millisecond. The
      # varbind rendering IS the trap's content and is stable under redelivery.
      content: {lane: trap_content}
      interface_attr:
        case:
          - {when: {ne: ['$iface', unknown]}, value: '{iface}'}
          - {when: {always: true}, value: ''}
    emit:
      kind: device_alarm
      metric: device_alarm
      modality: control_plane
      entity:
        when: {all: [{truthy: '$iface'}, {ne: ['$iface', unknown]}]}
        type: interface
        id: '{device}:{iface}'
        else: {type: device, id: '{device}'}
      severity: {from_severity_num: true}
      native_id: '{device}|alarm|{oid|?}|{ts_ms}'
      content_tag: content
      tokens: [{t: '{device}'}]
      attrs:
        trap_oid: {var: oid}
        trap_name: {var: name}
        event_type: {var: etype}
        category: {var: category}
        severity: {var: sev_num}
        authenticated: {var: authed}
        interface: {var: interface_attr}

  # ── catalog-only lane (NGFW) ───────────────────────────────────────────────
  # Firewall logs the canonical-event schema covers and no correlation lane
  # consumes yet. `lane: catalog` keeps them OUT of the baked runtime table:
  # zero hot-path cost, one grammar. Promoting one to a correlation lane =
  # change `lane`, add a fixture, re-bake. FortiOS is the reusable firewall
  # pattern (key="value"); PAN-OS is positional CSV, anchored on the
  # ",TYPE,SUBTYPE," pair — robust without full column mapping (that lives in
  # the Vector pan parser).

  - rule_id: catalog.fortios.traffic
    lane: catalog
    source: syslog
    kind: fortios_traffic
    entity_type: device
    family: fortios_traffic
    vendors: [fortinet]
    severity: warn        # sessions are routine; threats carry severity
    guard: {contains: [msg, 'type="traffic"']}
    extract:
      ifname: {re: [[msg, 'srcintf="([^"]+)"', 1, '']]}
      action: {re: [[msg, 'action="(\w+)"', 1, '']]}
      state:
        scan:
          target: action
          target_fallthrough: true
          order:
            - [down, '\b(deny|drop|block|timeout|reset)\b', 'i']
            - [up, '\b(accept|start|close|allow)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: fortios_traffic
      severity: warn

  # ANY UTM hit is a security signal → high, blocked or passthrough(detected).
  - rule_id: catalog.fortios.utm_threat
    lane: catalog
    source: syslog
    kind: fortios_utm_threat
    entity_type: device
    family: fortios_utm_threat
    vendors: [fortinet]
    severity: high
    guard: {contains: [msg, 'type="utm"']}
    extract:
      ifname: {re: [[msg, 'srcintf="([^"]+)"', 1, '']]}
      action: {re: [[msg, 'action="(\w+)"', 1, '']]}
      state:
        scan:
          target: action
          target_fallthrough: true
          order:
            - [down, '\b(block|blocked|dropped|reset|deny|quarantine)\b', 'i']
            - [up, '\b(pass|passthrough|allow|detected|monitor)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: fortios_utm_threat
      severity: high

  - rule_id: catalog.pan.traffic
    lane: catalog
    source: syslog
    kind: pan_traffic
    entity_type: device
    family: pan_traffic
    vendors: [paloalto]
    severity: warn
    guard: {contains: [msg, ',TRAFFIC,']}
    extract:
      subtype: {re: [[msg, ',TRAFFIC,(\w+),', 1, '']]}
      state:
        scan:
          target: subtype
          target_fallthrough: true
          order:
            - [down, '\b(deny|drop)\b', 'i']
            - [up, '\b(start|end|allow)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: pan_traffic
      severity: warn

  # ANY threat log is a security signal → high (blocked or alerted).
  - rule_id: catalog.pan.threat
    lane: catalog
    source: syslog
    kind: pan_threat
    entity_type: device
    family: pan_threat
    vendors: [paloalto]
    severity: high
    guard: {contains: [msg, ',THREAT,']}
    extract:
      subtype: {re: [[msg, ',THREAT,(\w+),', 1, '']]}
      state:
        scan:
          target: subtype
          target_fallthrough: true
          order:
            - [down, '\b(reset|drop|block|deny|sinkhole)\b', 'i']
            - [up, '\b(alert|allow|detected)\b', 'i']
          field: msg
          default: unknown
    emit:
      kind: pan_threat
      severity: high


# ══ EVENT FAMILIES ═══════════════════════════════════════════════════════════
#
# The canonical-event schema every family normalizes to:
#   event_type   - canonical event family name (the key here)
#   device       - canonical device identity (shared with the metric plane)
#   ifName?      - interface identity (link/interface events)
#   peer?        - BGP/adjacency peer identity (shared with device_bgp_peer_state)
#   severity     - warn | high  (down beats up)
#   state        - the normalized transition, in the family's OWN vocabulary
#   raw_ts       - device-stamped event time (the event plane KEEPS true event
#                  time, unlike the sampled metric plane — the cEOS lesson)
#   message      - original text (untrusted; rendered as escaped data only)
#
# A family row carries NO grammar any more — that lives in `rules:` above, once.
# What is left is the CORRELATION contract and the fidelity claim:
#   labels           canonical label → `hostname` or a rule VAR name
#   correlates_with  the metric family it pairs with
#   join_on          the identity keys both sides share
#   fidelity_status  the ladder position of the GRAMMAR (doc_claimed <
#                    lab_validated < live_validated); absent = "code", i.e. the
#                    catalog makes no evidence claim. Rides on every signal.
families:

  bgp_adjacency_change:
    labels: {device: hostname, peer: peer}
    correlates_with: device_bgp_peer_state
    join_on: [device, peer]

  # The lines a real BGP fault emits ALONGSIDE %BGP-5-ADJCHANGE — session-level
  # churn, joining the prefix gauges rather than the peer-state enum.
  #
  # fidelity: doc_claimed — the grammars come from vendor documentation, not
  # from a captured device stream. The fixtures are hand-built from those
  # documented shapes, so they pin parser↔catalog agreement but they do NOT
  # promote the row: only a real capture does (see README, fidelity ladder).
  bgp_route_churn:
    fidelity_status: doc_claimed
    live_capture: {status: pending, blocked_on: "no lab device configured with a BGP prefix-limit or a peer that resets under load"}
    labels: {device: hostname, peer: peer}
    correlates_with: device_bgp_pfx_in
    join_on: [device, peer]

  ospf_adjacency_change:
    labels: {device: hostname, peer: peer, ifName: ifname}
    correlates_with: device_ospf_nbr_state    # Phase 3 metric (doc_claimed)
    join_on: [device, peer]

  link_state_change:
    labels: {device: hostname, ifName: ifname}
    correlates_with: device_if_oper_status
    join_on: [device, ifName]

  lldp_neighbor_change:
    labels: {device: hostname, ifName: ifname}
    # interface-scoped; a future device_lldp_frame_in is the more precise pair
    correlates_with: device_if_oper_status
    join_on: [device, ifName]

  # A domain-wide TCN names no interface, so it is DEVICE-scoped and must be
  # matched only after the interface-scoped stp_topology_change rule has had its
  # chance (the identity collapse tracker 184 records).
  #
  # fidelity: doc_claimed — documented Cisco shape, no captured fixture.
  stp_topology_notification:
    fidelity_status: doc_claimed
    live_capture: {status: pending, blocked_on: "the cEOS/SRL lab fabric is routed/EVPN; no PVST/MST domain emits a TCN"}
    labels: {device: hostname, stp_instance: instance}
    correlates_with: device_if_oper_status
    join_on: [device]

  # A host MAC oscillating between two ports (L2 loop, dual-homing/NIC-teaming
  # misconfig, duplicate MAC).
  #
  # fidelity: doc_claimed — documented vendor shapes, no captured fixture.
  mac_move:
    fidelity_status: doc_claimed
    live_capture: {status: pending, blocked_on: "no lab L2 access domain; the cEOS/SRL fabric does not learn host MACs"}
    labels: {device: hostname, mac: mac}
    correlates_with: device_if_oper_status
    join_on: [device]

  # A port leaving/entering the spanning tree, or a forwarding-state transition
  # — the L2 control-plane analogue of an adjacency change. (SRL fabric is
  # routed/EVPN — no STP events; add an SRL xstp eventType if STP appears there.)
  stp_topology_change:
    labels: {device: hostname, ifName: ifname}
    correlates_with: device_if_oper_status
    join_on: [device, ifName]

  # The IGP flap the METRIC plane cannot see: SR Linux DELETES the adjacency on
  # neighbor-down (down = path absence, masked by TSDB lookback). This event IS
  # the authoritative flap record — why the SRL event plane had to be wired.
  isis_adjacency_change:
    labels: {device: hostname, isis_neighbor: peer, ifName: ifname}
    correlates_with: device_isis_adj_state
    join_on: [device, isis_neighbor]

  # ---- Firewall (NGFW) event plane — the reusable firewall pattern. The same
  # shape applies to Versa with its own grammar; see
  # [[netops-firewall-onboarding-methodology]].
  fortios_traffic:
    labels: {device: hostname, ifName: ifname}
    correlates_with: device_session_count
    join_on: [device]

  fortios_utm_threat:
    labels: {device: hostname, ifName: ifname}
    correlates_with: device_session_count
    join_on: [device]

  pan_traffic:
    labels: {device: hostname}
    correlates_with: device_session_count
    join_on: [device]

  pan_threat:
    labels: {device: hostname}
    correlates_with: device_session_count
    join_on: [device]
