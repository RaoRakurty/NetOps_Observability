# Shared identity model — the canonical entity keys that metrics, events, flows,
# and config all normalize to, so a metric and an event about the same BGP peer
# (or interface, tunnel, …) join on the same identity.
#
# `aliases` are the raw label/tag names (per vendor/transport) that reconcile to
# the canonical key. The normalization engine renames any alias it sees to the
# canonical key.
version: 1

entities:
  device:
    canonical_key: device
    aliases: [source, hostname, system-name, system_name]
    reconcile: "gNMI target name / SNMP sysName. mgmt-IP and serial are secondary identities (see NetBox dedup IP->serial->name)."

  interface:
    canonical_key: ifName
    secondary_keys: [ifIndex]
    aliases: [interface_name, "interface_name", name]
    reconcile: "ifName is the stable human key. ifIndex kept for joinability but is NOT a cross-epoch key (RFC 2863: reassigned on agent re-init)."

  vrf:
    canonical_key: vrf
    aliases: ["network-instance_name", network_instance, "network-instance"]
    reconcile: "OpenConfig network-instance name; 'default' = global routing table."

  bgp_peer:
    canonical_key: peer
    parent: device
    aliases: ["neighbor_neighbor-address", "neighbor_peer-address", neighbor_address, peer_address]
    reconcile: "BGP neighbor remote address. (device, vrf, peer) is the unique session identity."

  # ---- declared now, populated in later phases (Phase 3+) ----
  circuit:        {canonical_key: circuit,  reconcile: "operator circuit-id / ifAlias / SD-WAN TLOC color (Phase 3+)"}
  tunnel:         {canonical_key: tunnel,   reconcile: "IPsec/GRE/overlay tunnel id; endpoints src/dst (Phase 3+)"}
  site:           {canonical_key: site,     reconcile: "topology/SoT site grouping (Phase 3+)"}
  app:            {canonical_key: app,      reconcile: "service/app label from flow attribution or service catalog (Phase 3+)"}
  cloud_resource: {canonical_key: cloud_resource, reconcile: "TGW/VGW/DX/VPC/ENI ARN-or-id (Phase 3+, ties to seam model)"}
