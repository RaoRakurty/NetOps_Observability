  - name: an NX-OS BFD session down is a below-floor BFD flap
    fidelity: doc_claimed
    source: 'https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html (BFD-5-SESSION_STATE_DOWN)'
    hostname: sw01.pdx01
    appname: unknown
    severity: notice
    message: '%BFD-5-SESSION_STATE_DOWN: BFD session 1090519041 to neighbor 192.0.2.6 on interface Ethernet1/5 has gone down. Reason: Control Detection Time Expired.'
    expect: {}
