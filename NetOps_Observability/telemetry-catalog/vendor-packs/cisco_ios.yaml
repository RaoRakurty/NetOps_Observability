# What an operator checks first per fault family (tracker 387 event model; `guidance`,
# `basis: pack_guidance`). Advice, never evidence. Commands are the IOS XR CLI.
guidance:
  - event_types: [updown]
    impact:
      - An interface or its line protocol changed state; services and adjacencies over it stop or move.
    next_checks:
      - Run show interfaces for the interface named in the line and check whether it was shut administratively.
      - Check the optics and the far end of the link.
  - event_types: [adjchange, adjchg]
    impact:
      - A routing adjacency changed state; routes through it are withdrawn while it is down.
    next_checks:
      - Run show bgp neighbor, show ospf neighbor or show isis adjacency for the neighbour named in the line.
