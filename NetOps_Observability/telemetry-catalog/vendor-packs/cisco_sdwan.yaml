# Plain-language names for SD-WAN edge processes, read by `{proc|process}` in the process
# snapshot rows. Presentation only: a process this table does not name keeps its
# basename. ttmd is left out until a Cisco source names it.
labels:
  process:
    ftmd: data-plane forwarding (FTM)
    vdaemon: control-plane connections (vSmart/vBond)
    fpmd: forwarding policy
    confd: configuration/management (confd)
    iked: IPsec key exchange
    ikev2: IPsec key exchange
    omp: OMP routing
    ompd: OMP routing
    cfgmgr: configuration manager
    sysmgrd: system manager
    snmpd: SNMP agent
    sshd: SSH server
    ntpd: time sync (NTP)
    kworker: kernel worker

# What an operator checks first for each fault family (tracker 387 event model; on the
# record as `guidance` with `basis: pack_guidance`). Advice, never evidence: it moves no
# signal and no verdict. Commands are the vEdge / cEdge SD-WAN CLI.
guidance:
  - event_types: [dns_lookup_failed, dns_resolution_failed]
    impact:
      - The edge cannot resolve its vBond orchestrator, so a control connection that drops cannot be rebuilt.
      - Existing control and data-plane sessions keep running until they need the orchestrator again.
    next_checks:
      - Check the DNS servers configured in VPN 0 and that the transport interface can reach them.
      - Resolve the vBond name from VPN 0 by hand (ping or nslookup from the edge).
      - Run show control connections and show control local-properties to see whether the edge is still attached.
  - event_types: [control-connection-state-change]
    impact:
      - A control connection to a vSmart, vBond or vManage changed state; while it is down the edge gets no new policy or routes from that controller.
    next_checks:
      - Run show control connections and show control connections-history for the last error.
      - Check the transport (TLOC) the connection runs over, and certificates and clock on the edge.
  - event_types: [bfd-state-change]
    impact:
      - A BFD session between two TLOCs changed state; traffic over that tunnel is moved to other paths or dropped.
    next_checks:
      - Run show bfd sessions and show bfd history for the colours named in the line.
      - Check the underlay between the two TLOCs (loss, latency, NAT) and the remote site's own BFD view.
  - event_types: [omp-peer-state-change, omp-state-change]
    impact:
      - An OMP peering changed state; routes and TLOCs learned from that peer are withdrawn while it is down.
    next_checks:
      - Run show omp peers and show omp summary.
      - Check the control connection to the vSmart that carries the OMP session.
  - event_types: [interface-state-change, interface-admin-state-change]
    impact:
      - An interface changed state; tunnels and services using it move or stop.
    next_checks:
      - Run show interface for the named interface and check whether it was shut administratively.
      - Check the physical link and the neighbour on the other end.
  - event_types: [bgp-peer-state-change, ospf-neighbor-state-change]
    impact:
      - A routing adjacency changed state; prefixes learned through it are withdrawn while it is down.
    next_checks:
      - Run show bgp neighbor or show ospf neighbor for the peer named in the line.
      - Check reachability to the peer and the interface it runs over.
  - event_types: [cpu-usage, sysmgr_200069, sysmgr_200070, sysmgr_200071]
    impact:
      - CPU on the edge crossed a threshold; control-plane work (BFD, OMP, control connections) can be delayed when it stays high.
    next_checks:
      - Run show system status and look at the process table logged with the crossing for the top consumer.
      - Check whether BFD or control-connection flaps line up with the high CPU.
