# Cisco Catalyst SD-WAN (Viptela), the first vendor pack (tracker 387, plan §6a).
# Format: telemetry-catalog/README.md, "Vendor packs".
#
# EVIDENCE. `lab_validated` means the shape was captured on the wire from the lab's
# vEdges on 2026-11-09 (read-only, 120 s, 1,376 frames) or quoted from a lab line in
# plan §3.1. Hostnames, usernames and addresses in the fixtures are scrubbed.
# `doc_claimed` rows cite the document their shape comes from and were never seen
# live. Cisco's syslog message catalogue was not retrievable.
#
# FRAMING SEEN ON THE WIRE. vEdge sends true RFC 5424 with a real PRI
# (`<187>1 <ts> vEdge-51 FTMD 3875 - - %Viptela-...`), and cEdge a hostname-less
# `<189>25165: <ts>: %DMI-5-AUTH_PASSED: ...`. Since PR 10 the PRI, the procid and the
# clean message all arrive (tests/test_syslog_edge_framing.py). The grammars stay
# unanchored, because a frame already on the bus at upgrade still has the old shape.
pack: cisco_sdwan
vendor: cisco
description: Cisco Catalyst SD-WAN edges and controllers.

grammars:
  # Body shape `Notification: [<date> <time>] <event-name> severity-level:<level> ...`.
  # The numeric id is shared by every notification, so the event name is the stable
  # identity here, not the id. The envelope says 6-INFO whatever the event's real level
  # is, so the native severity is `severity-level`, and it does not lift the normalized
  # one: the same crossing also arrives as its own %Viptela-...-SYSMGR line. The
  # optional date is from the Cisco documents; the lab's lines carry none.
  # The cpu-usage notification carries the three CPU percentages and the crossing's
  # wording (lab capture). Same parse as the generic notification row below, plus the
  # numbers as metrics (the trap lane's names) and the wording as the title.
  - id: viptela_cpu_notification
    parser_id: cisco_sdwan.v1
    literal: 'cpu-user-percentage:"'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>Notification:.{0,48}?\b(?P<name>cpu-usage)\b\s*severity-level:(?P<level>[a-z]+) .{0,200}?warning:"(?P<warning>[^"]{0,160})" cpu-user-percentage:"(?P<user>[0-9.]{1,8})" cpu-system-percentage:"(?P<system>[0-9.]{1,8})" cpu-idle-percentage:"(?P<idle>[0-9.]{1,8})".*)'
    facility: '{proc}'
    event_type: '{name}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: level
    alarm_floor: 2
    fields:
      title: '{warning} on {host}'
      correlation_key: 'cpu:{device}'
      # The process snapshot the edge logs with this crossing carries the same id.
      dump_id: '[dump:{device}:{minute}]'
    metrics:
      cpu_user_percent: user
      cpu_system_percent: system
      cpu_idle_percent: idle
    fidelity: lab_validated

  - id: viptela_notification
    parser_id: cisco_sdwan.v1
    literal: '%Viptela-'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>Notification:.{0,48}?\b(?P<name>[a-z]+(?:-[a-z]+)+)\b\s*(?:severity-level:(?P<level>[a-z]+))?.*)'
    facility: '{proc}'
    event_type: '{name}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: level
    alarm_floor: 2
    fields:
      title: '{name} on {host}[ (severity {level})]'
      correlation_key: '{name}:{device}'
    fidelity: lab_validated

  - id: viptela
    parser_id: cisco_sdwan.v1
    literal: '%Viptela-'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>.*)'
    facility: '{proc}'
    event_type: '{proc}_{id}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: word
    native_code: sev
    # D3: only a critical line may alarm on severity alone. Everything else needs a
    # typed row, which states its own below-floor severity.
    alarm_floor: 2
    fields:
      title: '{proc} on {host}: {text}'
      correlation_key: '{proc}:{device}:{id}'
    fidelity: lab_validated

  # IOS-XE SD-WAN edges. NOT seen on the lab: the capture's cEdge lines are all
  # %DMI-5-AUTH_PASSED. doc_claimed until a capture promotes it. SOURCE NOT READ: the
  # Cisco Community page below returned 403; the shape comes from a search engine's
  # quotation of it, nothing better was found.
  - id: cisco_sdwan
    parser_id: cisco_sdwan.v1
    literal: '%Cisco-SDWAN-'
    pattern: '%Cisco-SDWAN-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>.*)'
    facility: '{proc}'
    event_type: '{proc}_{id}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: word
    native_code: sev
    alarm_floor: 2
    fields:
      title: '{proc} on {host}: {text}'
      correlation_key: '{proc}:{device}:{id}'
    fidelity: doc_claimed
    source: 'Cisco Community, "How to check BFD logging in Cisco SDWAN fabric" (`%Cisco-SDWAN-vm5-FTMD-5-NTCE-1000009: BFD-session ...`)'

  # Management audit (PR 11, owner D2). Non-alarm: no severity, no rule row. Vector stamps
  # `event_category` and a stable `dedup_key`; repeats are grouped at READ time and every
  # record stays stored. Usernames stay in the message (D7 is another stream).
  #
  # Wire `%DMI-5-AUTH_PASSED: R0/0: dmiauthd: ...`. IOS sends no process tag, so the app
  # is `unknown` and the mnemonic stays in the message (PR 10). The dedup key follows.
  - id: iosxe_dmi_auth
    parser_id: cisco_mgmt_audit.v1
    literal: 'dmiauthd: User '
    pattern: 'dmiauthd: User \W?(?P<user>[\w.@-]{1,64})\W? authenticated successfully(?: from (?P<src>[^\s:]{1,64})(?::(?P<port>\d{1,5}))?)?(?: and was authorized for (?P<svc>[\w]{1,16}(?: over [\w]{1,16})?))?'
    event_type: dmi_auth_passed
    summary: 'Device-management login[ by {user}][ from {src}][ for {svc}]'
    category: management_audit
    fields:
      title: 'Device-management login on {host}[ by {user}][ from {src}]'
      correlation_key: 'audit:{device}:dmi:{user}'
      audit_user: '{user}'
      audit_action: 'login_accepted'
      audit_source: '{src}[:{port}]'
      audit_via: '{svc}'
    fidelity: lab_validated

  # The vBond DNS lines the DNS rows read (lab capture 2026-11-09, VTRACKER/VDAEMON,
  # `<function>[<line>]: DNS ...`). Their own event type, so a failure and a success never
  # share guidance. No severity: PRI is the line's own. The generic `<function>[<line>]:`
  # row of wave 1 is gone: the lab shows no other line of that shape, and a grammar no
  # fixture decides is a claim nothing tests.
  - id: vedge_dns
    parser_id: cisco_sdwan.v1
    literal: ']: DNS '
    apps: [vtracker, vdaemon]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: DNS (?P<step>lookup|resolution) (?P<outcome>failed|succeeded|successful) for (?:\d{1,3}/)?(?P<target>[^\s,]{1,253})(?: via (?P<via>[^\s,]{0,64}))?(?:,? reason: (?P<reason>.{1,128}))?'
    event_type: 'dns_{step}_{outcome}'
    summary: 'DNS {step} {outcome} for {target}[ via {via}][ ({reason})]'
    fields:
      title: 'DNS {step} {outcome} for {target} on {host}[ ({reason})]'
      correlation_key: 'dns:{device}:{target}'
    fidelity: lab_validated

  # Poll-induced management-plane records (PR 11 shape, owner D2). The vEdge confd SNMP
  # agent logs these while answering OUR poller's interfaceTable walk: about 45 an hour
  # across the lab's vEdges (measured live 2026-11-10). Non-alarm: no severity, a stable
  # dedup key; every record stays stored and is grouped at read time. The process tag
  # they arrive with was not recorded, so no `apps` gate: the literals are the guard.
  - id: snmpa_table_error
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'devel-snmpa internal error: table '
    pattern: 'devel-snmpa internal error: table (?P<op>[a-z-]{1,16}): (?P<table>\w{1,64}) \(error: (?P<err>\w{1,64})\)'
    event_type: snmp_agent_table_error
    summary: 'SNMP agent could not serve {table} on {op} ({err}) (poll)'
    category: management_audit
    fields:
      title: 'SNMP agent could not serve {table} on {host} (poll)'
      correlation_key: 'snmp_agent:{device}:{table}'
    fidelity: lab_validated

  - id: snmpa_instr_trace
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'devel-snmpa {confd_snmpa_instr,'
    pattern: 'devel-snmpa \{confd_snmpa_instr,(?P<func>\w{1,64}),(?:\[\{table,(?P<table>\w{1,64})\})?'
    event_type: snmp_agent_instr_trace
    summary: 'SNMP agent trace in {func}[ for {table}] (poll)'
    category: management_audit
    fields:
      title: 'SNMP agent trace on {host}[ for {table}] (poll)'
      correlation_key: 'snmp_agent:{device}[:{table}]'
    fidelity: lab_validated

  - id: snmp_get_response_error
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'snmp get-response reqid='
    pattern: 'snmp get-response reqid=\d{1,12} (?P<dst>[^\s:]{1,64})(?::\d{1,5})? error-status=(?P<status>[A-Za-z]{1,32}) ix=\d{1,6}(?: \(\w{1,16} (?P<obj>[A-Za-z][\w-]{0,63}))?'
    event_type: 'snmp_get_response_{status}'
    summary: 'SNMP answer {status} to {dst}[ on {obj}] (poll)'
    category: management_audit
    fields:
      title: 'SNMP {status} answering our poll on {host}[ ({obj})]'
      correlation_key: 'snmp_agent:{device}[:{obj}]'
    fidelity: lab_validated

  # vEdge SYSMGR process-table dumps (live, 2026-11-10): with each cpu-usage event the
  # vEdge logs `ps` one line per row, a header then one row per process. Diagnostic
  # context, never an alarm: no severity reader, no rule row (event_category
  # diagnostic_dump, which the Logs list hides by default). Every row of one snapshot,
  # and the cpu-usage line it accompanies, carries one dump_id: the device and the UTC
  # minute of the record. Stateless, so a snapshot that straddles a minute boundary
  # splits in two, and rows carry no sequence number: read time orders a dump by
  # receive time and joins the neighbouring minute. The header is the dump's
  # representative row. Rows stay stored (D5).
  - id: sysmgr_ps_header
    parser_id: cisco_sdwan_diag.v1
    literal: 'PID %CPU %MEM'
    apps: [sysmgr]
    pattern: '^USER\s+PID\s+%CPU\s+%MEM\s+VSZ\s+RSS\s+TTY\s+STAT\s+START\s+TIME\s+COMMAND'
    event_type: process_table
    summary: process table header
    category: diagnostic_dump
    fields:
      title: 'Process snapshot on {host}'
      correlation_key: 'process_table:{device}'
      dump_id: '[dump:{device}:{minute}]'
    fidelity: lab_validated

  # One `ps aux` row. `proc` is the command's basename (`/usr/sbin/ftmd -f` -> ftmd) or a
  # kernel thread's name (`[kworker/0:2]` -> kworker), read through the pack's
  # `process` label table for the summary.
  - id: sysmgr_ps_row
    parser_id: cisco_sdwan_diag.v1
    literal: ':'
    apps: [sysmgr]
    pattern: '^(?P<user>\S{1,32})\s+(?P<pid>\d{1,7})\s+(?P<cpu>\d{1,3}\.\d)\s+(?P<mem>\d{1,3}\.\d)\s+(?P<vsz>\d{1,12})\s+(?P<rss>\d{1,12})\s+(?P<tty>\S{1,16})\s+(?P<stat>\S{1,8})\s+(?P<start>\S{1,8})\s+(?P<time>\d{1,6}:\d{2})\s+(?P<cmd>(?:\[|\S*/)?(?P<proc>[A-Za-z0-9_.@-]{1,64}).{0,255})'
    event_type: process_table
    summary: '{proc|process} ({proc}) using {cpu}% CPU, {mem}% memory'
    category: diagnostic_dump
    fields:
      title: '{proc|process} ({proc}) on {host}'
      correlation_key: 'process_table:{device}'
      dump_id: '[dump:{device}:{minute}]'
    metrics:
      process: {text: proc}
      cpu_percent: cpu
      mem_percent: mem
      rss_kb: rss
      vsz_kb: vsz
      state: {text: stat}
      start: {text: start}
      cputime: {text: time}
    fidelity: lab_validated

# Typed rows, in match order. D3: only the critical CPU row may open an object alone.
# Everything else states `warn` or `info`, below `severity_open_floor`, so it can join
# a component and cannot start one. E1 still makes a device's own syslog and its SNMP
# episode one observation: these rows corroborate and cannot confirm on their own.
rules:
  # CPU. Lab evidence: SYSMGR 200069 (2-CRIT above 90%), 200070 (4-WARN above 75%),
  # 200071 (4-WARN above 60%), 200072 (5-NTCE below 75%), each also as a sysmgrd
  # `Notification: cpu-usage` line. Keyed on the text, not the ids: the id list is not
  # documented and the wording is what the lines were seen to say. Case-sensitive, so
  # the notification twin (`-sysmgrd-`) does not emit a second signal for one crossing.
  - rule_id: syslog.sdwan.cpu_high.critical
    lane: syslog
    source: syslog
    kind: device_resource_anomaly
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[0-2]-[A-Z]{4}-\d+: System cpu usage is above \d+%'
    guard: {re: [msg, '-SYSMGR-[0-2]-[A-Z]{4}-\d+: System cpu usage is above \d+%', '']}
    severity: crit
    extract: &cpu_extract
      threshold: {re: [[msg, 'System cpu usage is (?:above|below) (\d+)%', 1, '']]}
    emit: &cpu_emit
      metric: device_resource
      modality: device_telemetry
      entity: {type: device, id: '{host}'}
      native_id: '{host}|cpu|{threshold|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        resource: {const: cpu}
        threshold_pct: {var: threshold}

  - rule_id: syslog.sdwan.cpu_high.warning
    lane: syslog
    source: syslog
    kind: device_resource_anomaly
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[3-7]-[A-Z]{4}-\d+: System cpu usage is above \d+%'
    guard: {re: [msg, '-SYSMGR-[3-7]-[A-Z]{4}-\d+: System cpu usage is above \d+%', '']}
    severity: warn
    extract: *cpu_extract
    emit: *cpu_emit

  # A clear means this threshold is no longer crossed, not that the device is healthy:
  # the lab sends `above 60%` and `below 75%` in the same millisecond on the way down.
  - rule_id: syslog.sdwan.cpu_high.clear
    lane: syslog
    source: syslog
    kind: device_resource_anomaly_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[0-7]-[A-Z]{4}-\d+: System cpu usage is below \d+%'
    guard: {re: [msg, '-SYSMGR-[0-7]-[A-Z]{4}-\d+: System cpu usage is below \d+%', '']}
    severity: info
    extract: *cpu_extract
    emit: *cpu_emit

  - rule_id: syslog.sdwan.cpu_normal.clear
    lane: syslog
    source: syslog
    kind: device_resource_anomaly_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: 'Notification: cpu-usage .{0,200}?System cpu usage back to normal level'
    guard: {re: [msg, 'Notification: cpu-usage .{0,200}?System cpu usage back to normal level', '']}
    severity: info
    extract: {threshold: {const: normal}}
    emit: *cpu_emit

  # vBond DNS. Lab evidence: VTRACKER and VDAEMON, one failure reported as both a lookup
  # and a resolution line. `device_alarm`, on purpose, NOT `dns_failure_rate`: the kind
  # `sig.ent.internet.dns-impairment` needs alone, and it names the ISP as owner, so a
  # chronic vBond failure would score full coverage and blame the ISP in any component
  # on that device with no independent evidence. A device failing to resolve its own
  # orchestrator says nothing about the internet's DNS. `failure` names it for an operator;
  # test_vendor_pack_floor_387.py pins that no DNS template can pick it up.
  #
  # `DNS lookup succeeded` has no row and emits nothing. There is no honest clear to send:
  # `device_alarm_clear` would read as the end of every alarm on the device, and a kind
  # of its own would have nothing to clear. The record stays stored and searchable.
  - rule_id: syslog.sdwan.dns.failed
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: lab_validated
    pattern_src: 'DNS (?:lookup|resolution) failed for'
    guard:
      all:
        - {equals_any: [tag, [VTRACKER, VDAEMON]]}
        - {re: [msg, 'DNS (?:lookup|resolution) failed for', '']}
    severity: warn
    extract:
      target: {re: [[msg, ' for (\S{1,128})', 1, '']]}
      step: {re: [[msg, 'DNS (lookup|resolution)', 1, '']]}
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|alarm|dns_resolution_failed|{step|?}|{target|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        failure: {const: dns_resolution_failed}
        target: {var: target}
        step: {var: step}

  # Same vocabulary as nms/vmanage_kinds.go, which maps this very event name
  # (`bfd-state-change`) to controller_bfd_down, so a device's own report and the
  # controller's name the same hypothesis. Bound to the device, not a tunnel: a syslog
  # line alone cannot build the `tloc_pair` id the controller lane uses.
  #
  # Control connections and BFD. NOT seen on the lab (a substring search of 18,436 stored
  # lines found neither). Documented shape only, so `doc_claimed` and fixtures hand-built
  # from the citations; a real capture is what promotes them. The Splunk page was read and
  # quotes the control-connection line. The Cisco page was only readable through a tool
  # that summarised it, so the BFD wording is partly second-hand: `bfd-state-change`,
  # `flap-reason:` and the state values, plus `new-state` from nms/vmanage_kinds.go. Sources:
  #   Cisco 215359 https://www.cisco.com/c/en/us/support/docs/routers/vedge-router/215359-bidirectional-forwarding-detection-flap.html
  #   Splunk https://research.splunk.com/sources/350c4a45-24df-4339-ba57-8b8c09f2865f/
  - rule_id: syslog.sdwan.control_connection.down
    lane: syslog
    source: syslog
    kind: controller_control_connection_loss
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: 'control-connection-state-change\b.{0,400}?\bnew-state:down\b'
    guard: {re: [msg, 'control-connection-state-change\b.{0,400}?\bnew-state:down\b', '']}
    severity: warn
    extract: &ctrl_extract
      peer_type: {re: [[msg, '\bpeer-type:([A-Za-z]{1,32})', 1, '']]}
      peer: {re: [[msg, '\bpeer-system-ip:(\S{1,64})', 1, '']]}
    emit: &ctrl_emit
      metric: control_connection
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|control_connection|{peer_type|?}|{peer|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        peer_type: {var: peer_type}
        peer: {var: peer}

  - rule_id: syslog.sdwan.control_connection.up
    lane: syslog
    source: syslog
    kind: controller_control_connection_loss_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: 'control-connection-state-change\b.{0,400}?\bnew-state:up\b'
    guard: {re: [msg, 'control-connection-state-change\b.{0,400}?\bnew-state:up\b', '']}
    severity: info
    extract: *ctrl_extract
    emit: *ctrl_emit

  - rule_id: syslog.sdwan.bfd.down
    lane: syslog
    source: syslog
    kind: controller_bfd_down
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: '\bbfd-state-change\b.{0,500}?\bnew-state:down\b'
    guard: {re: [msg, '\bbfd-state-change\b.{0,500}?\bnew-state:down\b', '']}
    severity: warn
    extract: &bfd_extract
      reason: {re: [[msg, '\bflap-reason:(\S{1,48})', 1, '']]}
      local_color: {re: [[msg, '\blocal-color:"?([\w-]{1,32})', 1, '']]}
      remote_color: {re: [[msg, '\bremote-color:"?([\w-]{1,32})', 1, '']]}
    emit: &bfd_emit
      metric: bfd_session
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|bfd|{local_color|?}|{remote_color|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        flap_reason: {var: reason}
        local_color: {var: local_color}
        remote_color: {var: remote_color}

  - rule_id: syslog.sdwan.bfd.up
    lane: syslog
    source: syslog
    kind: controller_bfd_down_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: '\bbfd-state-change\b.{0,500}?\bnew-state:up\b'
    guard: {re: [msg, '\bbfd-state-change\b.{0,500}?\bnew-state:up\b', '']}
    severity: info
    extract: *bfd_extract
    emit: *bfd_emit

  # PENDING OWNER REVIEW (decision 2026-11-09: keep it narrow and counted). Repeats on
  # every vEdge sampled (1,277 stored lines from 3 devices) at severity 3, with no state
  # in the text. Harmlessness is NOT proven; the plan says "may be harmless". The guard is
  # the whole text shape: a different message under the same id still reaches the
  # below-floor row, and `corr_parser_known_benign_total` shows if the rate moves.
  - rule_id: syslog.sdwan.ftmd.interface_dump
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: repeating FTMD interface dump with no state or fault in the text; pending owner review
    pattern_src: '-FTMD-3-ERRO-1000003: User ifname = \S+; kernel if_name= \S+; encap = \d+'
    guard: {re: [msg, '-FTMD-3-ERRO-1000003: User ifname = \S+; kernel if_name= \S+; encap = \d+', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # PENDING OWNER REVIEW, as the FTMD row above. The SNMP agent's own error lines while it
  # answers OUR poll (grammars `snmpa_*`, `snmp_get_response_error`). What they state is
  # that the agent could not serve part of interfaceTable to Correlix, not a network
  # fault, and a device may send them at warning or err, where the generic net would turn
  # every poll cycle into a device alarm. The guard is the whole text shape; the records
  # stay stored with their dedup key, and `corr_parser_known_benign_total` shows the rate.
  - rule_id: syslog.sdwan.snmp_agent.poll_error
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: the device SNMP agent failing to serve part of interfaceTable to our own poller; no network state in the text; pending owner review
    pattern_src: 'devel-snmpa\sinternal\serror:\stable\s[a-z-]{1,16}:\sinterfaceTable\s.error:\s|devel-snmpa\s.confd_snmpa_instr,table_func,|snmp\sget-response\sreqid=\d{1,12}\s\S{1,64}\serror-status=genErr\six=\d{1,6}\s.\w{1,16}\sinterface'
    guard: {re: [msg, 'devel-snmpa\sinternal\serror:\stable\s[a-z-]{1,16}:\sinterfaceTable\s.error:\s|devel-snmpa\s.confd_snmpa_instr,table_func,|snmp\sget-response\sreqid=\d{1,12}\s\S{1,64}\serror-status=genErr\six=\d{1,6}\s.\w{1,16}\sinterface', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # Rule 1, "ingestion is not incident creation": any other error or warning of this
  # grammar still reaches the engine, at `warn`, so it can join a component and enrich an
  # undetermined outcome. It matches no signature.
  - rule_id: syslog.sdwan.below_floor
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: lab_validated
    pattern_src: '%Viptela-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:'
    guard: {re: [msg, '%Viptela-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:', '']}
    severity: warn
    extract: &below_extract
      facility: {re: [[msg, '-([A-Za-z]\w{0,31})-[34]-[A-Z]{4}-\d{1,12}:', 1, '']]}
      mnem: {re: [[msg, '-[34]-([A-Z]{4}-\d{1,12}):', 1, '']]}
      text: {var: msg, slice: 256}
    emit: &below_emit
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|alarm|{facility|?}|{mnem|?}|-|{ts_ms}'
      content_tag: msg
      tokens: [{t: '{host}'}]
      attrs:
        facility: {var: facility}
        mnemonic: {var: mnem}
        tag: {var: tag}
        text: {var: text}

  # SOURCE NOT READ, as for the `cisco_sdwan` grammar above: this row rests on that one
  # quoted example.
  - rule_id: syslog.sdwan.below_floor.iosxe
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: doc_claimed
    pattern_src: '%Cisco-SDWAN-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:'
    guard: {re: [msg, '%Cisco-SDWAN-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:', '']}
    severity: warn
    extract: *below_extract
    emit: *below_emit

