# Cisco Catalyst SD-WAN (Viptela), the first vendor pack (tracker 387, plan §6a).
# Format: telemetry-catalog/README.md, "Vendor packs".
#
# EVIDENCE. `lab_validated` means the shape was captured on the wire from the lab's
# vEdges on 2026-11-09 (read-only, 120 s, 1,376 frames) or quoted from a lab line in
# plan §3.1. Hostnames, usernames and addresses in the fixtures are scrubbed.
# `doc_claimed` rows cite the document their shape comes from and were never seen
# live. Cisco's syslog message catalogue was not retrievable.
#
# FRAMING SEEN ON THE WIRE. vEdge sends true RFC 5424 with a real PRI
# (`<187>1 <ts> vEdge-51 FTMD 3875 - - %Viptela-...`), and cEdge a hostname-less
# `<189>25165: <ts>: %DMI-5-AUTH_PASSED: ...`. Since PR 10 the PRI, the procid and the
# clean message all arrive (tests/test_syslog_edge_framing.py). The grammars stay
# unanchored, because a frame already on the bus at upgrade still has the old shape.
pack: cisco_sdwan
vendor: cisco
description: Cisco Catalyst SD-WAN edges and controllers.

grammars:
  # Body shape `Notification: [<date> <time>] <event-name> severity-level:<level> ...`.
  # The numeric id is shared by every notification, so the event name is the stable
  # identity here, not the id. The envelope says 6-INFO whatever the event's real level
  # is, so the native severity is `severity-level`, and it does not lift the normalized
  # one: the same crossing also arrives as its own %Viptela-...-SYSMGR line. The
  # optional date is from the Cisco documents; the lab's lines carry none.
  # The cpu-usage notification carries the three CPU percentages and the crossing's
  # wording (lab capture). Same parse as the generic notification row below, plus the
  # numbers as metrics (the trap lane's names) and the wording as the title.
  - id: viptela_cpu_notification
    parser_id: cisco_sdwan.v1
    literal: 'cpu-user-percentage:"'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>Notification:.{0,48}?\b(?P<name>cpu-usage)\b\s*severity-level:(?P<level>[a-z]+) .{0,200}?warning:"(?P<warning>[^"]{0,160})" cpu-user-percentage:"(?P<user>[0-9.]{1,8})" cpu-system-percentage:"(?P<system>[0-9.]{1,8})" cpu-idle-percentage:"(?P<idle>[0-9.]{1,8})".*)'
    facility: '{proc}'
    event_type: '{name}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: level
    alarm_floor: 2
    fields:
      title: '{warning} on {host}'
      correlation_key: 'cpu:{device}'
      # The process snapshot the edge logs with this crossing carries the same id.
      dump_id: '[dump:{device}:{minute}]'
    metrics:
      cpu_user_percent: user
      cpu_system_percent: system
      cpu_idle_percent: idle
    fidelity: lab_validated

  - id: viptela_notification
    parser_id: cisco_sdwan.v1
    literal: '%Viptela-'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>Notification:.{0,48}?\b(?P<name>[a-z]+(?:-[a-z]+)+)\b\s*(?:severity-level:(?P<level>[a-z]+))?.*)'
    facility: '{proc}'
    event_type: '{name}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: level
    alarm_floor: 2
    fields:
      title: '{name} on {host}[ (severity {level})]'
      correlation_key: '{name}:{device}'
    fidelity: lab_validated

  - id: viptela
    parser_id: cisco_sdwan.v1
    literal: '%Viptela-'
    pattern: '%Viptela-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>.*)'
    facility: '{proc}'
    event_type: '{proc}_{id}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: word
    native_code: sev
    # D3: only a critical line may alarm on severity alone. Everything else needs a
    # typed row, which states its own below-floor severity.
    alarm_floor: 2
    fields:
      title: '{proc} on {host}: {text}'
      correlation_key: '{proc}:{device}:{id}'
    fidelity: lab_validated

  # IOS-XE SD-WAN edges. NOT seen on the lab: the capture's cEdge lines are all
  # %DMI-5-AUTH_PASSED. doc_claimed until a capture promotes it. SOURCE NOT READ: the
  # Cisco Community page below returned 403; the shape comes from a search engine's
  # quotation of it, nothing better was found.
  - id: cisco_sdwan
    parser_id: cisco_sdwan.v1
    literal: '%Cisco-SDWAN-'
    pattern: '%Cisco-SDWAN-(?P<origin>\S{1,64}?)-(?P<proc>[A-Za-z][A-Za-z0-9_]{0,31})-(?P<sev>[0-7])-(?P<word>[A-Z]{4})-(?P<id>\d{1,12}):\s*(?P<text>.*)'
    facility: '{proc}'
    event_type: '{proc}_{id}'
    summary: '{text}'
    severity: {digit: sev}
    native_text: word
    native_code: sev
    alarm_floor: 2
    fields:
      title: '{proc} on {host}: {text}'
      correlation_key: '{proc}:{device}:{id}'
    fidelity: doc_claimed
    source: 'Cisco Community, "How to check BFD logging in Cisco SDWAN fabric" (`%Cisco-SDWAN-vm5-FTMD-5-NTCE-1000009: BFD-session ...`)'

  # Management audit (PR 11, owner D2). Non-alarm: no severity, no rule row. Vector stamps
  # `event_category` and a stable `dedup_key`; repeats are grouped at READ time and every
  # record stays stored. Usernames stay in the message (D7 is another stream).
  #
  # Wire `%DMI-5-AUTH_PASSED: R0/0: dmiauthd: ...`. IOS sends no process tag, so the app
  # is `unknown` and the mnemonic stays in the message (PR 10). The dedup key follows.
  - id: iosxe_dmi_auth
    parser_id: cisco_mgmt_audit.v1
    literal: 'dmiauthd: User '
    pattern: 'dmiauthd: User \W?(?P<user>[\w.@-]{1,64})\W? authenticated successfully(?: from (?P<src>[^\s:]{1,64})(?::(?P<port>\d{1,5}))?)?(?: and was authorized for (?P<svc>[\w]{1,16}(?: over [\w]{1,16})?))?'
    event_type: dmi_auth_passed
    summary: 'Device-management login[ by {user}][ from {src}][ for {svc}]'
    category: management_audit
    fields:
      title: 'Device-management login on {host}[ by {user}][ from {src}]'
      correlation_key: 'audit:{device}:dmi:{user}'
      audit_user: '{user}'
      audit_action: 'login_accepted'
      audit_source: '{src}[:{port}]'
      audit_via: '{svc}'
    fidelity: lab_validated

  # The vBond DNS lines the DNS rows read (lab capture 2026-11-09, VTRACKER/VDAEMON,
  # `<function>[<line>]: DNS ...`). Their own event type, so a failure and a success never
  # share guidance. No severity: PRI is the line's own. The generic `<function>[<line>]:`
  # row of wave 1 is gone: the lab shows no other line of that shape, and a grammar no
  # fixture decides is a claim nothing tests.
  - id: vedge_dns
    parser_id: cisco_sdwan.v1
    literal: ']: DNS '
    apps: [vtracker, vdaemon]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: DNS (?P<step>lookup|resolution) (?P<outcome>failed|succeeded|successful) for (?:\d{1,3}/)?(?P<target>[^\s,]{1,253})(?: via (?P<via>[^\s,]{0,64}))?(?:,? reason: (?P<reason>.{1,128}))?'
    event_type: 'dns_{step}_{outcome}'
    summary: 'DNS {step} {outcome} for {target}[ via {via}][ ({reason})]'
    fields:
      title: 'DNS {step} {outcome} for {target} on {host}[ ({reason})]'
      correlation_key: 'dns:{device}:{target}'
    fidelity: lab_validated

  # The vBond lookup's routine success path (live 2026-11-10, VTRACKER notice/local7, 72
  # lines in 11 minutes across the lab's vEdges): the tracker's cache entry for the vBond
  # name expires and it resolves again, then the resolver's cache takes the answer. The
  # target is read without the `0/` prefix and the `/0` suffix the tracker prints, so both
  # lines carry the lookup lines' correlation key and one vBond lookup groups as one. No
  # rule row, as for `DNS lookup succeeded`: a success has no honest clear to send. The
  # resolved address is in the title and summary; no typed field holds a DNS answer today.
  - id: vedge_dns_cache_expired
    parser_id: cisco_sdwan.v1
    literal: ']: DNS cache expired for '
    apps: [vtracker]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: DNS cache expired for (?:\d{1,3}/)?(?P<target>[^\s,/]{1,253})(?:/\d{1,5})?(?: via (?P<via>[^\s,]{0,64}))?'
    event_type: dns_cache_expired
    summary: 'DNS cache expired for {target}[ via {via}], resolving again'
    fields:
      title: 'DNS cache expired for {target} on {host}, resolving again'
      correlation_key: 'dns:{device}:{target}'
    fidelity: lab_validated

  - id: vedge_dns_resolved
    parser_id: cisco_sdwan.v1
    literal: ']: FQDN '
    apps: [vtracker]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: FQDN (?P<target>[^\s,/()]{1,253})(?: \(via (?P<via>[^\s,()]{0,64})\))? resolved to (?P<addr>[0-9A-Fa-f.:]{2,45})'
    event_type: dns_resolved
    summary: 'DNS lookup succeeded for {target}[ via {via}]: resolved to {addr}'
    fields:
      title: 'DNS lookup succeeded for {target} on {host}: resolved to {addr}'
      correlation_key: 'dns:{device}:{target}'
    fidelity: lab_validated

  # The resolver refreshing the vBond entry it already holds (live 2026-11-11, VTRACKER
  # notice): routine, the same lookup's key as the lines above, no rule row.
  - id: vedge_dns_cache_refreshed
    parser_id: cisco_sdwan.v1
    literal: ']: DNS cache entry for '
    apps: [vtracker]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: DNS cache entry for (?P<target>[^\s,/()]{1,253})(?: \(via (?P<via>[^\s,()]{0,64})\))? refreshed'
    event_type: dns_cache_refreshed
    summary: 'DNS cache entry for {target}[ via {via}] refreshed'
    fields:
      title: 'DNS cache entry for {target} refreshed on {host}'
      correlation_key: 'dns:{device}:{target}'
    fidelity: lab_validated

  # The vEdge resolver daemon watching its default gateway (RESOLVD notice, live
  # 2026-11-11 at boot): the tracker on the transport interface (`Monitor attached to
  # <vpn>/<gateway>/<n> via <if> is UP`) and the resolver's own verdict (`Default gateway
  # <gateway> in VPN <vpn> is now reachable`). Both lines of one gateway carry one key,
  # `gateway:<device>:<vpn>:<gateway>`, so its up and down pair on one timeline. The lab
  # shows only UP and `reachable`; the DOWN and `unreachable` words are inferred from them
  # (fixtures doc_claimed, the rule row below says so), and a real capture is what
  # promotes them. `<n>` after the address is not documented and is not read.
  - id: vedge_gateway_monitor
    parser_id: cisco_sdwan.v1
    literal: ']: Monitor attached to '
    apps: [resolvd]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: Monitor attached to (?P<vpn>\d{1,5})/(?P<gw>[0-9A-Fa-f.:]{2,45})/\d{1,5} via (?P<ifname>[A-Za-z][\w/.-]{0,31}) is (?P<state>UP|DOWN)'
    event_type: 'gateway_monitor_{state}'
    summary: 'Gateway monitor for {gw} in VPN {vpn} via {ifname} is {state}'
    fields:
      title: 'Gateway {gw} in VPN {vpn} via {ifname} is {state} on {host}'
      correlation_key: 'gateway:{device}:{vpn}:{gw}'
    fidelity: lab_validated

  - id: vedge_default_gateway
    parser_id: cisco_sdwan.v1
    literal: ']: Default gateway '
    apps: [resolvd]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: Default gateway (?P<gw>[0-9A-Fa-f.:]{2,45}) in VPN (?P<vpn>\d{1,5}) is now (?P<reach>reachable|unreachable)'
    event_type: 'default_gateway_{reach}'
    summary: 'Default gateway {gw} in VPN {vpn} is now {reach}'
    fields:
      title: 'Default gateway {gw} in VPN {vpn} is now {reach} on {host}'
      correlation_key: 'gateway:{device}:{vpn}:{gw}'
    fidelity: lab_validated

  # The vEdge configuration manager skipping a push to a routing daemon it cannot reach
  # (CFGMGR err, live 2026-11-11 at boot: `Quagga daemon - ospfd link is down (vpn:512),
  # skipping`). At boot the routing daemons start after cfgmgr, so the line is transient;
  # later it would mean configuration is NOT reaching that daemon. No row: it keeps its
  # err and the generic net sends it at warn, below the open floor, so it joins a component
  # that grounds to the device and cannot start one (rule 1, owner D3).
  - id: vedge_cfgmgr_daemon_link_down
    parser_id: cisco_sdwan.v1
    literal: ']: Quagga daemon - '
    apps: [cfgmgr]
    pattern: '^(?P<func>[a-z][a-z0-9_]{0,63})\[(?P<lno>\d{1,6})\]: Quagga daemon - (?P<daemon>[a-z][a-z0-9_]{0,31}) link is down \(vpn:(?P<vpn>\d{1,5})\)(?:, (?P<action>[a-z ]{1,32}))?'
    event_type: cfgmgr_routing_daemon_unreachable
    summary: 'Configuration manager cannot reach {daemon} in VPN {vpn}[, {action}]'
    fields:
      title: 'Configuration manager on {host} cannot reach {daemon} in VPN {vpn}, change skipped'
      correlation_key: 'cfgmgr:{device}:{daemon}:{vpn}'
    fidelity: lab_validated

  # The vEdge forwarding plane's user-mode process (`fp-um`, live 2026-11-11 at boot).
  # Port status as the forwarding plane programs it: the kernel interface name, the port
  # id and three status numbers, kept as typed metrics. Their encoding is not documented
  # (the lab shows only 1, at boot), so no title says up or down and no row reads them.
  - id: vedge_fp_port_status
    parser_id: cisco_sdwan.v1
    literal: ': Updating port status for portid '
    apps: [fp-um]
    pattern: '^(?P<ctx>[A-Z][A-Z0-9_]{0,15}): (?P<ifname>[A-Za-z][\w/.-]{0,31}): Updating port status for portid (?P<portid>\d{1,5}) admin_status (?P<admin>\d{1,3}), port_status (?P<port>\d{1,3}), link_status (?P<link>\d{1,3})(?:, fast (?P<fast>\d{1,3}))?'
    event_type: fp_port_status
    summary: 'Forwarding plane updated port {portid} ({ifname}): admin_status {admin}, port_status {port}, link_status {link}'
    fields:
      title: 'Forwarding plane updated {ifname} (port {portid}) on {host}'
      correlation_key: 'fp_port:{device}:{portid}'
    metrics:
      admin_status: admin
      port_status: port
      link_status: link
    fidelity: lab_validated

  # `Port 3: Cannot remove default MAC address` (fp-um err, live 2026-11-11, at boot for
  # each port as the forwarding plane takes it over). The port's key matches the status
  # line above. Native err kept; the row `syslog.sdwan.fp.default_mac` keeps it off the
  # generic net.
  - id: vedge_fp_default_mac
    parser_id: cisco_sdwan.v1
    literal: ': Cannot remove default MAC address'
    apps: [fp-um]
    pattern: '^Port (?P<portid>\d{1,5}): Cannot remove default MAC address'
    event_type: fp_default_mac_not_removed
    summary: 'Forwarding plane could not remove the default MAC address of port {portid}'
    fields:
      title: 'Forwarding plane could not remove the default MAC address of port {portid} on {host}'
      correlation_key: 'fp_port:{device}:{portid}'
    fidelity: lab_validated

  # The IOS XE boot banner (live 2026-11-11 on the lab's cEdge, a Catalyst 8000v on 17.3.2;
  # edge shape `sequence_number_without_time` frames it). IOSd prints four lines when it
  # starts, before its clock is set, so they carry no time and no tag (app `unknown`). Any
  # IOS XE box prints the same lines; they sit in this pack because the lab's cEdge is
  # where they were captured, as `iosxe_dmi_auth` does. The bracketed release train
  # (`[Amsterdam]`) is printed by IOS XE 16 and later only, so the version row names IOS XE
  # on it alone. All four lines carry one key per boot, the device and the minute, the
  # dump_id rule's tradeoff (a boot that straddles a minute splits in two). No signal: a
  # reboot reaches the engine as `device_restart` from the coldStart/warmStart trap row
  # (trap.device.restart.*) and from the controller (nms/vmanage_kinds.go), and a banner
  # line is the same event seen a third time with less in it.
  - id: iosxe_boot_version
    parser_id: cisco_iosxe.v1
    literal: 'Cisco IOS Software ['
    apps: [unknown]
    pattern: '^Cisco IOS Software \[(?P<train>[A-Za-z][A-Za-z0-9 ]{0,31})\], (?P<platform>[A-Za-z0-9 ._-]{1,64}) Software \((?P<image>[A-Za-z0-9_.-]{1,64})\), Version (?P<version>[0-9][0-9A-Za-z.()]{0,31}), (?P<release>[A-Z][A-Z ]{0,31}SOFTWARE)(?: \((?P<fc>[a-z0-9]{1,16})\))?'
    event_type: ios_boot_version
    summary: 'Booted Cisco IOS XE {version} ({train}), image {image}'
    category: system_lifecycle
    fields:
      title: '{host} booted Cisco IOS XE {version}'
      correlation_key: 'boot:{device}[:{minute}]'
    metrics:
      software_version: {text: version}
      software_image: {text: image}
      release_train: {text: train}
    fidelity: lab_validated

  - id: iosxe_banner_support
    parser_id: cisco_iosxe.v1
    literal: 'Technical Support: '
    apps: [unknown]
    pattern: '^Technical Support: (?P<url>https?://[A-Za-z0-9./_-]{1,128})'
    event_type: ios_boot_banner
    summary: 'Cisco IOS boot banner: support link {url}'
    category: system_lifecycle
    fields:
      title: 'Cisco IOS boot banner on {host}: support link'
      correlation_key: 'boot:{device}[:{minute}]'
    fidelity: lab_validated

  - id: iosxe_banner_copyright
    parser_id: cisco_iosxe.v1
    literal: ' by Cisco Systems, Inc.'
    apps: [unknown]
    pattern: '^Copyright \(c\) (?P<years>[0-9]{4}-[0-9]{4}) by Cisco Systems, Inc\.'
    event_type: ios_boot_banner
    summary: 'Cisco IOS boot banner: copyright {years}'
    category: system_lifecycle
    fields:
      title: 'Cisco IOS boot banner on {host}: copyright notice'
      correlation_key: 'boot:{device}[:{minute}]'
    fidelity: lab_validated

  - id: iosxe_banner_compiled
    parser_id: cisco_iosxe.v1
    literal: 'Compiled '
    apps: [unknown]
    pattern: '^Compiled (?P<built>[A-Z][a-z]{2} [0-9]{1,2}-[A-Z][a-z]{2}-[0-9]{2} [0-9]{1,2}:[0-9]{2}) by (?P<builder>[A-Za-z0-9_.-]{1,32})'
    event_type: ios_boot_banner
    summary: 'Cisco IOS boot banner: image built {built} by {builder}'
    category: system_lifecycle
    fields:
      title: 'Cisco IOS boot banner on {host}: build stamp {built}'
      correlation_key: 'boot:{device}[:{minute}]'
    fidelity: lab_validated

  # Poll-induced management-plane records (PR 11 shape, owner D2). The vEdge confd SNMP
  # agent logs these while answering OUR poller's interfaceTable walk: about 45 an hour
  # across the lab's vEdges (measured live 2026-11-10). Non-alarm: no severity, a stable
  # dedup key; every record stays stored and is grouped at read time. The process tag
  # they arrive with was not recorded, so no `apps` gate: the literals are the guard.
  - id: snmpa_table_error
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'devel-snmpa internal error: table '
    pattern: 'devel-snmpa internal error: table (?P<op>[a-z-]{1,16}): (?P<table>\w{1,64}) \(error: (?P<err>\w{1,64})\)'
    event_type: snmp_agent_table_error
    summary: 'SNMP agent could not serve {table} on {op} ({err}) (poll)'
    category: management_audit
    fields:
      title: 'SNMP agent could not serve {table} on {host} (poll)'
      correlation_key: 'snmp_agent:{device}:{table}'
    fidelity: lab_validated

  - id: snmpa_instr_trace
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'devel-snmpa {confd_snmpa_instr,'
    pattern: 'devel-snmpa \{confd_snmpa_instr,(?P<func>\w{1,64}),(?:\[\{table,(?P<table>\w{1,64})\})?'
    event_type: snmp_agent_instr_trace
    summary: 'SNMP agent trace in {func}[ for {table}] (poll)'
    category: management_audit
    fields:
      title: 'SNMP agent trace on {host}[ for {table}] (poll)'
      correlation_key: 'snmp_agent:{device}[:{table}]'
    fidelity: lab_validated

  - id: snmp_get_response_error
    parser_id: cisco_sdwan_mgmt_poll.v1
    literal: 'snmp get-response reqid='
    pattern: 'snmp get-response reqid=\d{1,12} (?P<dst>[^\s:]{1,64})(?::\d{1,5})? error-status=(?P<status>[A-Za-z]{1,32}) ix=\d{1,6}(?: \(\w{1,16} (?P<obj>[A-Za-z][\w-]{0,63}))?'
    event_type: 'snmp_get_response_{status}'
    summary: 'SNMP answer {status} to {dst}[ on {obj}] (poll)'
    category: management_audit
    fields:
      title: 'SNMP {status} answering our poll on {host}[ ({obj})]'
      correlation_key: 'snmp_agent:{device}[:{obj}]'
    fidelity: lab_validated

  # vEdge SYSMGR process-table dumps (live, 2026-11-10): with each cpu-usage event the
  # vEdge logs `ps` one line per row, a header then one row per process. Diagnostic
  # context, never an alarm: no severity reader, no rule row (event_category
  # diagnostic_dump, which the Logs list hides by default). Every row of one snapshot,
  # and the cpu-usage line it accompanies, carries one dump_id: the device and the UTC
  # minute of the record. Stateless, so a snapshot that straddles a minute boundary
  # splits in two, and rows carry no sequence number: read time orders a dump by
  # receive time and joins the neighbouring minute. The header is the dump's
  # representative row. Rows stay stored (D5).
  - id: sysmgr_ps_header
    parser_id: cisco_sdwan_diag.v1
    literal: 'PID %CPU %MEM'
    apps: [sysmgr]
    pattern: '^USER\s+PID\s+%CPU\s+%MEM\s+VSZ\s+RSS\s+TTY\s+STAT\s+START\s+TIME\s+COMMAND'
    event_type: process_table
    summary: process table header
    category: diagnostic_dump
    fields:
      title: 'Process snapshot on {host}'
      correlation_key: 'process_table:{device}'
      dump_id: '[dump:{device}:{minute}]'
    fidelity: lab_validated

  # One `ps aux` row. `proc` is the command's basename (`/usr/sbin/ftmd -f` -> ftmd) or a
  # kernel thread's name (`[kworker/0:2]` -> kworker), read through the pack's
  # `process` label table for the summary.
  - id: sysmgr_ps_row
    parser_id: cisco_sdwan_diag.v1
    literal: ':'
    apps: [sysmgr]
    pattern: '^(?P<user>\S{1,32})\s+(?P<pid>\d{1,7})\s+(?P<cpu>\d{1,3}\.\d)\s+(?P<mem>\d{1,3}\.\d)\s+(?P<vsz>\d{1,12})\s+(?P<rss>\d{1,12})\s+(?P<tty>\S{1,16})\s+(?P<stat>\S{1,8})\s+(?P<start>\S{1,8})\s+(?P<time>\d{1,6}:\d{2})\s+(?P<cmd>(?:\[|\S*/)?(?P<proc>[A-Za-z0-9_.@-]{1,64}).{0,255})'
    event_type: process_table
    summary: '{proc|process} ({proc}) using {cpu}% CPU, {mem}% memory'
    category: diagnostic_dump
    fields:
      title: '{proc|process} ({proc}) on {host}'
      correlation_key: 'process_table:{device}'
      dump_id: '[dump:{device}:{minute}]'
    metrics:
      process: {text: proc}
      cpu_percent: cpu
      mem_percent: mem
      rss_kb: rss
      vsz_kb: vsz
      state: {text: stat}
      start: {text: start}
      cputime: {text: time}
    fidelity: lab_validated

# Typed rows, in match order. D3: only the critical CPU row may open an object alone.
# Everything else states `warn` or `info`, below `severity_open_floor`, so it can join
# a component and cannot start one. E1 still makes a device's own syslog and its SNMP
# episode one observation: these rows corroborate and cannot confirm on their own.
rules:
  # CPU. Lab evidence: SYSMGR 200069 (2-CRIT above 90%), 200070 (4-WARN above 75%),
  # 200071 (4-WARN above 60%), 200072 (5-NTCE below 75%), each also as a sysmgrd
  # `Notification: cpu-usage` line. Keyed on the text, not the ids: the id list is not
  # documented and the wording is what the lines were seen to say. Case-sensitive, so
  # the notification twin (`-sysmgrd-`) does not emit a second signal for one crossing.
  - rule_id: syslog.sdwan.cpu_high.critical
    lane: syslog
    source: syslog
    kind: device_resource_anomaly
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[0-2]-[A-Z]{4}-\d+: System cpu usage is above \d+%'
    guard: {re: [msg, '-SYSMGR-[0-2]-[A-Z]{4}-\d+: System cpu usage is above \d+%', '']}
    severity: crit
    extract: &cpu_extract
      threshold: {re: [[msg, 'System cpu usage is (?:above|below) (\d+)%', 1, '']]}
    emit: &cpu_emit
      metric: device_resource
      modality: device_telemetry
      entity: {type: device, id: '{host}'}
      native_id: '{host}|cpu|{threshold|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        resource: {const: cpu}
        threshold_pct: {var: threshold}

  - rule_id: syslog.sdwan.cpu_high.warning
    lane: syslog
    source: syslog
    kind: device_resource_anomaly
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[3-7]-[A-Z]{4}-\d+: System cpu usage is above \d+%'
    guard: {re: [msg, '-SYSMGR-[3-7]-[A-Z]{4}-\d+: System cpu usage is above \d+%', '']}
    severity: warn
    extract: *cpu_extract
    emit: *cpu_emit

  # A clear means this threshold is no longer crossed, not that the device is healthy:
  # the lab sends `above 60%` and `below 75%` in the same millisecond on the way down.
  - rule_id: syslog.sdwan.cpu_high.clear
    lane: syslog
    source: syslog
    kind: device_resource_anomaly_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: '-SYSMGR-[0-7]-[A-Z]{4}-\d+: System cpu usage is below \d+%'
    guard: {re: [msg, '-SYSMGR-[0-7]-[A-Z]{4}-\d+: System cpu usage is below \d+%', '']}
    severity: info
    extract: *cpu_extract
    emit: *cpu_emit

  - rule_id: syslog.sdwan.cpu_normal.clear
    lane: syslog
    source: syslog
    kind: device_resource_anomaly_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    pattern_src: 'Notification: cpu-usage .{0,200}?System cpu usage back to normal level'
    guard: {re: [msg, 'Notification: cpu-usage .{0,200}?System cpu usage back to normal level', '']}
    severity: info
    extract: {threshold: {const: normal}}
    emit: *cpu_emit

  # vBond DNS. Lab evidence: VTRACKER and VDAEMON, one failure reported as both a lookup
  # and a resolution line. `device_alarm`, on purpose, NOT `dns_failure_rate`: the kind
  # `sig.ent.internet.dns-impairment` needs alone, and it names the ISP as owner, so a
  # chronic vBond failure would score full coverage and blame the ISP in any component
  # on that device with no independent evidence. A device failing to resolve its own
  # orchestrator says nothing about the internet's DNS. `failure` names it for an operator;
  # test_vendor_pack_floor_387.py pins that no DNS template can pick it up.
  #
  # `DNS lookup succeeded` has no row and emits nothing. There is no honest clear to send:
  # `device_alarm_clear` would read as the end of every alarm on the device, and a kind
  # of its own would have nothing to clear. The record stays stored and searchable.
  - rule_id: syslog.sdwan.dns.failed
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: lab_validated
    pattern_src: 'DNS (?:lookup|resolution) failed for'
    guard:
      all:
        - {equals_any: [tag, [VTRACKER, VDAEMON]]}
        - {re: [msg, 'DNS (?:lookup|resolution) failed for', '']}
    severity: warn
    extract:
      target: {re: [[msg, ' for (\S{1,128})', 1, '']]}
      step: {re: [[msg, 'DNS (lookup|resolution)', 1, '']]}
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|alarm|dns_resolution_failed|{step|?}|{target|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        failure: {const: dns_resolution_failed}
        target: {var: target}
        step: {var: step}

  # Same vocabulary as nms/vmanage_kinds.go, which maps this very event name
  # (`bfd-state-change`) to controller_bfd_down, so a device's own report and the
  # controller's name the same hypothesis. Bound to the device, not a tunnel: a syslog
  # line alone cannot build the `tloc_pair` id the controller lane uses.
  #
  # Control connections and BFD. NOT seen on the lab (a substring search of 18,436 stored
  # lines found neither). Documented shape only, so `doc_claimed` and fixtures hand-built
  # from the citations; a real capture is what promotes them. The Splunk page was read and
  # quotes the control-connection line. The Cisco page was only readable through a tool
  # that summarised it, so the BFD wording is partly second-hand: `bfd-state-change`,
  # `flap-reason:` and the state values, plus `new-state` from nms/vmanage_kinds.go. Sources:
  #   Cisco 215359 https://www.cisco.com/c/en/us/support/docs/routers/vedge-router/215359-bidirectional-forwarding-detection-flap.html
  #   Splunk https://research.splunk.com/sources/350c4a45-24df-4339-ba57-8b8c09f2865f/
  - rule_id: syslog.sdwan.control_connection.down
    lane: syslog
    source: syslog
    kind: controller_control_connection_loss
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: 'control-connection-state-change\b.{0,400}?\bnew-state:down\b'
    guard: {re: [msg, 'control-connection-state-change\b.{0,400}?\bnew-state:down\b', '']}
    severity: warn
    extract: &ctrl_extract
      peer_type: {re: [[msg, '\bpeer-type:([A-Za-z]{1,32})', 1, '']]}
      peer: {re: [[msg, '\bpeer-system-ip:(\S{1,64})', 1, '']]}
    emit: &ctrl_emit
      metric: control_connection
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|control_connection|{peer_type|?}|{peer|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        peer_type: {var: peer_type}
        peer: {var: peer}

  - rule_id: syslog.sdwan.control_connection.up
    lane: syslog
    source: syslog
    kind: controller_control_connection_loss_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: 'control-connection-state-change\b.{0,400}?\bnew-state:up\b'
    guard: {re: [msg, 'control-connection-state-change\b.{0,400}?\bnew-state:up\b', '']}
    severity: info
    extract: *ctrl_extract
    emit: *ctrl_emit

  - rule_id: syslog.sdwan.bfd.down
    lane: syslog
    source: syslog
    kind: controller_bfd_down
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: '\bbfd-state-change\b.{0,500}?\bnew-state:down\b'
    guard: {re: [msg, '\bbfd-state-change\b.{0,500}?\bnew-state:down\b', '']}
    severity: warn
    extract: &bfd_extract
      reason: {re: [[msg, '\bflap-reason:(\S{1,48})', 1, '']]}
      local_color: {re: [[msg, '\blocal-color:"?([\w-]{1,32})', 1, '']]}
      remote_color: {re: [[msg, '\bremote-color:"?([\w-]{1,32})', 1, '']]}
    emit: &bfd_emit
      metric: bfd_session
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|bfd|{local_color|?}|{remote_color|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        flap_reason: {var: reason}
        local_color: {var: local_color}
        remote_color: {var: remote_color}

  - rule_id: syslog.sdwan.bfd.up
    lane: syslog
    source: syslog
    kind: controller_bfd_down_clear
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: doc_claimed
    pattern_src: '\bbfd-state-change\b.{0,500}?\bnew-state:up\b'
    guard: {re: [msg, '\bbfd-state-change\b.{0,500}?\bnew-state:up\b', '']}
    severity: info
    extract: *bfd_extract
    emit: *bfd_emit

  # PENDING OWNER REVIEW (decision 2026-11-09: keep it narrow and counted). Repeats on
  # every vEdge sampled (1,277 stored lines from 3 devices) at severity 3, with no state
  # in the text. Harmlessness is NOT proven; the plan says "may be harmless". The guard is
  # the whole text shape: a different message under the same id still reaches the
  # below-floor row, and `corr_parser_known_benign_total` shows if the rate moves.
  - rule_id: syslog.sdwan.ftmd.interface_dump
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: repeating FTMD interface dump with no state or fault in the text; pending owner review
    pattern_src: '-FTMD-3-ERRO-1000003: User ifname = \S+; kernel if_name= \S+; encap = \d+'
    guard: {re: [msg, '-FTMD-3-ERRO-1000003: User ifname = \S+; kernel if_name= \S+; encap = \d+', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # PENDING OWNER REVIEW, as the FTMD row above. The SNMP agent's own error lines while it
  # answers OUR poll (grammars `snmpa_*`, `snmp_get_response_error`). What they state is
  # that the agent could not serve part of interfaceTable to Correlix, not a network
  # fault, and a device may send them at warning or err, where the generic net would turn
  # every poll cycle into a device alarm. The guard is the whole text shape; the records
  # stay stored with their dedup key, and `corr_parser_known_benign_total` shows the rate.
  - rule_id: syslog.sdwan.snmp_agent.poll_error
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: the device SNMP agent failing to serve part of interfaceTable to our own poller; no network state in the text; pending owner review
    pattern_src: 'devel-snmpa\sinternal\serror:\stable\s[a-z-]{1,16}:\sinterfaceTable\s.error:\s|devel-snmpa\s.confd_snmpa_instr,table_func,|snmp\sget-response\sreqid=\d{1,12}\s\S{1,64}\serror-status=genErr\six=\d{1,6}\s.\w{1,16}\sinterface'
    guard: {re: [msg, 'devel-snmpa\sinternal\serror:\stable\s[a-z-]{1,16}:\sinterfaceTable\s.error:\s|devel-snmpa\s.confd_snmpa_instr,table_func,|snmp\sget-response\sreqid=\d{1,12}\s\S{1,64}\serror-status=genErr\six=\d{1,6}\s.\w{1,16}\sinterface', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # The default gateway of a transport VPN lost (grammars `vedge_gateway_monitor` and
  # `vedge_default_gateway`). A real transport fault: while it lasts the edge has no next
  # hop on that WAN, so its tunnels over that transport fail. `device_alarm` at `warn`, as
  # the vBond DNS failure: below the open floor, it joins a component that grounds to the
  # device (the BFD and control-connection losses that follow it) and names the failure
  # for an operator, and no template can take it as an ISP or circuit verdict on its own
  # (a vEdge losing ARP or ping to its gateway does not say whose fault that is). One
  # transition logs both lines, so both emit, as the DNS lookup and resolution lines do;
  # one entity and kind, one node. DOC_CLAIMED: the lab shows only the recovery words (UP,
  # `reachable`); DOWN and `unreachable` are inferred from them, never captured.
  #
  # The recovery has no row, as `DNS lookup succeeded` has none: `device_alarm_clear` would
  # read as the end of every alarm on the device. Its record carries the same correlation
  # key, so the timeline shows when the gateway came back. Two rows, one per line shape,
  # sharing their reading: each guard's literal text is what the ingest screen admits on,
  # and one alternation would have screened on two bare words.
  - rule_id: syslog.sdwan.default_gateway.monitor_down
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: doc_claimed
    pattern_src: 'Monitor attached to \d{1,5}/\S{1,45}/\d{1,5} via \S{1,32} is DOWN'
    guard:
      all:
        - {equals_any: [tag, [RESOLVD]]}
        - {re: [msg, 'Monitor attached to \d{1,5}/\S{1,45}/\d{1,5} via \S{1,32} is DOWN', '']}
    severity: warn
    extract: &gateway_extract
      gateway: {re: [[msg, 'Monitor attached to \d{1,5}/([^/\s]{1,45})/', 1, ''], [msg, 'Default gateway (\S{1,45}) in VPN', 1, '']]}
      vpn: {re: [[msg, 'Monitor attached to (\d{1,5})/', 1, ''], [msg, ' in VPN (\d{1,5}) is now', 1, '']]}
      ifname: {re: [[msg, ' via (\S{1,32}) is DOWN', 1, '']]}
    emit: &gateway_emit
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|alarm|default_gateway_unreachable|{vpn|?}|{gateway|?}|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs:
        failure: {const: default_gateway_unreachable}
        gateway: {var: gateway}
        vpn: {var: vpn}
        interface: {var: ifname}

  - rule_id: syslog.sdwan.default_gateway.unreachable
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: doc_claimed
    pattern_src: 'Default gateway \S{1,45} in VPN \d{1,5} is now unreachable'
    guard:
      all:
        - {equals_any: [tag, [RESOLVD]]}
        - {re: [msg, 'Default gateway \S{1,45} in VPN \d{1,5} is now unreachable', '']}
    severity: warn
    extract: *gateway_extract
    emit: *gateway_emit

  # `Port <n>: Cannot remove default MAC address` (grammar `vedge_fp_default_mac`). fp-um
  # logs it at err for each port while the forwarding plane takes the ports over at boot,
  # and the generic net made a device alarm of every one. The text names no fault the
  # engine could use: the port goes on to be programmed (the status line that follows
  # it). The guard is the whole text shape and the fp-um tag, so any other fp-um error
  # still reaches the net, and `corr_parser_known_benign_total` shows if the rate moves.
  - rule_id: syslog.sdwan.fp.default_mac
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: the vEdge forwarding plane noting at boot that a port kept its default MAC address; no fault in the text
    pattern_src: '^Port \d{1,5}: Cannot remove default MAC address'
    guard:
      all:
        - {equals_any: [tag, [FP-UM]]}
        - {re: [msg, '^Port \d{1,5}: Cannot remove default MAC address', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # Rule 1, "ingestion is not incident creation": any other error or warning of this
  # grammar still reaches the engine, at `warn`, so it can join a component and enrich an
  # undetermined outcome. It matches no signature.
  - rule_id: syslog.sdwan.below_floor
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: lab_validated
    pattern_src: '%Viptela-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:'
    guard: {re: [msg, '%Viptela-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:', '']}
    severity: warn
    extract: &below_extract
      facility: {re: [[msg, '-([A-Za-z]\w{0,31})-[34]-[A-Z]{4}-\d{1,12}:', 1, '']]}
      mnem: {re: [[msg, '-[34]-([A-Z]{4}-\d{1,12}):', 1, '']]}
      text: {var: msg, slice: 256}
    emit: &below_emit
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|alarm|{facility|?}|{mnem|?}|-|{ts_ms}'
      content_tag: msg
      tokens: [{t: '{host}'}]
      attrs:
        facility: {var: facility}
        mnemonic: {var: mnem}
        tag: {var: tag}
        text: {var: text}

  # SOURCE NOT READ, as for the `cisco_sdwan` grammar above: this row rests on that one
  # quoted example.
  - rule_id: syslog.sdwan.below_floor.iosxe
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [cisco]
    generic: true
    fidelity_status: doc_claimed
    pattern_src: '%Cisco-SDWAN-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:'
    guard: {re: [msg, '%Cisco-SDWAN-\S{1,64}?-[A-Za-z]\w{0,31}-[34]-[A-Z]{4}-\d{1,12}:', '']}
    severity: warn
    extract: *below_extract
    emit: *below_emit

# Rows with no source. Recorded rather than guessed; a capture or a citable document
# is what adds them.
wanted:
  - symptom: OMP peer up/down
    kind: controller_control_connection_loss
    why_absent: no lab line (substring search of 18,436 stored lines), no documented syslog wording found
  - symptom: TLOC state change
    kind: controller_bfd_down
    why_absent: no lab line, no documented syslog wording found
  - symptom: System memory usage raise and clear
    kind: device_resource_anomaly
    why_absent: no lab line; a `memory` substring search found none, and the CPU wording cannot be assumed
  - symptom: IOS-XE BFD and control-connection wording
    kind: controller_bfd_down
    why_absent: the one public example was only readable as far as `BFD-session <a> -> <b>`, with no state word
  - symptom: Cisco's full syslog message-ID catalogue
    why_absent: not retrievable; the recovery wording of each id is unknown

fixtures:
  - name: an error line parses and lifts severity
    fidelity: lab_validated
    hostname: vEdge-1
    appname: FTMD
    message: '%Viptela-vEdge-1-FTMD-3-ERRO-1000003: User ifname = ge0/0; kernel if_name= ge0_0; encap = 1'
    expect:
      vendor: cisco
      vendor_source: format
      parser_id: cisco_sdwan.v1
      parser_status: parsed
      facility: FTMD
      event_type: ftmd_1000003
      summary: 'User ifname = ge0/0; kernel if_name= ge0_0; encap = 1'
      severity_native_text: ERRO
      severity_native_code: '3'
      normalized_severity: error
      message: '%Viptela-vEdge-1-FTMD-3-ERRO-1000003: User ifname = ge0/0; kernel if_name= ge0_0; encap = 1'
    signal: null

  - name: a warning line with a hyphenated host
    fidelity: lab_validated
    hostname: vEdge-1
    appname: SYSMGR
    message: '%Viptela-vEdge-1-SYSMGR-4-WARN-200071: System cpu usage is above 60%'
    expect:
      parser_status: parsed
      facility: SYSMGR
      event_type: sysmgr_200071
      severity_native_text: WARN
      severity_native_code: '4'
      normalized_severity: warning
    signal: {rule_id: syslog.sdwan.cpu_high.warning, kind: device_resource_anomaly, severity: warn, opens_alone: false}

  - name: a notice line does not lift above the wire level
    fidelity: lab_validated
    hostname: vEdge-1
    appname: SYSMGR
    message: '%Viptela-vEdge-1-SYSMGR-5-NTCE-200072: System cpu usage is below 75%'
    expect:
      parser_status: parsed
      event_type: sysmgr_200072
      severity_native_text: NTCE
      normalized_severity: notice
    signal: {rule_id: syslog.sdwan.cpu_high.clear, kind: device_resource_anomaly_clear, severity: info, opens_alone: false}

  - name: a critical line lifts to critical
    fidelity: lab_validated
    hostname: vEdge-1
    appname: SYSMGR
    message: '%Viptela-vEdge-1-SYSMGR-2-CRIT-200069: System cpu usage is above 90% (critically high)'
    expect:
      parser_status: parsed
      event_type: sysmgr_200069
      severity_native_text: CRIT
      severity_native_code: '2'
      normalized_severity: critical
    signal: {rule_id: syslog.sdwan.cpu_high.critical, kind: device_resource_anomaly, severity: crit, opens_alone: true}

  - name: a critical line with no typed row still alarms
    fidelity: doc_claimed
    hostname: vEdge-1
    appname: VDAEMON
    message: '%Viptela-vEdge-1-VDAEMON_0-2-CRIT-999999: synthetic shape of an unknown critical id'
    expect:
      parser_status: parsed
      facility: VDAEMON_0
      event_type: vdaemon_0_999999
      normalized_severity: critical
    signal: {kind: device_alarm, severity: crit, opens_alone: true}

