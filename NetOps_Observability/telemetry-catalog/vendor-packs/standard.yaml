# Plain-language names for ntpd's event names, read by `{event|ntp_event}`. Presentation
# only: an event this table does not name keeps ntpd's own word. Source: NTP 4
# documentation, "Event Messages and Status Words" (decode.html), system and peer codes.
labels:
  ntp_event:
    clock_sync: synchronised the clock
    no_sys_peer: has no time source selected (no system peer)
    clock_step: stepped the clock
    freq_set: set the clock frequency from its drift file
    freq_not_set: started without a drift file (frequency not set)
    spike_detect: saw a time spike and is holding the clock
    restart: restarted
    panic_stop: stopped because the clock is too far off (panic)
    sys_peer: selected a time source (system peer)
    mobilize: set up a peer association
    demobilize: removed a peer association
    unreachable: lost a peer (unreachable)
    reachable: reached a peer
