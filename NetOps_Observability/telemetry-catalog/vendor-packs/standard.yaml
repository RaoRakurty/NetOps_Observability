# Vendor-neutral grammars (tracker 387, plan §6a layer 1). A pack with `vendor: null`
# runs after every vendor pack and never stamps a vendor.
pack: standard
vendor: null
description: Grammars that hold for any sender.

# Frame shapes syslog-ng's legacy parser cannot read (tracker 387, PR 10). A row names a
# SHAPE, never a vendor: `match` runs on the raw frame before the parser, `replace` turns
# it into plain RFC 3164. Compiled into deployment/docker/syslog-ng/core.conf. The vendor
# named in a row's `source` is where the shape was seen, and any sender with that shape
# gets the same treatment. All cite documents except where marked: only Cisco is on the
# lab (plan §6a), so they stay doc_claimed until a real capture promotes them.
edge_shapes:
  # `<PRI>date=2026-11-09 time=09:00:00 devname=fw01 ...`: no header at all. The legacy
  # parser took `date=...` for a hostname and cut the body at the first colon.
  - id: key_value_body
    match: '^<[0-9]{1,3}>[a-zA-Z_][a-zA-Z0-9_]*="?[^ ]* [a-zA-Z_][a-zA-Z0-9_]*='
    no_header: true
    fidelity: doc_claimed
    source: 'FortiOS default log format, per the FortiGate parser in vector.yaml and research VENDOR_PACK_SOURCES_2026-11-09 §4'

  # `<189>Oct 9 14:59:04 2016 Sysname ...`: a single-digit day with ONE space. RFC 3164
  # pads the day to two characters (`Oct  9`); unpadded and followed by a year, the legacy
  # parser read the year as the hostname and the hostname as the program (edge probe,
  # 2026-11-13). The day is padded back; nothing else moves.
  - id: unpadded_day
    match: '^(<[0-9]{1,3}>[A-Z][a-z]{2}) ([1-9]) ([0-9]{2}:[0-9]{2}:[0-9]{2})'
    replace: '$1  $2 $3'
    fidelity: doc_claimed
    source: 'H3C Information center configuration, Table 7, CMCC-format example `<189>Oct 9 14:59:04 2016 Sysname %10SHELL/5/SHELL_LOGIN`, https://www.h3c.com/en/d_202309/1921112_294551_0.htm'

  # `<166>:2018-06-27T12:17:46Z: %ASA-6-110002: ...`: a colon straight after the PRI.
  - id: colon_after_pri
    match: '^(<[0-9]{1,3}>):'
    replace: '$1'
    fidelity: doc_claimed
    source: 'Cisco ASA 9.20 general configuration, "Monitor syslog", EMBLEM format'

  # `<189>25166: Nov  9 09:00:01.123 UTC: %LINK-3-UPDOWN: ...`: a zone word after the
  # time, which the parser took for the program. The word is dropped: `recv-time-zone`
  # already states the platform's assumption (UTC), and a device logging in another zone
  # is the per-site override core.conf records as a follow-up.
  - id: zone_word_after_time
    match: '^(<[0-9]{1,3}>(?:[0-9]+: )?[*.]?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?) [A-Z]{2,5}: '
    replace: '$1: '
    fidelity: doc_claimed
    source: 'Cisco IOS `service timestamps log datetime show-timezone`, research VENDOR_PACK_SOURCES_2026-11-09 §2.1'

  # `<190>sw01.pdx01: 2017 Jul 28 14:42:46 UTC: %AUTHPRIV-6-SYSTEM_MSG: ...`, and IOS with
  # `logging origin-id`: the host comes first with a colon, and the parser took it for
  # the program. The optional year is dropped: RFC 3164 has none, and the parser's own
  # year logic is what every other frame gets.
  - id: host_before_time
    match: '^(<[0-9]{1,3}>)(?:[0-9]+: )?((?![0-9]+:)[A-Za-z0-9._-]+): [*.]?(?:[0-9]{4} )?([A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?)(?: [A-Z]{2,5})?: '
    replace: '$1$3 $2 '
    fidelity: doc_claimed
    source: 'napalm-logs NX-OS syslog sample (Apache-2.0), research VENDOR_PACK_SOURCES_2026-11-09 §2.1'

  # `<187>94307: gw2.acy1 LC/0/2/CPU0:Jul  7 20:16:14.834 : ifmgr[214]: %PKT_INFRA-...`:
  # sequence, host, then a node name stuck to the time. The node stays in message_original.
  - id: node_before_time
    match: '^(<[0-9]{1,3}>)[0-9]+: ([A-Za-z0-9._-]+) [A-Za-z0-9/_-]+:([A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8}(?:\.[0-9]+)?)(?: [A-Z]{2,5})? ?: '
    replace: '$1$3 $2 '
    fidelity: doc_claimed
    source: 'napalm-logs IOS-XR syslog sample (Apache-2.0), research VENDOR_PACK_SOURCES_2026-11-09 §2.1'

  # `<189>65: Cisco IOS Software [Amsterdam], ...`: a sequence number and NO time. IOS XE
  # prints its boot banner this way, before its clock and `service timestamps` apply (live
  # on the lab's Catalyst 8000v, IOS XE 17.3.2, 2026-11-11). With no time the legacy parser
  # reads no hostname either, and takes the first word of the text for the program: the
  # banner was stored as programs `Cisco`, `Technical`, `Copyright` and `Compiled`, each
  # with its first word cut off the message. An IOS sender writes no program tag, so a
  # second colon is put after the sequence number: the parser still reads the number
  # (`meta sequenceId`), reads an EMPTY program at that colon (app `unknown`, as for every
  # untagged IOS line) and leaves the text whole. One PRI, the frame's own: it is a valid
  # frame, so no `frame_problem` (docs/runbooks/syslog-bad-frames.md: a real, valid shape
  # gets an edge shape). No time, so the record is read at receive time, as FortiGate's is.
  # Every shape that read correctly before is left alone, whatever order the rewrites run
  # in: a time after the number (plain IOS, NX-OS year, RFC 3339), a mnemonic (`%SYS-...`,
  # which r_mnemonic_is_not_a_program already puts back), a `word:` or `word[pid]:` after
  # the number (IOS `logging origin-id`, a tag), and a host and node stuck to a time (XR).
  - id: sequence_number_without_time
    match: '^(<[0-9]{1,3}>[0-9]{1,10}: )(?!%|[*.]?(?:[0-9]{4} )?[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}T|[A-Za-z0-9._/#-]+(?:\[[0-9]+\])?: |[A-Za-z0-9._-]+ [A-Za-z0-9/_-]+:[A-Z][a-z]{2} )'
    replace: '$1: '
    fidelity: lab_validated

  # `<PRI>2026-11-09T09:00:00.123456+00:00 host INFO bgp#bgpd[123]: ...`: the severity
  # word stands where the program belongs. The tag after it must end in a colon, so a
  # real program called INFO (`INFO: text`) is left alone.
  - id: severity_word_as_program
    match: '^(<[0-9]{1,3}>[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ [^ ]+) (?:EMERG|ALERT|CRIT|ERR|WARNING|WARN|NOTICE|INFO|DEBUG) ([^ :]+: )'
    replace: '$1 $2'
    fidelity: doc_claimed
    source: 'SONiC rsyslog template, sonic-buildimage files/image_config/rsyslog/rsyslog.conf.j2:62-70'

grammars:
  # Management audit (PR 11, owner D2), vendor-neutral: ConfD and OpenSSH run on many
  # platforms, so these rows hold for any sender and stamp no vendor. Non-alarm: no
  # severity, no rule row. `dedup_key` is (device, app, event_type); repeats are grouped
  # at READ time and every record stays stored. A failed login is deliberately NOT filed as
  # management_audit: the one refusal classified here (an SNMP request with a bad
  # community) has its own category, security_audit, so it never groups with the routine
  # records.
  # An SNMP session NAMES NO USER (found live 2026-11-11). A v1/v2c request carries no
  # user, so ConfD names the session by the COMMUNITY it carried: the "user" here is a
  # credential (owner D1). The slot is matched but not captured, so no title, summary,
  # typed field, dedup_key or correlation_key can carry it, and audit_user stays unset.
  # For SNMPv3 the slot is a USM user name, which is not a secret, but the line cannot
  # tell v2c from v3, so it is never read. The session's group and close lines that
  # follow look exactly like a person's (the rows below keep their user, D7); there the
  # read path masks the platform's configured communities by value (internal/credscrub)
  # and ai.RedactSecrets masks this line's shape.
  - id: confd_session_created
    parser_id: standard_mgmt_audit.v1
    literal: 'audit user: '
    apps: [confd]
    pattern: '^audit user: [^/\s]{1,64}(?:/(?P<usid>\d{1,12}))? created new session via (?P<via>snmp)(?: from (?P<src>[^\s:]{1,64}|\[[^\]\s]{1,64}\])(?::(?P<port>\d{1,5}))?)?'
    event_type: 'audit_session_created_{via}'
    summary: 'SNMP session[ from {src}] (poll)'
    category: management_audit
    fields:
      title: 'SNMP session on {host}[ from {src}] (poll)'
      correlation_key: 'audit:{device}:{via}[:{usid}]'
      audit_action: 'session_created'
      audit_source: '{src}[:{port}]'
      audit_via: '{via}'
      session_id: '{usid}'
    fidelity: lab_validated

  - id: confd_session_created_netconf
    parser_id: standard_mgmt_audit.v1
    literal: 'audit user: '
    apps: [confd]
    pattern: '^audit user: (?P<user>[^/\s]{1,64})(?:/(?P<usid>\d{1,12}))? created new session via (?P<via>netconf)(?: from (?P<src>[^\s:]{1,64}|\[[^\]\s]{1,64}\])(?::(?P<port>\d{1,5}))?)?'
    event_type: 'audit_session_created_{via}'
    summary: 'NETCONF session opened[ by {user}][ from {src}]'
    category: management_audit
    fields:
      title: 'NETCONF session opened on {host}[ by {user}][ from {src}]'
      correlation_key: 'audit:{device}:{via}[:{usid}]'
      audit_user: '{user}'
      audit_action: 'session_created'
      audit_source: '{src}[:{port}]'
      audit_via: '{via}'
      session_id: '{usid}'
    fidelity: lab_validated

  - id: confd_session_created_other
    parser_id: standard_mgmt_audit.v1
    literal: 'audit user: '
    apps: [confd]
    pattern: '^audit user: (?P<user>[^/\s]{1,64})(?:/(?P<usid>\d{1,12}))? created new session via (?P<via>[a-z]+)(?: from (?P<src>[^\s:]{1,64}|\[[^\]\s]{1,64}\])(?::(?P<port>\d{1,5}))?)?'
    event_type: 'audit_session_created_{via}'
    summary: 'Session opened via {via}[ by {user}][ from {src}]'
    category: management_audit
    fields:
      title: 'Session opened via {via} on {host}[ by {user}][ from {src}]'
      correlation_key: 'audit:{device}:{via}[:{usid}]'
      audit_user: '{user}'
      audit_action: 'session_created'
      audit_source: '{src}[:{port}]'
      audit_via: '{via}'
      session_id: '{usid}'
    fidelity: lab_validated

  - id: confd_session_groups
    parser_id: standard_mgmt_audit.v1
    literal: 'audit user: '
    apps: [confd]
    pattern: '^audit user: (?P<user>[^/\s]{1,64})(?:/(?P<usid>\d{1,12}))? assigned to groups:\s*(?P<groups>\S.{0,127})?'
    event_type: audit_session_groups
    summary: 'Session[ of {user}] given groups[ {groups}]'
    category: management_audit
    fields:
      title: 'Session groups assigned on {host}[ to {user}]'
      correlation_key: 'audit:{device}:groups[:{usid}]'
      audit_user: '{user}'
      audit_action: 'groups_assigned'
      session_id: '{usid}'
      audit_groups: '{groups}'
    fidelity: lab_validated

  - id: confd_session_terminated
    parser_id: standard_mgmt_audit.v1
    literal: 'audit user: '
    apps: [confd]
    pattern: '^audit user: (?P<user>[^/\s]{1,64})(?:/(?P<usid>\d{1,12}))? terminated session(?: \(reason: (?P<reason>[^)]{1,64})\))?'
    event_type: audit_session_terminated
    summary: 'Session[ of {user}] closed[ ({reason})]'
    category: management_audit
    fields:
      title: 'Session closed on {host}[ for {user}][ ({reason})]'
      correlation_key: 'audit:{device}:terminated[:{usid}]'
      audit_user: '{user}'
      audit_action: 'session_terminated'
      session_id: '{usid}'
    fidelity: lab_validated

  # ConfD's SNMP agent refusing a v1/v2c request whose community it does not know. Live on
  # every lab vEdge (2026-11-10, confd info/local1, about every 20 s, from 127.0.0.1: a
  # poller on the box itself holding a wrong community). The same text is a ConfD
  # AuditNotification on non-Cisco platforms (Broadcom KB 184838), so the row is neutral.
  #
  # THE COMMUNITY IS A CREDENTIAL (owner D1). ConfD prints it twice: as the session's user
  # (`audit user: <community>/0`: a v1/v2c request has no user, so the agent names it by
  # the community it carried) and after `bad community name:`. No group captures either,
  # so no title, summary, typed field or key can carry it, and `audit_user` stays unset on
  # purpose. The stored `message` still holds it: syslog has no community redaction today.
  #
  # The tail is the request's transport address as SNMPv2-TM's snmpUDPAddress prints it:
  # six octets, the IPv4 address then the port in two bytes (`127.0.0.1.198.53` is
  # 127.0.0.1, port 198*256+53 = 50741). Only the address is read, and only when the last
  # word of the line is exactly six octets: a longer run (an IPv6 transport prints 18) or
  # any other text reads none. A pack pattern cannot use an end anchor (`$` is Vector's
  # interpolation sign), so the alternatives are ordered instead: six octets followed by
  # more of the word first (no address), then six octets (the address), then any word (no
  # address), each tried at the line's last space, so a match never reaches back into the
  # community. The port would need arithmetic a template lacks. One case no reader can
  # tell apart: a community ending in a space and six dotted numbers, with the address
  # missing; ConfD prints the address on every line seen.
  #
  # Security-relevant, not routine: its own category, so it never groups with the poll
  # session records. No rule row: it states nothing about the network, every vEdge sends
  # it every 20 s, and the security evidence class is fed by the platform evaluator on
  # netops.security, not by a syslog row (the trap twin, authenticationFailure, is the
  # same call in coverage_matrix.py). At info nothing alarms, as before this row.
  - id: confd_snmp_auth_failed
    parser_id: standard_mgmt_audit.v1
    literal: ' SNMP authentication failed: PDU discarded: bad community name:'
    apps: [confd]
    pattern: '^audit user: .{1,256}?/\d{1,12} SNMP authentication failed: PDU discarded: bad community name:(?: .{0,256} (?:\d{1,3}(?:\.\d{1,3}){5}[^ \d]|(?P<src>\d{1,3}(?:\.\d{1,3}){3})\.\d{1,3}\.\d{1,3}|[^ ]{0,64}))?'
    event_type: snmp_auth_failed_community
    summary: 'SNMP request refused: unknown community[ from {src}]'
    category: security_audit
    fields:
      title: 'SNMP request refused on {host}: unknown community[ from {src}]'
      correlation_key: 'audit:{device}:snmp_auth_failed'
      audit_action: 'auth_failed'
      audit_source: '{src}'
      audit_via: 'snmp'
    fidelity: lab_validated

  - id: confd_netconf_rpc
    parser_id: standard_mgmt_audit.v1
    literal: 'netconf id='
    apps: [confd]
    pattern: '^netconf id=(?P<sid>\d+) (?P<step>got rpc|get attrs|sending rpc-reply|close-session)(?::\s*\{[^}]{0,128}\}(?P<op>[\w-]{1,64}))?'
    event_type: netconf_rpc
    summary: 'NETCONF {step}[ {op}]'
    category: management_audit
    fields:
      title: 'NETCONF {step} on {host}[: {op}]'
      correlation_key: 'netconf:{device}:{sid}'
      audit_action: 'rpc'
      audit_via: 'netconf'
      session_id: '{sid}'
    fidelity: lab_validated

  # A NETCONF action (live on vEdges, 2026-11-10): `netconf id=N action name={<ns>}<action>
  # instance-identifier=<path>`. One key per action, so repeats of one action group.
  - id: confd_netconf_action
    parser_id: standard_mgmt_audit.v1
    literal: 'netconf id='
    apps: [confd]
    pattern: '^netconf id=(?P<sid>\d+) action name=\{[^}]{0,128}\}(?P<action>[A-Za-z][\w-]{0,63})(?: instance-identifier=(?P<target>\S{1,256}))?'
    event_type: 'netconf_action_{action}'
    summary: 'NETCONF action {action}[ on {target}]'
    category: management_audit
    fields:
      title: 'NETCONF action {action} on {host}'
      correlation_key: 'netconf:{device}:{sid}'
      audit_action: 'action_{action}'
      audit_via: 'netconf'
      session_id: '{sid}'
    fidelity: lab_validated

  - id: confd_netconf_session
    parser_id: standard_mgmt_audit.v1
    literal: 'netconf id='
    apps: [confd]
    # ConfD 20.x quotes the user (`for user "vmanage-admin"`, captured on the lab
    # 2026-11-13, about 11k a day); older releases do not. The quotes are framing,
    # never part of the name, so `audit_user` is the same value either way.
    pattern: '^netconf id=(?P<sid>\d+) new tcp session(?: for user "?(?P<user>[^\s"]{1,64})"?)?(?: from (?P<src>\S{1,64}))?'
    event_type: netconf_session
    summary: 'NETCONF transport session opened[ for {user}][ from {src}]'
    category: management_audit
    fields:
      title: 'NETCONF transport session on {host}[ for {user}][ from {src}]'
      correlation_key: 'netconf:{device}:{sid}'
      audit_user: '{user}'
      audit_action: 'session_created'
      audit_source: '{src}'
      audit_via: 'netconf'
      session_id: '{sid}'
    fidelity: lab_validated

  - id: confd_netconf_notification
    parser_id: standard_mgmt_audit.v1
    literal: 'netconf id='
    apps: [confd]
    pattern: '^netconf id=(?P<sid>\d+) sending notification(?: \{[^}]{0,128}\}(?P<name>[\w-]{1,64}))?'
    event_type: netconf_notification
    summary: 'NETCONF notification sent[ ({name})]'
    category: management_audit
    fields:
      title: 'NETCONF notification sent by {host}[ ({name})]'
      correlation_key: 'netconf:{device}:{sid}'
      audit_action: 'notification'
      audit_via: 'netconf'
      session_id: '{sid}'
    fidelity: lab_validated

  - id: sshd_accepted
    parser_id: standard_mgmt_audit.v1
    literal: 'Accepted '
    apps: [sshd]
    pattern: '^Accepted (?P<method>\S{1,32}) for (?P<user>\S{1,64})(?: from (?P<src>\S{1,64}))?(?: port (?P<port>\d{1,5}))?'
    event_type: ssh_login_accepted
    summary: 'SSH login accepted[ for {user}][ from {src}][ ({method})]'
    category: management_audit
    fields:
      title: 'SSH login accepted on {host}[ for {user}][ from {src}]'
      correlation_key: 'audit:{device}:ssh:{user}'
      audit_user: '{user}'
      audit_action: 'login_accepted'
      audit_source: '{src}[:{port}]'
      audit_via: 'ssh'
    fidelity: lab_validated

  - id: sshd_banner_probe
    parser_id: standard_mgmt_audit.v1
    literal: 'kex_exchange_identification: '
    apps: [sshd]
    pattern: '^error: kex_exchange_identification: (?P<why>\S.{0,96})?'
    event_type: ssh_banner_probe
    summary: 'SSH connection ended before the banner[: {why}]'
    category: management_audit
    fields:
      title: 'SSH connection ended before the banner on {host}'
      correlation_key: 'audit:{device}:ssh_probe'
      audit_action: 'banner_probe'
      audit_via: 'ssh'
    fidelity: lab_validated

  - id: sshd_session
    parser_id: standard_mgmt_audit.v1
    literal: 'pam_unix(sshd:session): session '
    apps: [sshd]
    pattern: 'pam_unix\(sshd:session\): session (?P<state>opened|closed) for (?:user (?P<user>\S{1,64}))?'
    event_type: 'ssh_session_{state}'
    summary: 'SSH session {state}[ for {user}]'
    category: management_audit
    fields:
      title: 'SSH session {state} on {host}[ for {user}]'
      correlation_key: 'audit:{device}:ssh:{user}'
      audit_user: '{user}'
      audit_action: 'session_{state}'
      audit_via: 'ssh'
    fidelity: lab_validated

  # Stock Linux daemons a network OS runs (tracker 387, the last unparsed lab families,
  # 2026-11-11). Seen on the lab's vEdges, but every line below is printed by the upstream
  # program, not by Cisco code, so the rows are neutral and stamp no vendor. None reads a
  # severity: PRI is the line's own. `system_lifecycle` is a start or restart of a part of
  # the OS: a record to keep and group, never an alarm.
  #
  # sysklogd's own start line (`syslogd v2.1.1: restart.`; 1.x prints `syslogd 1.5.0:
  # restart.`). It is logged when the daemon starts and when it re-reads its configuration
  # (SIGHUP), so it is a boot or a logging change on the box, not a fault.
  - id: syslogd_restart
    parser_id: standard_system.v1
    literal: ': restart'
    apps: [syslogd]
    pattern: '^syslogd v?(?P<version>[0-9][0-9A-Za-z.-]{0,31}): restart\.?(?: \((?P<mode>[^)]{1,32})\))?'
    event_type: syslog_daemon_restart
    summary: 'Syslog daemon (re)started, syslogd {version}[ ({mode})]'
    category: system_lifecycle
    fields:
      title: 'Syslog daemon on {host} (re)started (syslogd {version})'
      correlation_key: 'syslogd:{device}'
    fidelity: lab_validated

  # ntpd's event lines, `<address> <status word> <event code> <event>[ <detail>]`, as
  # report_event() in ntp_control.c prints them: the address is 0.0.0.0 for a system event
  # and the peer for a peer event; the status word and the code are hex. The event names
  # are ntpd's own (NTP 4 documentation, "Event Messages and Status Words", decode.html:
  # system codes 05 clock_sync, 08 no_sys_peer, 0c clock_step). The pack's `ntp_event`
  # table puts the common ones in plain words; any other keeps its name.
  #
  # A clock STEP first, with the step as a typed metric (`clock_step_s`, seconds, signed):
  # it moves every timestamp the box writes, so it is what explains a record whose time
  # jumps. No signal, deliberately. The platform measures a device's clock itself: Vector
  # stamps `clock_skew_s` past the tolerance and producers.clock_skew_signal reports it as
  # a management-plane meta-finding that never enters the window, so a wrong clock cannot
  # lend a corroborating plane to a real fault. A step is the device CORRECTING its clock,
  # after which its timestamps can be believed; it arrives at info; the record stays.
  - id: ntpd_clock_step
    parser_id: standard_system.v1
    literal: ' clock_step '
    apps: [ntpd]
    pattern: '^(?P<addr>[0-9A-Fa-f.:]{2,45}) (?P<status>[0-9a-f]{4}) (?P<code>[0-9a-f]{2}) clock_step (?P<step>[+-]?[0-9]{1,9}\.[0-9]{1,9}) s'
    event_type: ntp_clock_step
    summary: 'NTP stepped the clock by {step} s (status {status})'
    category: time_sync
    fields:
      title: 'NTP stepped the clock on {host} by {step} s'
      correlation_key: 'ntp:{device}'
    metrics:
      clock_step_s: step
    fidelity: lab_validated

  - id: ntpd_event
    parser_id: standard_system.v1
    literal: ' '
    apps: [ntpd]
    pattern: '^(?P<addr>[0-9A-Fa-f.:]{2,45}) (?P<status>[0-9a-f]{4}) (?P<code>[0-9a-f]{2}) (?P<event>[A-Za-z][A-Za-z_]{1,31})(?: (?P<detail>\S.{0,127}))?'
    event_type: 'ntp_{event}'
    summary: 'NTP {event|ntp_event}[: {detail}] (status {status})'
    category: time_sync
    fields:
      title: 'NTP on {host} {event|ntp_event}'
      correlation_key: 'ntp:{device}'
    fidelity: lab_validated

  # The kernel's connection-tracking banner at module load (`nf_conntrack version 0.5.0
  # (7168 buckets, 28672 max)`): boot. The table size is a typed metric, because a full
  # conntrack table drops new flows and this line is the only place the box states it.
  - id: kernel_conntrack_init
    parser_id: standard_system.v1
    literal: 'nf_conntrack version '
    apps: [kernel]
    pattern: '^nf_conntrack version (?P<version>[0-9][0-9.]{0,15}) \((?P<buckets>[0-9]{1,10}) buckets, (?P<max>[0-9]{1,12}) max\)'
    event_type: kernel_conntrack_init
    summary: 'Kernel connection tracking started: {buckets} buckets, {max} entries max'
    category: system_lifecycle
    fields:
      title: 'Kernel connection tracking started on {host} ({max} entries max)'
      correlation_key: 'kernel:{device}:conntrack'
    metrics:
      conntrack_buckets: buckets
      conntrack_max: max
    fidelity: lab_validated

  # The kernel's high-resolution timer handler ran late (`hrtimer: interrupt took 4421501
  # ns`). The kernel prints it ONCE per boot (pr_warn_once in kernel/time/hrtimer.c), the
  # first time one handler overruns, which on a virtual machine is a host scheduling hiccup.
  # The delay is a typed metric. The row below keeps it off the generic net.
  - id: kernel_hrtimer_slow
    parser_id: standard_system.v1
    literal: 'hrtimer: interrupt took '
    apps: [kernel]
    pattern: '^hrtimer: interrupt took (?P<ns>[0-9]{1,15}) ns'
    event_type: kernel_hrtimer_slow
    summary: 'Kernel timer interrupt took {ns} ns (first overrun since boot)'
    fields:
      title: 'Kernel timer interrupt ran late on {host} ({ns} ns)'
      correlation_key: 'kernel:{device}:hrtimer'
    metrics:
      hrtimer_interrupt_ns: ns
    fidelity: lab_validated

  # Quagga ospfd discarding a Database Description packet (`Packet[DD]: Neighbor
  # 192.0.2.7 state is 2-Way, packet discarded.`, ospf_packet.c). The address is the
  # neighbour's ROUTER ID, not an interface address. Any neighbour state parses; only
  # 2-Way is kept off the net by the row below, because RFC 2328 §10.6 says a DD packet
  # received in 2-Way is ignored by design (two DROthers never form an adjacency).
  - id: ospfd_dd_discarded
    parser_id: standard_system.v1
    literal: 'Packet[DD]: Neighbor '
    apps: [ospf, ospfd]
    pattern: '^Packet\[DD\]: Neighbor (?P<nbr>[0-9A-Fa-f.:]{2,45}) state is (?P<state>[A-Za-z0-9-]{1,16}), packet discarded'
    event_type: ospf_dd_discarded
    summary: 'OSPF ignored a Database Description packet from neighbour {nbr} (state {state})'
    fields:
      title: 'OSPF ignored a DD packet from neighbour {nbr} on {host} (state {state})'
      correlation_key: 'ospf:{device}:{nbr}'
    fidelity: lab_validated

rules:
  # Real PRI makes this line err (`<35>`, auth.err), and it repeats on every vEdge sampled:
  # 7 lines from 3 devices in 300 s of lab capture (2026-11-09). A TCP peer connected to
  # :22 and hung up before the SSH banner, which is what a port probe or a load balancer's
  # health check looks like. It says nothing about the device. The grammar above files it
  # as a management record; this row keeps it off the generic net. The text shape is the
  # whole guard, so any other sshd error still reaches the net.
  - rule_id: syslog.standard.sshd_banner_probe
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [any]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: a TCP peer closed before the SSH banner (port probe or health check); no device state in the text
    pattern_src: '^error: kex_exchange_identification: '
    guard: {re: [msg, '^error: kex_exchange_identification: ', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|sshd_banner_probe|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # The kernel arrives at warning with this line, so the generic net made a device alarm of
  # it: once per boot, from a VM's host scheduling. It says nothing about the network, and
  # it is not a recurring condition the engine could watch (pr_warn_once). The guard is the
  # whole text shape and the kernel tag, so any other kernel warning still reaches the net.
  - rule_id: syslog.standard.kernel_hrtimer_slow
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [any]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: the kernel's once-per-boot note that one timer interrupt ran late; no network or device fault in the text
    pattern_src: '^hrtimer: interrupt took \d{1,15} ns'
    guard:
      all:
        - {equals_any: [tag, [KERNEL]]}
        - {re: [msg, '^hrtimer: interrupt took \d{1,15} ns', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

  # Quagga ospfd logs a DD packet it ignores in 2-Way at warning (the vEdge's `OSPF` app).
  # RFC 2328 §10.6: "If the neighbor state is 2-Way: The packet should be ignored." Two
  # DROther routers on one segment stay in 2-Way by design, and the line repeats while a
  # neighbour still offers a DD during a DR/BDR change. A lost adjacency reaches the engine
  # through the adjacency rows; this line would only add a below-floor alarm per packet.
  # A neighbour stuck in 2-Way that SHOULD be adjacent (a priority or network-type
  # mismatch) makes this line steady: `corr_parser_known_benign_total` shows the rate, and
  # every record stays stored. Only 2-Way: a DD discarded in Init, Down or Attempt still
  # reaches the net.
  - rule_id: syslog.standard.ospf_dd_two_way
    lane: syslog
    source: syslog
    kind: device_alarm
    entity_type: device
    family: null
    vendors: [any]
    fidelity_status: lab_validated
    known_benign: true
    benign_reason: an OSPF Database Description packet ignored in 2-Way, as RFC 2328 section 10.6 requires; no adjacency change in the text
    pattern_src: '^Packet\[DD\]: Neighbor \S{1,45} state is 2-Way, packet discarded'
    guard:
      all:
        - {equals_any: [tag, [OSPF, OSPFD]]}
        - {re: [msg, '^Packet\[DD\]: Neighbor \S{1,45} state is 2-Way, packet discarded', '']}
    severity: warn
    emit:
      metric: device_alarm
      modality: control_plane
      entity: {type: device, id: '{host}'}
      native_id: '{host}|benign|{ts_ms}'
      tokens: [{t: '{host}'}]
      attrs: {}

