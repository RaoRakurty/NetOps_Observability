---
# =============================================================================
# Global variables — apply to every device in the topology
# =============================================================================
# Change these values to re-IP, re-AS, or re-key the entire fabric. Every
# template references them through the role/host_vars hierarchy.
# =============================================================================

# ---- Service-provider AS (the MPLS core) ------------------------------------
sp_as:                65000

# ---- ISIS core parameters ---------------------------------------------------
isis:
  area_id:            "49.0001"
  level:              level-2          # flat L2-only ISIS core
  metric_style:       wide
  ref_bandwidth:      400000           # in Mbps, used for auto-cost
  hello_interval:     10
  hello_multiplier:   3
  authentication:
    enabled:          true
    key:              "isis-core-key"
    type:             message-digest

# ---- LDP (label distribution) ----------------------------------------------
ldp:
  enabled:            true
  hello_timeout:      15
  keepalive_timeout:  45
  graceful_restart:   true

# ---- MP-iBGP (Route Reflector design) --------------------------------------
bgp:
  router_reflectors:
    - { name: rr1, loopback: 10.0.0.31 }
    - { name: rr2, loopback: 10.0.0.32 }
  cluster_id:         1.1.1.1
  address_families:
    - vpn-ipv4
    - vpn-ipv6
  graceful_restart:   true
  bfd:                true

# ---- VRF / VPRN service definitions ----------------------------------------
# Each entry creates a VPRN service on every PE that lists the VRF. RT/RD
# values follow the ASN:nn convention so adding a new VRF is a one-line job.
vrfs:
  - name:             VRF-A
    service_id:       100
    rd:               "65000:100"
    rt_import:        "target:65000:100"
    rt_export:        "target:65000:100"
    description:      "Customer-A — full mesh"
  - name:             VRF-B
    service_id:       200
    rd:               "65000:200"
    rt_import:        "target:65000:200"
    rt_export:        "target:65000:200"
    description:      "Customer-B — full mesh"
  - name:             VRF-C
    service_id:       300
    rd:               "65000:300"
    rt_import:        "target:65000:300"
    rt_export:        "target:65000:300"
    description:      "Customer-C — full mesh"

# ---- Telemetry --------------------------------------------------------------
# Enables gNMI/gRPC streaming, SNMPv2c polling and remote syslog on every
# device.  Set `telemetry.enabled: false` to disable everywhere, or override
# any sub-key in a role's group_vars / per-host vars to opt out selectively.
telemetry:
  enabled:          true

  # ---- gRPC + gNMI dial-in (collectors connect TO the router) -------------
  grpc:
    enabled:        true
    port:           57400
    allow_unsecure: true                 # set false in production + add TLS cert
    services:
      - gnmi
      - md-cli                           # CLI-over-gRPC (handy for automation)

  # ---- Dial-out streaming subscriptions (router pushes TO collector) ------
  streaming:
    enabled:        true
    collector_ip:   192.0.2.10           # change to your Telegraf / gNMIc IP
    collector_port: 57400
    sample_interval_ms: 10000
    sensor_paths:
      - "/state/system"
      - "/state/router[router-name=Base]/interface"
      - "/state/router[router-name=Base]/bgp"
      - "/state/router[router-name=Base]/isis"
      - "/state/router[router-name=Base]/ldp"
      - "/state/router[router-name=Base]/mpls"
      - "/state/service/vprn"            # per-VRF state — useful on PEs

  # ---- SNMP v2c (classic polling for NMS like LibreNMS / Zabbix) ----------
  snmp:
    enabled:        true
    community_ro:   "ro-public"
    contact:        "noc@example.com"
    location:       "Lab"
    trap_targets:
      - { ip: 192.0.2.20, port: 162, community: "ro-public" }

  # ---- Remote syslog ------------------------------------------------------
  syslog:
    enabled:        true
    servers:
      - { ip: 192.0.2.30, port: 514, level: info }

# ---- Output directory for rendered configs ---------------------------------
build_dir:            "{{ playbook_dir }}/../output"
