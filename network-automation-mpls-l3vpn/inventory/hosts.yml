---
# =============================================================================
# Inventory: MPLS L3VPN Service-Provider Topology (Nokia SR-OS)
# =============================================================================
#   8 P routers (flat ISIS L2 core, LDP for label distribution)
#   4 PE routers (PE1/PE2 left, PE3/PE4 right)
#   2 RR  routers (Route Reflectors for MP-iBGP VPNv4/VPNv6)
#   2 CE  routers (CE1 multihomed to PE1/PE2, CE2 multihomed to PE3/PE4)
# -----------------------------------------------------------------------------
# Adding / removing a router only requires editing this file and adding a
# matching host_vars/<device>.yml entry. Templates and playbooks are role-driven.
# =============================================================================

all:
  children:

    sp_network:
      children:
        p_routers:
          hosts:
            p1: { ansible_host: 172.20.20.11 }
            p2: { ansible_host: 172.20.20.12 }
            p3: { ansible_host: 172.20.20.13 }
            p4: { ansible_host: 172.20.20.14 }
            p5: { ansible_host: 172.20.20.15 }
            p6: { ansible_host: 172.20.20.16 }
            p7: { ansible_host: 172.20.20.17 }
            p8: { ansible_host: 172.20.20.18 }

        pe_routers:
          hosts:
            pe1: { ansible_host: 172.20.20.21 }
            pe2: { ansible_host: 172.20.20.22 }
            pe3: { ansible_host: 172.20.20.23 }
            pe4: { ansible_host: 172.20.20.24 }

        rr_routers:
          hosts:
            rr1: { ansible_host: 172.20.20.31 }
            rr2: { ansible_host: 172.20.20.32 }

    customer_network:
      children:
        ce_routers:
          hosts:
            ce1: { ansible_host: 172.20.20.41 }
            ce2: { ansible_host: 172.20.20.42 }

  vars:
    ansible_connection: network_cli
    ansible_network_os: nokia.sros.classic
    ansible_user: admin
    ansible_password: admin
