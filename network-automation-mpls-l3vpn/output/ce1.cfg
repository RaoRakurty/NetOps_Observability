echo "Configuring CE1"

configure
    system
        name "CE1"
    exit
exit all
configure


    port 1/1/1
        ethernet
            mode access
            encap-type dot1q
            mtu 9212
        exit
        no shutdown
    exit
    port 1/1/2
        ethernet
            mode access
            encap-type dot1q
            mtu 9212
        exit
        no shutdown
    exit
exit all
configure
    router
        autonomous-system 65001
        router-id 10.0.0.41
        interface "system"
            address 10.0.0.41/32
        exit
    exit
exit all

configure
    service
        vprn 100 customer 1 create
            description "CE1-VRF-A"
            router-id 10.0.0.41
            interface "lo-VRF-A" create
                address 172.16.1.1/32
                loopback
            exit
            interface "TO-PE1-VRFA" create
                address 192.168.11.2/30
                sap 1/1/1:100 create
                    description "TO-PE1-VRFA"
                exit
            exit
            interface "TO-PE2-VRFA" create
                address 192.168.21.2/30
                sap 1/1/2:100 create
                    description "TO-PE2-VRFA"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65001
                    neighbor 192.168.11.1
                        peer-as 65000
                        description "EBGP-TO-PE1-VRFA"
                        type external
                        family ipv4
                        export "EXPORT-VRF-A"
                    exit
                    neighbor 192.168.21.1
                        peer-as 65000
                        description "EBGP-TO-PE2-VRFA"
                        type external
                        family ipv4
                        export "EXPORT-VRF-A"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
        vprn 200 customer 1 create
            description "CE1-VRF-B"
            router-id 10.0.0.41
            interface "lo-VRF-B" create
                address 172.16.2.1/32
                loopback
            exit
            interface "TO-PE1-VRFB" create
                address 192.168.12.2/30
                sap 1/1/1:200 create
                    description "TO-PE1-VRFB"
                exit
            exit
            interface "TO-PE2-VRFB" create
                address 192.168.22.2/30
                sap 1/1/2:200 create
                    description "TO-PE2-VRFB"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65001
                    neighbor 192.168.12.1
                        peer-as 65000
                        description "EBGP-TO-PE1-VRFB"
                        type external
                        family ipv4
                        export "EXPORT-VRF-B"
                    exit
                    neighbor 192.168.22.1
                        peer-as 65000
                        description "EBGP-TO-PE2-VRFB"
                        type external
                        family ipv4
                        export "EXPORT-VRF-B"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
        vprn 300 customer 1 create
            description "CE1-VRF-C"
            router-id 10.0.0.41
            interface "lo-VRF-C" create
                address 172.16.3.1/32
                loopback
            exit
            interface "TO-PE1-VRFC" create
                address 192.168.13.2/30
                sap 1/1/1:300 create
                    description "TO-PE1-VRFC"
                exit
            exit
            interface "TO-PE2-VRFC" create
                address 192.168.23.2/30
                sap 1/1/2:300 create
                    description "TO-PE2-VRFC"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65001
                    neighbor 192.168.13.1
                        peer-as 65000
                        description "EBGP-TO-PE1-VRFC"
                        type external
                        family ipv4
                        export "EXPORT-VRF-C"
                    exit
                    neighbor 192.168.23.1
                        peer-as 65000
                        description "EBGP-TO-PE2-VRFC"
                        type external
                        family ipv4
                        export "EXPORT-VRF-C"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    router
        policy-options
            begin
            prefix-list "PL-VRF-A"
                prefix 172.16.1.1/32 exact
            exit
            policy-statement "EXPORT-VRF-A"
                entry 10
                    from
                        prefix-list "PL-VRF-A"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            prefix-list "PL-VRF-B"
                prefix 172.16.2.1/32 exact
            exit
            policy-statement "EXPORT-VRF-B"
                entry 10
                    from
                        prefix-list "PL-VRF-B"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            prefix-list "PL-VRF-C"
                prefix 172.16.3.1/32 exact
            exit
            policy-statement "EXPORT-VRF-C"
                entry 10
                    from
                        prefix-list "PL-VRF-C"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            commit
        exit
    exit
exit all

configure
    system
        grpc
            port 57400
            allow-unsecure-connection
            gnmi
                no shutdown
            exit
            md-cli
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    system
        telemetry
            destination-group "COLLECTOR" create
                destination 192.0.2.10 port 57400 create
                exit
            exit
            sensor-groups
                sensor-group "FABRIC-METRICS" create
                    sensor "/state/system" create
                    exit
                    sensor "/state/router[router-name=Base]/interface" create
                    exit
                    sensor "/state/router[router-name=Base]/bgp" create
                    exit
                    sensor "/state/router[router-name=Base]/isis" create
                    exit
                    sensor "/state/router[router-name=Base]/ldp" create
                    exit
                    sensor "/state/router[router-name=Base]/mpls" create
                    exit
                    sensor "/state/service/vprn" create
                    exit
                exit
            exit
            persistent-subscriptions
                subscription "SUB-CE1" create
                    sensor-group "FABRIC-METRICS"
                    destination-group "COLLECTOR"
                    local-source-address 10.0.0.41
                    mode sample
                    sample-interval 10000
                    encoding json-ietf
                    no shutdown
                exit
            exit
        exit
    exit
exit all

configure
    system
        snmp
            no shutdown
        exit
        security
            snmp
                community "ro-public" rwa version v2c
            exit
        exit
        contact "noc@example.com"
        location "Lab"
    exit

    log
        snmp-trap-group 1 create
            description "SNMP trap target 1"
            trap-target "TRAP-1" address 192.0.2.20 port 162 snmpv2c notify-community "ro-public"
        exit
    exit
exit all

configure
    log
        syslog 1 create
            description "Remote syslog target 1"
            address 192.0.2.30
            port 514
            level info
        exit
        log-id 101 create
            from main security change
            to syslog 1
            no shutdown
        exit
    exit
exit all


admin save