echo "Configuring CE2"

configure
    system
        name "CE2"
    exit
exit all
configure


    port 1/1/1
        ethernet
            mode access
            encap-type dot1q
            mtu 9212
        exit
        no shutdown
    exit
    port 1/1/2
        ethernet
            mode access
            encap-type dot1q
            mtu 9212
        exit
        no shutdown
    exit
exit all
configure
    router
        autonomous-system 65002
        router-id 10.0.0.42
        interface "system"
            address 10.0.0.42/32
        exit
    exit
exit all

configure
    service
        vprn 100 customer 1 create
            description "CE2-VRF-A"
            router-id 10.0.0.42
            interface "lo-VRF-A" create
                address 172.17.1.1/32
                loopback
            exit
            interface "TO-PE3-VRFA" create
                address 192.168.31.2/30
                sap 1/1/1:100 create
                    description "TO-PE3-VRFA"
                exit
            exit
            interface "TO-PE4-VRFA" create
                address 192.168.41.2/30
                sap 1/1/2:100 create
                    description "TO-PE4-VRFA"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65002
                    neighbor 192.168.31.1
                        peer-as 65000
                        description "EBGP-TO-PE3-VRFA"
                        type external
                        family ipv4
                        export "EXPORT-VRF-A"
                    exit
                    neighbor 192.168.41.1
                        peer-as 65000
                        description "EBGP-TO-PE4-VRFA"
                        type external
                        family ipv4
                        export "EXPORT-VRF-A"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
        vprn 200 customer 1 create
            description "CE2-VRF-B"
            router-id 10.0.0.42
            interface "lo-VRF-B" create
                address 172.17.2.1/32
                loopback
            exit
            interface "TO-PE3-VRFB" create
                address 192.168.32.2/30
                sap 1/1/1:200 create
                    description "TO-PE3-VRFB"
                exit
            exit
            interface "TO-PE4-VRFB" create
                address 192.168.42.2/30
                sap 1/1/2:200 create
                    description "TO-PE4-VRFB"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65002
                    neighbor 192.168.32.1
                        peer-as 65000
                        description "EBGP-TO-PE3-VRFB"
                        type external
                        family ipv4
                        export "EXPORT-VRF-B"
                    exit
                    neighbor 192.168.42.1
                        peer-as 65000
                        description "EBGP-TO-PE4-VRFB"
                        type external
                        family ipv4
                        export "EXPORT-VRF-B"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
        vprn 300 customer 1 create
            description "CE2-VRF-C"
            router-id 10.0.0.42
            interface "lo-VRF-C" create
                address 172.17.3.1/32
                loopback
            exit
            interface "TO-PE3-VRFC" create
                address 192.168.33.2/30
                sap 1/1/1:300 create
                    description "TO-PE3-VRFC"
                exit
            exit
            interface "TO-PE4-VRFC" create
                address 192.168.43.2/30
                sap 1/1/2:300 create
                    description "TO-PE4-VRFC"
                exit
            exit
            bgp
                family ipv4
                group "TO-PE"
                    local-as 65002
                    neighbor 192.168.33.1
                        peer-as 65000
                        description "EBGP-TO-PE3-VRFC"
                        type external
                        family ipv4
                        export "EXPORT-VRF-C"
                    exit
                    neighbor 192.168.43.1
                        peer-as 65000
                        description "EBGP-TO-PE4-VRFC"
                        type external
                        family ipv4
                        export "EXPORT-VRF-C"
                    exit
                exit
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    router
        policy-options
            begin
            prefix-list "PL-VRF-A"
                prefix 172.17.1.1/32 exact
            exit
            policy-statement "EXPORT-VRF-A"
                entry 10
                    from
                        prefix-list "PL-VRF-A"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            prefix-list "PL-VRF-B"
                prefix 172.17.2.1/32 exact
            exit
            policy-statement "EXPORT-VRF-B"
                entry 10
                    from
                        prefix-list "PL-VRF-B"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            prefix-list "PL-VRF-C"
                prefix 172.17.3.1/32 exact
            exit
            policy-statement "EXPORT-VRF-C"
                entry 10
                    from
                        prefix-list "PL-VRF-C"
                    exit
                    action accept
                    exit
                exit
                default-action reject
                exit
            exit
            commit
        exit
    exit
exit all
admin save