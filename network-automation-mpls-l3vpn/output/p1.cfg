echo "Configuring P1"

configure
    system
        name "P1"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit
    port 1/1/2
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit
    port 1/1/3
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit


exit all
configure
    router
        interface "system"
            address 10.0.0.1/32
            no shutdown
        exit
        interface "TO-P2"
            address 10.1.1.0/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
        interface "TO-P5"
            address 10.1.2.0/31
            port   1/1/2
            mtu    9000
            no shutdown
        exit
        interface "TO-PE1"
            address 10.2.1.1/31
            port   1/1/3
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0001.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P2"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            interface "TO-P5"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            interface "TO-PE1"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P2"
                no shutdown
            exit
            interface "TO-P5"
                no shutdown
            exit
            interface "TO-PE1"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P2"
                    no shutdown
                exit
                interface "TO-P5"
                    no shutdown
                exit
                interface "TO-PE1"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all

configure
    system
        grpc
            port 57400
            allow-unsecure-connection
            gnmi
                no shutdown
            exit
            md-cli
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    system
        telemetry
            destination-group "COLLECTOR" create
                destination 192.0.2.10 port 57400 create
                exit
            exit
            sensor-groups
                sensor-group "FABRIC-METRICS" create
                    sensor "/state/system" create
                    exit
                    sensor "/state/router[router-name=Base]/interface" create
                    exit
                    sensor "/state/router[router-name=Base]/bgp" create
                    exit
                    sensor "/state/router[router-name=Base]/isis" create
                    exit
                    sensor "/state/router[router-name=Base]/ldp" create
                    exit
                    sensor "/state/router[router-name=Base]/mpls" create
                    exit
                    sensor "/state/service/vprn" create
                    exit
                exit
            exit
            persistent-subscriptions
                subscription "SUB-P1" create
                    sensor-group "FABRIC-METRICS"
                    destination-group "COLLECTOR"
                    local-source-address 10.0.0.1
                    mode sample
                    sample-interval 10000
                    encoding json-ietf
                    no shutdown
                exit
            exit
        exit
    exit
exit all

configure
    system
        snmp
            no shutdown
        exit
        security
            snmp
                community "ro-public" rwa version v2c
            exit
        exit
        contact "noc@example.com"
        location "Lab"
    exit

    log
        snmp-trap-group 1 create
            description "SNMP trap target 1"
            trap-target "TRAP-1" address 192.0.2.20 port 162 snmpv2c notify-community "ro-public"
        exit
    exit
exit all

configure
    log
        syslog 1 create
            description "Remote syslog target 1"
            address 192.0.2.30
            port 514
            level info
        exit
        log-id 101 create
            from main security change
            to syslog 1
            no shutdown
        exit
    exit
exit all


admin save