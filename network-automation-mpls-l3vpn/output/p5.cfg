echo "Configuring P5"

configure
    system
        name "P5"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit
    port 1/1/2
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit
    port 1/1/3
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit


exit all
configure
    router
        interface "system"
            address 10.0.0.5/32
            no shutdown
        exit
        interface "TO-P1"
            address 10.1.2.1/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
        interface "TO-P6"
            address 10.1.1.6/31
            port   1/1/2
            mtu    9000
            no shutdown
        exit
        interface "TO-PE2"
            address 10.2.1.3/31
            port   1/1/3
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0005.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P1"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            interface "TO-P6"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            interface "TO-PE2"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P1"
                no shutdown
            exit
            interface "TO-P6"
                no shutdown
            exit
            interface "TO-PE2"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P1"
                    no shutdown
                exit
                interface "TO-P6"
                    no shutdown
                exit
                interface "TO-PE2"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all
admin save