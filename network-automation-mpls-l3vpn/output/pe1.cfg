echo "Configuring PE1"

configure
    system
        name "PE1"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit

    port 1/1/2
        ethernet
            mode hybrid
            encap-type dot1q
            mtu  9212
        exit
        no shutdown
    exit

exit all
configure
    router
        interface "system"
            address 10.0.0.21/32
            no shutdown
        exit
        interface "TO-P1"
            address 10.2.1.0/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0021.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P1"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P1"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P1"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all
configure
    router
        autonomous-system 65000
        router-id 10.0.0.21
        bgp
            connect-retry 10
            min-route-advertisement 1
            rapid-withdrawal
            family vpn-ipv4 vpn-ipv6
            group "RR"
                type internal
                local-address 10.0.0.21
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                bfd-enable
                graceful-restart
                neighbor 10.0.0.31
                    description "TO-RR1"
                exit
                neighbor 10.0.0.32
                    description "TO-RR2"
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    service
        vprn 100 customer 1 create
            description "Customer-A — full mesh"
            route-distinguisher 65000:100
            vrf-target export target:65000:100 import target:65000:100
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE1-VRFA" create
                address 192.168.11.1/30
                sap 1/1/2:100 create
                    description "CE1-VRF-A"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.11.2
                        peer-as 65001
                        description "EBGP-CE-VRF-A"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
        vprn 200 customer 1 create
            description "Customer-B — full mesh"
            route-distinguisher 65000:200
            vrf-target export target:65000:200 import target:65000:200
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE1-VRFB" create
                address 192.168.12.1/30
                sap 1/1/2:200 create
                    description "CE1-VRF-B"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.12.2
                        peer-as 65001
                        description "EBGP-CE-VRF-B"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
        vprn 300 customer 1 create
            description "Customer-C — full mesh"
            route-distinguisher 65000:300
            vrf-target export target:65000:300 import target:65000:300
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE1-VRFC" create
                address 192.168.13.1/30
                sap 1/1/2:300 create
                    description "CE1-VRF-C"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.13.2
                        peer-as 65001
                        description "EBGP-CE-VRF-C"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
    exit
exit all

configure
    system
        grpc
            port 57400
            allow-unsecure-connection
            gnmi
                no shutdown
            exit
            md-cli
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    system
        telemetry
            destination-group "COLLECTOR" create
                destination 192.0.2.10 port 57400 create
                exit
            exit
            sensor-groups
                sensor-group "FABRIC-METRICS" create
                    sensor "/state/system" create
                    exit
                    sensor "/state/router[router-name=Base]/interface" create
                    exit
                    sensor "/state/router[router-name=Base]/bgp" create
                    exit
                    sensor "/state/router[router-name=Base]/isis" create
                    exit
                    sensor "/state/router[router-name=Base]/ldp" create
                    exit
                    sensor "/state/router[router-name=Base]/mpls" create
                    exit
                    sensor "/state/service/vprn" create
                    exit
                exit
            exit
            persistent-subscriptions
                subscription "SUB-PE1" create
                    sensor-group "FABRIC-METRICS"
                    destination-group "COLLECTOR"
                    local-source-address 10.0.0.21
                    mode sample
                    sample-interval 10000
                    encoding json-ietf
                    no shutdown
                exit
            exit
        exit
    exit
exit all

configure
    system
        snmp
            no shutdown
        exit
        security
            snmp
                community "ro-public" rwa version v2c
            exit
        exit
        contact "noc@example.com"
        location "Lab"
    exit

    log
        snmp-trap-group 1 create
            description "SNMP trap target 1"
            trap-target "TRAP-1" address 192.0.2.20 port 162 snmpv2c notify-community "ro-public"
        exit
    exit
exit all

configure
    log
        syslog 1 create
            description "Remote syslog target 1"
            address 192.0.2.30
            port 514
            level info
        exit
        log-id 101 create
            from main security change
            to syslog 1
            no shutdown
        exit
    exit
exit all


admin save