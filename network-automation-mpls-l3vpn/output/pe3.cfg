echo "Configuring PE3"

configure
    system
        name "PE3"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit

    port 1/1/2
        ethernet
            mode hybrid
            encap-type dot1q
            mtu  9212
        exit
        no shutdown
    exit

exit all
configure
    router
        interface "system"
            address 10.0.0.23/32
            no shutdown
        exit
        interface "TO-P4"
            address 10.2.1.4/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0023.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P4"
                interface-type point-to-point
                level 2
                    metric 10
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P4"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P4"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all
configure
    router
        autonomous-system 65000
        router-id 10.0.0.23
        bgp
            connect-retry 10
            min-route-advertisement 1
            rapid-withdrawal
            family vpn-ipv4 vpn-ipv6
            group "RR"
                type internal
                local-address 10.0.0.23
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                bfd-enable
                graceful-restart
                neighbor 10.0.0.31
                    description "TO-RR1"
                exit
                neighbor 10.0.0.32
                    description "TO-RR2"
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    service
        vprn 100 customer 1 create
            description "Customer-A — full mesh"
            route-distinguisher 65000:100
            vrf-target export target:65000:100 import target:65000:100
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE2-VRFA" create
                address 192.168.31.1/30
                sap 1/1/2:100 create
                    description "CE2-VRF-A"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.31.2
                        peer-as 65002
                        description "EBGP-CE-VRF-A"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
        vprn 200 customer 1 create
            description "Customer-B — full mesh"
            route-distinguisher 65000:200
            vrf-target export target:65000:200 import target:65000:200
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE2-VRFB" create
                address 192.168.32.1/30
                sap 1/1/2:200 create
                    description "CE2-VRF-B"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.32.2
                        peer-as 65002
                        description "EBGP-CE-VRF-B"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
        vprn 300 customer 1 create
            description "Customer-C — full mesh"
            route-distinguisher 65000:300
            vrf-target export target:65000:300 import target:65000:300
            auto-bind-tunnel
                resolution any
            exit

            interface "TO-CE2-VRFC" create
                address 192.168.33.1/30
                sap 1/1/2:300 create
                    description "CE2-VRF-C"
                exit
            exit

            bgp
                family ipv4
                group "CE"
                    local-as 65000
                    neighbor 192.168.33.2
                        peer-as 65002
                        description "EBGP-CE-VRF-C"
                        type external
                        family ipv4
                    exit
                exit
                no shutdown
            exit

            no shutdown
        exit
    exit
exit all
admin save