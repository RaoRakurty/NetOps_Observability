echo "Configuring RR1"

configure
    system
        name "RR1"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit


exit all
configure
    router
        interface "system"
            address 10.0.0.31/32
            no shutdown
        exit
        interface "TO-P2"
            address 10.3.1.0/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0031.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P2"
                interface-type point-to-point
                level 2
                    metric 100
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P2"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P2"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all
configure
    router
        autonomous-system 65000
        router-id 10.0.0.31
        bgp
            cluster 1.1.1.1
            connect-retry 10
            min-route-advertisement 1
            rapid-withdrawal
            family vpn-ipv4 vpn-ipv6

            group "PE-CLIENTS"
                type internal
                local-address 10.0.0.31
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                cluster 1.1.1.1
                bfd-enable
                neighbor 10.0.0.21
                    description "RRC-PE1"
                exit
                neighbor 10.0.0.22
                    description "RRC-PE2"
                exit
                neighbor 10.0.0.23
                    description "RRC-PE3"
                exit
                neighbor 10.0.0.24
                    description "RRC-PE4"
                exit
            exit

            group "RR-MESH"
                type internal
                local-address 10.0.0.31
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                neighbor 10.0.0.32
                    description "TO-RR2"
                exit
            exit
            no shutdown
        exit
    exit
exit all
admin save