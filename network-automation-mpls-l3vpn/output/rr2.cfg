echo "Configuring RR2"

configure
    system
        name "RR2"
    exit
exit all
configure
    port 1/1/1
        ethernet
            mode network
            mtu  9000
        exit
        no shutdown
    exit


exit all
configure
    router
        interface "system"
            address 10.0.0.32/32
            no shutdown
        exit
        interface "TO-P7"
            address 10.3.1.2/31
            port   1/1/1
            mtu    9000
            no shutdown
        exit
    exit
exit all
configure
    router
        isis
            area-id 49.0001
            level-capability level-2
            net 49.0001.0000.0000.0032.00
            level 2
                wide-metrics-only
            exit
            authentication-key "isis-core-key"
            authentication-type message-digest
            traffic-engineering
            interface "system"
                passive
            exit
            interface "TO-P7"
                interface-type point-to-point
                level 2
                    metric 100
                    hello-interval 10
                    hello-multiplier 3
                exit
            exit
            no shutdown
        exit
    exit
exit all
configure
    router
        mpls
            interface "TO-P7"
                no shutdown
            exit
            no shutdown
        exit

        ldp
            tcp-session-parameters
            exit
            interface-parameters
                hello-timeout 15
                keepalive-timeout 45
                interface "TO-P7"
                    no shutdown
                exit
            exit
            graceful-restart
            no shutdown
        exit
    exit
exit all
configure
    router
        autonomous-system 65000
        router-id 10.0.0.32
        bgp
            cluster 1.1.1.1
            connect-retry 10
            min-route-advertisement 1
            rapid-withdrawal
            family vpn-ipv4 vpn-ipv6

            group "PE-CLIENTS"
                type internal
                local-address 10.0.0.32
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                cluster 1.1.1.1
                bfd-enable
                neighbor 10.0.0.21
                    description "RRC-PE1"
                exit
                neighbor 10.0.0.22
                    description "RRC-PE2"
                exit
                neighbor 10.0.0.23
                    description "RRC-PE3"
                exit
                neighbor 10.0.0.24
                    description "RRC-PE4"
                exit
            exit

            group "RR-MESH"
                type internal
                local-address 10.0.0.32
                peer-as 65000
                family vpn-ipv4 vpn-ipv6
                neighbor 10.0.0.31
                    description "TO-RR1"
                exit
            exit
            no shutdown
        exit
    exit
exit all

configure
    system
        grpc
            port 57400
            allow-unsecure-connection
            gnmi
                no shutdown
            exit
            md-cli
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all

configure
    system
        telemetry
            destination-group "COLLECTOR" create
                destination 192.0.2.10 port 57400 create
                exit
            exit
            sensor-groups
                sensor-group "FABRIC-METRICS" create
                    sensor "/state/system" create
                    exit
                    sensor "/state/router[router-name=Base]/interface" create
                    exit
                    sensor "/state/router[router-name=Base]/bgp" create
                    exit
                    sensor "/state/router[router-name=Base]/isis" create
                    exit
                    sensor "/state/router[router-name=Base]/ldp" create
                    exit
                    sensor "/state/router[router-name=Base]/mpls" create
                    exit
                    sensor "/state/service/vprn" create
                    exit
                exit
            exit
            persistent-subscriptions
                subscription "SUB-RR2" create
                    sensor-group "FABRIC-METRICS"
                    destination-group "COLLECTOR"
                    local-source-address 10.0.0.32
                    mode sample
                    sample-interval 10000
                    encoding json-ietf
                    no shutdown
                exit
            exit
        exit
    exit
exit all

configure
    system
        snmp
            no shutdown
        exit
        security
            snmp
                community "ro-public" rwa version v2c
            exit
        exit
        contact "noc@example.com"
        location "Lab"
    exit

    log
        snmp-trap-group 1 create
            description "SNMP trap target 1"
            trap-target "TRAP-1" address 192.0.2.20 port 162 snmpv2c notify-community "ro-public"
        exit
    exit
exit all

configure
    log
        syslog 1 create
            description "Remote syslog target 1"
            address 192.0.2.30
            port 514
            level info
        exit
        log-id 101 create
            from main security change
            to syslog 1
            no shutdown
        exit
    exit
exit all


admin save