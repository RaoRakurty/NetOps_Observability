---
- name: "Render config for {{ inventory_hostname }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/ce_router.j2"
    dest: "{{ build_dir }}/{{ inventory_hostname }}.cfg"
  delegate_to: localhost
  become: false
  tags: [render, ce]

- name: "Push config to {{ inventory_hostname }}"
  nokia.sros.config:
    src: "{{ build_dir }}/{{ inventory_hostname }}.cfg"
  when: deploy | default(false) | bool
  tags: [deploy, ce]
