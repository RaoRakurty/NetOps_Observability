---
# Render and (optionally) deploy the P-router config
- name: "Render config for {{ inventory_hostname }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/p_router.j2"
    dest: "{{ build_dir }}/{{ inventory_hostname }}.cfg"
  delegate_to: localhost
  become: false
  tags: [render, p]

- name: "Push config to {{ inventory_hostname }}"
  nokia.sros.config:
    src: "{{ build_dir }}/{{ inventory_hostname }}.cfg"
  when: deploy | default(false) | bool
  tags: [deploy, p]
